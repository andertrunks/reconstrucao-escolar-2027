<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">Cadeia de monitoramento e revisão</title><desc id="d">Cinco estados sucessivos: registrar, receber e validar, avaliar, investigar e decidir. Um alerta inicia análise, não determina automaticamente que o modelo deve ser substituído.</desc><rect width="100%" height="100%" fill="white"/><text x="28" y="32" font-size="19" font-family="Arial, sans-serif">Estados separados: qualidade, desempenho, investigação, decisão</text><rect x="22" y="87" width="150" height="90" rx="4" fill="#f4f4f4" stroke="black"/><text x="34" y="115" font-size="14" font-weight="bold" font-family="Arial, sans-serif">A: registrar</text><text x="34" y="140" font-size="12" font-family="Arial, sans-serif">previsão imutável</text><path d="M 172 131 H 194" stroke="black"/><path d="M 187 126 l 6 5 l -6 5" stroke="black" fill="none"/><rect x="196" y="87" width="150" height="90" rx="4" fill="#f4f4f4" stroke="black"/><text x="208" y="115" font-size="14" font-weight="bold" font-family="Arial, sans-serif">B: receber</text><text x="208" y="140" font-size="12" font-family="Arial, sans-serif">observar e validar</text><path d="M 346 131 H 368" stroke="black"/><path d="M 361 126 l 6 5 l -6 5" stroke="black" fill="none"/><rect x="370" y="87" width="150" height="90" rx="4" fill="#f4f4f4" stroke="black"/><text x="382" y="115" font-size="14" font-weight="bold" font-family="Arial, sans-serif">C: avaliar</text><text x="382" y="140" font-size="12" font-family="Arial, sans-serif">erro por horizonte</text><path d="M 520 131 H 542" stroke="black"/><path d="M 535 126 l 6 5 l -6 5" stroke="black" fill="none"/><rect x="544" y="87" width="150" height="90" rx="4" fill="#f4f4f4" stroke="black"/><text x="556" y="115" font-size="14" font-weight="bold" font-family="Arial, sans-serif">D: investigar</text><text x="556" y="140" font-size="12" font-family="Arial, sans-serif">alerta ≠ prova</text><path d="M 694 131 H 716" stroke="black"/><path d="M 709 126 l 6 5 l -6 5" stroke="black" fill="none"/><rect x="718" y="87" width="150" height="90" rx="4" fill="#f4f4f4" stroke="black"/><text x="730" y="115" font-size="14" font-weight="bold" font-family="Arial, sans-serif">E: decidir</text><text x="730" y="140" font-size="12" font-family="Arial, sans-serif">manter, revisar, testar</text><text x="25" y="221" font-size="13" font-family="Arial, sans-serif">Revisão exige trilha documentada; desafiante não substitui a versão vigente por uma única melhora.</text></svg>