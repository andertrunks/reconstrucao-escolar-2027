<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Acima do organismo: níveis ecológicos</title><desc id="desc">Sequência organismo, população, comunidade, ecossistema e biosfera com definições curtas.</desc><rect width="1200" height="430" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Acima do organismo: níveis ecológicos</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(45 125)"><rect width="190" height="135" rx="18" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="95" y="45" font-size="23" font-weight="700" fill="#173b29">Organismo</text><text x="95" y="78" font-size="17" fill="#2b4a39">um indivíduo</text></g><text x="260" y="200" font-size="40" fill="#315f46">→</text><g transform="translate(295 125)"><rect width="190" height="135" rx="18" fill="#f1f5ec" stroke="#527044" stroke-width="3"/><text x="95" y="45" font-size="23" font-weight="700" fill="#30452b">População</text><text x="95" y="76" font-size="16" fill="#42523b">mesma espécie</text><text x="95" y="100" font-size="16" fill="#42523b">na mesma área</text></g><text x="510" y="200" font-size="40" fill="#527044">→</text><g transform="translate(545 125)"><rect width="190" height="135" rx="18" fill="#f8f2e8" stroke="#7a5b2f" stroke-width="3"/><text x="95" y="45" font-size="23" font-weight="700" fill="#553d20">Comunidade</text><text x="95" y="76" font-size="16" fill="#604a2d">várias populações</text><text x="95" y="100" font-size="16" fill="#604a2d">interagindo</text></g><text x="760" y="200" font-size="40" fill="#7a5b2f">→</text><g transform="translate(795 125)"><rect width="190" height="135" rx="18" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/><text x="95" y="45" font-size="23" font-weight="700" fill="#303d58">Ecossistema</text><text x="95" y="76" font-size="16" fill="#46526a">comunidade +</text><text x="95" y="100" font-size="16" fill="#46526a">ambiente não vivo</text></g><text x="1010" y="200" font-size="40" fill="#4e5f7f">→</text><g transform="translate(1040 125)"><rect width="130" height="135" rx="18" fill="#f3f1f8" stroke="#65548a" stroke-width="3"/><text x="65" y="45" font-size="21" font-weight="700" fill="#473a64">Biosfera</text><text x="65" y="78" font-size="15" fill="#574a70">conjunto dos</text><text x="65" y="100" font-size="15" fill="#574a70">ecossistemas</text></g></g><text x="55" y="355" font-family="Arial,sans-serif" font-size="20" fill="#2a3630">A partir do organismo, os níveis passam a considerar relações entre indivíduos, espécies e ambiente.</text></svg>