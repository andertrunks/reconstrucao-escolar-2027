<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Unicelular e multicelular</title><desc id="desc">Comparação entre um organismo unicelular formado por uma única célula e um organismo multicelular formado por muitas células especializadas.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Unicelular e multicelular</text><g font-family="Arial,sans-serif"><rect x="65" y="110" width="430" height="320" rx="24" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="280" y="155" text-anchor="middle" font-size="28" font-weight="700" fill="#173b29">Organismo unicelular</text><ellipse cx="280" cy="280" rx="100" ry="72" fill="#d8efdf" stroke="#315f46" stroke-width="5"/><circle cx="250" cy="260" r="9" fill="#4e5f7f"/><circle cx="310" cy="305" r="9" fill="#4e5f7f"/><path d="M235 292 Q280 245 325 290" fill="none" stroke="#7a5b2f" stroke-width="5"/><text x="280" y="390" text-anchor="middle" font-size="20" fill="#2b4a39">1 célula = organismo inteiro</text><rect x="605" y="110" width="430" height="320" rx="24" fill="#f3f1f8" stroke="#65548a" stroke-width="3"/><text x="820" y="155" text-anchor="middle" font-size="28" font-weight="700" fill="#473a64">Organismo multicelular</text><g fill="#e4def3" stroke="#65548a" stroke-width="3"><circle cx="735" cy="235" r="44"/><circle cx="820" cy="220" r="44"/><circle cx="905" cy="235" r="44"/><circle cx="775" cy="305" r="44"/><circle cx="865" cy="305" r="44"/></g><text x="820" y="390" text-anchor="middle" font-size="20" fill="#574a70">muitas células integradas</text></g><text x="55" y="480" font-family="Arial,sans-serif" font-size="20" fill="#2a3630">No multicelular, as células podem se especializar; no unicelular, uma só célula realiza as funções do organismo.</text></svg>