<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Da célula ao organismo</title><desc id="desc">Cinco blocos em sequência mostram célula, tecido, órgão, sistema e organismo, conectados por setas.</desc><rect width="1200" height="360" fill="#fff"/><text x="60" y="56" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Da célula ao organismo</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(55 120)"><rect width="180" height="105" rx="18" fill="#e8f2ec" stroke="#315f46" stroke-width="3"/><text x="90" y="46" font-size="25" font-weight="700" fill="#173b29">Célula</text><text x="90" y="76" font-size="17" fill="#2b4a39">unidade básica</text></g><text x="260" y="180" font-size="42" fill="#315f46">→</text><g transform="translate(300 120)"><rect width="180" height="105" rx="18" fill="#f2f5ee" stroke="#527044" stroke-width="3"/><text x="90" y="46" font-size="25" font-weight="700" fill="#30452b">Tecido</text><text x="90" y="76" font-size="17" fill="#42523b">células organizadas</text></g><text x="505" y="180" font-size="42" fill="#527044">→</text><g transform="translate(545 120)"><rect width="180" height="105" rx="18" fill="#f8f2e8" stroke="#7a5b2f" stroke-width="3"/><text x="90" y="46" font-size="25" font-weight="700" fill="#553d20">Órgão</text><text x="90" y="76" font-size="17" fill="#604a2d">tecidos integrados</text></g><text x="750" y="180" font-size="42" fill="#7a5b2f">→</text><g transform="translate(790 120)"><rect width="180" height="105" rx="18" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/><text x="90" y="46" font-size="25" font-weight="700" fill="#303d58">Sistema</text><text x="90" y="76" font-size="17" fill="#46526a">órgãos cooperam</text></g><text x="995" y="180" font-size="42" fill="#4e5f7f">→</text><g transform="translate(1030 120)"><rect width="140" height="105" rx="18" fill="#f0eef7" stroke="#65548a" stroke-width="3"/><text x="70" y="46" font-size="23" font-weight="700" fill="#473a64">Organismo</text><text x="70" y="76" font-size="16" fill="#574a70">todo integrado</text></g></g><text x="60" y="300" font-family="Arial,sans-serif" font-size="21" fill="#2a3630">Cada nível depende dos anteriores, mas a organização cria funções próprias no nível superior.</text></svg>