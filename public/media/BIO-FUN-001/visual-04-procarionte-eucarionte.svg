<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Procarionte e eucarionte: diferença inicial</title><desc id="desc">Comparação entre uma célula sem núcleo delimitado por membrana e uma célula com núcleo delimitado por membrana.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Procarionte e eucarionte: diferença inicial</text><g font-family="Arial,sans-serif"><rect x="65" y="105" width="430" height="325" rx="24" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="280" y="150" text-anchor="middle" font-size="27" font-weight="700" fill="#173b29">Procariótica</text><ellipse cx="280" cy="275" rx="140" ry="88" fill="#d8efdf" stroke="#315f46" stroke-width="5"/><path d="M205 278 C245 225 330 225 355 292 C315 328 240 330 205 278Z" fill="none" stroke="#7a5b2f" stroke-width="6"/><text x="280" y="380" text-anchor="middle" font-size="19" fill="#2b4a39">DNA sem núcleo delimitado</text><rect x="605" y="105" width="430" height="325" rx="24" fill="#f3f1f8" stroke="#65548a" stroke-width="3"/><text x="820" y="150" text-anchor="middle" font-size="27" font-weight="700" fill="#473a64">Eucariótica</text><ellipse cx="820" cy="275" rx="140" ry="88" fill="#e4def3" stroke="#65548a" stroke-width="5"/><circle cx="820" cy="275" r="52" fill="#fff" stroke="#7a5b2f" stroke-width="6"/><path d="M790 278 Q820 240 850 278 Q820 310 790 278" fill="none" stroke="#7a5b2f" stroke-width="4"/><text x="820" y="380" text-anchor="middle" font-size="19" fill="#574a70">núcleo delimitado por membrana</text></g><text x="55" y="478" font-family="Arial,sans-serif" font-size="20" fill="#2a3630">Nesta aula, a comparação foca somente a presença ou ausência de núcleo delimitado por membrana.</text></svg>