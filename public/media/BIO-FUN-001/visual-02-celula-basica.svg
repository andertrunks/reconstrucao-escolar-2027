<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Plano básico comum às células</title><desc id="desc">Célula genérica mostrando membrana plasmática, citoplasma, material genético e ribossomos.</desc><rect width="1000" height="560" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Plano básico comum às células</text><ellipse cx="470" cy="300" rx="275" ry="170" fill="#edf7f0" stroke="#315f46" stroke-width="7"/><text x="470" y="492" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#315f46">Membrana plasmática</text><text x="470" y="210" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#315f46">Citoplasma</text><path d="M390 290 C430 245,520 245,565 300 C520 345,430 350,390 290Z" fill="none" stroke="#7a5b2f" stroke-width="6"/><text x="475" y="307" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#60451f">Material genético</text><g fill="#4e5f7f"><circle cx="330" cy="245" r="10"/><circle cx="355" cy="335" r="10"/><circle cx="590" cy="245" r="10"/><circle cx="625" cy="335" r="10"/><circle cx="515" cy="390" r="10"/></g><text x="745" y="220" font-family="Arial,sans-serif" font-size="20" fill="#303d58">Ribossomos</text><line x1="635" y1="245" x2="730" y2="220" stroke="#4e5f7f" stroke-width="3"/><text x="55" y="535" font-family="Arial,sans-serif" font-size="19" fill="#2a3630">Diagrama conceitual: não representa uma espécie específica nem todas as estruturas possíveis.</text></svg>