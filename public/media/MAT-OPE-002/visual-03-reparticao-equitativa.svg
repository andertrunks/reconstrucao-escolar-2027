<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Repartição equitativa de vinte e quatro em seis grupos</title><desc id="desc">Seis caixas recebem quatro pontos cada. A divisão vinte e quatro dividido por seis é igual a quatro aparece abaixo.</desc><rect width="960" height="480" rx="24" fill="#fff"/><g fill="none" stroke="#25324a" stroke-width="3"><rect x="60" y="100" width="240" height="125" rx="18"/><rect x="360" y="100" width="240" height="125" rx="18"/><rect x="660" y="100" width="240" height="125" rx="18"/><rect x="60" y="260" width="240" height="125" rx="18"/><rect x="360" y="260" width="240" height="125" rx="18"/><rect x="660" y="260" width="240" height="125" rx="18"/></g><g fill="#182133"><circle cx="125" cy="162" r="13"/><circle cx="175" cy="162" r="13"/><circle cx="225" cy="162" r="13"/><circle cx="275" cy="162" r="13"/><circle cx="425" cy="162" r="13"/><circle cx="475" cy="162" r="13"/><circle cx="525" cy="162" r="13"/><circle cx="575" cy="162" r="13"/><circle cx="725" cy="162" r="13"/><circle cx="775" cy="162" r="13"/><circle cx="825" cy="162" r="13"/><circle cx="875" cy="162" r="13"/><circle cx="125" cy="322" r="13"/><circle cx="175" cy="322" r="13"/><circle cx="225" cy="322" r="13"/><circle cx="275" cy="322" r="13"/><circle cx="425" cy="322" r="13"/><circle cx="475" cy="322" r="13"/><circle cx="525" cy="322" r="13"/><circle cx="575" cy="322" r="13"/><circle cx="725" cy="322" r="13"/><circle cx="775" cy="322" r="13"/><circle cx="825" cy="322" r="13"/><circle cx="875" cy="322" r="13"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="48" font-size="28" font-weight="700">Repartição equitativa</text><text x="480" y="435" font-size="28" font-weight="700">24 ÷ 6 = 4 em cada grupo</text></g></svg>