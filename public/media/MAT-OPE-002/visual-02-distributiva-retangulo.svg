<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Distributiva em um retângulo de sete por vinte e três</title><desc id="desc">Um retângulo de sete linhas e vinte e três colunas é dividido em vinte colunas e três colunas. As partes representam sete vezes vinte e sete vezes três, somando cento e sessenta e um.</desc><rect width="960" height="440" rx="24" fill="#fff"/><g fill="none" stroke="#25324a" stroke-width="3"><rect x="100" y="95" width="760" height="210" rx="8"/><line x1="760" y1="95" x2="760" y2="305"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="48" font-size="28" font-weight="700">7 × 23 pela propriedade distributiva</text><text x="430" y="180" font-size="28" font-weight="700">7 × 20 = 140</text><text x="810" y="180" font-size="24" font-weight="700">7 × 3 = 21</text><text x="480" y="355" font-size="25">7 × (20 + 3) = 140 + 21 = 161</text><text x="480" y="395" font-size="19">As duas partes recompõem o retângulo inteiro.</text></g></svg>