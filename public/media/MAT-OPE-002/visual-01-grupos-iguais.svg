<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Quatro grupos de seis totalizam vinte e quatro</title><desc id="desc">Quatro caixas separadas contêm seis pontos cada. A expressão quatro vezes seis é igual a vinte e quatro aparece abaixo.</desc><rect width="960" height="430" rx="24" fill="#fff"/><g fill="none" stroke="#25324a" stroke-width="3"><rect x="45" y="80" width="190" height="210" rx="18"/><rect x="270" y="80" width="190" height="210" rx="18"/><rect x="495" y="80" width="190" height="210" rx="18"/><rect x="720" y="80" width="190" height="210" rx="18"/></g><g fill="#182133"><circle cx="100" cy="130" r="13"/><circle cx="180" cy="130" r="13"/><circle cx="100" cy="185" r="13"/><circle cx="180" cy="185" r="13"/><circle cx="100" cy="240" r="13"/><circle cx="180" cy="240" r="13"/><circle cx="325" cy="130" r="13"/><circle cx="405" cy="130" r="13"/><circle cx="325" cy="185" r="13"/><circle cx="405" cy="185" r="13"/><circle cx="325" cy="240" r="13"/><circle cx="405" cy="240" r="13"/><circle cx="550" cy="130" r="13"/><circle cx="630" cy="130" r="13"/><circle cx="550" cy="185" r="13"/><circle cx="630" cy="185" r="13"/><circle cx="550" cy="240" r="13"/><circle cx="630" cy="240" r="13"/><circle cx="775" cy="130" r="13"/><circle cx="855" cy="130" r="13"/><circle cx="775" cy="185" r="13"/><circle cx="855" cy="185" r="13"/><circle cx="775" cy="240" r="13"/><circle cx="855" cy="240" r="13"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="45" font-size="28" font-weight="700">Grupos iguais</text><text x="480" y="345" font-size="28" font-weight="700">4 grupos × 6 em cada grupo = 24</text><text x="480" y="385" font-size="20">6 + 6 + 6 + 6 = 24</text></g></svg>