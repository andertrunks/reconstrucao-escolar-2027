<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Cronologia aproximada de evidências selecionadas</title><desc id="d">Linha do tempo com White Sands, Monte Verde, Clovis e uma faixa debatida de Pedra Furada.</desc><rect width="960" height="540" fill="white"/><text x="480" y="42" text-anchor="middle" font-size="27">Cronologia aproximada — não é a data da primeira chegada</text><line x1="110" y1="300" x2="870" y2="300" stroke="#111" stroke-width="4"/><text x="120" y="335" font-size="18">25 mil anos</text><text x="810" y="335" font-size="18">10 mil anos</text><rect x="180" y="220" width="105" height="48" fill="#ddd" stroke="#111"/><text x="232" y="249" text-anchor="middle" font-size="16">White Sands</text><text x="232" y="200" text-anchor="middle" font-size="15">23–21 mil</text><rect x="540" y="220" width="110" height="48" fill="#ddd" stroke="#111"/><text x="595" y="249" text-anchor="middle" font-size="16">Monte Verde</text><text x="595" y="200" text-anchor="middle" font-size="15">≈14,8 mil</text><rect x="660" y="220" width="90" height="48" fill="#ddd" stroke="#111"/><text x="705" y="249" text-anchor="middle" font-size="16">Clovis</text><text x="705" y="200" text-anchor="middle" font-size="15">≈13 mil</text><rect x="80" y="390" width="350" height="55" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="10 8"/><text x="255" y="414" text-anchor="middle" font-size="17">Pedra Furada: propostas mais antigas</text><text x="255" y="437" text-anchor="middle" font-size="16">DEBATE ABERTO — não consenso</text></svg>