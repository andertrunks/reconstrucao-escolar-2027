<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Rota interior e hipótese costeira</title><desc id="d">Esquema compara uma rota interior entre geleiras e uma hipótese de rota costeira.</desc><rect width="960" height="540" fill="white"/><text x="480" y="42" text-anchor="middle" font-size="28">Duas hipóteses de rota</text><ellipse cx="470" cy="150" rx="300" ry="70" fill="#eee" stroke="#111" stroke-width="3"/><text x="470" y="158" text-anchor="middle" font-size="28">Beringia</text><rect x="270" y="250" width="140" height="170" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="550" y="250" width="140" height="170" fill="#ddd" stroke="#111" stroke-width="3"/><text x="340" y="340" text-anchor="middle" font-size="22">Geleira</text><text x="620" y="340" text-anchor="middle" font-size="22">Geleira</text><path d="M470 210 C470 260 470 330 470 455" fill="none" stroke="#111" stroke-width="8"/><text x="470" y="485" text-anchor="middle" font-size="20">rota interior possível</text><path d="M650 190 C790 250 820 340 770 455" fill="none" stroke="#111" stroke-width="6" stroke-dasharray="16 10"/><text x="760" y="485" text-anchor="middle" font-size="20">hipótese costeira</text><text x="480" y="520" text-anchor="middle" font-size="17">Setas = modelos; não trajetos individuais comprovados</text></svg>