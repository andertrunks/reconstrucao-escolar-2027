<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Beringia como região ampla</title><desc id="d">Esquema do nordeste da Ásia, Beringia e noroeste da América durante nível do mar baixo.</desc><rect width="960" height="540" fill="white"/><text x="480" y="45" text-anchor="middle" font-size="28">Beringia como região ampla</text><rect x="70" y="150" width="250" height="230" rx="40" fill="#ddd" stroke="#111" stroke-width="3"/><text x="195" y="275" text-anchor="middle" font-size="26">Nordeste da Ásia</text><rect x="640" y="150" width="250" height="230" rx="40" fill="#ddd" stroke="#111" stroke-width="3"/><text x="765" y="275" text-anchor="middle" font-size="26">Noroeste da América</text><rect x="300" y="190" width="360" height="150" rx="60" fill="#eee" stroke="#111" stroke-width="4"/><text x="480" y="255" text-anchor="middle" font-size="30">BERINGIA</text><text x="480" y="292" text-anchor="middle" font-size="20">ampla região terrestre</text><text x="480" y="438" text-anchor="middle" font-size="20">Esquema conceitual — não está em escala</text></svg>