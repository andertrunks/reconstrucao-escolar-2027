<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">RETAS PARALELAS: SEM ENCONTRO</title><desc id="desc">Mesma taxa de aumento, mas custos iniciais diferentes</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082c61"/><stop offset="1" stop-color="#0b62ab"/></linearGradient></defs><rect x="12" y="10" width="1576" height="113" rx="17" fill="url(#blue)" /><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="40" font-weight="700" fill="#fff">RETAS PARALELAS: SEM ENCONTRO</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e5f2ff">Mesma taxa de aumento, mas custos iniciais diferentes</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="65" rx="16" fill="#075bbb" /><rect x="20" y="189" width="508" height="16" rx="0" fill="#075bbb" /><circle cx="55" cy="173" r="23" fill="#fff" opacity=".22"/><text x="55" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="92" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Compare as funções</text><text x="44" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">F(x) = 2x + 15.</text><text x="44" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">G(x) = 2x + 40.</text><text x="44" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Ambas crescem 2 por unidade.</text><rect x="42" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">Taxas iguais = 2</text><text x="44" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Custos fixos são diferentes.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#ebfaef" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="65" rx="16" fill="#078a55" /><rect x="546" y="189" width="508" height="16" rx="0" fill="#078a55" /><circle cx="581" cy="173" r="23" fill="#fff" opacity=".22"/><text x="581" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="618" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">A diferença é fixa</text><text x="570" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Subtraia F − G.</text><text x="570" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">2x + 15 − 2x − 40.</text><text x="570" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">O termo x desaparece.</text><rect x="568" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="800" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">F − G = −25</text><text x="570" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">F é R$ 25 mais barata.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#ed7b18" stroke-width="2"/><rect x="1072" y="140" width="508" height="65" rx="16" fill="#ed7b18" /><rect x="1072" y="189" width="508" height="16" rx="0" fill="#ed7b18" /><circle cx="1107" cy="173" r="23" fill="#fff" opacity=".22"/><text x="1107" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1144" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Em x = 0</text><text x="1096" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">F(0) = 15.</text><text x="1096" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">G(0) = 40.</text><text x="1096" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Diferença de 25 reais.</text><rect x="1094" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">15 &lt; 40</text><text x="1096" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ed7b18">F começa abaixo de G.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ecff" stroke="#863fc8" stroke-width="2"/><rect x="20" y="520" width="508" height="65" rx="16" fill="#863fc8" /><rect x="20" y="569" width="508" height="16" rx="0" fill="#863fc8" /><circle cx="55" cy="553" r="23" fill="#fff" opacity=".22"/><text x="55" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="92" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Em x = 40</text><text x="44" y="634" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">F(40) = 80 + 15 = 95.</text><text x="44" y="669" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">G(40) = 80 + 40 = 120.</text><text x="44" y="704" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">A diferença permanece 25.</text><rect x="42" y="748" width="464" height="66" rx="12" fill="#fff" /><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">95 &lt; 120</text><text x="44" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#863fc8">A posição não se inverte.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffedef" stroke="#d93952" stroke-width="2"/><rect x="546" y="520" width="508" height="65" rx="16" fill="#d93952" /><rect x="546" y="569" width="508" height="16" rx="0" fill="#d93952" /><circle cx="581" cy="553" r="23" fill="#fff" opacity=".22"/><text x="581" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="618" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Observe o gráfico</text><text x="570" y="629" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#1c304c">Azul = F; vermelho = G.</text><rect x="569" y="641" width="462" height="197" rx="10" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><line x1="613" y1="661" x2="613" y2="805" stroke="#51647c" stroke-width="1.8" /><line x1="613" y1="805" x2="1015" y2="805" stroke="#51647c" stroke-width="1.8" /><line x1="613" y1="805" x2="613" y2="810" stroke="#52647e" stroke-width="1" /><text x="613" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">0</text><line x1="814" y1="805" x2="814" y2="810" stroke="#52647e" stroke-width="1" /><text x="814" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">20</text><line x1="1015" y1="805" x2="1015" y2="810" stroke="#52647e" stroke-width="1" /><text x="1015" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">40</text><line x1="608" y1="805" x2="613" y2="805" stroke="#52647e" stroke-width="1" /><text x="605" y="810" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">0</text><line x1="608" y1="733" x2="613" y2="733" stroke="#52647e" stroke-width="1" /><text x="605" y="738" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">65</text><line x1="608" y1="661" x2="613" y2="661" stroke="#52647e" stroke-width="1" /><text x="605" y="666" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">130</text><text x="1017" y="809" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#34445e">x (un.)</text><text x="609" y="655" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#34445e">R$</text><polyline points="613.0,788.4 1015.0,699.8" fill="none" stroke="#075bbb" stroke-width="4" /><polyline points="613.0,760.7 1015.0,672.1" fill="none" stroke="#d93952" stroke-width="4" /><text x="570" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#d93952">Retas paralelas e distintas.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fc" stroke="#07899c" stroke-width="2"/><rect x="1072" y="520" width="508" height="65" rx="16" fill="#07899c" /><rect x="1072" y="569" width="508" height="16" rx="0" fill="#07899c" /><circle cx="1107" cy="553" r="23" fill="#fff" opacity=".22"/><text x="1107" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1144" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Conclusão</text><text x="1096" y="634" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Não existe ponto de empate.</text><text x="1096" y="669" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">As inclinações são iguais.</text><text x="1096" y="704" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">No domínio comum, F &lt; G.</text><rect x="1094" y="748" width="464" height="66" rx="12" fill="#fff" /><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">F(x) &lt; G(x)</text><text x="1096" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#07899c">Diferença constante de R$ 25.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073765" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">Inclinações iguais e alturas iniciais distintas produzem retas paralelas.</text></svg>