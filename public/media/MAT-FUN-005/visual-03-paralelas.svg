<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 840 540" width="840" height="540"><title id="title">Duas retas paralelas</title><desc id="desc">As duas funções sobem no mesmo ritmo e conservam distância vertical fixa.</desc><rect width="840" height="540" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="32" y="38" font-size="24" font-weight="bold">Duas retas paralelas</text><text x="32" y="67" font-size="15">As duas funções sobem no mesmo ritmo e conservam distância vertical fixa.</text></g><g stroke="#34495e" stroke-width="2"><line x1="95" y1="445" x2="760" y2="445"/><line x1="95" y1="445" x2="95" y2="100"/></g><path d="M135 374 L715 154" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M135 284 L715 64" stroke="#dc2626" stroke-width="4" fill="none"/><g font-family="Arial" font-size="19" fill="#172a45"><text x="420" y="328">F(x)=2x+15</text><text x="408" y="100">G(x)=2x+40</text><text x="190" y="477">Nenhuma igualdade</text></g><g font-family="Arial, sans-serif" fill="#172a45" font-size="14"><text x="380" y="508">Entrada x (unidades)</text><text x="15" y="103">Saída / diferença</text></g></svg>