<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 840 540" width="840" height="540"><title id="title">Interseção entre dois custos</title><desc id="desc">Planos A e B se cruzam na quantidade 30 e no custo 80 reais.</desc><rect width="840" height="540" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="32" y="38" font-size="24" font-weight="bold">Interseção entre dois custos</text><text x="32" y="67" font-size="15">Planos A e B se cruzam na quantidade 30 e no custo 80 reais.</text></g><g stroke="#34495e" stroke-width="2"><line x1="95" y1="445" x2="760" y2="445"/><line x1="95" y1="445" x2="95" y2="100"/></g><path d="M95 390 L735 118" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M95 288 L735 152" stroke="#dc2626" stroke-width="4" fill="none"/><circle cx="575" cy="186" r="7" fill="#111827"/><g font-size="18" font-family="Arial" fill="#172a45"><text x="150" y="384">A(x)=20+2x</text><text x="140" y="266">B(x)=50+x</text><text x="586" y="181">(30, 80)</text><text x="560" y="468">30</text><text x="55" y="191">80</text><text x="36" y="150">Custo (R$)</text></g><path d="M575 186V445 M95 186H575" stroke="#64748b" stroke-dasharray="7 5" fill="none"/><g font-family="Arial, sans-serif" fill="#172a45" font-size="14"><text x="380" y="508">Entrada x (unidades)</text><text x="15" y="103">Saída / diferença</text></g></svg>