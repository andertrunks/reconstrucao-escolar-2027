<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 840 540" width="840" height="540"><title id="title">Empate contínuo sem empate inteiro</title><desc id="desc">As funções F(n)=10+3n e G(n)=15+n se cruzam em 2,5, fora das entradas inteiras.</desc><rect width="840" height="540" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="32" y="38" font-size="24" font-weight="bold">Empate contínuo sem empate inteiro</text><text x="32" y="67" font-size="15">As funções F(n)=10+3n e G(n)=15+n se cruzam em 2,5, fora das entradas inteiras.</text></g><g stroke="#34495e" stroke-width="2"><line x1="95" y1="445" x2="760" y2="445"/><line x1="95" y1="445" x2="95" y2="100"/></g><path d="M135 360 L635 160" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M135 310 L635 210" stroke="#dc2626" stroke-width="3" fill="none"/><circle cx="385" cy="260" r="6" fill="#111827"/><g font-family="Arial" font-size="16" fill="#172a45"><text x="360" y="250">n=2,5 (inexistente)</text><text x="195" y="400">n=2: F&lt;G</text><text x="515" y="229">n=3: G&lt;F</text><text x="205" y="480">n só admite 0, 1, 2, 3...</text></g><g fill="#2563eb"><circle cx="335" cy="280" r="8"/><circle cx="435" cy="240" r="8"/></g><g fill="#dc2626"><circle cx="335" cy="270" r="8"/><circle cx="435" cy="250" r="8"/></g><g font-family="Arial, sans-serif" fill="#172a45" font-size="14"><text x="380" y="508">Entrada x (unidades)</text><text x="15" y="103">Saída / diferença</text></g></svg>