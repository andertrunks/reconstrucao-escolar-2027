<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">DIFERENÇA ENTRE DUAS FUNÇÕES</title><desc id="desc">Compare preços pela subtração e pelo sinal da diferença</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082c61"/><stop offset="1" stop-color="#0b62ab"/></linearGradient></defs><rect x="12" y="10" width="1576" height="113" rx="17" fill="url(#blue)" /><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="40" font-weight="700" fill="#fff">DIFERENÇA ENTRE DUAS FUNÇÕES</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e5f2ff">Compare preços pela subtração e pelo sinal da diferença</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="65" rx="16" fill="#075bbb" /><rect x="20" y="189" width="508" height="16" rx="0" fill="#075bbb" /><circle cx="55" cy="173" r="23" fill="#fff" opacity=".22"/><text x="55" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="92" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Duas tarifas</text><text x="44" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">A(x) = 20 + 2x.</text><text x="44" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">B(x) = 50 + x.</text><text x="44" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Defina D(x) = A(x) − B(x).</text><rect x="42" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">D(x) = x − 30</text><text x="44" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Resultado medido em reais.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#ebfaef" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="65" rx="16" fill="#078a55" /><rect x="546" y="189" width="508" height="16" rx="0" fill="#078a55" /><circle cx="581" cy="173" r="23" fill="#fff" opacity=".22"/><text x="581" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="618" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">O sinal negativo</text><text x="570" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Quando D(x) &lt; 0, A &lt; B.</text><text x="570" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Isso ocorre se x &lt; 30.</text><text x="570" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">A é mais barata nessa região.</text><rect x="568" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="800" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">x = 15 → D = −15</text><text x="570" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">A custa R$ 15 menos.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#ed7b18" stroke-width="2"/><rect x="1072" y="140" width="508" height="65" rx="16" fill="#ed7b18" /><rect x="1072" y="189" width="508" height="16" rx="0" fill="#ed7b18" /><circle cx="1107" cy="173" r="23" fill="#fff" opacity=".22"/><text x="1107" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1144" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">A diferença é zero</text><text x="1096" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">D(x) = 0 significa empate.</text><text x="1096" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">x − 30 = 0.</text><text x="1096" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Logo x = 30 unidades.</text><rect x="1094" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">D(30) = 0</text><text x="1096" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ed7b18">Os custos são iguais.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ecff" stroke="#863fc8" stroke-width="2"/><rect x="20" y="520" width="508" height="65" rx="16" fill="#863fc8" /><rect x="20" y="569" width="508" height="16" rx="0" fill="#863fc8" /><circle cx="55" cy="553" r="23" fill="#fff" opacity=".22"/><text x="55" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="92" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">O sinal positivo</text><text x="44" y="634" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Quando D(x) &gt; 0, A &gt; B.</text><text x="44" y="669" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Isso ocorre se x &gt; 30.</text><text x="44" y="704" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">B é mais barata nessa região.</text><rect x="42" y="748" width="464" height="66" rx="12" fill="#fff" /><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">x = 45 → D = 15</text><text x="44" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#863fc8">A custa R$ 15 mais.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffedef" stroke="#d93952" stroke-width="2"/><rect x="546" y="520" width="508" height="65" rx="16" fill="#d93952" /><rect x="546" y="569" width="508" height="16" rx="0" fill="#d93952" /><circle cx="581" cy="553" r="23" fill="#fff" opacity=".22"/><text x="581" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="618" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Observe o sinal</text><text x="570" y="629" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#1c304c">A linha cruza D = 0 em x = 30.</text><rect x="569" y="641" width="462" height="197" rx="10" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><line x1="613" y1="661" x2="613" y2="805" stroke="#51647c" stroke-width="1.8" /><line x1="613" y1="805" x2="1015" y2="805" stroke="#51647c" stroke-width="1.8" /><line x1="613" y1="718.6" x2="1015" y2="718.6" stroke="#8799ad" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="613" y1="805" x2="613" y2="810" stroke="#52647e" stroke-width="1" /><text x="613" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">0</text><line x1="854.2" y1="805" x2="854.2" y2="810" stroke="#52647e" stroke-width="1" /><text x="854.2" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">30</text><line x1="1015" y1="805" x2="1015" y2="810" stroke="#52647e" stroke-width="1" /><text x="1015" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">50</text><line x1="608" y1="805" x2="613" y2="805" stroke="#52647e" stroke-width="1" /><text x="605" y="810" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">-30</text><line x1="608" y1="718.6" x2="613" y2="718.6" stroke="#52647e" stroke-width="1" /><text x="605" y="723.6" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">0</text><line x1="608" y1="661" x2="613" y2="661" stroke="#52647e" stroke-width="1" /><text x="605" y="666" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">20</text><text x="1021" y="809" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#34445e">x (un.)</text><text x="609" y="655" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#34445e">D (R$)</text><polyline points="613.0,805.0 1015.0,661.0" fill="none" stroke="#075bbb" stroke-width="4" /><circle cx="854.2" cy="718.6" r="7" fill="#172744" stroke="#fff" stroke-width="1.5"/><text x="862.2" y="706.6" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#20334d">(30,0)</text><text x="570" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#d93952">Abaixo de zero: A custa menos.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fc" stroke="#07899c" stroke-width="2"/><rect x="1072" y="520" width="508" height="65" rx="16" fill="#07899c" /><rect x="1072" y="569" width="508" height="16" rx="0" fill="#07899c" /><circle cx="1107" cy="553" r="23" fill="#fff" opacity=".22"/><text x="1107" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1144" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Cheque sem decorar</text><text x="1096" y="634" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Em x = 20: A = 60; B = 70.</text><text x="1096" y="669" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">D(20) = −10.</text><text x="1096" y="704" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Em x = 40: A = 100; B = 90.</text><rect x="1094" y="748" width="464" height="66" rx="12" fill="#fff" /><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">D(40) = 10</text><text x="1096" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#07899c">Confira a interpretação do sinal.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073765" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">D(x) &lt; 0 indica A mais barata; D(x) &gt; 0 indica B mais barata.</text></svg>