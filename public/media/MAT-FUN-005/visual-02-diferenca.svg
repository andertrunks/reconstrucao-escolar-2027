<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 840 540" width="840" height="540"><title id="title">Diferença A menos B</title><desc id="desc">D(x)=x menos 30: valor negativo antes de 30, nulo em 30 e positivo depois.</desc><rect width="840" height="540" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="32" y="38" font-size="24" font-weight="bold">Diferença A menos B</text><text x="32" y="67" font-size="15">D(x)=x menos 30: valor negativo antes de 30, nulo em 30 e positivo depois.</text></g><g stroke="#34495e" stroke-width="2"><line x1="95" y1="445" x2="760" y2="445"/><line x1="95" y1="445" x2="95" y2="100"/></g><path d="M150 405 L710 135" stroke="#2563eb" stroke-width="4" fill="none"/><line x1="95" y1="270" x2="760" y2="270" stroke="#333" stroke-width="2"/><circle cx="430" cy="270" r="7" fill="#111827"/><g font-family="Arial" font-size="18" fill="#172a45"><text x="410" y="295">30</text><text x="165" y="325">D(x)&lt;0: A mais barata</text><text x="505" y="155">D(x)&gt;0: B mais barata</text><text x="437" y="245">D=0</text><text x="42" y="255">0</text></g><g font-family="Arial, sans-serif" fill="#172a45" font-size="14"><text x="380" y="508">Entrada x (unidades)</text><text x="15" y="103">Saída / diferença</text></g></svg>