<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 840 540" width="840" height="540"><title id="title">Duas retas coincidentes</title><desc id="desc">F(x) e G(x) são a mesma regra: todos os pontos do domínio comum coincidem.</desc><rect width="840" height="540" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="32" y="38" font-size="24" font-weight="bold">Duas retas coincidentes</text><text x="32" y="67" font-size="15">F(x) e G(x) são a mesma regra: todos os pontos do domínio comum coincidem.</text></g><g stroke="#34495e" stroke-width="2"><line x1="95" y1="445" x2="760" y2="445"/><line x1="95" y1="445" x2="95" y2="100"/></g><path d="M135 376 L715 146" stroke="#16a34a" stroke-width="7" fill="none"/><g font-family="Arial" font-size="18" fill="#172a45"><text x="220" y="280">F(x)=G(x)=3x+12</text><text x="226" y="315">Uma única reta desenhada</text><text x="210" y="478">Igualdade para todo x permitido</text></g><g font-family="Arial, sans-serif" fill="#172a45" font-size="14"><text x="380" y="508">Entrada x (unidades)</text><text x="15" y="103">Saída / diferença</text></g></svg>