<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 940 370" width="940" height="370"><title id="t">Seis elos de verificabilidade editorial</title><desc id="d">Fluxo da pergunta para fonte, contagem, cálculo, limite e ação. A conclusão didática distingue dois cartões do sandbox de zero resultados no sucessor.</desc><rect width="940" height="370" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172634"><text x="25" y="35" font-size="22" fill="#16324f" font-weight="bold" text-anchor="start">Checklist do relatório executivo verificável</text><rect x="25" y="100" width="137" height="125" rx="7" fill="#eef5fa" stroke="#c4d6e1"/><text x="35" y="131" font-size="17" fill="#16324f" font-weight="bold" text-anchor="start">1 Pergunta</text><text x="35" y="168" font-size="14" fill="#172634" font-weight="normal" text-anchor="start">Qual coorte?</text><text x="168" y="165" font-size="17" fill="#af5d12" font-weight="bold" text-anchor="start">→</text><rect x="176" y="100" width="137" height="125" rx="7" fill="#e4f4f1" stroke="#c4d6e1"/><text x="186" y="131" font-size="17" fill="#16324f" font-weight="bold" text-anchor="start">2 Fonte</text><text x="186" y="168" font-size="14" fill="#172634" font-weight="normal" text-anchor="start">Qual arquivo</text><text x="186" y="187" font-size="14" fill="#172634" font-weight="normal" text-anchor="start">corte?</text><text x="319" y="165" font-size="17" fill="#af5d12" font-weight="bold" text-anchor="start">→</text><rect x="327" y="100" width="137" height="125" rx="7" fill="#eef5fa" stroke="#c4d6e1"/><text x="337" y="131" font-size="17" fill="#16324f" font-weight="bold" text-anchor="start">3 Contagem</text><text x="337" y="168" font-size="14" fill="#172634" font-weight="normal" text-anchor="start">n total e n válido</text><text x="470" y="165" font-size="17" fill="#af5d12" font-weight="bold" text-anchor="start">→</text><rect x="478" y="100" width="137" height="125" rx="7" fill="#e4f4f1" stroke="#c4d6e1"/><text x="488" y="131" font-size="17" fill="#16324f" font-weight="bold" text-anchor="start">4 Conta</text><text x="488" y="168" font-size="14" fill="#172634" font-weight="normal" text-anchor="start">Métrica + unidade</text><text x="621" y="165" font-size="17" fill="#af5d12" font-weight="bold" text-anchor="start">→</text><rect x="629" y="100" width="137" height="125" rx="7" fill="#eef5fa" stroke="#c4d6e1"/><text x="639" y="131" font-size="17" fill="#16324f" font-weight="bold" text-anchor="start">5 Limite</text><text x="639" y="168" font-size="14" fill="#172634" font-weight="normal" text-anchor="start">Ausências e hipótese</text><text x="772" y="165" font-size="17" fill="#af5d12" font-weight="bold" text-anchor="start">→</text><rect x="780" y="100" width="137" height="125" rx="7" fill="#e4f4f1" stroke="#c4d6e1"/><text x="790" y="131" font-size="17" fill="#16324f" font-weight="bold" text-anchor="start">6 Ação</text><text x="790" y="168" font-size="14" fill="#172634" font-weight="normal" text-anchor="start">Estado do protocolo</text><text x="28" y="283" font-size="17" fill="#3d5266" font-weight="normal" text-anchor="start">Conclusão permitida: dois de oito cartões do sandbox foram avaliados; não há resultado da coorte sucessora.</text><text x="28" y="319" font-size="16" fill="#3d5266" font-weight="normal" text-anchor="start">Ao apresentar gráficos: título, eixos, unidades, corte, origem e descrição integral em texto.</text></g></svg>