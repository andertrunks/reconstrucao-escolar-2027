<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 940 370" width="940" height="370"><title id="t">Comparação do corte íntegro e seleção posterior</title><desc id="d">À esquerda, corte A com S01 e S02, MAE B três e C quatro; à direita, seleção apenas S01 com MAE B quatro e C três. A mudança vem da exclusão pós-resultado.</desc><rect width="940" height="370" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172634"><text x="25" y="35" font-size="21" fill="#16324f" font-weight="bold" text-anchor="start">Trocar a amostra após ver o erro muda o relato, não a previsão</text><rect x="45" y="86" width="375" height="210" rx="7" fill="#eef5fa" stroke="none"/><rect x="525" y="86" width="375" height="210" rx="7" fill="#fff3e8" stroke="none"/><text x="65" y="120" font-size="19" fill="#16324f" font-weight="bold" text-anchor="start">Corte A · dois cartões</text><text x="65" y="167" font-size="17" fill="#172634" font-weight="normal" text-anchor="start">S01 e S02: n=2</text><text x="65" y="202" font-size="19" fill="#172634" font-weight="normal" text-anchor="start">MAE B = 3; C = 4</text><text x="65" y="235" font-size="17" fill="#172634" font-weight="normal" text-anchor="start">Custos B = C = 7</text><text x="65" y="271" font-size="15" fill="#087e80" font-weight="normal" text-anchor="start">Fotografia original preservada</text><text x="545" y="120" font-size="19" fill="#16324f" font-weight="bold" text-anchor="start">Seleção após resultado</text><text x="545" y="167" font-size="17" fill="#172634" font-weight="normal" text-anchor="start">Somente S01: n=1</text><text x="545" y="202" font-size="19" fill="#172634" font-weight="normal" text-anchor="start">MAE B = 4; C = 3</text><text x="545" y="235" font-size="17" fill="#172634" font-weight="normal" text-anchor="start">Custos B = 12; C = 9</text><text x="545" y="271" font-size="15" fill="#af5d12" font-weight="normal" text-anchor="start">Exploração; não substitui A</text><text x="35" y="340" font-size="15" fill="#3d5266" font-weight="normal" text-anchor="start">Exclusão de S02 foi escolhida depois do resultado; não há nova evidência externa.</text></g></svg>