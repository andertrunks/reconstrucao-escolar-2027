<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 940 370" width="940" height="370"><title id="t">Diferenças emparelhadas de módulos</title><desc id="d">Eixo horizontal: diferença C menos B de menos dois a mais quatro unidades; S01 menos um, S02 mais três, média mais um. Valores de sinais opostos; apenas dois pares avaliáveis.</desc><rect width="940" height="370" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172634"><text x="25" y="35" font-size="21" fill="#16324f" font-weight="bold" text-anchor="start">Diferença por cartão: |erro C| menos |erro B|</text><line x1="125" y1="75" x2="125" y2="290" stroke="#dae4ed" stroke-width="1" /><text x="125" y="317" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">-2</text><line x1="225" y1="75" x2="225" y2="290" stroke="#dae4ed" stroke-width="1" /><text x="225" y="317" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">-1</text><line x1="325" y1="75" x2="325" y2="290" stroke="#dae4ed" stroke-width="1" /><text x="325" y="317" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">0</text><line x1="425" y1="75" x2="425" y2="290" stroke="#dae4ed" stroke-width="1" /><text x="425" y="317" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">1</text><line x1="525" y1="75" x2="525" y2="290" stroke="#dae4ed" stroke-width="1" /><text x="525" y="317" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">2</text><line x1="625" y1="75" x2="625" y2="290" stroke="#dae4ed" stroke-width="1" /><text x="625" y="317" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">3</text><line x1="725" y1="75" x2="725" y2="290" stroke="#dae4ed" stroke-width="1" /><text x="725" y="317" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">4</text><text x="400" y="348" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">Eixo horizontal: diferença absoluta em unidades (C − B)</text><line x1="325" y1="70" x2="325" y2="292" stroke="#172634" stroke-width="2" /><text x="26" y="155" font-size="18" fill="#172634" font-weight="normal" text-anchor="start">S01</text><rect x="225" y="136" width="100" height="28" rx="7" fill="#087e80" stroke="none"/><text x="213" y="156" font-size="19" fill="#172634" font-weight="bold" text-anchor="end">-1</text><text x="26" y="240" font-size="18" fill="#172634" font-weight="normal" text-anchor="start">S02</text><rect x="325" y="221" width="300" height="28" rx="7" fill="#af5d12" stroke="none"/><text x="637" y="241" font-size="19" fill="#172634" font-weight="bold" text-anchor="start">+3</text><text x="610" y="92" font-size="17" fill="#172634" font-weight="normal" text-anchor="start">S01: −1  |  S02: +3</text><text x="610" y="119" font-size="17" fill="#16324f" font-weight="bold" text-anchor="start">Média dos dois: +1</text></g></svg>