<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Resolução completa</title><desc id="d">Quatro caixas mostram as etapas de três x mais dois igual a x mais dez até x igual a quatro.</desc><rect width="960" height="540" fill="white"/><text x="480" y="55" text-anchor="middle" font-size="30" font-family="Arial">Resolução por equivalência</text><g font-family="Arial" font-size="27" text-anchor="middle"><rect x="90" y="110" width="780" height="60" fill="#eee" stroke="black"/><text x="480" y="150">3x + 2 = x + 10</text><rect x="90" y="205" width="780" height="60" fill="#eee" stroke="black"/><text x="480" y="245">2x + 2 = 10</text><rect x="90" y="300" width="780" height="60" fill="#eee" stroke="black"/><text x="480" y="340">2x = 8</text><rect x="90" y="395" width="780" height="60" fill="#eee" stroke="black"/><text x="480" y="435">x = 4</text></g><text x="480" y="505" text-anchor="middle" font-size="20" font-family="Arial">Cada linha tem o mesmo conjunto de soluções.</text></svg>