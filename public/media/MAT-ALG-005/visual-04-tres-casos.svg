<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Três possíveis resultados</title><desc id="d">Comparação entre uma equação com uma solução, uma identidade com infinitas soluções e uma contradição sem solução.</desc><rect width="960" height="540" fill="white"/><text x="480" y="55" text-anchor="middle" font-size="30" font-family="Arial">Três resultados possíveis</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="120" width="270" height="300" fill="#eee" stroke="black"/><text x="180" y="165" font-size="24">Uma solução</text><text x="180" y="230" font-size="20">3x+2=x+10</text><text x="180" y="280" font-size="24">x=4</text><rect x="345" y="120" width="270" height="300" fill="#eee" stroke="black"/><text x="480" y="165" font-size="24">Infinitas</text><text x="480" y="230" font-size="20">2x+5=2x+5</text><text x="480" y="280" font-size="24">5=5</text><rect x="645" y="120" width="270" height="300" fill="#eee" stroke="black"/><text x="780" y="165" font-size="24">Nenhuma</text><text x="780" y="230" font-size="20">2x+5=2x+8</text><text x="780" y="280" font-size="24">5=8</text></g><text x="480" y="485" text-anchor="middle" font-size="20" font-family="Arial">Se x desaparece, examine a igualdade que sobrou.</text></svg>