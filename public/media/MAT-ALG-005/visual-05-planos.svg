<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Comparação de dois planos</title><desc id="d">Plano A custa vinte mais três x reais e plano B custa oito mais cinco x reais; igualar as expressões leva a x igual a seis.</desc><rect width="960" height="540" fill="white"/><text x="480" y="55" text-anchor="middle" font-size="30" font-family="Arial">Quando dois custos são iguais?</text><rect x="90" y="120" width="330" height="120" fill="#eee" stroke="black"/><rect x="540" y="120" width="330" height="120" fill="#eee" stroke="black"/><text x="255" y="165" text-anchor="middle" font-size="24" font-family="Arial">Plano A</text><text x="255" y="210" text-anchor="middle" font-size="26" font-family="Arial">20 + 3x</text><text x="705" y="165" text-anchor="middle" font-size="24" font-family="Arial">Plano B</text><text x="705" y="210" text-anchor="middle" font-size="26" font-family="Arial">8 + 5x</text><text x="480" y="310" text-anchor="middle" font-size="30" font-family="Arial">20 + 3x = 8 + 5x</text><text x="480" y="385" text-anchor="middle" font-size="28" font-family="Arial">12 = 2x</text><text x="480" y="445" text-anchor="middle" font-size="34" font-family="Arial">x = 6</text><text x="480" y="505" text-anchor="middle" font-size="20" font-family="Arial">Com 6 unidades, os dois planos custam R$ 38.</text></svg>