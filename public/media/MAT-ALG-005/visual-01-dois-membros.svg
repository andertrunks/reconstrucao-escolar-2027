<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">UMA EQUAÇÃO, DOIS MEMBROS</title><desc id="desc">UMA EQUAÇÃO, DOIS MEMBROS. A igualdade representa quantidades equivalentes. O ponto de partida. Há valores com x nos dois lados.. Os membros devem permanecer iguais.. 3x + 2 = x + 10. É a equação original. A balança. Esquerda: 3x mais 2.. Direita: x mais 10.. 3x + 2 = x + 10. Compare os dois membros. Subtraia o mesmo x. Retiramos x de ambos os lados.. Não se troca o sinal por mágica.. 3x+2−x = x+10−x. Operações iguais mantêm a igualdade. Simplifique. Reúna os termos semelhantes.. Três x menos x dá dois x.. 2x + 2 = 10. A equação é equivalente. Isole a incógnita. Tire 2 de ambos os membros.. Depois divida ambos por 2.. 2x = 8  ⇒  x = 4. Valor procurado. Confira no original. Esquerda: 3×4+2=14.. Direita: 4+10=14.. 14 = 14. A solução verifica a igualdade</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">UMA EQUAÇÃO, DOIS MEMBROS</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">A igualdade representa quantidades equivalentes</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</te