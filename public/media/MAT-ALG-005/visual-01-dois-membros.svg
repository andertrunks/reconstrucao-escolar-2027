<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Incógnita nos dois membros</title><desc id="d">Balança conceitual para a equação três x mais dois igual a x mais dez.</desc><rect width="960" height="540" fill="white"/><text x="480" y="55" text-anchor="middle" font-size="30" font-family="Arial">3x + 2 = x + 10</text><line x1="480" y1="120" x2="480" y2="390" stroke="black" stroke-width="8"/><line x1="260" y1="220" x2="700" y2="220" stroke="black" stroke-width="8"/><line x1="260" y1="220" x2="180" y2="330" stroke="black" stroke-width="4"/><line x1="700" y1="220" x2="780" y2="330" stroke="black" stroke-width="4"/><rect x="90" y="330" width="180" height="90" fill="#eee" stroke="black"/><rect x="690" y="330" width="180" height="90" fill="#eee" stroke="black"/><text x="180" y="385" text-anchor="middle" font-size="28" font-family="Arial">3x + 2</text><text x="780" y="385" text-anchor="middle" font-size="28" font-family="Arial">x + 10</text><text x="480" y="490" text-anchor="middle" font-size="22" font-family="Arial">Os dois membros representam a mesma quantidade.</text></svg>