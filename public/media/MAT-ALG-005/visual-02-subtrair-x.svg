<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">SUBTRAIR X DOS DOIS MEMBROS</title><desc id="desc">SUBTRAIR X DOS DOIS MEMBROS. O mesmo gesto deve ocorrer à esquerda e à direita. Equação inicial. O termo x aparece nos dois lados.. Precisamos reuni-lo.. 3x + 2 = x + 10. Não há transposição mágica. Princípio da igualdade. Se duas quantidades são iguais,. subtrair a mesma preserva o valor.. a = b ⇒ a−x = b−x. Operação aplicada aos dois. Escreva toda a operação. À esquerda, subtraia x.. À direita, subtraia x também.. 3x+2−x = x+10−x. Observe o x em ambos os lados. Cancele por cálculo. Três x menos um x dá 2x.. x menos x é zero.. 2x + 2 = 10. Não cancelamos dentro de soma. Continue resolvendo. Subtraia 2 em ambos os lados.. Divida os dois lados por 2.. 2x = 8; x = 4. As soluções são preservadas. Reteste a solução. A equação original recebe x=4.. Os dois lados precisam ser 14.. 3×4+2 = 4+10. Resultado: verdadeiro</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">SUBTRAIR X DOS DOIS MEMBROS</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">O mesmo gesto deve ocorrer à esquerda e à direita</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="97" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Equação inicial</text><text x="46" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">O termo x aparece nos dois lados.</text><text x="46" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Precisamos reuni-lo.</text><rect x="42" y="361" width="464" height="73" rx="12" fill="#fff"/><text x="274" y="407" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">3x + 2 = x + 10</text><text x="46" y="477" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Não há transposição mágica</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="623" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Princípio da igualdade</text><text x="572" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Se duas quantidades são iguais,</text><text x="572" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">subtrair a mesma preserva o valor.</text><rect x="568" y="361" width="464" height="73" rx="12" fill="#fff"/><text x="800" y="407" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">a = b ⇒ a−x = b−x</text><text x="572" y="477" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e54">Operação aplicada aos dois</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1149" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Escreva toda a operação</text><text x="1098" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">À esquerda, subtraia x.</text><text x="1098" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">À direita, subtraia x também.</text><rect x="1094" y="361" width="464" height="73" rx="12" fill="#fff"/><text x="1326" y="407" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">3x+2−x = x+10−x</text><text x="1098" y="477" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Observe o x em ambos os lados</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="97" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Cancele por cálculo</text><text x="46" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Três x menos um x dá 2x.</text><text x="46" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">x menos x é zero.</text><rect x="42" y="741" width="464" height="73" rx="12" fill="#fff"/><text x="274" y="787" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x + 2 = 10</text><text x="46" y="857" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Não cancelamos dentro de soma</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="623" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Continue resolvendo</text><text x="572" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Subtraia 2 em ambos os lados.</text><text x="572" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Divida os dois lados por 2.</text><rect x="568" y="741" width="464" height="73" rx="12" fill="#fff"/><text x="800" y="787" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x = 8; x = 4</text><text x="572" y="857" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">As soluções são preservadas</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1149" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Reteste a solução</text><text x="1098" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">A equação original recebe x=4.</text><text x="1098" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Os dois lados precisam ser 14.</text><rect x="1094" y="741" width="464" height="73" rx="12" fill="#fff"/><text x="1326" y="787" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">3×4+2 = 4+10</text><text x="1098" y="857" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Resultado: verdadeiro</text><text x="25" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#345">Reconstrução Escolar 2027 • MAT-ALG-005 • infográfico autoral</text></svg>