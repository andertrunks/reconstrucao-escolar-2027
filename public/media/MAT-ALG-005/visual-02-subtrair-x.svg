<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Subtrair x dos dois membros</title><desc id="d">Fluxo mostra três x mais dois igual a x mais dez transformando-se em dois x mais dois igual a dez após subtrair x dos dois lados.</desc><rect width="960" height="540" fill="white"/><text x="480" y="60" text-anchor="middle" font-size="30" font-family="Arial">3x + 2 = x + 10</text><text x="480" y="155" text-anchor="middle" font-size="24" font-family="Arial">subtrair x dos dois membros</text><path d="M480 180 L480 260" stroke="black" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="black"/></marker></defs><text x="480" y="320" text-anchor="middle" font-size="30" font-family="Arial">3x + 2 − x = x + 10 − x</text><text x="480" y="420" text-anchor="middle" font-size="34" font-family="Arial">2x + 2 = 10</text><text x="480" y="490" text-anchor="middle" font-size="21" font-family="Arial">x − x = 0; nada “atravessa” o sinal de igualdade.</text></svg>