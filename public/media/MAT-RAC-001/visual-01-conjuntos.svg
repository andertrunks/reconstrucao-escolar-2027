<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">NATURAIS, INTEIROS E RACIONAIS</title><desc id="desc">Cada ampliação inclui o conjunto anterior O que é racional: Pode ser escrito como fração de inteiros com divisor não nulo. a/b, com b ≠ 0. A barra indica divisão Conjuntos encaixados: Os naturais estão nos inteiros. Os inteiros estão nos racionais. N ⊂ Z ⊂ Q. Inclusão não elimina números Exemplos naturais: Um, dois e três são naturais. Também são inteiros e racionais. 2 = 2/1. Todo inteiro admite denominador 1 Exemplos inteiros: Menos dois é inteiro, mas não é natural na convenção usual. −2 = −2/1. Também é racional Além dos inteiros: Um meio e menos três quartos são racionais não inteiros. 1/2 e −3/4. Frações ampliam possibilidades Por que ampliar: Temperaturas e medidas podem ser negativas ou não inteiras. −0,5 e 1,25. Mesmo número, várias escritas</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">NATURAIS, INTEIROS E RACIONAIS</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Cada ampliação inclui o conjunto anterior</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">O que é racional</text><text x="45" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Pode ser escrito como fração</text><text x="45" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">de inteiros com divisor não nulo.</text><rect x="40" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">a/b, com b ≠ 0</text><text x="45" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">A barra indica divisão</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Conjuntos encaixados</text><ellipse cx="798" cy="365" rx="209" ry="127" fill="#d9effd" stroke="#1465a4" stroke-width="3"/><ellipse cx="796" cy="386" rx="144" ry="92" fill="#d6f4df" stroke="#088355" stroke-width="3"/><ellipse cx="796" cy="408" rx="72" ry="55" fill="#fff1cf" stroke="#ce7914" stroke-width="3"/><text x="616" y="297" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#114d83">Q: 1/2; −3/4</text><text x="685" y="357" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087044">Z: −2</text><text x="797" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#96570f">N</text><text x="797" y="435" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#96570f">1, 2</text><text x="960" y="475" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#1d3854">N ⊂ Z ⊂ Q</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Exemplos naturais</text><text x="1097" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Um, dois e três são naturais.</text><text x="1097" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Também são inteiros e racionais.</text><rect x="1092" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">2 = 2/1</text><text x="1097" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Todo inteiro admite denominador 1</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Exemplos inteiros</text><text x="45" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Menos dois é inteiro, mas não</text><text x="45" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">é natural na convenção usual.</text><rect x="40" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">−2 = −2/1</text><text x="45" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Também é racional</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Além dos inteiros</text><text x="571" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Um meio e menos três quartos</text><text x="571" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">são racionais não inteiros.</text><rect x="566" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">1/2 e −3/4</text><text x="571" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">Frações ampliam possibilidades</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Por que ampliar</text><text x="1097" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Temperaturas e medidas podem</text><text x="1097" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">ser negativas ou não inteiras.</text><rect x="1092" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">−0,5 e 1,25</text><text x="1097" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Mesmo número, várias escritas</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#3b526c">Reconstrução Escolar 2027 • MAT-RAC-001 • Infográfico autoral</text></svg>