<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">OPOSTO E VALOR ABSOLUTO</title><desc id="desc">A direção muda, mas a distância ao zero não Dois opostos: Opostos ficam em lados contrários à mesma distância do zero. −3/4 e +3/4. A soma dos opostos é zero Distâncias na reta: As duas setas partem do zero. Cada trecho mede três quartos. distância = 3/4. Mesma medida, sentidos opostos Valor absoluto: É a distância sem direção. Nunca é negativo. |−3/4| = 3/4. Distância até zero Do lado positivo: O número três quartos também está a três quartos de zero. |3/4| = 3/4. Ambos têm mesmo módulo Oposto não é inverso: O oposto muda o sinal. O inverso troca numerador e divisor. oposto de 3/4: −3/4. Não confunda com 4/3 Conclua: Sinal informa o lado da reta. Módulo mede apenas a distância. módulos iguais. Os números são diferentes</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">OPOSTO E VALOR ABSOLUTO</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">A direção muda, mas a distância ao zero não</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Dois opostos</text><text x="45" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Opostos ficam em lados contrários</text><text x="45" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">à mesma distância do zero.</text><rect x="40" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">−3/4 e +3/4</text><text x="45" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">A soma dos opostos é zero</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Distâncias na reta</text><line x1="570" y1="344" x2="1030" y2="344" stroke="#1b405f" stroke-width="4"/><path d="M1030 344l-11 -6v12z" fill="#1b405f"/><line x1="584" y1="332" x2="584" y2="357" stroke="#245a7b" stroke-width="2"/><text x="584" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−1</text><line x1="638" y1="332" x2="638" y2="357" stroke="#245a7b" stroke-width="2"/><text x="638" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−3/4</text><line x1="692" y1="332" x2="692" y2="357" stroke="#245a7b" stroke-width="2"/><text x="692" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−1/2</text><line x1="746" y1="332" x2="746" y2="357" stroke="#245a7b" stroke-width="2"/><text x="746" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−1/4</text><line x1="800" y1="332" x2="800" y2="357" stroke="#245a7b" stroke-width="2"/><text x="800" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">0</text><line x1="854" y1="332" x2="854" y2="357" stroke="#245a7b" stroke-width="2"/><text x="854" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">1/4</text><line x1="908" y1="332" x2="908" y2="357" stroke="#245a7b" stroke-width="2"/><text x="908" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">1/2</text><line x1="962" y1="332" x2="962" y2="357" stroke="#245a7b" stroke-width="2"/><text x="962" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">3/4</text><line x1="1016" y1="332" x2="1016" y2="357" stroke="#245a7b" stroke-width="2"/><text x="1016" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">1</text><circle cx="638" cy="344" r="10" fill="#fff" stroke="#0c72ae" stroke-width="3"/><text x="638" y="319" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#174e70">−3/4</text><rect x="953" y="335" width="18" height="18" fill="#f5ab34" stroke="#5f3975" stroke-width="2"/><text x="962" y="319" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#174e70">+3/4</text><text x="800" y="458" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#254761">Distância de cada ponto ao zero: 3/4</text><path d="M638 274H800M800 274H962" fill="none" stroke="#9a3e74" stroke-width="3" stroke-dasharray="5 4"/><text x="800" y="255" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#80365f">simetria em zero</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Valor absoluto</text><text x="1097" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">É a distância sem direção.</text><text x="1097" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Nunca é negativo.</text><rect x="1092" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">|−3/4| = 3/4</text><text x="1097" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Distância até zero</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Do lado positivo</text><text x="45" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">O número três quartos também</text><text x="45" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">está a três quartos de zero.</text><rect x="40" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">|3/4| = 3/4</text><text x="45" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Ambos têm mesmo módulo</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Oposto não é inverso</text><text x="571" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">O oposto muda o sinal.</text><text x="571" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">O inverso troca numerador e divisor.</text><rect x="566" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">oposto de 3/4: −3/4</text><text x="571" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">Não confunda com 4/3</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Conclua</text><text x="1097" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Sinal informa o lado da reta.</text><text x="1097" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Módulo mede apenas a distância.</text><rect x="1092" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">módulos iguais</text><text x="1097" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Os números são diferentes</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#3b526c">Reconstrução Escolar 2027 • MAT-RAC-001 • Infográfico autoral</text></svg>