<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">RACIONAIS NA RETA NUMÉRICA</title><desc id="desc">A ordem cresce da esquerda para a direita Escolha uma escala: As marcas devem representar intervalos de mesmo tamanho. passos de 1/2. Metades consecutivas Sete posições: A reta vai de menos três meios até três meios em passos iguais. −3/2 até 3/2. Zero fica no centro Os números negativos: −3/2 vem antes de −1. −1 vem antes de −1/2. −3/2 &lt; −1 &lt; −1/2. Mais à esquerda é menor Os positivos: Um meio fica à direita do zero. Um inteiro fica à direita de 1/2. 0 &lt; 1/2 &lt; 1. O sentido indica ordem Compare extremos: Menos três meios vale −1,5. Três meios vale +1,5. −1,5 &lt; +1,5. A distância ao zero é a mesma Regra geral: Para comparar quaisquer racionais, observe quem está mais à direita. direita = maior. O sinal negativo não inverte o eixo</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">RACIONAIS NA RETA NUMÉRICA</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">A ordem cresce da esquerda para a direita</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Escolha uma escala</text><text x="45" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">As marcas devem representar</text><text x="45" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">intervalos de mesmo tamanho.</text><rect x="40" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">passos de 1/2</text><text x="45" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Metades consecutivas</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Sete posições</text><line x1="570" y1="344" x2="1030" y2="344" stroke="#1b405f" stroke-width="4"/><path d="M1030 344l-11 -6v12z" fill="#1b405f"/><line x1="584" y1="332" x2="584" y2="357" stroke="#245a7b" stroke-width="2"/><text x="584" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−3/2</text><line x1="656" y1="332" x2="656" y2="357" stroke="#245a7b" stroke-width="2"/><text x="656" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−1</text><line x1="728" y1="332" x2="728" y2="357" stroke="#245a7b" stroke-width="2"/><text x="728" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−1/2</text><line x1="800" y1="332" x2="800" y2="357" stroke="#245a7b" stroke-width="2"/><text x="800" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">0</text><line x1="872" y1="332" x2="872" y2="357" stroke="#245a7b" stroke-width="2"/><text x="872" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">1/2</text><line x1="944" y1="332" x2="944" y2="357" stroke="#245a7b" stroke-width="2"/><text x="944" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">1</text><line x1="1016" y1="332" x2="1016" y2="357" stroke="#245a7b" stroke-width="2"/><text x="1016" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">3/2</text><circle cx="800" cy="344" r="10" fill="#fff" stroke="#0c72ae" stroke-width="3"/><text x="800" y="319" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#174e70">zero</text><text x="800" y="458" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#254761">Da esquerda para a direita: maior</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Os números negativos</text><text x="1097" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">−3/2 vem antes de −1.</text><text x="1097" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">−1 vem antes de −1/2.</text><rect x="1092" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">−3/2 &lt; −1 &lt; −1/2</text><text x="1097" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Mais à esquerda é menor</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Os positivos</text><text x="45" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Um meio fica à direita do zero.</text><text x="45" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Um inteiro fica à direita de 1/2.</text><rect x="40" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">0 &lt; 1/2 &lt; 1</text><text x="45" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">O sentido indica ordem</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Compare extremos</text><text x="571" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Menos três meios vale −1,5.</text><text x="571" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Três meios vale +1,5.</text><rect x="566" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">−1,5 &lt; +1,5</text><text x="571" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">A distância ao zero é a mesma</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Regra geral</text><text x="1097" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Para comparar quaisquer racionais,</text><text x="1097" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">observe quem está mais à direita.</text><rect x="1092" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">direita = maior</text><text x="1097" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">O sinal negativo não inverte o eixo</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#3b526c">Reconstrução Escolar 2027 • MAT-RAC-001 • Infográfico autoral</text></svg>