<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Reta numérica com racionais negativos e positivos</title>
<desc id="desc">Reta de menos três meios a três meios com marcas em menos três meios, menos um, menos um meio, zero, um meio, um e três meios. Os números aumentam para a direita.</desc>
<rect width="900" height="430" fill="white"/>
<text x="450" y="50" text-anchor="middle" font-size="28" font-family="Arial">Racionais na reta numérica</text>
<line x1="90" y1="220" x2="810" y2="220" stroke="black" stroke-width="4"/>
<polygon points="820,220 798,207 798,233" fill="black"/>
<text x="715" y="155" font-size="20" font-family="Arial">maiores →</text>
<g stroke="black" stroke-width="3">
<line x1="110" y1="200" x2="110" y2="240"/><line x1="223" y1="200" x2="223" y2="240"/>
<line x1="337" y1="200" x2="337" y2="240"/><line x1="450" y1="194" x2="450" y2="246"/>
<line x1="563" y1="200" x2="563" y2="240"/><line x1="677" y1="200" x2="677" y2="240"/>
<line x1="790" y1="200" x2="790" y2="240"/>
</g>
<g font-family="Arial" font-size="22" text-anchor="middle">
<text x="110" y="280">−3/2</text><text x="223" y="280">−1</text><text x="337" y="280">−1/2</text>
<text x="450" y="280">0</text><text x="563" y="280">1/2</text><text x="677" y="280">1</text><text x="790" y="280">3/2</text>
</g>
<text x="450" y="355" text-anchor="middle" font-size="23" font-family="Arial">Quanto mais à direita, maior é o número.</text>
</svg>
