<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Representações equivalentes ocupam o mesmo ponto</title>
<desc id="desc">Na reta, menos um meio, menos dois quartos e menos zero vírgula cinco aparecem no mesmo ponto; um meio, dois quartos e zero vírgula cinco também aparecem no mesmo ponto.</desc>
<rect width="900" height="470" fill="white"/>
<text x="450" y="48" text-anchor="middle" font-size="28" font-family="Arial">Escritas diferentes, mesmo número</text>
<line x1="130" y1="240" x2="770" y2="240" stroke="black" stroke-width="4"/>
<g stroke="black" stroke-width="3"><line x1="250" y1="215" x2="250" y2="265"/><line x1="450" y1="210" x2="450" y2="270"/><line x1="650" y1="215" x2="650" y2="265"/></g>
<circle cx="250" cy="240" r="10" fill="white" stroke="black" stroke-width="4"/>
<circle cx="650" cy="240" r="10" fill="white" stroke="black" stroke-width="4"/>
<text x="250" y="305" text-anchor="middle" font-size="22" font-family="Arial">−1/2 = −2/4 = −0,5</text>
<text x="450" y="305" text-anchor="middle" font-size="22" font-family="Arial">0</text>
<text x="650" y="305" text-anchor="middle" font-size="22" font-family="Arial">1/2 = 2/4 = 0,5</text>
<text x="250" y="165" text-anchor="middle" font-size="20" font-family="Arial">um único ponto</text>
<text x="650" y="165" text-anchor="middle" font-size="20" font-family="Arial">um único ponto</text>
<text x="450" y="395" text-anchor="middle" font-size="22" font-family="Arial">A representação muda; a posição e o valor permanecem.</text>
</svg>
