<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">ESCRITAS DIFERENTES, MESMO PONTO</title><desc id="desc">Frações equivalentes e decimais coincidem na reta O mesmo negativo: Menos um meio corresponde a menos dois quartos. −1/2 = −2/4. Ambos representam −0,5 O mesmo positivo: Um meio e dois quartos correspondem a 0,5. 1/2 = 2/4 = 0,5. Mudar escrita não muda valor Veja na reta: Os negativos ficam à esquerda. Os positivos ficam à direita. −0,5 &lt; 0 &lt; 0,5. Cada trio aponta para um ponto Por que é equivalente: Multiplicar numerador e divisor pelo mesmo não nulo conserva valor. 1/2 = (1×2)/(2×2). Aqui multiplicamos ambos por 2 A reta confirma: −1/2, −2/4 e −0,5 ocupam exatamente a mesma posição. um ponto, três formas. Não crie marcas diferentes Armadilha frequente: As escritas não são três números. São três representações iguais. −1/2 = −0,5. Valor e representação diferem</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">ESCRITAS DIFERENTES, MESMO PONTO</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Frações equivalentes e decimais coincidem na reta</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">O mesmo negativo</text><text x="45" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Menos um meio corresponde</text><text x="45" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">a menos dois quartos.</text><rect x="40" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">−1/2 = −2/4</text><text x="45" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Ambos representam −0,5</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">O mesmo positivo</text><text x="571" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Um meio e dois quartos</text><text x="571" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">correspondem a 0,5.</text><rect x="566" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">1/2 = 2/4 = 0,5</text><text x="571" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e54">Mudar escrita não muda valor</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Veja na reta</text><line x1="1096" y1="344" x2="1556" y2="344" stroke="#1b405f" stroke-width="4"/><path d="M1556 344l-11 -6v12z" fill="#1b405f"/><line x1="1110" y1="332" x2="1110" y2="357" stroke="#245a7b" stroke-width="2"/><text x="1110" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−1</text><line x1="1218" y1="332" x2="1218" y2="357" stroke="#245a7b" stroke-width="2"/><text x="1218" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">−1/2</text><line x1="1326" y1="332" x2="1326" y2="357" stroke="#245a7b" stroke-width="2"/><text x="1326" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">0</text><line x1="1434" y1="332" x2="1434" y2="357" stroke="#245a7b" stroke-width="2"/><text x="1434" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">1/2</text><line x1="1542" y1="332" x2="1542" y2="357" stroke="#245a7b" stroke-width="2"/><text x="1542" y="383" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#1e3d56">1</text><circle cx="1218" cy="344" r="10" fill="#fff" stroke="#0c72ae" stroke-width="3"/><text x="1218" y="319" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#174e70">−0,5</text><rect x="1425" y="335" width="18" height="18" fill="#f5ab34" stroke="#5f3975" stroke-width="2"/><text x="1434" y="319" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#174e70">+0,5</text><text x="1326" y="458" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#254761">Mesmo ponto = representações iguais</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Por que é equivalente</text><text x="45" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Multiplicar numerador e divisor</text><text x="45" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">pelo mesmo não nulo conserva valor.</text><rect x="40" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">1/2 = (1×2)/(2×2)</text><text x="45" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Aqui multiplicamos ambos por 2</text><rect x="546"