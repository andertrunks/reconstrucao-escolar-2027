<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Depois de não significa por causa de</title><desc id="d">Compara sequência temporal com relação causal comprovada.</desc><text x="450" y="50" text-anchor="middle" font-size="30">TEMPO ≠ CAUSA</text><rect x="55" y="100" width="355" height="245" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><rect x="490" y="100" width="355" height="245" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><text x="232" y="145" text-anchor="middle" font-size="25">SEQUÊNCIA</text><text x="667" y="145" text-anchor="middle" font-size="25">CAUSALIDADE</text><text x="115" y="215" font-size="22">A acontece</text><text x="300" y="215" font-size="22">B acontece</text><path d="M215 205h70" stroke="currentColor" stroke-width="4"/><text x="232" y="270" text-anchor="middle" font-size="20">Só sabemos a ordem.</text><text x="545" y="215" font-size="22">A</text><text x="735" y="215" font-size="22">B</text><path d="M580 205h135" stroke="currentColor" stroke-width="4"/><text x="647" y="190" text-anchor="middle" font-size="18">evidência de causa</text><text x="667" y="270" text-anchor="middle" font-size="20">O texto liga A a B.</text><text x="450" y="400" text-anchor="middle" font-size="23">“Depois de” não autoriza automaticamente “por causa de”.</text></svg>