<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Auditoria de uma inferência</title><desc id="d">Checklist de cinco perguntas para verificar uma inferência.</desc><text x="450" y="55" text-anchor="middle" font-size="30">AUDITORIA DA INFERÊNCIA</text><g font-size="22"><text x="95" y="125">□ Há pista textual identificável?</text><text x="95" y="190">□ A conclusão evita contradições?</text><text x="95" y="255">□ O grau de certeza foi preservado?</text><text x="95" y="320">□ “Alguns”, “todos”, “pode” e negações foram respeitados?</text><text x="95" y="385">□ Evitei acrescentar fatos específicos não fornecidos?</text></g><rect x="55" y="80" width="790" height="340" rx="20" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="465" text-anchor="middle" font-size="23">Se a resposta falha no texto, revise a conclusão.</text></svg>