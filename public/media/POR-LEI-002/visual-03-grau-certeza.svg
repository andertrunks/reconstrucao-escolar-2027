<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Grau de certeza da conclusão</title><desc id="d">Quatro níveis de força: afirmado, necessário, provável e apenas possível.</desc><text x="450" y="55" text-anchor="middle" font-size="30">GRAU DE CERTEZA</text><line x1="120" y1="220" x2="780" y2="220" stroke="currentColor" stroke-width="5"/><g font-size="21" text-anchor="middle"><text x="130" y="165">Afirmado</text><text x="340" y="165">Necessário</text><text x="560" y="165">Provável</text><text x="770" y="165">Possível</text><text x="130" y="275">“o texto diz”</text><text x="340" y="275">“decorre das pistas”</text><text x="560" y="275">“indica / sugere”</text><text x="770" y="275">“talvez”</text></g><g fill="white" stroke="currentColor" stroke-width="3"><circle cx="130" cy="220" r="14"/><circle cx="340" cy="220" r="14"/><circle cx="560" cy="220" r="14"/><circle cx="770" cy="220" r="14"/></g><text x="450" y="365" text-anchor="middle" font-size="23">Não transforme possibilidade em certeza.</text></svg>