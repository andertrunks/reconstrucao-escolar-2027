<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<title>Composição: equilíbrio, ênfase, contraste e ritmo</title><desc>Quatro quadros demonstram relações compositivas.</desc>
<rect width="960" height="540" fill="#ffffff"/>
<style>
text{font-family:Arial,sans-serif;fill:#111827} .box{fill:#f8fafc;stroke:#334155;stroke-width:2} .strong{fill:#e2e8f0;stroke:#0f172a;stroke-width:3} .line{stroke:#334155;stroke-width:3;fill:none} .thin{stroke:#64748b;stroke-width:2;fill:none} .dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:8 7} .label{font-size:22px;font-weight:700} .small{font-size:17px} .tiny{font-size:14px} .note{font-size:18px;font-weight:600}
</style><text x="480" y="40" text-anchor="middle" class="label">COMPOSIÇÃO: RELAÇÕES ENTRE AS PARTES</text><rect x="55" y="90" width="190" height="330" rx="14" class="box"/><text x="150" y="125" text-anchor="middle" class="small" font-weight="700">EQUILÍBRIO</text><rect x="285" y="90" width="190" height="330" rx="14" class="box"/><text x="380" y="125" text-anchor="middle" class="small" font-weight="700">ÊNFASE</text><rect x="515" y="90" width="190" height="330" rx="14" class="box"/><text x="610" y="125" text-anchor="middle" class="small" font-weight="700">CONTRASTE</text><rect x="745" y="90" width="190" height="330" rx="14" class="box"/><text x="840" y="125" text-anchor="middle" class="small" font-weight="700">RITMO</text><!-- balance --><circle cx="105" cy="240" r="28" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle cx="195" cy="240" r="28" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><line x1="90" y1="310" x2="210" y2="310" class="line"/><line x1="150" y1="310" x2="150" y2="350" class="line"/>
<!-- emphasis --><circle cx="325" cy="260" r="16" fill="#cbd5e1"/><circle cx="365" cy="260" r="16" fill="#cbd5e1"/><circle cx="405" cy="260" r="16" fill="#cbd5e1"/><polygon points="455,210 485,270 425,270" fill="#111827"/>
<!-- contrast --><rect x="550" y="185" width="55" height="55" fill="#111827"/><rect x="625" y="165" width="100" height="100" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="640" y="330" text-anchor="middle" class="tiny">diferença de tamanho</text><text x="640" y="350" text-anchor="middle" class="tiny">e de valor</text>
<!-- rhythm --><circle cx="785" cy="210" r="16" fill="#334155"/><rect x="820" y="194" width="32" height="32" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><circle cx="875" cy="210" r="16" fill="#334155"/><rect x="900" y="194" width="32" height="32" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><circle cx="785" cy="290" r="16" fill="#334155"/><rect x="820" y="274" width="32" height="32" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><circle cx="875" cy="290" r="16" fill="#334155"/><rect x="900" y="274" width="32" height="32" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="480" y="485" text-anchor="middle" class="note">Posição, tamanho, repetição e diferença organizam o percurso do olhar.</text></svg>