<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<title>Elementos básicos da linguagem visual</title><desc>Painel com exemplos rotulados de elementos visuais.</desc>
<rect width="960" height="540" fill="#ffffff"/>
<style>
text{font-family:Arial,sans-serif;fill:#111827} .box{fill:#f8fafc;stroke:#334155;stroke-width:2} .strong{fill:#e2e8f0;stroke:#0f172a;stroke-width:3} .line{stroke:#334155;stroke-width:3;fill:none} .thin{stroke:#64748b;stroke-width:2;fill:none} .dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:8 7} .label{font-size:22px;font-weight:700} .small{font-size:17px} .tiny{font-size:14px} .note{font-size:18px;font-weight:600}
</style><text x="480" y="40" text-anchor="middle" class="label">ELEMENTOS BÁSICOS DA LINGUAGEM VISUAL</text>
<rect x="75" y="80" width="180" height="160" rx="12" class="box"/><text x="165" y="110" text-anchor="middle" class="small" font-weight="700">PONTO</text><rect x="305" y="80" width="180" height="160" rx="12" class="box"/><text x="395" y="110" text-anchor="middle" class="small" font-weight="700">LINHA</text><rect x="535" y="80" width="180" height="160" rx="12" class="box"/><text x="625" y="110" text-anchor="middle" class="small" font-weight="700">FORMA</text><rect x="765" y="80" width="180" height="160" rx="12" class="box"/><text x="855" y="110" text-anchor="middle" class="small" font-weight="700">VOLUME</text><rect x="75" y="290" width="180" height="160" rx="12" class="box"/><text x="165" y="320" text-anchor="middle" class="small" font-weight="700">CLARO / ESCURO</text><rect x="305" y="290" width="180" height="160" rx="12" class="box"/><text x="395" y="320" text-anchor="middle" class="small" font-weight="700">TEXTURA</text><rect x="535" y="290" width="180" height="160" rx="12" class="box"/><text x="625" y="320" text-anchor="middle" class="small" font-weight="700">ESPAÇO</text><rect x="765" y="290" width="180" height="160" rx="12" class="box"/><text x="855" y="320" text-anchor="middle" class="small" font-weight="700">ESCALA</text><circle cx="165" cy="165" r="12" fill="#111827"/><circle cx="140" cy="195" r="6" fill="#111827"/><circle cx="190" cy="195" r="6" fill="#111827"/>
<path d="M330 175 Q380 120 430 175 T480 175" class="line"/>
<rect x="580" y="135" width="70" height="70" fill="none" stroke="#334155" stroke-width="4"/>
<polygon points="835,205 875,135 915,205" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<rect x="100" y="345" width="65" height="65" fill="#111827"/><rect x="165" y="345" width="65" height="65" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<path d="M330 345 l20 20 l20 -20 l20 20 l20 -20 l20 20 l20 -20" class="line"/><path d="M330 390 l20 -20 l20 20 l20 -20 l20 20 l20 -20 l20 20" class="thin"/>
<rect x="565" y="345" width="70" height="70" fill="none" stroke="#334155" stroke-width="2"/><rect x="595" y="375" width="70" height="70" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<circle cx="815" cy="395" r="16" fill="#334155"/><circle cx="875" cy="385" r="42" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="480" y="505" text-anchor="middle" class="note">Os elementos ganham sentido pelas relações no conjunto e pelo contexto.</text></svg>