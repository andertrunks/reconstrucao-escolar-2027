<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<title>Leitura de obra baseada em evidências</title><desc>Fluxo de seis etapas de leitura e relação entre obra, contexto e público.</desc>
<rect width="960" height="540" fill="#ffffff"/>
<style>
text{font-family:Arial,sans-serif;fill:#111827} .box{fill:#f8fafc;stroke:#334155;stroke-width:2} .strong{fill:#e2e8f0;stroke:#0f172a;stroke-width:3} .line{stroke:#334155;stroke-width:3;fill:none} .thin{stroke:#64748b;stroke-width:2;fill:none} .dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:8 7} .label{font-size:22px;font-weight:700} .small{font-size:17px} .tiny{font-size:14px} .note{font-size:18px;font-weight:600}
</style><text x="480" y="40" text-anchor="middle" class="label">LEITURA DE OBRA BASEADA EM EVIDÊNCIAS</text><rect x="35" y="90" width="120" height="72" rx="12" class="box"/><text x="95" y="133" text-anchor="middle" class="tiny" font-weight="700">1. OBSERVAR</text><path d="M155 126 L186 126" class="line"/><polygon points="186,126 176,120 176,132" fill="#334155"/><rect x="190" y="90" width="120" height="72" rx="12" class="box"/><text x="250" y="133" text-anchor="middle" class="tiny" font-weight="700">2. DESCREVER</text><path d="M310 126 L341 126" class="line"/><polygon points="341,126 331,120 331,132" fill="#334155"/><rect x="345" y="90" width="120" height="72" rx="12" class="box"/><text x="405" y="133" text-anchor="middle" class="tiny" font-weight="700">3. EVIDÊNCIA</text><path d="M465 126 L496 126" class="line"/><polygon points="496,126 486,120 486,132" fill="#334155"/><rect x="500" y="90" width="120" height="72" rx="12" class="box"/><text x="560" y="133" text-anchor="middle" class="tiny" font-weight="700">4. CONTEXTO</text><path d="M620 126 L651 126" class="line"/><polygon points="651,126 641,120 641,132" fill="#334155"/><rect x="655" y="90" width="120" height="72" rx="12" class="box"/><text x="715" y="133" text-anchor="middle" class="tiny" font-weight="700">5. INTERPRETAR</text><path d="M775 126 L806 126" class="line"/><polygon points="806,126 796,120 796,132" fill="#334155"/><rect x="810" y="90" width="120" height="72" rx="12" class="box"/><text x="870" y="133" text-anchor="middle" class="tiny" font-weight="700">6. REVISAR</text><text x="480" y="205" text-anchor="middle" class="note">A interpretação é hipótese argumentada, não chute.</text>
<!-- triangle -->
<polygon points="480,265 295,445 665,445" fill="none" stroke="#64748b" stroke-width="3"/>
<circle cx="480" cy="265" r="58" class="strong"/><text x="480" y="272" text-anchor="middle" class="label">OBRA</text>
<circle cx="295" cy="445" r="58" class="box"/><text x="295" y="452" text-anchor="middle" class="small" font-weight="700">CONTEXTO</text>
<circle cx="665" cy="445" r="58" class="box"/><text x="665" y="452" text-anchor="middle" class="small" font-weight="700">PÚBLICO</text>
<text x="480" y="380" text-anchor="middle" class="small">relacionar forma, material, circulação e recepção</text>
<text x="480" y="520" text-anchor="middle" class="note">Revisar é parte do método quando novas evidências aparecem.</text></svg>