<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" width="1120" height="420" viewBox="0 0 1120 420"><title id="tt">Confirmatório versus exploratório</title><desc id="dd">O plano confirmatório fixa hipóteses, alvos, métricas e critérios antes do resultado. Ideias posteriores são relatadas separadamente como análise exploratória.</desc><style>text{font-family:Arial,sans-serif;fill:#182b3f} .h{font-size:25px;font-weight:bold}.t{font-size:19px}.s{font-size:16px}.small{font-size:14px}.box{fill:#eff5fa;stroke:#1d4566;stroke-width:2}.warn{fill:#fff2e8;stroke:#904820;stroke-width:2}.new{fill:#eaf7ef;stroke:#276d48;stroke-width:2}.arr{stroke:#2e455d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e455d"/></marker></defs><rect width="1120" height="420" fill="white"/><text x="38" y="44" class="h">Confirmatório versus exploratório</text><rect x="58" y="105" width="440" height="158" rx="13" class="new"/><text x="74" y="136" class="t">Confirmatório</text><text x="74" y="160" class="t">Plano anterior ao observado</text><text x="74" y="184" class="t">Relatório com denominador</text><rect x="628" y="105" width="440" height="158" rx="13" class="warn"/><text x="644" y="136" class="t">Exploratório</text><text x="644" y="160" class="t">Nova hipótese após resultado</text><text x="644" y="184" class="t">Relatório separado, identificado</text><text x="85" y="326" class="t">Não rebatizar uma descoberta posterior como hipótese registrada antes.</text></svg>