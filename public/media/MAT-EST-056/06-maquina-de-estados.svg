<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" width="1120" height="420" viewBox="0 0 1120 420"><title id="tt">Estados do protocolo sucessor</title><desc id="dd">O protocolo começa como desenho local; pode ser externamente registrado, receber alvos elegíveis, ser auditado e encaminhado a decisão humana. Atualmente está apenas em desenho local.</desc><style>text{font-family:Arial,sans-serif;fill:#182b3f} .h{font-size:25px;font-weight:bold}.t{font-size:19px}.s{font-size:16px}.small{font-size:14px}.box{fill:#eff5fa;stroke:#1d4566;stroke-width:2}.warn{fill:#fff2e8;stroke:#904820;stroke-width:2}.new{fill:#eaf7ef;stroke:#276d48;stroke-width:2}.arr{stroke:#2e455d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e455d"/></marker></defs><rect width="1120" height="420" fill="white"/><text x="38" y="44" class="h">Estados do protocolo sucessor</text><rect x="24" y="116" width="235" height="107" rx="13" class="warn"/><text x="40" y="147" class="t">Rascunho local</text><text x="40" y="171" class="t">ATUAL</text><path class="arr" d="M267 168 L287 168"/><rect x="292" y="116" width="232" height="107" rx="13" class="box"/><text x="308" y="147" class="t">Registro externo</text><text x="308" y="171" class="t">PENDENTE</text><path class="arr" d="M530 168 L550 168"/><rect x="555" y="116" width="237" height="107" rx="13" class="box"/><text x="571" y="147" class="t">Emissões elegíveis</text><text x="571" y="171" class="t">PENDENTE</text><path class="arr" d="M797 168 L817 168"/><rect x="822" y="116" width="272" height="107" rx="13" class="box"/><text x="838" y="147" class="t">Avaliação / decisão</text><text x="838" y="171" class="t">PENDENTE</text><text x="40" y="310" class="t">Hash local sem depósito externo não comprova pré-registro autenticado.</text></svg>