<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Índices sazonais em dois ciclos</title><desc id="desc">Gráfico de barras pareadas para os efeitos de cada trimestre, em unidades, com linha zero.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193948}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#4b636f;stroke-width:2;fill:none}.blue{stroke:#126c87;stroke-width:3;fill:none}.orange{stroke:#aa6718;stroke-width:3;fill:none}.green{stroke:#37785d;stroke-width:3;fill:none}.pale{fill:#e4f1f6;stroke:#17758c;stroke-width:1.5}.warm{fill:#fff0d9;stroke:#a66b22;stroke-width:1.5}.neutral{fill:#eef0f2;stroke:#73848d;stroke-width:1.5}.circleblue{fill:#126c87}.circleorange{fill:#aa6718}.circlegreen{fill:#37785d}.gridline{stroke:#e0e6e9;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" text-anchor="start" class="title">Índices sazonais em dois ciclos</text><text x="34" y="82" text-anchor="start" class="label">Índices do primeiro e do segundo ciclo: comparar cada trimestre com seu equivalente.</text><line x1="74" y1="316" x2="900" y2="316" class="axis"/><text x="38" y="321" text-anchor="start" class="small">0</text><text x="34" y="124" text-anchor="start" class="small">índice sazonal (unidades)</text><rect x="140" y="316" width="34" height="67.0" fill="#126c87"/><rect x="186" y="316" width="34" height="65.66000000000001" fill="#aa6718"/><text x="180" y="416" text-anchor="middle" class="small">Trimestre 1</text><text x="157" y="399.0" text-anchor="middle" class="tiny">-10</text><text x="203" y="397.66" text-anchor="middle" class="tiny">-9.80</text><rect x="335" y="302.6" width="34" height="13.4" fill="#126c87"/><rect x="381" y="307.1024" width="34" height="8.897600000000006" fill="#aa6718"/><text x="375" y="416" text-anchor="middle" class="small">Trimestre 2</text><text x="352" y="295.6" text-anchor="middle" class="tiny">+2</text><text x="398" y="300.1024" text-anchor="middle" class="tiny">+1.33</text><rect x="530" y="195.39999999999998" width="34" height="120.60000000000001" fill="#126c87"/><rect x="576" y="191.661936" width="34" height="124.338064" fill="#aa6718"/><text x="570" y="416" text-anchor="middle" class="small">Trimestre 3</text><text x="547" y="188.39999999999998" text-anchor="middle" class="tiny">+18</text><text x="593" y="184.661936" text-anchor="middle" class="tiny">+18.56</text><rect x="725" y="316" width="34" height="67.0" fill="#126c87"/><rect x="771" y="316" width="34" height="64.41789504" fill="#aa6718"/><text x="765" y="416" text-anchor="middle" class="small">Trimestre 4</text><text x="742" y="399.0" text-anchor="middle" class="tiny">-10</text><text x="788" y="396.41789504" text-anchor="middle" class="tiny">-9.61</text><rect x="55" y="445" width="14" height="12" fill="#126c87"/><text x="77" y="456" text-anchor="start" class="small">Primeiro ciclo</text><rect x="235" y="445" width="14" height="12" fill="#aa6718"/><text x="257" y="456" text-anchor="start" class="small">Segundo ciclo</text></svg>