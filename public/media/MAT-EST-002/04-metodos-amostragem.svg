<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Quatro desenhos probabilísticos introdutórios</title><desc id="desc">Quatro painéis resumem aleatória simples, sistemática, estratificada e conglomerados.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111} .h{font-size:30px;font-weight:bold} .s{font-size:22px} .m{font-size:18px} .box{fill:#f7f7f7;stroke:#222;stroke-width:2} .sel{fill:#e5e5e5;stroke:#111;stroke-width:3} .line{stroke:#222;stroke-width:3;fill:none}</style><text x="500" y="42" text-anchor="middle" class="h">Quatro desenhos probabilísticos introdutórios</text><rect x="50" y="90" width="430" height="200" rx="16" class="box"/><text x="265" y="125" text-anchor="middle" class="s">Aleatória simples</text><text x="80" y="170" class="m">Sorteio direto de unidades no cadastro.</text><text x="80" y="210" class="m">Ex.: 5 números distintos entre 1 e 40.</text><rect x="520" y="90" width="430" height="200" rx="16" class="box"/><text x="735" y="125" text-anchor="middle" class="s">Sistemática</text><text x="550" y="170" class="m">Início aleatório + passo regular.</text><text x="550" y="210" class="m">Ex.: 7, 17, 27, 37...</text><rect x="50" y="330" width="430" height="200" rx="16" class="box"/><text x="265" y="365" text-anchor="middle" class="s">Estratificada</text><text x="80" y="410" class="m">Dividir em estratos e amostrar em cada um.</text><text x="80" y="450" class="m">Ex.: selecionar dentro de todas as séries.</text><rect x="520" y="330" width="430" height="200" rx="16" class="box"/><text x="735" y="365" text-anchor="middle" class="s">Conglomerados</text><text x="550" y="410" class="m">Selecionar alguns grupos naturais.</text><text x="550" y="450" class="m">Ex.: sortear turmas e entrevistar alunos.</text><text x="500" y="585" text-anchor="middle" class="m">Métodos diferentes respondem a estruturas e custos diferentes.</text></svg>