<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Probabilística versus não probabilística</title><desc id="desc">Dois caminhos: mecanismo aleatório conhecido e seleção por conveniência ou voluntários.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111} .h{font-size:30px;font-weight:bold} .s{font-size:22px} .m{font-size:18px} .box{fill:#f7f7f7;stroke:#222;stroke-width:2} .sel{fill:#e5e5e5;stroke:#111;stroke-width:3} .line{stroke:#222;stroke-width:3;fill:none}</style><text x="500" y="48" text-anchor="middle" class="h">Mecanismo de seleção</text><rect x="390" y="90" width="220" height="70" rx="12" class="box"/><text x="500" y="133" text-anchor="middle" class="s">Marco amostral</text><path d="M500 160 L290 250" class="line"/><path d="M500 160 L710 250" class="line"/><rect x="90" y="250" width="400" height="220" rx="18" class="box"/><text x="290" y="292" text-anchor="middle" class="s">Probabilística</text><text x="120" y="335" class="m">• mecanismo aleatório documentado</text><text x="120" y="375" class="m">• probabilidades de inclusão conhecidas</text><text x="120" y="415" class="m">• base para inferência de desenho</text><rect x="510" y="250" width="400" height="220" rx="18" class="box"/><text x="710" y="292" text-anchor="middle" class="s">Não probabilística</text><text x="540" y="335" class="m">• conveniência ou voluntários</text><text x="540" y="375" class="m">• inclusão sem probabilidade conhecida</text><text x="540" y="415" class="m">• generalização exige cautela</text><text x="500" y="555" text-anchor="middle" class="m">O ponto central é como a unidade entra na amostra.</text></svg>