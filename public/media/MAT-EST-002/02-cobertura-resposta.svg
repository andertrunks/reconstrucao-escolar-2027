<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Da população ao conjunto respondente</title><desc id="desc">Caixas aninhadas mostram população-alvo, marco amostral, selecionados e respondentes.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111} .h{font-size:30px;font-weight:bold} .s{font-size:22px} .m{font-size:18px} .box{fill:#f7f7f7;stroke:#222;stroke-width:2} .sel{fill:#e5e5e5;stroke:#111;stroke-width:3} .line{stroke:#222;stroke-width:3;fill:none}</style><text x="500" y="48" text-anchor="middle" class="h">Da população ao conjunto respondente</text><rect x="80" y="120" width="840" height="390" rx="24" class="box"/><text x="105" y="155" class="s">População-alvo</text><rect x="160" y="185" width="680" height="280" rx="20" class="box"/><text x="185" y="220" class="s">Marco amostral</text><rect x="270" y="250" width="460" height="170" rx="18" class="box"/><text x="295" y="285" class="s">Selecionados</text><rect x="390" y="315" width="220" height="75" rx="14" class="sel"/><text x="500" y="360" text-anchor="middle" class="s">Respondentes</text><text x="500" y="555" text-anchor="middle" class="m">Cobertura, seleção e não resposta alteram quem aparece nos dados.</text></svg>