<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Fontes de erro em uma pesquisa</title><desc id="desc">Cinco cartões distinguem erro amostral, cobertura, não resposta, medição e processamento.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111} .h{font-size:30px;font-weight:bold} .s{font-size:22px} .m{font-size:18px} .box{fill:#f7f7f7;stroke:#222;stroke-width:2} .sel{fill:#e5e5e5;stroke:#111;stroke-width:3} .line{stroke:#222;stroke-width:3;fill:none}</style><text x="500" y="45" text-anchor="middle" class="h">Fontes de erro em uma pesquisa</text><rect x="65" y="100" width="270" height="130" rx="14" class="box"/><text x="200" y="140" text-anchor="middle" class="s">Erro amostral</text><text x="95" y="185" class="m">Variação entre amostras.</text><rect x="365" y="100" width="270" height="130" rx="14" class="box"/><text x="500" y="140" text-anchor="middle" class="s">Cobertura</text><text x="395" y="185" class="m">Cadastro não cobre o alvo.</text><rect x="665" y="100" width="270" height="130" rx="14" class="box"/><text x="800" y="140" text-anchor="middle" class="s">Não resposta</text><text x="695" y="185" class="m">Selecionados não respondem.</text><rect x="200" y="300" width="270" height="130" rx="14" class="box"/><text x="335" y="340" text-anchor="middle" class="s">Medição</text><text x="230" y="385" class="m">Pergunta ou instrumento falha.</text><rect x="530" y="300" width="270" height="130" rx="14" class="box"/><text x="665" y="340" text-anchor="middle" class="s">Processamento</text><text x="560" y="385" class="m">Digitação, codificação, cálculo.</text><text x="500" y="525" text-anchor="middle" class="m">Aumentar n não elimina automaticamente os outros erros.</text></svg>