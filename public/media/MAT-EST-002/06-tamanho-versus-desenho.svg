<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Tamanho versus desenho</title><desc id="desc">Compara amostra grande e seletiva com amostra menor baseada em cadastro e seleção probabilística.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111} .h{font-size:30px;font-weight:bold} .s{font-size:22px} .m{font-size:18px} .box{fill:#f7f7f7;stroke:#222;stroke-width:2} .sel{fill:#e5e5e5;stroke:#111;stroke-width:3} .line{stroke:#222;stroke-width:3;fill:none}</style><text x="500" y="45" text-anchor="middle" class="h">Tamanho da amostra não corrige um desenho enviesado</text><rect x="60" y="110" width="410" height="360" rx="18" class="box"/><text x="265" y="150" text-anchor="middle" class="s">Amostra A: 2.000 respostas</text><text x="95" y="205" class="m">Coleta apenas no estacionamento.</text><text x="95" y="245" class="m">Grupo acessível favorece automóveis.</text><text x="95" y="310" class="s">Grande</text><text x="95" y="350" class="s">mas seletiva</text><rect x="530" y="110" width="410" height="360" rx="18" class="box"/><text x="735" y="150" text-anchor="middle" class="s">Amostra B: 400 respostas</text><text x="565" y="205" class="m">Cadastro cobre setores e turnos.</text><text x="565" y="245" class="m">Seleção probabilística documentada.</text><text x="565" y="310" class="s">Menor</text><text x="565" y="350" class="s">com desenho defendido</text><text x="500" y="555" text-anchor="middle" class="m">Comparar tamanho e mecanismo de seleção como dimensões diferentes.</text></svg>