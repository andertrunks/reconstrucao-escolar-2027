<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc"><title id="title">Figura 1 — Estados de uma tarefa auditável</title><desc id="desc">Uma tarefa começa planejada, precisa de previsão autenticada, recebe observação com qualidade conferida e só então pode gerar par avaliável.</desc>
<rect width="1440" height="440" fill="#f7f9fc"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="29" fill="#18212d" font-weight="bold">Figura 1 — Estados de uma tarefa auditável</text>
<rect x="40.0" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="170.4" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Planejar</text>
<text x="170.4" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">origem e horizonte</text>
<text x="307.8" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="314.8" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="445.2" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Emitir</text>
<text x="445.2" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">antes de saber alvo</text>
<text x="582.6" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="589.6" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="720.0" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Receber</text>
<text x="720.0" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">valor ou atraso</text>
<text x="857.4" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="864.4" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="994.8" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Validar</text>
<text x="994.8" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">fonte e versão</text>
<text x="1132.2" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="1139.2" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="1269.6" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Parear</text>
<text x="1269.6" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">mesmo alvo</text>
<text x="40" y="404" font-family="Arial,sans-serif" font-size="19" fill="#18212d">Se não houver validação, o par continua pendente: não preencher zero.</text></svg>