<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc"><title id="title">Figura 4 — Denominadores não intercambiáveis</title><desc id="desc">Cinco pares didáticos validados na narrativa e três alvos futuros pendentes; a razão de completude é cinco de oito, não um MAE dividido por oito.</desc>
<rect width="1440" height="440" fill="#f7f9fc"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="29" fill="#18212d" font-weight="bold">Figura 4 — Denominadores não intercambiáveis</text>
<rect x="40.0" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="170.4" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Planejados</text>
<text x="170.4" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">8 alvos t18 a t25</text>
<text x="307.8" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="314.8" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="445.2" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Emparelhados</text>
<text x="445.2" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">5 alvos t18 a t22</text>
<text x="582.6" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="589.6" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="720.0" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Pendentes</text>
<text x="720.0" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">3 alvos t23 a t25</text>
<text x="857.4" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="864.4" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="994.8" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">MAE de B</text>
<text x="994.8" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">88 dividido por 5</text>
<text x="1132.2" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="1139.2" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="1269.6" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">MAE de C</text>
<text x="1269.6" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">41,8 dividido por 5</text>
<text x="40" y="404" font-family="Arial,sans-serif" font-size="19" fill="#18212d">Completude: 5/8 = 62,5%; MAE: B = 17,6 e C = 8,36 unidades.</text></svg>