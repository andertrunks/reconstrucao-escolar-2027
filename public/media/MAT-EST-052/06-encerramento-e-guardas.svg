<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc"><title id="title">Figura 6 — Encerramento do protocolo anterior</title><desc id="desc">A amostra fictícia possui cinco de oito pares e a falha histórica de t19 de 19,2 unidades excede a guarda de 10; fechar relatório não aprova modelo.</desc>
<rect width="1440" height="440" fill="#f7f9fc"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="29" fill="#18212d" font-weight="bold">Figura 6 — Encerramento do protocolo anterior</text>
<rect x="40.0" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="170.4" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Quantidade</text>
<text x="170.4" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">5 de 8 pares</text>
<text x="307.8" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="314.8" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="445.2" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Médias parciais</text>
<text x="445.2" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">descritivas, não finais</text>
<text x="582.6" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="589.6" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="720.0" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Guarda t19</text>
<text x="720.0" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">19,2 maior que 10</text>
<text x="857.4" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="864.4" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="994.8" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Auditoria</text>
<text x="994.8" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">não executada no campo</text>
<text x="1132.2" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="1139.2" y="104" width="260.8" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="1269.6" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Decisão</text>
<text x="1269.6" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">não promover em v1</text>
<text x="40" y="404" font-family="Arial,sans-serif" font-size="19" fill="#18212d">Um registro pode ser encerrado como parcial e reprovado; encerrado não significa autorizado.</text></svg>