<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Comparação de MAE e RMSE</title><desc id="desc">Gráfico de barras numéricas com A: MAE 5, RMSE 5; B: MAE 6,25, RMSE 12,5; baseline: MAE 12,5, RMSE 16,58.</desc><rect width="960" height="540" fill="#f8fbfc"/><text x="35" y="45" font-family="DejaVu Sans,Arial" font-size="23" fill="#153248" text-anchor="start" font-weight="bold">Métricas no mesmo teste (atendimentos)</text><text x="44" y="110" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="start" font-weight="bold">Modelo</text><text x="290" y="110" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="start" font-weight="bold">MAE</text><text x="600" y="110" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="start" font-weight="bold">RMSE</text><text x="44" y="178" font-family="DejaVu Sans,Arial" font-size="21" fill="#153248" text-anchor="start" font-weight="bold">A</text><rect x="292" y="151" width="55.0" height="40" fill="#136b6b" rx="5"/><text x="357.0" y="179" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">5.00</text><rect x="603" y="151" width="55.0" height="40" fill="#153248" rx="5"/><text x="668.0" y="179" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">5.00</text><text x="44" y="290" font-family="DejaVu Sans,Arial" font-size="21" fill="#153248" text-anchor="start" font-weight="bold">B</text><rect x="292" y="263" width="68.8" height="40" fill="#136b6b" rx="5"/><text x="370.75" y="291" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">6.25</text><rect x="603" y="263" width="137.5" height="40" fill="#153248" rx="5"/><text x="750.5" y="291" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">12.50</text><text x="44" y="402" font-family="DejaVu Sans,Arial" font-size="21" fill="#153248" text-anchor="start" font-weight="bold">Base</text><rect x="292" y="375" width="137.5" height="40" fill="#136b6b" rx="5"/><text x="439.5" y="403" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">12.50</text><rect x="603" y="375" width="182.4" height="40" fill="#153248" rx="5"/><text x="795.414363469547" y="403" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">16.58</text><text x="44" y="512" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">MAE = média dos módulos; RMSE = raiz da média dos quadrados.</text></svg>