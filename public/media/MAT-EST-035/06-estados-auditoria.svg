<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Matriz de estados de auditoria</title><desc id="desc">Três estados identificados por palavras: conferido, parcial e pendente, com evidência requerida para cada um.</desc><rect width="960" height="540" fill="#f8fbfc"/><text x="35" y="45" font-family="DejaVu Sans,Arial" font-size="23" fill="#153248" text-anchor="start" font-weight="bold">Estados separados de conferência editorial</text><rect x="88" y="106" width="785" height="85" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="480.5" y="137" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">CONFERIDO</text><text x="480.5" y="165" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Entrada, conta e referência acessíveis</text><rect x="88" y="223" width="785" height="85" rx="12" fill="#fff0bf" stroke="#9eb4bf" stroke-width="2"/><text x="480.5" y="254" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">PARCIAL</text><text x="480.5" y="282" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Uma fonte identificada; outra falta</text><rect x="88" y="340" width="785" height="85" rx="12" fill="#f8dede" stroke="#9eb4bf" stroke-width="2"/><text x="480.5" y="371" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">PENDENTE</text><text x="480.5" y="399" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Enunciado ou arquivo não inspecionado</text><text x="42" y="497" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">Nunca converter “gabarito localizado” em “enunciado totalmente auditado”.</text></svg>