<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Mudança da função de perda</title><desc id="desc">Em dois cenários didáticos, A custa 40 em ambos; B custa 25 com falta mais cara e 75 com excedente mais caro.</desc><rect width="960" height="540" fill="#f8fbfc"/><text x="35" y="45" font-family="DejaVu Sans,Arial" font-size="23" fill="#153248" text-anchor="start" font-weight="bold">Sensibilidade dos custos fictícios</text><rect x="44" y="95" width="860" height="80" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="474.0" y="126" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Hipótese 1: falta custa 3; excedente custa 1</text><text x="474.0" y="154" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">A: 40 unidades | B: 25 unidades</text><rect x="44" y="214" width="860" height="80" rx="12" fill="#fff0bf" stroke="#9eb4bf" stroke-width="2"/><text x="474.0" y="245" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Hipótese 2: falta custa 1; excedente custa 3</text><text x="474.0" y="273" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">A: 40 unidades | B: 75 unidades</text><rect x="44" y="348" width="860" height="91" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="474.0" y="379" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Erros e previsões NÃO mudaram</text><text x="474.0" y="407" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Mudou apenas o peso atribuído a cada tipo de erro.</text><text x="44" y="500" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="start" font-weight="normal">Pesos ilustrativos, não custos reais de serviço ou município.</text></svg>