<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Protocolo de revisão e reteste</title><desc id="desc">Cinco etapas: tentativa real, conferência, diagnóstico, remediação e reteste com item novo.</desc><rect width="960" height="540" fill="#f8fbfc"/><text x="35" y="43" font-family="DejaVu Sans,Arial" font-size="23" fill="#153248" text-anchor="start" font-weight="bold">Da evidência à revisão dirigida</text><rect x="100" y="88" width="760" height="63" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="480.0" y="119" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Tentativa real</text><text x="480.0" y="147" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Resposta submetida no site</text><text x="468" y="167" font-family="DejaVu Sans,Arial" font-size="20" fill="#136b6b" text-anchor="middle" font-weight="normal">↓</text><rect x="100" y="171" width="760" height="63" rx="12" fill="#fff0bf" stroke="#9eb4bf" stroke-width="2"/><text x="480.0" y="202" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Conferência</text><text x="480.0" y="230" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Comparação com solução</text><text x="468" y="250" font-family="DejaVu Sans,Arial" font-size="20" fill="#136b6b" text-anchor="middle" font-weight="normal">↓</text><rect x="100" y="254" width="760" height="63" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="480.0" y="285" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Diagnóstico</text><text x="480.0" y="313" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Conteúdo, cálculo, leitura etc.</text><text x="468" y="333" font-family="DejaVu Sans,Arial" font-size="20" fill="#136b6b" text-anchor="middle" font-weight="normal">↓</text><rect x="100" y="337" width="760" height="63" rx="12" fill="#fff0bf" stroke="#9eb4bf" stroke-width="2"/><text x="480.0" y="368" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Remediação</text><text x="480.0" y="396" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Voltar ao pré-requisito</text><text x="468" y="416" font-family="DejaVu Sans,Arial" font-size="20" fill="#136b6b" text-anchor="middle" font-weight="normal">↓</text><rect x="100" y="420" width="760" height="63" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="480.0" y="451" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Reteste novo</text><text x="480.0" y="479" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Transferir para outro caso</text><text x="44" y="521" font-family="DejaVu Sans,Arial" font-size="17" fill="#153248" text-anchor="start" font-weight="normal">Publicar material ≠ responder a prova ≠ consolidar o conhecimento.</text></svg>