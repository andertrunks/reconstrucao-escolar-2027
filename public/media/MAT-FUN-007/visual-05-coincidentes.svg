<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 850 530"><title id="t">Retas coincidentes: infinitas soluções</title><desc id="d">A equação 2x+2y=10 é duas vezes x+y=5, por isso representam a mesma reta.</desc><rect width="850" height="530" fill="#fff"/><text x="24" y="38" font-size="23" font-family="Arial,sans-serif" fill="#1b2b3b">Retas coincidentes: infinitas soluções</text><text x="24" y="70" font-size="14" font-family="Arial,sans-serif" fill="#1b2b3b">A equação 2x+2y=10 é duas vezes x+y=5, por isso representam a mesma reta.</text><g stroke="#334155" stroke-width="2"><path d="M100 125 V440 H760" fill="none"/></g><polyline points="100.0,222.1 564.3,440.0" fill="none" stroke="#0b8050" stroke-width="4" /><circle cx="100" cy="222.14285714285714" r="6" fill="#1a573b" stroke="#fff" stroke-width="2"/><circle cx="192.85714285714283" cy="265.7142857142857" r="6" fill="#1a573b" stroke="#fff" stroke-width="2"/><circle cx="285.71428571428567" cy="309.28571428571433" r="6" fill="#1a573b" stroke="#fff" stroke-width="2"/><circle cx="378.57142857142856" cy="352.8571428571429" r="6" fill="#1a573b" stroke="#fff" stroke-width="2"/><circle cx="471.4285714285714" cy="396.42857142857144" r="6" fill="#1a573b" stroke="#fff" stroke-width="2"/><circle cx="564.2857142857142" cy="440" r="6" fill="#1a573b" stroke="#fff" stroke-width="2"/><text x="181" y="171" font-size="16" font-family="Arial,sans-serif" fill="#1b2b3b">x+y=5 e 2x+2y=10</text><text x="764" y="445" font-size="16" font-family="Arial,sans-serif" fill="#1b2b3b">x</text><text x="78" y="112" font-size="16" font-family="Arial,sans-serif" fill="#1b2b3b">y</text><text x="380" y="505" font-size="15" font-family="Arial,sans-serif" fill="#1b2b3b">x e y — soluções na mesma reta</text></svg>