<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">RETAS COINCIDENTES: MUITOS PARES</title><desc id="desc">As duas equações descrevem exatamente a mesma reta</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#032d64"/><stop offset="1" stop-color="#0961ae"/></linearGradient></defs><rect x="12" y="11" width="1576" height="112" rx="18" fill="url(#blue)" /><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#fff">RETAS COINCIDENTES: MUITOS PARES</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#e6f3ff">As duas equações descrevem exatamente a mesma reta</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#e9f4ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="66" rx="16" fill="#075bbb" /><rect x="20" y="189" width="508" height="17" rx="0" fill="#075bbb" /><circle cx="54" cy="173" r="24" fill="#fff" opacity=".22"/><text x="54" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="94" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Equações</text><text x="45" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">A primeira é x + y = 5.</text><text x="45" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">A segunda é 2x + 2y = 10.</text><text x="45" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">A segunda é o dobro da primeira.</text><rect x="41" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="274" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">x+y=5</text><text x="45" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Equações dependentes.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#ebfaee" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="66" rx="16" fill="#078a55" /><rect x="546" y="189" width="508" height="17" rx="0" fill="#078a55" /><circle cx="580" cy="173" r="24" fill="#fff" opacity=".22"/><text x="580" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="620" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Elimine uma equação</text><text x="571" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Multiplique a primeira por −2.</text><text x="571" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Some com a segunda.</text><text x="571" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Todos os termos se anulam.</text><rect x="567" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="800" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">0 = 0</text><text x="571" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">Uma identidade, não x = 0.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e4" stroke="#ea7a16" stroke-width="2"/><rect x="1072" y="140" width="508" height="66" rx="16" fill="#ea7a16" /><rect x="1072" y="189" width="508" height="17" rx="0" fill="#ea7a16" /><circle cx="1106" cy="173" r="24" fill="#fff" opacity=".22"/><text x="1106" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1146" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Exemplos de pares</text><text x="1097" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">(0,5): soma cinco.</text><text x="1097" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">(1,4): soma cinco.</text><text x="1097" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">(3,2): soma cinco.</text><rect x="1093" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="1326" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">y = 5 − x</text><text x="1097" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ea7a16">Infinitos pares reais.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ebff" stroke="#873ecc" stroke-width="2"/><rect x="20" y="520" width="508" height="66" rx="16" fill="#873ecc" /><rect x="20" y="569" width="508" height="17" rx="0" fill="#873ecc" /><circle cx="54" cy="553" r="24" fill="#fff" opacity=".22"/><text x="54" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="94" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Domínio e contagem</text><text x="45" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Em números reais: infinitos.</text><text x="45" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Se inteiros não negativos: seis.</text><text x="45" y="700" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Pares de (0,5) até (5,0).</text><rect x="41" y="746" width="466" height="67" rx="11" fill="#fff" /><text x="274" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">6 pares inteiros</text><text x="45" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#873ecc">Sempre considere o domínio.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffeff1" stroke="#d83951" stroke-width="2"/><rect x="546" y="520" width="508" height="66" rx="16" fill="#d83951" /><rect x="546" y="569" width="508" height="17" rx="0" fill="#d83951" /><circle cx="580" cy="553" r="24" fill="#fff" opacity=".22"/><text x="580" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="620" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Observe a reta</text><text x="571" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">As duas linhas se sobrepõem.</text><rect x="573" y="688" width="451" height="166" rx="12" fill="#fff" stroke="#d6e0ed" stroke-width="2"/><line x1="616" y1="817" x2="1008" y2="817" stroke="#1b344d" stroke-width="2" /><line x1="616" y1="817" x2="616" y2="706" stroke="#1b344d" stroke-width="2" /><line x1="616" y1="814" x2="616" y2="822" stroke="#344a63" stroke-width="1" /><text x="616" y="842" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">0</text><line x1="780.5714285714286" y1="814" x2="780.5714285714286" y2="822" stroke="#344a63" stroke-width="1" /><text x="780.5714285714286" y="842" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">3</text><line x1="1000" y1="814" x2="1000" y2="822" stroke="#344a63" stroke-width="1" /><text x="1000" y="842" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">7</text><line x1="611" y1="817" x2="619" y2="817" stroke="#344a63" stroke-width="1" /><text x="608" y="823" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">0</text><line x1="611" y1="773.2857142857143" x2="619" y2="773.2857142857143" stroke="#344a63" stroke-width="1" /><text x="608" y="779.2857142857143" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">3</text><line x1="611" y1="715" x2="619" y2="715" stroke="#344a63" stroke-width="1" /><text x="608" y="721" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">7</text><text x="1016" y="823" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1e344e">x</text><text x="613" y="698" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1e344e">y</text><polyline points="616,744.1428571428571 890.2857142857142,817" fill="none" stroke="#075bbb" stroke-width="6" /><circle cx="616" cy="744.1428571428571" r="5.5" fill="#075bbb" stroke="#fff" stroke-width="1"/><circle cx="670.8571428571429" cy="758.7142857142857" r="5.5" fill="#075bbb" stroke="#fff" stroke-width="1"/><circle cx="780.5714285714286" cy="787.8571428571429" r="5.5" fill="#075bbb" stroke="#fff" stroke-width="1"/><circle cx="890.2857142857142" cy="817" r="5.5" fill="#075bbb" stroke="#fff" stroke-width="1"/><polyline points="616,744.1428571428571 890.2857142857142,817" fill="none" stroke="#d83951" stroke-width="2" stroke-dasharray="6 4"/><text x="571" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#d83951">Uma única reta desenhada.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e6fafb" stroke="#008d9c" stroke-width="2"/><rect x="1072" y="520" width="508" height="66" rx="16" fill="#008d9c" /><rect x="1072" y="569" width="508" height="17" rx="0" fill="#008d9c" /><circle cx="1106" cy="553" r="24" fill="#fff" opacity=".22"/><text x="1106" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1146" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Conclusão</text><text x="1097" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">A segunda condição não acrescenta</text><text x="1097" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">informação independente.</text><text x="1097" y="700" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Muitos pares são válidos.</text><rect x="1093" y="746" width="466" height="67" rx="11" fill="#fff" /><text x="1326" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#1a304f">Infinitas soluções reais</text><text x="1097" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#008d9c">Não há par único.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073568" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">Uma identidade indica condições equivalentes e exige leitura do domínio.</text></svg>