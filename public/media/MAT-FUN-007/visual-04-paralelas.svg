<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 850 530"><title id="t">Retas paralelas: nenhuma solução</title><desc id="d">A reta x+y=5 tem inclinação igual à reta x+y=6, mas alturas diferentes.</desc><rect width="850" height="530" fill="#fff"/><text x="24" y="38" font-size="23" font-family="Arial,sans-serif" fill="#1b2b3b">Retas paralelas: nenhuma solução</text><text x="24" y="70" font-size="14" font-family="Arial,sans-serif" fill="#1b2b3b">A reta x+y=5 tem inclinação igual à reta x+y=6, mas alturas diferentes.</text><g stroke="#334155" stroke-width="2"><path d="M100 125 V440 H760" fill="none"/></g><polyline points="100.0,222.1 564.3,440.0" fill="none" stroke="#2454a6" stroke-width="4" /><polyline points="100.0,178.6 657.1,440.0" fill="none" stroke="#a33131" stroke-width="4" /><text x="150" y="201" font-size="16" font-family="Arial,sans-serif" fill="#1b2b3b">x+y=6</text><text x="143" y="260" font-size="16" font-family="Arial,sans-serif" fill="#1b2b3b">x+y=5</text><text x="767" y="444" font-size="16" font-family="Arial,sans-serif" fill="#1b2b3b">x</text><text x="78" y="112" font-size="16" font-family="Arial,sans-serif" fill="#1b2b3b">y</text><text x="380" y="505" font-size="15" font-family="Arial,sans-serif" fill="#1b2b3b">x e y — sistema impossível</text></svg>