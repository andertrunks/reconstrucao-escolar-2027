<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 850 530"><title id="t">Substituição em quatro passos</title><desc id="d">Isolar, substituir, resolver e conferir um par, preservando equivalência.</desc><rect width="850" height="530" fill="#fff"/><text x="24" y="38" font-size="23" font-family="Arial,sans-serif" fill="#1b2b3b">Substituição em quatro passos</text><text x="24" y="70" font-size="14" font-family="Arial,sans-serif" fill="#1b2b3b">Isolar, substituir, resolver e conferir um par, preservando equivalência.</text><g font-family="Arial,sans-serif" font-size="20" fill="#1d3557" stroke="#334155" stroke-width="2">
<rect x="160" y="113" width="520" height="64" rx="9" fill="#eff6ff"/><rect x="160" y="205" width="520" height="64" rx="9" fill="#f0fdf4"/><rect x="160" y="297" width="520" height="64" rx="9" fill="#eff6ff"/><rect x="160" y="389" width="520" height="64" rx="9" fill="#f0fdf4"/></g>
<text x="184" y="153" font-size="19" font-family="Arial,sans-serif" fill="#1b2b3b">1. Isolar y=10−x na primeira equação</text><text x="184" y="246" font-size="19" font-family="Arial,sans-serif" fill="#1b2b3b">2. Substituir: 2x+(10−x)=14</text><text x="184" y="338" font-size="19" font-family="Arial,sans-serif" fill="#1b2b3b">3. Resolver: x=4; depois y=6</text><text x="184" y="429" font-size="19" font-family="Arial,sans-serif" fill="#1b2b3b">4. Conferir as duas igualdades</text>
<g stroke="#64748b" stroke-width="3"><path d="M418 179 V202 M418 271 V294 M418 362 V386"/></g><text x="380" y="505" font-size="15" font-family="Arial,sans-serif" fill="#1b2b3b">Esquema lógico (não utiliza eixos de coordenadas)</text></svg>