<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="s-title s-desc"><title id="s-title">Soma que cancela a incógnita y</title><desc id="s-desc">Somar x+y=10 e x−y=2 cancela y e produz 2x=12.</desc><rect width="900" height="540" fill="#fff"/><text x="28" y="40" font-size="23" font-family="Arial, sans-serif" fill="#182d45">Soma que cancela a incógnita y</text><text x="28" y="69" font-size="14" font-family="Arial, sans-serif" fill="#182d45">Somar x+y=10 e x−y=2 cancela y e produz 2x=12.</text><rect x="50" y="118" width="315" height="73" rx="10" fill="#edf4ff" stroke="#526174" stroke-width="1"/><rect x="535" y="118" width="315" height="73" rx="10" fill="#f0fdf4" stroke="#526174" stroke-width="1"/><text x="108" y="163" font-size="23" font-family="Arial, sans-serif" fill="#182d45">x+y=10</text><text x="598" y="163" font-size="23" font-family="Arial, sans-serif" fill="#182d45">x−y=2</text><text x="432" y="157" font-size="28" font-family="Arial, sans-serif" fill="#182d45">+</text><path d="M210 193 L410 306" fill="none" stroke="#526174" stroke-width="3"/><path d="M690 193 L495 306" fill="none" stroke="#526174" stroke-width="3"/><rect x="274" y="312" width="355" height="72" rx="10" fill="#fff7ed" stroke="#526174" stroke-width="1"/><text x="349" y="357" font-size="26" font-family="Arial, sans-serif" fill="#182d45">2x=12</text><path d="M450 384 L450 422" fill="none" stroke="#526174" stroke-width="3"/><text x="377" y="461" font-size="22" font-family="Arial, sans-serif" fill="#182d45">x=6; y=4</text><text x="245" y="510" font-size="15" font-family="Arial, sans-serif" fill="#182d45">Legenda: duas igualdades, uma incógnita eliminada</text></svg>