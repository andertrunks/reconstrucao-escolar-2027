<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">ADIÇÃO: COMO UMA INCÓGNITA DESAPARECE</title><desc id="desc">Somar equações correspondentes pode eliminar termos opostos</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#032d64"/><stop offset="1" stop-color="#0961ae"/></linearGradient></defs><rect x="12" y="11" width="1576" height="112" rx="18" fill="url(#blue)" /><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#fff">ADIÇÃO: COMO UMA INCÓGNITA DESAPARECE</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#e6f3ff">Somar equações correspondentes pode eliminar termos opostos</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#e9f4ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="66" rx="16" fill="#075bbb" /><rect x="20" y="189" width="508" height="17" rx="0" fill="#075bbb" /><circle cx="54" cy="173" r="24" fill="#fff" opacity=".22"/><text x="54" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="94" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">O sistema</text><text x="45" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Duas condições simultâneas.</text><text x="45" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Procure coeficientes opostos.</text><text x="45" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Aparecem +y e −y.</text><rect x="41" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="274" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">x+y=10; x−y=2</text><text x="45" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Somar os dois membros.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#ebfaee" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="66" rx="16" fill="#078a55" /><rect x="546" y="189" width="508" height="17" rx="0" fill="#078a55" /><circle cx="580" cy="173" r="24" fill="#fff" opacity=".22"/><text x="580" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="620" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Some termo a termo</text><text x="571" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">x + x = 2x.</text><text x="571" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">y − y = 0.</text><text x="571" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">10 + 2 = 12.</text><rect x="567" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="800" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">2x + 0 = 12</text><text x="571" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">Uma variável é eliminada.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e4" stroke="#ea7a16" stroke-width="2"/><rect x="1072" y="140" width="508" height="66" rx="16" fill="#ea7a16" /><rect x="1072" y="189" width="508" height="17" rx="0" fill="#ea7a16" /><circle cx="1106" cy="173" r="24" fill="#fff" opacity=".22"/><text x="1106" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1146" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Calcule x</text><text x="1097" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Da soma, 2x = 12.</text><text x="1097" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Divida ambos os lados por dois.</text><text x="1097" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Então x = 6.</text><rect x="1093" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="1326" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">x = 6</text><text x="1097" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ea7a16">A letra ainda representa incógnita.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ebff" stroke="#873ecc" stroke-width="2"/><rect x="20" y="520" width="508" height="66" rx="16" fill="#873ecc" /><rect x="20" y="569" width="508" height="17" rx="0" fill="#873ecc" /><circle cx="54" cy="553" r="24" fill="#fff" opacity=".22"/><text x="54" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="94" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Recupere y</text><text x="45" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Volte à primeira equação.</text><text x="45" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">6 + y = 10.</text><text x="45" y="700" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Então y = 4.</text><rect x="41" y="746" width="466" height="67" rx="11" fill="#fff" /><text x="274" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">y = 4</text><text x="45" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#873ecc">Par ordenado: (6,4).</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffeff1" stroke="#d83951" stroke-width="2"/><rect x="546" y="520" width="508" height="66" rx="16" fill="#d83951" /><rect x="546" y="569" width="508" height="17" rx="0" fill="#d83951" /><circle cx="580" cy="553" r="24" fill="#fff" opacity=".22"/><text x="580" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="620" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Verifique tudo</text><text x="571" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">6 + 4 = 10.</text><text x="571" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">6 − 4 = 2.</text><text x="571" y="700" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">As duas igualdades são verdadeiras.</text><rect x="567" y="746" width="466" height="67" rx="11" fill="#fff" /><text x="800" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">(x,y) = (6,4)</text><text x="571" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#d83951">A conferência é obrigatória.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e6fafb" stroke="#008d9c" stroke-width="2"/><rect x="1072" y="520" width="508" height="66" rx="16" fill="#008d9c" /><rect x="1072" y="569" width="508" height="17" rx="0" fill="#008d9c" /><circle cx="1106" cy="553" r="24" fill="#fff" opacity=".22"/><text x="1106" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1146" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Por que funciona?</text><text x="1097" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Igualdades verdadeiras podem</text><text x="1097" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">ser somadas membro a membro.</text><text x="1097" y="700" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">A soma preserva a solução.</text><rect x="1093" y="746" width="466" height="67" rx="11" fill="#fff" /><text x="1326" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">A=B; C=D ⇒ A+C=B+D</text><text x="1097" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#008d9c">Princípio de equivalência.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073568" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">Não elimine uma incógnita sem recuperar seu valor depois.</text></svg>