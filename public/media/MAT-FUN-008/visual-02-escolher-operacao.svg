<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="s-title s-desc"><title id="s-title">Escolher soma ou subtração</title><desc id="s-desc">Coeficientes opostos se cancelam por soma; coeficientes iguais se cancelam por subtração.</desc><rect width="900" height="540" fill="#fff"/><text x="28" y="40" font-size="23" font-family="Arial, sans-serif" fill="#182d45">Escolher soma ou subtração</text><text x="28" y="69" font-size="14" font-family="Arial, sans-serif" fill="#182d45">Coeficientes opostos se cancelam por soma; coeficientes iguais se cancelam por subtração.</text><rect x="40" y="128" width="385" height="85" rx="10" fill="#eef3ff" stroke="#526174" stroke-width="1"/><rect x="475" y="128" width="385" height="85" rx="10" fill="#f0fdf4" stroke="#526174" stroke-width="1"/><text x="70" y="158" font-size="21" font-family="Arial, sans-serif" fill="#182d45">Soma: +3y e −3y</text><text x="77" y="189" font-size="23" font-family="Arial, sans-serif" fill="#182d45">3y−3y=0</text><text x="493" y="158" font-size="21" font-family="Arial, sans-serif" fill="#182d45">Subtração: +2x e +2x</text><text x="519" y="189" font-size="23" font-family="Arial, sans-serif" fill="#182d45">2x−2x=0</text><rect x="176" y="302" width="547" height="103" rx="10" fill="#fff7ed" stroke="#526174" stroke-width="1"/><text x="232" y="344" font-size="23" font-family="Arial, sans-serif" fill="#182d45">Decida qual coeficiente cancelar.</text><text x="231" y="379" font-size="18" font-family="Arial, sans-serif" fill="#182d45">Depois, recupere o outro valor.</text><text x="245" y="510" font-size="15" font-family="Arial, sans-serif" fill="#182d45">A escolha depende dos coeficientes e dos sinais</text></svg>