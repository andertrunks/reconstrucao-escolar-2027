<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="s-title s-desc"><title id="s-title">Três diagnósticos de sistemas</title><desc id="s-desc">A eliminação pode dar uma equação com uma incógnita, uma contradição ou uma identidade.</desc><rect width="900" height="540" fill="#fff"/><text x="28" y="40" font-size="23" font-family="Arial, sans-serif" fill="#182d45">Três diagnósticos de sistemas</text><text x="28" y="69" font-size="14" font-family="Arial, sans-serif" fill="#182d45">A eliminação pode dar uma equação com uma incógnita, uma contradição ou uma identidade.</text><rect x="40" y="148" width="250" height="170" rx="10" fill="#edf4ff" stroke="#526174" stroke-width="1"/><rect x="325" y="148" width="250" height="170" rx="10" fill="#fef2f2" stroke="#526174" stroke-width="1"/><rect x="610" y="148" width="250" height="170" rx="10" fill="#f0fdf4" stroke="#526174" stroke-width="1"/><text x="87" y="191" font-size="24" font-family="Arial, sans-serif" fill="#182d45">2x=12</text><text x="56" y="229" font-size="21" font-family="Arial, sans-serif" fill="#182d45">Uma solução</text><text x="59" y="265" font-size="18" font-family="Arial, sans-serif" fill="#182d45">Retas cruzam</text><text x="401" y="191" font-size="24" font-family="Arial, sans-serif" fill="#182d45">0=2</text><text x="354" y="229" font-size="21" font-family="Arial, sans-serif" fill="#182d45">Sem solução</text><text x="337" y="265" font-size="18" font-family="Arial, sans-serif" fill="#182d45">Retas paralelas</text><text x="683" y="191" font-size="24" font-family="Arial, sans-serif" fill="#182d45">0=0</text><text x="630" y="229" font-size="19" font-family="Arial, sans-serif" fill="#182d45">Muitas soluções</text><text x="635" y="265" font-size="17" font-family="Arial, sans-serif" fill="#182d45">Retas coincidem</text><rect x="178" y="373" width="556" height="62" rx="10" fill="#fff7ed" stroke="#526174" stroke-width="1"/><text x="212" y="412" font-size="21" font-family="Arial, sans-serif" fill="#182d45">Sempre examine o domínio do problema.</text><text x="245" y="510" font-size="15" font-family="Arial, sans-serif" fill="#182d45">Conclusão: a última igualdade ajuda a classificar o sistema</text></svg>