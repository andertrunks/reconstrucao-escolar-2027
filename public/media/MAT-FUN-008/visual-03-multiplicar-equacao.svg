<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="s-title s-desc"><title id="s-title">Multiplicação válida de uma equação</title><desc id="s-desc">Em 2x+y=11, multiplicar ambos os membros por 2 produz 4x+2y=22.</desc><rect width="900" height="540" fill="#fff"/><text x="28" y="40" font-size="23" font-family="Arial, sans-serif" fill="#182d45">Multiplicação válida de uma equação</text><text x="28" y="69" font-size="14" font-family="Arial, sans-serif" fill="#182d45">Em 2x+y=11, multiplicar ambos os membros por 2 produz 4x+2y=22.</text><rect x="180" y="130" width="545" height="70" rx="10" fill="#eef3ff" stroke="#526174" stroke-width="1"/><text x="333" y="173" font-size="23" font-family="Arial, sans-serif" fill="#182d45">2x+y=11</text><path d="M452 204 L452 257" fill="none" stroke="#526174" stroke-width="3"/><text x="496" y="249" font-size="17" font-family="Arial, sans-serif" fill="#182d45">vezes 2 em tudo</text><rect x="180" y="270" width="545" height="75" rx="10" fill="#f0fdf4" stroke="#526174" stroke-width="1"/><text x="331" y="315" font-size="24" font-family="Arial, sans-serif" fill="#182d45">4x+2y=22</text><rect x="152" y="398" width="606" height="58" rx="10" fill="#fff7ed" stroke="#526174" stroke-width="1"/><text x="196" y="435" font-size="19" font-family="Arial, sans-serif" fill="#182d45">4x+2y=22 e x−2y=3 → 5x=25</text><text x="245" y="510" font-size="15" font-family="Arial, sans-serif" fill="#182d45">Nunca multiplique apenas um termo da igualdade</text></svg>