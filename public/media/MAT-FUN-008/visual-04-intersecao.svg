<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">ADIÇÃO E GRÁFICO: A MESMA SOLUÇÃO</title><desc id="desc">Eliminação algébrica e interseção de retas chegam ao mesmo par</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#032d64"/><stop offset="1" stop-color="#0961ae"/></linearGradient></defs><rect x="12" y="11" width="1576" height="112" rx="18" fill="url(#blue)" /><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#fff">ADIÇÃO E GRÁFICO: A MESMA SOLUÇÃO</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#e6f3ff">Eliminação algébrica e interseção de retas chegam ao mesmo par</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#e9f4ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="66" rx="16" fill="#075bbb" /><rect x="20" y="189" width="508" height="17" rx="0" fill="#075bbb" /><circle cx="54" cy="173" r="24" fill="#fff" opacity=".22"/><text x="54" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="94" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Leia as equações</text><text x="45" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">x + y = 10.</text><text x="45" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">2x + y = 14.</text><text x="45" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">As duas retas têm inclinações distintas.</text><rect x="41" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="274" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">y = 10 − x</text><text x="45" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Outra: y = 14 − 2x.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#ebfaee" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="66" rx="16" fill="#078a55" /><rect x="546" y="189" width="508" height="17" rx="0" fill="#078a55" /><circle cx="580" cy="173" r="24" fill="#fff" opacity=".22"/><text x="580" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="620" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Subtraia equações</text><text x="571" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">(2x + y) − (x + y) = 14 − 10.</text><text x="571" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Cancelamos +y − y.</text><text x="571" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Resta x = 4.</text><rect x="567" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="800" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">x = 4</text><text x="571" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">Método da eliminação.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e4" stroke="#ea7a16" stroke-width="2"/><rect x="1072" y="140" width="508" height="66" rx="16" fill="#ea7a16" /><rect x="1072" y="189" width="508" height="17" rx="0" fill="#ea7a16" /><circle cx="1106" cy="173" r="24" fill="#fff" opacity=".22"/><text x="1106" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1146" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Encontre y</text><text x="1097" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Substitua x=4 na primeira.</text><text x="1097" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">4 + y = 10.</text><text x="1097" y="320" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Logo y = 6.</text><rect x="1093" y="366" width="466" height="67" rx="11" fill="#fff" /><text x="1326" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">(4, 6)</text><text x="1097" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ea7a16">Ponto de interseção.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ebff" stroke="#873ecc" stroke-width="2"/><rect x="20" y="520" width="508" height="66" rx="16" fill="#873ecc" /><rect x="20" y="569" width="508" height="17" rx="0" fill="#873ecc" /><circle cx="54" cy="553" r="24" fill="#fff" opacity=".22"/><text x="54" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="94" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Uma solução exata</text><text x="45" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Verifique: 4+6=10.</text><text x="45" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Verifique: 2×4+6=14.</text><text x="45" y="700" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">O método não altera as condições.</text><rect x="41" y="746" width="466" height="67" rx="11" fill="#fff" /><text x="274" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#1a304f">x=4; y=6</text><text x="45" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#873ecc">Duas igualdades satisfeitas.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffeff1" stroke="#d83951" stroke-width="2"/><rect x="546" y="520" width="508" height="66" rx="16" fill="#d83951" /><rect x="546" y="569" width="508" height="17" rx="0" fill="#d83951" /><circle cx="580" cy="553" r="24" fill="#fff" opacity=".22"/><text x="580" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="620" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Visualize o encontro</text><text x="571" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Azul: y=10−x.</text><rect x="573" y="688" width="451" height="166" rx="12" fill="#fff" stroke="#d6e0ed" stroke-width="2"/><line x1="616" y1="817" x2="1008" y2="817" stroke="#1b344d" stroke-width="2" /><line x1="616" y1="817" x2="616" y2="706" stroke="#1b344d" stroke-width="2" /><line x1="616" y1="814" x2="616" y2="822" stroke="#344a63" stroke-width="1" /><text x="616" y="842" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">0</text><line x1="769.6" y1="814" x2="769.6" y2="822" stroke="#344a63" stroke-width="1" /><text x="769.6" y="842" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">4</text><line x1="1000" y1="814" x2="1000" y2="822" stroke="#344a63" stroke-width="1" /><text x="1000" y="842" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">10</text><line x1="611" y1="817" x2="619" y2="817" stroke="#344a63" stroke-width="1" /><text x="608" y="823" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">0</text><line x1="611" y1="773.2857142857143" x2="619" y2="773.2857142857143" stroke="#344a63" stroke-width="1" /><text x="608" y="779.2857142857143" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">6</text><line x1="611" y1="715" x2="619" y2="715" stroke="#344a63" stroke-width="1" /><text x="608" y="721" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#1e344e">14</text><text x="1016" y="823" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1e344e">x</text><text x="613" y="698" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1e344e">y</text><polyline points="616,744.1428571428571 1000,817" fill="none" stroke="#075bbb" stroke-width="4" /><polyline points="616,715 884.8,817" fill="none" stroke="#d83951" stroke-width="4" /><line x1="769.6" y1="817" x2="769.6" y2="773.2857142857143" stroke="#6c778e" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="616" y1="773.2857142857143" x2="769.6" y2="773.2857142857143" stroke="#6c778e" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="769.6" cy="773.2857142857143" r="7" fill="#19263b" stroke="#fff" stroke-width="2"/><text x="777.6" y="761.2857142857143" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#1f324e">(4,6)</text><text x="571" y="873" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#d83951">Vermelho: y=14−2x.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e6fafb" stroke="#008d9c" stroke-width="2"/><rect x="1072" y="520" width="508" height="66" rx="16" fill="#008d9c" /><rect x="1072" y="569" width="508" height="17" rx="0" fill="#008d9c" /><circle cx="1106" cy="553" r="24" fill="#fff" opacity=".22"/><text x="1106" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1146" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Compare os métodos</text><text x="1097" y="632" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Substituição: isole e troque.</text><text x="1097" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Adição: cancele uma letra.</text><text x="1097" y="700" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#162c4a">Ambos produzem o mesmo par.</text><rect x="1093" y="746" width="466" height="67" rx="11" fill="#fff" /><text x="1326" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#1a304f">Solução comum = (4,6)</text><text x="1097" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#008d9c">Escolha o caminho mais simples.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073568" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">A álgebra prova o resultado; o gráfico permite enxergá-lo.</text></svg>