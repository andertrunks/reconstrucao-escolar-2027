<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="475" viewBox="0 0 1050 475" role="img" aria-labelledby="title desc"><title id="title">Fluxo de decisão auditável em seis passos</title><desc id="desc">Etapas: definir alvo e custos; validar sem vazamento; examinar métricas e incerteza; segmentar; decidir com supervisão; registrar versão e limites.</desc><rect width="1050" height="475" fill="#fffdfa"/><text x="35" y="46" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#21344b" font-weight="700">Fluxo de decisão auditável em seis passos</text><text x="40" y="104" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">O relatório deve permitir rastrear dados, método e consequência da escolha.</text><rect x="25" y="146" width="156" height="132" fill="#e6eef7" stroke="#7290a2" rx="10"/><text x="103" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="700">1 - Definir</text><text x="103" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#21344b" font-weight="400">alvo, unidade, custos</text><text x="183" y="218" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="400">&gt;</text><rect x="196" y="146" width="156" height="132" fill="#e6eef7" stroke="#7290a2" rx="10"/><text x="274" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="700">2 - Validar</text><text x="274" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#21344b" font-weight="400">treino, seleção, teste</text><text x="354" y="218" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="400">&gt;</text><rect x="367" y="146" width="156" height="132" fill="#e6eef7" stroke="#7290a2" rx="10"/><text x="445" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="700">3 - Examinar</text><text x="445" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#21344b" font-weight="400">métricas e incerteza</text><text x="525" y="218" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="400">&gt;</text><rect x="538" y="146" width="156" height="132" fill="#e2efe7" stroke="#7290a2" rx="10"/><text x="616" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="700">4 - Segmentar</text><text x="616" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#21344b" font-weight="400">tempo e grupos</text><text x="696" y="218" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="400">&gt;</text><rect x="709" y="146" width="156" height="132" fill="#e2efe7" stroke="#7290a2" rx="10"/><text x="787" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="700">5 - Decidir</text><text x="787" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#21344b" font-weight="400">cenário e supervisão</text><text x="867" y="218" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="400">&gt;</text><rect x="880" y="146" width="156" height="132" fill="#e2efe7" stroke="#7290a2" rx="10"/><text x="958" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="700">6 - Registrar</text><text x="958" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#21344b" font-weight="400">versão e limites</text><text x="47" y="341" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="400">Resultados novos &gt; monitorar &gt; corrigir com versão documentada.</text><text x="47" y="392" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Nunca tratar teste final como base de escolha nem prometer certeza absoluta.</text></svg>