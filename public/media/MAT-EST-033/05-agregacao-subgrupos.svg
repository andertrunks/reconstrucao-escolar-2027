<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="475" viewBox="0 0 1050 475" role="img" aria-labelledby="title desc"><title id="title">Média global encobre MAE de grupo pequeno</title><desc id="desc">Barras X com noventa registros e MAE dois, Y com dez registros e MAE oito e global ponderado de 2,6 atendimentos.</desc><rect width="1050" height="475" fill="#fffdfa"/><text x="35" y="46" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#21344b" font-weight="700">Média global encobre MAE de grupo pequeno</text><text x="40" y="97" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Eixo vertical: MAE em atendimentos; grupo X n = 90; grupo Y n = 10.</text><line x1="112" y1="357" x2="932" y2="357" stroke="#dce5ed" stroke-width="1"/><text x="94" y="362" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#21344b" font-weight="400">0</text><line x1="112" y1="301" x2="932" y2="301" stroke="#dce5ed" stroke-width="1"/><text x="94" y="306" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#21344b" font-weight="400">2</text><line x1="112" y1="245" x2="932" y2="245" stroke="#dce5ed" stroke-width="1"/><text x="94" y="250" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#21344b" font-weight="400">4</text><line x1="112" y1="189" x2="932" y2="189" stroke="#dce5ed" stroke-width="1"/><text x="94" y="194" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#21344b" font-weight="400">6</text><line x1="112" y1="133" x2="932" y2="133" stroke="#dce5ed" stroke-width="1"/><text x="94" y="138" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#21344b" font-weight="400">8</text><rect x="200" y="301" width="137" height="56" fill="#1d5c82" stroke="#1d5c82" rx="1"/><text x="268" y="291" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="700">2</text><text x="268" y="388" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">X (90 casos)</text><rect x="455" y="133" width="137" height="224" fill="#a5673a" stroke="#a5673a" rx="1"/><text x="523" y="123" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="700">8</text><text x="523" y="388" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Y (10 casos)</text><rect x="710" y="284.2" width="137" height="72.8" fill="#4a785f" stroke="#4a785f" rx="1"/><text x="778" y="274.2" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="700">2,6</text><text x="778" y="388" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Global (100)</text><text x="40" y="434" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">MAE global = (90 × 2 + 10 × 8) / 100 = 2,6.</text></svg>