<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img"><title>Bicamada fosfolipídica e proteína transmembrana</title><desc>Duas fileiras de fosfolipídios mostram cabeças voltadas para a água, caudas voltadas para o interior e uma proteína atravessando a bicamada.</desc><style>text{font:20px system-ui,sans-serif;fill:currentColor}.small{font-size:17px}.head{fill:none;stroke:currentColor;stroke-width:2}.tail{stroke:currentColor;stroke-width:2}.protein{fill:none;stroke:currentColor;stroke-width:3}</style><text x="410" y="36" text-anchor="middle">meio extracelular aquoso</text><text x="410" y="398" text-anchor="middle">citoplasma aquoso</text><g id="top"><circle class="head" cx="115" cy="110" r="14"/><line class="tail" x1="109" y1="124" x2="98" y2="185"/><line class="tail" x1="121" y1="124" x2="132" y2="185"/><circle class="head" cx="190" cy="110" r="14"/><line class="tail" x1="184" y1="124" x2="173" y2="185"/><line class="tail" x1="196" y1="124" x2="207" y2="185"/><circle class="head" cx="265" cy="110" r="14"/><line class="tail" x1="259" y1="124" x2="248" y2="185"/><line class="tail" x1="271" y1="124" x2="282" y2="185"/><circle class="head" cx="555" cy="110" r="14"/><line class="tail" x1="549" y1="124" x2="538" y2="185"/><line class="tail" x1="561" y1="124" x2="572" y2="185"/><circle class="head" cx="630" cy="110" r="14"/><line class="tail" x1="624" y1="124" x2="613" y2="185"/><line class="tail" x1="636" y1="124" x2="647" y2="185"/><circle class="head" cx="705" cy="110" r="14"/><line class="tail" x1="699" y1="124" x2="688" y2="185"/><line class="tail" x1="711" y1="124" x2="722" y2="185"/></g><g transform="translate(0 420) scale(1 -1)"><use href="#top"/></g><rect class="protein" x="345" y="88" width="130" height="244" rx="45"/><text x="410" y="216" text-anchor="middle">proteína</text><text class="small" x="115" y="76" text-anchor="middle">cabeça hidrofílica</text><text class="small" x="115" y="216" text-anchor="middle">caudas hidrofóbicas</text><text class="small" x="690" y="216" text-anchor="middle">interior da bicamada</text></svg>
