<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img"><title>Bomba de sódio e potássio</title><desc>Uma proteína atravessa a membrana. Três íons sódio positivos são transportados para fora, dois íons potássio positivos para dentro e ATP fornece energia.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font:20px system-ui,sans-serif;fill:currentColor}.small{font-size:17px}.mem,.arrow{stroke:currentColor;stroke-width:3}.arrow{marker-end:url(#a)}.protein,.ion{fill:none;stroke:currentColor;stroke-width:3}</style><text x="410" y="38" text-anchor="middle">meio extracelular</text><text x="410" y="410" text-anchor="middle">citoplasma</text><line class="mem" x1="55" y1="190" x2="765" y2="190"/><line class="mem" x1="55" y1="240" x2="765" y2="240"/><rect class="protein" x="335" y="145" width="150" height="140" rx="45"/><text class="small" x="410" y="220" text-anchor="middle">bomba</text><circle class="ion" cx="245" cy="300" r="24"/><circle class="ion" cx="300" cy="335" r="24"/><circle class="ion" cx="210" cy="360" r="24"/><text x="245" y="307" text-anchor="middle">Na⁺</text><text x="300" y="342" text-anchor="middle">Na⁺</text><text x="210" y="367" text-anchor="middle">Na⁺</text><line class="arrow" x1="300" y1="300" x2="335" y2="255"/><line class="arrow" x1="360" y1="150" x2="300" y2="90"/><text class="small" x="225" y="78">3 Na⁺ saem</text><circle class="ion" cx="560" cy="95" r="24"/><circle class="ion" cx="625" cy="125" r="24"/><text x="560" y="102" text-anchor="middle">K⁺</text><text x="625" y="132" text-anchor="middle">K⁺</text><line class="arrow" x1="555" y1="145" x2="480" y2="185"/><line class="arrow" x1="485" y1="255" x2="550" y2="315"/><text class="small" x="575" y="345">2 K⁺ entram</text><rect class="protein" x="70" y="175" width="105" height="62" rx="12"/><text x="122" y="213" text-anchor="middle">ATP</text><line class="arrow" x1="175" y1="206" x2="320" y2="206"/><text class="small" x="205" y="170">energia</text></svg>
