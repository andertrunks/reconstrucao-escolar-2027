<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img"><title>Mapa dos mecanismos de transporte de membrana</title><desc>Quatro caminhos comparam difusão simples, difusão facilitada, transporte ativo e transporte vesicular.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font:20px system-ui,sans-serif;fill:currentColor}.small{font-size:16px}.box{fill:none;stroke:currentColor;stroke-width:2}.line{stroke:currentColor;stroke-width:2;marker-end:url(#a)}</style><rect class="box" x="315" y="35" width="270" height="70" rx="15"/><text x="450" y="66" text-anchor="middle">TRANSPORTE</text><text x="450" y="91" text-anchor="middle">PELA MEMBRANA</text><line class="line" x1="450" y1="105" x2="135" y2="165"/><line class="line" x1="450" y1="105" x2="345" y2="165"/><line class="line" x1="450" y1="105" x2="555" y2="165"/><line class="line" x1="450" y1="105" x2="765" y2="165"/><rect class="box" x="35" y="165" width="200" height="150" rx="15"/><text x="135" y="205" text-anchor="middle">difusão simples</text><text class="small" x="135" y="240" text-anchor="middle">pela bicamada</text><text class="small" x="135" y="270" text-anchor="middle">a favor do gradiente</text><text class="small" x="135" y="300" text-anchor="middle">sem ATP direto</text><rect class="box" x="245" y="165" width="200" height="150" rx="15"/><text x="345" y="205" text-anchor="middle">difusão facilitada</text><text class="small" x="345" y="240" text-anchor="middle">por proteína</text><text class="small" x="345" y="270" text-anchor="middle">a favor do gradiente</text><text class="small" x="345" y="300" text-anchor="middle">sem ATP direto</text><rect class="box" x="455" y="165" width="200" height="150" rx="15"/><text x="555" y="205" text-anchor="middle">transporte ativo</text><text class="small" x="555" y="240" text-anchor="middle">por bomba</text><text class="small" x="555" y="270" text-anchor="middle">pode vencer gradiente</text><text class="small" x="555" y="300" text-anchor="middle">usa energia</text><rect class="box" x="665" y="165" width="200" height="150" rx="15"/><text x="765" y="205" text-anchor="middle">transporte vesicular</text><text class="small" x="765" y="240" text-anchor="middle">por vesículas</text><text class="small" x="765" y="270" text-anchor="middle">materiais maiores</text><text class="small" x="765" y="300" text-anchor="middle">endo ou exocitose</text><text x="450" y="370" text-anchor="middle">Pergunte: o que se move? por onde? em qual direção? exige energia?</text><text class="small" x="450" y="410" text-anchor="middle">classificação depende do mecanismo, do gradiente e da energia</text></svg>
