<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img"><title>Difusão simples e difusão facilitada</title><desc>Duas rotas atravessam uma membrana. À esquerda partículas cruzam a bicamada diretamente. À direita cruzam por uma proteína. Em ambos os casos o fluxo líquido vai da maior para a menor concentração.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font:20px system-ui,sans-serif;fill:currentColor}.small{font-size:17px}.mem{stroke:currentColor;stroke-width:3}.p{fill:none;stroke:currentColor;stroke-width:2}.arrow{stroke:currentColor;stroke-width:3;marker-end:url(#a)}.protein{fill:none;stroke:currentColor;stroke-width:3}</style><text x="205" y="40" text-anchor="middle">difusão simples</text><text x="615" y="40" text-anchor="middle">difusão facilitada</text><line class="mem" x1="40" y1="205" x2="780" y2="205"/><line class="mem" x1="40" y1="235" x2="780" y2="235"/><g><circle class="p" cx="110" cy="90" r="9"/><circle class="p" cx="150" cy="105" r="9"/><circle class="p" cx="195" cy="85" r="9"/><circle class="p" cx="240" cy="110" r="9"/><circle class="p" cx="290" cy="92" r="9"/><circle class="p" cx="205" cy="345" r="9"/></g><line class="arrow" x1="205" y1="130" x2="205" y2="315"/><rect class="protein" x="570" y="180" width="90" height="80" rx="25"/><circle class="p" cx="520" cy="90" r="9"/><circle class="p" cx="565" cy="105" r="9"/><circle class="p" cx="610" cy="84" r="9"/><circle class="p" cx="655" cy="108" r="9"/><circle class="p" cx="700" cy="90" r="9"/><circle class="p" cx="615" cy="345" r="9"/><line class="arrow" x1="615" y1="130" x2="615" y2="315"/><text class="small" x="410" y="165" text-anchor="middle">maior concentração</text><text class="small" x="410" y="385" text-anchor="middle">menor concentração</text><text class="small" x="410" y="305" text-anchor="middle">ambas a favor do gradiente, sem gasto direto de ATP</text></svg>
