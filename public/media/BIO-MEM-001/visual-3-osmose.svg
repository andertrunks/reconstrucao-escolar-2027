<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img"><title>Osmose e tonicidade</title><desc>Três situações com célula animal em meio hipotônico, isotônico e hipertônico. Setas indicam entrada líquida de água, fluxos equilibrados e saída líquida de água.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font:20px system-ui,sans-serif;fill:currentColor}.small{font-size:17px}.cell{fill:none;stroke:currentColor;stroke-width:3}.arrow{stroke:currentColor;stroke-width:3;marker-end:url(#a)}.dot{fill:none;stroke:currentColor;stroke-width:2}</style><text x="150" y="42" text-anchor="middle">meio hipotônico</text><text x="450" y="42" text-anchor="middle">meio isotônico</text><text x="750" y="42" text-anchor="middle">meio hipertônico</text><circle class="cell" cx="150" cy="220" r="82"/><circle class="cell" cx="450" cy="220" r="72"/><circle class="cell" cx="750" cy="220" r="60"/><line class="arrow" x1="55" y1="220" x2="105" y2="220"/><line class="arrow" x1="245" y1="220" x2="195" y2="220"/><line class="arrow" x1="375" y1="190" x2="405" y2="190"/><line class="arrow" x1="525" y1="250" x2="495" y2="250"/><line class="arrow" x1="710" y1="220" x2="660" y2="220"/><line class="arrow" x1="790" y1="220" x2="840" y2="220"/><g class="dot"><circle cx="75" cy="120" r="5"/><circle cx="250" cy="330" r="5"/><circle cx="380" cy="110" r="5"/><circle cx="520" cy="325" r="5"/><circle cx="665" cy="105" r="5"/><circle cx="710" cy="110" r="5"/><circle cx="800" cy="115" r="5"/><circle cx="835" cy="150" r="5"/><circle cx="850" cy="300" r="5"/><circle cx="675" cy="330" r="5"/></g><text class="small" x="150" y="350" text-anchor="middle">entrada líquida de água</text><text class="small" x="450" y="350" text-anchor="middle">fluxos se compensam</text><text class="small" x="750" y="350" text-anchor="middle">saída líquida de água</text><text class="small" x="450" y="405" text-anchor="middle">tonicidade prevê a tendência de alteração do volume celular</text></svg>
