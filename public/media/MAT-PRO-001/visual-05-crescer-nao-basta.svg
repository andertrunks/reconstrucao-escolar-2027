<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Crescer junto não basta para proporcionalidade direta</title><desc id="d">Preço de cadernos dobra quando a quantidade dobra, mas área de quadrado quadruplica quando o lado dobra.</desc><rect x="35" y="35" width="830" height="390" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="80" text-anchor="middle" font-size="28" font-family="Arial">Compare os fatores de mudança</text><line x1="450" y1="105" x2="450" y2="380" stroke="currentColor" stroke-width="2"/><text x="235" y="130" text-anchor="middle" font-size="24" font-family="Arial">Diretamente proporcional</text><text x="665" y="130" text-anchor="middle" font-size="24" font-family="Arial">Não diretamente proporcional</text><text x="235" y="200" text-anchor="middle" font-size="28" font-family="Arial">2 cadernos → 4</text><text x="235" y="250" text-anchor="middle" font-size="28" font-family="Arial">R$ 16 → R$ 32</text><text x="235" y="310" text-anchor="middle" font-size="24" font-family="Arial">ambos × 2</text><text x="665" y="200" text-anchor="middle" font-size="28" font-family="Arial">lado 2 → 4</text><text x="665" y="250" text-anchor="middle" font-size="28" font-family="Arial">área 4 → 16</text><text x="665" y="310" text-anchor="middle" font-size="24" font-family="Arial">lado × 2; área × 4</text><text x="450" y="395" text-anchor="middle" font-size="23" font-family="Arial">Crescimento simultâneo não prova razão constante.</text></svg>