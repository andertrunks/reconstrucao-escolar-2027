<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">CRESCER JUNTO NÃO BASTA</title><desc id="desc">Duas grandezas podem aumentar sem serem proporcionais. 1. Exemplo proporcional. Dois cadernos custam R$ 16.. Quatro cadernos custam R$ 32.. 2→4 | 16→32. 2. Compare as razões. O preço por unidade. continua igual em ambos os pares.. 16/2 = 32/4 = 8. 3. Área do quadrado. Se lado vale dois, área vale quatro.. Com lado quatro, área vale 16.. 2→4 | 4→16. 4. Visualize os quadrados. As regiões não crescem. na mesma proporção do lado.. lado ×2 | área ×4. 5. Teste a constância. Área dividida por lado muda. de dois para quatro.. 4/2 = 2 | 16/4 = 4. 6. Conclusão. Aumentar ao mesmo tempo. não basta para ter proporção.. crescer ≠ ser proporcional</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">CRESCER JUNTO NÃO BASTA</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Duas grandezas podem aumentar sem serem proporcionais</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">1. Exemplo proporcional</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">2. Compare as razões</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">3. Área do quadrado</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">4. Visualize os quadrados</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">5. Teste a constância</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">6. Conclusão</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#355772">Reconstrução Escolar 2027 • MAT-PRO-001 • infográfico autoral</text><text x="44" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Dois cadernos custam R$16.</text><text x="44" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Quatro cadernos custam R$32.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">2→4 | 16→32</text><text x="44" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Ambos os valores dobram</text><text x="570" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Preço dividido por quantidade</text><text x="570" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">é oito nos dois casos.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">16/2 = 32/4 = 8</text><text x="570" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Razão constante</text><text x="1096" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Quadrado de lado dois: área 4.</text><text x="1096" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Quadrado de lado quatro: área 16.</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">lado 2→4; área 4→16</text><text x="1096" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Fatores de aumento diferentes</text><rect x="126" y="744" width="72" height="72" fill="#c5ddfb" stroke="#075bbb" stroke-width="3"/><rect x="274" y="672" width="144" height="144" fill="#b4e5c8" stroke="#087e54" stroke-width="3"/><text x="162" y="847" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#075bbb">lado 2</text><text x="345" y="847" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#087e54">lado 4</text><text x="274" y="648" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#234866">área 4 → área 16</text><text x="570" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">A razão área/lado é 2 no início</text><text x="570" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">e 4 depois do aumento.</text><rect x="566" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">4/2 = 2 | 16/4 = 4</text><text x="570" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Não é razão constante</text><text x="1096" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Crescer simultaneamente não basta.</text><text x="1096" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Compare as razões e os fatores.</text><rect x="1092" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">crescer ≠ proporcional</text><text x="1096" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Use a estrutura matemática</text></svg>