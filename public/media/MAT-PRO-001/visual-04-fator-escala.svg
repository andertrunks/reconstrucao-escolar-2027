<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">FATOR DE ESCALA NAS DUAS GRANDEZAS</title><desc id="desc">Uma proporção direta mantém o mesmo multiplicador. 1. Quantidade inicial. O exemplo começa com duas. unidades de um produto.. 2 unidades. 2. Preço inicial. Dezesseis reais por duas unidades.. Preço por unidade: oito reais.. 16/2 = R$ 8. 3. Triplique a quantidade. Duas unidades passam a seis.. Multiplicamos por três.. 2×3 = 6. 4. Triplique o preço. Dezesseis reais viram quarenta. e oito reais pelo mesmo fator.. 16×3 = R$ 48. 5. Observe as duas setas. Ambas devem indicar vezes três.. A razão permanece constante.. 2→6 | 16→48. 6. Confira. O novo preço por unidade. continua oito reais.. 48/6 = 8</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">FATOR DE ESCALA NAS DUAS GRANDEZAS</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Uma proporção direta mantém o mesmo multiplicador</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">1. Quantidade inicial</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">2. Preço inicial</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">3. Triplique a quantidade</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">4. Triplique o preço</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">5. Observe as duas setas</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">6. Confira</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#355772">Reconstrução Escolar 2027 • MAT-PRO-001 • infográfico autoral</text><text x="44" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">A compra inicial tem</text><text x="44" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">duas unidades do produto.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">2 unidades</text><text x="44" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Custo total: R$ 16</text><text x="570" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Dezesseis dividido por dois</text><text x="570" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">é oito reais por unidade.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">16/2 = 8</text><text x="570" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Taxa unitária</text><text x="1096" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Multiplique a quantidade por 3.</text><text x="1096" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Duas unidades viram seis.</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">2×3 = 6</text><text x="1096" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Fator de escala</text><text x="44" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Multiplique também o preço.</text><text x="44" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Dezesseis vira quarenta e oito.</text><rect x="40" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">16×3 = 48</text><text x="44" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Mesmo multiplicador</text><rect x="577" y="678" width="171" height="78" rx="10" fill="#fff" stroke="#075bbb" stroke-width="3"/><rect x="853" y="678" width="171" height="78" rx="10" fill="#fff" stroke="#087e54" stroke-width="3"/><text x="662" y="727" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#075bbb">2 un.</text><text x="937" y="727" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#087e54">6 un.</text><path d="M750 717H846" stroke="#285774" stroke-width="3"/><path d="M846 717l-11 -7v14z" fill="#285774"/><text x="799" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#284966">× 3</text><text x="800" y="847" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#25465f">R$ 16 × 3 = R$ 48</text><text x="1096" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">No novo par, o preço unitário</text><text x="1096" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">ainda vale oito reais.</text><rect x="1092" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">48/6 = 8</text><text x="1096" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Razão constante</text></svg>