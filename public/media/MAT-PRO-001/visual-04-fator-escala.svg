<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">O mesmo fator de escala nas duas grandezas</title><desc id="d">Duas unidades viram seis ao multiplicar por três, e dezesseis reais viram quarenta e oito pelo mesmo fator.</desc><rect x="40" y="40" width="820" height="340" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="95" text-anchor="middle" font-size="30" font-family="Arial">Mesmo fator de escala</text><text x="160" y="185" text-anchor="middle" font-size="34" font-family="Arial">2 unidades</text><text x="740" y="185" text-anchor="middle" font-size="34" font-family="Arial">6 unidades</text><text x="160" y="300" text-anchor="middle" font-size="34" font-family="Arial">R$ 16</text><text x="740" y="300" text-anchor="middle" font-size="34" font-family="Arial">R$ 48</text><path d="M290 175 H610" stroke="currentColor" stroke-width="3" marker-end="url(#a)"/><path d="M290 290 H610" stroke="currentColor" stroke-width="3" marker-end="url(#a)"/><text x="450" y="160" text-anchor="middle" font-size="28" font-family="Arial">× 3</text><text x="450" y="275" text-anchor="middle" font-size="28" font-family="Arial">× 3</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs></svg>