<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Meios, extremos e propriedade fundamental</title><desc id="d">A e d são extremos, b e c são meios e o produto a vezes d é igual ao produto b vezes c.</desc><rect x="40" y="40" width="820" height="340" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="115" text-anchor="middle" font-size="42" font-family="Arial">a / b = c / d</text><text x="180" y="175" text-anchor="middle" font-size="24" font-family="Arial">extremo</text><text x="720" y="175" text-anchor="middle" font-size="24" font-family="Arial">extremo</text><text x="330" y="205" text-anchor="middle" font-size="24" font-family="Arial">meio</text><text x="570" y="205" text-anchor="middle" font-size="24" font-family="Arial">meio</text><path d="M195 185 C250 250 650 250 705 185" fill="none" stroke="currentColor" stroke-width="3"/><path d="M345 215 C390 285 510 285 555 215" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="335" text-anchor="middle" font-size="36" font-family="Arial">a × d = b × c</text></svg>