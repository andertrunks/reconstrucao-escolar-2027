<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">MEIOS, EXTREMOS E PRODUTOS</title><desc id="desc">A propriedade fundamental decorre de razões iguais. 1. Organize a igualdade. Em a sobre b igual a c sobre d,. há quatro posições distintas.. a/b = c/d. 2. Reconheça extremos. O primeiro termo é a.. O último termo é d.. extremos: a e d. 3. Reconheça meios. Os termos centrais são b e c.. A posição é importante.. meios: b e c. 4. Produtos correspondentes. Multiplique os extremos.. Depois, multiplique os meios.. a×d = b×c. 5. Exemplo numérico. Duas sobre três é igual. a quatro sobre seis.. 2×6 = 3×4 = 12. 6. Não use sem contexto. Antes de cruzar produtos,. confira a ordem das grandezas.. a/b = c/d</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">MEIOS, EXTREMOS E PRODUTOS</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">A propriedade fundamental decorre de razões iguais</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">1. Organize a igualdade</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">2. Reconheça extremos</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">3. Reconheça meios</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">4. Produtos correspondentes</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">5. Exemplo numérico</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">6. Não use sem contexto</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#355772">Reconstrução Escolar 2027 • MAT-PRO-001 • infográfico autoral</text><text x="44" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">A expressão tem quatro termos.</text><text x="44" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Ela é uma igualdade de razões.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">a/b = c/d</text><text x="44" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Denominadores não nulos</text><text x="570" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">O primeiro e o último termos</text><text x="570" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">são chamados extremos.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">a e d</text><text x="570" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">As posições determinam os nomes</text><text x="1096" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">O segundo e o terceiro termos</text><text x="1096" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">são chamados meios.</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">b e c</text><text x="1096" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Eles aparecem no centro</text><rect x="65" y="650" width="418" height="126" rx="12" fill="#fff" stroke="#7da2bd" stroke-width="2"/><text x="152" y="727" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" text-anchor="middle" font-weight="700" fill="#075bbb">a/b</text><text x="274" y="727" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" text-anchor="middle" font-weight="700" fill="#274a65">=</text><text x="398" y="727" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" text-anchor="middle" font-weight="700" fill="#087e54">c/d</text><path d="M126 747L426 678 M186 678L370 747" stroke="#b86813" stroke-width="3" stroke-dasharray="8 5"/><text x="274" y="850" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" text-anchor="middle" font-weight="700" fill="#294d66">a × d = b × c</text><text x="570" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Dois sobre três equivale</text><text x="570" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">a quatro sobre seis.</text><rect x="566" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">2×6 = 3×4 = 12</text><text x="570" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Ambos os produtos dão 12</text><text x="1096" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Antes de multiplicar cruzado,</text><text x="1096" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">identifique os pares corretamente.</text><rect x="1092" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">a/b = c/d</text><text x="1096" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Não inverta uma única razão</text></svg>