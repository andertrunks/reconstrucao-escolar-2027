<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Tabela de proporcionalidade direta</title><desc id="d">Um, dois, três e cinco cadernos correspondem a oito, dezesseis, vinte e quatro e quarenta reais, mantendo oito reais por caderno.</desc><rect x="40" y="35" width="820" height="390" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="85" text-anchor="middle" font-size="30" font-family="Arial">Quantidade e preço</text><line x1="180" y1="125" x2="720" y2="125" stroke="currentColor" stroke-width="3"/><line x1="360" y1="105" x2="360" y2="360" stroke="currentColor" stroke-width="2"/><line x1="540" y1="105" x2="540" y2="360" stroke="currentColor" stroke-width="2"/><text x="270" y="115" text-anchor="middle" font-size="22" font-family="Arial">cadernos</text><text x="450" y="115" text-anchor="middle" font-size="22" font-family="Arial">preço (R$)</text><text x="630" y="115" text-anchor="middle" font-size="22" font-family="Arial">preço ÷ qtd.</text><g font-family="Arial" font-size="24" text-anchor="middle"><text x="270" y="165">1</text><text x="450" y="165">8</text><text x="630" y="165">8</text><text x="270" y="215">2</text><text x="450" y="215">16</text><text x="630" y="215">8</text><text x="270" y="265">3</text><text x="450" y="265">24</text><text x="630" y="265">8</text><text x="270" y="315">5</text><text x="450" y="315">40</text><text x="630" y="315">8</text></g><text x="450" y="390" text-anchor="middle" font-size="24" font-family="Arial">Razão constante: 8 reais por caderno</text></svg>