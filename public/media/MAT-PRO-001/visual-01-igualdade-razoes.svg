<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">PROPORÇÃO: DUAS RAZÕES IGUAIS</title><desc id="desc">Dois para três e quatro para seis têm o mesmo valor. 1. Razão inicial. Duas unidades comparadas a três.. Escrevemos dois para três.. 2 : 3 = 2/3. 2. Multiplique por dois. Faça a mesma multiplicação. no primeiro e segundo termos.. (2×2)/(3×2) = 4/6. 3. Observe as quantidades. Duas partes azuis para três verdes.. Depois, quatro para seis.. 2:3  =  4:6. 4. Confirme o valor. Dois terços e quatro sextos. representam o mesmo número.. 2/3 = 4/6. 5. Atenção ao fator. Multiplicar somente um termo. muda a razão apresentada.. 2/3 ≠ 4/3. 6. Regra geral. Razões iguais representam. a mesma comparação multiplicativa.. a/b = c/d</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">PROPORÇÃO: DUAS RAZÕES IGUAIS</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Dois para três e quatro para seis têm o mesmo valor</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">1. Razão inicial</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">2. Multiplique por dois</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">3. Observe as quantidades</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">4. Confirme o valor</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">5. Atenção ao fator</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">6. Regra geral</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#355772">Reconstrução Escolar 2027 • MAT-PRO-001 • infográfico autoral</text><text x="44" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Compare 2 unidades com 3.</text><text x="44" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">A razão é dois para três.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">2 : 3 = 2/3</text><text x="44" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">A ordem faz parte da razão</text><text x="570" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Multiplique numerador e divisor por 2.</text><text x="570" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Os dois termos mudam juntos.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">(2×2)/(3×2) = 4/6</text><text x="570" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">O quociente é preservado</text><rect x="1147" y="282" width="26" height="50" rx="5" fill="#78b4ea" stroke="#075bbb" stroke-width="2"/><rect x="1179" y="282" width="26" height="50" rx="5" fill="#78b4ea" stroke="#075bbb" stroke-width="2"/><rect x="1211" y="282" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><rect x="1243" y="282" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><rect x="1275" y="282" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><text x="1515" y="316" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" text-anchor="end" font-weight="700" fill="#22435d">2:3</text><rect x="1147" y="381" width="26" height="50" rx="5" fill="#78b4ea" stroke="#075bbb" stroke-width="2"/><rect x="1179" y="381" width="26" height="50" rx="5" fill="#78b4ea" stroke="#075bbb" stroke-width="2"/><rect x="1211" y="381" width="26" height="50" rx="5" fill="#78b4ea" stroke="#075bbb" stroke-width="2"/><rect x="1243" y="381" width="26" height="50" rx="5" fill="#78b4ea" stroke="#075bbb" stroke-width="2"/><rect x="1275" y="381" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><rect x="1307" y="381" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><rect x="1339" y="381" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><rect x="1371" y="381" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><rect x="1403" y="381" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><rect x="1435" y="381" width="26" height="50" rx="5" fill="#9edfc1" stroke="#087e54" stroke-width="2"/><text x="1515" y="415" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" text-anchor="end" font-weight="700" fill="#22435d">4:6</text><text x="1326" y="483" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#284f68">Azul: primeiro | Verde: segundo</text><text x="44" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Dois terços e quatro sextos</text><text x="44" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">têm exatamente o mesmo valor.</text><rect x="40" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">2/3 = 4/6</text><text x="44" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Esta igualdade é uma proporção</text><text x="570" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Multiplicar somente um termo</text><text x="570" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">mudaria o valor da razão.</text><rect x="566" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">2/3 ≠ 4/3</text><text x="570" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Use o mesmo fator nos dois termos</text><text x="1096" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Duas razões são proporcionais</text><text x="1096" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">quando seus valores são iguais.</text><rect x="1092" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">a/b = c/d</text><text x="1096" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">b e d precisam ser não nulos</text></svg>