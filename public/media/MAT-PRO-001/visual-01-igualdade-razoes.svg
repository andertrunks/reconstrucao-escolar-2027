<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Uma proporção é igualdade entre razões equivalentes</title><desc id="d">Dois para três é ampliado pelo fator dois para quatro para seis, preservando a mesma razão.</desc><rect x="40" y="40" width="820" height="340" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="95" text-anchor="middle" font-size="30" font-family="Arial">2 : 3 = 4 : 6</text><rect x="120" y="150" width="120" height="70" rx="12" fill="none" stroke="currentColor" stroke-width="3"/><text x="180" y="194" text-anchor="middle" font-size="30" font-family="Arial">2</text><rect x="120" y="260" width="180" height="70" rx="12" fill="none" stroke="currentColor" stroke-width="3"/><text x="210" y="304" text-anchor="middle" font-size="30" font-family="Arial">3</text><text x="390" y="210" text-anchor="middle" font-size="28" font-family="Arial">× 2</text><text x="390" y="300" text-anchor="middle" font-size="28" font-family="Arial">× 2</text><path d="M250 185 H520" stroke="currentColor" stroke-width="3" marker-end="url(#a)"/><path d="M310 295 H520" stroke="currentColor" stroke-width="3" marker-end="url(#a)"/><rect x="560" y="150" width="240" height="70" rx="12" fill="none" stroke="currentColor" stroke-width="3"/><text x="680" y="194" text-anchor="middle" font-size="30" font-family="Arial">4</text><rect x="560" y="260" width="240" height="70" rx="12" fill="none" stroke="currentColor" stroke-width="3"/><text x="680" y="304" text-anchor="middle" font-size="30" font-family="Arial">6</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs></svg>