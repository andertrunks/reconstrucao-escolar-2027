<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Checklist para construir frases com to be</title>
<desc id="desc">Checklist para construir frases com to be. Diagrama didático textual; a explicação completa também aparece no texto da aula.</desc>
<rect x="12" y="12" width="936" height="516" rx="24" fill="#ffffff" stroke="#111111" stroke-width="3"/>
<text x="480" y="52" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700">Checklist para construir frases com to be</text>
<rect x="90" y="85" width="780" height="48" rx="12" fill="#f7f7f7" stroke="#111"/>
<text x="480" y="116" text-anchor="middle" font-size="20" font-family="Arial">1. Identifique o sujeito</text>
<rect x="90" y="152" width="780" height="48" rx="12" fill="#f7f7f7" stroke="#111"/>
<text x="480" y="183" text-anchor="middle" font-size="20" font-family="Arial">2. Decida: I, singular, you ou plural</text>
<rect x="90" y="219" width="780" height="48" rx="12" fill="#f7f7f7" stroke="#111"/>
<text x="480" y="250" text-anchor="middle" font-size="20" font-family="Arial">3. Escolha am, is ou are</text>
<rect x="90" y="286" width="780" height="48" rx="12" fill="#f7f7f7" stroke="#111"/>
<text x="480" y="317" text-anchor="middle" font-size="20" font-family="Arial">4. Defina: afirmativa, negativa ou interrogativa</text>
<rect x="90" y="353" width="780" height="48" rx="12" fill="#f7f7f7" stroke="#111"/>
<text x="480" y="384" text-anchor="middle" font-size="20" font-family="Arial">5. Confira complemento e contexto</text>
<rect x="90" y="420" width="780" height="48" rx="12" fill="#f7f7f7" stroke="#111"/>
<text x="480" y="451" text-anchor="middle" font-size="20" font-family="Arial">6. Em short answer, repita pronome + to be</text>
</svg>
