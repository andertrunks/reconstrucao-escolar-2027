<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Mapa dos pronomes pessoais de sujeito</title>
<desc id="desc">Mapa dos pronomes pessoais de sujeito. Diagrama didático textual; a explicação completa também aparece no texto da aula.</desc>
<rect x="12" y="12" width="936" height="516" rx="24" fill="#ffffff" stroke="#111111" stroke-width="3"/>
<text x="480" y="60" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700">Pronomes pessoais de sujeito</text>
<line x1="480" y1="85" x2="480" y2="125" stroke="#111" stroke-width="3"/>
<g font-family="Arial" text-anchor="middle">
<rect x="55" y="135" width="250" height="115" rx="16" fill="#f7f7f7" stroke="#111"/><text x="180" y="175" font-size="28" font-weight="700">I</text><text x="180" y="210" font-size="20">quem fala · eu</text>
<rect x="355" y="135" width="250" height="115" rx="16" fill="#f7f7f7" stroke="#111"/><text x="480" y="175" font-size="28" font-weight="700">you</text><text x="480" y="210" font-size="20">quem ouve · singular/plural</text>
<rect x="655" y="135" width="250" height="115" rx="16" fill="#f7f7f7" stroke="#111"/><text x="780" y="175" font-size="28" font-weight="700">he · she · it</text><text x="780" y="210" font-size="20">referente singular</text>
<rect x="205" y="315" width="250" height="115" rx="16" fill="#f7f7f7" stroke="#111"/><text x="330" y="355" font-size="28" font-weight="700">we</text><text x="330" y="390" font-size="20">grupo que inclui quem fala</text>
<rect x="505" y="315" width="250" height="115" rx="16" fill="#f7f7f7" stroke="#111"/><text x="630" y="355" font-size="28" font-weight="700">they</text><text x="630" y="390" font-size="20">grupos; também uso singular real</text>
<text x="480" y="495" font-size="22">Primeiro identifique o sujeito; depois escolha a forma do verbo.</text>
</g>
</svg>
