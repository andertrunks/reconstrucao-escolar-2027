<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">As sete grandezas e unidades de base do SI</title><desc id="desc">Mapa com sete pares: tempo segundo s; comprimento metro m; massa quilograma kg; corrente elétrica ampere A; temperatura termodinâmica kelvin K; quantidade de substância mol mol; intensidade luminosa candela cd.</desc><rect width="1100" height="680" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">As sete grandezas e unidades de base do SI</text><g font-family="Arial,sans-serif"><g transform="translate(65 105)"><rect width="450" height="92" rx="18" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="24" y="37" font-size="20" font-weight="700" fill="#173b29">Tempo</text><text x="24" y="70" font-size="18" fill="#2b4a39">segundo — s</text></g><g transform="translate(585 105)"><rect width="450" height="92" rx="18" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/><text x="24" y="37" font-size="20" font-weight="700" fill="#303d58">Comprimento</text><text x="24" y="70" font-size="18" fill="#46526a">metro — m</text></g><g transform="translate(65 220)"><rect width="450" height="92" rx="18" fill="#f8f2e8" stroke="#7a5b2f" stroke-width="3"/><text x="24" y="37" font-size="20" font-weight="700" fill="#553d20">Massa</text><text x="24" y="70" font-size="18" fill="#604a2d">quilograma — kg</text></g><g transform="translate(585 220)"><rect width="450" height="92" rx="18" fill="#f3f1f8" stroke="#65548a" stroke-width="3"/><text x="24" y="37" font-size="20" font-weight="700" fill="#473a64">Corrente elétrica</text><text x="24" y="70" font-size="18" fill="#574a70">ampere — A</text></g><g transform="translate(65 335)"><rect width="450" height="92" rx="18" fill="#f2f5ee" stroke="#527044" stroke-width="3"/><text x="24" y="37" font-size="20" font-weight="700" fill="#30452b">Temperatura termodinâmica</text><text x="24" y="70" font-size="18" fill="#42523b">kelvin — K</text></g><g transform="translate(585 335)"><rect width="450" height="92" rx="18" fill="#f6eeee" stroke="#815050" stroke-width="3"/><text x="24" y="37" font-size="20" font-weight="700" fill="#5a3434">Quantidade de substância</text><text x="24" y="70" font-size="18" fill="#684343">mol — mol</text></g><g transform="translate(325 450)"><rect width="450" height="92" rx="18" fill="#eef5f6" stroke="#496b70" stroke-width="3"/><text x="24" y="37" font-size="20" font-weight="700" fill="#29484d">Intensidade luminosa</text><text x="24" y="70" font-size="18" fill="#3e5a5f">candela — cd</text></g></g><text x="550" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24322b">Essas sete unidades formam a base do Sistema Internacional de Unidades.</text><text x="55" y="642" font-family="Arial,sans-serif" font-size="18" fill="#2a3630">Unidades derivadas, como m², m³ e m/s, são construídas combinando unidades de base.</text></svg>