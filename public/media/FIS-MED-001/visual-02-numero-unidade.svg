<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Resultado de medição: valor numérico mais unidade</title><desc id="desc">A medida 12 centímetros é separada em valor numérico 12 e unidade centímetro, símbolo cm.</desc><rect width="1100" height="500" fill="#fff"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Resultado de medição: valor numérico + unidade</text><rect x="365" y="115" width="370" height="100" rx="24" fill="#f4f6f5" stroke="#59645e" stroke-width="3"/><text x="550" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#24322b">12 cm</text><line x1="470" y1="215" x2="300" y2="285" stroke="#315f46" stroke-width="3"/><line x1="630" y1="215" x2="800" y2="285" stroke="#4e5f7f" stroke-width="3"/><rect x="105" y="285" width="390" height="110" rx="20" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="300" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173b29">valor numérico</text><text x="300" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#173b29">12</text><rect x="605" y="285" width="390" height="110" rx="20" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/><text x="800" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#303d58">unidade</text><text x="800" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#303d58">centímetro (cm)</text><text x="55" y="460" font-family="Arial,sans-serif" font-size="18" fill="#2a3630">Sem a unidade, o número não informa qual padrão foi usado na medição.</text></svg>