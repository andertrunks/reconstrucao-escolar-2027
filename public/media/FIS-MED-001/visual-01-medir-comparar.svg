<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Medir é comparar com uma unidade de referência</title><desc id="desc">Uma barra de comprimento desconhecido é comparada com seis unidades iguais colocadas lado a lado.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Medir é comparar com uma unidade de referência</text><rect x="105" y="135" width="840" height="72" rx="16" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/><text x="525" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#303d58">comprimento a medir</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="105" y="265" width="140" height="95" rx="12" fill="#edf7f0" stroke="#315f46" stroke-width="2"/><rect x="245" y="265" width="140" height="95" rx="12" fill="#edf7f0" stroke="#315f46" stroke-width="2"/><rect x="385" y="265" width="140" height="95" rx="12" fill="#edf7f0" stroke="#315f46" stroke-width="2"/><rect x="525" y="265" width="140" height="95" rx="12" fill="#edf7f0" stroke="#315f46" stroke-width="2"/><rect x="665" y="265" width="140" height="95" rx="12" fill="#edf7f0" stroke="#315f46" stroke-width="2"/><rect x="805" y="265" width="140" height="95" rx="12" fill="#edf7f0" stroke="#315f46" stroke-width="2"/><text x="175" y="322" font-size="22" fill="#173b29">1 unidade</text><text x="315" y="322" font-size="22" fill="#173b29">1 unidade</text><text x="455" y="322" font-size="22" fill="#173b29">1 unidade</text><text x="595" y="322" font-size="22" fill="#173b29">1 unidade</text><text x="735" y="322" font-size="22" fill="#173b29">1 unidade</text><text x="875" y="322" font-size="22" fill="#173b29">1 unidade</text></g><text x="525" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24322b">Resultado: 6 unidades de referência</text><text x="55" y="480" font-family="Arial,sans-serif" font-size="18" fill="#2a3630">A medida é obtida comparando a grandeza com uma unidade escolhida.</text></svg>