<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Escala e resolução de um instrumento</title><desc id="desc">Régua ampliada entre quatro e cinco centímetros, com divisões de um milímetro. Um objeto termina entre 4,2 e 4,3 centímetros.</desc><rect width="1100" height="560" fill="#fff"/><text x="55" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Escala e resolução de um instrumento</text><text x="105" y="125" font-family="Arial,sans-serif" font-size="20" fill="#2a3630">Exemplo: régua com divisões de 1 mm, isto é, um milímetro.</text><line x1="120" y1="300" x2="980" y2="300" stroke="#24322b" stroke-width="5"/><g stroke="#24322b"><line x1="140" y1="300" x2="140" y2="220" stroke-width="5"/><line x1="220" y1="300" x2="220" y2="255" stroke-width="3"/><line x1="300" y1="300" x2="300" y2="255" stroke-width="3"/><line x1="380" y1="300" x2="380" y2="255" stroke-width="3"/><line x1="460" y1="300" x2="460" y2="255" stroke-width="3"/><line x1="540" y1="300" x2="540" y2="220" stroke-width="5"/><line x1="620" y1="300" x2="620" y2="255" stroke-width="3"/><line x1="700" y1="300" x2="700" y2="255" stroke-width="3"/><line x1="780" y1="300" x2="780" y2="255" stroke-width="3"/><line x1="860" y1="300" x2="860" y2="255" stroke-width="3"/><line x1="940" y1="300" x2="940" y2="220" stroke-width="5"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24322b"><text x="140" y="345" font-size="22">4,0 cm</text><text x="220" y="340" font-size="16">4,1</text><text x="300" y="340" font-size="16">4,2</text><text x="380" y="340" font-size="16">4,3</text><text x="460" y="340" font-size="16">4,4</text><text x="540" y="345" font-size="22">4,5</text><text x="940" y="345" font-size="22">5,0 cm</text></g><rect x="140" y="165" width="205" height="38" rx="12" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><line x1="345" y1="184" x2="345" y2="300" stroke="#315f46" stroke-width="4" stroke-dasharray="9 7"/><text x="242" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b29">objeto termina aqui</text><text x="550" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24322b">A menor divisão visível limita o detalhamento direto da leitura.</text><text x="550" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#2a3630">Divisões menores permitem distinguir diferenças menores, dentro dos limites do instrumento.</text><text x="55" y="515" font-family="Arial,sans-serif" font-size="17" fill="#2a3630">Não se deve registrar uma precisão que a escala do instrumento não permite observar.</text></svg>