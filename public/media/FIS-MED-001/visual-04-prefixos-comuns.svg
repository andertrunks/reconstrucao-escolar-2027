<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Prefixos comuns: quilo, centi e mili</title><desc id="desc">Escala conceitual: quilo corresponde a mil vezes a unidade; unidade sem prefixo corresponde a um; centi a um centésimo; mili a um milésimo.</desc><rect width="1100" height="560" fill="#fff"/><text x="55" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Prefixos comuns: quilo, centi e mili</text><line x1="120" y1="285" x2="980" y2="285" stroke="#59645e" stroke-width="5"/><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="175" cy="285" r="18" fill="#fff" stroke="#315f46" stroke-width="5"/><text x="175" y="170" font-size="26" font-weight="700" fill="#173b29">quilo (k)</text><text x="175" y="208" font-size="20" fill="#2b4a39">1 000 × unidade</text><text x="175" y="340" font-size="18" fill="#2b4a39">ex.: 1 km = 1 000 m</text><circle cx="430" cy="285" r="18" fill="#fff" stroke="#4e5f7f" stroke-width="5"/><text x="430" y="170" font-size="26" font-weight="700" fill="#303d58">unidade</text><text x="430" y="208" font-size="20" fill="#46526a">1 × unidade</text><text x="430" y="340" font-size="18" fill="#46526a">ex.: 1 m</text><circle cx="685" cy="285" r="18" fill="#fff" stroke="#7a5b2f" stroke-width="5"/><text x="685" y="170" font-size="26" font-weight="700" fill="#553d20">centi (c)</text><text x="685" y="208" font-size="20" fill="#604a2d">1/100 da unidade</text><text x="685" y="340" font-size="18" fill="#604a2d">100 cm = 1 m</text><circle cx="930" cy="285" r="18" fill="#fff" stroke="#815050" stroke-width="5"/><text x="930" y="170" font-size="26" font-weight="700" fill="#5a3434">mili (m)</text><text x="930" y="208" font-size="20" fill="#684343">1/1 000 da unidade</text><text x="930" y="340" font-size="18" fill="#684343">1 000 mm = 1 m</text></g><rect x="155" y="405" width="790" height="82" rx="20" fill="#f4f6f5" stroke="#59645e" stroke-width="2"/><text x="550" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24322b">O prefixo muda a escala; a grandeza continua a mesma.</text><text x="550" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#2a3630">Quilômetro, metro, centímetro e milímetro continuam medindo comprimento.</text><text x="55" y="530" font-family="Arial,sans-serif" font-size="17" fill="#2a3630">A posição no desenho é conceitual; as razões numéricas estão escritas em cada rótulo.</text></svg>