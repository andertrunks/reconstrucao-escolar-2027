<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Verificação da solução por substituição</title><desc id="d">Substituição de x igual a quatro na equação dois x mais três igual a onze, resultando em onze igual a onze.</desc><rect width="900" height="520" fill="white"/><text x="450" y="75" text-anchor="middle" font-size="32" font-family="Arial">Verificar x = 4</text><text x="450" y="160" text-anchor="middle" font-size="42" font-family="Arial">2x + 3 = 11</text><text x="450" y="235" text-anchor="middle" font-size="30" font-family="Arial">2 × 4 + 3 = 11</text><text x="450" y="310" text-anchor="middle" font-size="30" font-family="Arial">8 + 3 = 11</text><text x="450" y="385" text-anchor="middle" font-size="38" font-family="Arial" font-weight="bold">11 = 11</text><text x="450" y="455" text-anchor="middle" font-size="24" font-family="Arial">A igualdade é verdadeira: a solução foi confirmada.</text></svg>