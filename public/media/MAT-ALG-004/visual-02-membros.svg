<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Anatomia da equação dois x mais três igual a onze</title><desc id="d">A equação é separada em primeiro membro, sinal de igualdade e segundo membro, com x identificado como incógnita.</desc><rect width="900" height="520" fill="white"/><text x="450" y="150" text-anchor="middle" font-size="58" font-family="Arial">2x + 3 = 11</text><line x1="165" y1="190" x2="435" y2="190" stroke="black" stroke-width="3"/><line x1="555" y1="190" x2="735" y2="190" stroke="black" stroke-width="3"/><text x="300" y="235" text-anchor="middle" font-size="26" font-family="Arial">primeiro membro</text><text x="645" y="235" text-anchor="middle" font-size="26" font-family="Arial">segundo membro</text><text x="495" y="235" text-anchor="middle" font-size="24" font-family="Arial">igualdade</text><line x1="325" y1="110" x2="325" y2="70" stroke="black" stroke-width="3"/><text x="325" y="50" text-anchor="middle" font-size="24" font-family="Arial">x: incógnita</text><text x="450" y="360" text-anchor="middle" font-size="28" font-family="Arial">A solução deve tornar os dois membros iguais.</text></svg>