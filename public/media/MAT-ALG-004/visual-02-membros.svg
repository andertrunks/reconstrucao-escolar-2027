<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">ANATOMIA DE UMA EQUAÇÃO</title><desc id="desc">Reconheça incógnita, membros e igualdade. Equação de referência. O primeiro membro é 2x+3.. O segundo membro é 11.. 2x + 3 = 11. O sinal = relaciona os dois. Primeiro membro. É o que aparece à esquerda. do sinal de igualdade.. 2x + 3. Duas vezes x mais três. Segundo membro. É o que aparece à direita. do sinal de igualdade.. 11. Quantidade de comparação. Incógnita. x representa o valor desconhecido. que torna os membros iguais.. x. A letra não é uma resposta. Não é identidade. Nem todo x satisfaz a equação.. É preciso encontrar o valor.. 2x+3 = 11. Temos uma condição. Conferência rápida. x=4 dá 2×4+3=11.. Os membros têm o mesmo valor.. 11 = 11. Essa é uma solução</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">ANATOMIA DE UMA EQUAÇÃO</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Reconheça incógnita, membros e igualdade</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="97" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" 