<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Modelagem de uma tarifa por equação</title><desc id="d">Situação de taxa fixa de doze reais mais três reais por unidade totalizando trinta reais, traduzida para doze mais três x igual a trinta e resolvida com x igual a seis.</desc><rect width="900" height="520" fill="white"/><text x="450" y="55" text-anchor="middle" font-size="30" font-family="Arial">Situação → equação → solução</text><rect x="70" y="110" width="760" height="90" rx="14" fill="none" stroke="black" stroke-width="3"/><text x="450" y="148" text-anchor="middle" font-size="24" font-family="Arial">Taxa fixa R$ 12 + R$ 3 por unidade</text><text x="450" y="180" text-anchor="middle" font-size="24" font-family="Arial">Total: R$ 30</text><path d="M450 205 L450 245" stroke="black" stroke-width="3"/><text x="450" y="295" text-anchor="middle" font-size="40" font-family="Arial">12 + 3x = 30</text><path d="M450 315 L450 355" stroke="black" stroke-width="3"/><text x="450" y="405" text-anchor="middle" font-size="34" font-family="Arial">3x = 18</text><text x="450" y="465" text-anchor="middle" font-size="38" font-family="Arial" font-weight="bold">x = 6 unidades</text></svg>