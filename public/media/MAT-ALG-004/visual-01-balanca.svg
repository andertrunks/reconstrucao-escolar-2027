<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Equação como balança em equilíbrio</title><desc id="d">Balança conceitual para x mais dois igual a cinco; retirar dois de cada lado preserva o equilíbrio e revela x igual a três.</desc><rect width="900" height="520" fill="white"/><text x="450" y="50" text-anchor="middle" font-size="30" font-family="Arial">x + 2 = 5</text><line x1="450" y1="110" x2="450" y2="360" stroke="black" stroke-width="8"/><line x1="250" y1="190" x2="650" y2="190" stroke="black" stroke-width="8"/><line x1="250" y1="190" x2="190" y2="310" stroke="black" stroke-width="4"/><line x1="650" y1="190" x2="710" y2="310" stroke="black" stroke-width="4"/><rect x="100" y="310" width="180" height="24" fill="none" stroke="black" stroke-width="4"/><rect x="620" y="310" width="180" height="24" fill="none" stroke="black" stroke-width="4"/><text x="190" y="285" text-anchor="middle" font-size="28" font-family="Arial">x + 1 + 1</text><text x="710" y="285" text-anchor="middle" font-size="28" font-family="Arial">1 + 1 + 1 + 1 + 1</text><text x="450" y="405" text-anchor="middle" font-size="25" font-family="Arial">Retire 2 dos dois lados</text><text x="450" y="455" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">x = 3</text></svg>