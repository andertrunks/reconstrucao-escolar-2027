<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">EQUAÇÃO EM DUAS ETAPAS</title><desc id="desc">Operações nos dois membros produzem equações equivalentes. Passo 1: escreva. Comece da igualdade original.. A incógnita aparece em 2x.. 2x + 3 = 11. Queremos isolar x. Passo 2: subtraia 3. Subtraia três dos dois membros.. Os dois lados continuam iguais.. 2x+3−3 = 11−3. Princípio aditivo. Passo 3: simplifique. Mais três e menos três se anulam.. O segundo membro vira oito.. 2x = 8. Ainda restam dois x. Passo 4: divida por 2. Divida ambos os membros por 2.. O divisor é diferente de zero.. 2x/2 = 8/2. Princípio multiplicativo. Passo 5: solução. A incógnita fica isolada.. O resultado é quatro.. x = 4. Verifique na original. Passo 6: prove. Duas vezes quatro mais três. é igual a onze.. 2×4+3 = 11. Todas as etapas conservam a solução</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">EQUAÇÃO EM DUAS ETAPAS</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Operações nos dois membros produzem equações equivalentes</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="97" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Passo 1: escreva</text><text x="46" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Comece da igualdade original.</text><text x="46" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">A incógnita aparece em 2x.</text><rect x="42" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="274" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x + 3 = 11</text><text x="46" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Queremos isolar x</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="623" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Passo 2: subtraia 3</text><text x="572" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Subtraia três dos dois membros.</text><text x="572" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Os dois lados continuam iguais.</text><rect x="568" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="800" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x+3−3 = 11−3</text><text x="572" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e54">Princípio aditivo</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1149" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Passo 3: simplifique</text><text x="1098" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Mais três e menos três se anulam.</text><text x="1098" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">O segundo membro vira oito.</text><rect x="1094" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="1326" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x = 8</text><text x="1098" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Ainda restam dois x</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="97" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Passo 4: divida por 2</text><text x="46" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Divida ambos os membros por 2.</text><text x="46" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">O divisor é diferente de zero.</text><rect x="42" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="274" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x/2 = 8/2</text><text x="46" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Princípio multiplicativo</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="623" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Passo 5: solução</text><text x="572" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">A incógnita fica isolada.</text><text x="572" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">O resultado é quatro.</text><rect x="568" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="800" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">x = 4</text><text x="572" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">Verifique na original</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1149" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Passo 6: prove</text><text x="1098" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Duas vezes quatro mais três</text><text x="1098" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">é igual a onze.</text><rect x="1094" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="1326" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2×4+3 = 11</text><text x="1098" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Todas as etapas conservam a solução</text><text x="25" y="934" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#3d5673">Reconstrução Escolar 2027 • MAT-ALG-004 • infográfico autoral</text></svg>