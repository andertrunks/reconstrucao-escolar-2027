<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Resolução em duas etapas</title><desc id="d">Fluxo de dois x mais três igual a onze para dois x igual a oito e depois x igual a quatro, sempre aplicando a mesma operação nos dois membros.</desc><rect width="900" height="520" fill="white"/><rect x="250" y="55" width="400" height="90" rx="16" fill="none" stroke="black" stroke-width="3"/><text x="450" y="112" text-anchor="middle" font-size="34" font-family="Arial">2x + 3 = 11</text><text x="450" y="185" text-anchor="middle" font-size="22" font-family="Arial">subtraia 3 dos dois membros</text><path d="M450 205 L450 245" stroke="black" stroke-width="3"/><rect x="250" y="245" width="400" height="90" rx="16" fill="none" stroke="black" stroke-width="3"/><text x="450" y="302" text-anchor="middle" font-size="34" font-family="Arial">2x = 8</text><text x="450" y="375" text-anchor="middle" font-size="22" font-family="Arial">divida os dois membros por 2</text><path d="M450 395 L450 430" stroke="black" stroke-width="3"/><text x="450" y="485" text-anchor="middle" font-size="38" font-family="Arial" font-weight="bold">x = 4</text></svg>