<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Teste exato de permutação de dois grupos</title><desc id="desc">Grupos A com valores 2, 4, 6 e B com 8, 10, 12; 20 realocações possíveis e 2 tão extremas quanto a diferença observada de menos seis.</desc><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#13263c}.heading{font-size:27px;font-weight:bold}.note{font-size:16px}.small{font-size:14px}.big{font-size:22px;font-weight:bold}.box{stroke:#152b46;stroke-width:2;fill:#eef6fb}.line{stroke:#152b46;stroke-width:2;fill:none}</style><text class="heading" x="38" y="45">Teste de permutação: o mundo hipotético sob H0</text><rect x="45" y="100" width="285" height="115" rx="14" fill="#eef6fb" stroke="#152b46" stroke-width="2"/><text x="187.5" y="136" font-size="19" font-weight="bold" text-anchor="middle">Grupos observados</text><text x="187.5" y="167" class="note" text-anchor="middle">A:[2,4,6] B:[8,10,12]</text><path d="M345 158 L405 158" fill="none" stroke="#152b46" stroke-width="2.5"/><path d="M395 152 L405 158 L395 164" fill="none" stroke="#152b46" stroke-width="2.5"/><rect x="415" y="100" width="235" height="115" rx="14" fill="#fff6e6" stroke="#152b46" stroke-width="2"/><text x="532.5" y="136" font-size="19" font-weight="bold" text-anchor="middle">Juntar seis dados</text><text x="532.5" y="167" class="note" text-anchor="middle">Rótulos intercambiáveis</text><path d="M660 158 L710 158" fill="none" stroke="#152b46" stroke-width="2.5"/><path d="M700 152 L710 158 L700 164" fill="none" stroke="#152b46" stroke-width="2.5"/><rect x="715" y="100" width="208" height="115" rx="14" fill="#eef6fb" stroke="#152b46" stroke-width="2"/><text x="819.0" y="136" font-size="19" font-weight="bold" text-anchor="middle">Realocar 3 + 3</text><text x="819.0" y="167" class="note" text-anchor="middle">C(6,3)=20</text><text x="90" y="295" class="big">Diferença observada A − B = −6</text><text x="90" y="343" class="big">Extremos |diferença| ≥ 6: 2 de 20</text><text x="90" y="390" class="big">p bicaudal exato = 2/20 = 0,10</text><text x="90" y="439" class="note">Troca de rótulos exige hipótese nula e desenho que autorizem intercambiabilidade.</text></svg>