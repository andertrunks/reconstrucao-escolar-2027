<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Intervalo bootstrap percentílico de 95%</title><desc id="desc">Faixa horizontal de 256 médias bootstrap com 2,5 por cento em cada cauda e intervalo central ilustrativo de 3 a 7.</desc><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#13263c}.heading{font-size:27px;font-weight:bold}.note{font-size:16px}.small{font-size:14px}.big{font-size:22px;font-weight:bold}.box{stroke:#152b46;stroke-width:2;fill:#eef6fb}.line{stroke:#152b46;stroke-width:2;fill:none}</style><text class="heading" x="38" y="45">Intervalo percentílico: caudas e região central</text><rect x="100" y="170" width="760" height="82" fill="#eef6fb" stroke="#152b46" stroke-width="2"/><rect x="100" y="170" width="85" height="82" fill="#f2d29a"/><rect x="775" y="170" width="85" height="82" fill="#f2d29a"/><path d="M185 159 V270 M775 159 V270" stroke="#152b46" stroke-width="2" stroke-dasharray="5 4"/><text x="143" y="216" text-anchor="middle" class="big">2,5%</text><text x="480" y="216" text-anchor="middle" class="big">95% centrais</text><text x="817" y="216" text-anchor="middle" class="big">2,5%</text><text x="185" y="302" text-anchor="middle" class="big">Q 2,5% = 3</text><text x="775" y="302" text-anchor="middle" class="big">Q 97,5% = 7</text><text x="480" y="380" text-anchor="middle" class="big">Intervalo ilustrativo: [3, 7]</text><text x="480" y="415" text-anchor="middle" class="note">A amostra n=4 é pequena: cobertura real pode divergir do nível nominal.</text></svg>