<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Ciclo do bootstrap não paramétrico</title><desc id="desc">Amostra original [2, 4, 6, 8], sorteio de quatro valores com reposição e cálculo repetido da média.</desc><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#13263c}.heading{font-size:27px;font-weight:bold}.note{font-size:16px}.small{font-size:14px}.big{font-size:22px;font-weight:bold}.box{stroke:#152b46;stroke-width:2;fill:#eef6fb}.line{stroke:#152b46;stroke-width:2;fill:none}</style><text class="heading" x="38" y="45">De uma amostra observada à distribuição bootstrap</text><rect x="32" y="118" width="235" height="115" rx="14" fill="#eef6fb" stroke="#152b46" stroke-width="2"/><text x="149.5" y="154" font-size="19" font-weight="bold" text-anchor="middle">Amostra observada</text><text x="149.5" y="185" class="note" text-anchor="middle">[2, 4, 6, 8]</text><path d="M276 176 L346 176" fill="none" stroke="#152b46" stroke-width="2.5"/><path d="M336 170 L346 176 L336 182" fill="none" stroke="#152b46" stroke-width="2.5"/><rect x="355" y="118" width="245" height="115" rx="14" fill="#fff6e6" stroke="#152b46" stroke-width="2"/><text x="477.5" y="154" font-size="19" font-weight="bold" text-anchor="middle">Sorteios com reposição</text><text x="477.5" y="185" class="note" text-anchor="middle">4 registros por réplica</text><path d="M607 176 L678 176" fill="none" stroke="#152b46" stroke-width="2.5"/><path d="M668 170 L678 176 L668 182" fill="none" stroke="#152b46" stroke-width="2.5"/><rect x="688" y="118" width="234" height="115" rx="14" fill="#eef6fb" stroke="#152b46" stroke-width="2"/><text x="805.0" y="154" font-size="19" font-weight="bold" text-anchor="middle">Estatística por réplica</text><text x="805.0" y="185" class="note" text-anchor="middle">Média, mediana, ...</text><text x="90" y="302" font-size="20">[2, 2, 8, 8] → 5</text><text x="90" y="349" font-size="20">[8, 8, 8, 2] → 6,5</text><text x="90" y="396" font-size="20">[2, 4, 6, 8] → 5</text><text x="480" y="305" class="big">Repetir B vezes</text><text x="480" y="350" class="note">A distribuição das estatísticas estima a incerteza.</text><text x="480" y="395" class="note">B réplicas não são B novas amostras populacionais.</text></svg>