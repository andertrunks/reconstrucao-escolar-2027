<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Reamostragem com e sem reposição</title><desc id="desc">Quadro compara amostragem dos quatro dados originais sem reposição, média fixa, e com reposição, média variável.</desc><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#13263c}.heading{font-size:27px;font-weight:bold}.note{font-size:16px}.small{font-size:14px}.big{font-size:22px;font-weight:bold}.box{stroke:#152b46;stroke-width:2;fill:#eef6fb}.line{stroke:#152b46;stroke-width:2;fill:none}</style><text class="heading" x="38" y="45">Por que o sorteio precisa ser com reposição?</text><rect x="50" y="94" width="365" height="100" rx="14" fill="#eef6fb" stroke="#152b46" stroke-width="2"/><text x="232.5" y="130" font-size="19" font-weight="bold" text-anchor="middle">Sem reposição</text><text x="232.5" y="161" class="note" text-anchor="middle">[2,4,6,8] em outra ordem</text><rect x="545" y="94" width="365" height="100" rx="14" fill="#fff6e6" stroke="#152b46" stroke-width="2"/><text x="727.5" y="130" font-size="19" font-weight="bold" text-anchor="middle">Com reposição</text><text x="727.5" y="161" class="note" text-anchor="middle">Ex.: [8,8,8,2]</text><text x="232" y="248" text-anchor="middle" class="big">Média sempre 5</text><text x="730" y="248" text-anchor="middle" class="big">Média pode mudar</text><text x="56" y="330" class="note">Quatro escolhas de quatro, sem repor:</text><text x="56" y="360" class="note">muda a ordem, não muda a composição.</text><text x="540" y="330" class="note">Quatro escolhas, com reposição:</text><text x="540" y="360" class="note">alguns valores repetem; outros ficam de fora.</text><text x="480" y="439" text-anchor="middle" class="big">4⁴ = 256 sequências ordenadas possíveis</text></svg>