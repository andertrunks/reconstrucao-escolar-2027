<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Comparação de magnitude na reta numérica</title><desc id="d">Reta de 900 a 1 200 com pontos 980, 1 040 e 1 170 em ordem crescente da esquerda para a direita.</desc><rect width="960" height="300" fill="white"/><g font-family="sans-serif"><text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700">Na reta numérica, maior significa mais à direita</text><line x1="90" y1="160" x2="870" y2="160" stroke="#333" stroke-width="3"/><g stroke="#333" stroke-width="2"><line x1="90" y1="145" x2="90" y2="175"/><line x1="350" y1="145" x2="350" y2="175"/><line x1="610" y1="145" x2="610" y2="175"/><line x1="870" y1="145" x2="870" y2="175"/></g><g text-anchor="middle" font-size="17"><text x="90" y="205">900</text><text x="350" y="205">1 000</text><text x="610" y="205">1 100</text><text x="870" y="205">1 200</text></g><g fill="white" stroke="#111" stroke-width="3"><circle cx="298" cy="160" r="8"/><circle cx="454" cy="160" r="8"/><circle cx="792" cy="160" r="8"/></g><g text-anchor="middle" font-size="18" font-weight="700"><text x="298" y="125">980</text><text x="454" y="125">1 040</text><text x="792" y="125">1 170</text></g><text x="480" y="255" text-anchor="middle" font-size="19">980 &lt; 1 040 &lt; 1 170</text></g></svg>