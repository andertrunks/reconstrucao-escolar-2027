<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="t d"><title id="t">Agrupamentos e trocas na base dez</title><desc id="d">Uma sequência textual mostra que dez unidades formam uma dezena, dez dezenas formam uma centena e dez centenas formam um milhar.</desc><rect width="960" height="310" fill="white"/><text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">Base dez: cada ordem reúne dez da ordem anterior</text><g font-family="sans-serif" text-anchor="middle"><g fill="none" stroke="#333" stroke-width="2"><rect x="30" y="95" width="180" height="100" rx="8"/><rect x="270" y="95" width="180" height="100" rx="8"/><rect x="510" y="95" width="180" height="100" rx="8"/><rect x="750" y="95" width="180" height="100" rx="8"/></g><g font-size="24" font-weight="700"><text x="120" y="140">10 unidades</text><text x="360" y="140">1 dezena</text><text x="600" y="140">1 centena</text><text x="840" y="140">1 milhar</text></g><g font-size="17"><text x="120" y="170">10 × 1</text><text x="360" y="170">10</text><text x="600" y="170">100</text><text x="840" y="170">1 000</text></g><g font-size="34"><text x="240" y="155">→</text><text x="480" y="155">→</text><text x="720" y="155">→</text></g><text x="480" y="245" font-size="20">Mover uma posição para a esquerda multiplica o valor posicional por 10.</text></g></svg>