<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d"><title id="t">Composição e decomposição de 24 305</title><desc id="d">O número 24 305 aparece no centro e é decomposto em 20 000, 4 000, 300, zero dezenas e 5 unidades.</desc><rect width="960" height="320" fill="white"/><g font-family="sans-serif" text-anchor="middle"><text x="480" y="42" font-size="26" font-weight="700">24 305</text><text x="480" y="78" font-size="18">decompondo pelas posições</text><g fill="none" stroke="#333" stroke-width="2"><rect x="30" y="140" width="150" height="72" rx="8"/><rect x="215" y="140" width="150" height="72" rx="8"/><rect x="400" y="140" width="150" height="72" rx="8"/><rect x="585" y="140" width="150" height="72" rx="8"/><rect x="770" y="140" width="160" height="72" rx="8"/></g><g font-size="22" font-weight="700"><text x="105" y="184">20 000</text><text x="290" y="184">4 000</text><text x="475" y="184">300</text><text x="660" y="184">0 × 10</text><text x="850" y="184">5</text></g><g font-size="28"><text x="197" y="184">+</text><text x="382" y="184">+</text><text x="567" y="184">+</text><text x="752" y="184">+</text></g><text x="480" y="270" font-size="19">Na soma abreviada, a parcela zero pode ser omitida; a posição continua existindo.</text></g></svg>