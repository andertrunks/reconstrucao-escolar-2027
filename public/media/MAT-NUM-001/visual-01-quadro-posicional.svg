<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Quadro de valor posicional do número 352 407</title><desc id="d">Seis colunas mostram as ordens de centena de milhar até unidade e os algarismos 3, 5, 2, 4, 0 e 7.</desc><rect width="960" height="300" fill="white"/><text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">352 407 — cada posição muda o valor</text><g font-family="sans-serif" text-anchor="middle"><g font-size="16" font-weight="700"><text x="90" y="90">Centena de</text><text x="90" y="112">milhar</text><text x="246" y="90">Dezena de</text><text x="246" y="112">milhar</text><text x="402" y="90">Unidade de</text><text x="402" y="112">milhar</text><text x="558" y="100">Centena</text><text x="714" y="100">Dezena</text><text x="870" y="100">Unidade</text></g><g fill="none" stroke="#333" stroke-width="2"><rect x="12" y="130" width="156" height="82"/><rect x="168" y="130" width="156" height="82"/><rect x="324" y="130" width="156" height="82"/><rect x="480" y="130" width="156" height="82"/><rect x="636" y="130" width="156" height="82"/><rect x="792" y="130" width="156" height="82"/></g><g font-size="42" font-weight="700"><text x="90" y="184">3</text><text x="246" y="184">5</text><text x="402" y="184">2</text><text x="558" y="184">4</text><text x="714" y="184">0</text><text x="870" y="184">7</text></g><g font-size="15"><text x="90" y="248">300 000</text><text x="246" y="248">50 000</text><text x="402" y="248">2 000</text><text x="558" y="248">400</text><text x="714" y="248">0 dezenas</text><text x="870" y="248">7</text></g></g></svg>