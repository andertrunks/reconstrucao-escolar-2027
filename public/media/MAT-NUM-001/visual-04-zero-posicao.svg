<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d"><title id="t">O zero como marcador de posição</title><desc id="d">Três quadros com 58, 508 e 5 008 mostram como zeros internos preservam as posições dos algarismos 5 e 8.</desc><rect width="960" height="320" fill="white"/><g font-family="sans-serif" text-anchor="middle"><text x="480" y="40" font-size="26" font-weight="700">Mesmo algarismo, posição diferente</text><g fill="none" stroke="#333" stroke-width="2"><rect x="70" y="92" width="220" height="130" rx="10"/><rect x="370" y="92" width="220" height="130" rx="10"/><rect x="670" y="92" width="220" height="130" rx="10"/></g><g font-size="42" font-weight="700"><text x="180" y="150">58</text><text x="480" y="150">508</text><text x="780" y="150">5 008</text></g><g font-size="16"><text x="180" y="190">5 dezenas + 8 unidades</text><text x="480" y="190">5 centenas + 0 dezenas + 8</text><text x="780" y="190">5 milhares + 0 centenas + 0 dezenas + 8</text></g><text x="480" y="270" font-size="19">O zero evita que os demais algarismos mudem de ordem.</text></g></svg>