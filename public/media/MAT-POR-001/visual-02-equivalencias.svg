<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">PERCENTUAL, FRAÇÃO E DECIMAL</title><desc id="desc">Escritas diferentes podem representar a mesma porção Cinquenta por cento: Cinquenta de cem corresponde à metade do inteiro. 50% = 1/2 = 0,50. Metade da referência Vinte e cinco: Vinte e cinco de cem equivale a um quarto. 25% = 1/4 = 0,25. Quarta parte Dez por cento: Dez partes em cem formam um décimo do inteiro. 10% = 1/10 = 0,10. Divisão em dez partes Setenta e cinco: Setenta e cinco partes de cem equivalem a três quartos. 75% = 3/4 = 0,75. Três quartas partes Quadro de equivalências: Compare as quatro escritas sem alterar os valores. mesma parte, outra escrita. Quatro linhas equivalentes Cuidado: 25% não é o número vinte e cinco. É vinte e cinco centésimos. 25% ≠ 25. Não apague o símbolo %</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">PERCENTUAL, FRAÇÃO E DECIMAL</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e3efff">Escritas diferentes podem representar a mesma porção</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#eaf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-f