<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Porcentagens de referência em uma reta de zero a cem por cento</title><desc id="d">Uma reta vai de zero a cem por cento e marca dez, vinte e cinco, cinquenta, setenta e cinco e cem por cento. Abaixo, aparecem as leituras décima parte, quarta parte, metade, três quartos e inteiro.</desc><rect x="30" y="25" width="840" height="450" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="75" text-anchor="middle" font-size="28" font-family="Arial">Porcentagens de referência</text><line x1="120" y1="220" x2="780" y2="220" stroke="currentColor" stroke-width="5"/><g stroke="currentColor" stroke-width="3" font-family="Arial" text-anchor="middle"><line x1="120" y1="195" x2="120" y2="245"/><line x1="186" y1="200" x2="186" y2="240"/><line x1="285" y1="195" x2="285" y2="245"/><line x1="450" y1="190" x2="450" y2="250"/><line x1="615" y1="195" x2="615" y2="245"/><line x1="780" y1="190" x2="780" y2="250"/><text x="120" y="175" font-size="22">0%</text><text x="186" y="175" font-size="22">10%</text><text x="285" y="175" font-size="22">25%</text><text x="450" y="175" font-size="22">50%</text><text x="615" y="175" font-size="22">75%</text><text x="780" y="175" font-size="22">100%</text><text x="186" y="295" font-size="20">1/10</text><text x="285" y="295" font-size="20">1/4</text><text x="450" y="295" font-size="20">1/2</text><text x="615" y="295" font-size="20">3/4</text><text x="780" y="295" font-size="20">inteiro</text></g><text x="450" y="390" text-anchor="middle" font-size="22" font-family="Arial">Referências conhecidas ajudam a estimar e calcular sem decorar fórmulas.</text></svg>