<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Decomposição de quinze por cento de duzentos e quarenta</title><desc id="d">O diagrama mostra que dez por cento de duzentos e quarenta é vinte e quatro, cinco por cento é metade de dez por cento, igual a doze, e quinze por cento é a soma de vinte e quatro com doze, resultando em trinta e seis.</desc><rect x="30" y="25" width="840" height="470" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="72" text-anchor="middle" font-size="28" font-family="Arial">15% de 240 sem regra de três</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="130" width="210" height="90" rx="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="195" y="165" font-size="23">10% de 240</text><text x="195" y="200" font-size="26">= 24</text><rect x="345" y="130" width="210" height="90" rx="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="165" font-size="23">5% de 240</text><text x="450" y="200" font-size="26">= 12</text><rect x="600" y="130" width="210" height="90" rx="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="705" y="165" font-size="23">15% de 240</text><text x="705" y="200" font-size="26">= 36</text><text x="450" y="285" font-size="25">15% = 10% + 5%</text><text x="450" y="335" font-size="25">24 + 12 = 36</text><text x="450" y="410" font-size="21">5% é metade de 10%; decompor porcentagens revela o raciocínio.</text></g></svg>