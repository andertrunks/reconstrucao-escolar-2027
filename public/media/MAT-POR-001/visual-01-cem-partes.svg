<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">VINTE E CINCO POR CENTO</title><desc id="desc">Porcentagem significa uma referência de cem partes O significado de %: A expressão por cento significa a cada cem partes iguais. 25% = 25/100. A base de comparação é cem Malha de cem: Há dez linhas e dez colunas. Vinte e cinco células destacadas. 25 de 100 partes. O desenho representa 25% Simplifique a fração: Divida numerador e denominador por vinte e cinco. 25/100 = 1/4. Uma de quatro partes Passe a decimal: Vinte e cinco centésimos equivalem a zero vírgula vinte e cinco. 25% = 0,25. Mesma quantidade Interprete a unidade: Se um conjunto tem cem objetos, vinte e cinco são 25% do total. 25 de 100. Sempre identifique o todo Conclusão: Uma mesma parte admite três formas matemáticas equivalentes. 25% = 1/4 = 0,25. A referência continua a mesma</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">VINTE E CINCO POR CENTO</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e3efff">Porcentagem significa uma referência de cem partes</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#eaf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="