<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Vinte e cinco por cento como vinte e cinco partes de cem</title><desc id="d">Uma grade de cem quadrados, em dez linhas por dez colunas. Uma faixa equivalente a vinte e cinco quadrados está marcada. A legenda mostra vinte e cinco por cento igual a vinte e cinco centésimos igual a um quarto.</desc><rect x="30" y="25" width="840" height="470" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="70" text-anchor="middle" font-size="28" font-family="Arial">25% significa 25 de cada 100</text><rect x="210" y="110" width="300" height="75" fill="#d9d9d9"/><rect x="210" y="185" width="150" height="15" fill="#d9d9d9"/><rect x="210" y="110" width="300" height="300" fill="none" stroke="currentColor" stroke-width="3"/><g stroke="currentColor" stroke-width="1"><path d="M240 110V410M270 110V410M300 110V410M330 110V410M360 110V410M390 110V410M420 110V410M450 110V410M480 110V410"/><path d="M210 140H510M210 170H510M210 200H510M210 230H510M210 260H510M210 290H510M210 320H510M210 350H510M210 380H510"/></g><text x="650" y="175" text-anchor="middle" font-size="30" font-family="Arial">25%</text><text x="650" y="230" text-anchor="middle" font-size="26" font-family="Arial">25/100</text><text x="650" y="285" text-anchor="middle" font-size="26" font-family="Arial">= 1/4</text><text x="650" y="345" text-anchor="middle" font-size="22" font-family="Arial">25 partes de 100</text><text x="450" y="455" text-anchor="middle" font-size="22" font-family="Arial">Porcentagem é uma razão com referência em cem.</text></svg>