<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">PERCENTUAIS ACIMA DE CEM</title><desc id="desc">Cem por cento é o inteiro, mas 150% vale um inteiro e meio Cinquenta por cento: Metade do inteiro de referência corresponde a cinquenta por cento. 50% = 0,5 inteiro. Barra de meia unidade Cem por cento: A barra inteira representa todo o valor de referência. 100% = 1 inteiro. A referência completa Cento e cinquenta: Um inteiro mais metade vale cento e cinquenta por cento. 150% = 1,5 inteiro. É maior que o inteiro Compare as barras: A terceira ultrapassa o total. Ela mede uma unidade e meia. 50% | 100% | 150%. As extensões são proporcionais Exemplo numérico: Se o total é duzentos, 150% dele equivale a trezentos. 200 × 1,5 = 300. Acima de cem é possível Atenção: Porcentagem não significa sempre uma parte menor que o todo. 150% &gt; 100%. Identifique o referencial</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">PERCENTUAIS ACIMA DE CEM</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e3efff">Cem por cento é o inteiro, mas 150% vale um inteiro e meio</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#eaf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Cinquenta por cento</text><text x="45" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Metade do inteiro de referência</text><text x="45" y="310" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">corresponde a cinquenta por cento.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">50% = 0,5 inteiro</text><text x="45" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Barra de meia unidade</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Cem por cento</text><text x="571" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">A barra inteira representa</text><text x="571" y="310" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">todo o valor de referência.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">100% = 1 inteiro</text><text x="571" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e54">A referência completa</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Cento e cinquenta</text><text x="1097" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Um inteiro mais metade</text><text x="1097" y="310" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">vale cento e cinquenta por cento.</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">150% = 1,5 inteiro</text><text x="1097" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">É maior que o inteiro</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Compare as barras</text><rect x="86" y="648" width="110" height="43" fill="#fff" stroke="#52748d" stroke-width="2" rx="4"/><rect x="86" y="648" width="110" height="43" fill="#80b7eb" stroke="#075bbb" stroke-width="1.5" rx="4"/><text x="208" y="677" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#244760">50%</text><rect x="86" y="725" width="220" height="43" fill="#fff" stroke="#52748d" stroke-width="2" rx="4"/><rect x="86" y="725" width="220" height="43" fill="#80b7eb" stroke="#075bbb" stroke-width="1.5" rx="4"/><text x="318" y="754" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#244760">100%</text><rect x="86" y="802" width="330" height="43" fill="#fff" stroke="#52748d" stroke-width="2" rx="4"/><rect x="86" y="802" width="220" height="43" fill="#80b7eb" stroke="#075bbb" stroke-width="1.5" rx="4"/><rect x="306" y="802" width="110" height="43" fill="#a7dcbe" stroke="#087e54" stroke-width="1.5"/><text x="428" y="831" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#244760">150%</text><text x="274" y="874" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#28485d">Barra inteira = 100% da referência</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Exemplo numérico</text><text x="571" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Se o total é duzentos,</text><text x="571" y="690" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">150% dele equivale a trezentos.</text><rect x="566" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">200 × 1,5 = 300</text><text x="571" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">Acima de cem é possível</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Atenção</text><text x="1097" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Porcentagem não significa</text><text x="1097" y="690" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">sempre uma parte menor que o todo.</text><rect x="1092" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">150% &gt; 100%</text><text x="1097" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Identifique o referencial</text><text x="26" y="934" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#345a73">Reconstrução Escolar 2027 • MAT-POR-001 • Infográfico autoral</text></svg>