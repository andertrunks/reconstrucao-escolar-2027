<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Porcentagens abaixo, iguais e acima de cem por cento</title><desc id="d">Três barras mostram cinquenta por cento como metade de um inteiro, cem por cento como um inteiro e cento e cinquenta por cento como um inteiro e meio. O texto destaca que porcentagens acima de cem representam mais de um inteiro de referência.</desc><rect x="30" y="25" width="840" height="470" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="72" text-anchor="middle" font-size="28" font-family="Arial">100% é o inteiro de referência</text><g font-family="Arial"><text x="115" y="150" font-size="24">50%</text><rect x="230" y="120" width="250" height="45" fill="#d9d9d9" stroke="currentColor" stroke-width="2"/><rect x="480" y="120" width="250" height="45" fill="white" stroke="currentColor" stroke-width="2"/><text x="115" y="250" font-size="24">100%</text><rect x="230" y="220" width="500" height="45" fill="#d9d9d9" stroke="currentColor" stroke-width="2"/><text x="115" y="350" font-size="24">150%</text><rect x="230" y="320" width="500" height="45" fill="#d9d9d9" stroke="currentColor" stroke-width="2"/><rect x="730" y="320" width="125" height="45" fill="#d9d9d9" stroke="currentColor" stroke-width="2"/></g><text x="450" y="430" text-anchor="middle" font-size="21" font-family="Arial">150% = 100% + 50% = um inteiro e meio.</text></svg>