<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="ttl3 dsc3"><title id="ttl3">Políticas de versão e avaliação</title><desc id="dsc3">Na leitura como conhecido em L12 há 40 preliminar; validado em L13 há 44; antes de L12 não havia observação.</desc><rect width="1120" height="420" rx="24" fill="#f7f9fc"/><text x="45" y="62" font-size="29" font-family="Arial,sans-serif" font-weight="700" fill="#172b4d">Políticas de versão e avaliação</text><text x="46" y="99" font-size="17" fill="#334155" font-family="Arial,sans-serif">Esquema didático · MAT-EST-053 · não representa operação real</text><rect x="45" y="135" width="1020" height="52" rx="9" fill="#dceafe" stroke="#64748b"/><text x="64" y="168" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">1. corte anterior a L12: pendente</text><rect x="45" y="200" width="1020" height="52" rx="9" fill="#e3f0ed" stroke="#64748b"/><text x="64" y="233" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">2. L12: 40 preliminar; só diagnóstico</text><rect x="45" y="265" width="1020" height="52" rx="9" fill="#dceafe" stroke="#64748b"/><text x="64" y="298" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">3. L13: 44 validado; reavaliação</text><rect x="45" y="330" width="1020" height="52" rx="9" fill="#e3f0ed" stroke="#64748b"/><text x="64" y="363" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">4. nunca usar L13 para emitir em L10</text></svg>