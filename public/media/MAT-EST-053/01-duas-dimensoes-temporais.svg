<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="ttl1 dsc1"><title id="ttl1">Duas dimensões temporais: período-alvo e momento de conhecimento</title><desc id="dsc1">O alvo v-alvo recebe dado preliminar 40 em L12 e correção validada 44 em L13; a previsão congelada ocorre em L10.</desc><rect width="1120" height="420" rx="24" fill="#f7f9fc"/><text x="45" y="62" font-size="29" font-family="Arial,sans-serif" font-weight="700" fill="#172b4d">Duas dimensões temporais: período-alvo e momento de conhecimento</text><text x="46" y="99" font-size="17" fill="#334155" font-family="Arial,sans-serif">Esquema didático · MAT-EST-053 · não representa operação real</text><rect x="45" y="135" width="1020" height="52" rx="9" fill="#dceafe" stroke="#64748b"/><text x="64" y="168" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">1. L10: previsão B=42 e C=43</text><rect x="45" y="200" width="1020" height="52" rx="9" fill="#e3f0ed" stroke="#64748b"/><text x="64" y="233" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">2. L12: versão v1=40, preliminar</text><rect x="45" y="265" width="1020" height="52" rx="9" fill="#dceafe" stroke="#64748b"/><text x="64" y="298" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">3. L13: v2=44, validada</text><rect x="45" y="330" width="1020" height="52" rx="9" fill="#e3f0ed" stroke="#64748b"/><text x="64" y="363" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">4. O período-alvo não muda; o conhecimento muda.</text></svg>