<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Estratificação social sem pirâmide rígida</title><desc id="d">Rede com posições em alturas diferentes mostra recursos, poder e oportunidades distribuídos de modo desigual.</desc><rect x="20" y="20" width="920" height="500" rx="24" fill="white" stroke="black" stroke-width="3"/><path d="M160 400 L320 300 L480 370 L640 210 L800 300 M320 300 L640 210 M480 370 L800 300" stroke="black" stroke-width="3" fill="none"/><g fill="white" stroke="black" stroke-width="4"><circle cx="160" cy="400" r="45"/><circle cx="320" cy="300" r="45"/><circle cx="480" cy="370" r="45"/><circle cx="640" cy="210" r="45"/><circle cx="800" cy="300" r="45"/></g><text x="480" y="80" text-anchor="middle" font-size="30" font-family="sans-serif">Posições desiguais e conectadas</text><text x="480" y="480" text-anchor="middle" font-size="22" font-family="sans-serif">Estrutura ≠ três caixas fixas; há dimensões e relações diversas.</text></svg>