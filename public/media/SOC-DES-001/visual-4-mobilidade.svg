<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Mobilidade social</title><desc id="d">Setas mostram movimentos ascendente, descendente, horizontal e permanência entre posições sociais.</desc><rect x="20" y="20" width="920" height="500" rx="24" fill="white" stroke="black" stroke-width="3"/><line x1="180" y1="420" x2="180" y2="150" stroke="black" stroke-width="5"/><polygon points="180,120 165,155 195,155" fill="black"/><text x="180" y="465" text-anchor="middle" font-size="20" font-family="sans-serif">ascendente</text><line x1="390" y1="150" x2="390" y2="420" stroke="black" stroke-width="5"/><polygon points="390,450 375,415 405,415" fill="black"/><text x="390" y="495" text-anchor="middle" font-size="20" font-family="sans-serif">descendente</text><line x1="560" y1="280" x2="770" y2="280" stroke="black" stroke-width="5"/><polygon points="805,280 765,265 765,295" fill="black"/><text x="680" y="330" text-anchor="middle" font-size="20" font-family="sans-serif">horizontal</text><circle cx="680" cy="150" r="45" fill="none" stroke="black" stroke-width="4"/><text x="680" y="158" text-anchor="middle" font-size="18" font-family="sans-serif">permanece</text><text x="480" y="75" text-anchor="middle" font-size="28" font-family="sans-serif">Trajetórias dentro de uma estrutura</text></svg>