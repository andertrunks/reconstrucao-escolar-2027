<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Checklist para interpretar indicadores sociais</title><desc id="d">Seis caixas perguntam o que, quem, onde, quando, unidade e comparação.</desc><rect x="20" y="20" width="920" height="500" rx="24" fill="white" stroke="black" stroke-width="3"/><text x="480" y="75" text-anchor="middle" font-size="30" font-family="sans-serif">Antes de interpretar um indicador</text><g fill="white" stroke="black" stroke-width="3"><rect x="100" y="120" width="220" height="90" rx="15"/><rect x="370" y="120" width="220" height="90" rx="15"/><rect x="640" y="120" width="220" height="90" rx="15"/><rect x="100" y="270" width="220" height="90" rx="15"/><rect x="370" y="270" width="220" height="90" rx="15"/><rect x="640" y="270" width="220" height="90" rx="15"/></g><g font-size="26" font-family="sans-serif" text-anchor="middle"><text x="210" y="175">O quê?</text><text x="480" y="175">Quem?</text><text x="750" y="175">Onde?</text><text x="210" y="325">Quando?</text><text x="480" y="325">Unidade?</text><text x="750" y="325">Comparado com?</text></g><text x="480" y="445" text-anchor="middle" font-size="22" font-family="sans-serif">Número sem contexto não é conclusão.</text></svg>