<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Recursos, oportunidades e posições</title><desc id="d">Três círculos conectados mostram dimensões diferentes da desigualdade social.</desc><rect x="20" y="20" width="920" height="500" rx="24" fill="white" stroke="black" stroke-width="3"/><circle cx="250" cy="260" r="120" fill="none" stroke="black" stroke-width="4"/><circle cx="480" cy="180" r="120" fill="none" stroke="black" stroke-width="4"/><circle cx="710" cy="260" r="120" fill="none" stroke="black" stroke-width="4"/><text x="250" y="250" text-anchor="middle" font-size="27" font-family="sans-serif">Recursos</text><text x="250" y="285" text-anchor="middle" font-size="18" font-family="sans-serif">renda, patrimônio</text><text x="480" y="170" text-anchor="middle" font-size="27" font-family="sans-serif">Oportunidades</text><text x="480" y="205" text-anchor="middle" font-size="18" font-family="sans-serif">chances de acesso</text><text x="710" y="250" text-anchor="middle" font-size="27" font-family="sans-serif">Posições</text><text x="710" y="285" text-anchor="middle" font-size="18" font-family="sans-serif">lugares nas relações</text><path d="M350 220 L380 205 M580 205 L610 220 M350 300 L610 300" stroke="black" stroke-width="3"/><text x="480" y="455" text-anchor="middle" font-size="24" font-family="sans-serif">As dimensões se relacionam, mas não são idênticas.</text></svg>