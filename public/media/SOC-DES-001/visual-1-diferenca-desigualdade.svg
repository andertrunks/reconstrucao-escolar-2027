<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Diferença e desigualdade</title><desc id="d">Dois painéis mostram que diversidade sem hierarquia é diferente de acesso desigual a recursos e oportunidades.</desc><rect x="20" y="20" width="920" height="500" rx="24" fill="white" stroke="black" stroke-width="3"/><text x="250" y="75" text-anchor="middle" font-size="30" font-family="sans-serif">Diferença</text><text x="710" y="75" text-anchor="middle" font-size="30" font-family="sans-serif">Desigualdade</text><circle cx="150" cy="190" r="55" fill="none" stroke="black" stroke-width="4"/><circle cx="350" cy="190" r="55" fill="none" stroke="black" stroke-width="4"/><text x="250" y="285" text-anchor="middle" font-size="22" font-family="sans-serif">preferências diferentes</text><text x="250" y="320" text-anchor="middle" font-size="22" font-family="sans-serif">sem vantagem necessária</text><circle cx="610" cy="170" r="48" fill="none" stroke="black" stroke-width="4"/><circle cx="810" cy="250" r="48" fill="none" stroke="black" stroke-width="4"/><path d="M610 230 V390 M810 310 V390" stroke="black" stroke-width="8"/><text x="610" y="430" text-anchor="middle" font-size="20" font-family="sans-serif">mais acesso</text><text x="810" y="430" text-anchor="middle" font-size="20" font-family="sans-serif">menos acesso</text><text x="480" y="495" text-anchor="middle" font-size="22" font-family="sans-serif">Pergunta-chave: qual é o critério de comparação?</text></svg>