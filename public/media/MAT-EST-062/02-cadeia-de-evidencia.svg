<svg xmlns="http://www.w3.org/2000/svg" width="950" height="320" viewBox="0 0 950 320" role="img" aria-labelledby="t d">
<title id="t">Da afirmação à evidência verificável</title>
<desc id="d">Afirmação, versão congelada, teste, resultado e responsável formam cadeia de rastreabilidade.</desc>
<rect width="950" height="320" rx="22" fill="#f8fafc"/>
<text x="28" y="39" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172334">Da afirmação à evidência verificável</text>
<rect x="32.0" y="78" width="211.0" height="151" rx="12" fill="#fff" stroke="#44566c" stroke-width="2"/>
<rect x="33.0" y="79" width="209.0" height="6" rx="3" fill="#44566c"/>
<text x="44.0" y="109" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#44566c">Afirmação</text>
<text x="44.0" y="140" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#172334">Número e escopo</text>
<text x="44.0" y="171" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#172334">Exemplo: MAE B=3</text>
<rect x="257.0" y="78" width="211.0" height="151" rx="12" fill="#fff" stroke="#44566c" stroke-width="2"/>
<rect x="258.0" y="79" width="209.0" height="6" rx="3" fill="#44566c"/>
<text x="269.0" y="109" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#44566c">Fonte</text>
<text x="269.0" y="140" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#172334">SANDBOX-057</text>
<text x="269.0" y="171" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#172334">Dois pares válidos</text>
<rect x="482.0" y="78" width="211.0" height="151" rx="12" fill="#fff" stroke="#35694a" stroke-width="2"/>
<rect x="483.0" y="79" width="209.0" height="6" rx="3" fill="#35694a"/>
<text x="494.0" y="109" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#35694a">Verificação</text>
<text x="494.0" y="140" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#172334">Recontar e comparar</text>
<text x="494.0" y="171" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#172334">Referir digest</text>
<rect x="707.0" y="78" width="211.0" height="151" rx="12" fill="#fff" stroke="#146f9a" stroke-width="2"/>
<rect x="708.0" y="79" width="209.0" height="6" rx="3" fill="#146f9a"/>
<text x="719.0" y="109" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#146f9a">Estado real</text>
<text x="719.0" y="140" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#172334">Local ou humano?</text>
<text x="719.0" y="171" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#172334">Não inventar autor</text>
<text x="30" y="267" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#172334">A cadeia só sustenta aquilo que foi realmente executado.</text>
<text x="30" y="291" font-family="Arial,sans-serif" font-size="13" fill="#44566c">Diagrama autoral; todos os estados são didáticos ou locais, sem certificação pública.</text></svg>