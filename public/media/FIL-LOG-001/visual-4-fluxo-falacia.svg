<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Fluxo para diagnosticar uma falha argumentativa</title><desc id="d">Cinco etapas em sequência: reconstruir argumento, verificar relevância, testar alternativas, avaliar evidência e nomear a falácia apenas ao final.</desc><g font-size="20" text-anchor="middle"><rect x="25" y="120" width="165" height="95" rx="16" fill="white" stroke="currentColor" stroke-width="3"/><text x="107" y="158">1. Reconstruir</text><text x="107" y="186">argumento</text><rect x="220" y="120" width="165" height="95" rx="16" fill="white" stroke="currentColor" stroke-width="3"/><text x="302" y="158">2. Verificar</text><text x="302" y="186">relevância</text><rect x="415" y="120" width="165" height="95" rx="16" fill="white" stroke="currentColor" stroke-width="3"/><text x="497" y="158">3. Testar</text><text x="497" y="186">alternativas</text><rect x="610" y="120" width="165" height="95" rx="16" fill="white" stroke="currentColor" stroke-width="3"/><text x="692" y="158">4. Avaliar</text><text x="692" y="186">evidência</text><rect x="805" y="120" width="165" height="95" rx="16" fill="white" stroke="currentColor" stroke-width="3"/><text x="887" y="158">5. Só então</text><text x="887" y="186">nomear</text></g><path d="M190 168H220 M385 168H415 M580 168H610 M775 168H805" stroke="currentColor" stroke-width="4"/></svg>