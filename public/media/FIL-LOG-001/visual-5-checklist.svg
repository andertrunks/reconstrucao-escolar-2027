<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Checklist de avaliação de argumentos</title><desc id="d">Seis perguntas organizadas em duas colunas para reconstruir e testar um argumento.</desc><text x="450" y="55" text-anchor="middle" font-size="30">Checklist de avaliação</text><g font-size="22"><text x="90" y="120">1. Qual é a conclusão?</text><text x="90" y="180">2. Quais são as premissas?</text><text x="90" y="240">3. Há premissa implícita?</text><text x="490" y="120">4. Garantia ou probabilidade?</text><text x="490" y="180">5. Evidência suficiente?</text><text x="490" y="240">6. Há contraexemplo ou alternativa?</text></g><rect x="55" y="80" width="360" height="210" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><rect x="455" y="80" width="390" height="210" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="365" text-anchor="middle" font-size="25">Reconstruir → testar → justificar</text><text x="450" y="410" text-anchor="middle" font-size="21">Não comece pelo rótulo da falácia.</text></svg>