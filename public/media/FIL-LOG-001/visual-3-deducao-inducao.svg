<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Dedução e indução</title><desc id="d">Dois painéis comparam dedução, que busca garantia, e indução, que oferece apoio em graus.</desc><rect x="55" y="55" width="350" height="300" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><rect x="495" y="55" width="350" height="300" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><text x="230" y="105" text-anchor="middle" font-size="30">DEDUÇÃO</text><text x="670" y="105" text-anchor="middle" font-size="30">INDUÇÃO</text><text x="230" y="160" text-anchor="middle" font-size="22">pretende garantia</text><text x="670" y="160" text-anchor="middle" font-size="22">pretende apoio provável</text><text x="230" y="215" text-anchor="middle" font-size="22">critério: validade</text><text x="670" y="215" text-anchor="middle" font-size="22">critério: força</text><text x="230" y="270" text-anchor="middle" font-size="20">premissas verdadeiras</text><text x="230" y="300" text-anchor="middle" font-size="20">não permitem conclusão falsa</text><text x="670" y="270" text-anchor="middle" font-size="20">evidências melhores</text><text x="670" y="300" text-anchor="middle" font-size="20">aumentam o apoio</text></svg>