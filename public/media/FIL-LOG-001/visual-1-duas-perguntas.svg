<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Duas perguntas para avaliar um argumento</title><desc id="d">Duas caixas perguntam se as premissas são aceitáveis e se elas sustentam a conclusão; ambas convergem para avaliação do argumento.</desc><rect x="60" y="70" width="330" height="130" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><rect x="510" y="70" width="330" height="130" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><rect x="285" y="270" width="330" height="90" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><text x="225" y="115" text-anchor="middle" font-size="28">Premissas aceitáveis?</text><text x="225" y="155" text-anchor="middle" font-size="20">verdade, evidência, fonte</text><text x="675" y="115" text-anchor="middle" font-size="28">Inferência sustenta?</text><text x="675" y="155" text-anchor="middle" font-size="20">validade ou força</text><text x="450" y="325" text-anchor="middle" font-size="28">Avaliação do argumento</text><path d="M225 200 L390 270 M675 200 L510 270" stroke="currentColor" stroke-width="4" fill="none"/></svg>