<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Teste de validade dedutiva</title><desc id="d">Fluxo pergunta se é possível manter todas as premissas verdadeiras e a conclusão falsa; sim indica invalidade e não indica validade.</desc><rect x="190" y="45" width="520" height="110" rx="20" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="88" text-anchor="middle" font-size="25">Premissas verdadeiras</text><text x="450" y="125" text-anchor="middle" font-size="25">e conclusão falsa: é possível?</text><rect x="80" y="260" width="300" height="90" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><rect x="520" y="260" width="300" height="90" rx="18" fill="white" stroke="currentColor" stroke-width="3"/><text x="230" y="315" text-anchor="middle" font-size="28">SIM → inválido</text><text x="670" y="315" text-anchor="middle" font-size="28">NÃO → válido</text><path d="M360 155 L230 260 M540 155 L670 260" stroke="currentColor" stroke-width="4" fill="none"/><text x="295" y="210" text-anchor="middle" font-size="22">contraexemplo</text><text x="605" y="210" text-anchor="middle" font-size="22">garantia estrutural</text></svg>