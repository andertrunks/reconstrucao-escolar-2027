<svg xmlns="http://www.w3.org/2000/svg" width="980" height="465" viewBox="0 0 980 465" role="img" aria-labelledby="tt dd"><title id="tt">Retificação hipotética não sobrescreve o passado</title><desc id="dd">Bloco compara y22 registrado igual 193 e hipótese de y22 igual 190. Previsão desafiante t23 passa de 199 a 198,4 apenas em cenário de revisão.</desc><rect width="100%" height="100%" fill="#f9fbfd"/><text x="38" y="48" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#102d46">Retificação hipotética não sobrescreve o passado</text><rect x="48" y="97" width="402" height="122" rx="10" fill="#e5f3ed" stroke="#c4d8e6"/><rect x="530" y="97" width="402" height="122" rx="10" fill="#fff1df" stroke="#c4d8e6"/><text x="70" y="130" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#186645" font-weight="bold" text-anchor="start">Histórico preservado</text><text x="70" y="165" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">y22=193  |  d22=17</text><text x="70" y="192" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">B23=183  |  C23=199</text><text x="548" y="130" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#b45b16" font-weight="bold" text-anchor="start">Hipótese de retificação</text><text x="548" y="165" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">se y22=190  |  d22=14</text><text x="548" y="192" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">B23=183  |  C23=198,4</text><line x1="239" y1="238" x2="239" y2="300" stroke="#186645" stroke-width="3"/><line x1="727" y1="238" x2="727" y2="300" stroke="#b45b16" stroke-width="3"/><rect x="47" y="306" width="885" height="106" rx="10" fill="#f0f5fa" stroke="#c4d8e6"/><text x="71" y="340" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102d46" font-weight="bold" text-anchor="start">Alteração hipotética de C23: menos 0,6 unidade</text><text x="71" y="374" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#102d46" font-weight="normal" text-anchor="start">Não sobrescrever o registro. Retificação real exige evento, versão e causa.</text></svg>