<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="tt dd"><title id="tt">Três cenários condicionais para t23</title><desc id="dd">Para valores hipotéticos 178, 191 e 209, exibe erros e custos dos dois modelos; nenhum é registro observado.</desc><rect width="100%" height="100%" fill="#f9fbfd"/><text x="38" y="48" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#102d46">Três cenários condicionais para t23</text><text x="65" y="100" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102d46" font-weight="normal" text-anchor="start">t23: B = 183  |  C = 199  |  y23 ainda desconhecido</text><rect x="56" y="135" width="870" height="82" rx="10" fill="#f0f5fa" stroke="#c4d8e6"/><text x="76" y="163" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="bold" text-anchor="start">Cenário 1: y23 hipotético = 178</text><text x="76" y="195" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#102d46" font-weight="normal" text-anchor="start">Erro B -5; erro C -21; custo r=3: B 5, C 21</text><rect x="56" y="235" width="870" height="82" rx="10" fill="#f0f5fa" stroke="#c4d8e6"/><text x="76" y="263" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="bold" text-anchor="start">Cenário 2: y23 hipotético = 191</text><text x="76" y="295" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#102d46" font-weight="normal" text-anchor="start">Erro B +8; erro C -8; custo r=3: B 24, C 8</text><rect x="56" y="335" width="870" height="82" rx="10" fill="#f0f5fa" stroke="#c4d8e6"/><text x="76" y="363" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="bold" text-anchor="start">Cenário 3: y23 hipotético = 209</text><text x="76" y="395" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#102d46" font-weight="normal" text-anchor="start">Erro B +26; erro C +10; custo r=3: B 78, C 30</text><text x="62" y="479" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#9b2734" font-weight="normal" text-anchor="start">Nenhum cenário é observação realizada ou probabilidade estimada.</text></svg>