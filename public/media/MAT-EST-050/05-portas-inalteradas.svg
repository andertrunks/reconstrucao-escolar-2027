<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="tt dd"><title id="tt">Protocolo congelado permanece obrigatório</title><desc id="dd">Cinco cartões narram cinco pares de oito; melhorias médias; falha na piora local t19; auditoria pendente; não promoção.</desc><rect width="100%" height="100%" fill="#f9fbfd"/><text x="38" y="48" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#102d46">Protocolo congelado permanece obrigatório</text><rect x="56" y="94" width="855" height="62" rx="10" fill="#f1f5f9" stroke="#c4d8e6"/><rect x="56" y="94" width="8" height="62" rx="0" fill="#b45b16" stroke="#b45b16"/><text x="86" y="119" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="bold" text-anchor="start">Pares previstos</text><text x="86" y="143" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#b45b16" font-weight="normal" text-anchor="start">5 de 8: pendente</text><rect x="56" y="171" width="855" height="62" rx="10" fill="#f1f5f9" stroke="#c4d8e6"/><rect x="56" y="171" width="8" height="62" rx="0" fill="#186645" stroke="#186645"/><text x="86" y="196" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="bold" text-anchor="start">Redução média do MAE</text><text x="86" y="220" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#186645" font-weight="normal" text-anchor="start">52,5%: descritiva</text><rect x="56" y="248" width="855" height="62" rx="10" fill="#f1f5f9" stroke="#c4d8e6"/><rect x="56" y="248" width="8" height="62" rx="0" fill="#9b2734" stroke="#9b2734"/><text x="86" y="273" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="bold" text-anchor="start">Piora local máxima</text><text x="86" y="297" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#9b2734" font-weight="normal" text-anchor="start">t19: 19,2 &gt; 10; falha</text><rect x="56" y="325" width="855" height="62" rx="10" fill="#f1f5f9" stroke="#c4d8e6"/><rect x="56" y="325" width="8" height="62" rx="0" fill="#b45b16" stroke="#b45b16"/><text x="86" y="350" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="bold" text-anchor="start">Qualidade e autorização</text><text x="86" y="374" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#b45b16" font-weight="normal" text-anchor="start">não verificadas</text><rect x="56" y="402" width="855" height="62" rx="10" fill="#f1f5f9" stroke="#c4d8e6"/><rect x="56" y="402" width="8" height="62" rx="0" fill="#9b2734" stroke="#9b2734"/><text x="86" y="427" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="bold" text-anchor="start">Resultado do protocolo</text><text x="86" y="451" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#9b2734" font-weight="normal" text-anchor="start">não promover o candidato</text></svg>