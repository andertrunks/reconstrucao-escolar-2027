<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="tt dd"><title id="tt">Sensibilidade ao retirar um dos cinco alvos</title><desc id="dd">Cinco linhas de barras horizontais apresentam MAE dos quatro alvos restantes para referência B e candidato C. Omitir t19 melhora artificialmente o resumo, mas não remove o ocorrido.</desc><rect width="100%" height="100%" fill="#f9fbfd"/><text x="38" y="48" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#102d46">Sensibilidade ao retirar um dos cinco alvos</text><text x="90" y="98" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#385267" font-weight="normal" text-anchor="start">Alvo omitido apenas do diagnóstico</text><text x="48" y="150" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">t18</text><rect x="118" y="125" width="78.75" height="19" rx="2" fill="#235c86" stroke="#235c86"/><rect x="118" y="148" width="40.0" height="19" rx="2" fill="#b45b16" stroke="#b45b16"/><text x="510" y="142" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#102d46" font-weight="normal" text-anchor="start">B 15.75 | C 8.00 | queda 49.2%</text><text x="48" y="213" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">t19</text><rect x="118" y="188" width="105.0" height="19" rx="2" fill="#235c86" stroke="#235c86"/><rect x="118" y="211" width="23.25" height="19" rx="2" fill="#b45b16" stroke="#b45b16"/><text x="510" y="205" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#102d46" font-weight="normal" text-anchor="start">B 21.00 | C 4.65 | queda 77.9%</text><text x="48" y="276" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">t20</text><rect x="118" y="251" width="83.75" height="19" rx="2" fill="#235c86" stroke="#235c86"/><rect x="118" y="274" width="47.5" height="19" rx="2" fill="#b45b16" stroke="#b45b16"/><text x="510" y="268" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#102d46" font-weight="normal" text-anchor="start">B 16.75 | C 9.50 | queda 43.3%</text><text x="48" y="339" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">t21</text><rect x="118" y="314" width="83.75" height="19" rx="2" fill="#235c86" stroke="#235c86"/><rect x="118" y="337" width="48.75" height="19" rx="2" fill="#b45b16" stroke="#b45b16"/><text x="510" y="331" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#102d46" font-weight="normal" text-anchor="start">B 16.75 | C 9.75 | queda 41.8%</text><text x="48" y="402" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#102d46" font-weight="normal" text-anchor="start">t22</text><rect x="118" y="377" width="88.75" height="19" rx="2" fill="#235c86" stroke="#235c86"/><rect x="118" y="400" width="49.5" height="19" rx="2" fill="#b45b16" stroke="#b45b16"/><text x="510" y="394" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#102d46" font-weight="normal" text-anchor="start">B 17.75 | C 9.90 | queda 44.2%</text><text x="58" y="465" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#385267" font-weight="normal" text-anchor="start">B = barra superior; C = barra inferior. Não elimina a falha de t19 do protocolo.</text></svg>