<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">RAZÕES COM UNIDADES</title><desc id="desc">Mesma grandeza exige conversão; grandezas distintas geram taxa Comprimentos: Compare duzentos centímetros com um metro. 200 cm : 1 m. Primeiro padronize unidades Converta a medida: Um metro equivale a cem centímetros. 200 cm : 100 cm. O quociente agora é 2 Razão sem unidade: Centímetro dividido por centímetro cancela a unidade. 200/100 = 2. Um comprimento é o dobro Grandezas diferentes: Um produto custa dezoito reais para três quilogramas. R$ 18 : 3 kg. Não cancele unidades distintas Calcule a taxa: Divida dezoito por três. Conserve a unidade composta. R$ 6 por kg. Preço por quilograma Conclusão: Mesma espécie: unidades compatíveis. Outra espécie: taxa composta. 2 | R$ 6/kg. A unidade integra a resposta</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">RAZÕES COM UNIDADES</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e3efff">Mesma grandeza exige conversão; grandezas distintas geram taxa</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#eaf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" fo