<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Razões entre grandezas da mesma e de diferentes naturezas</title><desc id="desc">À esquerda, duzentos centímetros para cem centímetros dá dois para um. À direita, dezoito reais por três quilogramas dá seis reais por quilograma.</desc>
<rect width="900" height="520" fill="white"/><text x="450" y="48" text-anchor="middle" font-size="27" font-family="Arial">A unidade orienta a interpretação</text>
<rect x="55" y="105" width="365" height="320" rx="15" fill="none" stroke="black" stroke-width="3"/><rect x="480" y="105" width="365" height="320" rx="15" fill="none" stroke="black" stroke-width="3"/>
<text x="238" y="150" text-anchor="middle" font-size="22" font-family="Arial">Mesma natureza</text><text x="662" y="150" text-anchor="middle" font-size="22" font-family="Arial">Naturezas diferentes</text>
<text x="238" y="215" text-anchor="middle" font-size="24" font-family="Arial">200 cm : 1 m</text><text x="238" y="260" text-anchor="middle" font-size="20" font-family="Arial">1 m = 100 cm</text><text x="238" y="315" text-anchor="middle" font-size="26" font-family="Arial">200 : 100 = 2 : 1</text><text x="238" y="370" text-anchor="middle" font-size="20" font-family="Arial">unidades compatibilizadas</text>
<text x="662" y="215" text-anchor="middle" font-size="24" font-family="Arial">R$ 18 : 3 kg</text><text x="662" y="280" text-anchor="middle" font-size="26" font-family="Arial">18 ÷ 3 = 6</text><text x="662" y="335" text-anchor="middle" font-size="26" font-family="Arial">R$ 6/kg</text><text x="662" y="390" text-anchor="middle" font-size="20" font-family="Arial">unidade composta permanece</text></svg>