<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">RAZÕES EQUIVALENTES</title><desc id="desc">Multiplicar ambos os termos preserva o quociente Razão original: Duas unidades para três unidades. O quociente vale dois terços. 2 : 3 = 2/3. Compare em ordem Multiplique por dois: O primeiro e o segundo termo devem ser multiplicados. 2×2 : 3×2 = 4:6. Os dois termos mudam Multiplique por três: Partindo da razão original, multiplique ambos os termos por três. 6 : 9 = 2 : 3. O quociente é igual Veja as barras: Cada linha mantém dois grupos para cada três de referência. 2:3 = 4:6 = 6:9. A relação não muda Atenção à regra: Somar dois a ambos os termos não garante equivalência. 2:3 ≠ 4:5. Use produto/divisão comuns Conclusão: Se dois quocientes têm mesmo valor, representam razões equivalentes. 2/3 = 4/6 = 6/9. O fator comum não é zero</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">RAZÕES EQUIVALENTES</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e3efff">Multiplicar ambos os termos preserva o quociente</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#eaf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Razão original</text><text x="45" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Duas unidades para três unidades.</text><text x="45" y="310" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">O quociente vale dois terços.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2 : 3 = 2/3</text><text x="45" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Compare em ordem</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Multiplique por dois</text><text x="571" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">O primeiro e o segundo termo</text><text x="571" y="310" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">devem ser multiplicados.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2×2 : 3×2 = 4:6</text><text x="571" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e54">Os dois termos mudam</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Multiplique por três</text><text x="1097" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Partindo da razão original,</text><text x="1097" y="310" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">multiplique ambos os termos por três.</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">6 : 9 = 2 : 3</text><text x="1097" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">O quociente é igual</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Veja as barras</text><rect x="71" y="647" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="104" y="647" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="137" y="647" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="170" y="647" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="203" y="647" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><text x="466" y="677" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#203a52">2:3</text><rect x="71" y="717" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="104" y="717" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="137" y="717" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="170" y="717" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="203" y="717" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="236" y="717" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="269" y="717" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="302" y="717" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="335" y="717" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="368" y="717" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><text x="466" y="747" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#203a52">4:6</text><rect x="71" y="787" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="104" y="787" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="137" y="787" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="170" y="787" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="203" y="787" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="236" y="787" width="31" height="47" rx="3" fill="#75b6e9" stroke="#075bbb" stroke-width=".9"/><rect x="269" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="302" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="335" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="368" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="401" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="434" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="467" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="500" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><rect x="533" y="787" width="31" height="47" rx="3" fill="#a4d9b7" stroke="#087e54" stroke-width=".9"/><text x="466" y="817" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#203a52">6:9</text><text x="274" y="875" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="600" fill="#29445c">Azul: antecedente   Verde: consequente</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552