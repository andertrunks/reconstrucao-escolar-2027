<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">DIFERENÇA OU RAZÃO?</title><desc id="desc">Seis elementos e três elementos: duas perguntas distintas Compare os conjuntos: O grupo A tem seis elementos. O grupo B tem três elementos. A = 6  |  B = 3. As quantidades são diferentes Diferença aditiva: Pergunte quantos elementos a mais. Use uma subtração. 6 − 3 = 3. A possui três a mais Razão multiplicativa: Pergunte quantas vezes A vale B. Divida o primeiro pelo segundo. 6 ÷ 3 = 2. A tem duas vezes B A ordem importa: Razão A para B é seis para três. B para A é três para seis. 6/3 = 2  |  3/6 = 1/2. Inverter altera a comparação Erros a evitar: Subtrair não produz a razão. Dividir não produz a diferença. diferença ≠ razão. Verifique o que foi perguntado Conclusão: Aditiva: quanto a mais. Multiplicativa: quantas vezes. 3 a mais | 2 vezes. Duas medidas, um mesmo contexto</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">DIFERENÇA OU RAZÃO?</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e3efff">Seis elementos e três elementos: duas perguntas distintas</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#eaf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Compare os conjuntos</text><circle cx="103" cy="281" r="21" fill="#70b2ec" stroke="#1865ac" stroke-width="2"/><circle cx="156" cy="281" r="21" fill="#70b2ec" stroke="#1865ac" stroke-width="2"/><circle cx="209" cy="281" r="21" fill="#70b2ec" stroke="#1865ac" stroke-width="2"/><circle cx="103" cy="340" r="21" fill="#70b2ec" stroke="#1865ac" stroke-width="2"/><circle cx="156" cy="340" r="21" fill="#70b2ec" stroke="#1865ac" stroke-width="2"/><circle cx="209" cy="340" r="21" fill="#70b2ec" stroke="#1865ac" stroke-width="2"/><circle cx="333" cy="310" r="21" fill="#f7bb62" stroke="#bb6718" stroke-width="2"/><circle cx="386" cy="310" r="21" fill="#f7bb62" stroke="#bb6718" stroke-width="2"/><circle cx="439" cy="310" r="21" fill="#f7bb62" stroke="#bb6718" stroke-width="2"/><text x="157" y="413" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#075bbb">A: 6</text><text x="385" y="413" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#a85d17">B: 3</text><text x="274" y="465" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#26445d">Diferença: 3    |    Razão A/B: 2</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Diferença aditiva</text><text x="571" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Pergunte quantos elementos a mais.</text><text x="571" y="310" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Use uma subtração.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">6 − 3 = 3</text><text x="571" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e54">A possui três a mais</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Razão multiplicativa</text><text x="1097" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Pergunte quantas vezes A vale B.</text><text x="1097" y="310" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Divida o primeiro pelo segundo.</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">6 ÷ 3 = 2</text><text x="1097" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">A tem duas vezes B</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">A ordem importa</text><text x="45" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Razão A para B é seis para três.</text><text x="45" y="690" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">B para A é três para seis.</text><rect x="40" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">6/3 = 2  |  3/6 = 1/2</text><text x="45" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Inverter altera a comparação</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Erros a evitar</text><text x="571" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Subtrair não produz a razão.</text><text x="571" y="690" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Dividir não produz a diferença.</text><rect x="566" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">diferença ≠ razão</text><text x="571" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">Verifique o que foi perguntado</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Conclusão</text><text x="1097" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Aditiva: quanto a mais.</text><text x="1097" y="690" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d374f">Multiplicativa: quantas vezes.</text><rect x="1092" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">3 a mais | 2 vezes</text><text x="1097" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Duas medidas, um mesmo contexto</text><text x="26" y="934" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#345a73">Reconstrução Escolar 2027 • MAT-RAZ-001 • Infográfico autoral</text></svg>