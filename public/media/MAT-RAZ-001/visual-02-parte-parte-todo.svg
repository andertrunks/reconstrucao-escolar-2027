<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">PARTE-PARTE E PARTE-TODO</title><desc id="desc">Uma coleção de cinco figuras admite comparações distintas Observe o conjunto: Existem dois triângulos. Há também três círculos. 2 + 3 = 5 figuras. O conjunto tem cinco elementos Razão parte-parte: Compare triângulos com círculos. Os grupos são categorias diferentes. 2 : 3. Antecedente: triângulos Inverta a ordem: Círculos para triângulos não é a mesma razão. 3 : 2. A ordem identifica a pergunta Razão parte-todo: Compare triângulos com todas as cinco figuras. 2 : 5. Total de referência: cinco Outro parte-todo: Três círculos em um conjunto de cinco figuras ao todo. 3 : 5. Outra proporção do conjunto Conclusão: Na razão 2:3 o segundo é parte. Na razão 2:5 é o conjunto todo. 2/3 ≠ 2/5. Diga o que cada termo mede</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">PARTE-PARTE E PARTE-TODO</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e3efff">Uma coleção de cinco figuras admite comparações distintas</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#eaf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor=