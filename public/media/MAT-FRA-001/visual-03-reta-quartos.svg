<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="t d">
<title id="t">Reta numérica em quartos de zero a dois</title><desc id="d">Reta numérica de zero a dois com marcas igualmente espaçadas a cada um quarto, incluindo quatro quartos igual a um e oito quartos igual a dois.</desc>
<text x="550" y="55" text-anchor="middle" font-size="34" font-family="sans-serif">Quartos na reta numérica</text>
<line x1="100" y1="180" x2="1000" y2="180" stroke="currentColor" stroke-width="4"/>
<path d="M1000 180l-18-10v20z" fill="currentColor"/>
<g font-family="sans-serif" font-size="22" text-anchor="middle">
<g stroke="currentColor" stroke-width="3">
<line x1="100" y1="160" x2="100" y2="200"/><line x1="212.5" y1="160" x2="212.5" y2="200"/><line x1="325" y1="160" x2="325" y2="200"/><line x1="437.5" y1="160" x2="437.5" y2="200"/><line x1="550" y1="150" x2="550" y2="210"/><line x1="662.5" y1="160" x2="662.5" y2="200"/><line x1="775" y1="160" x2="775" y2="200"/><line x1="887.5" y1="160" x2="887.5" y2="200"/><line x1="1000" y1="150" x2="1000" y2="210"/>
</g>
<text x="100" y="240">0</text><text x="212.5" y="240">1/4</text><text x="325" y="240">2/4</text><text x="437.5" y="240">3/4</text><text x="550" y="240">4/4 = 1</text><text x="662.5" y="240">5/4</text><text x="775" y="240">6/4</text><text x="887.5" y="240">7/4</text><text x="1000" y="240">8/4 = 2</text>
</g>
<text x="550" y="315" text-anchor="middle" font-size="25" font-family="sans-serif">Cada intervalo mede 1/4 de unidade.</text>
</svg>