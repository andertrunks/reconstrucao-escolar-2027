<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Quadro de valor posicional de 3,407</title><desc id="d">Tabela com quatro colunas: unidades, décimos, centésimos e milésimos; os algarismos são 3, 4, 0 e 7.</desc><rect width="1000" height="360" fill="white"/><g stroke="black" fill="white" stroke-width="3"><rect x="60" y="90" width="220" height="180"/><rect x="280" y="90" width="220" height="180"/><rect x="500" y="90" width="220" height="180"/><rect x="720" y="90" width="220" height="180"/></g><g font-family="sans-serif" fill="black" text-anchor="middle"><g font-size="24"><text x="170" y="135">unidades</text><text x="390" y="135">décimos</text><text x="610" y="135">centésimos</text><text x="830" y="135">milésimos</text></g><g font-size="64"><text x="170" y="230">3</text><text x="390" y="230">4</text><text x="610" y="230">0</text><text x="830" y="230">7</text></g><text x="500" y="325" font-size="30">3,407 = 3 + 4/10 + 0/100 + 7/1000</text></g></svg>