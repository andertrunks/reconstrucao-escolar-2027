<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">POR QUE 0,5 É IGUAL A 0,50?</title><desc id="desc">A posição da vírgula permanece e o valor não muda Cinco décimos: Se metade da barra de dez partes está marcada, temos 5/10. 5/10 = 0,5. Metade da unidade Cinquenta centésimos: A metade de cem quadradinhos corresponde a cinquenta deles. 50/100 = 0,50. Metade de cem Multiplique por dez: Cinco sobre dez vira cinquenta sobre cem ao multiplicar ambos. 5/10 = 50/100. Mesmo número A reta confirma: O ponto fica exatamente no meio entre zero e um. 0,5 = 0,50. Só existe um ponto para metade O zero à direita: Acrescentar zero após a última casa decimal não muda valor. 0,50 = 0,500. É uma equivalência posicional Mas zero interno importa: Zero vírgula cinco não é o mesmo que zero vírgula zero cinco. 0,5 ≠ 0,05. Não apague zeros antes do 5</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">POR QUE 0,5 É IGUAL A 0,50?</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">A posição da vírgula permanece e o valor não muda</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text