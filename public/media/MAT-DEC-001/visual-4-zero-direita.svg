<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Zero vírgula cinco é igual a zero vírgula cinquenta</title><desc id="d">Duas barras mostram a mesma metade, uma como cinco décimos e outra como cinquenta centésimos, e uma reta indica o mesmo ponto para zero vírgula cinco e zero vírgula cinquenta.</desc><rect width="1000" height="500" fill="white"/><g transform="translate(100,70)" stroke="black" stroke-width="2"><rect x="0" y="0" width="60" height="70" fill="#bbb"/><rect x="60" y="0" width="60" height="70" fill="#bbb"/><rect x="120" y="0" width="60" height="70" fill="#bbb"/><rect x="180" y="0" width="60" height="70" fill="#bbb"/><rect x="240" y="0" width="60" height="70" fill="#bbb"/><rect x="300" y="0" width="60" height="70" fill="white"/><rect x="360" y="0" width="60" height="70" fill="white"/><rect x="420" y="0" width="60" height="70" fill="white"/><rect x="480" y="0" width="60" height="70" fill="white"/><rect x="540" y="0" width="60" height="70" fill="white"/></g><text x="400" y="180" font-family="sans-serif" font-size="28" text-anchor="middle">5/10 = 0,5</text><g transform="translate(250,220)" stroke="black" stroke-width="1"><rect x="0" y="0" width="500" height="120" fill="white"/><path d="M50 0V120M100 0V120M150 0V120M200 0V120M250 0V120M300 0V120M350 0V120M400 0V120M450 0V120M0 12H500M0 24H500M0 36H500M0 48H500M0 60H500M0 72H500M0 84H500M0 96H500M0 108H500" fill="none"/><rect x="0" y="0" width="500" height="60" fill="#bbb" opacity="0.8"/></g><text x="500" y="380" font-family="sans-serif" font-size="28" text-anchor="middle">50/100 = 0,50</text><line x1="180" y1="430" x2="820" y2="430" stroke="black" stroke-width="4"/><circle cx="500" cy="430" r="12" fill="white" stroke="black" stroke-width="4"/><text x="500" y="475" font-family="sans-serif" font-size="24" text-anchor="middle">mesmo ponto: 0,5 = 0,50</text></svg>