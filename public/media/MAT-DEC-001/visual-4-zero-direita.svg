le" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Multiplique por dez</text><text x="1097" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Cinco sobre dez vira cinquenta</text><text x="1097" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">sobre cem ao multiplicar ambos.</text><rect x="1092" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">5/10 = 50/100</text><text x="1097" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Mesmo número</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">A reta confirma</text><text x="45" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">O ponto fica exatamente no meio</text><text x="45" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">entre zero e um.</text><rect x="40" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">0,5 = 0,50</text><text x="45" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Só existe um ponto para metade</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">O zero à direita</text><text x="571" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Acrescentar zero após a última</text><text x="571" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">casa decimal não muda valor.</text><rect x="566" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">0,50 = 0,500</text><text x="571" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">É uma equivalência posicional</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#fff">Mas zero interno importa</text><text x="1097" y="650" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Zero vírgula cinco não é o mesmo</text><text x="1097" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">que zero vírgula zero cinco.</text><rect x="1092" y="743" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">0,5 ≠ 0,05</text><text x="1097" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Não apague zeros antes do 5</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#3b526c">Reconstrução Escolar 2027 • MAT-DEC-001 • Infográfico autoral</text></svg>