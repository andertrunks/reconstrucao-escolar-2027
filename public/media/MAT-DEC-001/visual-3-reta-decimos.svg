<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">DÉCIMOS ENTRE ZERO E UM</title><desc id="desc">Dez intervalos iguais permitem localizar qualquer décimo Unidade completa: A reta começa em zero e termina em um inteiro. 0 até 1. Unidade dividida igualmente Dez intervalos: Cada passo à direita aumenta zero vírgula um. passo = 0,1. 0,0; 0,1; ...; 1,0 Localize 0,3: Três passos de um décimo chegam a zero vírgula três. 0,3 = 3/10. Círculo na terceira marca Localize 0,8: Oito passos a partir do zero chegam a zero vírgula oito. 0,8 = 8/10. Quadrado na oitava marca Compare pontos: Zero vírgula três fica à esquerda de zero vírgula oito. 0,3 &lt; 0,8. O maior está à direita Depois dos décimos: Podemos dividir cada décimo em dez centésimos iguais. 0,01 = 1/100. A reta continua subdivisível</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">DÉCIMOS ENTRE ZERO E UM</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Dez intervalos iguais permitem localizar qualquer décimo</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Unidade completa</text><text x="45" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">A reta começa em zero e termina</text><text x="45" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">em um inteiro.</text><rect x="40" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">0 até 1</text><text x="45" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Unidade dividida igualmente</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Dez intervalos</text><text x="571" y="270" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">Cada passo à direita aumenta</text><text x="571" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#183750">zero vírgula um.</text><rect x="566" y="363" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#1f374e">passo = 0,1</text><text x="571" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" 