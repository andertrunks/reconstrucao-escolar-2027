<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Reta numérica dividida em décimos</title><desc id="d">Reta de zero a um dividida em dez intervalos iguais; zero vírgula três é marcado por um círculo e zero vírgula oito por um quadrado.</desc><rect width="1100" height="300" fill="white"/><line x1="80" y1="140" x2="1020" y2="140" stroke="black" stroke-width="4"/><g stroke="black" stroke-width="3" font-family="sans-serif" font-size="18" text-anchor="middle"><line x1="80" y1="125" x2="80" y2="155"/><text x="80" y="190">0,0</text><line x1="174" y1="125" x2="174" y2="155"/><text x="174" y="190">0,1</text><line x1="268" y1="125" x2="268" y2="155"/><text x="268" y="190">0,2</text><line x1="362" y1="125" x2="362" y2="155"/><text x="362" y="190">0,3</text><line x1="456" y1="125" x2="456" y2="155"/><text x="456" y="190">0,4</text><line x1="550" y1="125" x2="550" y2="155"/><text x="550" y="190">0,5</text><line x1="644" y1="125" x2="644" y2="155"/><text x="644" y="190">0,6</text><line x1="738" y1="125" x2="738" y2="155"/><text x="738" y="190">0,7</text><line x1="832" y1="125" x2="832" y2="155"/><text x="832" y="190">0,8</text><line x1="926" y1="125" x2="926" y2="155"/><text x="926" y="190">0,9</text><line x1="1020" y1="125" x2="1020" y2="155"/><text x="1020" y="190">1,0</text></g><circle cx="362" cy="140" r="13" fill="white" stroke="black" stroke-width="4"/><rect x="819" y="127" width="26" height="26" fill="#bbb" stroke="black" stroke-width="4"/><text x="550" y="245" font-family="sans-serif" font-size="22" text-anchor="middle">cada intervalo vale um décimo</text></svg>