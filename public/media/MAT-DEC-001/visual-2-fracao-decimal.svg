<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Fração decimal e escrita decimal</title><desc id="d">Uma barra de dez partes tem uma parte marcada e uma malha de cem partes tem vinte e cinco partes marcadas, relacionando um décimo a zero vírgula um e vinte e cinco centésimos a zero vírgula vinte e cinco.</desc><rect width="1000" height="520" fill="white"/><g transform="translate(70,90)" stroke="black" stroke-width="2"><rect x="0" y="0" width="70" height="80" fill="#bbb"/><rect x="70" y="0" width="70" height="80" fill="white"/><rect x="140" y="0" width="70" height="80" fill="white"/><rect x="210" y="0" width="70" height="80" fill="white"/><rect x="280" y="0" width="70" height="80" fill="white"/><rect x="350" y="0" width="70" height="80" fill="white"/><rect x="420" y="0" width="70" height="80" fill="white"/><rect x="490" y="0" width="70" height="80" fill="white"/><rect x="560" y="0" width="70" height="80" fill="white"/><rect x="630" y="0" width="70" height="80" fill="white"/></g><text x="420" y="210" font-family="sans-serif" font-size="30" text-anchor="middle">1/10 = 0,1</text><g transform="translate(250,270)" stroke="black" stroke-width="1"><rect x="0" y="0" width="500" height="200" fill="white"/><path d="M50 0V200M100 0V200M150 0V200M200 0V200M250 0V200M300 0V200M350 0V200M400 0V200M450 0V200M0 20H500M0 40H500M0 60H500M0 80H500M0 100H500M0 120H500M0 140H500M0 160H500M0 180H500" fill="none"/><rect x="0" y="0" width="500" height="40" fill="#bbb" opacity="0.8"/><rect x="0" y="40" width="250" height="20" fill="#bbb" opacity="0.8"/></g><text x="500" y="505" font-family="sans-serif" font-size="28" text-anchor="middle">25/100 = 0,25</text></svg>