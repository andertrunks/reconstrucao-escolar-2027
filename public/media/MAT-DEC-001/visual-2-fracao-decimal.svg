<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">FRAÇÕES DECIMAIS NA PRÁTICA</title><desc id="desc">A mesma parte pode ser escrita com fração ou vírgula O que é um décimo: Divida uma unidade em dez partes. Uma parte vale um décimo. 1/10 = 0,1. Primeira casa após a vírgula Barra de dez partes: Uma das dez partes está marcada. As nove restantes ficam vazias. 1 de 10. Compare partes iguais Um centésimo: Em cem partes iguais, uma parte vale um centésimo. 1/100 = 0,01. Segunda casa após a vírgula Vinte e cinco centésimos: Na malha há 25 partes marcadas de um total de cem. 25/100 = 0,25. Duas casas decimais Representações: O denominador 10 descreve décimos. O denominador 100, centésimos. 0,1 e 0,25. As escritas indicam quantidade Não confunda casas: Cinco décimos equivalem a 0,5. Cinco centésimos equivalem a 0,05. 0,5 ≠ 0,05. Os valores são diferentes</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">FRAÇÕES DECIMAIS NA PRÁTICA</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">A mesma parte pode ser escrita com fração ou vírgula</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text>