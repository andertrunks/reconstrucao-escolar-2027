<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d"><title id="t">Três níveis de checagem da resposta</title><desc id="d">Fluxo em três caixas mostra solução algébrica, verificação na equação original e validação de significado, unidade e restrições do contexto.</desc><rect width="1000" height="580" fill="white"/><text x="500" y="55" text-anchor="middle" font-size="32" font-family="Arial">Uma resposta completa passa por três checagens</text><g fill="none" stroke="black" stroke-width="3"><rect x="260" y="105" width="480" height="95" rx="16"/><rect x="260" y="245" width="480" height="95" rx="16"/><rect x="260" y="385" width="480" height="110" rx="16"/><path d="M500 200V235M500 340V375"/></g><g font-family="Arial" text-anchor="middle"><text x="500" y="145" font-size="27">1. Solução algébrica</text><text x="500" y="178" font-size="22">resolver a equação por transformações equivalentes</text><text x="500" y="285" font-size="27">2. Verificação matemática</text><text x="500" y="318" font-size="22">substituir na equação original</text><text x="500" y="430" font-size="27">3. Validação contextual</text><text x="500" y="463" font-size="22">significado + unidade + restrições + pergunta</text><text x="500" y="545" font-size="24">Se qualquer etapa falhar, volte ao modelo e revise.</text></g></svg>