<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">IDADE: TRANSFORMAR TEXTO EM EQUAÇÃO</title><desc id="desc">IDADE: TRANSFORMAR TEXTO EM EQUAÇÃO. As duas idades somam 42 e diferem em oito anos. Defina a incógnita. A pessoa mais nova tem x anos.. A outra tem oito anos a mais.. x  e  x + 8. Use uma incógnita. Duas idades. A barra maior tem oito a mais.. As duas, juntas, somam 42.. x + (x+8) = 42. Uma relação de soma. Monte a equação. Some as idades corretamente.. Não esqueça os parênteses.. x + x + 8 = 42. Simplifique os termos x. Resolva. 2x + 8 = 42.. 2x = 34 e x = 17.. x = 17 anos. Idade mais nova. Encontre a outra. A pessoa mais velha tem x+8.. Dezessete mais oito dá vinte e cinco.. 17 + 8 = 25. Idade mais velha. Valide no contexto. 17 + 25 = 42.. A diferença é 25 − 17 = 8.. soma 42; diferença 8. Dados do problema conferidos</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">IDADE: TRANSFORMAR TEXTO EM EQUAÇÃO</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">As duas idades somam 42 e diferem em oito anos</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="9