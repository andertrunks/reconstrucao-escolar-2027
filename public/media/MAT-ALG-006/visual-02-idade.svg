<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Problema de idades transformado em equação</title><desc id="d">A idade menor é x e a maior é x mais oito. A soma é quarenta e dois, produzindo x mais x mais oito igual a quarenta e dois e as idades dezessete e vinte e cinco anos.</desc><rect width="1000" height="560" fill="white"/><text x="500" y="55" text-anchor="middle" font-size="32" font-family="Arial">Uma idade é 8 anos maior; juntas somam 42</text><g fill="none" stroke="black" stroke-width="3"><rect x="90" y="120" width="300" height="120" rx="16"/><rect x="610" y="120" width="300" height="120" rx="16"/><path d="M400 180H600"/><rect x="260" y="300" width="480" height="90" rx="16"/><path d="M500 390V440"/></g><g font-family="Arial" text-anchor="middle"><text x="240" y="165" font-size="26">idade menor</text><text x="240" y="210" font-size="40">x</text><text x="760" y="165" font-size="26">idade maior</text><text x="760" y="210" font-size="40">x + 8</text><text x="500" y="352" font-size="36">x + (x + 8) = 42</text><text x="500" y="490" font-size="38" font-weight="bold">x = 17 → idades 17 e 25</text><text x="500" y="535" font-size="22">17 + 25 = 42 e 25 − 17 = 8</text></g></svg>