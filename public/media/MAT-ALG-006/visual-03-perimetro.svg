<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d"><title id="t">Perímetro: do desenho ao modelo algébrico</title><desc id="d">Retângulo com largura x e comprimento x mais três; os quatro lados geram a equação dois x mais dois vezes x mais três igual a trinta.</desc><rect width="1000" height="580" fill="white"/><text x="500" y="50" text-anchor="middle" font-size="32" font-family="Arial">Perímetro de um retângulo = 30 cm</text><rect x="180" y="130" width="500" height="250" fill="none" stroke="black" stroke-width="4"/><g font-family="Arial" text-anchor="middle"><text x="430" y="115" font-size="28">x + 3</text><text x="430" y="420" font-size="28">x + 3</text><text x="145" y="265" font-size="28">x</text><text x="715" y="265" font-size="28">x</text><text x="850" y="180" font-size="23">quatro lados</text><text x="850" y="220" font-size="23">→ 2x + 2(x+3)</text><text x="500" y="485" font-size="36">2x + 2(x + 3) = 30</text><text x="500" y="540" font-size="36" font-weight="bold">x = 6 cm e x + 3 = 9 cm</text></g></svg>