<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">RETÂNGULO: DO DESENHO À EQUAÇÃO</title><desc id="desc">RETÂNGULO: DO DESENHO À EQUAÇÃO. Dois lados x, dois lados x+3, perímetro 30 cm. Desenhe as medidas. A largura vale x centímetros.. O comprimento vale x+3.. x  e  x + 3. Unidade: centímetro. Quatro lados. Lados opostos têm igual medida.. O perímetro é a soma dos quatro.. P = 30 cm. Visualize antes de somar. Traduza o perímetro. São dois comprimentos e. duas larguras.. 2x + 2(x+3) = 30. Os parênteses são essenciais. Use a distributiva. 2x + 2x + 6 = 30.. Reúna os termos iguais.. 4x + 6 = 30. Simplificação equivalente. Encontre as medidas. 4x = 24, então x = 6.. O outro lado vale 6+3=9.. 6 cm e 9 cm. Largura e comprimento. Valide a medida. Some 6+9+6+9 centímetros.. O total precisa dar trinta.. 6+9+6+9 = 30. A geometria confirma a conta</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">RETÂNGULO: DO DESENHO À EQUAÇÃO</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Dois lados x, dois lados x+3, perímetro 30 cm</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="97" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Desenhe as medidas</text><text x="46" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">A largura vale x centímetros.</text><text x="46" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">O comprimento vale x+3.</text><rect x="42" y="361" width="464" height="73" rx="12" fill="#fff"/><text x="274" y="407" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">x  e  x + 3</text><text x="46" y="477" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Unidade: centímetro</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="623" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Quatro lados</text><rect x="646" y="272" width="305" height="132" rx="2" fill="#fff" stroke="#1663ae" stroke-width="4"/><text x="798.5" y="257" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#12395d">x + 3 cm</text><text x="798.5" y="432" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#12395d">x + 3 cm</text><text x="631" y="344" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#12395d">x</text><text x="969" y="344" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#12395d">x</text><text x="800" y="462" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#193650">P = 2x + 2(x+3) = 30 cm</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1149" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Traduza o perímetro</text><text x="1098" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">São dois comprimentos e</text><text x="1098" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">duas larguras.</text><rect x="1094" y="361" width="464" height="73" rx="12" fill="#fff"/><text x="1326" y="407" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x + 2(x+3) = 30</text><text x="1098" y="477" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Os parênteses são essenciais</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="97" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Use a distributiva</text><text x="46" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">2x + 2x + 6 = 30.</text><text x="46" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Reúna os termos iguais.</text><rect x="42" y="741" width="464" height="73" rx="12" fill="#fff"/><text x="274" y="787" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">4x + 6 = 30</text><text x="46" y="857" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Simplificação equivalente</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="623" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Encontre as medidas</text><text x="572" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">4x = 24, então x = 6.</text><text x="572" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">O outro lado vale 6+3=9.</text><rect x="568" y="741" width="464" height="73" rx="12" fill="#fff"/><text x="800" y="787" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">6 cm e 9 cm</text><text x="572" y="857" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">Largura e comprimento</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1149" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Valide a medida</text><text x="1098" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Some 6+9+6+9 centímetros.</text><text x="1098" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">O total precisa dar trinta.</text><rect x="1094" y="741" width="464" height="73" rx="12" fill="#fff"/><text x="1326" y="787" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">6+9+6+9 = 30</text><text x="1098" y="857" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">A geometria confirma a conta</text><text x="25" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#345">Reconstrução Escolar 2027 • MAT-ALG-006 • infográfico autoral</text></svg>