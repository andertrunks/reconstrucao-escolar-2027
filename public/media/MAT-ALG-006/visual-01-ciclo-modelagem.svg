<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Ciclo de modelagem por equação</title><desc id="d">Fluxo em sete etapas: compreender a pergunta, separar dados e relações, definir a incógnita, traduzir, montar a equação, resolver e validar a resposta.</desc><rect width="1000" height="620" fill="white"/><text x="500" y="50" text-anchor="middle" font-size="32" font-family="Arial">Problema → modelo → solução → validação</text><g fill="none" stroke="black" stroke-width="3"><rect x="60" y="100" width="250" height="75" rx="14"/><rect x="375" y="100" width="250" height="75" rx="14"/><rect x="690" y="100" width="250" height="75" rx="14"/><rect x="690" y="270" width="250" height="75" rx="14"/><rect x="375" y="270" width="250" height="75" rx="14"/><rect x="60" y="270" width="250" height="75" rx="14"/><rect x="375" y="440" width="250" height="75" rx="14"/><path d="M310 138H365M625 138H680M815 175V260M690 308H635M375 308H320M185 345V477H365"/></g><g font-family="Arial" font-size="23" text-anchor="middle"><text x="185" y="132">1. Compreender</text><text x="185" y="160">a pergunta</text><text x="500" y="132">2. Dados e</text><text x="500" y="160">relações</text><text x="815" y="132">3. Definir</text><text x="815" y="160">a incógnita</text><text x="815" y="302">4. Traduzir</text><text x="815" y="330">relações</text><text x="500" y="302">5. Montar</text><text x="500" y="330">a equação</text><text x="185" y="302">6. Resolver</text><text x="185" y="330">com igualdade</text><text x="500" y="472">7. Verificar, validar</text><text x="500" y="500">e interpretar</text></g><text x="500" y="575" text-anchor="middle" font-size="24" font-family="Arial">O cálculo é uma etapa do processo, não o processo inteiro.</text></svg>