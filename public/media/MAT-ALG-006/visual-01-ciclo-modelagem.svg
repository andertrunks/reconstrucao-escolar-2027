<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">PROBLEMA → EQUAÇÃO → RESPOSTA</title><desc id="desc">PROBLEMA → EQUAÇÃO → RESPOSTA. O cálculo só funciona após interpretar o contexto. 1. Compreenda. Leia tudo, inclusive a pergunta.. Descubra a grandeza procurada.. O que se pede?. Não comece pela conta. 2. Separe os dados. Diferencie números e relações.. Descubra o que é importante.. dados + condições. Evite usar informação irrelevante. 3. Defina a incógnita. Escolha o símbolo x.. Diga o que ele representa.. x = quantidade pedida. Anote a unidade. 4. Traduza e modele. Troque as relações por expressões.. Escreva a condição de igualdade.. enunciado → equação. A relação deve ser fiel. 5. Resolva. Faça operações equivalentes.. Obtenha a solução algébrica.. x = valor calculado. Justifique cada etapa. 6. Verifique e valide. Teste na equação original.. Cheque unidade, sentido e restrições.. resposta no contexto. Matemática e realidade precisam bater</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">PROBLEMA → EQUAÇÃO → RESPOSTA</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">O cálculo só funciona após interpretar o contexto</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor=