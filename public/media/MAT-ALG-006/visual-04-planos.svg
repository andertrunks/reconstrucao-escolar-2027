<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">COMPARAR PLANOS COM EQUAÇÕES</title><desc id="desc">COMPARAR PLANOS COM EQUAÇÕES. Duas expressões de custo podem coincidir. Defina as regras. Plano A: vinte reais fixos.. Cada uso custa três reais.. A(x) = 20 + 3x. Custo em R$. Segundo plano. Plano B: oito reais fixos.. Cada uso custa cinco reais.. B(x) = 8 + 5x. Também custo em R$. Faça a pergunta. Para quantos usos os dois. custam exatamente o mesmo?. 20+3x = 8+5x. Igualdade entre custos. Encontre x. 20−8 = 5x−3x.. 12 = 2x, então x = 6.. x = 6 usos. Quantidade inteira válida. Ponto de encontro. As retas se cruzam em x=6.. Ambas chegam a R$ 38.. (6 usos; R$ 38). Confira unidades no gráfico. Responda em palavras. Depois de seis utilizações,. os custos serão de R$ 38.. A(6) = B(6) = 38. Resposta à pergunta inicial</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">COMPARAR PLANOS COM EQUAÇÕES</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Duas expressões de custo podem coincidir</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="97" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Defina as regras</text><text x="46" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Plano A: vinte reais fixos.</text><text x="46" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Cada uso custa três reais.</text><rect x="42" y="361" width="464" height="73" rx="12" fill="#fff"/><text x="274" y="407" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">A(x) = 20 + 3x</text><text x="46" y="477" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Custo em R$</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="623" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Segundo plano</text><text x="572" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Plano B: oito reais fixos.</text><text x="572" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Cada uso custa cinco reais.</text><rect x="568" y="361" width="464" height="73" rx="12" fill="#fff"/><text x="800" y="407" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">B(x) = 8 + 5x</text><text x="572" y="477" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e54">Também custo em R$</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1149" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Faça a pergunta</text><text x="1098" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Para quantos usos os dois</text><text x="1098" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">custam exatamente o mesmo?</text><rect x="1094" y="361" width="464" height="73" rx="12" fill="#fff"/><text x="1326" y="407" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">20+3x = 8+5x</text><text x="1098" y="477" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Igualdade entre custos</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="97" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Encontre x</text><text x="46" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">20−8 = 5x−3x.</text><text x="46" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">12 = 2x, então x = 6.</text><rect x="42" y="741" width="464" height="73" rx="12" fill="#fff"/><text x="274" y="787" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">x = 6 usos</text><text x="46" y="857" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Quantidade inteira válida</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="623" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Ponto de encontro</text><rect x="634" y="619" width="325" height="181" fill="#fff" stroke="#a4bace" rx="3"/><path d="M634 619V800 M634 800H959" stroke="#d5e0eb"/><text x="634" y="818" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">0</text><text x="620" y="804" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">0</text><path d="M699 619V800 M634 772.1538461538462H959" stroke="#d5e0eb"/><text x="699" y="818" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">2</text><text x="620" y="776.1538461538462" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">10</text><path d="M764 619V800 M634 744.3076923076923H959" stroke="#d5e0eb"/><text x="764" y="818" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">4</text><text x="620" y="748.3076923076923" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">20</text><path d="M829 619V800 M634 716.4615384615385H959" stroke="#d5e0eb"/><text x="829" y="818" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">6</text><text x="620" y="720.4615384615385" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">30</text><path d="M894 619V800 M634 688.6153846153846H959" stroke="#d5e0eb"/><text x="894" y="818" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">8</text><text x="620" y="692.6153846153846" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">40</text><path d="M959 619V800 M634 660.7692307692307H959" stroke="#d5e0eb"/><text x="959" y="818" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">10</text><text x="620" y="664.7692307692307" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#395169">50</text><path d="M634 800H959 M634 619V800" stroke="#263e54" stroke-width="2.5"/><polyline points="634,744.3076923076923 959,660.7692307692307" fill="none" stroke="#075bbb" stroke-width="4"/><polyline points="634,777.723076923077 959,638.4923076923077" fill="none" stroke="#c35b0b" stroke-width="4"/><circle cx="829" cy="694.1846153846154" r="8" stroke="#fff" stroke-width="2" fill="#161d38"/><text x="842" y="680.1846153846154" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#102a44">(6,38)</text><text x="784" y="842" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#1c3a55">Usos x (unid.)</text><text x="569" y="613" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1c3a55">Custo (R$)</text><text x="596" y="862" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#075bbb">A: 20+3x (azul)</text><text x="831" y="862" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#a65013">B: 8+5x (laranja)</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1149" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Responda em palavras</text><text x="1098" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">Depois de seis utilizações,</text><text x="1098" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#20364e">os custos serão de R$ 38.</text><rect x="1094" y="741" width="464" height="73" rx="12" fill="#fff"/><text x="1326" y="787" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">A(6) = B(6) = 38</text><text x="1098" y="857" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Resposta à pergunta