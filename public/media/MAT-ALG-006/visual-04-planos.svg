<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d"><title id="t">Comparação de dois planos por igualdade</title><desc id="d">Plano A custa vinte mais três x reais e plano B custa oito mais cinco x reais. Igualando os custos obtemos x igual a seis e custo comum de trinta e oito reais.</desc><rect width="1000" height="580" fill="white"/><text x="500" y="55" text-anchor="middle" font-size="32" font-family="Arial">Quando dois planos custam o mesmo?</text><g fill="none" stroke="black" stroke-width="3"><rect x="80" y="125" width="350" height="120" rx="16"/><rect x="570" y="125" width="350" height="120" rx="16"/><rect x="250" y="310" width="500" height="90" rx="16"/></g><g font-family="Arial" text-anchor="middle"><text x="255" y="165" font-size="25">Plano A</text><text x="255" y="215" font-size="38">20 + 3x</text><text x="745" y="165" font-size="25">Plano B</text><text x="745" y="215" font-size="38">8 + 5x</text><text x="500" y="365" font-size="36">20 + 3x = 8 + 5x</text><text x="500" y="455" font-size="38" font-weight="bold">x = 6 usos</text><text x="500" y="510" font-size="32">custo comum = R$ 38</text><text x="500" y="555" font-size="21">A igualdade localiza o ponto em que as duas regras coincidem.</text></g></svg>