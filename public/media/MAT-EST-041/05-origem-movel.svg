<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Validação temporal com janela expansiva</title><desc id="desc">Quatro linhas mostram treinos 1 a 4, 1 a 5, 1 a 6, 1 a 7 e testes respectivos dias 5 a 8.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#152b41} .title{font-size:25px;font-weight:700}.sub{font-size:17px}.lbl{font-size:17px;font-weight:600}.sm{font-size:14px}.axis{stroke:#34495e;stroke-width:2;fill:none}.line{stroke:#155e75;stroke-width:3;fill:none}.rect{fill:#e8f5f7;stroke:#155e75;stroke-width:2}.rect2{fill:#fef3d8;stroke:#935c14;stroke-width:2}.alert{fill:#fee5e5;stroke:#a52525;stroke-width:2}.bar{fill:#9ed4e3;stroke:#155e75;stroke-width:1.5}</style><rect x="0" y="0" width="940" height="470" fill="#fff"/><text class="title" x="28" y="38">Validação temporal com janela expansiva</text><rect class="rect" x="48" y="91" width="510" height="53" rx="12"/><text x="62" y="123" class="lbl">Treino: dias 1–4</text><rect class="rect2" x="618" y="91" width="222" height="53" rx="12"/><text x="632" y="123" class="lbl">Teste: dia 5</text><rect class="rect" x="48" y="173" width="510" height="53" rx="12"/><text x="62" y="205" class="lbl">Treino: dias 1–5</text><rect class="rect2" x="618" y="173" width="222" height="53" rx="12"/><text x="632" y="205" class="lbl">Teste: dia 6</text><rect class="rect" x="48" y="255" width="510" height="53" rx="12"/><text x="62" y="287" class="lbl">Treino: dias 1–6</text><rect class="rect2" x="618" y="255" width="222" height="53" rx="12"/><text x="632" y="287" class="lbl">Teste: dia 7</text><rect class="rect" x="48" y="337" width="510" height="53" rx="12"/><text x="62" y="369" class="lbl">Treino: dias 1–7</text><rect class="rect2" x="618" y="337" width="222" height="53" rx="12"/><text x="632" y="369" class="lbl">Teste: dia 8</text><text x="48" y="436" class="sub">Origem móvel: nenhum dia posterior participa do treino anterior.</text></svg>