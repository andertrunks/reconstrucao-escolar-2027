<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Da coleta à inferência com dependência</title><desc id="desc">Esquema de três perguntas: unidade de coleta, dependência e pergunta; exemplos pessoa ou escola, dia ou sequência e previsão futura.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#152b41} .title{font-size:25px;font-weight:700}.sub{font-size:17px}.lbl{font-size:17px;font-weight:600}.sm{font-size:14px}.axis{stroke:#34495e;stroke-width:2;fill:none}.line{stroke:#155e75;stroke-width:3;fill:none}.rect{fill:#e8f5f7;stroke:#155e75;stroke-width:2}.rect2{fill:#fef3d8;stroke:#935c14;stroke-width:2}.alert{fill:#fee5e5;stroke:#a52525;stroke-width:2}.bar{fill:#9ed4e3;stroke:#155e75;stroke-width:1.5}</style><rect x="0" y="0" width="940" height="470" fill="#fff"/><text class="title" x="28" y="38">Da coleta à inferência com dependência</text><rect class="rect" x="38" y="90" width="250" height="105" rx="12"/><text x="52" y="122" class="lbl">Unidade de coleta</text><rect class="rect" x="347" y="90" width="250" height="105" rx="12"/><text x="361" y="122" class="lbl">Dependência</text><rect class="rect" x="656" y="90" width="250" height="105" rx="12"/><text x="670" y="122" class="lbl">Pergunta-alvo</text><rect class="rect" x="38" y="247" width="250" height="105" rx="12"/><text x="52" y="279" class="lbl">Pessoa / escola</text><rect class="rect" x="347" y="247" width="250" height="105" rx="12"/><text x="361" y="279" class="lbl">Dia / sequência</text><rect class="rect" x="656" y="247" width="250" height="105" rx="12"/><text x="670" y="279" class="lbl">Previsão futura</text><text x="38" y="405" class="sub">Uma linha do arquivo não é, necessariamente, uma unidade independente.</text></svg>