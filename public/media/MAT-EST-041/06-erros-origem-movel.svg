<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Erro da previsão ingênua na avaliação temporal</title><desc id="desc">Gráfico de barras em atendimentos: dia 5 igual a 10, dia 6 igual a 20, dia 7 igual a 20 e dia 8 igual a 30; MAE 20.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#152b41} .title{font-size:25px;font-weight:700}.sub{font-size:17px}.lbl{font-size:17px;font-weight:600}.sm{font-size:14px}.axis{stroke:#34495e;stroke-width:2;fill:none}.line{stroke:#155e75;stroke-width:3;fill:none}.rect{fill:#e8f5f7;stroke:#155e75;stroke-width:2}.rect2{fill:#fef3d8;stroke:#935c14;stroke-width:2}.alert{fill:#fee5e5;stroke:#a52525;stroke-width:2}.bar{fill:#9ed4e3;stroke:#155e75;stroke-width:1.5}</style><rect x="0" y="0" width="940" height="470" fill="#fff"/><text class="title" x="28" y="38">Erro da previsão ingênua na avaliação temporal</text><text x="55" y="79" class="sub">Erro absoluto (atendimentos)</text><path d="M 93 115 V 375 H 865" class="axis"/><path d="M 88 374.0 H 865" stroke="#cbd5e1" stroke-width="1"/><text x="68" y="379.0" class="sm" text-anchor="end">0</text><path d="M 88 299.0 H 865" stroke="#cbd5e1" stroke-width="1"/><text x="68" y="304.0" class="sm" text-anchor="end">10</text><path d="M 88 224.0 H 865" stroke="#cbd5e1" stroke-width="1"/><text x="68" y="229.0" class="sm" text-anchor="end">20</text><path d="M 88 149.0 H 865" stroke="#cbd5e1" stroke-width="1"/><text x="68" y="154.0" class="sm" text-anchor="end">30</text><rect class="bar" x="188" y="299.0" width="75" height="75.0"/><text x="225" y="399" class="sm" text-anchor="middle">Dia 5</text><text x="225" y="289.0" class="lbl" text-anchor="middle">10</text><rect class="bar" x="357" y="224.0" width="75" height="150.0"/><text x="394" y="399" class="sm" text-anchor="middle">Dia 6</text><text x="394" y="214.0" class="lbl" text-anchor="middle">20</text><rect class="bar" x="526" y="224.0" width="75" height="150.0"/><text x="563" y="399" class="sm" text-anchor="middle">Dia 7</text><text x="563" y="214.0" class="lbl" text-anchor="middle">20</text><rect class="bar" x="695" y="149.0" width="75" height="225.0"/><text x="732" y="399" class="sm" text-anchor="middle">Dia 8</text><text x="732" y="139.0" class="lbl" text-anchor="middle">30</text><text x="60" y="445" class="sm">Horizontal: dia. Vertical: erro absoluto (atendimentos).</text></svg>