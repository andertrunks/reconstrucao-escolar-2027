<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Dois alvos: escola média versus aluno médio</title><desc id="desc">Três escolas com tamanhos 2, 3 e 1. As médias de escola 3,8,12 produzem 23/3; as seis notas produzem 7.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#152b41} .title{font-size:25px;font-weight:700}.sub{font-size:17px}.lbl{font-size:17px;font-weight:600}.sm{font-size:14px}.axis{stroke:#34495e;stroke-width:2;fill:none}.line{stroke:#155e75;stroke-width:3;fill:none}.rect{fill:#e8f5f7;stroke:#155e75;stroke-width:2}.rect2{fill:#fef3d8;stroke:#935c14;stroke-width:2}.alert{fill:#fee5e5;stroke:#a52525;stroke-width:2}.bar{fill:#9ed4e3;stroke:#155e75;stroke-width:1.5}</style><rect x="0" y="0" width="940" height="470" fill="#fff"/><text class="title" x="28" y="38">Dois alvos: escola média versus aluno médio</text><rect class="rect" x="42" y="110" width="390" height="78" rx="12"/><text x="56" y="142" class="lbl">A: 2, 4 | média 3</text><rect class="rect" x="42" y="206" width="390" height="78" rx="12"/><text x="56" y="238" class="lbl">B: 6, 8, 10 | média 8</text><rect class="rect" x="42" y="302" width="390" height="78" rx="12"/><text x="56" y="334" class="lbl">C: 12 | média 12</text><rect class="rect" x="490" y="130" width="390" height="78" rx="12"/><text x="504" y="162" class="lbl">Média por escola = 23/3</text><rect class="rect" x="490" y="255" width="390" height="78" rx="12"/><text x="504" y="287" class="lbl">Média por aluno = 42/6</text><text x="42" y="427" class="sub">Estimandos diferentes: 7,667 por escola e 7 por aluno.</text></svg>