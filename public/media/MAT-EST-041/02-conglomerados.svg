<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Bootstrap por conglomerados: três pacientes</title><desc id="desc">Cada paciente possui duas medições; o sorteio ocorre sobre os três pacientes e preserva suas duas observações.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#152b41} .title{font-size:25px;font-weight:700}.sub{font-size:17px}.lbl{font-size:17px;font-weight:600}.sm{font-size:14px}.axis{stroke:#34495e;stroke-width:2;fill:none}.line{stroke:#155e75;stroke-width:3;fill:none}.rect{fill:#e8f5f7;stroke:#155e75;stroke-width:2}.rect2{fill:#fef3d8;stroke:#935c14;stroke-width:2}.alert{fill:#fee5e5;stroke:#a52525;stroke-width:2}.bar{fill:#9ed4e3;stroke:#155e75;stroke-width:1.5}</style><rect x="0" y="0" width="940" height="470" fill="#fff"/><text class="title" x="28" y="38">Bootstrap por conglomerados: três pacientes</text><rect class="rect" x="44" y="95" width="335" height="65" rx="12"/><text x="58" y="127" class="lbl">Paciente P1 | medidas 2 e 4</text><rect class="rect" x="465" y="95" width="345" height="65" rx="12"/><text x="479" y="127" class="lbl">Média 3</text><path d="M 382 127 L 461 127" class="line"/><rect class="rect" x="44" y="186" width="335" height="65" rx="12"/><text x="58" y="218" class="lbl">Paciente P2 | medidas 6 e 8</text><rect class="rect" x="465" y="186" width="345" height="65" rx="12"/><text x="479" y="218" class="lbl">Média 7</text><path d="M 382 218 L 461 218" class="line"/><rect class="rect" x="44" y="277" width="335" height="65" rx="12"/><text x="58" y="309" class="lbl">Paciente P3 | medidas 10 e 12</text><rect class="rect" x="465" y="277" width="345" height="65" rx="12"/><text x="479" y="309" class="lbl">Média 11</text><path d="M 382 309 L 461 309" class="line"/><text x="45" y="407" class="sub">27 sorteios ordenados de três pacientes completos (3 × 3 × 3).</text></svg>