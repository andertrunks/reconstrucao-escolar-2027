<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Um roteiro de apoio para organizar a frase</title><desc id="desc">Três blocos encadeados mostram de quem ou de que se fala, o que se informa e quais detalhes necessários completam a ideia.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Um roteiro de apoio para organizar a frase</text><g font-family="Arial,sans-serif"><rect x="65" y="130" width="290" height="180" rx="22" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><rect x="405" y="130" width="290" height="180" rx="22" fill="#f4f1f8" stroke="#65548a" stroke-width="3"/><rect x="745" y="130" width="290" height="180" rx="22" fill="#f7f1e7" stroke="#826c43" stroke-width="3"/><g font-size="23" font-weight="700" text-anchor="middle"><text x="210" y="175" fill="#173b29">De quem ou de que?</text><text x="550" y="175" fill="#473a64">O que se informa?</text><text x="890" y="165" fill="#604a2d">Que detalhe</text><text x="890" y="193" fill="#604a2d">é necessário?</text></g><g font-size="20" text-anchor="middle" fill="#2a3630"><text x="210" y="230">A unidade de saúde</text><text x="550" y="230">alterou o horário</text><text x="890" y="220">da vacinação</text><text x="890" y="250">nesta sexta-feira</text></g><path d="M355 220 H395" stroke="#315f46" stroke-width="5"/><polygon points="393,212 405,220 393,228" fill="#315f46"/><path d="M695 220 H735" stroke="#315f46" stroke-width="5"/><polygon points="733,212 745,220 733,228" fill="#315f46"/></g><text x="55" y="370" font-family="Arial,sans-serif" font-size="24" fill="#14231b">Frase resultante:</text><text x="55" y="412" font-family="Arial,sans-serif" font-size="23" fill="#2a3630">“A unidade de saúde alterou o horário da vacinação nesta sexta-feira.”</text><text x="55" y="468" font-family="Arial,sans-serif" font-size="19" fill="#2a3630">Este é um apoio de escrita, não uma regra que obrigue toda frase a seguir a mesma ordem.</text></svg>