<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Da ideia ao entendimento: o caminho da frase clara</title><desc id="desc">Fluxo em cinco etapas: intenção, ideia principal, ordem das palavras, pontuação e compreensão do leitor.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Da ideia ao entendimento: o caminho da frase clara</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#edf7f0" stroke="#315f46" stroke-width="3"><rect x="55" y="160" width="170" height="120" rx="20"/><rect x="260" y="160" width="170" height="120" rx="20"/><rect x="465" y="160" width="170" height="120" rx="20"/><rect x="670" y="160" width="170" height="120" rx="20"/><rect x="875" y="160" width="170" height="120" rx="20"/></g><g fill="#173b29" font-size="22" font-weight="700"><text x="140" y="205">1. Intenção</text><text x="345" y="198">2. Ideia</text><text x="345" y="225">principal</text><text x="550" y="198">3. Ordem</text><text x="550" y="225">das palavras</text><text x="755" y="198">4. Pontuação</text><text x="960" y="198">5. Leitor</text><text x="960" y="225">compreende</text></g><g stroke="#65548a" stroke-width="5" fill="none"><path d="M225 220 H250"/><path d="M430 220 H455"/><path d="M635 220 H660"/><path d="M840 220 H865"/></g><g fill="#65548a"><polygon points="248,212 260,220 248,228"/><polygon points="453,212 465,220 453,228"/><polygon points="658,212 670,220 658,228"/><polygon points="863,212 875,220 863,228"/></g></g><text x="55" y="350" font-family="Arial,sans-serif" font-size="21" fill="#2a3630">Clareza é resultado de escolhas encadeadas: saber o que dizer, organizar a ideia</text><text x="55" y="380" font-family="Arial,sans-serif" font-size="21" fill="#2a3630">e sinalizar como ela deve ser lida.</text><rect x="55" y="410" width="990" height="70" rx="18" fill="#f4f1f8" stroke="#65548a" stroke-width="2"/><text x="550" y="453" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#473a64">Pergunta final: o leitor consegue reconstruir o sentido que eu pretendia?</text></svg>