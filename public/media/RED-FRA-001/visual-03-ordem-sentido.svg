<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">A ordem pode mudar quem faz o quê</title><desc id="desc">Duas frases com as mesmas palavras principais mostram agente e alvo diferentes: O cão mordeu o homem e O homem mordeu o cão.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">A ordem pode mudar quem faz o quê</text><g font-family="Arial,sans-serif"><rect x="70" y="125" width="960" height="130" rx="22" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="550" y="175" text-anchor="middle" font-size="30" font-weight="700" fill="#173b29">O cão → mordeu → o homem.</text><text x="250" y="220" text-anchor="middle" font-size="20" fill="#2b4a39">quem faz</text><text x="850" y="220" text-anchor="middle" font-size="20" fill="#2b4a39">quem recebe</text><rect x="70" y="285" width="960" height="130" rx="22" fill="#f4f1f8" stroke="#65548a" stroke-width="3"/><text x="550" y="335" text-anchor="middle" font-size="30" font-weight="700" fill="#473a64">O homem → mordeu → o cão.</text><text x="250" y="380" text-anchor="middle" font-size="20" fill="#574a70">quem faz</text><text x="850" y="380" text-anchor="middle" font-size="20" fill="#574a70">quem recebe</text></g><text x="55" y="475" font-family="Arial,sans-serif" font-size="20" fill="#2a3630">As palavras centrais são as mesmas; a posição dos participantes altera a relação expressa.</text></svg>