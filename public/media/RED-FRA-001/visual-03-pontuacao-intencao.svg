<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Pontuação e intenção comunicativa</title>
<desc id="desc">Três versões da sequência Você trouxe o documento com ponto final, ponto de interrogação e ponto de exclamação, rotuladas como declaração, pergunta e exclamação.</desc>
<rect width="1100" height="540" fill="#fff"/>
<text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Pontuação e intenção comunicativa</text>
<g font-family="Arial,sans-serif">
<rect x="80" y="115" width="940" height="90" rx="20" fill="#edf7f0" stroke="#315f46" stroke-width="3"/>
<text x="120" y="170" font-size="28" font-weight="700" fill="#173b29">Você trouxe o documento.</text><text x="900" y="170" text-anchor="end" font-size="21" fill="#2b4a39">declaração</text>
<rect x="80" y="230" width="940" height="90" rx="20" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/>
<text x="120" y="285" font-size="28" font-weight="700" fill="#303d58">Você trouxe o documento?</text><text x="900" y="285" text-anchor="end" font-size="21" fill="#46526a">pergunta direta</text>
<rect x="80" y="345" width="940" height="90" rx="20" fill="#f8f2e8" stroke="#7a5b2f" stroke-width="3"/>
<text x="120" y="400" font-size="28" font-weight="700" fill="#553d20">Você trouxe o documento!</text><text x="900" y="400" text-anchor="end" font-size="21" fill="#604a2d">exclamação / ênfase</text>
</g>
<text x="55" y="495" font-family="Arial,sans-serif" font-size="19" fill="#2a3630">O sinal final orienta a leitura e ajuda a indicar a intenção; ele não substitui contexto nem argumento.</text>
</svg>