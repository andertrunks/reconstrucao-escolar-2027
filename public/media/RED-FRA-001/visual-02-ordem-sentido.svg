<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">A ordem pode mudar quem faz o quê</title>
<desc id="desc">Comparação entre as frases O cão mordeu o homem e O homem mordeu o cão, com rótulos de quem pratica a ação, ação e quem a recebe.</desc>
<rect width="1100" height="520" fill="#fff"/>
<text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">A ordem pode mudar quem faz o quê</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="110" width="960" height="135" rx="22" fill="#edf7f0" stroke="#315f46" stroke-width="3"/>
<text x="550" y="155" text-anchor="middle" font-size="27" font-weight="700" fill="#173b29">O cão mordeu o homem.</text>
<text x="230" y="208" text-anchor="middle" font-size="18" fill="#2b4a39">quem pratica: o cão</text>
<text x="550" y="208" text-anchor="middle" font-size="18" fill="#2b4a39">ação: mordeu</text>
<text x="865" y="208" text-anchor="middle" font-size="18" fill="#2b4a39">quem recebe: o homem</text>
<rect x="70" y="280" width="960" height="135" rx="22" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/>
<text x="550" y="325" text-anchor="middle" font-size="27" font-weight="700" fill="#303d58">O homem mordeu o cão.</text>
<text x="230" y="378" text-anchor="middle" font-size="18" fill="#46526a">quem pratica: o homem</text>
<text x="550" y="378" text-anchor="middle" font-size="18" fill="#46526a">ação: mordeu</text>
<text x="865" y="378" text-anchor="middle" font-size="18" fill="#46526a">quem recebe: o cão</text>
</g>
<text x="55" y="478" font-family="Arial,sans-serif" font-size="19" fill="#2a3630">As palavras principais são semelhantes, mas a posição altera os papéis e, portanto, o sentido.</text>
</svg>