<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Mesmas palavras, três intenções</title><desc id="desc">Três cartões apresentam Você trouxe o documento com ponto final, ponto de interrogação e ponto de exclamação, associados a informar, perguntar e enfatizar.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Mesmas palavras, três intenções</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="125" width="310" height="250" rx="22" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><rect x="395" y="125" width="310" height="250" rx="22" fill="#f4f1f8" stroke="#65548a" stroke-width="3"/><rect x="735" y="125" width="310" height="250" rx="22" fill="#f7f1e7" stroke="#826c43" stroke-width="3"/><text x="210" y="180" font-size="28" font-weight="700" fill="#173b29">Informar</text><text x="550" y="180" font-size="28" font-weight="700" fill="#473a64">Perguntar</text><text x="890" y="180" font-size="28" font-weight="700" fill="#604a2d">Enfatizar</text><text x="210" y="255" font-size="23" fill="#2a3630">Você trouxe</text><text x="210" y="290" font-size="23" fill="#2a3630">o documento.</text><text x="550" y="255" font-size="23" fill="#2a3630">Você trouxe</text><text x="550" y="290" font-size="23" fill="#2a3630">o documento?</text><text x="890" y="255" font-size="23" fill="#2a3630">Você trouxe</text><text x="890" y="290" font-size="23" fill="#2a3630">o documento!</text><text x="210" y="340" font-size="52" font-weight="700" fill="#315f46">.</text><text x="550" y="340" font-size="52" font-weight="700" fill="#65548a">?</text><text x="890" y="340" font-size="52" font-weight="700" fill="#826c43">!</text></g><text x="55" y="445" font-family="Arial,sans-serif" font-size="21" fill="#2a3630">O sinal final orienta a leitura da intenção; ele não é apenas um acabamento gráfico.</text></svg>