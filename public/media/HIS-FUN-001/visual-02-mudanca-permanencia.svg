<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Mudança e permanência podem coexistir</title><desc id="desc">Esquema mostra a substituição de cartas por mensagens digitais como mudança, enquanto a necessidade de comunicação permanece.</desc><rect width="1100" height="500" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Mudança e permanência podem coexistir</text><g font-family="Arial,sans-serif"><rect x="70" y="120" width="310" height="210" rx="24" fill="#f8f2e8" stroke="#7a5b2f" stroke-width="3"/><text x="225" y="165" text-anchor="middle" font-size="25" font-weight="700" fill="#553d20">Antes</text><rect x="140" y="200" width="170" height="95" fill="#fff" stroke="#7a5b2f" stroke-width="4"/><path d="M140 200 L225 260 L310 200" fill="none" stroke="#7a5b2f" stroke-width="4"/><text x="225" y="365" text-anchor="middle" font-size="20" fill="#604a2d">cartas em papel</text><text x="550" y="245" text-anchor="middle" font-size="55" fill="#315f46">→</text><rect x="720" y="120" width="310" height="210" rx="24" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/><text x="875" y="165" text-anchor="middle" font-size="25" font-weight="700" fill="#303d58">Depois</text><rect x="825" y="195" width="100" height="120" rx="12" fill="#fff" stroke="#4e5f7f" stroke-width="4"/><rect x="842" y="218" width="66" height="16" rx="8" fill="#dfe5ef"/><rect x="842" y="245" width="50" height="16" rx="8" fill="#dfe5ef"/><text x="875" y="365" text-anchor="middle" font-size="20" fill="#46526a">mensagens digitais</text><rect x="260" y="400" width="580" height="55" rx="26" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="550" y="435" text-anchor="middle" font-size="23" font-weight="700" fill="#173b29">Permanência: necessidade de comunicar e manter vínculos</text></g></svg>