<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Tipos de fontes históricas</title><desc id="desc">Seis cartões representam fontes escritas, materiais, visuais, orais, audiovisuais e digitais.</desc><rect width="1100" height="560" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Fontes históricas podem assumir muitas formas</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(70 110)"><rect width="280" height="120" rx="20" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="140" y="48" font-size="23" font-weight="700" fill="#173b29">Escritas</text><text x="140" y="80" font-size="17" fill="#2b4a39">cartas, leis, jornais</text></g><g transform="translate(410 110)"><rect width="280" height="120" rx="20" fill="#f8f2e8" stroke="#7a5b2f" stroke-width="3"/><text x="140" y="48" font-size="23" font-weight="700" fill="#553d20">Materiais</text><text x="140" y="80" font-size="17" fill="#604a2d">objetos, prédios, moedas</text></g><g transform="translate(750 110)"><rect width="280" height="120" rx="20" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/><text x="140" y="48" font-size="23" font-weight="700" fill="#303d58">Visuais</text><text x="140" y="80" font-size="17" fill="#46526a">fotos, pinturas, cartazes</text></g><g transform="translate(70 280)"><rect width="280" height="120" rx="20" fill="#f3f1f8" stroke="#65548a" stroke-width="3"/><text x="140" y="48" font-size="23" font-weight="700" fill="#473a64">Orais</text><text x="140" y="80" font-size="17" fill="#574a70">entrevistas, relatos</text></g><g transform="translate(410 280)"><rect width="280" height="120" rx="20" fill="#f2f5ee" stroke="#527044" stroke-width="3"/><text x="140" y="48" font-size="23" font-weight="700" fill="#30452b">Audiovisuais</text><text x="140" y="80" font-size="17" fill="#42523b">áudio, filme, vídeo</text></g><g transform="translate(750 280)"><rect width="280" height="120" rx="20" fill="#f6eeee" stroke="#815050" stroke-width="3"/><text x="140" y="48" font-size="23" font-weight="700" fill="#5a3434">Digitais</text><text x="140" y="80" font-size="17" fill="#684343">sites, mensagens, dados</text></g></g><text x="55" y="485" font-family="Arial,sans-serif" font-size="20" fill="#2a3630">As categorias podem se sobrepor. O valor da fonte depende também da pergunta feita pelo pesquisador.</text></svg>