<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Perguntas para analisar uma fonte histórica</title><desc id="desc">Um documento central é cercado por perguntas sobre autoria, data, contexto, finalidade, público, conteúdo e silêncios.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Uma fonte precisa ser interrogada</text><g font-family="Arial,sans-serif"><rect x="420" y="180" width="260" height="160" rx="20" fill="#edf7f0" stroke="#315f46" stroke-width="4"/><text x="550" y="245" text-anchor="middle" font-size="27" font-weight="700" fill="#173b29">FONTE</text><text x="550" y="282" text-anchor="middle" font-size="18" fill="#2b4a39">vestígio + pergunta</text><g font-size="20" font-weight="700"><text x="95" y="145" fill="#553d20">Quem produziu?</text><text x="85" y="260" fill="#303d58">Quando e onde?</text><text x="85" y="382" fill="#473a64">Para quem?</text><text x="815" y="145" fill="#30452b">Com qual finalidade?</text><text x="815" y="260" fill="#5a3434">O que mostra?</text><text x="815" y="382" fill="#604a2d">O que silencia?</text></g><g stroke="#6a746e" stroke-width="3"><line x1="280" y1="140" x2="420" y2="215"/><line x1="270" y1="255" x2="420" y2="260"/><line x1="260" y1="377" x2="420" y2="315"/><line x1="805" y1="140" x2="680" y2="215"/><line x1="805" y1="255" x2="680" y2="260"/><line x1="805" y1="377" x2="680" y2="315"/></g></g><text x="55" y="472" font-family="Arial,sans-serif" font-size="20" fill="#2a3630">Crítica de fonte não significa apenas decidir “verdadeiro ou falso”; significa determinar o que o registro permite conhecer e seus limites.</text></svg>