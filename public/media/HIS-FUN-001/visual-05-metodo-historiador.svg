<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Fluxo simplificado do trabalho do historiador</title><desc id="desc">Fluxo em cinco etapas: formular pergunta, localizar fontes, contextualizar, comparar evidências e construir interpretação.</desc><rect width="1200" height="430" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Como o conhecimento histórico é construído</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(45 135)"><rect width="190" height="125" rx="18" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="95" y="45" font-size="22" font-weight="700" fill="#173b29">1. Perguntar</text><text x="95" y="78" font-size="16" fill="#2b4a39">definir o problema</text></g><text x="260" y="205" font-size="40" fill="#315f46">→</text><g transform="translate(295 135)"><rect width="190" height="125" rx="18" fill="#f8f2e8" stroke="#7a5b2f" stroke-width="3"/><text x="95" y="45" font-size="22" font-weight="700" fill="#553d20">2. Localizar</text><text x="95" y="78" font-size="16" fill="#604a2d">reunir fontes</text></g><text x="510" y="205" font-size="40" fill="#7a5b2f">→</text><g transform="translate(545 135)"><rect width="190" height="125" rx="18" fill="#eef1f7" stroke="#4e5f7f" stroke-width="3"/><text x="95" y="45" font-size="22" font-weight="700" fill="#303d58">3. Contextualizar</text><text x="95" y="78" font-size="16" fill="#46526a">autoria e contexto</text></g><text x="760" y="205" font-size="40" fill="#4e5f7f">→</text><g transform="translate(795 135)"><rect width="190" height="125" rx="18" fill="#f3f1f8" stroke="#65548a" stroke-width="3"/><text x="95" y="45" font-size="22" font-weight="700" fill="#473a64">4. Comparar</text><text x="95" y="78" font-size="16" fill="#574a70">convergências e limites</text></g><text x="1010" y="205" font-size="40" fill="#65548a">→</text><g transform="translate(1040 135)"><rect width="130" height="125" rx="18" fill="#f2f5ee" stroke="#527044" stroke-width="3"/><text x="65" y="43" font-size="19" font-weight="700" fill="#30452b">5. Interpretar</text><text x="65" y="76" font-size="14" fill="#42523b">argumentar com</text><text x="65" y="98" font-size="14" fill="#42523b">evidências</text></g></g><text x="55" y="335" font-family="Arial,sans-serif" font-size="20" fill="#2a3630">A interpretação é debatível e revisável, mas não arbitrária: precisa responder às evidências e ao método.</text></svg>