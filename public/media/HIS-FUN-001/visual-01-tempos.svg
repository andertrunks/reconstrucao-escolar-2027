<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Tempo cronológico e tempo histórico</title><desc id="desc">Comparação entre uma linha de datas, que representa o tempo cronológico, e faixas de ritmos de mudança e permanência, que representam o tempo histórico.</desc><rect width="1100" height="520" fill="#fff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14231b">Tempo cronológico e tempo histórico</text><g font-family="Arial,sans-serif"><rect x="55" y="105" width="990" height="150" rx="22" fill="#edf7f0" stroke="#315f46" stroke-width="3"/><text x="85" y="145" font-size="25" font-weight="700" fill="#173b29">Tempo cronológico</text><line x1="110" y1="202" x2="970" y2="202" stroke="#315f46" stroke-width="5"/><g fill="#315f46"><circle cx="180" cy="202" r="8"/><circle cx="430" cy="202" r="8"/><circle cx="680" cy="202" r="8"/><circle cx="930" cy="202" r="8"/></g><g font-size="18" fill="#2b4a39" text-anchor="middle"><text x="180" y="235">data A</text><text x="430" y="235">data B</text><text x="680" y="235">data C</text><text x="930" y="235">data D</text></g><rect x="55" y="285" width="990" height="165" rx="22" fill="#f4f1f8" stroke="#65548a" stroke-width="3"/><text x="85" y="327" font-size="25" font-weight="700" fill="#473a64">Tempo histórico</text><rect x="120" y="355" width="650" height="30" rx="15" fill="#ddd5ef"/><text x="790" y="377" font-size="17" fill="#574a70">permanência longa</text><rect x="220" y="397" width="250" height="30" rx="15" fill="#d8efdf"/><text x="490" y="419" font-size="17" fill="#315f46">mudança rápida</text><rect x="620" y="397" width="300" height="30" rx="15" fill="#f3e5cb"/><text x="940" y="419" font-size="17" fill="#604a2d">transformação gradual</text></g><text x="55" y="492" font-family="Arial,sans-serif" font-size="19" fill="#2a3630">Datas localizam acontecimentos; análise histórica compara ritmos, mudanças, permanências, continuidades e rupturas.</text></svg>