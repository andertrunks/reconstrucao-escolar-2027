<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Ida e volta com velocidade média zero e rapidez média positiva</title><desc id="desc">Movimento parte de zero, vai a vinte metros e retorna a zero em dez segundos. Deslocamento zero, distância quarenta metros, velocidade média zero e rapidez média quatro metros por segundo.</desc><rect width="900" height="480" fill="white"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28">Ida e volta ao ponto de partida</text><line x1="150" y1="220" x2="750" y2="220" stroke="black" stroke-width="4"/><line x1="200" y1="195" x2="200" y2="245" stroke="black" stroke-width="3"/><line x1="700" y1="195" x2="700" y2="245" stroke="black" stroke-width="3"/><text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="22">0 m</text><text x="700" y="280" text-anchor="middle" font-family="Arial" font-size="22">20 m</text><path d="M200 150 L700 150" stroke="black" stroke-width="5"/><polygon points="700,150 676,137 676,163" fill="black"/><path d="M700 175 L200 175" stroke="black" stroke-width="5" stroke-dasharray="10 8"/><polygon points="200,175 224,162 224,188" fill="black"/><text x="450" y="330" text-anchor="middle" font-family="Arial" font-size="22">tempo total: 10 s · deslocamento: 0 m · distância: 40 m</text><text x="450" y="385" text-anchor="middle" font-family="Arial" font-size="25">vₘ = 0/10 = 0 m/s</text><text x="450" y="430" text-anchor="middle" font-family="Arial" font-size="25">rₘ = 40/10 = 4 m/s</text></svg>
