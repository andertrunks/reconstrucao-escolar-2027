<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Deslocamento e distância em um percurso com retorno parcial</title><desc id="desc">Reta orientada mostra saída em zero metro, ida até trinta metros e retorno até vinte metros. A distância total é quarenta metros e o deslocamento é mais vinte metros.</desc><rect width="900" height="470" fill="white"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28">Mesmo percurso, duas medidas espaciais</text><line x1="120" y1="245" x2="790" y2="245" stroke="black" stroke-width="4"/><polygon points="800,245 780,232 780,258" fill="black"/><g stroke="black" stroke-width="3"><line x1="170" y1="220" x2="170" y2="270"/><line x1="570" y1="220" x2="570" y2="270"/><line x1="770" y1="220" x2="770" y2="270"/></g><g font-family="Arial" font-size="22" text-anchor="middle"><text x="170" y="305">0 m</text><text x="570" y="305">20 m</text><text x="770" y="305">30 m</text></g><path d="M170 175 C350 95 610 95 770 175" fill="none" stroke="black" stroke-width="4"/><polygon points="770,175 748,162 752,188" fill="black"/><path d="M770 195 C720 160 640 160 570 195" fill="none" stroke="black" stroke-width="4" stroke-dasharray="10 8"/><polygon points="570,195 590,181 592,207" fill="black"/><line x1="170" y1="355" x2="570" y2="355" stroke="black" stroke-width="4"/><polygon points="570,355 548,342 548,368" fill="black"/><text x="370" y="390" text-anchor="middle" font-family="Arial" font-size="22">deslocamento: +20 m</text><text x="450" y="435" text-anchor="middle" font-family="Arial" font-size="21">distância: 30 m + 10 m = 40 m</text></svg>
