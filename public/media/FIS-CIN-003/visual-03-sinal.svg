<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Sinal da velocidade média em uma reta orientada</title><desc id="desc">Três casos mostram deslocamento positivo, negativo e nulo, associados a velocidade média positiva, negativa e zero.</desc><rect width="900" height="500" fill="white"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28">O sinal acompanha o deslocamento</text><g font-family="Arial" font-size="20"><text x="70" y="105">Caso 1: positivo</text><text x="70" y="240">Caso 2: negativo</text><text x="70" y="375">Caso 3: nulo</text></g><g stroke="black" stroke-width="3"><line x1="240" y1="100" x2="780" y2="100"/><line x1="240" y1="235" x2="780" y2="235"/><line x1="240" y1="370" x2="780" y2="370"/></g><path d="M330 80 L620 80" stroke="black" stroke-width="5"/><polygon points="620,80 597,67 597,93" fill="black"/><path d="M670 215 L390 215" stroke="black" stroke-width="5"/><polygon points="390,215 413,202 413,228" fill="black"/><path d="M500 350 C560 305 620 350 500 350" fill="none" stroke="black" stroke-width="5"/><polygon points="500,350 521,337 521,363" fill="black"/><g font-family="Arial" font-size="21"><text x="340" y="135">Δs &gt; 0 → vₘ &gt; 0</text><text x="390" y="270">Δs &lt; 0 → vₘ &lt; 0</text><text x="455" y="405">Δs = 0 → vₘ = 0</text></g><text x="450" y="465" text-anchor="middle" font-family="Arial" font-size="21">Negativo indica sentido no eixo escolhido, não lentidão.</text></svg>
