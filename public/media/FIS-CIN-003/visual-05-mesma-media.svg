<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Dois movimentos diferentes com a mesma velocidade média</title><desc id="desc">Dois movimentos começam em zero metro e terminam em vinte metros após dez segundos. Um avança regularmente; o outro avança, pausa e volta a avançar. Ambos têm deslocamento vinte metros no mesmo tempo.</desc><rect width="900" height="500" fill="white"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28">Mesma média, histórias diferentes</text><text x="90" y="120" font-family="Arial" font-size="22">Movimento A</text><line x1="260" y1="115" x2="780" y2="115" stroke="black" stroke-width="3"/><circle cx="280" cy="115" r="8"/><circle cx="400" cy="115" r="8"/><circle cx="520" cy="115" r="8"/><circle cx="640" cy="115" r="8"/><circle cx="760" cy="115" r="8"/><text x="450" y="160" text-anchor="middle" font-family="Arial" font-size="19">avanço aproximadamente regular</text><text x="90" y="255" font-family="Arial" font-size="22">Movimento B</text><line x1="260" y1="250" x2="780" y2="250" stroke="black" stroke-width="3"/><circle cx="280" cy="250" r="8"/><circle cx="470" cy="250" r="8"/><circle cx="470" cy="250" r="17" fill="none" stroke="black" stroke-width="2"/><circle cx="760" cy="250" r="8"/><text x="470" y="300" text-anchor="middle" font-family="Arial" font-size="19">movimento, pausa, movimento</text><rect x="170" y="345" width="560" height="95" rx="15" fill="none" stroke="black" stroke-width="3"/><text x="450" y="385" text-anchor="middle" font-family="Arial" font-size="22">Nos dois casos: Δs = +20 m e Δt = 10 s</text><text x="450" y="420" text-anchor="middle" font-family="Arial" font-size="22">vₘ = 2 m/s</text><text x="450" y="475" text-anchor="middle" font-family="Arial" font-size="20">A média não revela o comportamento em cada instante.</text></svg>
