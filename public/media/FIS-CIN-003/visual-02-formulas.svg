<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Fórmulas de velocidade média e rapidez média</title><desc id="desc">Duas caixas com o mesmo intervalo de tempo no denominador. Velocidade média usa deslocamento e rapidez média usa distância total.</desc><rect width="900" height="460" fill="white"/><text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="28">Mesmo tempo, numeradores diferentes</text><rect x="70" y="115" width="345" height="230" rx="18" fill="none" stroke="black" stroke-width="3"/><rect x="485" y="115" width="345" height="230" rx="18" fill="none" stroke="black" stroke-width="3"/><text x="242" y="160" text-anchor="middle" font-family="Arial" font-size="24">Velocidade média</text><text x="657" y="160" text-anchor="middle" font-family="Arial" font-size="24">Rapidez média</text><text x="242" y="235" text-anchor="middle" font-family="Arial" font-size="34">vₘ = Δs / Δt</text><text x="657" y="235" text-anchor="middle" font-family="Arial" font-size="34">rₘ = d total / Δt</text><text x="242" y="290" text-anchor="middle" font-family="Arial" font-size="21">usa deslocamento orientado</text><text x="657" y="290" text-anchor="middle" font-family="Arial" font-size="21">usa caminho total</text><text x="450" y="405" text-anchor="middle" font-family="Arial" font-size="22">O denominador é o mesmo: o intervalo de tempo.</text></svg>
