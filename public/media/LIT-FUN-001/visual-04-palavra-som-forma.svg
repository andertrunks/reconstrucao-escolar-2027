<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Palavra, som e forma visual podem atuar juntos</title><desc id="desc">Três dimensões, palavras e imagens verbais, ritmo e sonoridade, e organização gráfica, convergem para a construção de sentido no texto literário.</desc><rect width="960" height="430" rx="24" fill="#fff"/><g fill="none" stroke="#25324a" stroke-width="3"><rect x="55" y="80" width="250" height="120" rx="18"/><rect x="355" y="80" width="250" height="120" rx="18"/><rect x="655" y="80" width="250" height="120" rx="18"/><path d="M180 200v65h300m0-65v65m300-65v65H480"/><rect x="280" y="265" width="400" height="100" rx="18"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="180" y="125" font-size="23" font-weight="700">Palavras e imagens</text><text x="180" y="160" font-size="18">vocabulário • metáfora</text><text x="480" y="125" font-size="23" font-weight="700">Som e ritmo</text><text x="480" y="160" font-size="18">pausa • repetição • rima</text><text x="780" y="125" font-size="23" font-weight="700">Forma visual</text><text x="780" y="160" font-size="18">espaço • tamanho • arranjo</text><text x="480" y="310" font-size="24" font-weight="700">Construção de sentido</text><text x="480" y="342" font-size="18">as dimensões podem atuar em conjunto</text><text x="480" y="405" font-size="18" font-weight="700">A forma material do texto também pode significar.</text></g></svg>