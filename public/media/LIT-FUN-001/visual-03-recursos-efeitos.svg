<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Recursos expressivos modificam a leitura</title><desc id="desc">Cinco recursos, escolha lexical, repetição, pontuação, ritmo e imagem, convergem para efeitos como intensidade, tensão, musicalidade, humor e estranhamento. O efeito depende do contexto.</desc><rect width="960" height="500" rx="24" fill="#fff"/><g fill="none" stroke="#25324a" stroke-width="3"><rect x="55" y="75" width="190" height="75" rx="16"/><rect x="285" y="75" width="190" height="75" rx="16"/><rect x="515" y="75" width="190" height="75" rx="16"/><rect x="745" y="75" width="160" height="75" rx="16"/><rect x="285" y="190" width="390" height="90" rx="18"/><path d="M150 150v40h250m-20-40v40m230-40v40H560m265-40v40H560"/><rect x="165" y="335" width="630" height="90" rx="18"/><path d="M480 280v45"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="150" y="120" font-size="20" font-weight="700">Escolha lexical</text><text x="380" y="120" font-size="20" font-weight="700">Repetição</text><text x="610" y="120" font-size="20" font-weight="700">Pontuação</text><text x="825" y="120" font-size="20" font-weight="700">Ritmo / imagem</text><text x="480" y="225" font-size="24" font-weight="700">Trecho + contexto</text><text x="480" y="258" font-size="18">o recurso ganha função na relação com o todo</text><text x="480" y="373" font-size="23" font-weight="700">Possíveis efeitos</text><text x="480" y="405" font-size="18">intensidade • tensão • humor • musicalidade • estranhamento</text><text x="480" y="470" font-size="18" font-weight="700">Nomear o recurso não basta: explique o que ele faz no trecho.</text></g></svg>