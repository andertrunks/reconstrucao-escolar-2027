<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Interpretação literária precisa de evidência</title><desc id="desc">Fluxo em quatro etapas mostra marca textual, hipótese de efeito, verificação no contexto e justificativa. A leitura retorna ao texto para confirmar ou revisar a hipótese.</desc><rect width="960" height="390" rx="24" fill="#fff"/><g fill="none" stroke="#25324a" stroke-width="3"><rect x="35" y="105" width="190" height="120" rx="18"/><rect x="270" y="105" width="190" height="120" rx="18"/><rect x="505" y="105" width="190" height="120" rx="18"/><rect x="740" y="105" width="185" height="120" rx="18"/><path d="M225 165h35m200 0h35m200 0h35"/><path d="m250 153 14 12-14 12m235-24 14 12-14 12m235-24 14 12-14 12"/><path d="M832 225v55H130v-45" stroke-dasharray="9 7"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="130" y="150" font-size="22" font-weight="700">Marca textual</text><text x="130" y="183" font-size="17">palavra • imagem • ritmo</text><text x="365" y="150" font-size="22" font-weight="700">Hipótese</text><text x="365" y="183" font-size="17">que efeito pode produzir?</text><text x="600" y="150" font-size="22" font-weight="700">Verificação</text><text x="600" y="183" font-size="17">o contexto confirma?</text><text x="832" y="150" font-size="22" font-weight="700">Justificativa</text><text x="832" y="183" font-size="17">evidência + raciocínio</text><text x="480" y="325" font-size="19" font-weight="700">Se a hipótese não se sustenta, volte ao texto e revise a leitura.</text><text x="480" y="365" font-size="18">Interpretação aberta não é interpretação arbitrária.</text></g></svg>