<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Da situação às escolhas de linguagem e ao efeito de sentido</title><desc id="desc">Fluxo em três etapas: situação ou ideia, escolhas de linguagem e efeito de sentido. Mostra que palavras, ritmo, pontuação e imagens moldam a experiência de leitura.</desc><rect width="960" height="360" rx="24" fill="#fff"/><g fill="none" stroke="#25324a" stroke-width="3"><rect x="50" y="105" width="240" height="145" rx="18"/><rect x="360" y="75" width="240" height="205" rx="18"/><rect x="670" y="105" width="240" height="145" rx="18"/><path d="M290 178h60m250 0h60"/><path d="m340 166 16 12-16 12m310-24 16 12-16 12"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="170" y="150" font-size="25" font-weight="700">Situação ou ideia</text><text x="170" y="188" font-size="18">o que pode ser dito</text><text x="480" y="118" font-size="25" font-weight="700">Escolhas de linguagem</text><text x="480" y="158" font-size="18">palavras • repetição</text><text x="480" y="190" font-size="18">pontuação • ritmo</text><text x="480" y="222" font-size="18">imagens • organização</text><text x="790" y="150" font-size="25" font-weight="700">Efeito de sentido</text><text x="790" y="188" font-size="18">como lemos e sentimos</text><text x="480" y="325" font-size="20" font-weight="700">Forma e sentido trabalham juntos.</text></g></svg>