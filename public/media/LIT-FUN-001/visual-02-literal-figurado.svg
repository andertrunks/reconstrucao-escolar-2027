<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Sentido literal e sentido figurado dependem do contexto</title><desc id="desc">Duas caixas usam a palavra porta. A primeira apresenta uma porta física aberta; a segunda usa abrir uma porta como imagem de possibilidade. O contexto orienta a leitura.</desc><rect width="960" height="420" rx="24" fill="#fff"/><g fill="none" stroke="#25324a" stroke-width="3"><rect x="55" y="90" width="385" height="210" rx="18"/><rect x="520" y="90" width="385" height="210" rx="18"/></g><g fill="#182133" font-family="Arial,sans-serif"><text x="247" y="135" font-size="25" font-weight="700" text-anchor="middle">Uso mais literal</text><text x="85" y="190" font-size="22">“A porta está aberta.”</text><text x="85" y="235" font-size="18">porta = elemento físico</text><text x="712" y="135" font-size="25" font-weight="700" text-anchor="middle">Uso figurado</text><text x="550" y="190" font-size="22">“A conversa abriu uma porta.”</text><text x="550" y="235" font-size="18">porta = possibilidade / acesso</text><text x="480" y="360" font-size="20" font-weight="700" text-anchor="middle">A palavra não muda sozinha: o contexto orienta o sentido.</text></g></svg>