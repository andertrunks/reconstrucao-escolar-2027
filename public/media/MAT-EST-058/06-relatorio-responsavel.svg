<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="ttl des"><title id="ttl">Seis partes de um relatório interpretável</title><desc id="des">Sequência de seis componentes: pergunta e coorte, denominadores, corte e versão, métricas, pendências com sensibilidade e conclusão limitada.</desc><rect width="1100" height="420" fill="#ffffff"/><text x="38" y="49" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#192b3b">Seis partes de um relatório interpretável</text><rect x="45" y="95" width="315" height="117" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="61" y="135" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#192b3b">1. Pergunta e coorte</text><text x="61" y="171" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#192b3b">não agrupar escopos</text><rect x="397" y="95" width="315" height="117" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="413" y="135" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#192b3b">2. Denominadores</text><text x="413" y="171" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#192b3b">planejados e avaliáveis</text><rect x="749" y="95" width="315" height="117" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="765" y="135" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#192b3b">3. Corte e versão</text><text x="765" y="171" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#192b3b">história preservada</text><rect x="45" y="245" width="315" height="117" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="61" y="285" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#192b3b">4. Métricas</text><text x="61" y="321" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#192b3b">unidade e custo</text><rect x="397" y="245" width="315" height="117" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="413" y="285" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#192b3b">5. Pendências</text><text x="413" y="321" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#192b3b">sensibilidade explícita</text><rect x="749" y="245" width="315" height="117" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="765" y="285" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#192b3b">6. Conclusão</text><text x="765" y="321" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#192b3b">sem certeza exagerada</text></svg>
