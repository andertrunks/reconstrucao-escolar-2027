<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="ttl des"><title id="ttl">Quatro conjuntos: não misturar números</title><desc id="des">Histórico tem cinco pares t18–t22; quarentena t23–t25 nenhum; sucessor t26–t33 nenhum; sandbox separado contém dois de oito cartões avaliáveis.</desc><rect width="1100" height="420" fill="#ffffff"/><text x="38" y="49" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#192b3b">Quatro conjuntos: não misturar números</text><rect x="32" y="93" width="506" height="122" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="54" y="132" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#192b3b">HISTÓRICO · t18–t22</text><text x="54" y="172" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#192b3b">5 pares conhecidos; guarda t19 violada</text><rect x="560" y="93" width="506" height="122" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="582" y="132" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#192b3b">QUARENTENA · t23–t25</text><text x="582" y="172" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#192b3b">3 alvos sem observações</text><rect x="32" y="242" width="506" height="122" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="54" y="281" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#192b3b">SUCESSOR PROPOSTO · t26–t33</text><text x="54" y="321" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#192b3b">0 emissões e 0 resultados</text><rect x="560" y="242" width="506" height="122" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text 