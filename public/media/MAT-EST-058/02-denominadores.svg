<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="ttl des"><title id="ttl">Dois denominadores para duas perguntas</title><desc id="des">Oito cartões planejados dividem-se em dois avaliáveis e seis pendentes. Completude usa 2 sobre 8; erro médio usa dois erros.</desc><rect width="1100" height="420" fill="#ffffff"/><text x="38" y="49" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#192b3b">Dois denominadores para duas perguntas</text><rect x="350" y="84" width="400" height="78" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="550" y="121" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#192b3b">8 cartões planejados</text><path d="M 550 164 L 550 196" stroke="#435567" stroke-width="3" fill="none"/><path d="M 550 196 L 258 221" stroke="#435567" stroke-width="3" fill="none"/><path d="M 550 196 L 832 221" stroke="#435567" stroke-width="3" fill="none"/><rect x="62" y="224" width="390" height="104" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="257" y="264" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#192b3b">2 pares avaliáveis</text><text x="257" y="294" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#192b3b">MAE: dividir por 2</text><rect x="646" y="224" width="390" height="104" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="841" y="264" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#192b3b">6 pendências</text><text x="841" y="294" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#192b3b">não equivalem a erros zero</text><text x="550" y="382" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#192b3b">Completude do quadro: 2/8 = 25%</text></svg>
