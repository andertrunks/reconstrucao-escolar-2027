<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="336" viewBox="0 0 1000 336" role="img" aria-labelledby="title desc">
<title id="title">Linha lógica de tratamento da ocorrência</title>
<desc id="desc">Um registro auditável separa detecção, triagem, contenção, correção, reteste e fechamento, com versões.</desc>
<rect width="1000" height="336" rx="20" fill="#f8fafc"/>
<text x="25" y="40" fill="#1f3044" font-size="23" font-weight="bold" font-family="Arial,sans-serif">Linha lógica de tratamento da ocorrência</text>
<rect x="30.0" y="77" width="224.5" height="167" rx="13" fill="white" stroke="#40566b" stroke-width="2"/>
<rect x="31.0" y="78" width="222.5" height="5" rx="2" fill="#40566b"/>
<text x="41.0" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#40566b">Detecção</text>
<text x="41.0" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Identificar fixture</text>
<text x="41.0" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Fonte e versão</text>
<rect x="268.5" y="77" width="224.5" height="167" rx="13" fill="white" stroke="#986016" stroke-width="2"/>
<rect x="269.5" y="78" width="222.5" height="5" rx="2" fill="#986016"/>
<text x="279.5" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#986016">Triagem</text>
<text x="279.5" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Escopo e incerteza</text>
<text x="279.5" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Sem inventar alcance</text>
<rect x="507.0" y="77" width="224.5" height="167" rx="13" fill="white" stroke="#28654a" stroke-width="2"/>
<rect x="508.0" y="78" width="222.5" height="5" rx="2" fill="#28654a"/>
<text x="518.0" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#28654a">Correção</text>
<text x="518.0" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Nova cópia do caso</text>
<text x="518.0" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Registro anterior</text>
<text x="518.0" y="174" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">mantido</text>
<rect x="745.5" y="77" width="224.5" height="167" rx="13" fill="white" stroke="#28654a" stroke-width="2"/>
<rect x="746.5" y="78" width="222.5" height="5" rx="2" fill="#28654a"/>
<text x="756.5" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#28654a">Reteste</text>
<text x="756.5" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Alvo e regressão</text>
<text x="756.5" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Sem autorizar deploy</text>
<text x="25" y="279" font-family="Arial,sans-serif" font-weight="700" fill="#1f3044" font-size="16">Horários reais não foram coletados; este diagrama mostra ordem lógica, não duração de incidente.</text>
</svg>