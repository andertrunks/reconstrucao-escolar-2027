<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Como testar um conceito</title><desc id="d">Fluxo que parte de conceito e definição provisória, passa por critérios, exemplos, casos-limite e contraexemplos e retorna à revisão.</desc><rect width="1200" height="720" fill="white"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Como testar um conceito</text><g font-family="Arial" font-size="26" text-anchor="middle"><rect x="430" y="110" width="340" height="80" rx="20" fill="#eef2ff" stroke="#111827" stroke-width="4"/><text x="600" y="160">CONCEITO</text><path d="M600 190V235" stroke="#111827" stroke-width="5" marker-end="url(#a)"/><rect x="405" y="240" width="390" height="80" rx="20" fill="#f8fafc" stroke="#111827" stroke-width="4"/><text x="600" y="290">DEFINIÇÃO PROVISÓRIA</text><path d="M600 320V360" stroke="#111827" stroke-width="5" marker-end="url(#a)"/><rect x="70" y="375" width="260" height="80" rx="20" fill="#f8fafc" stroke="#111827" stroke-width="4"/><text x="200" y="425">CRITÉRIOS</text><rect x="470" y="375" width="260" height="80" rx="20" fill="#f8fafc" stroke="#111827" stroke-width="4"/><text x="600" y="425">EXEMPLOS</text><rect x="870" y="375" width="260" height="80" rx="20" fill="#f8fafc" stroke="#111827" stroke-width="4"/><text x="1000" y="425">CASOS-LIMITE</text><path d="M200 455V515M600 455V515M1000 455V515" stroke="#111827" stroke-width="4"/><rect x="390" y="520" width="420" height="80" rx="20" fill="#eef2ff" stroke="#111827" stroke-width="4"/><text x="600" y="570">CONTRAEXEMPLOS E REVISÃO</text><path d="M390 560C210 560 180 275 405 280" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><text x="600" y="670" text-anchor="middle" font-family="Arial" font-size="24">Definir é propor critérios e testá-los contra casos.</text></svg>