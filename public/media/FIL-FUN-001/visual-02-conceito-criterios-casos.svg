<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Como testar um conceito</title><desc id="desc">Um ciclo conecta conceito, definição provisória, critérios, exemplos, casos-limite, contraexemplos e revisão.</desc><rect width="1000" height="660" rx="24" fill="#fff"/><g fill="#fff" stroke="#25324a" stroke-width="3"><rect x="365" y="60" width="270" height="85" rx="18"/><rect x="680" y="175" width="245" height="85" rx="18"/><rect x="650" y="405" width="275" height="85" rx="18"/><rect x="365" y="515" width="270" height="85" rx="18"/><rect x="75" y="405" width="245" height="85" rx="18"/><rect x="75" y="175" width="245" height="85" rx="18"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="112" font-size="25" font-weight="700">Conceito</text><text x="802" y="225" font-size="22" font-weight="700">Definição provisória</text><text x="787" y="455" font-size="22" font-weight="700">Critérios</text><text x="500" y="565" font-size="22" font-weight="700">Exemplos e casos-limite</text><text x="197" y="455" font-size="22" font-weight="700">Contraexemplos</text><text x="197" y="225" font-size="22" font-weight="700">Revisão</text></g><g fill="none" stroke="#25324a" stroke-width="4" marker-end="url(#a)"><path d="M635 112 C720 115 780 130 802 175"/><path d="M850 260 C870 315 860 360 810 405"/><path d="M650 470 C610 520 570 530 635 557"/><path d="M365 557 C290 550 240 520 220 490"/><path d="M150 405 C120 340 130 300 180 260"/><path d="M250 175 C300 120 335 105 365 105"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#25324a"/></marker></defs><text x="500" y="635" fill="#182133" font-family="Arial,sans-serif" text-anchor="middle" font-size="20">Uma definição melhora quando sobrevive a testes por casos.</text></svg>