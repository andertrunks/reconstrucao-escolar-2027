<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Ciclo de investigação filosófica</title><desc id="d">Seis etapas em ciclo: problema, esclarecimento conceitual, tese, razões, objeções e revisão, retornando ao problema.</desc><rect width="1200" height="720" fill="white"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Ciclo da investigação filosófica</text><g font-family="Arial" font-size="24" text-anchor="middle"><circle cx="600" cy="365" r="245" fill="none" stroke="#111827" stroke-width="5" stroke-dasharray="12 10"/><g><rect x="510" y="100" width="180" height="70" rx="18" fill="#eef2ff" stroke="#111827" stroke-width="3"/><text x="600" y="144">PROBLEMA</text></g><g><rect x="800" y="205" width="270" height="70" rx="18" fill="#f8fafc" stroke="#111827" stroke-width="3"/><text x="935" y="249">ESCLARECER CONCEITOS</text></g><g><rect x="835" y="455" width="180" height="70" rx="18" fill="#eef2ff" stroke="#111827" stroke-width="3"/><text x="925" y="499">TESE</text></g><g><rect x="505" y="560" width="190" height="70" rx="18" fill="#f8fafc" stroke="#111827" stroke-width="3"/><text x="600" y="604">RAZÕES</text></g><g><rect x="160" y="455" width="220" height="70" rx="18" fill="#eef2ff" stroke="#111827" stroke-width="3"/><text x="270" y="499">OBJEÇÕES</text></g><g><rect x="125" y="205" width="210" height="70" rx="18" fill="#f8fafc" stroke="#111827" stroke-width="3"/><text x="230" y="249">REVISÃO</text></g><path d="M695 125C770 145 830 180 870 215M1010 275C1040 330 1040 405 1000 455M835 520C790 565 745 585 695 590M505 590C440 580 385 550 350 520M200 455C160 405 155 330 185 275M335 210C390 165 445 140 510 125" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><text x="600" y="690" te