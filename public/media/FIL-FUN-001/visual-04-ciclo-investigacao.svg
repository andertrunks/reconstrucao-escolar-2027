<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Ciclo da investigação filosófica</title><desc id="desc">Seis etapas formam um ciclo: problema, esclarecer conceitos, formular tese, apresentar razões, testar objeções e contraexemplos, revisar e retornar ao problema.</desc><rect width="1000" height="720" rx="24" fill="#fff"/><g fill="#fff" stroke="#25324a" stroke-width="3"><rect x="360" y="65" width="280" height="85" rx="18"/><rect x="660" y="185" width="260" height="85" rx="18"/><rect x="660" y="430" width="260" height="85" rx="18"/><rect x="360" y="555" width="280" height="85" rx="18"/><rect x="80" y="430" width="260" height="85" rx="18"/><rect x="80" y="185" width="260" height="85" rx="18"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="45" font-size="29" font-weight="700">Ciclo da investigação filosófica</text><text x="500" y="117" font-size="23" font-weight="700">1. Formular o problema</text><text x="790" y="237" font-size="21" font-weight="700">2. Esclarecer conceitos</text><text x="790" y="482" font-size="21" font-weight="700">3. Propor uma tese</text><text x="500" y="607" font-size="22" font-weight="700">4. Apresentar razões</text><text x="210" y="472" font-size="20" font-weight="700">5. Testar objeções e</text><text x="210" y="498" font-size="20" font-weight="700">contraexemplos</text><text x="210" y="237" font-size="22" font-weight="700">6. Revisar</text><text x="500" y="687" font-size="19">Revisar pode produzir uma pergunta melhor — e o ciclo recomeça.</text></g><g fill="none" stroke="#25324a" stroke-width="4" marker-end="url(#a)"><path d="M640 110 C720 120 760 145 785 185"/><path d="M875 270 C900 330 900 380 875 430"/><path d="M660 500 C610 550 570 565 640 600"/><path d="M360 600 C300 575 260 550 220 515"/><path d="M125 430 C100 360 105 310 135 270"/><path d="M210 185 C260 135 310 115 360 110"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#25324a"/></marker></defs></svg>