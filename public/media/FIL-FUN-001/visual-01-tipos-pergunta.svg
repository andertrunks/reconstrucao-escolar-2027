<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Quatro tipos de pergunta</title><desc id="d">Quatro caixas: empírica pede dados; conceitual pede critérios; normativa pede razões sobre o que deve ser; mista combina dimensões.</desc><rect width="1200" height="720" fill="white"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Quatro caminhos de investigação</text><g font-family="Arial"><rect x="90" y="150" width="460" height="180" rx="24" fill="#eef2ff" stroke="#1f2937" stroke-width="4"/><text x="320" y="210" text-anchor="middle" font-size="30" font-weight="700">EMPÍRICA</text><text x="320" y="260" text-anchor="middle" font-size="25">Pergunta principal: o que mostram os dados?</text><rect x="650" y="150" width="460" height="180" rx="24" fill="#f8fafc" stroke="#1f2937" stroke-width="4"/><text x="880" y="210" text-anchor="middle" font-size="30" font-weight="700">CONCEITUAL</text><text x="880" y="260" text-anchor="middle" font-size="25">Pergunta principal: quais critérios definem X?</text><rect x="90" y="390" width="460" height="180" rx="24" fill="#f8fafc" stroke="#1f2937" stroke-width="4"/><text x="320" y="450" text-anchor="middle" font-size="30" font-weight="700">NORMATIVA</text><text x="320" y="500" text-anchor="middle" font-size="25">Pergunta principal: o que deve ser?</text><rect x="650" y="390" width="460" height="180" rx="24" fill="#eef2ff" stroke="#1f2937" stroke-width="4"/><text x="880" y="450" text-anchor="middle" font-size="30" font-weight="700">MISTA</text><text x="880" y="500" text-anchor="middle" font-size="25">Combina dados, conceitos e valores</text></g><text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="24">Classificar a pergunta ajuda a escolher evidências e razões adequadas.</text></svg>