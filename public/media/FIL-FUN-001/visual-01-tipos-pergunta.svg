<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Quatro caminhos de investigação</title><desc id="desc">Quatro blocos distinguem perguntas empíricas, conceituais, normativas e mistas, indicando o que cada tipo exige para ser respondido.</desc><rect width="1000" height="620" rx="24" fill="#fff"/><g fill="#fff" stroke="#25324a" stroke-width="3"><rect x="55" y="115" width="205" height="250" rx="18"/><rect x="285" y="115" width="205" height="250" rx="18"/><rect x="515" y="115" width="205" height="250" rx="18"/><rect x="745" y="115" width="205" height="250" rx="18"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="55" font-size="30" font-weight="700">Que tipo de pergunta estamos fazendo?</text><text x="157" y="165" font-size="24" font-weight="700">Empírica</text><text x="157" y="210" font-size="18">Pede dados,</text><text x="157" y="238" font-size="18">observação ou</text><text x="157" y="266" font-size="18">medição</text><text x="387" y="165" font-size="24" font-weight="700">Conceitual</text><text x="387" y="210" font-size="18">Pede critérios,</text><text x="387" y="238" font-size="18">distinções e</text><text x="387" y="266" font-size="18">definições</text><text x="617" y="165" font-size="24" font-weight="700">Normativa</text><text x="617" y="210" font-size="18">Pede razões sobre</text><text x="617" y="238" font-size="18">o que deve ser</text><text x="617" y="266" font-size="18">feito ou valorizado</text><text x="847" y="165" font-size="24" font-weight="700">Mista</text><text x="847" y="210" font-size="18">Combina fatos,</text><text x="847" y="238" font-size="18">conceitos e</text><text x="847" y="266" font-size="18">valores</text><text x="500" y="430" font-size="24" font-weight="700">A mesma situação pode gerar perguntas diferentes.</text><text x="500" y="480" font-size="20">Classificar a pergunta ajuda a escolher evidências e razões adequadas.</text></g><path d="M157 365v35h690v-35" fill="none" stroke="#25324a" stroke-width="3"/></svg>