<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Anatomia de um argumento</title><desc id="d">Premissa 1 e Premissa 2 convergem para uma conclusão; duas perguntas lembram avaliar as premissas e a força da inferência.</desc><rect width="1200" height="720" fill="white"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Anatomia de um argumento</text><g font-family="Arial" text-anchor="middle"><rect x="100" y="160" width="360" height="120" rx="24" fill="#f8fafc" stroke="#111827" stroke-width="4"/><text x="280" y="215" font-size="30" font-weight="700">PREMISSA 1</text><text x="280" y="252" font-size="22">razão oferecida</text><rect x="740" y="160" width="360" height="120" rx="24" fill="#f8fafc" stroke="#111827" stroke-width="4"/><text x="920" y="215" font-size="30" font-weight="700">PREMISSA 2</text><text x="920" y="252" font-size="22">razão oferecida</text><path d="M280 280L520 390M920 280L680 390" stroke="#111827" stroke-width="6" marker-end="url(#a)"/><rect x="390" y="395" width="420" height="130" rx="24" fill="#eef2ff" stroke="#111827" stroke-width="4"/><text x="600" y="455" font-size="32" font-weight="700">CONCLUSÃO</text><text x="600" y="495" font-size="22">afirmação que as razões sustentam</text></g><text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="24">1. As premissas são aceitáveis?</text><text x="600" y="630" text-anchor="middle" font-family="Arial" font-size="24">2. Mesmo se forem, elas sustentam a conclusão?</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs></svg>