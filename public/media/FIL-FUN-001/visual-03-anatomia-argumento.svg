<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Anatomia de um argumento</title><desc id="desc">Duas premissas oferecem razões para uma conclusão. Abaixo aparecem duas perguntas de avaliação: se as premissas são aceitáveis e se sustentam a conclusão.</desc><rect width="1000" height="620" rx="24" fill="#fff"/><g fill="#fff" stroke="#25324a" stroke-width="3"><rect x="100" y="100" width="300" height="120" rx="18"/><rect x="600" y="100" width="300" height="120" rx="18"/><rect x="350" y="330" width="300" height="120" rx="18"/></g><g fill="#182133" font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="52" font-size="30" font-weight="700">Premissas oferecem razões</text><text x="250" y="155" font-size="25" font-weight="700">Premissa 1</text><text x="250" y="190" font-size="18">uma razão apresentada</text><text x="750" y="155" font-size="25" font-weight="700">Premissa 2</text><text x="750" y="190" font-size="18">outra razão apresentada</text><text x="500" y="385" font-size="26" font-weight="700">Conclusão</text><text x="500" y="420" font-size="18">o que se procura sustentar</text><text x="500" y="520" font-size="21" font-weight="700">1. As premissas são aceitáveis?</text><text x="500" y="558" font-size="21" font-weight="700">2. Elas realmente sustentam a conclusão?</text></g><g fill="none" stroke="#25324a" stroke-width="4" marker-end="url(#a)"><path d="M300 220 L445 330"/><path d="M700 220 L555 330"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#25324a"/></marker></defs></svg>