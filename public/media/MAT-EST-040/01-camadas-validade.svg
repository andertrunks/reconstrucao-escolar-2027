<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Validade da inferência: coleta, método e conclusão</title><desc id="desc">Três caixas em sequência mostram coleta, reamostragem e conclusão; alerta sobre replicações artificiais.</desc>
<rect width="1000" height="560" fill="#f8fbfc"/>
<text x="48" y="65" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#142637">Da coleta à conclusão: três camadas que não se substituem</text>
<rect x="45" y="155" width="285" height="172" rx="15" fill="#ffffff" stroke="#d4dce3" stroke-width="2"/>
<text x="63" y="205" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#146f8c">Coleta</text>
<text x="63" y="250" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#142637">Quem foi selecionado?</text>
<text x="63" y="280" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#536478">Desenho original</text>
<text x="346" y="245" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#146f8c">→</text>
<rect x="372" y="155" width="285" height="172" rx="15" fill="#ffffff" stroke="#d4dce3" stroke-width="2"/>
<text x="390" y="205" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#146f8c">Reamostragem</text>
<text x="390" y="250" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#142637">Qual unidade repetir?</text>
<text x="390" y="280" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#536478">Bootstrap ou permutação</text>
<text x="673" y="245" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#146f8c">→</text>
<rect x="699" y="155" width="285" height="172" rx="15" fill="#ffffff" stroke="#d4dce3" stroke-width="2"/>
<text x="717" y="205" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#146f8c">Conclusão</text>
<text x="717" y="250" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#142637">O que as hipóteses permitem?</text>
<text x="717" y="280" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#536478">Intervalo, p e limites</text>
<rect x="65" y="375" width="865" height="90" rx="15" fill="#fff2e7"/>
<text x="87" y="427" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#9a471b">10.000 réplicas não criam 10.000 novas unidades coletadas.</text>
</svg>