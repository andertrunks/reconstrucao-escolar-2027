<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Skimming procura o panorama do texto</title><desc id="desc">Um texto esquemático destaca título, subtítulos, primeira e última parte e palavras repetidas, mostrando o percurso rápido usado para captar assunto e finalidade.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial" fill="#18242c"><text x="480" y="50" text-anchor="middle" font-size="30" font-weight="700">Skimming procura o panorama</text><rect x="170" y="105" width="620" height="380" rx="18" fill="#f8fafb" stroke="#263238" stroke-width="2"/><rect x="215" y="145" width="530" height="48" rx="8" fill="#eef3f7" stroke="#263238"/><text x="480" y="177" text-anchor="middle" font-size="22" font-weight="700">TITLE: School Gardens</text><text x="225" y="235" font-size="18" font-weight="700">Opening idea:</text><text x="350" y="235" font-size="18">schools create small gardens...</text><text x="225" y="280" font-size="18">gardens • students • science • community</text><text x="225" y="325" font-size="18">[details]  [example]  [details]  [example]</text><text x="225" y="370" font-size="18" font-weight="700">Repeated clues:</text><text x="385" y="370" font-size="18">gardens • schools • projects</text><text x="225" y="415" font-size="18" font-weight="700">Closing idea:</text><text x="350" y="415" font-size="18">maintenance is the main challenge.</text><g stroke="#263238" stroke-width="3" fill="none"><path d="M115 150 C70 220 70 370 115 450"/><path d="M845 150 C890 220 890 370 845 450"/></g><text x="80" y="300" text-anchor="middle" font-size="18" transform="rotate(-90 80 300)">leitura rápida do conjunto</text><text x="880" y="300" text-anchor="middle" font-size="18" transform="rotate(90 880 300)">sem parar em cada palavra</text><text x="480" y="525" text-anchor="middle" font-size="20" font-weight="700">Pergunta respondida: “Sobre o que é o texto e qual é sua ideia geral?”</text><text x="480" y="565" text-anchor="middle" font-size="18">Conclusão: skimming cria um mapa inicial; detalhes ficam para uma segunda leitura.</text></g></svg>