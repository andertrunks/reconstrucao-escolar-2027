<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Antes de traduzir, observe a arquitetura do texto</title><desc id="desc">Fluxo em cinco etapas mostra gênero, título e fonte, números e nomes, organização visual e hipótese de finalidade antes da tradução detalhada.</desc><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#263238"/></marker></defs><g font-family="Arial" fill="#18242c"><text x="480" y="52" text-anchor="middle" font-size="30" font-weight="700">Antes de traduzir, observe a arquitetura do texto</text><text x="480" y="86" text-anchor="middle" font-size="18">A compreensão começa com pistas visíveis e com a tarefa de leitura.</text><g stroke="#263238" stroke-width="2"><rect x="50" y="190" width="150" height="160" rx="18" fill="#eef3f7"/><rect x="230" y="190" width="150" height="160" rx="18" fill="#f6f2ea"/><rect x="410" y="190" width="150" height="160" rx="18" fill="#eef6ef"/><rect x="590" y="190" width="150" height="160" rx="18" fill="#f3eef7"/><rect x="770" y="190" width="150" height="160" rx="18" fill="#eef5f6"/></g><g text-anchor="middle"><text x="125" y="230" font-size="22" font-weight="700">1. GÊNERO</text><text x="125" y="270" font-size="17">aviso?</text><text x="125" y="298" font-size="17">notícia?</text><text x="125" y="326" font-size="17">anúncio?</text><text x="305" y="230" font-size="22" font-weight="700">2. TÍTULO</text><text x="305" y="270" font-size="17">fonte</text><text x="305" y="298" font-size="17">subtítulo</text><text x="485" y="230" font-size="22" font-weight="700">3. ÂNCORAS</text><text x="485" y="270" font-size="17">números</text><text x="485" y="298" font-size="17">nomes</text><text x="485" y="326" font-size="17">símbolos</text><text x="665" y="230" font-size="22" font-weight="700">4. FORMA</text><text x="665" y="270" font-size="17">listas</text><text x="665" y="298" font-size="17">tabela</text><text x="665" y="326" font-size="17">imagem</text><text x="845" y="230" font-size="22" font-weight="700">5. HIPÓTESE</text><text x="845" y="270" font-size="17">assunto</text><text x="845" y="298" font-size="17">finalidade</text><text x="845" y="326" font-size="17">a confirmar</text></g><g stroke="#263238" stroke-width="3" marker-end="url(#a)"><path d="M200 270 H222"/><path d="M380 270 H402"/><path d="M560 270 H582"/><path d="M740 270 H762"/></g><text x="480" y="430" text-anchor="middle" font-size="22" font-weight="700">Depois disso, escolha como ler: panorama, busca específica ou leitura detalhada.</text><text x="480" y="480" text-anchor="middle" font-size="18">Observe primeiro o que o texto oferece. Tradução completa não é o ponto de partida obrigatório.</text><text x="480" y="525" text-anchor="middle" font-size="18" font-weight="700">Conclusão: pistas estruturais orientam a leitura antes de cada palavra ser conhecida.</text></g></svg>