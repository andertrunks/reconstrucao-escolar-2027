<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Questão, alvo, varredura, contexto e confirmação</title><desc id="desc">Fluxo em cinco etapas mostra como resolver uma questão de leitura: ler a pergunta, definir o alvo, localizar por scanning, ler o contexto e confirmar a resposta pela evidência.</desc><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#263238"/></marker></defs><g font-family="Arial" fill="#18242c"><text x="480" y="52" text-anchor="middle" font-size="30" font-weight="700">Fluxo de resolução de uma questão de leitura</text><g stroke="#263238" stroke-width="2"><rect x="35" y="190" width="160" height="145" rx="18" fill="#eef3f7"/><rect x="218" y="190" width="160" height="145" rx="18" fill="#f6f2ea"/><rect x="401" y="190" width="160" height="145" rx="18" fill="#eef6ef"/><rect x="584" y="190" width="160" height="145" rx="18" fill="#f3eef7"/><rect x="767" y="190" width="160" height="145" rx="18" fill="#eef5f6"/></g><g text-anchor="middle"><text x="115" y="230" font-size="21" font-weight="700">1. QUESTÃO</text><text x="115" y="272" font-size="16">O que pede?</text><text x="298" y="230" font-size="21" font-weight="700">2. ALVO</text><text x="298" y="264" font-size="16">horário?</text><text x="298" y="288" font-size="16">nome? tema?</text><text x="481" y="230" font-size="21" font-weight="700">3. VARREDURA</text><text x="481" y="272" font-size="16">scanning para</text><text x="481" y="296" font-size="16">localizar a região</text><text x="664" y="230" font-size="21" font-weight="700">4. CONTEXTO</text><text x="664" y="272" font-size="16">ler o trecho</text><text x="664" y="296" font-size="16">ao redor</text><text x="847" y="230" font-size="21" font-weight="700">5. CONFIRMAR</text><text x="847" y="272" font-size="16">a evidência</text><text x="847" y="296" font-size="16">sustenta?</text></g><g stroke="#263238" stroke-width="3" marker-end="url(#a)"><path d="M195 262 H210"/><path d="M378 262 H393"/><path d="M561 262 H576"/><path d="M744 262 H759"/></g><text x="480" y="405" text-anchor="middle" font-size="22" font-weight="700">Localizar não é o mesmo que compreender.</text><text x="480" y="455" text-anchor="middle" font-size="18">O scanning encurta a busca; a leitura do contexto decide se a pista responde de fato à pergunta.</text><text x="480" y="505" text-anchor="middle" font-size="18">O dicionário entra apenas quando uma palavra decisiva continua bloqueando a tarefa.</text><text x="480" y="550" text-anchor="middle" font-size="18" font-weight="700">Conclusão: velocidade útil nasce de uma busca orientada e de confirmação por evidência.</text></g></svg>