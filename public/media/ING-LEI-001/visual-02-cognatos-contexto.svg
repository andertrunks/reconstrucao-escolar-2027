<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Cognatos são pistas, não provas</title><desc id="desc">Painel compara cognatos úteis, como information e hospital, com falsos cognatos, como library e actual, e mostra que o contexto confirma o sentido.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial" fill="#18242c"><text x="480" y="52" text-anchor="middle" font-size="30" font-weight="700">Cognatos são pistas, não provas</text><g stroke="#263238" stroke-width="2"><rect x="65" y="120" width="380" height="320" rx="20" fill="#eef6ef"/><rect x="515" y="120" width="380" height="320" rx="20" fill="#f6f2ea"/></g><text x="255" y="165" text-anchor="middle" font-size="24" font-weight="700">COGNATOS ÚTEIS</text><text x="705" y="165" text-anchor="middle" font-size="24" font-weight="700">CUIDADO: FALSOS COGNATOS</text><g font-size="20"><text x="110" y="220">information → informação</text><text x="110" y="265">hospital → hospital</text><text x="110" y="310">important → importante</text><text x="110" y="355">community → comunidade</text><text x="560" y="220">library → biblioteca</text><text x="560" y="265">actual → real / de fato</text><text x="560" y="310">parents → pais</text><text x="560" y="355">pretend → fingir</text></g><text x="480" y="485" text-anchor="middle" font-size="22" font-weight="700">SEMELHANÇA GRÁFICA + CONTEXTO → HIPÓTESE MAIS SEGURA</text><text x="480" y="525" text-anchor="middle" font-size="18">A frase, o gênero e a tarefa de leitura confirmam ou corrigem a primeira impressão.</text><text x="480" y="565" text-anchor="middle" font-size="18" font-weight="700">Conclusão: use a semelhança como ponte, nunca como tradução automática.</text></g></svg>