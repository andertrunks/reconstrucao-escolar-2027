<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Skimming e scanning resolvem tarefas diferentes</title><desc id="desc">Duas colunas comparam skimming, que busca tema e finalidade, e scanning, que busca dados específicos como horários, preços e nomes. Ambas levam à leitura local quando necessário.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial" fill="#18242c"><text x="480" y="52" text-anchor="middle" font-size="30" font-weight="700">Skimming e scanning resolvem tarefas diferentes</text><g stroke="#263238" stroke-width="2"><rect x="80" y="115" width="350" height="340" rx="20" fill="#eef3f7"/><rect x="530" y="115" width="350" height="340" rx="20" fill="#f6f2ea"/></g><text x="255" y="165" text-anchor="middle" font-size="28" font-weight="700">SKIMMING</text><text x="705" y="165" text-anchor="middle" font-size="28" font-weight="700">SCANNING</text><g font-size="19"><text x="120" y="215">Objetivo: panorama geral</text><text x="120" y="255">Procura:</text><text x="150" y="288">• assunto</text><text x="150" y="320">• ideia principal</text><text x="150" y="352">• finalidade</text><text x="120" y="405">Pergunta: “sobre o que é?”</text><text x="570" y="215">Objetivo: dado específico</text><text x="570" y="255">Procura:</text><text x="600" y="288">• horário / data</text><text x="600" y="320">• preço / número</text><text x="600" y="352">• nome / lugar</text><text x="570" y="405">Pergunta: “onde está o dado?”</text></g><path d="M255 465 V500 H705 V465" fill="none" stroke="#263238" stroke-width="3"/><text x="480" y="530" text-anchor="middle" font-size="20" font-weight="700">Depois de localizar, leia o contexto com atenção.</text><text x="480" y="568" text-anchor="middle" font-size="18">Conclusão: a pergunta define a estratégia; as duas podem ser usadas no mesmo texto.</text></g></svg>