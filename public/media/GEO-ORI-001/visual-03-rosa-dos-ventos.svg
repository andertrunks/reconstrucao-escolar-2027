<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc"><title id="title">Rosa dos ventos fundamental</title><desc id="desc">Rosa dos ventos com norte, sul, leste, oeste e os pontos colaterais nordeste, sudeste, sudoeste e noroeste.</desc><rect width="700" height="700" fill="white"/><g transform="translate(350 350)" stroke="#222" stroke-width="4" fill="none"><circle r="210"/><line x1="0" y1="-245" x2="0" y2="245"/><line x1="-245" y1="0" x2="245" y2="0"/><line x1="-173" y1="-173" x2="173" y2="173"/><line x1="173" y1="-173" x2="-173" y2="173"/><polygon points="0,-250 -14,-215 14,-215" fill="#222"/><polygon points="250,0 215,-14 215,14" fill="#222"/><polygon points="0,250 -14,215 14,215" fill="#222"/><polygon points="-250,0 -215,-14 -215,14" fill="#222"/></g><g font-family="Arial,sans-serif" font-size="30" fill="#111" text-anchor="middle" font-weight="700"><text x="350" y="55">N</text><text x="350" y="675">S</text><text x="665" y="360">L</text><text x="35" y="360">O</text><text x="565" y="145">NE</text><text x="565" y="575">SE</text><text x="135" y="575">SO</text><text x="135" y="145">NO</text></g><text x="350" y="350" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">direções</text></svg>