<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Pontos de referência e direções cardeais</title><desc id="desc">Praça ao centro, escola ao norte, hospital a leste, parque ao sul e estação a oeste. Setas identificam norte, sul, leste e oeste.</desc><rect width="800" height="520" fill="white"/><g stroke="#222" stroke-width="3" fill="none"><line x1="400" y1="260" x2="400" y2="80"/><polyline points="390,95 400,75 410,95"/><line x1="400" y1="260" x2="400" y2="440"/><polyline points="390,425 400,445 410,425"/><line x1="400" y1="260" x2="650" y2="260"/><polyline points="635,250 655,260 635,270"/><line x1="400" y1="260" x2="150" y2="260"/><polyline points="165,250 145,260 165,270"/></g><g font-family="Arial, sans-serif" font-size="28" fill="#111" text-anchor="middle"><text x="400" y="55" font-weight="700">N</text><text x="400" y="485" font-weight="700">S</text><text x="700" y="270" font-weight="700">L</text><text x="100" y="270" font-weight="700">O</text><rect x="315" y="215" width="170" height="90" rx="12" fill="#eee" stroke="#222"/><text x="400" y="270">Praça</text><rect x="315" y="100" width="170" height="70" rx="10" fill="#f7f7f7" stroke="#222"/><text x="400" y="145">Escola</text><rect x="535" y="225" width="170" height="70" rx="10" fill="#f7f7f7" stroke="#222"/><text x="620" y="270">Hospital</text><rect x="315" y="350" width="170" height="70" rx="10" fill="#f7f7f7" stroke="#222"/><text x="400" y="395">Parque</text><rect x="95" y="225" width="170" height="70" rx="10" fill="#f7f7f7" stroke="#222"/><text x="180" y="270">Estação</text></g></svg>