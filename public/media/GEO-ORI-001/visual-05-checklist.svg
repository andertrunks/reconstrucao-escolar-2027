<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">Checklist de análise de orientação</title><desc id="desc">Fluxograma com cinco perguntas: onde é a origem, onde aponta o norte, quais são as referências, onde está o destino e a rota muda de direção.</desc><rect width="920" height="520" fill="white"/><g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="460" y="55" font-size="32" font-weight="700">Antes de descrever a rota</text></g><g stroke="#222" stroke-width="3" fill="#f7f7f7"><rect x="45" y="150" width="150" height="95" rx="12"/><rect x="215" y="150" width="150" height="95" rx="12"/><rect x="385" y="150" width="150" height="95" rx="12"/><rect x="555" y="150" width="150" height="95" rx="12"/><rect x="725" y="150" width="150" height="95" rx="12"/></g><g font-family="Arial,sans-serif" font-size="21" fill="#111" text-anchor="middle"><text x="120" y="188"><tspan x="120">1. Onde é</tspan><tspan x="120" dy="28">a origem?</tspan></text><text x="290" y="188"><tspan x="290">2. Onde aponta</tspan><tspan x="290" dy="28">o norte?</tspan></text><text x="460" y="188"><tspan x="460">3. Quais são</tspan><tspan x="460" dy="28">as referências?</tspan></text><text x="630" y="188"><tspan x="630">4. Onde está</tspan><tspan x="630" dy="28">o destino?</tspan></text><text x="800" y="188"><tspan x="800">5. A rota muda</tspan><tspan x="800" dy="28">de direção?</tspan></text></g><g stroke="#222" stroke-width="3" fill="none"><line x1="195" y1="198" x2="215" y2="198"/><polyline points="207,190 217,198 207,206"/><line x1="365" y1="198" x2="385" y2="198"/><polyline points="377,190 387,198 377,206"/><line x1="535" y1="198" x2="555" y2="198"/><polyline points="547,190 557,198 547,206"/><line x1="705" y1="198" x2="725" y2="198"/><polyline points="717,190 727,198 717,206"/></g><g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="460" y="345" font-size="29" font-weight="700">Orientar primeiro → interpretar depois</text><text x="460" y="395" font-size="23">Esse procedimento evita confundir “cima da folha” com norte.</text></g></svg>