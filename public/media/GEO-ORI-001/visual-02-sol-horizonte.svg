<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">O nascer do Sol varia ao longo do ano</title><desc id="desc">Horizonte com três posições de nascer do Sol: ao norte do leste, no leste próximo aos equinócios e ao sul do leste. A direção leste permanece fixa.</desc><rect width="800" height="500" fill="white"/><line x1="70" y1="350" x2="730" y2="350" stroke="#222" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="400" y="405" font-size="32" font-weight="700">Leste geográfico — direção fixa</text><line x1="400" y1="330" x2="400" y2="370" stroke="#222" stroke-width="3"/><circle cx="250" cy="285" r="45" fill="none" stroke="#222" stroke-width="4"/><text x="250" y="220" font-size="24">ao norte do leste</text><circle cx="400" cy="285" r="45" fill="none" stroke="#222" stroke-width="4"/><text x="400" y="220" font-size="24">equinócios</text><circle cx="550" cy="285" r="45" fill="none" stroke="#222" stroke-width="4"/><text x="550" y="220" font-size="24">ao sul do leste</text><text x="400" y="80" font-size="32" font-weight="700">A posição do nascer muda; o leste não</text><text x="400" y="455" font-size="22">Esquema conceitual — não representa escala angular</text></g></svg>