<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" role="img" aria-labelledby="title desc"><title id="title">Croqui com norte inclinado</title><desc id="desc">Croqui de bairro com praça, escola, hospital e rio. A seta de norte aponta para o canto superior direito, mostrando que norte não coincide com o topo da folha.</desc><rect width="850" height="560" fill="white"/><g stroke="#777" stroke-width="18" fill="none"><line x1="80" y1="180" x2="770" y2="420"/><line x1="160" y1="490" x2="640" y2="80"/></g><path d="M40 430 C180 390 280 470 410 430 S650 340 810 390" fill="none" stroke="#222" stroke-width="5"/><text x="720" y="455" font-family="Arial,sans-serif" font-size="24">Rio</text><g font-family="Arial,sans-serif" font-size="25" fill="#111" text-anchor="middle"><rect x="350" y="235" width="150" height="75" rx="10" fill="#eee" stroke="#222"/><text x="425" y="282">Praça</text><rect x="205" y="145" width="150" height="70" rx="10" fill="#f8f8f8" stroke="#222"/><text x="280" y="190">Escola</text><rect x="535" y="315" width="160" height="70" rx="10" fill="#f8f8f8" stroke="#222"/><text x="615" y="360">Hospital</text></g><g stroke="#111" stroke-width="5" fill="none"><line x1="675" y1="185" x2="770" y2="90"/><polyline points="740,100 775,85 760,120"/></g><text x="790" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700">N</text><text x="425" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">Use a seta N, não o topo da folha.</text></svg>