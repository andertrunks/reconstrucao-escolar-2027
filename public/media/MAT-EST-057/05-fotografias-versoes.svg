<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title description">
<title id="title">Fotografias A e B do mesmo sandbox</title><desc id="description">O corte A conserva dois pares e seis pendências; se S04 depois for validado e cumprir critérios, outro retrato B pode ter três e cinco, sem sobrescrever A.</desc>
<rect width="1040" height="390" fill="#ffffff"/>
<text x="36" y="52" font-size="27" font-family="Arial,sans-serif" fill="#172333" font-weight="bold">Fotografias A e B do mesmo sandbox</text>
<text x="36" y="82" font-size="15" font-family="Arial,sans-serif" fill="#172333">Diagramas ilustrativos, sem dados novos da série principal</text><rect x="34" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="54" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Fotografia A</text><text x="54" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">2 elegíveis / 6 pendentes</text><text x="54" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Arquivo e regra preservados</text><text x="54" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 1 de 3</text><rect x="378" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="398" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Evento posterior</text><text x="398" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">S04 validado, condicional</text><text x="398" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Registrar versão e motivo</text><text x="398" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 2 de 3</text><rect x="722" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="742" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Fotografia B</text><text x="742" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">3 / 5 somente se elegível</text><text x="742" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Novo relatório, não edição oculta</text><text x="742" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 3 de 3</text></svg>
