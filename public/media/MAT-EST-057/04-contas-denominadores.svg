<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title description">
<title id="title">Duas métricas e seus denominadores</title><desc id="description">Somente dois cartões do sandbox possuem erros: para B, erros 4 e menos 2 dão MAE 3; para C, 3 e menos 5 dão MAE 4; custo médio 7 para ambos.</desc>
<rect width="1040" height="390" fill="#ffffff"/>
<text x="36" y="52" font-size="27" font-family="Arial,sans-serif" fill="#172333" font-weight="bold">Duas métricas e seus denominadores</text>
<text x="36" y="82" font-size="15" font-family="Arial,sans-serif" fill="#172333">Diagramas ilustrativos, sem dados novos da série principal</text><rect x="34" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="54" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">B: dois erros válidos</text><text x="54" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">Módulos 4 e 2; MAE = 3</text><text x="54" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Custos 12 e 2; média 7</text><text x="54" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 1 de 3</text><rect x="378" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="398" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">C: dois erros válidos</text><text x="398" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">Módulos 3 e 5; MAE = 4</text><text x="398" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Custos 9 e 5; média 7</text><text x="398" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 2 de 3</text><rect x="722" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="742" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Não usar oito na média</text><text x="742" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">Seis erros desconhecidos</text><text x="742" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Amostra completa não avaliada</text><text x="742" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 3 de 3</text></svg>
