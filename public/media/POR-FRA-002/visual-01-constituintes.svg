<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Oração em dois grandes constituintes</title><desc id="d">Sujeito e predicado com seus núcleos.</desc><rect x="20" y="20" width="960" height="520" rx="24" fill="white" stroke="currentColor" stroke-width="4"/><text x="500" y="80" text-anchor="middle" font-size="34" font-family="sans-serif">Os estudantes atentos resolveram o problema.</text><rect x="80" y="140" width="390" height="210" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><rect x="530" y="140" width="390" height="210" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="275" y="190" text-anchor="middle" font-size="28" font-family="sans-serif">SUJEITO</text><text x="275" y="245" text-anchor="middle" font-size="28" font-family="sans-serif">Os estudantes atentos</text><text x="275" y="305" text-anchor="middle" font-size="24" font-family="sans-serif">núcleo: estudantes</text><text x="725" y="190" text-anchor="middle" font-size="28" font-family="sans-serif">PREDICADO</text><text x="725" y="245" text-anchor="middle" font-size="28" font-family="sans-serif">resolveram o problema</text><text x="725" y="305" text-anchor="middle" font-size="24" font-family="sans-serif">núcleo verbal: resolveram</text><text x="500" y="445" text-anchor="middle" font-size="24" font-family="sans-serif">Função dos blocos, não metade visual da frase</text></svg>
