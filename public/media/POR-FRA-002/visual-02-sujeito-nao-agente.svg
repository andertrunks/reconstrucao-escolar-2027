<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Sujeito não é sinônimo de agente</title><desc id="d">Ação, estado e construção passiva preservam a função sujeito.</desc><rect x="20" y="20" width="960" height="520" rx="24" fill="white" stroke="currentColor" stroke-width="4"/><text x="500" y="75" text-anchor="middle" font-size="32" font-family="sans-serif">SUJEITO ≠ “quem pratica a ação”</text><text x="110" y="160" font-size="27" font-family="sans-serif">1. O atleta correu.</text><text x="110" y="205" font-size="22" font-family="sans-serif">sujeito: O atleta — ação</text><text x="110" y="285" font-size="27" font-family="sans-serif">2. A cidade está silenciosa.</text><text x="110" y="330" font-size="22" font-family="sans-serif">sujeito: A cidade — estado/característica</text><text x="110" y="410" font-size="27" font-family="sans-serif">3. A janela foi quebrada pelo vento.</text><text x="110" y="455" font-size="22" font-family="sans-serif">sujeito: A janela — sofre a ação</text></svg>
