<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Ordem direta e sujeito posposto</title><desc id="d">Mesmo sujeito aparece antes ou depois do verbo.</desc><rect x="20" y="20" width="960" height="520" rx="24" fill="white" stroke="currentColor" stroke-width="4"/><text x="500" y="75" text-anchor="middle" font-size="32" font-family="sans-serif">A posição pode mudar</text><text x="150" y="175" font-size="30" font-family="sans-serif">Os convidados → chegaram.</text><text x="150" y="245" font-size="22" font-family="sans-serif">sujeito antes do verbo</text><text x="150" y="345" font-size="30" font-family="sans-serif">Chegaram ← os convidados.</text><text x="150" y="415" font-size="22" font-family="sans-serif">sujeito depois do verbo</text><text x="500" y="495" text-anchor="middle" font-size="24" font-family="sans-serif">A concordância plural continua sendo uma pista da relação.</text></svg>
