<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Sujeito simples e composto</title><desc id="d">Comparação pela quantidade de núcleos.</desc><rect x="20" y="20" width="960" height="520" rx="24" fill="white" stroke="currentColor" stroke-width="4"/><text x="500" y="75" text-anchor="middle" font-size="32" font-family="sans-serif">Conte núcleos, não palavras</text><rect x="70" y="130" width="400" height="260" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="270" y="180" text-anchor="middle" font-size="28" font-family="sans-serif">SUJEITO SIMPLES</text><text x="270" y="240" text-anchor="middle" font-size="25" font-family="sans-serif">Os alunos da manhã</text><text x="270" y="295" text-anchor="middle" font-size="23" font-family="sans-serif">1 núcleo: alunos</text><rect x="530" y="130" width="400" height="260" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="730" y="180" text-anchor="middle" font-size="28" font-family="sans-serif">SUJEITO COMPOSTO</text><text x="730" y="240" text-anchor="middle" font-size="25" font-family="sans-serif">Ana e Paulo</text><text x="730" y="295" text-anchor="middle" font-size="23" font-family="sans-serif">2 núcleos: Ana + Paulo</text><text x="500" y="460" text-anchor="middle" font-size="24" font-family="sans-serif">Comprimento do grupo não define a classificação.</text></svg>
