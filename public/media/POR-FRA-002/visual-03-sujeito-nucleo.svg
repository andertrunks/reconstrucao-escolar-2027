<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Sujeito completo e núcleo</title><desc id="d">O núcleo prédios dentro do sujeito completo.</desc><rect x="20" y="20" width="960" height="520" rx="24" fill="white" stroke="currentColor" stroke-width="4"/><text x="500" y="80" text-anchor="middle" font-size="32" font-family="sans-serif">Os dois antigos prédios da praça foram restaurados.</text><rect x="80" y="150" width="630" height="210" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="395" y="205" text-anchor="middle" font-size="26" font-family="sans-serif">SUJEITO COMPLETO</text><text x="395" y="260" text-anchor="middle" font-size="28" font-family="sans-serif">Os dois antigos [prédios] da praça</text><text x="395" y="315" text-anchor="middle" font-size="24" font-family="sans-serif">núcleo = prédios</text><text x="500" y="455" text-anchor="middle" font-size="24" font-family="sans-serif">Muitas palavras podem acompanhar um único núcleo.</text></svg>
