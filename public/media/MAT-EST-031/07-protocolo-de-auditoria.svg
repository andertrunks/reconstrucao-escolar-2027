<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Rota da avaliação preditiva</title><desc id="d">Cinco etapas: objetivo, divisão, pipeline nos folds, escolha, teste final e relatório.</desc><rect width="1000" height="400" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#162c43} .h{font-size:25px;font-weight:bold} .txt{font-size:20px} .sm{font-size:17px} .box{stroke:#284b63;stroke-width:2} .axis{stroke:#33485c;stroke-width:2}</style><text x="38" y="45" class="h" text-anchor="start">Rota da avaliação preditiva</text><rect x="26" y="143" width="179" height="107" rx="9" fill="#e3eef6" stroke="#284b63" stroke-width="2"/><text x="116" y="175" class="txt" text-anchor="middle">1.</text><text x="116" y="202" class="sm" text-anchor="middle">Pergunta e</text><text x="116" y="227" class="sm" text-anchor="middle">métrica</text><text x="208" y="208" class="sm" text-anchor="start">→</text><rect x="223" y="143" width="179" height="107" rx="9" fill="#e3eef6" stroke="#284b63" stroke-width="2"/><text x="313" y="175" class="txt" text-anchor="middle">2.</text><text x="313" y="202" class="sm" text-anchor="middle">Partição</text><text x="313" y="227" class="sm" text-anchor="middle">correta</text><text x="405" y="208" class="sm" text-anchor="start">→</text><rect x="420" y="143" width="179" height="107" rx="9" fill="#e3eef6" stroke="#284b63" stroke-width="2"/><text x="510" y="175" class="txt" text-anchor="middle">3.</text><text x="510" y="202" class="sm" text-anchor="middle">Pipeline nos</text><text x="510" y="227" class="sm" text-anchor="middle">folds</text><text x="602" y="208" class="sm" text-anchor="start">→</text><rect x="617" y="143" width="179" height="107" rx="9" fill="#e3eef6" stroke="#284b63" stroke-width="2"/><text x="707" y="175" class="txt" text-anchor="middle">4.</text><text x="707" y="202" class="sm" text-anchor="middle">Escolha do</text><text x="707" y="227" class="sm" text-anchor="middle">modelo</text><text x="799" y="208" class="sm" text-anchor="start">→</text><rect x="814" y="143" width="179" height="107" rx="9" fill="#f1e5d1" stroke="#284b63" stroke-width="2"/><text x="904" y="175" class="txt" text-anchor="middle">5.</text><text x="904" y="202" class="sm" text-anchor="middle">Teste final</text><text x="904" y="227" class="sm" text-anchor="middle">e relato</text><text x="45" y="342" class="sm" text-anchor="start">O teste não orienta alterações repetidas do modelo.</text></svg>