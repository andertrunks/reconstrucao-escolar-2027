<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d"><title id="t">Tabela da tarifa C(d)=8+3d</title><desc id="d">Para distâncias zero, um, dois e três quilômetros, custos oito, onze, quatorze e dezessete reais. Os quatro pares obedecem à mesma regra.</desc><rect width="820" height="300" rx="12" fill="#f8fbff"/><text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#163a5a">Tabela da tarifa C(d)=8+3d</text><rect x="50" y="58" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="62" y="100" font-family="sans-serif" font-size="20">d=0 ; C=8</text><rect x="420" y="58" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="432" y="100" font-family="sans-serif" font-size="20">d=1 ; C=11</text><rect x="50" y="146" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="62" y="188" font-family="sans-serif" font-size="20">d=2 ; C=14</text><rect x="420" y="146" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="432" y="188" font-family="sans-serif" font-size="20">d=3 ; C=17</text><text x="20" y="289" font-family="sans-serif" font-size="14" fill="#476077">Reconstrução Escolar · MAT-FUN-001</text></svg>