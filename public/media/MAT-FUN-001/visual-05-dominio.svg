<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">DOMÍNIO, CONTRADOMÍNIO E IMAGEM</title><desc id="desc">DOMÍNIO, CONTRADOMÍNIO E IMAGEM. O conjunto de entradas difere do de saídas. Domínio. Entradas permitidas do exemplo:. zero, um e dois.. D = {0,1,2}. Não inclua entradas extras. Regra. Dobre cada entrada x.. 0 → 0; 1 → 2; 2 → 4.. f(x) = 2x. Uma saída para cada entrada. Contradomínio. Conjunto de chegada declarado:. zero, um, dois, três, quatro, cinco.. B = {0,1,2,3,4,5}. Nem todos são atingidos. Imagem. Saídas realmente obtidas:. zero, dois e quatro.. Im(f) = {0,2,4}. Conjunto efetivo. Relação. Toda saída obtida pertence. ao contradomínio.. Im(f) ⊆ B. A inclusão pode ser própria. Síntese. Domínio: valores de entrada.. Imagem: resultados da regra.. D → Im(f) ⊆ B. Conjuntos têm papéis diferentes</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">DOMÍNIO, CONTRADOMÍNIO E IMAGEM</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">O conjunto de entradas difere do de saídas</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-fam