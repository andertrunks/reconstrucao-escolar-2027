<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d"><title id="t">Domínio, contradomínio e imagem</title><desc id="d">Entradas zero um dois são dobradas, produzindo saídas zero dois quatro dentro do conjunto de chegada de zero a cinco. A imagem é subconjunto do contradomínio.</desc><rect width="820" height="300" rx="12" fill="#f8fbff"/><text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#163a5a">Domínio, contradomínio e imagem</text><rect x="50" y="58" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="62" y="100" font-family="sans-serif" font-size="20">A={0,1,2}</text><rect x="420" y="58" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="432" y="100" font-family="sans-serif" font-size="20">f(x)=2x</text><rect x="50" y="146" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="62" y="188" font-family="sans-serif" font-size="20">Im={0,2,4}</text><rect x="420" y="146" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="432" y="188" font-family="sans-serif" font-size="20">B={0,1,2,3,4,5}</text><text x="20" y="289" font-family="sans-serif" font-size="14" fill="#476077">Reconstrução Escolar · MAT-FUN-001</text></svg>