<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d"><title id="t">Função e não função</title><desc id="d">No exemplo válido entradas um e dois levam à saída cinco. No inválido entrada um leva a quatro e seis. Saída repetida é permitida; duas saídas distintas da mesma entrada não.</desc><rect width="820" height="300" rx="12" fill="#f8fbff"/><text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#163a5a">Função e não função</text><rect x="56" y="85" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="68" y="127" font-family="sans-serif" font-size="20">FUNÇÃO: 1→5 e 2→5</text><rect x="423" y="85" width="335" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="435" y="127" font-family="sans-serif" font-size="20">NÃO FUNÇÃO: 1→4 e 1→6</text><text x="20" y="289" font-family="sans-serif" font-size="14" fill="#476077">Reconstrução Escolar · MAT-FUN-001</text></svg>