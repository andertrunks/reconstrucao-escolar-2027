<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d"><title id="t">Gráfico inicial: custo e distância</title><desc id="d">Eixo horizontal distância em quilômetros e vertical custo em reais; pontos zero oito, um onze, dois quatorze, três dezessete. O custo cresce três reais por quilômetro e já é oito em distância zero.</desc><rect width="820" height="300" rx="12" fill="#f8fbff"/><text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#163a5a">Gráfico inicial: custo e distância</text><path d="M95 245H760M95 245V60" stroke="#23354a" stroke-width="3"/><path d="M115 205L278 169L441 133L604 97" stroke="#166093" stroke-width="4" fill="none"/><circle cx="115" cy="205" r="7" fill="#115d96"/><text x="124" y="196" font-size="18">(0,8)</text><circle cx="278" cy="169" r="7" fill="#115d96"/><text x="287" y="160" font-size="18">(1,11)</text><circle cx="441" cy="133" r="7" fill="#115d96"/><text x="450" y="124" font-size="18">(2,14)</text><circle cx="604" cy="97" r="7" fill="#115d96"/><text x="613" y="88" font-size="18">(3,17)</text><text x="710" y="273" font-size="17">d (km)</text><text x="96" y="53" font-size="17">C (R$)</text><text x="20" y="289" font-family="sans-serif" font-size="14" fill="#476077">Reconstrução Escolar · MAT-FUN-001</text></svg>