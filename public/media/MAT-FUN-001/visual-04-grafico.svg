<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">GRÁFICO DE UMA TARIFA</title><desc id="desc">GRÁFICO DE UMA TARIFA. Distância em km; custo em reais. A regra. Há oito reais iniciais.. Acrescente três por km.. C(d) = 8 + 3d. Unidades: km e R$. Pares. Observe (0,8) e (1,11).. Também (2,14) e (3,17).. (d,C). Sempre entrada antes da saída. Inclinação. Um km a mais provoca. três reais de acréscimo.. 3 R$/km. Taxa constante. Pontos no gráfico. . . . . Valor inicial. O ponto (0,8) é o início.. A reta não passa na origem.. C(0) = 8. Cobrança fixa. Conclusão. Gráfico e tabela concordam.. O contexto usa d ≥ 0.. C cresce com d. Respeite domínio e escala</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">GRÁFICO DE UMA TARIFA</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Distância em km; custo em reais</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">A regra</text><text x="46" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif"