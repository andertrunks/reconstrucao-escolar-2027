<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d"><title id="t">Função como entrada, regra e saída</title><desc id="d">Entrada três, regra duas vezes a entrada mais um, saída sete. A função produz uma saída determinada para a entrada escolhida.</desc><rect width="820" height="300" rx="12" fill="#f8fbff"/><text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#163a5a">Função como entrada, regra e saída</text><rect x="40" y="85" width="220" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="52" y="127" font-family="sans-serif" font-size="20">Entrada x=3</text><rect x="295" y="85" width="220" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="307" y="127" font-family="sans-serif" font-size="20">Regra: 2x+1</text><rect x="550" y="85" width="220" height="70" rx="12" fill="#e6f1fa" stroke="#2b587f"/><text x="562" y="127" font-family="sans-serif" font-size="20">Saída y=7</text><text x="20" y="289" font-family="sans-serif" font-size="14" fill="#476077">Reconstrução Escolar · MAT-FUN-001</text></svg>