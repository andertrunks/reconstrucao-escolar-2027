<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">FUNÇÕES CONSTANTES: TRÊS POSSIBILIDADES</title><desc id="desc">Quando a=0, a fórmula −b/a não pode ser aplicada</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)" /><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="41" font-weight="700" fill="#fff">FUNÇÕES CONSTANTES: TRÊS POSSIBILIDADES</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Quando a=0, a fórmula −b/a não pode ser aplicada</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb" /><rect x="20" y="186" width="508" height="18" rx="0" fill="#075bbb" /><circle cx="54" cy="172" r="24" fill="#fff" opacity=".22"/><text x="54" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="95" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Coeficiente a=0</text><text x="43" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Uma função constante tem f(x)=b.</text><text x="43" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Não varia quando x muda.</text><text x="43" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">O gráfico é horizontal.</text><rect x="41" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="274" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">a = 0</text><text x="43" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Dividir por zero não é permitido.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#078a55" /><rect x="546" y="186" width="508" height="18" rx="0" fill="#078a55" /><circle cx="580" cy="172" r="24" fill="#fff" opacity=".22"/><text x="580" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="621" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Constante positiva</text><text x="569" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">f(x) = 5.</text><text x="569" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Em qualquer x permitido, f=5.</text><text x="569" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">A função nunca chega a zero.</text><rect x="567" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="800" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">Nenhuma raiz</text><text x="569" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">Sempre positiva.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#ec7616" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#ec7616" /><rect x="1072" y="186" width="508" height="18" rx="0" fill="#ec7616" /><circle cx="1106" cy="172" r="24" fill="#fff" opacity=".22"/><text x="1106" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1147" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Constante negativa</text><text x="1095" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">g(x) = −3.</text><text x="1095" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Em qualquer x permitido, g=−3.</text><text x="1095" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Também nunca chega a zero.</text><rect x="1093" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="1326" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">Nenhuma raiz</text><text x="1095" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ec7616">Sempre negativa.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ebff" stroke="#853ec9" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#853ec9" /><rect x="20" y="566" width="508" height="18" rx="0" fill="#853ec9" /><circle cx="54" cy="552" r="24" fill="#fff" opacity=".22"/><text x="54" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="95" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Constante nula</text><text x="43" y="631" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">h(x) = 0.</text><text x="43" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Toda entrada produz zero.</text><text x="43" y="701" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Todos os x do domínio são raízes.</text><rect x="41" y="745" width="466" height="70" rx="11" fill="#fff" /><text x="274" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#1a3052">Infinitos zeros nos reais</text><text x="43" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#853ec9">Domínio contextual pode restringir.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffedf0" stroke="#d63851" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#d63851" /><rect x="546" y="566" width="508" height="18" rx="0" fill="#d63851" /><circle cx="580" cy="552" r="24" fill="#fff" opacity=".22"/><text x="580" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="621" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Gráfico das três</text><text x="569" y="630" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#182e4a">Azul: 5; vermelho: −3; verde: 0.</text><rect x="568" y="645" width="464" height="190" rx="10" fill="#fff" stroke="#cfdbeb" stroke-width="2"/><line x1="616" y1="667" x2="616" y2="796" stroke="#435b74" stroke-width="2" /><line x1="616" y1="796" x2="1013" y2="796" stroke="#435b74" stroke-width="2" /><line x1="616" y1="742.25" x2="1013" y2="742.25" stroke="#9aacc4" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="814.5" y1="667" x2="814.5" y2="796" stroke="#9aacc4" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="616" y1="796" x2="616" y2="800" stroke="#566981" stroke-width="1" /><text x="616" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">-3</text><line x1="814.5" y1="796" x2="814.5" y2="800" stroke="#566981" stroke-width="1" /><text x="814.5" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">0</text><line x1="1013" y1="796" x2="1013" y2="800" stroke="#566981" stroke-width="1" /><text x="1013" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">3</text><line x1="611" y1="796" x2="616" y2="796" stroke="#566981" stroke-width="1" /><text x="607" y="801" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">-5</text><line x1="611" y1="774.5" x2="616" y2="774.5" stroke="#566981" stroke-width="1" /><text x="607" y="779.5" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">-3</text><line x1="611" y1="742.25" x2="616" y2="742.25" stroke="#566981" stroke-width="1" /><text x="607" y="747.25" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">0</text><line x1="611" y1="688.5" x2="616" y2="688.5" stroke="#566981" stroke-width="1" /><text x="607" y="693.5" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">5</text><line x1="611" y1="667" x2="616" y2="667" stroke="#566981" stroke-width="1" /><text x="607" y="672" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">7</text><text x="1021" y="802" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#31465e">x</text><text x="608" y="660" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#31465e">y</text><polyline points="616.0,688.5 1013.0,688.5" fill="none" stroke="#075bbb" stroke-width="4" /><polyline points="616.0,774.5 1013.0,774.5" fill="none" stroke="#d63851" stroke-width="4" /><polyline points="616.0,742.3 1013.0,742.3" fill="none" stroke="#078a55" stroke-width="4" /><text x="568" y="864" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#d63851">Todas são retas horizontais.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e8f9fa" stroke="#07889b" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#07889b" /><rect x="1072" y="566" width="508" height="18" rx="0" fill="#07889b" /><circle cx="1106" cy="552" r="24" fill="#fff" opacity=".22"/><text x="1106" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1147" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Critério de escolha</text><text x="1095" y="631" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Se a=0, olhe o valor b.</text><text x="1095" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Se b≠0, não há raiz.</text><text x="1095" y="701" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Se b=0, todo x admitido é zero.</text><rect x="1093" y="745" width="466" height="70" rx="11" fill="#fff" /><text x="1326" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">a=0: classifique b</text><text x="1095" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#07889b">Não use −b/a neste caso.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073566" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">Com a=0, não existe divisão por a; a constante decide os zeros.</text></svg>