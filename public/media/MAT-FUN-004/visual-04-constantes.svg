<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Funções constantes: nenhum zero ou todos os zeros</title><desc id="desc">Três quadros: f(x)=5 é sempre positiva sem zero; g(x)=−3 sempre negativa sem zero; h(x)=0 nula para todas as entradas. Quando a é zero, não use a fórmula −b/a; classifique a constante.</desc><rect width="820" height="370" rx="13" fill="#f8fbff"/><text x="24" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#173853">Funções constantes: nenhum zero ou todos os zeros</text><rect x="50" y="66" width="205" height="225" fill="#e2effa" rx="13"/><rect x="310" y="66" width="205" height="225" fill="#e2effa" rx="13"/><rect x="570" y="66" width="205" height="225" fill="#e2effa" rx="13"/><text x="75" y="106" font-size="21">f(x)=5</text><text x="75" y="170" font-size="16">nenhuma raiz</text><text x="336" y="106" font-size="21">g(x)=−3</text><text x="336" y="170" font-size="16">nenhuma raiz</text><text x="593" y="106" font-size="21">h(x)=0</text><text x="593" y="170" font-size="16">todas entradas</text><text x="72" y="259" font-size="15">sempre positivo</text><text x="332" y="259" font-size="15">sempre negativo</text><text x="598" y="259" font-size="15">sempre zero</text><text x="24" y="350" fill="#456073" font-family="sans-serif" font-size="13">Reconstrução Escolar · MAT-FUN-004 · representação autoral</text></svg>