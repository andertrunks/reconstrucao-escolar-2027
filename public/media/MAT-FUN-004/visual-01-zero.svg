<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">A raiz é a interseção com o eixo horizontal</title><desc id="desc">Reta de f(x)=2x−6; interseção horizontal (3,0) e interseção vertical (0,−6). Zero da função é entrada x=3, não o ponto vertical (0,−6).</desc><rect width="820" height="370" rx="13" fill="#f8fbff"/><text x="24" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#173853">A raiz é a interseção com o eixo horizontal</text><line x1="315" y1="214" x2="699" y2="214" stroke="#283d56" stroke-width="2.5"/><line x1="315" y1="334" x2="315" y2="94" stroke="#283d56" stroke-width="2.5"/><text x="379" y="231" text-anchor="middle" font-size="13">1</text><text x="443" y="231" text-anchor="middle" font-size="13">2</text><text x="507" y="231" text-anchor="middle" font-size="13">3</text><text x="571" y="231" text-anchor="middle" font-size="13">4</text><text x="635" y="231" text-anchor="middle" font-size="13">5</text><text x="699" y="231" text-anchor="middle" font-size="13">6</text><text x="307" y="338" text-anchor="end" font-size="13">-6</text><text x="307" y="298" text-anchor="end" font-size="13">-4</text><text x="307" y="258" text-anchor="end" font-size="13">-2</text><text x="307" y="178" text-anchor="end" font-size="13">2</text><text x="307" y="138" text-anchor="end" font-size="13">4</text><text x="307" y="98" text-anchor="end" font-size="13">6</text><text x="705" y="217" font-size="16">x</text><text x="322" y="90" font-size="16">f(x)</text><text x="307" y="231" font-size="13">0</text><path d="M315 334 L699 94" fill="none" stroke="#1b689a" stroke-width="4"/><circle cx="315" cy="334" r="7" fill="#144b7d"/><text x="324" y="323" font-size="17">(0,−6)</text><circle cx="507" cy="214" r="7" fill="#144b7d"/><text x="516" y="203" font-size="17">(3,0)</text><text x="25" y="86" font-size="19">f(x)=2x−6</text><text x="25" y="122