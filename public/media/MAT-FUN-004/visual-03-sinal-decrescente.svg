<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">ESTUDO DOS SINAIS: RETA DECRESCENTE</title><desc id="desc">Em g(x)=−3x+6, a ordem dos sinais se inverte: positivo, zero, negativo</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)" /><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="41" font-weight="700" fill="#fff">ESTUDO DOS SINAIS: RETA DECRESCENTE</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Em g(x)=−3x+6, a ordem dos sinais se inverte: positivo, zero, negativo</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb" /><rect x="20" y="186" width="508" height="18" rx="0" fill="#075bbb" /><circle cx="54" cy="172" r="24" fill="#fff" opacity=".22"/><text x="54" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="95" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">A função</text><text x="43" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">g(x) = −3x + 6.</text><text x="43" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">O coeficiente a=−3 é negativo.</text><text x="43" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Assim, a reta decresce.</text><rect x="41" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="274" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">a = −3 &lt; 0</text><text x="43" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Desce da esquerda para a direita.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#078a55" /><rect x="546" y="186" width="508" height="18" rx="0" fill="#078a55" /><circle cx="580" cy="172" r="24" fill="#fff" opacity=".22"/><text x="580" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="621" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Encontre o zero</text><text x="569" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">−3x + 6 = 0.</text><text x="569" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">−3x = −6.</text><text x="569" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">x = 2.</text><rect x="567" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="800" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">Raiz: x = 2</text><text x="569" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">Verifique g(2)=0.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#ec7616" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#ec7616" /><rect x="1072" y="186" width="508" height="18" rx="0" fill="#ec7616" /><circle cx="1106" cy="172" r="24" fill="#fff" opacity=".22"/><text x="1106" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1147" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Antes da raiz</text><text x="1095" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Se x&lt;2, g(x)&gt;0.</text><text x="1095" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Exemplo: x=1.</text><text x="1095" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">g(1)=−3+6=3.</text><rect x="1093" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="1326" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">x &lt; 2  ⇒  g(x) &gt; 0</text><text x="1095" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ec7616">Acima do eixo horizontal.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ebff" stroke="#853ec9" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#853ec9" /><rect x="20" y="566" width="508" height="18" rx="0" fill="#853ec9" /><circle cx="54" cy="552" r="24" fill="#fff" opacity=".22"/><text x="54" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="95" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Depois da raiz</text><text x="43" y="631" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Se x&gt;2, g(x)&lt;0.</text><text x="43" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Exemplo: x=3.</text><text x="43" y="701" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">g(3)=−9+6=−3.</text><rect x="41" y="745" width="466" height="70" rx="11" fill="#fff" /><text x="274" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">x &gt; 2  ⇒  g(x) &lt; 0</text><text x="43" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#853ec9">Abaixo do eixo horizontal.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffedf0" stroke="#d63851" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#d63851" /><rect x="546" y="566" width="508" height="18" rx="0" fill="#d63851" /><circle cx="580" cy="552" r="24" fill="#fff" opacity=".22"/><text x="580" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="621" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Gráfico e sinais</text><text x="569" y="630" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#182e4a">Vermelho: reta decrescente.</text><rect x="568" y="645" width="464" height="190" rx="10" fill="#fff" stroke="#cfdbeb" stroke-width="2"/><line x1="616" y1="667" x2="616" y2="796" stroke="#435b74" stroke-width="2" /><line x1="616" y1="796" x2="1013" y2="796" stroke="#435b74" stroke-width="2" /><line x1="616" y1="731.5" x2="1013" y2="731.5" stroke="#9aacc4" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="616" y1="796" x2="616" y2="800" stroke="#566981" stroke-width="1" /><text x="616" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">0</text><line x1="715.25" y1="796" x2="715.25" y2="800" stroke="#566981" stroke-width="1" /><text x="715.25" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">1</text><line x1="814.5" y1="796" x2="814.5" y2="800" stroke="#566981" stroke-width="1" /><text x="814.5" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">2</text><line x1="913.75" y1="796" x2="913.75" y2="800" stroke="#566981" stroke-width="1" /><text x="913.75" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">3</text><line x1="1013" y1="796" x2="1013" y2="800" stroke="#566981" stroke-width="1" /><text x="1013" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">4</text><line x1="611" y1="796" x2="616" y2="796" stroke="#566981" stroke-width="1" /><text x="607" y="801" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">-6</text><line x1="611" y1="731.5" x2="616" y2="731.5" stroke="#566981" stroke-width="1" /><text x="607" y="736.5" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">0</text><line x1="611" y1="667" x2="616" y2="667" stroke="#566981" stroke-width="1" /><text x="607" y="672" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">6</text><text x="1021" y="802" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#31465e">x</text><text x="608" y="660" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#31465e">g(x)</text><polyline points="616.0,667.0 1013.0,796.0" fill="none" stroke="#d63851" stroke-width="4" /><circle cx="715.25" cy="699.25" r="5.1" fill="#d63851" stroke="#fff" stroke-width="1.2"/><circle cx="913.75" cy="763.75" r="5.1" fill="#d63851" stroke="#fff" stroke-width="1.2"/><circle cx="814.5" cy="731.5" r="6.5" fill="#1c2e49" stroke="#fff" stroke-width="1.5"/><text x="823.5" y="721.5" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#1b3150">zero: 2</text><text x="568" y="864" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#d63851">Sinal invertido no x=2.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e8f9fa" stroke="#07889b" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#07889b" /><rect x="1072" y="566" width="508" height="18" rx="0" fill="#07889b" /><circle cx="1106" cy="552" r="24" fill="#fff" opacity=".22"/><text x="1106" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1147" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Resumo de sinais</text><text x="1095" y="631" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Positivo à esquerda de 2.</text><text x="1095" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Igual a zero em 2.</text><text x="1095" y="701" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Negativo à direita de 2.</text><rect x="1093" y="745" width="466" height="70" rx="11" fill="#fff" /><text x="1326" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">+  |  0  |  −</text><text x="1095" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#07889b">Vale no domínio real.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073566" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">Quando a&lt;0, o sinal passa de positivo a negativo na raiz.</text></svg>