<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Sinal quando a função decresce</title><desc id="desc">Reta decrescente g(x)=−3x+6; raiz 2; positiva à esquerda e negativa à direita. Para a negativo, a ordem dos sinais se inverte em relação ao caso crescente.</desc><rect width="820" height="370" rx="13" fill="#f8fbff"/><text x="24" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#173853">Sinal quando a função decresce</text><line x1="337" y1="210" x2="697" y2="210" stroke="#283d56" stroke-width="2.5"/><line x1="337" y1="324" x2="337" y2="96" stroke="#283d56" stroke-width="2.5"/><text x="427" y="227" text-anchor="middle" font-size="13">1</text><text x="517" y="227" text-anchor="middle" font-size="13">2</text><text x="607" y="227" text-anchor="middle" font-size="13">3</text><text x="697" y="227" text-anchor="middle" font-size="13">4</text><text x="329" y="328" text-anchor="end" font-size="13">-6</text><text x="329" y="290" text-anchor="end" font-size="13">-4</text><text x="329" y="252" text-anchor="end" font-size="13">-2</text><text x="329" y="176" text-anchor="end" font-size="13">2</text><text x="329" y="138" text-anchor="end" font-size="13">4</text><text x="329" y="100" text-anchor="end" font-size="13">6</text><text x="703" y="213" font-size="16">x</text><text x="344" y="92" font-size="16">f(x)</text><text x="329" y="227" font-size="13">0</text><path d="M337 96 L697 324" fill="none" stroke="#1b689a" stroke-width="4"/><circle cx="337" cy="96" r="7" fill="#144b7d"/><text x="346" y="85" font-size="17">(0,6)</text><circle cx="517" cy="210" r="7" fill="#144b7d"/><text x="526" y="199" font-size="17">(2,0)</text><circle cx="697" cy="324" r="7" fill="#144b7d"/><text x="706" y="313" font-size="17">(4,−6)</text><text x="30" y="101" font-size="19">a=−3 (negativo)</text><text x="30" y="137" font-size="17">x&lt;2 : positivo</text><text x="30" y="173" font-size="17">x&gt;2 : negativo</text><text x="24" y="350" fill="#456073" font-family="sans-serif" font-size="13">Reconstrução Escolar · MAT-FUN-004 · representação autoral</text></svg>