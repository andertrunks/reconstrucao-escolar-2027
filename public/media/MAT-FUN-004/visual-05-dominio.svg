<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Raiz formal fora do domínio contextual</title><desc id="desc">Gráfico da função C(d) igual a dez mais duas vezes d para d maior ou igual a zero. São representados os pontos zero dez e dois quatorze, ambos acima do eixo horizontal. A raiz algébrica menos cinco está fora do domínio válido.</desc><rect width="820" height="370" rx="13" fill="#f8fbff"/><text x="24" y="33" font-family="sans-serif" font-size="22" font-weight="bold" fill="#173853">Raiz formal fora do domínio contextual</text>
