<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">RAIZ ALGÉBRICA FORA DO DOMÍNIO</title><desc id="desc">Uma solução formal de C(d)=0 pode não ser uma distância possível</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)" /><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="41" font-weight="700" fill="#fff">RAIZ ALGÉBRICA FORA DO DOMÍNIO</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Uma solução formal de C(d)=0 pode não ser uma distância possível</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb" /><rect x="20" y="186" width="508" height="18" rx="0" fill="#075bbb" /><circle cx="54" cy="172" r="24" fill="#fff" opacity=".22"/><text x="54" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="95" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">O modelo</text><text x="43" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">C(d) = 10 + 2d, em reais.</text><text x="43" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">d representa quilômetros.</text><text x="43" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Somente d ≥ 0 é permitido.</text><rect x="41" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="274" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">Domínio: d ≥ 0 km</text><text x="43" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Não admite distância negativa.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#078a55" /><rect x="546" y="186" width="508" height="18" rx="0" fill="#078a55" /><circle cx="580" cy="172" r="24" fill="#fff" opacity=".22"/><text x="580" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="621" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Raiz formal</text><text x="569" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">10 + 2d = 0.</text><text x="569" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">2d = −10.</text><text x="569" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">d = −5 quilômetros.</text><rect x="567" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="800" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">d = −5</text><text x="569" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">Cálculo algébrico correto.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#ec7616" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#ec7616" /><rect x="1072" y="186" width="508" height="18" rx="0" fill="#ec7616" /><circle cx="1106" cy="172" r="24" fill="#fff" opacity=".22"/><text x="1106" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1147" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Por que não serve?</text><text x="1095" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">−5 está fora do domínio.</text><text x="1095" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Distância percorrida não é negativa.</text><text x="1095" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Não há custo zero permitido.</text><rect x="1093" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="1326" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">d ≥ 0  e  d ≠ −5</text><text x="1095" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ec7616">Modelo exige interpretação.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ebff" stroke="#853ec9" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#853ec9" /><rect x="20" y="566" width="508" height="18" rx="0" fill="#853ec9" /><circle cx="54" cy="552" r="24" fill="#fff" opacity=".22"/><text x="54" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="95" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Exemplos válidos</text><text x="43" y="631" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Em d=0, C=R$ 10.</text><text x="43" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Em d=2, C=R$ 14.</text><text x="43" y="701" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Em d=5, C=R$ 20.</text><rect x="41" y="745" width="466" height="70" rx="11" fill="#fff" /><text x="274" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">C(d) &gt; 0 se d ≥ 0</text><text x="43" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#853ec9">Custo sempre positivo.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffedf0" stroke="#d63851" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#d63851" /><rect x="546" y="566" width="508" height="18" rx="0" fill="#d63851" /><circle cx="580" cy="552" r="24" fill="#fff" opacity=".22"/><text x="580" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="621" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Veja o gráfico</text><text x="569" y="630" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#182e4a">Azul: domínio válido; vermelho: extensão.</text><rect x="568" y="645" width="464" height="190" rx="10" fill="#fff" stroke="#cfdbeb" stroke-width="2"/><line x1="616" y1="667" x2="616" y2="796" stroke="#435b74" stroke-width="2" /><line x1="616" y1="796" x2="1013" y2="796" stroke="#435b74" stroke-width="2" /><line x1="616" y1="781.1153846153846" x2="1013" y2="781.1153846153846" stroke="#9aacc4" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="832.5454545454545" y1="667" x2="832.5454545454545" y2="796" stroke="#9aacc4" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="652.0909090909091" y1="796" x2="652.0909090909091" y2="800" stroke="#566981" stroke-width="1" /><text x="652.0909090909091" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">-5</text><line x1="832.5454545454545" y1="796" x2="832.5454545454545" y2="800" stroke="#566981" stroke-width="1" /><text x="832.5454545454545" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">0</text><line x1="904.7272727272727" y1="796" x2="904.7272727272727" y2="800" stroke="#566981" stroke-width="1" /><text x="904.7272727272727" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">2</text><line x1="1013" y1="796" x2="1013" y2="800" stroke="#566981" stroke-width="1" /><text x="1013" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">5</text><line x1="611" y1="781.1153846153846" x2="616" y2="781.1153846153846" stroke="#566981" stroke-width="1" /><text x="607" y="786.1153846153846" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">0</text><line x1="611" y1="731.5" x2="616" y2="731.5" stroke="#566981" stroke-width="1" /><text x="607" y="736.5" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">10</text><line x1="611" y1="681.8846153846154" x2="616" y2="681.8846153846154" stroke="#566981" stroke-width="1" /><text x="607" y="686.8846153846154" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">20</text><text x="1021" y="802" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#31465e">d (km)</text><text x="608" y="660" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#31465e">R$</text><polyline points="652.1,781.1 832.5,731.5" fill="none" stroke="#d63851" stroke-width="4" stroke-dasharray="7 5"/><circle cx="652.0909090909091" cy="781.1153846153846" r="6" fill="#fff" stroke="#d63851" stroke-width="2.4"/><polyline points="832.5,731.5 1013.0,681.9" fill="none" stroke="#075bbb" stroke-width="4" /><circle cx="832.5454545454545" cy="731.5" r="5.5" fill="#075bbb" stroke="#fff" stroke-width="1.2"/><text x="568" y="864" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#d63851">Tracejado negativo não pertence ao domínio.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e8f9fa" stroke="#07889b" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#07889b" /><rect x="1072" y="566" width="508" height="18" rx="0" fill="#07889b" /><circle cx="1106" cy="552" r="24" fill="#fff" opacity=".22"/><text x="1106" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1147" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Conclusão correta</text><text x="1095" y="631" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">A reta completa teria raiz −5.</text><text x="1095" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">O modelo só aceita d ≥ 0.</text><text x="1095" y="701" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Portanto não há zero admissível.</text><rect x="1093" y="745" width="466" height="70" rx="11" fill="#fff" /><text x="1326" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#1a3052">Sem raiz no domínio</text><text x="1095" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#07889b">Sempre confira as entradas permitidas.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073566" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">Resolver a igualdade não basta: a raiz precisa pertencer ao domínio.</text></svg>