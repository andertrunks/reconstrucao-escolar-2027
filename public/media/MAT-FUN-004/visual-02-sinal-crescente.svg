<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Sinal quando a função cresce</title><desc id="desc">Reta crescente f(x)=2x−6 cruzando o eixo horizontal em x=3. À esquerda a saída é negativa, em três zero, à direita positiva. Para a positivo, a função fica negativa antes da raiz e positiva depois.</desc><rect width="820" height="370" rx="13" fill="#f8fbff"/><text x="24" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#173853">Sinal quando a função cresce</text><line x1="310" y1="215" x2="700" y2="215" stroke="#283d56" stroke-width="2.5"/><line x1="310" y1="335" x2="310" y2="95" stroke="#283d56" stroke-width="2.5"/><text x="375" y="232" text-anchor="middle" font-size="13">1</text><text x="440" y="232" text-anchor="middle" font-size="13">2</text><text x="505" y="232" text-anchor="middle" font-size="13">3</text><text x="570" y="232" text-anchor="middle" font-size="13">4</text><text x="635" y="232" text-anchor="middle" font-size="13">5</text><text x="700" y="232" text-anchor="middle" font-size="13">6</text><text x="302" y="339" text-anchor="end" font-size="13">-6</text><text x="302" y="299" text-anchor="end" font-size="13">-4</text><text x="302" y="259" text-anchor="end" font-size="13">-2</text><text x="302" y="179" text-anchor="end" font-size="13">2</text><text x="302" y="139" text-anchor="end" font-size="13">4</text><text x="302" y="99" text-anchor="end" font-size="13">6</text><text x="706" y="218" font-size="16">x</text><text x="317" y="91" font-size="16">f(x)</text><text x="302" y="232" font-size="13">0</text><path d="M310 335 L700 95" fill="none" stroke="#1b689a" stroke-width="4"/><circle cx="440" cy="255" r="7" fill="#144b7d"/><text x="449" y="244" font-size="17">abaixo</text><circle cx="505" cy="215" r="7" fill="#144b7d"/><text x="514" y="204" font-size="17">zero</text><circle cx="570" cy="175" r="7" fill="#144b7d"/><text x="579" y="164" font-size="17">acima</text><text x="28" y="105" font-size="19">a=2 (positivo)</text><text x="28" y="142" font-size="16">x&lt;3 : negativo</text><text x="28" y="175" font-size="16">x&gt;3 : positivo</text><text x="24" y="350" fill="#456073" font-family="sans-serif" font-size="13">Reconstrução Escolar · MAT-FUN-004 · representação autoral</text></svg>