<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 346" role="img" aria-labelledby="title desc"><title id="title">Papéis distintos — apenas exercício</title><desc id="desc">Técnico calcula, revisor de dados confere, auditor verifica regras, decisor designado delibera e responsável operacional planeja retorno; não há designação real.</desc>
