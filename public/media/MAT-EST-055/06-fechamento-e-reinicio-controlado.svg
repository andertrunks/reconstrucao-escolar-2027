<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 346" role="img" aria-labelledby="title desc"><title id="title">Encerrar e investigar são atos distintos</title><desc id="desc">O relatório de cinco pares fica fechado com ressalvas; modelos permanecem inventariados; futuro estudo recebe novo protocolo antes de novos alvos, sem inventar t23–t25.</desc>
<rect width="1240" height="346" rx="20" fill="#10243b"/><text x="36" y="44" font-size="26" font-family="Arial, sans-serif" font-weight="700" fill="#f5fbff">Encerrar e investigar são atos distintos</text>
