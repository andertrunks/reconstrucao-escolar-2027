<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">A unidade determina o método</title><desc id="desc">Duas caixas confrontam dados pareados e grupos independentes, com exemplos.</desc><rect width="960" height="490" rx="24" fill="#fff"/><rect x="14" y="14" width="932" height="462" rx="18" fill="#eaf5ff" stroke="#b7ccdf"/><text x="44" y="66" fill="#12273b" font-family="Arial,sans-serif" font-weight="bold" font-size="25">A unidade determina o método</text><rect x="90" y="135" width="330" height="125" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="255.0" y="171" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Pareado</text><text x="255.0" y="199" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">analisar cada diferença</text><rect x="540" y="135" width="330" height="125" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="705.0" y="171" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Independente</text><text x="705.0" y="199" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">comparar grupos distintos</text><rect x="125" y="307" width="260" height="65" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="255.0" y="343" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#12273b">Ex.: mesmas pessoas antes/depois</text><text x="255.0" y="371" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b"></text><rect x="575" y="307" width="260" height="65" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="705.0" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#12273b">Ex.: duas turmas distintas</text><text x="705.0" y="371" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b"></text><text x="44" y="448" fill="#12273b" font-family="Arial,sans-serif" font-size="17">A escolha do teste começa no desenho, e não na lembrança da fórmula.</text></svg>