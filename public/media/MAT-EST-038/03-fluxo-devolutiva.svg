<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">Fluxo legítimo de devolutiva</title><desc id="desc">Tentativa, correção, diagnóstico e reteste. Embaixo há aviso sobre ausência de tentativa.</desc><rect width="960" height="490" rx="24" fill="#fff"/><rect x="14" y="14" width="932" height="462" rx="18" fill="#eaf5ff" stroke="#b7ccdf"/><text x="44" y="66" fill="#12273b" font-family="Arial,sans-serif" font-weight="bold" font-size="25">Fluxo legítimo de devolutiva</text><rect x="60" y="125" width="200" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="160.0" y="161" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Tentativa real</text><text x="160.0" y="189" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">sem resposta fictícia</text><path d="M260 173 L300 173" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M291 167 L300 173 L291 179" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="300" y="125" width="200" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="400.0" y="161" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Correção</text><text x="400.0" y="189" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#12273b">justificar o raciocínio</text><path d="M500 173 L540 173" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M531 167 L540 173 L531 179" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="540" y="125" width="200" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="640.0" y="161" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Diagnóstico</text><text x="640.0" y="189" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">por habilidade</text><path d="M740 173 L780 173" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M771 167 L780 173 L771 179" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="780" y="125" width="145" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="852.5" y="161" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Reteste</text><text x="852.5" y="189" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">novo item</text><rect x="160" y="295" width="640" height="90" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="480.0" y="331" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Se não houver tentativa real</text><text x="480.0" y="359" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">manter o estado pendente; não atribuir nota, acerto ou domínio</text><text x="44" y="448" fill="#12273b" font-family="Arial,sans-serif" font-size="17">Não é possível concluir domínio individual a partir do gabarito publicado.</text></svg>