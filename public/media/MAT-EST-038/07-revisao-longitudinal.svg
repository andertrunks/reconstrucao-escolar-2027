<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">Revisão longitudinal sem consolidação automática</title><desc id="desc">Fluxo de tentativa efetiva, remediação, reteste e revisões após 1, 7 e 30 dias.</desc><rect width="960" height="490" rx="24" fill="#fff"/><rect x="14" y="14" width="932" height="462" rx="18" fill="#eaf5ff" stroke="#b7ccdf"/><text x="44" y="66" fill="#12273b" font-family="Arial,sans-serif" font-weight="bold" font-size="25">Revisão longitudinal sem consolidação automática</text><rect x="60" y="154" width="185" height="95" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="152.5" y="190" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Tentativa</text><text x="152.5" y="218" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">data efetiva</text><path d="M245 201 L290 201" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M281 195 L290 201 L281 207" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="290" y="154" width="185" height="95" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="382.5" y="190" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Recuperação</text><text x="382.5" y="218" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">fundamento frágil</text><path d="M475 201 L520 201" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M511 195 L520 201 L511 207" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="520" y="154" width="185" height="95" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="612.5" y="190" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Reteste</text><text x="612.5" y="218" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">item independente</text><path d="M705 201 L750 201" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M741 195 L750 201 L741 207" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="750" y="154" width="155" height="95" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="827.5" y="190" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Revisões</text><text x="827.5" y="218" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">D+1, +7, +30</text><rect x="140" y="312" width="670" height="70" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="475.0" y="348" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#12273b">Reteste errado? Reduzir o passo, estudar o pré-requisito e tentar outro item.</text><text x="475.0" y="376" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b"></text><text x="44" y="448" fill="#12273b" font-family="Arial,sans-serif" font-size="17">A consolidação depende de explicar, aplicar e recuperar o conceito no tempo.</text></svg>