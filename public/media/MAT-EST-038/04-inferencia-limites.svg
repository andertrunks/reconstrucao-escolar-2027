<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">Do dado à inferência com limites</title><desc id="desc">Uma observação de 54% na amostra passa por avaliação de seleção e condições antes de generalização.</desc><rect width="960" height="490" rx="24" fill="#fff"/><rect x="14" y="14" width="932" height="462" rx="18" fill="#eaf5ff" stroke="#b7ccdf"/><text x="44" y="66" fill="#12273b" font-family="Arial,sans-serif" font-weight="bold" font-size="25">Do dado à inferência com limites</text><rect x="60" y="134" width="245" height="130" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="182.5" y="170" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Amostra observada</text><text x="182.5" y="198" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">54 em 100 = 54%</text><path d="M305 196 L370 196" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M361 190 L370 196 L361 202" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="370" y="134" width="245" height="130" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="492.5" y="170" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Modelo de inferência</text><text x="492.5" y="198" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">seleção + condições</text><path d="M615 196 L680 196" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M671 190 L680 196 L671 202" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="680" y="134" width="235" height="130" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="797.5" y="170" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">População-alvo</text><text x="797.5" y="198" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">incerteza declarada</text><rect x="160" y="312" width="630" height="75" rx="15" fill="#fff" stroke="#1463a5" stroke-width="2"/><text x="475.0" y="348" font-family="Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#12273b">Risco: seleção voluntária não se corrige apenas aumentando n</text><text x="475.0" y="376" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b"></text><text x="44" y="448" fill="#12273b" font-family="Arial,sans-serif" font-size="17">Toda generalização necessita de um desenho defensável.</text></svg>