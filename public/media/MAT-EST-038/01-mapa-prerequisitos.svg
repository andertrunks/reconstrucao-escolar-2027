<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">Mapa de pré-requisitos da síntese</title><desc id="desc">Fluxo da pergunta até uma conclusão condicionada às hipóteses; dois blocos reúnem conteúdos anteriores.</desc><rect width="960" height="490" rx="24" fill="#fff"/><rect x="14" y="14" width="932" height="462" rx="18" fill="#eaf5ff" stroke="#b7ccdf"/><text x="44" y="66" fill="#12273b" font-family="Arial,sans-serif" font-weight="bold" font-size="25">Mapa de pré-requisitos da síntese</text><rect x="54" y="120" width="175" height="95" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="141.5" y="156" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Pergunta</text><text x="141.5" y="184" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#12273b">população e variável</text><path d="M229 168 L280 168" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M271 162 L280 168 L271 174" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="280" y="120" width="175" height="95" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="367.5" y="156" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Desenho</text><text x="367.5" y="184" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">seleção e pares</text><path d="M455 168 L506 168" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M497 162 L506 168 L497 174" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="506" y="120" width="175" height="95" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="593.5" y="156" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Método</text><text x="593.5" y="184" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">hipóteses</text><path d="M681 168 L732 168" stroke="#1463a5" stroke-width="3" fill="none"/><path d="M723 162 L732 168 L723 174" fill="none" stroke="#1463a5" stroke-width="3"/><rect x="732" y="120" width="175" height="95" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="819.5" y="156" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Conclusão</text><text x="819.5" y="184" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">limitações</text><rect x="130" y="290" width="280" height="90" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="270.0" y="326" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Descrição e inferência</text><text x="270.0" y="354" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">MAT-EST-019 a 025</text><rect x="550" y="290" width="280" height="90" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="690.0" y="326" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Modelos e validação</text><text x="690.0" y="354" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">MAT-EST-026 a 037</text><text x="44" y="448" fill="#12273b" font-family="Arial,sans-serif" font-size="17">A ordem conceitual orienta a recuperação, não o número de aulas lidas.</text></svg>