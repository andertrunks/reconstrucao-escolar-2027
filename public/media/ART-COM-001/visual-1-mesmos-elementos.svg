<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Os mesmos elementos em três composições</title><desc id="d">Três painéis A, B e C contêm dois círculos e dois quadrados idênticos, mas com posições, distâncias e agrupamentos diferentes.</desc><rect width="960" height="360" fill="white"/><g stroke="black" fill="none" stroke-width="3"><rect x="30" y="55" width="280" height="260"/><rect x="340" y="55" width="280" height="260"/><rect x="650" y="55" width="280" height="260"/></g><g font-family="sans-serif" font-size="26" fill="black"><text x="45" y="42">A</text><text x="355" y="42">B</text><text x="665" y="42">C</text></g><g stroke="black" stroke-width="3"><circle cx="105" cy="130" r="28" fill="white"/><circle cx="230" cy="235" r="28" fill="white"/><rect x="170" y="105" width="52" height="52" fill="#ddd"/><rect x="85" y="225" width="52" height="52" fill="#ddd"/><circle cx="420" cy="155" r="28" fill="white"/><circle cx="485" cy="155" r="28" fill="white"/><rect x="455" y="220" width="52" height="52" fill="#ddd"/><rect x="520" y="220" width="52" height="52" fill="#ddd"/><circle cx="735" cy="105" r="28" fill="white"/><circle cx="845" cy="265" r="28" fill="white"/><rect x="805" y="115" width="52" height="52" fill="#ddd"/><rect x="700" y="245" width="52" height="52" fill="#ddd"/></g><text x="480" y="345" text-anchor="middle" font-family="sans-serif" font-size="18">mesmas formas · relações espaciais diferentes</text></svg>