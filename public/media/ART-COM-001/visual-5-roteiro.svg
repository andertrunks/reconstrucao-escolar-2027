<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Roteiro de análise compositiva em cinco passos</title><desc id="d">Cinco caixas numeradas em sequência: observar, descrever, relacionar, explicar efeito e justificar com evidência, ligadas por setas.</desc><rect width="1100" height="300" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="black"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><g fill="white" stroke="black" stroke-width="3"><rect x="25" y="90" width="180" height="105" rx="12"/><rect x="240" y="90" width="180" height="105" rx="12"/><rect x="455" y="90" width="180" height="105" rx="12"/><rect x="670" y="90" width="180" height="105" rx="12"/><rect x="885" y="90" width="190" height="105" rx="12"/></g><g font-size="22" fill="black"><text x="115" y="125">1</text><text x="115" y="160">observar</text><text x="330" y="125">2</text><text x="330" y="160">descrever</text><text x="545" y="125">3</text><text x="545" y="160">relacionar</text><text x="760" y="125">4</text><text x="760" y="153">explicar</text><text x="760" y="180">efeito</text><text x="980" y="125">5</text><text x="980" y="153">justificar com</text><text x="980" y="180">evidência</text></g></g><g stroke="black" stroke-width="3" marker-end="url(#a)"><line x1="205" y1="142" x2="235" y2="142"/><line x1="420" y1="142" x2="450" y2="142"/><line x1="635" y1="142" x2="665" y2="142"/><line x1="850" y1="142" x2="880" y2="142"/></g><text x="550" y="245" font-family="sans-serif" font-size="20" text-anchor="middle">descrição antes da interpretação · interpretação sustentada por evidência</text></svg>