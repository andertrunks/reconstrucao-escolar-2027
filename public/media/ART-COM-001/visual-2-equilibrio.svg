<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="t d"><title id="t">Três modos de equilíbrio visual</title><desc id="d">Três quadros mostram equilíbrio simétrico, aproximadamente simétrico e assimétrico. Linhas centrais tracejadas ajudam a comparar as distribuições.</desc><rect width="960" height="390" fill="white"/><g stroke="black" fill="none" stroke-width="3"><rect x="25" y="60" width="285" height="260"/><rect x="337" y="60" width="285" height="260"/><rect x="650" y="60" width="285" height="260"/></g><g stroke="black" stroke-dasharray="8 8" stroke-width="2"><line x1="167" y1="65" x2="167" y2="315"/><line x1="479" y1="65" x2="479" y2="315"/><line x1="792" y1="65" x2="792" y2="315"/></g><g fill="#ddd" stroke="black" stroke-width="3"><circle cx="100" cy="155" r="34"/><circle cx="234" cy="155" r="34"/><rect x="82" y="230" width="44" height="44"/><rect x="208" y="230" width="44" height="44"/><circle cx="410" cy="150" r="36"/><circle cx="545" cy="145" r="30"/><rect x="405" y="235" width="52" height="38"/><rect x="525" y="225" width="38" height="52"/><rect x="690" y="120" width="95" height="95"/><circle cx="865" cy="160" r="24"/><circle cx="835" cy="245" r="24"/><circle cx="890" cy="255" r="24"/></g><g font-family="sans-serif" font-size="20" text-anchor="middle" fill="black"><text x="167" y="350">simétrico</text><text x="479" y="350">aproximado</text><text x="792" y="350">assimétrico</text></g></svg>