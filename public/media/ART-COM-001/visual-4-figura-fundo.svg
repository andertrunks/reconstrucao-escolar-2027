<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Figura e fundo como relação perceptiva</title><desc id="d">Uma forma escura central semelhante a um vaso é delimitada por duas formas claras laterais semelhantes a perfis de rostos, permitindo alternância perceptiva entre figura e fundo.</desc><rect width="800" height="420" fill="white"/><path d="M310 55 C250 95 250 140 300 165 C250 205 255 260 320 285 C335 300 340 325 315 360 L485 360 C460 325 465 300 480 285 C545 260 550 205 500 165 C550 140 550 95 490 55 Z" fill="#222"/><path d="M0 0 H310 C265 65 225 100 255 130 C285 160 255 195 225 220 C190 250 190 300 230 420 H0 Z" fill="#eee" stroke="black" stroke-width="2"/><path d="M800 0 H490 C535 65 575 100 545 130 C515 160 545 195 575 220 C610 250 610 300 570 420 H800 Z" fill="#eee" stroke="black" stroke-width="2"/><text x="400" y="398" font-family="sans-serif" font-size="20" text-anchor="middle">o mesmo limite pode organizar leituras diferentes</text></svg>