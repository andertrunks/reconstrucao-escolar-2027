<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Contraste, ênfase e hierarquia visual</title><desc id="d">Um grande quadrado escuro marcado como primeiro nível, um círculo médio marcado como segundo nível e quatro formas pequenas marcadas como apoio demonstram hierarquia visual.</desc><rect width="960" height="420" fill="white"/><rect x="60" y="75" width="250" height="250" fill="#222" stroke="black" stroke-width="3"/><text x="185" y="205" fill="white" font-family="sans-serif" font-size="38" text-anchor="middle">1º</text><circle cx="505" cy="190" r="90" fill="#bbb" stroke="black" stroke-width="3"/><text x="505" y="202" fill="black" font-family="sans-serif" font-size="34" text-anchor="middle">2º</text><g fill="white" stroke="black" stroke-width="3"><circle cx="760" cy="120" r="30"/><rect x="820" y="95" width="58" height="58"/><circle cx="780" cy="250" r="30"/><rect x="845" y="225" width="58" height="58"/></g><text x="830" y="340" font-family="sans-serif" font-size="24" text-anchor="middle">apoio</text><text x="480" y="390" font-family="sans-serif" font-size="18" text-anchor="middle">escala + valor + isolamento organizam graus de destaque</text></svg>