<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 900 370" width="900" height="370"><title id="t">Custo condicionado à função de perda</title><desc id="d">Para falta custando três e excedente um, custo no teste: A igual a 40; B igual a 25 unidades fictícias.</desc><rect width="900" height="370" fill="#ffffff"/><text x="28" y="37" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#18334b" text-anchor="start">Custo fictício no teste: falta × 3; excedente × 1</text><rect x="48" y="78" width="372" height="226" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="70" y="114" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18334b" text-anchor="start">Modelo A</text><text x="70" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#18334b" text-anchor="start">Faltas: 10; excedentes: 10</text><text x="70" y="193" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#18334b" text-anchor="start">3 × 10 + 1 × 10</text><text x="70" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#2265ad" text-anchor="start">Custo = 40</text><rect x="475" y="78" width="372" height="226" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="497" y="114" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18334b" text-anchor="start">Modelo B</text><text x="497" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#18334b" text-anchor="start">Faltas: 0; excedentes: 25</text><text x="497" y="193" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#18334b" text-anchor="start">3 × 0 + 1 × 25</text><text x="497" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#2265ad" text-anchor="start">Custo = 25</text><text x="30" y="346" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#18334b" text-anchor="start">Este resultado muda se mudar a função de perda; não é um ranking universal de modelos.</text></svg>