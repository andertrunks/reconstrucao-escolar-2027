<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 900 370" width="900" height="370"><title id="t">Estrutura do relatório interpretativo</title><desc id="d">Seis seções: pergunta, dados, método, achados, limites e conclusão, com anexos reproduzíveis.</desc><rect width="900" height="370" fill="#ffffff"/><text x="30" y="39" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18334b" text-anchor="start">Cartão de relatório reproduzível</text><rect x="31" y="78" width="408" height="69" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="45" y="103" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">1. Pergunta e público</text><text x="45" y="127" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#18334b" text-anchor="start">alvo, horizonte, decisão</text><rect x="469" y="78" width="408" height="69" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="483" y="103" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">2. Dados</text><text x="483" y="127" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#18334b" text-anchor="start">fonte, dicionário, qualidade</text><rect x="31" y="159" width="408" height="69" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="45" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">3. Método</text><text x="45" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#18334b" text-anchor="start">partição, fórmulas, comparadores</text><rect x="469" y="159" width="408" height="69" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="483" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">4. Achados</text><text x="483" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#18334b" text-anchor="start">tabelas, gráficos, métricas</text><rect x="31" y="240" width="408" height="69" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="45" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">5. Limites</text><text x="45" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#18334b" text-anchor="start">viés, tamanho, incerteza</text><rect x="469" y="240" width="408" height="69" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="483" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">6. Conclusão</text><text x="483" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#18334b" text-anchor="start">resposta condicionada e próximo teste</text><text x="30" y="354" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#18334b" text-anchor="start">Anexos: CSV sintético + cálculos + versão de previsões + status de auditoria.</text></svg>