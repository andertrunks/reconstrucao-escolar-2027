<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Atendimentos por dia, amostra fictícia</title><desc id="desc">Gráfico de linhas dos dias 1 a 8. Eixo horizontal dias, vertical atendimentos. Série 80,100,120,100,90,110,130,100.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153047}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px}.lab{font-size:17px;font-weight:600}.small{font-size:14px}.axis{stroke:#374e63;stroke-width:2;fill:none}.curve{stroke:#176781;stroke-width:3;fill:none}.amber{stroke:#91620a;stroke-width:3;fill:none}.box{fill:#edf7fa;stroke:#176781;stroke-width:2}.warm{fill:#fff2d9;stroke:#9d6110;stroke-width:2}.alert{fill:#fbe5e5;stroke:#af3232;stroke-width:2}.dot{fill:#176781}.day{fill:#c7e5ee;stroke:#176781;stroke-width:2}.bar{fill:#b3dce6;stroke:#176781;stroke-width:1.5}</style><rect width="960" height="480" fill="white"/><text x="26" y="42" class="title">Atendimentos por dia, amostra fictícia</text><path d="M 78 385 L 882 385 M 78 385 L 78 97" class="axis"/><text x="482" y="451" class="lab" text-anchor="middle">Dia (unidade: dia)</text><text x="85" y="85" class="small">Atendimentos (unidade: pessoas)</text><circle cx="108" cy="350.0" r="6" class="dot"/><text x="108" y="402" class="small" text-anchor="middle">1</text><text x="108" y="336.0" class="small" text-anchor="middle">80</text><circle cx="211" cy="280.0" r="6" class="dot"/><text x="211" y="402" class="small" text-anchor="middle">2</text><text x="211" y="266.0" class="small" text-anchor="middle">100</text><circle cx="314" cy="210.0" r="6" class="dot"/><text x="314" y="402" class="small" text-anchor="middle">3</text><text x="314" y="196.0" class="small" text-anchor="middle">120</text><circle cx="417" cy="280.0" r="6" class="dot"/><text x="417" y="402" class="small" text-anchor="middle">4</text><text x="417" y="266.0" class="small" text-anchor="middle">100</text><circle cx="520" cy="315.0" r="6" class="dot"/><text x="520" y="402" class="small" text-anchor="middle">5</text><text x="520" y="301.0" class="small" text-anchor="middle">90</text><circle cx="623" cy="245.0" r="6" class="dot"/><text x="623" y="402" class="small" text-anchor="middle">6</text><text x="623" y="231.0" class="small" text-anchor="middle">110</text><circle cx="726" cy="175.0" r="6" class="dot"/><text x="726" y="402" class="small" text-anchor="middle">7</text><text x="726" y="161.0" class="small" text-anchor="middle">130</text><circle cx="829" cy="280.0" r="6" class="dot"/><text x="829" y="402" class="small" text-anchor="middle">8</text><text x="829" y="266.0" class="small" text-anchor="middle">100</text><polyline class="curve" points="108,350.0 211,280.0 314,210.0 417,280.0 520,315.0 623,245.0 726,175.0 829,280.0"/><text x="65" y="355.0" class="small" text-anchor="end">80</text><text x="65" y="285.0" class="small" text-anchor="end">100</text><text x="65" y="215.0" class="small" text-anchor="end">120</text><text x="65" y="145.0" class="small" text-anchor="end">140</text></svg>