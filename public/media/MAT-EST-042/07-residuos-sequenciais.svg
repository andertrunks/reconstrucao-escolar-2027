<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Diagnóstico dos resíduos após a previsão</title><desc id="desc">Seis erros +1,+1,+1,-1,-1,-1 formam duas sequências com mesmo sinal, autocorrelação amostral de atraso um igual a 0,5.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153047}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px}.lab{font-size:17px;font-weight:600}.small{font-size:14px}.axis{stroke:#374e63;stroke-width:2;fill:none}.curve{stroke:#176781;stroke-width:3;fill:none}.amber{stroke:#91620a;stroke-width:3;fill:none}.box{fill:#edf7fa;stroke:#176781;stroke-width:2}.warm{fill:#fff2d9;stroke:#9d6110;stroke-width:2}.alert{fill:#fbe5e5;stroke:#af3232;stroke-width:2}.dot{fill:#176781}.day{fill:#c7e5ee;stroke:#176781;stroke-width:2}.bar{fill:#b3dce6;stroke:#176781;stroke-width:1.5}</style><rect width="960" height="480" fill="white"/><text x="26" y="42" class="title">Diagnóstico dos resíduos após a previsão</text><text x="45" y="91" class="lab">Erros ordenados no tempo: +1, +1, +1, −1, −1, −1</text><rect x="91" y="139" width="115" height="75" rx="10" class="box"/><text x="105" y="169" class="lab">t=1: +1</text><rect x="236" y="139" width="115" height="75" rx="10" class="box"/><text x="250" y="169" class="lab">t=2: +1</text><rect x="381" y="139" width="115" height="75" rx="10" class="box"/><text x="395" y="169" class="lab">t=3: +1</text><rect x="526" y="139" width="115" height="75" rx="10" class="warm"/><text x="540" y="169" class="lab">t=4: -1</text><rect x="671" y="139" width="115" height="75" rx="10" class="warm"/><text x="685" y="169" class="lab">t=5: -1</text><rect x="816" y="139" width="115" height="75" rx="10" class="warm"/><text x="830" y="169" class="lab">t=6: -1</text><rect x="93" y="285" width="337" height="79" rx="10" class="box"/><text x="107" y="315" class="lab">ACF residual k=1: +0,50</text><rect x="511" y="285" width="341" height="79" rx="10" class="warm"/><text x="525" y="315" class="lab">Revisar o padrão temporal</text><text x="45" y="432" class="small">O caso é ilustrativo: seis erros não bastam para concluir significância.</text></svg>