<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Série temporal e defasagens</title><desc id="desc">Oito dias em ordem, com observados 80,100,120,100,90,110,130,100 e exemplos de atraso de um e dois dias.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153047}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px}.lab{font-size:17px;font-weight:600}.small{font-size:14px}.axis{stroke:#374e63;stroke-width:2;fill:none}.curve{stroke:#176781;stroke-width:3;fill:none}.amber{stroke:#91620a;stroke-width:3;fill:none}.box{fill:#edf7fa;stroke:#176781;stroke-width:2}.warm{fill:#fff2d9;stroke:#9d6110;stroke-width:2}.alert{fill:#fbe5e5;stroke:#af3232;stroke-width:2}.dot{fill:#176781}.day{fill:#c7e5ee;stroke:#176781;stroke-width:2}.bar{fill:#b3dce6;stroke:#176781;stroke-width:1.5}</style><rect width="960" height="480" fill="white"/><text x="26" y="42" class="title">Série temporal e defasagens</text><text x="35" y="88" class="lab">Dia (t) →</text><circle class="day" cx="90" cy="174" r="24"/><text x="90" y="180" class="lab" text-anchor="middle">1</text><text x="90" y="221" class="lab" text-anchor="middle">80</text><path d="M 118 174 L 166 174" class="axis"/><circle class="day" cx="196" cy="174" r="24"/><text x="196" y="180" class="lab" text-anchor="middle">2</text><text x="196" y="221" class="lab" text-anchor="middle">100</text><path d="M 224 174 L 272 174" class="axis"/><circle class="day" cx="302" cy="174" r="24"/><text x="302" y="180" class="lab" text-anchor="middle">3</text><text x="302" y="221" class="lab" text-anchor="middle">120</text><path d="M 330 174 L 378 174" class="axis"/><circle class="day" cx="408" cy="174" r="24"/><text x="408" y="180" class="lab" text-anchor="middle">4</text><text x="408" y="221" class="lab" text-anchor="middle">100</text><path d="M 436 174 L 484 174" class="axis"/><circle class="day" cx="514" cy="174" r="24"/><text x="514" y="180" class="lab" text-anchor="middle">5</text><text x="514" y="221" class="lab" text-anchor="middle">90</text><path d="M 542 174 L 590 174" class="axis"/><circle class="day" cx="620" cy="174" r="24"/><text x="620" y="180" class="lab" text-anchor="middle">6</text><text x="620" y="221" class="lab" text-anchor="middle">110</text><path d="M 648 174 L 696 174" class="axis"/><circle class="day" cx="726" cy="174" r="24"/><text x="726" y="180" class="lab" text-anchor="middle">7</text><text x="726" y="221" class="lab" text-anchor="middle">130</text><path d="M 754 174 L 802 174" class="axis"/><circle class="day" cx="832" cy="174" r="24"/><text x="832" y="180" class="lab" text-anchor="middle">8</text><text x="832" y="221" class="lab" text-anchor="middle">100</text><rect x="95" y="300" width="350" height="70" rx="10" class="box"/><text x="109" y="330" class="lab">Defasagem 1: dia t−1</text><rect x="515" y="300" width="350" height="70" rx="10" class="warm"/><text x="529" y="330" class="lab">Defasagem 2: dia t−2</text><text x="56" y="429" class="subtitle">A ordem e o intervalo entre as observações são dados do problema.</text></svg>