<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560"><title>Variância populacional e amostral</title><desc>População usa média mu e denominador N; amostra usa média x barra e denominador n menos um.</desc><rect width="1000" height="560" fill="white"/><text x="250" y="50" font-size="28">População versus amostra</text><rect x="70" y="120" width="380" height="300" fill="none" stroke="black" stroke-width="3"/><rect x="550" y="120" width="380" height="300" fill="none" stroke="black" stroke-width="3"/><text x="180" y="175" font-size="24">População</text><text x="115" y="245" font-size="22">σ² = Σ(x−μ)² / N</text><text x="115" y="315" font-size="20">Descreve a população definida.</text><text x="670" y="175" font-size="24">Amostra</text><text x="595" y="245" font-size="22">s² = Σ(x−x̄)² / (n−1)</text><text x="595" y="315" font-size="20">Estimador usual da variância populacional.</text></svg>