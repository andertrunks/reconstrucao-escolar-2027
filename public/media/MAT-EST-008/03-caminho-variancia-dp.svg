<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520"><title>Caminho do cálculo até o desvio-padrão</title><desc>Fluxo: dados, média, desvios, quadrados, variância e raiz quadrada para desvio-padrão.</desc><rect width="1100" height="520" fill="white"/><text x="260" y="45" font-size="28">Do dado ao desvio-padrão</text><g fill="none" stroke="black" stroke-width="2"><rect x="40" y="170" width="120" height="70"/><rect x="205" y="170" width="120" height="70"/><rect x="370" y="170" width="120" height="70"/><rect x="535" y="170" width="120" height="70"/><rect x="700" y="170" width="150" height="70"/><rect x="900" y="170" width="150" height="70"/></g><g font-size="18"><text x="78" y="210">dados</text><text x="245" y="210">média</text><text x="395" y="210">desvios</text><text x="558" y="210">quadrados</text><text x="735" y="210">variância</text><text x="930" y="210">DP</text></g><g stroke="black" stroke-width="3"><line x1="160" y1="205" x2="205" y2="205"/><line x1="325" y1="205" x2="370" y2="205"/><line x1="490" y1="205" x2="535" y2="205"/><line x1="655" y1="205" x2="700" y2="205"/><line x1="850" y1="205" x2="900" y2="205"/></g></svg>