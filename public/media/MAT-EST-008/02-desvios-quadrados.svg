<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560"><title>Desvios e quadrados</title><desc>Dados dois, quatro e seis com média quatro. Desvios menos dois, zero e mais dois viram quadrados quatro, zero e quatro.</desc><rect width="1000" height="560" fill="white"/><text x="290" y="50" font-size="28">Desvios e quadrados</text><text x="100" y="150" font-size="24">Dados: 2, 4, 6 — média 4</text><text x="100" y="230" font-size="22">Desvios: −2, 0, +2</text><text x="100" y="310" font-size="22">Quadrados: 4, 0, 4</text><text x="100" y="390" font-size="22">Soma dos desvios = 0</text><text x="100" y="450" font-size="22">Soma dos quadrados = 8</text></svg>