<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560"><title>Mesma média e dispersões diferentes</title><desc>Dois conjuntos com média cinco. A tem valores quatro, cinco e seis próximos do centro; B tem zero, cinco e dez mais espalhados.</desc><rect width="1000" height="560" fill="white"/><text x="220" y="45" font-size="28">Mesma média, dispersões diferentes</text><line x1="100" y1="220" x2="900" y2="220" stroke="black" stroke-width="3"/><text x="80" y="170" font-size="22">A</text><circle cx="420" cy="220" r="9"/><circle cx="500" cy="220" r="9"/><circle cx="580" cy="220" r="9"/><text x="365" y="270" font-size="20">4     5     6</text><line x1="100" y1="410" x2="900" y2="410" stroke="black" stroke-width="3"/><text x="80" y="360" font-size="22">B</text><circle cx="180" cy="410" r="9"/><circle cx="500" cy="410" r="9"/><circle cx="820" cy="410" r="9"/><text x="160" y="460" font-size="20">0</text><text x="490" y="460" font-size="20">5</text><text x="805" y="460" font-size="20">10</text><text x="420" y="525" font-size="20">Ambos têm média 5.</text></svg>