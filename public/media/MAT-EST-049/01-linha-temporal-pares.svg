<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1050 340" width="1050" height="340"><title id="title">Emissão antes da revelação</title><desc id="desc">Cada origem t17 a t21 emite duas previsões de horizonte um para t18 a t22. Os valores observados são revelados em etapas posteriores, na ordem lógica da simulação.</desc><rect width="1050" height="340" rx="18" fill="#f8fafc"/><text x="35" y="36" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#17243b">Emissão antes da revelação</text><rect x="85" y="90" width="136" height="68" rx="8" fill="#1d4e89"/><text x="153" y="116" text-anchor="middle" font-size="17" fill="white" font-family="Arial">Origem t17</text><text x="153" y="140" text-anchor="middle" font-size="14" fill="white" font-family="Arial">prevê t18</text><path d="M222,124 h17" stroke="#17243b" stroke-width="2"/><path d="M233,119 l7,5 -7,5" fill="none" stroke="#17243b" stroke-width="2"/><rect x="243" y="90" width="136" height="68" rx="8" fill="#157b72"/><text x="311" y="116" text-anchor="middle" font-size="17" fill="white" font-family="Arial">Origem t18</text><text x="311" y="140" text-anchor="middle" font-size="14" fill="white" font-family="Arial">prevê t19</text><path d="M380,124 h17" stroke="#17243b" stroke-width="2"/><path d="M391,119 l7,5 -7,5" fill="none" stroke="#17243b" stroke-width="2"/><rect x="401" y="90" width="136" height="68" rx="8" fill="#157b72"/><text x="469" y="116" text-anchor="middle" font-size="17" fill="white" font-family="Arial">Origem t19</text><text x="469" y="140" text-anchor="middle" font-size="14" fill="white" font-family="Arial">prevê t20</text><path d="M538,124 h17" stroke="#17243b" stroke-width="2"/><path d="M549,119 l7,5 -7,5" fill="none" stroke="#17243b" stroke-width="2"/><rect x="559" y="90" width="136" height="68" rx="8" fill="#157b72"/><text x="627" y="116" text-anchor="middle" font-size="17" fill="white" font-family="Arial">Origem t20</text><text x="627" y="140" text-anchor="middle" font-size="14" fill="white" font-family="Arial">prevê t21</text><path d="M696,124 h17" stroke="#17243b" stroke-width="2"/><path d="M707,119 l7,5 -7,5" fill="none" stroke="#17243b" stroke-width="2"/><rect x="717" y="90" width="136" height="68" rx="8" fill="#157b72"/><text x="785" y="116" text-anchor="middle" font-size="17" fill="white" font-family="Arial">Origem t21</text><text x="785" y="140" text-anchor="middle" font-size="14" fill="white" font-family="Arial">prevê t22</text><path d="M854,124 h17" stroke="#17243b" stroke-width="2"/><path d="M865,119 l7,5 -7,5" fill="none" stroke="#17243b" stroke-width="2"/><rect x="875" y="90" width="136" height="68" rx="8" fill="#157b72"/><text x="943" y="116" text-anchor="middle" font-size="17" fill="white" font-family="Arial">Origem t22</text><text x="943" y="140" text-anchor="middle" font-size="14" fill="white" font-family="Arial">prevê t23</text><path d="M153,158 v52" stroke="#17243b" stroke-width="2" stroke-dasharray="5 5"/><text x="153" y="231" text-anchor="middle" font-size="15" fill="#17243b" font-family="Arial">y18=176</text><path d="M311,158 v52" stroke="#17243b" stroke-width="2" stroke-dasharray="5 5"/><text x="311" y="231" text-anchor="middle" font-size="15" fill="#17243b" font-family="Arial">y19=183</text><path d="M469,158 v52" stroke="#17243b" stroke-width="2" stroke-dasharray="5 5"/><text x="469" y="231" text-anchor="middle" font-size="15" fill="#17243b" font-family="Arial">y20=181</text><path d="M627,158 v52" stroke="#17243b" stroke-width="2" stroke-dasharray="5 5"/><text x="627" y="231" text-anchor="middle" font-size="15" fill="#17243b" font-family="Arial">y21=188</text><path d="M785,158 v52" stroke="#17243b" stroke-width="2" stroke-dasharray="5 5"/><text x="785" y="231" text-anchor="middle" font-size="15" fill="#17243b" font-family="Arial">y22=193</text><text x="48" y="296" font-family="Arial" font-size="17" fill="#17243b">Etapa de simulação: emitir as duas previsões → revelar o alvo → comparar o par.</text></svg>