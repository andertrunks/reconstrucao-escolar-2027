<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1010 323" width="1010" height="323"><title id="title">Governança: comparação, decisão e preservação</title><desc id="desc">A referência e o desafiante são versões separadas, com avaliação emparelhada, parecer de não promoção e eventual extensão de monitoramento, sem sobrescrever emissões antigas.</desc><rect width="1010" height="323" rx="18" fill="#f8fafc"/><text x="35" y="36" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#17243b">Governança: comparação, decisão e preservação</text><rect x="30" y="106" width="180" height="112" rx="10" stroke="#1d4e89" stroke-width="2" fill="white"/><text x="120" y="143" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="14" font-weight="700">BASE-SNAIVE-v1</text><text x="120" y="178" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="12">permanece referência</text><path d="M210 162 h16 m-6 -6 l6 6 -6 6" stroke="#157b72" stroke-width="2" fill="none"/><rect x="226" y="106" width="180" height="112" rx="10" stroke="#1d4e89" stroke-width="2" fill="white"/><text x="316" y="143" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="14" font-weight="700">CHAL-SDELTA5-v1</text><text x="316" y="178" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="12">testado em sombra</text><path d="M406 162 h16 m-6 -6 l6 6 -6 6" stroke="#157b72" stroke-width="2" fill="none"/><rect x="422" y="106" width="180" height="112" rx="10" stroke="#1d4e89" stroke-width="2" fill="white"/><text x="512" y="143" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="14" font-weight="700">Avaliação t18–t22</text><text x="512" y="178" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="12">5 pares ilustrativos</text><path d="M602 162 h16 m-6 -6 l6 6 -6 6" stroke="#157b72" stroke-width="2" fill="none"/><rect x="618" y="106" width="180" height="112" rx="10" stroke="#1d4e89" stroke-width="2" fill="white"/><text x="708" y="143" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="14" font-weight="700">Parecer</text><text x="708" y="178" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="12">adiar promoção</text><path d="M798 162 h16 m-6 -6 l6 6 -6 6" stroke="#157b72" stroke-width="2" fill="none"/><rect x="814" y="106" width="180" height="112" rx="10" stroke="#1d4e89" stroke-width="2" fill="white"/><text x="904" y="143" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="14" font-weight="700">Extensão t23–t25</text><text x="904" y="178" text-anchor="middle" fill="#17243b" font-family="Arial" font-size="12">somente após emissões</text><text x="37" y="282" font-family="Arial" font-size="17" fill="#17243b">Reavaliar não significa reescrever o histórico. Preservar versões, emissões e regra de reversão.</text></svg>