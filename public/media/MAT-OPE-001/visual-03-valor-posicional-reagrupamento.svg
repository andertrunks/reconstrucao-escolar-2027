<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Reagrupamento e valor posicional</title><desc id="desc">Dois exemplos mostram quinze unidades transformadas em uma dezena e cinco unidades na adição, e uma dezena de 83 transformada em dez unidades para realizar 83 menos 27.</desc><rect width="1000" height="620" fill="white"/><text x="500" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Reagrupar é trocar entre ordens equivalentes</text><g font-family="Arial,sans-serif"><rect x="70" y="95" width="860" height="205" rx="16" fill="#f6f6f6" stroke="#222" stroke-width="3"/><text x="100" y="140" font-size="25" font-weight="700">Adição: 47 + 38</text><text x="100" y="185" font-size="22">7 unidades + 8 unidades = 15 unidades</text><text x="100" y="230" font-size="22">15 unidades = 1 dezena + 5 unidades</text><text x="670" y="190" font-size="54" font-weight="700">15 U</text><text x="770" y="190" font-size="36">→</text><text x="825" y="170" font-size="28" font-weight="700">1 D</text><text x="825" y="210" font-size="28" font-weight="700">+ 5 U</text><rect x="70" y="335" width="860" height="205" rx="16" fill="#f6f6f6" stroke="#222" stroke-width="3"/><text x="100" y="380" font-size="25" font-weight="700">Subtração: 83 − 27</text><text x="100" y="425" font-size="22">83 = 8 dezenas + 3 unidades</text><text x="100" y="470" font-size="22">Reagrupando: 7 dezenas + 13 unidades</text><text x="675" y="430" font-size="31" font-weight="700">8 D + 3 U</text><text x="770" y="478" font-size="36">↓</text><text x="670" y="525" font-size="31" font-weight="700">7 D + 13 U</text><text x="500" y="590" text-anchor="middle" font-size="21" font-weight="700">A quantidade não muda; muda apenas a forma de representá-la.</text></g></svg>