<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Adição e subtração como caminhos inversos</title><desc id="desc">Reta numérica de 6 a 15. Uma seta avança de 8 até 13 representando mais cinco e outra retorna de 13 até 8 representando menos cinco.</desc><rect width="1000" height="520" fill="white"/><text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Adição e subtração: caminhos inversos</text><line x1="120" y1="260" x2="900" y2="260" stroke="#222" stroke-width="5"/><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#111"><text x="160" y="305">6</text><text x="240" y="305">7</text><text x="320" y="305" font-weight="700">8</text><text x="400" y="305">9</text><text x="480" y="305">10</text><text x="560" y="305">11</text><text x="640" y="305">12</text><text x="720" y="305" font-weight="700">13</text><text x="800" y="305">14</text><text x="880" y="305">15</text></g><g stroke="#222" stroke-width="3"><line x1="160" y1="246" x2="160" y2="274"/><line x1="240" y1="246" x2="240" y2="274"/><line x1="320" y1="242" x2="320" y2="278"/><line x1="400" y1="246" x2="400" y2="274"/><line x1="480" y1="246" x2="480" y2="274"/><line x1="560" y1="246" x2="560" y2="274"/><line x1="640" y1="246" x2="640" y2="274"/><line x1="720" y1="242" x2="720" y2="278"/><line x1="800" y1="246" x2="800" y2="274"/><line x1="880" y1="246" x2="880" y2="274"/></g><path d="M320 205 Q520 90 720 205" fill="none" stroke="#333" stroke-width="5"/><polygon points="720,205 696,194 702,219" fill="#333"/><text x="520" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">8 + 5 = 13</text><path d="M720 345 Q520 455 320 345" fill="none" stroke="#666" stroke-width="5"/><polygon points="320,345 344,334 338,359" fill="#666"/><text x="520" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">13 − 5 = 