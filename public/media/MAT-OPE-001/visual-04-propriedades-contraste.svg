<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Contraste entre propriedades da adição e da subtração</title><desc id="desc">Quadro compara comutatividade, associatividade e comportamento do zero na adição com exemplos que mostram que a subtração não é comutativa nem associativa em geral.</desc><rect width="1000" height="600" fill="white"/><text x="500" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Propriedades: compare antes de aplicar</text><g font-family="Arial,sans-serif"><rect x="70" y="90" width="400" height="420" rx="18" fill="#f6f6f6" stroke="#222" stroke-width="3"/><text x="270" y="135" text-anchor="middle" font-size="26" font-weight="700">ADIÇÃO</text><text x="100" y="190" font-size="22" font-weight="700">Comutativa</text><text x="100" y="225" font-size="21">7 + 3 = 3 + 7 = 10</text><text x="100" y="285" font-size="22" font-weight="700">Associativa</text><text x="100" y="320" font-size="21">(2 + 3) + 4 = 2 + (3 + 4)</text><text x="100" y="380" font-size="22" font-weight="700">Elemento neutro</text><text x="100" y="415" font-size="21">a + 0 = a</text><text x="100" y="470" font-size="21">As propriedades ajudam</text><text x="100" y="500" font-size="21">a reorganizar cálculos.</text><rect x="530" y="90" width="400" height="420" rx="18" fill="#f6f6f6" stroke="#222" stroke-width="3"/><text x="730" y="135" text-anchor="middle" font-size="26" font-weight="700">SUBTRAÇÃO</text><text x="560" y="190" font-size="22" font-weight="700">Não comutativa, em geral</text><text x="560" y="225" font-size="21">7 − 3 = 4; 3 − 7 não é natural</text><text x="560" y="285" font-size="22" font-weight="700">Não associativa, em geral</text><text x="560" y="320" font-size="21">(20 − 8) − 3 = 9</text><text x="560" y="350" font-size="21">20 − (8 − 3) = 15</text><text x="560" y="410" font-size="22" font-weight="700">Zero</text><text x="560" y="445" font-size="21">a − 0 = a; a − a = 0</text><text x="500" y="565" text-anchor="middle" font-size="21" font-weight="700">Uma regra válida para somar não deve ser transferida automaticamente para subtrair.</text></g></svg>