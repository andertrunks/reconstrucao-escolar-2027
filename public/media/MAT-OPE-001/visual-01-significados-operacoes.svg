<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Significados da adição e da subtração</title><desc id="desc">Cinco cartões mostram juntar e acrescentar como significados da adição e retirar, comparar e completar como significados da subtração.</desc><rect width="1000" height="620" fill="white"/><text x="500" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Significados das operações</text><text x="250" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">ADIÇÃO</text><text x="750" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">SUBTRAÇÃO</text><g font-family="Arial,sans-serif"><rect x="70" y="125" width="360" height="160" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/><text x="250" y="165" text-anchor="middle" font-size="24" font-weight="700">Juntar</text><text x="250" y="208" text-anchor="middle" font-size="21">18 livros + 12 livros</text><text x="250" y="244" text-anchor="middle" font-size="21">total: 30 livros</text><rect x="70" y="320" width="360" height="160" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/><text x="250" y="360" text-anchor="middle" font-size="24" font-weight="700">Acrescentar</text><text x="250" y="403" text-anchor="middle" font-size="21">25 processos + 7</text><text x="250" y="439" text-anchor="middle" font-size="21">novo total: 32</text><rect x="570" y="125" width="360" height="125" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/><text x="750" y="164" text-anchor="middle" font-size="24" font-weight="700">Retirar</text><text x="750" y="207" text-anchor="middle" font-size="21">42 − 15 = 27</text><rect x="570" y="270" width="360" height="125" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/><text x="750" y="309" text-anchor="middle" font-size="24" font-weight="700">Comparar</text><text x="750" y="352" text-anchor="middle" font-size="21">38 − 29 = diferença 9</text><rect x="570" y="415" width="360" height="125" rx="18" fill="#f4f4f4" stroke="#222" stroke-width="3"/><text x="750" y="454" text-anchor="middle" font-size="24" font-weight="700">Completar</text><text x="750" y="497" text-anchor="middle" font-size="21">de 73 até 100: faltam 27</text><text x="500" y="585" text-anchor="middle" font-size="22" font-weight="700">A relação entre as quantidades determina a operação.</text></g></svg>