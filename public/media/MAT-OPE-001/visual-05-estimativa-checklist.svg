<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Estimativa como controle de plausibilidade</title><desc id="desc">Exemplo aproxima 487 para 500 e 612 para 600, obtendo estimativa 1100 e comparando com resultado exato 1099, seguido de checklist de verificação.</desc><rect width="1000" height="600" fill="white"/><text x="500" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Estimativa: prever e conferir</text><g font-family="Arial,sans-serif"><rect x="70" y="90" width="500" height="390" rx="18" fill="#f6f6f6" stroke="#222" stroke-width="3"/><text x="320" y="145" text-anchor="middle" font-size="26" font-weight="700">487 + 612</text><text x="130" y="205" font-size="23">487 ≈ 500</text><text x="130" y="250" font-size="23">612 ≈ 600</text><line x1="130" y1="275" x2="500" y2="275" stroke="#222" stroke-width="2"/><text x="130" y="320" font-size="24" font-weight="700">Estimativa: ≈ 1.100</text><text x="130" y="370" font-size="24" font-weight="700">Exato: 1.099</text><text x="130" y="425" font-size="21">Valores próximos → resultado plausível.</text><rect x="610" y="90" width="320" height="390" rx="18" fill="#f6f6f6" stroke="#222" stroke-width="3"/><text x="770" y="140" text-anchor="middle" font-size="25" font-weight="700">Checklist</text><text x="645" y="195" font-size="21">1. Escolhi a operação?</text><text x="645" y="245" font-size="21">2. Alinhei as ordens?</text><text x="645" y="295" font-size="21">3. Reagrupei corretamente?</text><text x="645" y="345" font-size="21">4. A ordem de grandeza</text><text x="670" y="375" font-size="21">faz sentido?</text><text x="645" y="425" font-size="21">5. Posso conferir?</text><text x="500" y="555" text-anchor="middle" font-size="21" font-weight="700">Estimativa não substitui o exato; ela ajuda a detectar resultados absurdos.</text></g></svg>