<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Frequência absoluta e frequência relativa</title><desc>Diagrama mostra a contagem seis de vinte transformada na proporção seis sobre vinte, decimal zero vírgula trinta e porcentagem trinta por cento.</desc><rect width="1000" height="560" fill="white"/><text x="55" y="60" font-size="28" font-family="Arial">Absoluta responde “quantos”; relativa responde “qual parte”</text><rect x="80" y="140" width="250" height="160" fill="none" stroke="black" stroke-width="3"/><text x="115" y="205" font-size="25" font-family="Arial">f = 6</text><text x="115" y="250" font-size="20" font-family="Arial">6 estudantes</text><path d="M350 220 L555 220" stroke="black" stroke-width="4"/><path d="M555 220 L525 200 M555 220 L525 240" stroke="black" stroke-width="4"/><rect x="590" y="120" width="330" height="210" fill="none" stroke="black" stroke-width="3"/><text x="625" y="175" font-size="24" font-family="Arial">fr = 6 / 20</text><text x="625" y="225" font-size="24" font-family="Arial">fr = 0,30</text><text x="625" y="275" font-size="24" font-family="Arial">30%</text><text x="85" y="410" font-size="20" font-family="Arial">O denominador 20 é o total de observações válidas usado na distribuição.</text></svg>