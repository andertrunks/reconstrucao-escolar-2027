<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Da lista bruta à tabela de frequência</title><desc>À esquerda, vinte valores de número de livros; uma seta aponta para uma tabela resumida à direita com valores zero a cinco e suas frequências.</desc><rect width="1000" height="560" fill="white"/><text x="40" y="55" font-size="28" font-family="Arial">Da lista bruta à tabela de frequência</text><text x="45" y="105" font-size="20" font-family="Arial">Dados brutos</text><text x="45" y="150" font-size="22" font-family="Arial">2, 0, 1, 3, 2, 1, 1, 4, 0, 2</text><text x="45" y="190" font-size="22" font-family="Arial">3, 1, 2, 5, 0, 1, 2, 3, 1, 2</text><path d="M390 255 L590 255" stroke="black" stroke-width="4"/><path d="M590 255 L560 235 M590 255 L560 275" stroke="black" stroke-width="4"/><text x="640" y="105" font-size="20" font-family="Arial">Tabela resumida</text><text x="640" y="150" font-size="20" font-family="Arial">livros | frequência</text><text x="640" y="190" font-size="20" font-family="Arial">0 | 3</text><text x="640" y="225" font-size="20" font-family="Arial">1 | 6</text><text x="640" y="260" font-size="20" font-family="Arial">2 | 6</text><text x="640" y="295" font-size="20" font-family="Arial">3 | 3</text><text x="640" y="330" font-size="20" font-family="Arial">4 | 1</text><text x="640" y="365" font-size="20" font-family="Arial">5 | 1</text><text x="40" y="500" font-size="18" font-family="Arial">Observe: 20 registros continuam representados; apenas a forma de apresentação mudou.</text></svg>