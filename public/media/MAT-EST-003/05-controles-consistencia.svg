<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Controles de consistência de uma tabela de frequência</title><desc>Quatro caixas mostram as verificações soma das frequências absolutas igual a n, soma das relativas igual a um, soma percentual aproximadamente cem por cento e última acumulada igual a n.</desc><rect width="1000" height="560" fill="white"/><text x="210" y="55" font-size="28" font-family="Arial">Quatro controles antes de confiar na tabela</text><g fill="none" stroke="black" stroke-width="3"><rect x="70" y="115" width="380" height="130"/><rect x="550" y="115" width="380" height="130"/><rect x="70" y="310" width="380" height="130"/><rect x="550" y="310" width="380" height="130"/></g><g font-family="Arial"><text x="120" y="170" font-size="26">Σ f = n</text><text x="120" y="210" font-size="18">Contagens somam o total.</text><text x="600" y="170" font-size="26">Σ fr = 1</text><text x="600" y="210" font-size="18">Proporções somam um.</text><text x="120" y="365" font-size="26">Σ % ≈ 100%</text><text x="120" y="405" font-size="18">Pode haver arredondamento.</text><text x="600" y="365" font-size="26">F final = n</text><text x="600" y="405" font-size="18">A última acumulada fecha o total.</text></g></svg>