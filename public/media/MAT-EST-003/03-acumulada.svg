<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>Frequência acumulada crescente</title><desc>Gráfico de degraus com eixo horizontal número de livros de zero a cinco e eixo vertical frequência acumulada de zero a vinte. Os valores sobem de três até vinte e nunca diminuem.</desc><rect width="1000" height="600" fill="white"/><text x="170" y="50" font-size="28" font-family="Arial">Frequência absoluta acumulada — número de livros</text><line x1="110" y1="500" x2="900" y2="500" stroke="black" stroke-width="3"/><line x1="110" y1="500" x2="110" y2="90" stroke="black" stroke-width="3"/><text x="400" y="560" font-size="20" font-family="Arial">Número de livros</text><text x="20" y="300" font-size="18" font-family="Arial" transform="rotate(-90 20,300)">Frequência acumulada (estudantes)</text><polyline points="140,440 270,320 400,200 530,140 660,120 790,100" fill="none" stroke="black" stroke-width="5"/><g font-family="Arial" font-size="18"><text x="135" y="525">0</text><text x="265" y="525">1</text><text x="395" y="525">2</text><text x="525" y="525">3</text><text x="655" y="525">4</text><text x="785" y="525">5</text><text x="75" y="445">3</text><text x="75" y="325">9</text><text x="65" y="205">15</text><text x="65" y="145">18</text><text x="65" y="105">20</text></g><text x="160" y="585" font-size="16" font-family="Arial">A acumulada termina em n = 20 e não diminui.</text></svg>