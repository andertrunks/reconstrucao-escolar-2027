<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Quando a frequência acumulada faz sentido</title><desc>Dois painéis. O primeiro mostra categorias nominais de transporte sem ordem natural e indica não acumular. O segundo mostra satisfação de ruim a ótimo com ordem e indica que acumular pode fazer sentido.</desc><rect width="1000" height="560" fill="white"/><text x="220" y="55" font-size="28" font-family="Arial">Acumular exige uma ordem significativa</text><rect x="55" y="110" width="400" height="330" fill="none" stroke="black" stroke-width="3"/><text x="95" y="155" font-size="22" font-family="Arial">Nominal: transporte</text><text x="95" y="210" font-size="20" font-family="Arial">ônibus • carro • bicicleta • a pé</text><text x="95" y="270" font-size="20" font-family="Arial">A ordem pode ser trocada.</text><text x="95" y="330" font-size="22" font-family="Arial">Não acumular automaticamente.</text><rect x="545" y="110" width="400" height="330" fill="none" stroke="black" stroke-width="3"/><text x="585" y="155" font-size="22" font-family="Arial">Ordinal: satisfação</text><text x="585" y="210" font-size="20" font-family="Arial">ruim → regular → bom → ótimo</text><text x="585" y="270" font-size="20" font-family="Arial">Existe uma ordem definida.</text><text x="585" y="330" font-size="22" font-family="Arial">“Até regular” tem significado.</text></svg>