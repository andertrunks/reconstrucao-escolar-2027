<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Classes de intervalo sem sobreposição</title><desc>Reta horizontal de zero a trinta dividida nos intervalos zero a menos de dez, dez a menos de vinte e vinte a menos de trinta. Pontos fechados no limite esquerdo e abertos no direito ilustram a convenção.</desc><rect width="1000" height="560" fill="white"/><text x="230" y="60" font-size="28" font-family="Arial">Classes [a, b): inclui a; exclui b</text><line x1="120" y1="280" x2="880" y2="280" stroke="black" stroke-width="4"/><g font-family="Arial" font-size="20"><text x="110" y="330">0</text><text x="350" y="330">10</text><text x="600" y="330">20</text><text x="850" y="330">30</text><text x="155" y="225">[0,10)</text><text x="405" y="225">[10,20)</text><text x="655" y="225">[20,30)</text></g><g stroke="black" stroke-width="3" fill="white"><circle cx="120" cy="280" r="10" fill="black"/><circle cx="370" cy="280" r="10"/><circle cx="370" cy="280" r="7" fill="black"/><circle cx="620" cy="280" r="10"/><circle cx="620" cy="280" r="7" fill="black"/><circle cx="870" cy="280" r="10"/></g><text x="150" y="430" font-size="19" font-family="Arial">Exemplo: 10 pertence à segunda classe; 20 pertence à terceira.</text></svg>