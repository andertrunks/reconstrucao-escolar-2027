<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Aumentar vinte por cento e depois reduzir vinte por cento não volta ao valor inicial</title><desc id="d">Diagrama começa em cem, aumenta vinte por cento para cento e vinte e depois reduz vinte por cento de cento e vinte, isto é, vinte e quatro, chegando a noventa e seis.</desc><rect x="30" y="25" width="840" height="470" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="72" text-anchor="middle" font-size="27" font-family="Arial">Percentuais sucessivos usam bases diferentes</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="175" width="170" height="90" rx="14" fill="none" stroke="currentColor" stroke-width="4"/><text x="175" y="215" font-size="27">100</text><text x="175" y="245" font-size="19">valor inicial</text><path d="M270 220H390" stroke="currentColor" stroke-width="3"/><text x="330" y="190" font-size="20">+20%</text><rect x="400" y="175" width="170" height="90" rx="14" fill="none" stroke="currentColor" stroke-width="4"/><text x="485" y="215" font-size="27">120</text><text x="485" y="245" font-size="19">nova base</text><path d="M580 220H700" stroke="currentColor" stroke-width="3"/><text x="640" y="190" font-size="20">−20%</text><rect x="710" y="175" width="120" height="90" rx="14" fill="none" stroke="currentColor" stroke-width="4"/><text x="770" y="215" font-size="27">96</text><text x="770" y="245" font-size="18">resultado</text></g><text x="450" y="340" text-anchor="middle" font-size="23" font-family="Arial">20% de 100 = 20; 20% de 120 = 24.</text><text x="450" y="390" text-anchor="middle" font-size="22" font-family="Arial">O mesmo percentual pode representar parcelas diferentes quando a base muda.</text></svg>