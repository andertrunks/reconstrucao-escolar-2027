<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Fluxo para calcular um acréscimo percentual simples</title><desc id="d">Fluxograma mostra quatro passos: identificar o valor inicial, calcular a porcentagem desse valor, somar o acréscimo e verificar se o resultado ficou maior.</desc><rect x="30" y="25" width="840" height="470" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="70" text-anchor="middle" font-size="28" font-family="Arial">Acréscimo percentual: quatro passos</text><g font-family="Arial" text-anchor="middle"><rect x="240" y="105" width="420" height="60" rx="12" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="143" font-size="22">1. Identifique o valor inicial</text><path d="M450 165V195" stroke="currentColor" stroke-width="3"/><rect x="220" y="195" width="460" height="60" rx="12" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="233" font-size="22">2. Calcule p% do valor inicial</text><path d="M450 255V285" stroke="currentColor" stroke-width="3"/><rect x="220" y="285" width="460" height="60" rx="12" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="323" font-size="22">3. Some a parcela percentual</text><path d="M450 345V375" stroke="currentColor" stroke-width="3"/><rect x="210" y="375" width="480" height="65" rx="12" fill="none" stroke="currentColor" stroke-width="4"/><text x="450" y="405" font-size="22">4. Verifique: o resultado deve ser maior</text><text x="450" y="430" font-size="19">se p for positivo</text></g></svg>