<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Decréscimo de vinte por cento sobre um valor de cem</title><desc id="d">Uma barra representa cem unidades. Ao lado, outra barra representa oitenta unidades, mostrando que retirar vinte por cento do valor inicial de cem produz oitenta.</desc><rect x="30" y="25" width="840" height="450" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="75" text-anchor="middle" font-size="28" font-family="Arial">Decréscimo de 20%: o novo valor fica menor</text><rect x="150" y="145" width="300" height="70" fill="none" stroke="currentColor" stroke-width="4"/><text x="300" y="190" text-anchor="middle" font-size="28" font-family="Arial">100%</text><text x="300" y="245" text-anchor="middle" font-size="22" font-family="Arial">valor inicial = 100</text><rect x="540" y="145" width="240" height="70" fill="none" stroke="currentColor" stroke-width="4"/><text x="660" y="190" text-anchor="middle" font-size="28" font-family="Arial">80</text><text x="660" y="245" text-anchor="middle" font-size="22" font-family="Arial">100 − 20 = 80</text><text x="450" y="340" text-anchor="middle" font-size="24" font-family="Arial">Desconto de 20% significa retirar 20% do valor de referência.</text><text x="450" y="390" text-anchor="middle" font-size="22" font-family="Arial">O novo valor corresponde a 80% do inicial.</text></svg>