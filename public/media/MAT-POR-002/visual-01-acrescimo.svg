<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Acréscimo de vinte por cento sobre um valor de cem</title><desc id="d">Uma barra representa cem unidades. Ao lado, outra barra representa cento e vinte unidades, formada pelo valor original de cem mais um acréscimo de vinte.</desc><rect x="30" y="25" width="840" height="450" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="75" text-anchor="middle" font-size="28" font-family="Arial">Acréscimo de 20%: o novo valor fica maior</text><rect x="150" y="145" width="250" height="70" fill="none" stroke="currentColor" stroke-width="4"/><text x="275" y="190" text-anchor="middle" font-size="28" font-family="Arial">100%</text><text x="275" y="245" text-anchor="middle" font-size="22" font-family="Arial">valor inicial = 100</text><rect x="500" y="145" width="250" height="70" fill="none" stroke="currentColor" stroke-width="4"/><rect x="750" y="145" width="50" height="70" fill="none" stroke="currentColor" stroke-width="4"/><text x="625" y="190" text-anchor="middle" font-size="28" font-family="Arial">100</text><text x="775" y="190" text-anchor="middle" font-size="24" font-family="Arial">+20</text><text x="650" y="275" text-anchor="middle" font-size="25" font-family="Arial">100 + 20 = 120</text><text x="450" y="360" text-anchor="middle" font-size="24" font-family="Arial">20% de acréscimo não é “20% do novo valor”.</text><text x="450" y="405" text-anchor="middle" font-size="22" font-family="Arial">A porcentagem é calculada sobre o valor inicial de referência.</text></svg>