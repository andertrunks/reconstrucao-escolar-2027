<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="titulo descricao"><title id="titulo">Cadeia de evidências — do plano à decisão</title><desc id="descricao">Seis etapas, plano, previsão, observado, pareamento, métrica com guarda e decisão documentada.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#17334b}.ttl{font-size:26px;font-weight:bold}.note{font-size:17px}.box{fill:#e5f2fa;stroke:#24516a;stroke-width:2}.pending{fill:#ffedce;stroke:#815300;stroke-width:2}.strong{font-weight:bold}.barB{fill:#5d8ba0}.barC{fill:#dbb471}.axis{stroke:#263f56;stroke-width:2}</style><rect width="1000" height="470" fill="#fff"/><text x="34" y="42" class="ttl">Cadeia de evidências — do plano à decisão</text><rect x="35" y="150" width="147" height="115" rx="12" class="box"/><text x="48" y="185" font-size="18" class="strong">1. Plano</text><text x="48" y="214" class="note">seis tarefas</text><rect x="195" y="150" width="147" height="115" rx="12" class="box"/><text x="208" y="185" font-size="18" class="strong">2. Previsão</text><text x="208" y="214" class="note">fixada</text><rect x="355" y="150" width="147" height="115" rx="12" class="box"/><text x="368" y="185" font-size="18" class="strong">3. Observado</text><text x="368" y="214" class="note">com versão</text><rect x="515" y="150" width="147" height="115" rx="12" class="box"/><text x="528" y="185" font-size="18" class="strong">4. Pares</text><text x="528" y="214" class="note">elegíveis</text><rect x="675" y="150" width="147" height="115" rx="12" class="box"/><text x="688" y="185" font-size="18" class="strong">5. Métrica</text><text x="688" y="214" class="note">e guarda</text><rect x="835" y="150" width="147" height="115" rx="12" class="box"/><text x="848" y="185" font-size="18" class="strong">6. Decisão</text><text x="848" y="214" class="note">com limites</text><text x="35" y="330" class="note">Cada ligação exige origem e identificação; nenhuma ausência vira número zero.</text></svg>