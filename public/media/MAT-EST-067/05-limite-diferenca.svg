<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="titulo descricao"><title id="titulo">Limite algébrico, não intervalo de confiança</title><desc id="descricao">Eixo horizontal da diferença média C menos B em kits, com limite inferior menos um e superior zero, sob seis tarefas e previsões fixas.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#17334b}.ttl{font-size:26px;font-weight:bold}.note{font-size:17px}.box{fill:#e5f2fa;stroke:#24516a;stroke-width:2}.pending{fill:#ffedce;stroke:#815300;stroke-width:2}.strong{font-weight:bold}.barB{fill:#5d8ba0}.barC{fill:#dbb471}.axis{stroke:#263f56;stroke-width:2}</style><rect width="1000" height="470" fill="#fff"/><text x="34" y="42" class="ttl">Limite algébrico, não intervalo de confiança</text><text x="75" y="93" class="note">Eixo X: média completa (MAE C − MAE B), kits</text><line x1="130" y1="260" x2="890" y2="260" class="axis"/><line x1="130" y1="240" x2="130" y2="281" class="axis"/><line x1="890" y1="240" x2="890" y2="281" class="axis"/><line x1="130" y1="260" x2="890" y2="260" stroke="#215e8a" stroke-width="10"/><circle cx="130" cy="260" r="10" fill="#215e8a"/><circle cx="890" cy="260" r="10" fill="#215e8a"/><text x="130" y="222" text-anchor="middle" font-size="24" class="strong">−1 kit</text><text x="890" y="222" text-anchor="middle" font-size="24" class="strong">0 kit</text><text x="510" y="330" text-anchor="middle" class="note">Possibilidades condicionais; observado de D05/D06 continua desconhecido.</text><text x="90" y="398" class="note">Derivação: soma observada −3; faltantes juntos entre −3 e +3; dividir por seis.</text></svg>