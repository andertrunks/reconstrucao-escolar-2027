<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d"><title id="t">Palavras-chave como mapa de busca</title><desc id="d">Seis pares relacionam tipos de pergunta a tipos de informação: quem a pessoa, quando a tempo, onde a lugar, quanto a quantidade, qual a identificação e como a modo.</desc><rect width="960" height="350" fill="white"/><g font-family="sans-serif" text-anchor="middle"><text x="480" y="42" font-size="25" font-weight="700">A pergunta indica o tipo de informação procurada</text><g font-size="20" font-weight="700"><text x="160" y="115">QUEM?</text><text x="480" y="115">QUANDO?</text><text x="800" y="115">ONDE?</text><text x="160" y="230">QUANTO?</text><text x="480" y="230">QUAL?</text><text x="800" y="230">COMO?</text></g><g font-size="18"><text x="160" y="150">pessoa ou grupo</text><text x="480" y="150">data ou horário</text><text x="800" y="150">lugar</text><text x="160" y="265">quantidade ou valor</text><text x="480" y="265">identificação</text><text x="800" y="265">modo ou procedimento</text></g><g stroke="#444"><line x1="160" y1="165" x2="160" y2="195"/><line x1="480" y1="165" x2="480" y2="195"/><line x1="800" y1="165" x2="800" y2="195"/></g><text x="480" y="320" font-size="18">Use a palavra-chave da pergunta para orientar a releitura.</text></g></svg>