<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Informação explícita e inferência</title><desc id="d">Dois blocos com uma frase-base. O primeiro lista o que está escrito; o segundo mostra uma conclusão provável, mas não declarada.</desc><rect width="960" height="360" fill="white"/><g font-family="sans-serif"><text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700">O que está escrito e o que foi concluído</text><text x="480" y="86" text-anchor="middle" font-size="20">“Carlos saiu com guarda-chuva e voltou com os sapatos molhados.”</text><rect x="60" y="130" width="360" height="150" rx="12" fill="none" stroke="#222" stroke-width="2"/><rect x="540" y="130" width="360" height="150" rx="12" fill="none" stroke="#222" stroke-width="2"/><text x="240" y="165" text-anchor="middle" font-size="21" font-weight="700">Explícito</text><text x="720" y="165" text-anchor="middle" font-size="21" font-weight="700">Inferência</text><text x="90" y="205" font-size="18">• saiu com guarda-chuva</text><text x="90" y="238" font-size="18">• voltou com sapatos molhados</text><text x="570" y="210" font-size="18">• provavelmente choveu</text><text x="570" y="243" font-size="16">(plausível, mas não está escrito)</text><text x="480" y="325" text-anchor="middle" font-size="19">Leitura literal exige evidência textual direta.</text></g></svg>