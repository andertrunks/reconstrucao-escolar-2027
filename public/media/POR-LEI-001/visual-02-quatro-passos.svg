<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">Estratégia de quatro passos para localizar informação explícita</title><desc id="d">Fluxo horizontal com quatro etapas: ler a pergunta, identificar o que ela pede, localizar o trecho e responder apenas com o que o texto sustenta.</desc><rect width="960" height="340" fill="white"/><g font-family="sans-serif" text-anchor="middle"><text x="480" y="42" font-size="25" font-weight="700">Quatro passos para encontrar a resposta literal</text><g fill="none" stroke="#222" stroke-width="2"><rect x="30" y="120" width="190" height="100" rx="10"/><rect x="270" y="120" width="190" height="100" rx="10"/><rect x="510" y="120" width="190" height="100" rx="10"/><rect x="750" y="120" width="180" height="100" rx="10"/></g><g font-size="19" font-weight="700"><text x="125" y="158">1. Ler</text><text x="365" y="158">2. Identificar</text><text x="605" y="158">3. Localizar</text><text x="840" y="158">4. Responder</text></g><g font-size="15"><text x="125" y="190">a pergunta</text><text x="365" y="190">o tipo de dado</text><text x="605" y="190">o trecho exato</text><text x="840" y="190">só com evidência</text></g><g font-size="32"><text x="245" y="178">→</text><text x="485" y="178">→</text><text x="725" y="178">→</text></g><text x="480" y="285" font-size="19">Pergunta → busca orientada → evidência textual → resposta fiel.</text></g></svg>