<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">MAE separado por horizonte e procedimento</title><desc id="desc">Gráfico de barras agrupadas: horizonte um e horizonte dois no eixo horizontal, MAE em unidades no eixo vertical (zero a vinte e dois).</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.5}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.5}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.4}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}.green{stroke:#39775d;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">MAE separado por horizonte e procedimento</text><text x="28" y="83" class="small" text-anchor="start">Erro absoluto médio (MAE). Eixo vertical: unidades.</text><line x1="91" y1="117" x2="91" y2="386" class="axis"/><line x1="91" y1="386" x2="900" y2="386" class="axis"/><line x1="91" y1="386.0" x2="900" y2="386.0" class="gridline"/><text x="79" y="390.0" class="small" text-anchor="end">0</text><line x1="91" y1="324.8636363636364" x2="900" y2="324.8636363636364" class="gridline"/><text x="79" y="328.8636363636364" class="small" text-anchor="end">5</text><line x1="91" y1="263.72727272727275" x2="900" y2="263.72727272727275" class="gridline"/><text x="79" y="267.72727272727275" class="small" text-anchor="end">10</text><line x1="91" y1="202.5909090909091" x2="900" y2="202.5909090909091" class="gridline"/><text x="79" y="206.5909090909091" class="small" text-anchor="end">15</text><line x1="91" y1="141.45454545454547" x2="900" y2="141.45454545454547" class="gridline"/