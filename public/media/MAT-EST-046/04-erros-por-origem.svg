<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Erros do Holt-Winters por origem e horizonte</title><desc id="desc">Gráfico de colunas assinado com eixo y de −3 a +3 unidades e eixo x origem t8, t9, t10; dois horizontes por origem.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.5}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.5}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.4}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}.green{stroke:#39775d;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Erros do Holt-Winters por origem e horizonte</text><text x="31" y="84" class="small" text-anchor="start">Erro = observado menos previsto; eixo vertical em unidades.</text><line x1="100" y1="115" x2="100" y2="363" class="axis"/><line x1="100" y1="241" x2="887" y2="241" class="axis"/><line x1="100" y1="343" x2="887" y2="343" class="gridline"/><text x="86" y="347" class="small" text-anchor="end">-3</text><line x1="100" y1="309" x2="887" y2="309" class="gridline"/><text x="86" y="313" class="small" text-anchor="end">-2</text><line x1="100" y1="275" x2="887" y2="275" class="gridline"/><text x="86" y="279" class="small" text-anchor="end">-1</text><line x1="100" y1="241" x2="887" y2="241" class="gridline"/><text x="86" y="245" class="small" text-anchor="end">0</text><line x1="100" y1="207" x2="887" y2="207" class="gridline"/><text x="86" y="211" class="small" text-anchor="end">1</text><line x1="100" y1="173" x2="887" y2="173" class="gridline"/><text x="86" y="177" class="small" text-anchor="end">2</text><line x1="100" y1="139" x2="887" y2="139" class="gridline"/><text x="86" y="143" class="small" text-anchor="end">3</text><rect x="196" y="241.00" width="35" height="67.75" fill="#206a90"/><text x="213" y="327.74608255999897" class="tiny" text-anchor="middle">−1,99</text><rect x="242" y="241.00" width="35" height="76.91" fill="#a4631b"/><text x="259" y="336.9054323199992" class="tiny" text-anchor="middle">−2,26</text><text x="237" y="395" class="label" text-anchor="middle">Origem t8</text><rect x="445" y="241.00" width="35" height="52.52" fill="#206a90"/><text x="462" y="312.516842598399" class="tiny" text-anchor="middle">−1,54</text><rect x="491" y="166.08" width="35" height="74.92" fill="#a4631b"/><text x="508" y="158.0767074047988" class="tiny" text-anchor="middle">+2,20</text><text x="486" y="395" class="label" text-anchor="middle">Origem t9</text><rect x="694" y="147.17" width="35" height="93.83" fill="#206a90"/><text x="711" y="139.17064406937396" class="tiny" text-anchor="middle">+2,76</text><rect x="740" y="241.00" width="35" height="33.90" fill="#a4631b"/><text x="757" y="293.89615751986923" class="tiny" text-anchor="middle">−1,00</text><text x="735" y="395" class="label" text-anchor="middle">Origem t10</text><text x="106" y="434" class="small" text-anchor="start">H1 = barra azul-escura; H2 = barra marrom. O sinal é explicitado junto a cada valor.</text></svg>