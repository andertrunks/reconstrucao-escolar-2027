<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Protocolo: previsão, avaliação e relatório</title><desc id="desc">Seis cartões em sequência, da definição da origem até o relato de limitações, e aviso explícito sobre seleção nos próprios dados de avaliação.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.5}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.5}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.4}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}.green{stroke:#39775d;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Protocolo: previsão, avaliação e relatório</text><text x="35" y="85" class="label" text-anchor="start">Fluxo auditável de uma tarefa de previsão:</text><rect x="28" y="124" width="288" height="103" rx="9" class="panel"/><text x="41" y="160" class="label" text-anchor="start">1. Definir origem</text><text x="41" y="191" class="small" text-anchor="start">Somente prefixo disponível</text><rect x="337" y="124" width="288" height="103" rx="9" class="panel"/><text x="350" y="160" class="label" text-anchor="start">2. Ajustar estados</text><text x="350" y="191" class="small" text-anchor="start">Mesmos parâmetros fixos</text><rect x="646" y="124" width="288" height="103" rx="9" class="panel"/><text x="659" y="160" class="label" text-anchor="start">3. Emitir h1 / h2</text><text x="659" y="191" class="small" text-anchor="start">Guardar previsão e data</text><rect x="28" y="265" width="288" height="103" rx="9" class="warm"/><text x="41" y="301" class="label" text-anchor="start">4. Observar o alvo</text><text x="41" y="332" class="small" text-anchor="start">Só depois medir erro</text><rect x="337" y="265" width="288" height="103" rx="9" class="warm"/><text x="350" y="301" class="label" text-anchor="start">5. Resumir por h</text><text x="350" y="332" class="small" text-anchor="start">MAE, RMSE, cobertura</text><rect x="646" y="265" width="288" height="103" rx="9" class="warm"/><text x="659" y="301" class="label" text-anchor="start">6. Relatar limites</text><text x="659" y="332" class="small" text-anchor="start">Amostra curta e sobreposta</text><text x="37" y="430" class="small" text-anchor="start">Proibido: escolher alfa com os erros avaliados e anunciar a mesma avaliação como teste intacto.</text></svg>