<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Janelas expansivas no calendário trimestral</title><desc id="desc">Três linhas de janelas cronológicas de tamanho oito, nove e dez; os parâmetros de Holt-Winters são fixos e os estados são atualizados só com o prefixo.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.5}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.5}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.4}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}.green{stroke:#39775d;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Janelas expansivas no calendário trimestral</text><text x="32" y="85" class="small" text-anchor="start">O histórico fica maior; a regra de inicialização e os três parâmetros não mudam.</text><text x="39" y="149" class="label" text-anchor="start">Corte t8</text><rect x="162" y="121" width="54" height="48" rx="9" class="panel"/><text x="189" y="150" class="small" text-anchor="middle">1</text><rect x="226" y="121" width="54" height="48" rx="9" class="panel"/><text x="253" y="150" class="small" text-anchor="middle">2</text><rect x="290" y="121" width="54" height="48" rx="9" class="panel"/><text x="317" y="150" class="small" text-anchor="middle">3</text><rect x="354" y="121" width="54" height="48" rx="9" class="panel"/><text x="381" y="150" class="small" text-anchor="middle">4</text><rect x="418" y="121" width="54" height="48" rx="9" class="panel"/><text x="445" y="150" class="small" text-anchor="middle">5</text><rect x="482" y="121" width="54" height="48" rx="9" class="panel"/><text x="509" y="150" class="small" text-anchor="middle">6</text><rect x="546" y="121" width="54" height="48" rx="9" class="panel"/><text x="573" y="150" class="small" text-anchor="middle">7</text><rect x="610" y="121" width="54" height="48" rx="9" class="panel"/><text x="637" y="150" class="small" text-anchor="middle">8</text><rect x="674" y="121" width="54" height="48" rx="9" class="warm"/><text x="701" y="150" class="small" text-anchor="middle">h1</text><rect x="738" y="121" width="54" height="48" rx="9" class="warm"/><text x="765" y="150" class="small" text-anchor="middle">h2</text><rect x="802" y="121" width="54" height="48" rx="9" class="neutral"/><text x="829" y="150" class="small" text-anchor="middle">·</text><rect x="866" y="121" width="54" height="48" rx="9" class="neutral"/><text x="893" y="150" class="small" text-anchor="middle">·</text><text x="162" y="190" class="small" text-anchor="start">Treino = 8 observações; alvos = t9, t10.</text><text x="39" y="250" class="label" text-anchor="start">Corte t9</text><rect x="162" y="222" width="54" height="48" rx="9" class="panel"/><text x="189" y="251" class="small" text-anchor="middle">1</text><rect x="226" y="222" width="54" height="48" rx="9" class="panel"/><text x="253" y="251" class="small" text-anchor="middle">2</text><rect x="290" y="222" width="54" height="48" rx="9" class="panel"/><text x="317" y="251" class="small" text-anchor="middle">3</text><rect x="354" y="222" width="54" height="48" rx="9" class="panel"/><text x="381" y="251" class="small" text-anchor="middle">4</text><rect x="418" y="222" width="54" height="48" rx="9" class="panel"/><text x="445" y="251" class="small" text-anchor="middle">5</text><rect x="482" y="222" width="54" height="48" rx="9" class="panel"/><text x="509" y="251" class="small" text-anchor="middle">6</text><rect x="546" y="222" width="54" height="48" rx="9" class="panel"/><text x="573" y="251" class="small" text-anchor="middle">7</text><rect x="