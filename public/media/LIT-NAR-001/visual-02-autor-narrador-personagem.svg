<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Autor real, narrador e personagem</title><desc id="d">Três níveis separados mostram o autor real fora do universo ficcional, o narrador que organiza o relato e as personagens que agem na história.</desc>
<rect width="1200" height="700" fill="#fff"/><g fill="#fff" stroke="#111" stroke-width="3"><rect x="100" y="80" width="1000" height="150" rx="18"/><rect x="180" y="275" width="840" height="150" rx="18"/><rect x="260" y="470" width="680" height="150" rx="18"/></g>
<g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="600" y="135" font-size="34" font-weight="700">AUTOR REAL</text><text x="600" y="185" font-size="24">pessoa histórica que produz a obra</text><text x="600" y="330" font-size="34" font-weight="700">NARRADOR</text><text x="600" y="380" font-size="24">voz textual que organiza o relato</text><text x="600" y="525" font-size="34" font-weight="700">PERSONAGENS</text><text x="600" y="575" font-size="24">seres que agem no universo narrativo</text></g>
<g stroke="#111" stroke-width="3"><path d="M600 230 v45"/><path d="M600 425 v45"/></g><text x="600" y="670" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">Não transforme automaticamente a voz do narrador em biografia do autor.</text></svg>