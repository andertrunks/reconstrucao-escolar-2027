<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">O espaço modifica tensão e possibilidades de ação</title><desc id="d">À esquerda uma estação movimentada com muitas pessoas e saídas; à direita uma estrada isolada à noite com pouca ajuda. A mesma situação muda conforme o espaço.</desc>
<rect width="1200" height="700" fill="#fff"/><line x1="600" y1="100" x2="600" y2="620" stroke="#111" stroke-width="3"/>
<g font-family="Arial,sans-serif" fill="#111"><text x="300" y="80" text-anchor="middle" font-size="32" font-weight="700">ESTAÇÃO MOVIMENTADA</text><text x="900" y="80" text-anchor="middle" font-size="32" font-weight="700">ESTRADA ISOLADA</text></g>
<g stroke="#111" fill="none" stroke-width="3"><rect x="100" y="160" width="400" height="300"/><path d="M150 390 h300"/><path d="M180 300 v90 M260 300 v90 M340 300 v90 M420 300 v90"/><circle cx="180" cy="270" r="18"/><circle cx="260" cy="270" r="18"/><circle cx="340" cy="270" r="18"/><circle cx="420" cy="270" r="18"/><path d="M700 450 Q900 320 1100 450"/><path d="M700 520 Q900 390 1100 520"/><circle cx="870" cy="350" r="24"/><path d="M870 374 v85"/></g>
<g font-family="Arial,sans-serif" fill="#111" font-size="23" text-anchor="middle"><text x="300" y="510">muitas pessoas • várias saídas • exposição pública</text><text x="900" y="570">pouca ajuda • poucas saídas • maior isolamento</text><text x="600" y="660" font-size="22">O cenário pode permitir, impedir ou intensificar ações e conflitos.</text></g></svg>