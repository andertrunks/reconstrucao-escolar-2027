<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Mapa dos elementos fundamentais da narrativa</title><desc id="d">Narrativa no centro ligada a enredo, narrador, personagens, tempo e espaço, com setas de relação entre os elementos.</desc>
<rect width="1200" height="700" fill="#fff"/><g fill="#fff" stroke="#111" stroke-width="3"><rect x="430" y="280" width="340" height="130" rx="18"/><rect x="80" y="90" width="260" height="100" rx="14"/><rect x="470" y="60" width="260" height="100" rx="14"/><rect x="860" y="90" width="260" height="100" rx="14"/><rect x="170" y="500" width="260" height="100" rx="14"/><rect x="770" y="500" width="260" height="100" rx="14"/></g>
<g stroke="#111" stroke-width="3" fill="none"><path d="M430 310 L330 190"/><path d="M550 280 L600 160"/><path d="M770 310 L870 190"/><path d="M480 410 L380 500"/><path d="M720 410 L820 500"/></g>
<g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="600" y="340" font-size="38" font-weight="700">NARRATIVA</text><text x="600" y="380" font-size="22">elementos em relação</text><text x="210" y="150" font-size="30" font-weight="700">ENREDO</text><text x="600" y="120" font-size="30" font-weight="700">NARRADOR</text><text x="990" y="150" font-size="28" font-weight="700">PERSONAGENS</text><text x="300" y="560" font-size="30" font-weight="700">TEMPO</text><text x="900" y="560" font-size="30" font-weight="700">ESPAÇO</text></g>
<text x="600" y="660" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#111">A mudança em um elemento pode alterar o efeito dos demais.</text></svg>