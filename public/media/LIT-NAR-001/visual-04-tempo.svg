<title id="t">Tempo cronológico e tempo psicológico</title><desc id="d">Duas linhas representam os mesmos dez minutos: a cronológica tem intervalos iguais; a psicológica expande os minutos finais para mostrar espera subjetivamente longa.</desc>
<rect width="1200" height="700" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="110" y="150" font-size="30" font-weight="700">TEMPO CRONOLÓGICO</text><text x="110" y="400" font-size="30" font-weight="700">TEMPO PSICOLÓGICO</text></g>
<g stroke="#111" stroke-width="4"><line x1="110" y1="230" x2="1090" y2="230"/><line x1="110" y1="480" x2="1090" y2="480"/></g>
<g stroke="#111" stroke-width="3"><path d="M110 210v40 M208 210v40 M306 210v40 M404 210v40 M502 210v40 M600 210v40 M698 210v40 M796 210v40 M894 210v40 M992 210v40 M1090 210v40"/><path d="M110 460v40 M170 460v40 M230 460v40 M290 460v40 M350 460v40 M430 460v40 M530 460v40 M650 460v40 M790 460v40 M940 460v40 M1090 460v40"/></g>
<g font-family="Arial,sans-serif" font-size="20" fill="#111"><text x="110" y="285">0 min</text><text x="1040" y="285">10 min</text><text x="110" y="535">0 min</text><text x="1025" y="535">10 min</text><text x="600" y="610" text-anchor="middle" font-size="24">Mesma duração objetiva; experiência subjetiva diferente.</text></g></svg>