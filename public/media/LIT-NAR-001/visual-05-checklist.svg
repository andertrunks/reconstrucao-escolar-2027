<g font-family="Arial,sans-serif" fill="#111" text-anchor="middle" font-size="24"><text x="220" y="108">1. O que muda?</text><text x="600" y="108">2. Qual é o enredo?</text><text x="980" y="108">3. Qual é o conflito?</text><text x="980" y="287">4. Quem narra?</text><text x="600" y="287">5. Como são as personagens?</text><text x="220" y="287">6. Onde e quando?</text><text x="600" y="512" font-weight="700">7. Que efeito essas</text><text x="600" y="545" font-weight="700">escolhas produzem?</text></g><text x="600" y="650" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">Evidência primeiro; interpretação depois.</text></svg>