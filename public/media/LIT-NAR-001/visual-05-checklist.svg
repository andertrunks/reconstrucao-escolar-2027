<title id="t">Checklist de leitura narrativa</title><desc id="d">Fluxo em sete passos: identificar mudança, reconstruir enredo, localizar conflito, analisar narrador, observar personagens, situar tempo e espaço, explicar efeito de sentido.</desc>
