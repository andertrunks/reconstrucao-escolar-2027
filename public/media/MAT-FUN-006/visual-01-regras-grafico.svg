<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Função por partes: inclinações distintas</title><desc id="d">Primeiro trecho x+2 para x menor que 3; segundo 2x−1 para x maior ou igual a 3.</desc><rect width="900" height="520" fill="#fff"/><g fill="#142239" font-family="Arial,sans-serif"><text x="28" y="36" font-weight="bold" font-size="23">Função por partes: inclinações distintas</text><text x="28" y="64" font-size="14">Primeiro trecho x+2 para x menor que 3; segundo 2x−1 para x maior ou igual a 3.</text></g><g stroke="#263342" stroke-width="2" fill="none"><path d="M95 435 H795 M95 435 V105"/></g><text x="54" y="100" font-family="Arial,sans-serif" font-size="17" fill="#142239">y</text><text x="802" y="442" font-family="Arial,sans-serif" font-size="17" fill="#142239">x</text><text x="421" y="458" font-family="Arial,sans-serif" font-size="17" fill="#142239">3</text><text x="62" y="303" font-family="Arial,sans-serif" font-size="17" fill="#142239">5</text><path d="M95.0 380.0 L445.0 297.5" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 6"/><path d="M445.0 297.5 L795.0 132.5" fill="none" stroke="#a83232" stroke-width="4" /><circle cx="445.0" cy="297.5" r="7" stroke="#2563eb" stroke-width="3" fill="#fff"/><circle cx="445.0" cy="297.5" r="7" stroke="#a83232" stroke-width="3" fill="#a83232"/><text x="165" y="340" font-family="Arial,sans-serif" font-size="17" fill="#142239">x+2; x &lt; 3</text><text x="570" y="155" font-family="Arial,sans-serif" font-size="17" fill="#142239">2x−1; x ≥ 3</text><g font-family="Arial,sans-serif" font-size="16" fill="#142239"><text x="350" y="500">x — entrada; y — saída</text></g></svg>