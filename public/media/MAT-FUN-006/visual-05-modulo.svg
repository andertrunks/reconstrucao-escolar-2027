<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Valor absoluto: gráfico em V</title><desc id="d">O módulo é −x quando x é negativo e x quando x é não negativo.</desc><rect width="900" height="520" fill="#fff"/><g fill="#142239" font-family="Arial,sans-serif"><text x="28" y="36" font-weight="bold" font-size="23">Valor absoluto: gráfico em V</text><text x="28" y="64" font-size="14">O módulo é −x quando x é negativo e x quando x é não negativo.</text></g><g stroke="#263342" stroke-width="2" fill="none"><path d="M95 435 H795 M95 435 V105"/></g><text x="54" y="102" font-family="Arial,sans-serif" font-size="17" fill="#142239">|x|</text><text x="805" y="441" font-family="Arial,sans-serif" font-size="17" fill="#142239">x</text><text x="432" y="456" font-family="Arial,sans-serif" font-size="17" fill="#142239">0</text><text x="150" y="456" font-family="Arial,sans-serif" font-size="17" fill="#142239">−4</text><text x="696" y="456" font-family="Arial,sans-serif" font-size="17" fill="#142239">4</text><path d="M95.0 160.0 L445.0 435.0" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="9 5"/><path d="M445.0 435.0 L795.0 160.0" fill="none" stroke="#a83232" stroke-width="4" /><circle cx="445.0" cy="435.0" r="7" stroke="#132033" stroke-width="3" fill="#132033"/><text x="190" y="185" font-family="Arial,sans-serif" font-size="17" fill="#142239">−x, para x &lt; 0</text><text x="586" y="185" font-family="Arial,sans-serif" font-size="17" fill="#142239">x, para x ≥ 0</text><g font-family="Arial,sans-serif" font-size="16" fill="#142239"><text x="350" y="500">x — número real; |x| — distância a zero</text></g></svg>