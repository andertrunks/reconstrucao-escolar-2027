<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">ESTACIONAMENTO: PREÇOS EM DEGRAUS</title><desc id="desc">Passar de uma faixa de horas para outra muda o preço de uma vez</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082c61"/><stop offset="1" stop-color="#0b62ab"/></linearGradient></defs><rect x="12" y="10" width="1576" height="113" rx="17" fill="url(#blue)" /><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="40" font-weight="700" fill="#fff">ESTACIONAMENTO: PREÇOS EM DEGRAUS</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e5f2ff">Passar de uma faixa de horas para outra muda o preço de uma vez</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="65" rx="16" fill="#075bbb" /><rect x="20" y="189" width="508" height="16" rx="0" fill="#075bbb" /><circle cx="55" cy="173" r="23" fill="#fff" opacity=".22"/><text x="55" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="92" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Primeira faixa</text><text x="44" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Para 0 &lt; h ≤ 1 hora:</text><text x="44" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">preço fixo de R$ 8.</text><text x="44" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Uma hora exata ainda paga 8.</text><rect x="42" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="274" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">P(h) = R$ 8</text><text x="44" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Inclui h = 1.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#ebfaef" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="65" rx="16" fill="#078a55" /><rect x="546" y="189" width="508" height="16" rx="0" fill="#078a55" /><circle cx="581" cy="173" r="23" fill="#fff" opacity=".22"/><text x="581" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="618" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Segunda faixa</text><text x="570" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Para 1 &lt; h ≤ 2 horas:</text><text x="570" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">preço fixo de R$ 12.</text><text x="570" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Duas horas exatas pagam 12.</text><rect x="568" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="800" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">P(h) = R$ 12</text><text x="570" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">Inclui h = 2.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#ed7b18" stroke-width="2"/><rect x="1072" y="140" width="508" height="65" rx="16" fill="#ed7b18" /><rect x="1072" y="189" width="508" height="16" rx="0" fill="#ed7b18" /><circle cx="1107" cy="173" r="23" fill="#fff" opacity=".22"/><text x="1107" y="182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1144" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Terceira faixa</text><text x="1096" y="254" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Para 2 &lt; h ≤ 3 horas:</text><text x="1096" y="289" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">preço fixo de R$ 16.</text><text x="1096" y="324" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Após 3 horas, não há regra.</text><rect x="1094" y="368" width="464" height="66" rx="12" fill="#fff" /><text x="1326" y="409" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">P(h) = R$ 16</text><text x="1096" y="479" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ed7b18">Modelo só até 3 horas.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ecff" stroke="#863fc8" stroke-width="2"/><rect x="20" y="520" width="508" height="65" rx="16" fill="#863fc8" /><rect x="20" y="569" width="508" height="16" rx="0" fill="#863fc8" /><circle cx="55" cy="553" r="23" fill="#fff" opacity=".22"/><text x="55" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="92" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Valores de exemplo</text><text x="44" y="634" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">P(0,5)=8 e P(1)=8.</text><text x="44" y="669" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">P(1,5)=12 e P(2)=12.</text><text x="44" y="704" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">P(2,5)=16 e P(3)=16.</text><rect x="42" y="748" width="464" height="66" rx="12" fill="#fff" /><text x="274" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">8 → 12 → 16</text><text x="44" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#863fc8">Aumentos discretos nos limites.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffedef" stroke="#d93952" stroke-width="2"/><rect x="546" y="520" width="508" height="65" rx="16" fill="#d93952" /><rect x="546" y="569" width="508" height="16" rx="0" fill="#d93952" /><circle cx="581" cy="553" r="23" fill="#fff" opacity=".22"/><text x="581" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="618" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Observe os degraus</text><text x="570" y="629" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#1c304c">Fechado inclui; aberto exclui.</text><rect x="569" y="641" width="462" height="197" rx="10" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><line x1="613" y1="661" x2="613" y2="805" stroke="#51647c" stroke-width="1.8" /><line x1="613" y1="805" x2="1015" y2="805" stroke="#51647c" stroke-width="1.8" /><line x1="613" y1="805" x2="613" y2="810" stroke="#52647e" stroke-width="1" /><text x="613" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">0</text><line x1="747" y1="805" x2="747" y2="810" stroke="#52647e" stroke-width="1" /><text x="747" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">1</text><line x1="881" y1="805" x2="881" y2="810" stroke="#52647e" stroke-width="1" /><text x="881" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">2</text><line x1="1015" y1="805" x2="1015" y2="810" stroke="#52647e" stroke-width="1" /><text x="1015" y="826" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">3</text><line x1="608" y1="805" x2="613" y2="805" stroke="#52647e" stroke-width="1" /><text x="605" y="810" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">0</text><line x1="608" y1="747.4" x2="613" y2="747.4" stroke="#52647e" stroke-width="1" /><text x="605" y="752.4" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">8</text><line x1="608" y1="718.6" x2="613" y2="718.6" stroke="#52647e" stroke-width="1" /><text x="605" y="723.6" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">12</text><line x1="608" y1="689.8" x2="613" y2="689.8" stroke="#52647e" stroke-width="1" /><text x="605" y="694.8" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">16</text><line x1="608" y1="661" x2="613" y2="661" stroke="#52647e" stroke-width="1" /><text x="605" y="666" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#334961">20</text><text x="1017" y="809" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#34445e">h (h)</text><text x="609" y="655" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#34445e">R$</text><polyline points="613.0,747.4 747.0,747.4" fill="none" stroke="#075bbb" stroke-width="4" /><circle cx="613" cy="747.4" r="5.3" fill="#fff" stroke="#075bbb" stroke-width="2.5"/><circle cx="747" cy="747.4" r="5.3" fill="#075bbb" stroke="#fff" stroke-width="1.4"/><polyline points="747.0,718.6 881.0,718.6" fill="none" stroke="#d93952" stroke-width="4" /><circle cx="747" cy="718.6" r="5.3" fill="#fff" stroke="#d93952" stroke-width="2.5"/><circle cx="881" cy="718.6" r="5.3" fill="#d93952" stroke="#fff" stroke-width="1.4"/><polyline points="881.0,689.8 1015.0,689.8" fill="none" stroke="#ed7b18" stroke-width="4" /><circle cx="881" cy="689.8" r="5.3" fill="#fff" stroke="#ed7b18" stroke-width="2.5"/><circle cx="1015" cy="689.8" r="5.3" fill="#ed7b18" stroke="#fff" stroke-width="1.4"/><text x="570" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#d93952">Pontos abertos e fechados.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fc" stroke="#07899c" stroke-width="2"/><rect x="1072" y="520" width="508" height="65" rx="16" fill="#07899c" /><rect x="1072" y="569" width="508" height="16" rx="0" fill="#07899c" /><circle cx="1107" cy="553" r="23" fill="#fff" opacity=".22"/><text x="1107" y="562" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1144" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Por que há salto?</text><text x="1096" y="634" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Perto de 1 pela direita custa 12.</text><text x="1096" y="669" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">Exatamente 1 custa 8.</text><text x="1096" y="704" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1c304c">A faixa muda abruptamente.</text><rect x="1094" y="748" width="464" height="66" rx="12" fill="#fff" /><text x="1326" y="789" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#1a3151">P(1) = 8</text><text x="1096" y="859" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#07899c">Não é crescimento gradual.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073765" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">As extremidades abertas ou fechadas determinam o preço nas fronteiras.</text></svg>