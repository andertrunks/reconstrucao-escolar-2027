<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Território: poder, controle e limites</title><desc id="desc">Uma área delimitada aparece no centro cercada pelas perguntas quem controla, quais regras valem, quem pode usar e quais interesses estão em disputa.</desc><rect width="900" height="520" fill="white"/><text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700">TERRITÓRIO: PODER, CONTROLE E LIMITES</text><path d="M300 135 L610 115 L690 265 L575 395 L300 365 L225 230 Z" fill="#f5f5f5" stroke="#111" stroke-width="5" stroke-dasharray="12 7"/><text x="455" y="235" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700">ÁREA ANALISADA</text><text x="455" y="275" text-anchor="middle" font-family="Arial" font-size="21">apropriação • controle • autoridade</text><g font-family="Arial" font-size="22" font-weight="700"><text x="80" y="145">QUEM CONTROLA?</text><text x="635" y="155">QUAIS REGRAS?</text><text x="65" y="405">QUEM PODE USAR?</text><text x="605" y="425">QUAIS INTERESSES?</text></g><g stroke="#111" stroke-width="3"><path d="M230 155 L315 185"/><path d="M650 170 L590 195"/><path d="M230 390 L315 340"/><path d="M655 395 L585 345"/></g><text x="450" y="485" text-anchor="middle" font-family="Arial" font-size="20">O limite importa, mas território é sobretudo uma relação espacial de poder.</text></svg>