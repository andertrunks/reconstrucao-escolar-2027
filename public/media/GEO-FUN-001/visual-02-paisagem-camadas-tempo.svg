<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Paisagem como camadas do tempo</title><desc id="desc">Três quadros mostram o mesmo lugar em momentos diferentes, com vegetação e estrada, depois casas e comércio, e depois edifícios e transporte coletivo.</desc><rect width="960" height="500" fill="white"/><text x="480" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">PAISAGEM: MUDANÇAS E PERMANÊNCIAS</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="90" width="270" height="300" rx="18" fill="#f5f5f5" stroke="#111" stroke-width="3"/><text x="170" y="130" font-size="24" font-weight="700">ANTES</text><path d="M60 300 Q130 190 205 300 T280 300" fill="none" stroke="#111" stroke-width="5"/><circle cx="100" cy="225" r="24" fill="none" stroke="#111" stroke-width="4"/><path d="M100 249 V320 M75 320 H125" stroke="#111" stroke-width="4"/><path d="M55 355 H285" stroke="#111" stroke-width="5"/><text x="170" y="420" font-size="19">vegetação • estrada • poucas casas</text><rect x="345" y="90" width="270" height="300" rx="18" fill="#f5f5f5" stroke="#111" stroke-width="3"/><text x="480" y="130" font-size="24" font-weight="700">DEPOIS</text><path d="M365 350 H595" stroke="#111" stroke-width="10"/><rect x="390" y="230" width="75" height="105" fill="white" stroke="#111" stroke-width="4"/><rect x="495" y="205" width="90" height="130" fill="white" stroke="#111" stroke-width="4"/><circle cx="545" cy="170" r="25" fill="none" stroke="#111" stroke-width="4"/><text x="480" y="420" font-size="19">rua pavimentada • casas • comércio</text><rect x="655" y="90" width="270" height="300" rx="18" fill="#f5f5f5" stroke="#111" stroke-width="3"/><text x="790" y="130" font-size="24" font-weight="700">ATUAL</text><rect x="690" y="185" width="70" height="150" fill="white" stroke="#111" stroke-width="4"/><rect x="775" y="160" width="70" height="175" fill="white" stroke="#111" stroke-width="4"/><path d="M675 350 H905" stroke="#111" stroke-width="10"/><rect x="830" y="305" width="55" height="28" fill="white" stroke="#111" stroke-width="3"/><text x="790" y="420" font-size="19">edifícios • transporte • permanências</text></g><path d="M305 240 H340 M615 240 H650" stroke="#111" stroke-width="4"/><text x="480" y="475" text-anchor="middle" font-family="Arial" font-size="21">A paisagem do presente reúne marcas de tempos diferentes.</text></svg>