<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Espaço geográfico: relação entre sociedade e natureza</title><desc id="desc">Componentes naturais e ações sociais ligados por setas nos dois sentidos, mostrando interação na produção do espaço.</desc><rect width="900" height="520" fill="white"/><rect x="55" y="105" width="310" height="300" rx="24" fill="#f4f4f4" stroke="#111" stroke-width="3"/><rect x="535" y="105" width="310" height="300" rx="24" fill="#f4f4f4" stroke="#111" stroke-width="3"/><text x="210" y="155" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700">NATUREZA</text><text x="210" y="215" text-anchor="middle" font-family="Arial" font-size="24">relevo • água</text><text x="210" y="260" text-anchor="middle" font-family="Arial" font-size="24">vegetação • clima</text><text x="690" y="155" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700">SOCIEDADE</text><text x="690" y="215" text-anchor="middle" font-family="Arial" font-size="24">moradia • trabalho</text><text x="690" y="260" text-anchor="middle" font-family="Arial" font-size="24">transporte • tecnologia</text><path d="M380 205 H515" stroke="#111" stroke-width="5" marker-end="url(#a)"/><path d="M520 315 H385" stroke="#111" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">ESPAÇO GEOGRÁFICO</text><text x="450" y="490" text-anchor="middle" font-family="Arial" font-size="20">relações e transformações ao longo do tempo</text></svg>