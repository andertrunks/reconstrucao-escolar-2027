<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">Quatro lentes para o mesmo espaço</title><desc id="desc">Uma praça no centro é ligada a quatro caixas: espaço geográfico, paisagem, lugar e território, cada uma com a pergunta principal correspondente.</desc><rect width="960" height="590" fill="white"/><text x="480" y="48" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700">QUATRO LENTES PARA O MESMO ESPAÇO</text><g fill="#f5f5f5" stroke="#111" stroke-width="3" font-family="Arial" text-anchor="middle"><rect x="345" y="225" width="270" height="125" rx="22"/><text x="480" y="277" font-size="30" font-weight="700" fill="#111" stroke="none">A MESMA PRAÇA</text><text x="480" y="315" font-size="20" fill="#111" stroke="none">realidade concreta</text><rect x="55" y="90" width="315" height="105" rx="18"/><text x="212" y="128" font-size="23" font-weight="700" fill="#111" stroke="none">ESPAÇO GEOGRÁFICO</text><text x="212" y="164" font-size="18" fill="#111" stroke="none">Como sociedade e natureza se relacionam?</text><rect x="590" y="90" width="315" height="105" rx="18"/><text x="748" y="128" font-size="23" font-weight="700" fill="#111" stroke="none">PAISAGEM</text><text x="748" y="164" font-size="18" fill="#111" stroke="none">O que percebemos e que marcas do tempo?</text><rect x="55" y="395" width="315" height="105" rx="18"/><text x="212" y="435" font-size="23" font-weight="700" fill="#111" stroke="none">LUGAR</text><text x="212" y="470" font-size="18" fill="#111" stroke="none">Como é vivido e significado?</text><rect x="590" y="395" width="315" height="105" rx="18"/><text x="748" y="435" font-size="23" font-weight="700" fill="#111" stroke="none">TERRITÓRIO</text><text x="748" y="470" font-size="18" fill="#111" stroke="none">Quem controla, decide e estabelece regras?</text></g><g stroke="#111" stroke-width="4"><path d="M370 195 L420 225"/><path d="M590 195 L540 225"/><path d="M370 395 L420 350"/><path d="M590 395 L540 350"/></g><text x="480" y="555" text-anchor="middle" font-family="Arial" font-size="20">O conceito adequado depende da pergunta que queremos responder.</text></svg>