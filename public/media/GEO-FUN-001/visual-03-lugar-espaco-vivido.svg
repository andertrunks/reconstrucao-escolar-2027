<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Lugar: espaço vivido</title><desc id="desc">Mapa esquemático de um bairro com casa, escola, praça, mercado e ponto de ônibus ligados por trajetos cotidianos e pelas ideias de rotina, memória, convivência e pertencimento.</desc><rect width="900" height="540" fill="white"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700">LUGAR: ESPAÇO VIVIDO</text><g fill="#f5f5f5" stroke="#111" stroke-width="3" font-family="Arial" text-anchor="middle"><rect x="80" y="110" width="170" height="90" rx="15"/><text x="165" y="165" font-size="25" fill="#111" stroke="none">CASA</text><rect x="650" y="105" width="170" height="90" rx="15"/><text x="735" y="160" font-size="25" fill="#111" stroke="none">ESCOLA</text><rect x="365" y="215" width="170" height="90" rx="15"/><text x="450" y="270" font-size="25" fill="#111" stroke="none">PRAÇA</text><rect x="90" y="340" width="190" height="90" rx="15"/><text x="185" y="395" font-size="25" fill="#111" stroke="none">MERCADO</text><rect x="620" y="345" width="210" height="90" rx="15"/><text x="725" y="400" font-size="24" fill="#111" stroke="none">PONTO DE ÔNIBUS</text></g><g stroke="#111" stroke-width="5" fill="none" stroke-dasharray="10 8"><path d="M250 160 Q350 170 395 225"/><path d="M535 250 Q620 190 650 160"/><path d="M390 300 Q300 350 280 385"/><path d="M535 290 Q625 340 620 390"/></g><g font-family="Arial" font-size="21" font-weight="700"><text x="320" y="125">ROTINA</text><text x="555" y="150">MEMÓRIA</text><text x="305" y="455">CONVIVÊNCIA</text><text x="545" y="470">PERTENCIMENTO</text></g><text x="450" y="515" text-anchor="middle" font-family="Arial" font-size="20">Lugar não é só localização: envolve experiência e significado.</text></svg>