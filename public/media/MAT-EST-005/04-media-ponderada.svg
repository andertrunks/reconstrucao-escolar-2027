<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><title>Média ponderada de três notas</title><desc>Notas 6, 7 e 8 com pesos 2, 3 e 5. Produtos 12, 21 e 40. Soma 73, peso total 10, média ponderada 7,3.</desc><rect width="1000" height="620" fill="white"/><text x="285" y="55" font-size="28" font-family="Arial">Média ponderada: o peso importa</text><g fill="none" stroke="black" stroke-width="3"><rect x="100" y="130" width="230" height="250"/><rect x="385" y="130" width="230" height="250"/><rect x="670" y="130" width="230" height="250"/></g><g font-family="Arial" font-size="22"><text x="165" y="185">Nota 6</text><text x="165" y="235">Peso 2</text><text x="145" y="300">6 × 2 = 12</text><text x="450" y="185">Nota 7</text><text x="450" y="235">Peso 3</text><text x="430" y="300">7 × 3 = 21</text><text x="735" y="185">Nota 8</text><text x="735" y="235">Peso 5</text><text x="715" y="300">8 × 5 = 40</text><text x="225" y="455">Produtos: 12 + 21 + 40 = 73</text><text x="310" y="500">Pesos: 2 + 3 + 5 = 10</text><text x="330" y="550" font-size="26">73 / 10 = 7,3</text></g></svg>