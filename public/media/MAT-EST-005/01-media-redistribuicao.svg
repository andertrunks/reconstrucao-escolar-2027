<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>Média como redistribuição igualitária</title><desc>Três colunas mostram 2, 4 e 6 unidades, total 12. Uma seta leva a três colunas iguais de 4 unidades, mantendo o total.</desc><rect width="1000" height="600" fill="white"/><text x="245" y="50" font-size="28" font-family="Arial">Média como redistribuição igualitária</text><text x="110" y="110" font-size="20" font-family="Arial">Antes</text><text x="700" y="110" font-size="20" font-family="Arial">Depois</text><g fill="none" stroke="black" stroke-width="3"><rect x="80" y="380" width="90" height="100"/><rect x="200" y="280" width="90" height="200"/><rect x="320" y="180" width="90" height="300"/><rect x="650" y="280" width="90" height="200"/><rect x="770" y="280" width="90" height="200"/><rect x="890" y="280" width="70" height="200"/></g><g font-family="Arial" font-size="22"><text x="110" y="510">2</text><text x="230" y="510">4</text><text x="350" y="510">6</text><text x="680" y="510">4</text><text x="800" y="510">4</text><text x="915" y="510">4</text></g><path d="M450 330 L590 330" stroke="black" stroke-width="4"/><path d="M590 330 L560 310 M590 330 L560 350" stroke="black" stroke-width="4"/><text x="360" y="560" font-size="18" font-family="Arial">Total 12 permanece: 12 ÷ 3 = 4.</text></svg>