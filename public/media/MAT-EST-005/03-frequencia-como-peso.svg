<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><title>Cálculo da média usando frequências como pesos</title><desc>Tabela com valores zero, um, dois e três; frequências dois, três, quatro e um; produtos zero, três, oito e três. Soma ponderada 14, total 10 e média 1,4.</desc><rect width="1000" height="620" fill="white"/><text x="230" y="55" font-size="28" font-family="Arial">Frequências funcionam como pesos</text><g font-family="Arial" font-size="20"><text x="180" y="125">valor x</text><text x="400" y="125">frequência f</text><text x="650" y="125">produto x·f</text><text x="200" y="185">0</text><text x="435" y="185">2</text><text x="700" y="185">0</text><text x="200" y="235">1</text><text x="435" y="235">3</text><text x="700" y="235">3</text><text x="200" y="285">2</text><text x="435" y="285">4</text><text x="700" y="285">8</text><text x="200" y="335">3</text><text x="435" y="335">1</text><text x="700" y="335">3</text><text x="145" y="415">Σf = 10</text><text x="600" y="415">Σ(xf) = 14</text><text x="315" y="505" font-size="26">média = 14 / 10 = 1,4</text></g></svg>