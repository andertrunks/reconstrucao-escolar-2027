<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>Média como ponto de equilíbrio</title><desc>Reta numérica com valores 2, 3 e 7 e média 4. Os desvios menos 2, menos 1 e mais 3 somam zero.</desc><rect width="1000" height="600" fill="white"/><text x="260" y="55" font-size="28" font-family="Arial">Média 4 como ponto de equilíbrio</text><line x1="120" y1="330" x2="880" y2="330" stroke="black" stroke-width="4"/><g stroke="black" stroke-width="3"><line x1="240" y1="320" x2="240" y2="340"/><line x1="340" y1="320" x2="340" y2="340"/><line x1="440" y1="300" x2="440" y2="350"/><line x1="740" y1="320" x2="740" y2="340"/></g><g font-family="Arial" font-size="20"><text x="225" y="370">2</text><text x="325" y="370">3</text><text x="425" y="370">4</text><text x="725" y="370">7</text><text x="405" y="285">média</text><text x="175" y="250">2 − 4 = −2</text><text x="295" y="210">3 − 4 = −1</text><text x="690" y="250">7 − 4 = +3</text><text x="330" y="500" font-size="24">−2 + (−1) + 3 = 0</text></g></svg>