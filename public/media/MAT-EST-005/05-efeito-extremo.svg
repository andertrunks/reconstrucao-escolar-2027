<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><title>Efeito de um valor extremo sobre a média</title><desc>Painel esquerdo mostra valores 4,5,5,5,6 com média 5. Painel direito acrescenta o valor 30 e mostra média aproximadamente 9,17.</desc><rect width="1100" height="650" fill="white"/><text x="270" y="55" font-size="28" font-family="Arial">Um único extremo pode deslocar a média</text><rect x="60" y="120" width="440" height="400" fill="none" stroke="black" stroke-width="3"/><rect x="600" y="120" width="440" height="400" fill="none" stroke="black" stroke-width="3"/><g font-family="Arial" font-size="20"><text x="150" y="170">4, 5, 5, 5, 6</text><text x="150" y="230">Soma = 25</text><text x="150" y="290">n = 5</text><text x="150" y="350">Média = 5</text><text x="675" y="170">4, 5, 5, 5, 6, 30</text><text x="675" y="230">Soma = 55</text><text x="675" y="290">n = 6</text><text x="675" y="350">Média ≈ 9,17</text><text x="310" y="590">O valor 30 é válido? Investigue antes de excluir.</text></g><path d="M515 320 L580 320" stroke="black" stroke-width="4"/><path d="M580 320 L555 300 M580 320 L555 340" stroke="black" stroke-width="4"/></svg>