<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">CRESCIMENTO, DECRESCIMENTO E TAXA ZERO</title><desc id="desc">O sinal de a indica o sentido da variação, não o valor inicial b</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)" /><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="41" font-weight="700" fill="#fff">CRESCIMENTO, DECRESCIMENTO E TAXA ZERO</text><text x="800" y="100" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">O sinal de a indica o sentido da variação, não o valor inicial b</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb" /><rect x="20" y="186" width="508" height="18" rx="0" fill="#075bbb" /><circle cx="54" cy="172" r="24" fill="#fff" opacity=".22"/><text x="54" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="95" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Taxa positiva</text><text x="43" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Quando a &gt; 0, f cresce.</text><text x="43" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Exemplo: f(x) = 2x + 1.</text><text x="43" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Ao aumentar x, y sobe.</text><rect x="41" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="274" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">a = +2</text><text x="43" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#075bbb">Inclinação crescente.</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#078a55" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#078a55" /><rect x="546" y="186" width="508" height="18" rx="0" fill="#078a55" /><circle cx="580" cy="172" r="24" fill="#fff" opacity=".22"/><text x="580" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="621" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Taxa negativa</text><text x="569" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Quando a &lt; 0, g diminui.</text><text x="569" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Exemplo: g(x) = −2x + 7.</text><text x="569" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Ao aumentar x, y desce.</text><rect x="567" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="800" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">a = −2</text><text x="569" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#078a55">Inclinação decrescente.</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#ec7616" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#ec7616" /><rect x="1072" y="186" width="508" height="18" rx="0" fill="#ec7616" /><circle cx="1106" cy="172" r="24" fill="#fff" opacity=".22"/><text x="1106" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1147" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Taxa nula</text><text x="1095" y="251" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Quando a = 0, y é constante.</text><text x="1095" y="286" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Exemplo: h(x) = 4.</text><text x="1095" y="321" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">A saída não muda com x.</text><rect x="1093" y="365" width="466" height="70" rx="11" fill="#fff" /><text x="1326" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">a = 0</text><text x="1095" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ec7616">Reta horizontal.</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3ebff" stroke="#853ec9" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#853ec9" /><rect x="20" y="566" width="508" height="18" rx="0" fill="#853ec9" /><circle cx="54" cy="552" r="24" fill="#fff" opacity=".22"/><text x="54" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="95" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Dois valores</text><text x="43" y="631" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">f(1)=3 e f(2)=5.</text><text x="43" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">g(1)=5 e g(2)=3.</text><text x="43" y="701" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">h(1)=h(2)=4.</text><rect x="41" y="745" width="466" height="70" rx="11" fill="#fff" /><text x="274" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">+2, −2, 0</text><text x="43" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#853ec9">Três comportamentos distintos.</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#ffedf0" stroke="#d63851" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#d63851" /><rect x="546" y="566" width="508" height="18" rx="0" fill="#d63851" /><circle cx="580" cy="552" r="24" fill="#fff" opacity=".22"/><text x="580" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="621" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Compare as retas</text><text x="569" y="630" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#182e4a">Azul: crescente; vermelho: decrescente.</text><rect x="568" y="645" width="464" height="190" rx="10" fill="#fff" stroke="#cfdbeb" stroke-width="2"/><line x1="616" y1="667" x2="616" y2="796" stroke="#435b74" stroke-width="2" /><line x1="616" y1="796" x2="1013" y2="796" stroke="#435b74" stroke-width="2" /><line x1="616" y1="796" x2="616" y2="800" stroke="#566981" stroke-width="1" /><text x="616" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">0</text><line x1="748.3333333333333" y1="796" x2="748.3333333333333" y2="800" stroke="#566981" stroke-width="1" /><text x="748.3333333333333" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">1</text><line x1="880.6666666666666" y1="796" x2="880.6666666666666" y2="800" stroke="#566981" stroke-width="1" /><text x="880.6666666666666" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">2</text><line x1="1013" y1="796" x2="1013" y2="800" stroke="#566981" stroke-width="1" /><text x="1013" y="817" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">3</text><line x1="611" y1="796" x2="616" y2="796" stroke="#566981" stroke-width="1" /><text x="607" y="801" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">0</text><line x1="611" y1="731.5" x2="616" y2="731.5" stroke="#566981" stroke-width="1" /><text x="607" y="736.5" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">4</text><line x1="611" y1="667" x2="616" y2="667" stroke="#566981" stroke-width="1" /><text x="607" y="672" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#31465e">8</text><text x="1021" y="802" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#31465e">x</text><text x="608" y="660" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#31465e">y</text><polyline points="616.0,779.9 1013.0,683.1" fill="none" stroke="#075bbb" stroke-width="4" /><polyline points="616.0,683.1 1013.0,779.9" fill="none" stroke="#d63851" stroke-width="4" /><polyline points="616.0,731.5 1013.0,731.5" fill="none" stroke="#ec7616" stroke-width="4" stroke-dasharray="7 5"/><text x="568" y="864" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#d63851">Laranja tracejado: constante.</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e8f9fa" stroke="#07889b" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#07889b" /><rect x="1072" y="566" width="508" height="18" rx="0" fill="#07889b" /><circle cx="1106" cy="552" r="24" fill="#fff" opacity=".22"/><text x="1106" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1147" y="563" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">Não confunda</text><text x="1095" y="631" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">O valor inicial b pode ser negativo.</text><text x="1095" y="666" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">Mesmo assim, a função pode crescer.</text><text x="1095" y="701" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182e4a">O sinal de a decide o sentido.</text><rect x="1093" y="745" width="466" height="70" rx="11" fill="#fff" /><text x="1326" y="790" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#1a3052">Cresce ⇔ a &gt; 0</text><text x="1095" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#07889b">Decresce ⇔ a &lt; 0.</text><rect x="15" y="912" width="1570" height="35" rx="10" fill="#073566" /><text x="800" y="938" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#fff">O sinal do coeficiente a determina o sentido da reta.</text></svg>