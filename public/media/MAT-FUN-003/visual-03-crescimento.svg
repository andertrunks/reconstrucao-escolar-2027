<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" role="img" aria-labelledby="title desc"><title id="title">Taxa positiva e taxa negativa</title><desc id="desc">Duas retas no plano com eixos x e f de x: f(x)=2x+2 ascendente, g(x)=menos dois x mais três descendente.</desc><rect width="820" height="350" fill="#f8fbff" rx="14"/><text x="24" y="33" font-family="sans-serif" font-size="22" font-weight="bold" fill="#123651">Taxa positiva e taxa negativa</text><line x1="145" y1="194" x2="665" y2="194" stroke="#26415a" stroke-width="2.5"/><line x1="340" y1="74" x2="340" y2="294" stroke="#26415a" stroke-width="2.5"/><text x="145" y="211" font-size="13" text-anchor="middle" fill="#243d54">-3</text><text x="210" y="211" font-size="13" text-anchor="middle" fill="#243d54">-2</text><text x="275" y="211" font-size="13" text-anchor="middle" fill="#243d54">-1</text><text x="405" y="211" font-size="13" text-anchor="middle" fill="#243d54">1</text><text x="470" y="211" font-size="13" text-anchor="middle" fill="#243d54">2</text><text x="535" y="211" font-size="13" text-anchor="middle" fill="#243d54">3</text><text x="600" y="211" font-size="13" text-anchor="middle" fill="#243d54">4</text><text x="665" y="211" font-size="13" text-anchor="middle" fill="#243d54">5</text><text x="331" y="278" text-anchor="end" font-size="13" fill="#243d54">-4</text><text x="331" y="238" text-anchor="end" font-size="13" fill="#243d54">-2</text><text x="331" y="158" text-anchor="end" font-size="13" fill="#243d54">2</text><text x="331" y="118" text-anchor="end" font-size="13" fill="#243d54">4</text><text x="331" y="78" text-anchor="end" font-size="13" fill="#243d54">6</text><text x="670" y="197" font-size="15">x</text><text x="347" y="70" font-size="15">f(x)</text><text x="332" y="210" font-size="13">0</text><path d="M242.5 214 L470 74" stroke="#23648a" stroke-width="4" fill="none"/><path d="M275 94 L600 294" stroke="#9b3f21" stroke-width