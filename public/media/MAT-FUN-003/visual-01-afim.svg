<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" role="img" aria-labelledby="title desc"><title id="title">Função afim: taxa e valor inicial</title><desc id="desc">Gráfico de f de xis igual a duas vezes xis mais três, com pontos zero três, um cinco, dois sete, eixo horizontal x e vertical f de x. O coeficiente a é dois e b é três.</desc><rect width="820" height="350" fill="#f8fbff" rx="14"/><text x="24" y="33" font-family="sans-serif" font-size="22" font-weight="bold" fill="#123651">Função afim: taxa e valor inicial</text><line x1="125" y1="235" x2="645" y2="235" stroke="#26415a" stroke-width="2.5"/><line x1="320" y1="82" x2="320" y2="286" stroke="#26415a" stroke-width="2.5"/><text x="125" y="252" font-size="13" text-anchor="middle" fill="#243d54">-3</text><text x="190" y="252" font-size="13" text-anchor="middle" fill="#243d54">-2</text><text x="255" y="252" font-size="13" text-anchor="middle" fill="#243d54">-1</text><text x="385" y="252" font-size="13" text-anchor="middle" fill="#243d54">1</text><text x="450" y="252" font-size="13" text-anchor="middle" fill="#243d54">2</text><text x="515" y="252" font-size="13" text-anchor="middle" fill="#243d54">3</text><text x="580" y="252" font-size="13" text-anchor="middle" fill="#243d54">4</text><text x="645" y="252" font-size="13" text-anchor="middle" fill="#243d54">5</text><text x="311" y="273" text-anchor="end" font-size="13" fill="#243d54">-2</text><text x="311" y="205" text-anchor="end" font-size="13" fill="#243d54">2</text><text x="311" y="171" text-anchor="end" font-size="13" fill="#243d54">4</text><text x="311" y="137" text-anchor="end" font-size="13" fill="#243d54">6</text><text x="311" y="103" text-anchor="end" font-size="13" fill="#243d54">8</text><text x="650" y="238" font-size="15">x</text><text x="327" y="78" font-size="15">f(x)</text><text x="312" y="251" font-size="13">0</text><path d="M190 252 L515 82" stroke="#165f95" fill="none" stroke-width="4"/><circle cx="320" cy="184" r="6" fill="#15568a"/><text x="331" y="174" font-size="16">(0,3)</text><circle cx="385" cy="150" r="6" fill="#15568a"/><text x="396" y="140" font-size="16">(1,5)</text><circle cx="450" cy="116" r="6" fill="#15568a"/><text x="461" y="106" font-size="16">(2,7)</text><text x="25" y="100" font-size="20">f(x)=2x+3</text><text x="25" y="135" font-size="18">a=2 ; b=3</text><text x="24" y="332" font-family="sans-serif" font-size="14" fill="#42536a">Reconstrução Escolar · MAT-FUN-003 · ilustração didática autoral</text></svg>