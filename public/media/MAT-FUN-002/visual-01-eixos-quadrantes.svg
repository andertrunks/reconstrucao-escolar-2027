<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Eixos, origem e quatro quadrantes</title><desc id="desc">A origem zero zero está no cruzamento dos eixos. Primeiro quadrante tem coordenadas positivas, segundo x negativo e y positivo, terceiro ambos negativos, quarto x positivo e y negativo. Nenhum eixo pertence a um quadrante.</desc><rect width="820" height="370" rx="14" fill="#f8fbff"/><text x="26" y="38" font-size="23" font-weight="bold" font-family="sans-serif" fill="#17395a">Eixos, origem e quatro quadrantes</text><line x1="180" y1="193" x2="640" y2="193" stroke="#1a314b" stroke-width="2.4"/><line x1="410" y1="308" x2="410" y2="78" stroke="#1a314b" stroke-width="2.4"/><line x1="180" y1="189" x2="180" y2="197" stroke="#1a314b"/><text x="180" y="210" text-anchor="middle" font-size="13" fill="#253c57">-4</text><line x1="237.5" y1="189" x2="237.5" y2="197" stroke="#1a314b"/><text x="237.5" y="210" text-anchor="middle" font-size="13" fill="#253c57">-3</text><line x1="295" y1="189" x2="295" y2="197" stroke="#1a314b"/><text x="295" y="210" text-anchor="middle" font-size="13" fill="#253c57">-2</text><line x1="352.5" y1="189" x2="352.5" y2="197" stroke="#1a314b"/><text x="352.5" y="210" text-anchor="middle" font-size="13" fill="#253c57">-1</text><line x1="467.5" y1="189" x2="467.5" y2="197" stroke="#1a314b"/><text x="467.5" y="210" text-anchor="middle" font-size="13" fill="#253c57">1</text><line x1="525" y1="189" x2="525" y2="197" stroke="#1a314b"/><text x="525" y="210" text-anchor="middle" font-size="13" fill="#253c57">2</text><line x1="582.5" y1="189" x2="582.5" y2="197" stroke="#1a314b"/><text x="582.5" y="210" text-anchor="middle" font-size="13" fill="#253c57">3</text><line x1="640" y1="189" x2="640" y2="197" stroke="#1a314b"/><text x="640" y="210" text-anchor="middle" font-size="13" fill="#253c57">4</text><line x1="406" y1="308" x2="4