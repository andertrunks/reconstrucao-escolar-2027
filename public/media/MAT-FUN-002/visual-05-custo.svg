<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">CUSTO FIXO E TAXA POR KM</title><desc id="desc">CUSTO FIXO E TAXA POR KM. A regra combina seis reais e mais dois por km. Tarifa. Há seis reais iniciais.. Cada km acrescenta dois reais.. C(d) = 6 + 2d. d em km e C em R$. Valor inicial. Se d = 0, o custo é R$ 6.. É a interseção vertical.. C(0) = 6. Não começa na origem. Outros valores. Em 1 km: R$ 8; em 2 km: R$ 10.. Em 3 km: R$ 12.. (1,8), (2,10), (3,12). Acréscimo constante. Gráfico da tarifa. . . . . Leia os pontos. Dois km custam dez reais.. Seis + duas vezes dois.. C(2) = 10. Confira a conta. Conclusão. O intercepto é seis reais.. A taxa vale dois reais por km.. +2 R$/km. Unidades e eixos identificados</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">CUSTO FIXO E TAXA POR KM</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">A regra combina seis reais e mais dois por km</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Tarifa</text><text