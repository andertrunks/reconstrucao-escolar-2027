<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Lendo a variação e a taxa fixa</title><desc id="desc">Distância d em quilômetros no horizontal, custo em reais no vertical. Para d zero um dois três os custos são seis oito dez doze. Traço crescente começa em seis reais.</desc><rect width="820" height="370" rx="14" fill="#f8fbff"/><text x="26" y="38" font-size="23" font-weight="bold" font-family="sans-serif" fill="#17395a">Lendo a variação e a taxa fixa</text><line x1="470" y1="267" x2="910" y2="267" stroke="#1a314b" stroke-width="2.4"/><line x1="510" y1="267" x2="510" y2="27" stroke="#1a314b" stroke-width="2.4"/><text x="915" y="271" font-size="16" font-weight="bold">d (km)</text><text x="518" y="24" font-size="16" font-weight="bold">C (R$)</text><text x="500" y="283" font-size="12" fill="#253c57">0</text><path d="M510 164.14285714285714 L810 61.28571428571428" stroke="#1f6a99" stroke-width="4" fill="none"/><circle cx="510" cy="164.14285714285714" r="7" fill="#11537c"/><text x="518" y="155.14285714285714" font-size="17">(0,6)</text><circle cx="610" cy="129.85714285714286" r="7" fill="#11537c"/><text x="618" y="120.85714285714286" font-size="17">(1,8)</text><circle cx="710" cy="95.57142857142858" r="7" fill="#11537c"/><text x="718" y="86.57142857142858" font-size="17">(2,10)</text><circle cx="810" cy="61.28571428571428" r="7" fill="#11537c"/><text x="818" y="52.28571428571428" font-size="17">(3,12)</text><text x="35" y="100" font-size="20">C(d) = 6 + 2d</text><text x="35" y="145" font-size="18">d=0 → R$ 6</text><text x="35" y="176" font-size="18">d=3 → R$ 12</text><text x="35" y="218" font-size="18">+ R$ 2/km</text><text x="25" y="355" fill="#45596b" font-family="sans-serif" font-size="14">Reconstrução Escolar 2027 · MAT-FUN-002 · gráfico autoral</text></svg>