<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Pontos isolados ou traço contínuo?</title><desc id="desc">À esquerda C igual a cinco vezes q apenas para inteiros zero um dois três, com quatro pontos isolados; à direita C igual a cinco vezes d para todas as distâncias reais entre zero e três, com segmento contínuo.</desc><rect width="820" height="370" rx="14" fill="#f8fbff"/><text x="26" y="38" font-size="23" font-weight="bold" font-family="sans-serif" fill="#17395a">Pontos isolados ou traço contínuo?</text><text x="44" y="76" font-size="19" font-weight="bold">Domínio discreto: q=0,1,2,3</text><text x="439" y="76" font-size="19" font-weight="bold">Domínio real: 0≤d≤3</text><line x1="176" y1="285" x2="416" y2="285" stroke="#1a314b" stroke-width="2.4"/><line x1="196" y1="300.7894736842105" x2="196" y2="150.78947368421052" stroke="#1a314b" stroke-width="2.4"/><text x="421" y="289" font-size="16" font-weight="bold">q</text><text x="204" y="147.78947368421052" font-size="16" font-weight="bold">C</text><text x="186" y="301" font-size="12" fill="#253c57">0</text><line x1="566" y1="285" x2="806" y2="285" stroke="#1a314b" stroke-width="2.4"/><line x1="586" y1="300.7894736842105" x2="586" y2="150.78947368421052" stroke="#1a314b" stroke-width="2.4"/><text x="811" y="289" font-size="16" font-weight="bold">d</text><text x="594" y="147.78947368421052" font-size="16" font-weight="bold">C</text><text x="576" y="301" font-size="12" fill="#253c57">0</text><circle cx="196" cy="285" r="6" fill="#165e95"/><circle cx="262.6666666666667" cy="245.5263157894737" r="6" fill="#165e95"/><circle cx="329.33333333333337" cy="206.05263157894737" r="6" fill="#165e95"/><circle cx="396" cy="166.57894736842104" r="6" fill="#165e95"/><path d="M586 285 L786 166.57894736842104" stroke="#165e95" stroke-width="4"/><circle cx="586" cy="285" r="5" fill="#165e95"/><circle cx="6