<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">DOMÍNIO: PONTOS OU SEGMENTO?</title><desc id="desc">DOMÍNIO: PONTOS OU SEGMENTO?. A fórmula não determina sozinha o desenho. Contagem. Uma quantidade inteira q admite. zero, um, dois ou três.. q ∈ {0,1,2,3}. Pontos isolados. Custo das peças. Cada peça custa R$ 5.. Custos: 0, 5, 10 e 15.. C(q) = 5q. Não existe meia peça inteira. Distância. Uma medida em km aceita. valores como 1,5 km.. 0 ≤ d ≤ 3. Intervalo contínuo. Peças: pontos. . . . . Distância: reta. . . . . Diferença. A regra numérica é parecida.. Mas as entradas permitidas mudam.. C = 5 × entrada. O domínio decide a ligação</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="67" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">DOMÍNIO: PONTOS OU SEGMENTO?</text><text x="800" y="102" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">A fórmula não determina sozinha o desenho</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Contagem</text><text x="46" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-ser