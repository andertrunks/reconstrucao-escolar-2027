<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Da fórmula à tabela e aos pontos</title><desc id="desc">Regra efe de xis igual a duas vezes xis mais um; entradas menos um, zero, um, dois produzem saídas menos um, um, três, cinco. Os quatro pares estão marcados num plano com x horizontal e f(x) vertical.</desc><rect width="820" height="370" rx="14" fill="#f8fbff"/><text x="26" y="38" font-size="23" font-weight="bold" font-family="sans-serif" fill="#17395a">Da fórmula à tabela e aos pontos</text><line x1="372.5" y1="219" x2="747.5" y2="219" stroke="#1a314b" stroke-width="2.4"/><line x1="560" y1="250.66666666666666" x2="560" y2="60.66666666666666" stroke="#1a314b" stroke-width="2.4"/><line x1="372.5" y1="215" x2="372.5" y2="223" stroke="#1a314b"/><text x="372.5" y="236" text-anchor="middle" font-size="13" fill="#253c57">-3</text><line x1="435" y1="215" x2="435" y2="223" stroke="#1a314b"/><text x="435" y="236" text-anchor="middle" font-size="13" fill="#253c57">-2</text><line x1="497.5" y1="215" x2="497.5" y2="223" stroke="#1a314b"/><text x="497.5" y="236" text-anchor="middle" font-size="13" fill="#253c57">-1</text><line x1="622.5" y1="215" x2="622.5" y2="223" stroke="#1a314b"/><text x="622.5" y="236" text-anchor="middle" font-size="13" fill="#253c57">1</text><line x1="685" y1="215" x2="685" y2="223" stroke="#1a314b"/><text x="685" y="236" text-anchor="middle" font-size="13" fill="#253c57">2</text><line x1="747.5" y1="215" x2="747.5" y2="223" stroke="#1a314b"/><text x="747.5" y="236" text-anchor="middle" font-size="13" fill="#253c57">3</text><line x1="556" y1="250.66666666666666" x2="564" y2="250.66666666666666" stroke="#1a314b"/><text x="550" y="254.66666666666666" text-anchor="end" font-size="13" fill="#253c57">-1</text><line x1="556" y1="187.33333333333334" x2="564" y2="187.33333333333334" stroke="#1a314b"/><text x="550" y="191.33333333333334" text-anchor="end" font-size="13" fill="#253c57">1</text><line x1="556" y1="155.66666666666666" x2="564" y2="155.66666666666666" stroke="#1a314b"/><text x="550" y="159.66666666666666" text-anchor="end" font-size="13" fill="#253c57">2</text><line x1="556" y1="124" x2="564" y2="124" stroke="#1a314b"/><text x="550" y="128" text-anchor="end" font-size="13" fill="#253c57">3</text><line x1="556" y1="92.33333333333333" x2="564" y2="92.33333333333333" stroke="#1a314b"/><text x="550" y="96.33333333333333" text-anchor="end" font-size="13" fill="#253c57">4</text><line x1="556" y1="60.66666666666666" x2="564" y2="60.66666666666666" stroke="#1a314b"/><text x="550" y="64.66666666666666" text-anchor="end" font-size="13" fill="#253c57">5</text><text x="752.5" y="223" font-size="16" font-weight="bold">x</text><text x="568" y="57.66666666666666" font-size="16" font-weight="bold">y</text><text x="550" y="235" font-size="12" fill="#253c57">0</text><circle cx="497.5" cy="250.66666666666666" r="7" fill="#206aa1"/><text x="506.5" y="243.66666666666666" font-size="15">(-1,-1)</text><circle cx="560" cy="187.33333333333334" r="7" fill="#206aa1"/><text x="569" y="180.33333333333334" font-size="15">(0,1)</text><circle cx="622.5" cy="124" r="7" fill="#206aa1"/><text x="631.5" y="117" font-size="15">(1,3)</text><circle cx="685" cy="60.66666666666666" r="7" fill="#206aa1"/><text x="694" y="53.66666666666666" font-size="15">(2,5)</text><text x="45" y="101" font-size="19">f(x) = 2x + 1</text><text x="46" y="139" font-size="18">x=-1 → f(x)=-1</text><text x="46" y="175" font-size="18">x=0 → f(x)=1</text><text x="46" y="211" font-size="18">x=1 → f(x)=3</text><text x="46" y="247" font-size="18">x=2 → f(x)=5</text><text x="25" y="355" fill="#45596b" font-family="sans-serif" font-size="14">Reconstrução Escolar 2027 · MAT-FUN-002 · gráfico autoral</text></svg>