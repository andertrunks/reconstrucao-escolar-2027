<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Portas cumulativas de MAT-EST-049-PROT-v1</title><desc id="desc">Há cinco de oito pares; médias parciais são favoráveis a C; a piora local de 19,2 em t19 viola limite de dez; auditoria e decisão humana pendentes.</desc><style>.bg{fill:#fff}.t{font:600 20px Arial,sans-serif;fill:#172334}.s{font:16px Arial,sans-serif;fill:#172334}.sub{font:14px Arial,sans-serif;fill:#334155}.tile{fill:#e7edf3;stroke:#425466;stroke-width:1.5}.empty{fill:#fff;stroke:#425466;stroke-width:2;stroke-dasharray:6 4}.focus{fill:#172334}.w{fill:#fff;font:600 15px Arial,sans-serif}.line{stroke:#172334;stroke-width:2}.step{fill:#dce7f1;stroke:#243b53;stroke-width:1.4}.bad{fill:#fff2ed;stroke:#7c2d12;stroke-width:2}.small{font:13px Arial,sans-serif;fill:#172334}</style><rect class="bg" width="900" height="320"/><text class="t" x="22" y="36">Conjunto completo de portas, não só a média</text><rect x="24" y="78" width="158" height="100" rx="8" class="step"/><text class="small" x="35" y="104">Quantidade</text><text class="s" x="35" y="139">5 de 8</text><rect x="200" y="78" width="158" height="100" rx="8" class="step"/><text class="small" x="211" y="104">Médias</text><text class="s" x="211" y="139">parciais</text><rect x="376" y="78" width="158" height="100" rx="8" class="bad"/><text class="small" x="387" y="104">Guarda t19</text><text class="s" x="387" y="139">19,2 > 10</text><rect x="552" y="78" width="158" height="100" rx="8" class="step"/><text class="small" x="563" y="104">Qualidade</text><text class="s" x="563" y="139">pendente</text><rect x="728" y="78" width="158" height="100" rx="8" class="step"/><text class="small" x="739" y="104">Decisão</text><text class="s" x="739" y="139">não promover</text><text class="s" x="30" y="235">Falha histórica não é apagada por três observações posteriores.</text></svg>