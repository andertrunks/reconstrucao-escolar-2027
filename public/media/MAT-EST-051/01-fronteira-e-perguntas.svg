<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Linha do tempo t18 a t25</title><desc id="desc">Cinco alvos fictícios t18 a t22 estão registrados; t23 t24 t25 não foram observados; cenas não substituem esses valores.</desc><style>.bg{fill:#fff}.t{font:600 20px Arial,sans-serif;fill:#172334}.s{font:16px Arial,sans-serif;fill:#172334}.sub{font:14px Arial,sans-serif;fill:#334155}.tile{fill:#e7edf3;stroke:#425466;stroke-width:1.5}.empty{fill:#fff;stroke:#425466;stroke-width:2;stroke-dasharray:6 4}.focus{fill:#172334}.w{fill:#fff;font:600 15px Arial,sans-serif}.line{stroke:#172334;stroke-width:2}.step{fill:#dce7f1;stroke:#243b53;stroke-width:1.4}.bad{fill:#fff2ed;stroke:#7c2d12;stroke-width:2}.small{font:13px Arial,sans-serif;fill:#172334}</style><rect class="bg" width="900" height="320"/><text class="t" x="30" y="42">Passado fictício e perguntas futuras</text><rect x="35" y="100" width="84" height="84" rx="9" class="tile"/><text class="s" x="55" y="135">t18</text><text class="small" x="43" y="163">par</text><rect x="135" y="100" width="84" height="84" rx="9" class="tile"/><text class="s" x="155" y="135">t19</text><text class="small" x="143" y="163">par</text><rect x="235" y="100" width="84" height="84" rx="9" class="tile"/><text class="s" x="255" y="135">t20</text><text class="small" x="243" y="163">par</text><rect x="335" y="100" width="84" height="84" rx="9" class="tile"/><text class="s" x="355" y="135">t21</text><text class="small" x="343" y="163">par</text><rect x="435" y="100" width="84" height="84" rx="9" class="tile"/><text class="s" x="455" y="135">t22</text><text class="small" x="443" y="163">par</text><rect x="535" y="100" width="84" height="84" rx="9" class="empty"/><text class="s" x="555" y="135">t23</text><text class="small" x="543" y="163">pendente</text><rect x="635" y="100" width="84" height="84" rx="9" class="empty"/><text class="s" x="655" y="135">t24</text><text class="small" x="643" y="163">pendente</text><rect x="735" y="100" width="84" height="84" rx="9" class="empty"/><text class="s" x="755" y="135">t25</text><text class="small" x="743" y="163">pendente</text><line x1="523" x2="523" y1="80" y2="203" class="line" stroke-dasharray="4 4"/><text class="s" x="35" y="243">5 de 8 pares construídos editorialmente</text><text class="s" x="536" y="243">3 valores não observados</text></svg>