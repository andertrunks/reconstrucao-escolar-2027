<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Do plano ao parecer com retificação rastreável</title><desc id="desc">Fluxo: plano, previsão antes do alvo, observação, validação, comparação e parecer; correção é novo evento e não altera previsão anterior.</desc><style>.bg{fill:#fff}.t{font:600 20px Arial,sans-serif;fill:#172334}.s{font:16px Arial,sans-serif;fill:#172334}.sub{font:14px Arial,sans-serif;fill:#334155}.tile{fill:#e7edf3;stroke:#425466;stroke-width:1.5}.empty{fill:#fff;stroke:#425466;stroke-width:2;stroke-dasharray:6 4}.focus{fill:#172334}.w{fill:#fff;font:600 15px Arial,sans-serif}.line{stroke:#172334;stroke-width:2}.step{fill:#dce7f1;stroke:#243b53;stroke-width:1.4}.bad{fill:#fff2ed;stroke:#7c2d12;stroke-width:2}.small{font:13px Arial,sans-serif;fill:#172334}</style><rect class="bg" width="900" height="320"/><text class="t" x="24" y="38">Ordem informacional de cada tarefa</text><rect class="step" rx="8" x="25" y="87" width="125" height="66"/><text class="small" x="35" y="125">1. Plano</text><rect class="step" rx="8" x="171" y="87" width="125" height="66"/><text class="small" x="181" y="125">2. Emissão</text><rect class="step" rx="8" x="317" y="87" width="125" height="66"/><text class="small" x="327" y="125">3. Observação</text><rect class="step" rx="8" x="463" y="87" width="125" height="66"/><text class="small" x="473" y="125">4. Validar</text><rect class="step" rx="8" x="609" y="87" width="125" height="66"/><text class="small" x="619" y="125">5. Parear</text><rect class="step" rx="8" x="755" y="87" width="125" height="66"/><text class="small" x="765" y="125">6. Parecer</text><path class="line" d="M150 120 h21"/><path d="M168 114 l7 6 -7 6" fill="none" class="line"/><path class="line" d="M296 120 h21"/><path d="M314 114 l7 6 -7 6" fill="none" class="line"/><path class="line" d="M442 120 h21"/><path d="M460 114 l7 6 -7 6" fill="none" class="line"/><path class="line" d="M588 120 h21"/><path d="M606 114 l7 6 -7 6" fill="none" class="line"/><path class="line" d="M734 120 h21"/><path d="M752 114 l7 6 -7 6" fill="none" class="line"/><path d="M490 156 V220 H390" fill="none" class="line"/><rect class="empty" x="130" y="204" width="270" height="54" rx="7"/><text class="small" x="143" y="234">Retificação = novo evento, sem apagar</text></svg>