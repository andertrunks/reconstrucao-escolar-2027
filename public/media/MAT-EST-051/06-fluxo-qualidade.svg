<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc"><title id="title">Fluxo de qualidade e ausência de dados</title><desc id="desc">Dado recebido passa por validação. Se válido, pode compor par; se atrasado permanece pendente; se corrigido, nova versão e auditoria; jamais preencher vazio com zero.</desc><style>.bg{fill:#fff}.t{font:600 20px Arial,sans-serif;fill:#172334}.s{font:16px Arial,sans-serif;fill:#172334}.sub{font:14px Arial,sans-serif;fill:#334155}.tile{fill:#e7edf3;stroke:#425466;stroke-width:1.5}.empty{fill:#fff;stroke:#425466;stroke-width:2;stroke-dasharray:6 4}.focus{fill:#172334}.w{fill:#fff;font:600 15px Arial,sans-serif}.line{stroke:#172334;stroke-width:2}.step{fill:#dce7f1;stroke:#243b53;stroke-width:1.4}.bad{fill:#fff2ed;stroke:#7c2d12;stroke-width:2}.small{font:13px Arial,sans-serif;fill:#172334}</style><rect class="bg" width="900" height="310"/><text class="t" x="28" y="39">Recebimento não equivale a observação aprovada</text><rect x="33" y="91" class="step" rx="8" width="160" height="62"/><text class="s" x="44" y="128">Chegada</text><path class="line" d="M193 122 H235"/><rect x="235" y="91" class="step" rx="8" width="160" height="62"/><text class="s" x="246" y="128">Conferência</text><path class="line" d="M395 120 H440 V86"/><rect class="step" x="445" y="57" rx="8" width="360" height="58"/><text class="small" x="460" y="90">Válido → observar e parear</text><path class="line" d="M395 120 H440 V166"/><rect class="empty" x="445" y="137" rx="8" width="360" height="58"/><text class="small" x="460" y="170">Atraso → manter campo pendente</text><path class="line" d="M395 120 H440 V246"/><rect class="bad" x="445" y="217" rx="8" width="360" height="58"/><text class="small" x="460" y="250">Correção → acrescentar nova versão</text><text class="small" x="35" y="275">Nunca transformar ausente em zero ou cenário em fato.</text></svg>