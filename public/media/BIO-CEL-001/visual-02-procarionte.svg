<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Modelo simplificado de célula procariótica</title><desc id="d">Bactéria esquemática com parede, membrana, citoplasma, nucleoide, ribossomos, plasmídeo e flagelo opcional.</desc><rect width="1000" height="600" fill="white"/><ellipse cx="450" cy="305" rx="330" ry="205" fill="#f7f7f7" stroke="#222" stroke-width="8"/><ellipse cx="450" cy="305" rx="310" ry="185" fill="none" stroke="#555" stroke-width="4"/><path d="M340 270c80-80 190-40 250 20s-20 120-125 82-145-42-125-102z" fill="none" stroke="#222" stroke-width="7"/><circle cx="330" cy="210" r="7"/><circle cx="410" cy="190" r="7"/><circle cx="520" cy="225" r="7"/><circle cx="600" cy="330" r="7"/><circle cx="300" cy="360" r="7"/><circle cx="500" cy="420" r="7"/><circle cx="610" cy="190" r="7"/><circle cx="255" cy="270" r="7"/><circle cx="620" cy="410" r="28" fill="none" stroke="#222" stroke-width="5"/><path d="M775 330c110 20 70 130 175 145" fill="none" stroke="#222" stroke-width="6"/><g font-family="Arial,sans-serif" fill="#111" font-size="20"><text x="90" y="70" font-size="28" font-weight="700">Célula procariótica — modelo didático</text><text x="765" y="145">parede celular</text><line x1="750" y1="150" x2="690" y2="190" stroke="#222" stroke-width="2"/><text x="760" y="215">membrana plasmática</text><line x1="745" y1="220" x2="700" y2="235" stroke="#222" stroke-width="2"/><text x="75" y="260">nucleoide (DNA)</text><line x1="245" y1="255" x2="340" y2="285" stroke="#222" stroke-width="2"/><text x="90" y="410">ribossomos</text><line x1="205" y1="405" x2="300" y2="360" stroke="#222" stroke-width="2"/><text x="650" y="465">plasmídeo — pode ocorrer</text><line x1="650" y1="445" x2="625" y2="425" stroke="#222" stroke-width="2"/><text x="790" y="525">flagelo — pode ocorrer</text></g></svg>
