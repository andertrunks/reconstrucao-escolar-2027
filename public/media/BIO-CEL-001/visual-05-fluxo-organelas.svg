<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">Caminho simplificado de uma proteína secretada</title><desc id="d">Fluxo do núcleo e ribossomo no retículo rugoso ao Golgi, vesícula e membrana plasmática.</desc><rect width="1100" height="420" fill="white"/><g fill="none" stroke="#222" stroke-width="4"><rect x="40" y="150" width="150" height="95" rx="16"/><rect x="245" y="125" width="180" height="145" rx="16"/><rect x="485" y="150" width="150" height="95" rx="16"/><rect x="695" y="135" width="160" height="125" rx="16"/><rect x="925" y="150" width="135" height="95" rx="16"/><path d="M190 198h55M425 198h60M635 198h60M855 198h70"/><path d="M235 188l10 10-10 10M475 188l10 10-10 10M685 188l10 10-10 10M915 188l10 10-10 10"/></g><g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="550" y="60" font-size="30" font-weight="700">Cooperação entre organelas</text><text x="115" y="190" font-size="22" font-weight="700">Núcleo</text><text x="115" y="220" font-size="17">informação</text><text x="335" y="175" font-size="21" font-weight="700">Ribossomo + RER</text><text x="335" y="208" font-size="17">síntese e início</text><text x="335" y="232" font-size="17">do processamento</text><text x="560" y="190" font-size="21" font-weight="700">Vesícula</text><text x="560" y="220" font-size="17">transporte</text><text x="775" y="182" font-size="21" font-weight="700">Golgi</text><text x="775" y="215" font-size="17">modifica, tria</text><text x="775" y="239" font-size="17">e direciona</text><text x="992" y="187" font-size="21" font-weight="700">Membrana</text><text x="992" y="218" font-size="17">secreção</text><text x="550" y="350" font-size="19">O processo depende de sequência coordenada; nenhuma dessas estruturas realiza tudo sozinha.</text></g></svg>
