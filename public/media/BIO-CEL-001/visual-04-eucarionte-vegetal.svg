<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Modelo simplificado de célula vegetal</title><desc id="d">Célula vegetal eucariótica com parede, membrana, grande vacúolo, núcleo, cloroplastos, mitocôndria, retículo e Golgi.</desc><rect width="1000" height="650" fill="white"/><rect x="110" y="90" width="760" height="470" rx="30" fill="#fafafa" stroke="#222" stroke-width="10"/><rect x="130" y="110" width="720" height="430" rx="25" fill="none" stroke="#555" stroke-width="4"/><rect x="350" y="170" width="390" height="310" rx="65" fill="none" stroke="#222" stroke-width="5"/><circle cx="260" cy="260" r="85" fill="none" stroke="#222" stroke-width="5"/><circle cx="260" cy="260" r="20" fill="none" stroke="#222" stroke-width="3"/><ellipse cx="220" cy="425" rx="65" ry="30" fill="none" stroke="#222" stroke-width="5"/><line x1="175" y1="415" x2="265" y2="435" stroke="#222" stroke-width="3"/><ellipse cx="790" cy="190" rx="50" ry="28" fill="none" stroke="#222" stroke-width="5"/><line x1="755" y1="182" x2="825" y2="198" stroke="#222" stroke-width="3"/><g font-family="Arial,sans-serif" fill="#111" font-size="19"><text x="95" y="55" font-size="28" font-weight="700">Célula eucariótica vegetal — modelo didático</text><text x="875" y="130">parede celular</text><text x="875" y="165">membrana</text><text x="500" y="330" font-size="25">grande vacúolo central</text><text x="210" y="265">núcleo</text><text x="150" y="470">cloroplasto</text><text x="745" y="235">mitocôndria</text><text x="120" y="600">Cloroplastos são típicos de células fotossintetizantes; não aparecem em toda célula vegetal.</text></g></svg>
