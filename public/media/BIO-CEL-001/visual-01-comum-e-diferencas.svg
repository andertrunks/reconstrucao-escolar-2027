<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Base comum e divisão procariótica e eucariótica</title><desc id="d">Quatro componentes comuns levam a dois padrões de organização: sem núcleo membranoso e com núcleo membranoso.</desc><rect width="1000" height="520" fill="white"/><g fill="none" stroke="#222" stroke-width="3"><rect x="70" y="55" width="860" height="115" rx="18"/><rect x="70" y="300" width="380" height="145" rx="18"/><rect x="550" y="300" width="380" height="145" rx="18"/><path d="M500 170v75M500 245L260 300M500 245L740 300"/></g><g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="500" y="90" font-size="26" font-weight="700">Toda célula</text><text x="500" y="125" font-size="21">membrana • citoplasma • DNA • ribossomos</text><text x="260" y="338" font-size="25" font-weight="700">Procariótica</text><text x="260" y="375" font-size="20">sem núcleo delimitado por membrana</text><text x="260" y="407" font-size="19">DNA principal no nucleoide</text><text x="740" y="338" font-size="25" font-weight="700">Eucariótica</text><text x="740" y="375" font-size="20">núcleo delimitado por membrana</text><text x="740" y="407" font-size="19">compartimentos membranosos</text></g></svg>
