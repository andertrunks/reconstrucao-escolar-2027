<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Do nível da frase ao nível do texto</title><desc id="desc">Diagrama em três níveis mostra frases agrupadas em um parágrafo e parágrafos agrupados em um texto, indicando que cada nível organiza unidades menores.</desc>
<style>text{font-family:Arial,sans-serif;fill:#111} .box{fill:#fff;stroke:#111;stroke-width:3} .line{stroke:#111;stroke-width:3;fill:none} .dash{stroke:#111;stroke-width:3;stroke-dasharray:10 8;fill:none} .small{font-size:23px} .mid{font-size:28px;font-weight:700} .big{font-size:34px;font-weight:700}</style>
<text x="500" y="50" text-anchor="middle" class="big">Do nível da frase ao nível do texto</text>
<rect x="80" y="120" width="250" height="300" rx="20" class="box"/><text x="205" y="160" text-anchor="middle" class="mid">Frases</text>
<rect x="110" y="200" width="190" height="50" class="box"/><text x="205" y="233" text-anchor="middle" class="small">frase 1</text>
<rect x="110" y="270" width="190" height="50" class="box"/><text x="205" y="303" text-anchor="middle" class="small">frase 2</text>
<rect x="110" y="340" width="190" height="50" class="box"/><text x="205" y="373" text-anchor="middle" class="small">frase 3</text>
<path d="M340 270 H430" class="line"/><path d="M410 255 L430 270 L410 285" class="line"/>
<rect x="440" y="150" width="250" height="240" rx="20" class="box"/><text x="565" y="195" text-anchor="middle" class="mid">Parágrafo</text><text x="565" y="250" text-anchor="middle" class="small">organiza frases</text><text x="565" y="290" text-anchor="middle" class="small">em torno de um</text><text x="565" y="330" text-anchor="middle" class="small">foco local</text>
<path d="M700 270 H790" class="line"/><path d="M770 255 L790 270 L770 285" class="line"/>
<rect x="800" y="120" width="150" height="300" rx="20" class="box"/><text x="875" y="165" text-anchor="middle" class="mid">Texto</text><text x="875" y="235" text-anchor="middle" class="small">articula</text><text x="875" y="275" text-anchor="middle" class="small">vários</text><text x="875" y="315" text-anchor="middle" class="small">parágrafos</text>
<text x="500" y="500" text-anchor="middle" class="small">Cada nível organiza unidades menores para cumprir uma finalidade maior.</text></svg>
