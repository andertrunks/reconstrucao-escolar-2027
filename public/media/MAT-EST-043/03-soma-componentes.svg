<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Como nasce uma observação no modelo aditivo</title><desc id="desc">Três componentes numéricos T=130, S=20 e R=0 somam 150 unidades no período sete.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173449}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#485a67;stroke-width:2;fill:none}.line{stroke:#14758f;stroke-width:3;fill:none}.line2{stroke:#b56c16;stroke-width:3;fill:none}.pale{fill:#dbeef1;stroke:#13788c;stroke-width:2}.warm{fill:#f9edce;stroke:#a66d17;stroke-width:2}.dot{fill:#14758f}.bar{fill:#9ad4de;stroke:#16788b;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Como nasce uma observação no modelo aditivo</text><text x="40" y="95" class="label" text-anchor="start">Exemplo do período 7, terceiro trimestre do ano 2</text><rect x="45" y="134" width="245" height="104" rx="10" class="pale"/><text x="167" y="164" class="label" text-anchor="middle">Tendência</text><text x="167" y="203" class="title" text-anchor="middle">130</text><rect x="345" y="134" width="245" height="104" rx="10" class="pale"/><text x="467" y="164" class="label" text-anchor="middle">Sazonal</text><text x="467" y="203" class="title" text-anchor="middle">+20</text><rect x="645" y="134" width="245" height="104" rx="10" class="pale"/><text x="767" y="164" class="label" text-anchor="middle">Restante</text><text x="767" y="203" class="title" text-anchor="middle">+0</text><text x="298" y="202" class="title" text-anchor="middle">+</text><text x="595" y="202" class="title" text-anchor="middle">+</text><rect x="265" y="298" width="430" height="83" rx="10" class="warm"/><text x="480" y="332" class="title" text-anchor="middle">130 + 20 + 0 = 150</text><text x="480" y="361" class="small" text-anchor="middle">unidades observadas</text><text x="55" y="435" class="small" text-anchor="start">O restante não deve ser renomeado automaticamente como erro de medição.</text></svg>