<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Proporcionalidade direta e inversa respondem de modos diferentes ao mesmo fator</title><desc id="d">À esquerda, quando a primeira grandeza dobra, a segunda também dobra. À direita, quando a primeira grandeza dobra, a segunda é dividida por dois.</desc><rect x="35" y="35" width="830" height="390" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="80" text-anchor="middle" font-size="28" font-family="Arial">O que acontece quando uma grandeza × 2?</text><line x1="450" y1="105" x2="450" y2="380" stroke="currentColor" stroke-width="2"/><text x="230" y="135" text-anchor="middle" font-size="24" font-family="Arial">Direta</text><text x="670" y="135" text-anchor="middle" font-size="24" font-family="Arial">Inversa</text><text x="230" y="205" text-anchor="middle" font-size="30" font-family="Arial">3 → 6</text><text x="230" y="260" text-anchor="middle" font-size="30" font-family="Arial">10 → 20</text><text x="230" y="325" text-anchor="middle" font-size="24" font-family="Arial">× 2 e × 2</text><text x="670" y="205" text-anchor="middle" font-size="30" font-family="Arial">3 → 6</text><text x="670" y="260" text-anchor="middle" font-size="30" font-family="Arial">20 → 10</text><text x="670" y="325" text-anchor="middle" font-size="24" font-family="Arial">× 2 e ÷ 2</text><text x="450" y="395" text-anchor="middle" font-size="22" font-family="Arial">Na relação inversa, o fator é compensado pelo fator recíproco.</text></svg>