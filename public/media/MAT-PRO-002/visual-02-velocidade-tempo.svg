<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="t d"><title id="t">Tabela de velocidade e tempo para uma distância fixa de cento e vinte quilômetros</title><desc id="d">A tabela mostra trinta quilômetros por hora e quatro horas, quarenta e sessenta e três horas, sessenta e duas horas e cento e vinte e uma hora. Em todas as linhas, velocidade vezes tempo é cento e vinte.</desc><rect x="40" y="35" width="820" height="410" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="82" text-anchor="middle" font-size="28" font-family="Arial">Distância fixa: 120 km</text><line x1="145" y1="125" x2="755" y2="125" stroke="currentColor" stroke-width="3"/><line x1="345" y1="105" x2="345" y2="370" stroke="currentColor" stroke-width="2"/><line x1="555" y1="105" x2="555" y2="370" stroke="currentColor" stroke-width="2"/><text x="245" y="116" text-anchor="middle" font-size="21" font-family="Arial">velocidade (km/h)</text><text x="450" y="116" text-anchor="middle" font-size="21" font-family="Arial">tempo (h)</text><text x="655" y="116" text-anchor="middle" font-size="21" font-family="Arial">velocidade × tempo</text><g font-family="Arial" font-size="25" text-anchor="middle"><text x="245" y="170">30</text><text x="450" y="170">4</text><text x="655" y="170">120</text><text x="245" y="225">40</text><text x="450" y="225">3</text><text x="655" y="225">120</text><text x="245" y="280">60</text><text x="450" y="280">2</text><text x="655" y="280">120</text><text x="245" y="335">120</text><text x="450" y="335">1</text><text x="655" y="335">120</text></g><text x="450" y="410" text-anchor="middle" font-size="23" font-family="Arial">Produto constante: velocidade × tempo = 120 km</text></svg>