<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">VELOCIDADE E TEMPO</title><desc id="desc">Para 120 km, a velocidade constante determina a duração. 1. Distância fixa. A viagem tem cento e vinte. quilômetros em todos os casos.. distância = 120 km. 2. Quatro pares de valores. Trinta, quarenta, sessenta e. cento e vinte km/h.. 30→4; 40→3; 60→2; 120→1. 3. Multiplique os pares. Em todos, velocidade vezes. tempo resulta em 120 km.. v × t = 120 km. 4. Represente em gráfico. No eixo x fica a velocidade.. No eixo y fica o tempo.. t = 120/v. 5. Dobrar a velocidade. De trinta para sessenta km/h,. o tempo cai de quatro para duas h.. 30→60 | 4→2. 6. Limites do exemplo. Só vale para distância fixa. e velocidade constante no modelo.. v &gt; 0 | t &gt; 0</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">VELOCIDADE E TEMPO</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Para 120 km, a velocidade constante determina a duração</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">1. Distância fixa</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">2. Quatro pares de valores</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">3. Multiplique os pares</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">4. Represente em gráfico</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">5. Dobrar a velocidade</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">6. Limites do exemplo</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#355772">Reconstrução Escolar 2027 • MAT-PRO-002 • infográfico autoral</text><text x="44" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">A distância é a mesma em todos</text><text x="44" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">os exemplos apresentados.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">120 km</text><text x="44" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Modelo de velocidade constante</text><rect x="586" y="244" width="428" height="245" rx="8" fill="#fff" stroke="#457894" stroke-width="2"/><line x1="728" y1="244" x2="728" y2="489" stroke="#b1cada"/><line x1="870" y1="244" x2="870" y2="489" stroke="#b1cada"/><line x1="586" y1="293" x2="1014" y2="293" stroke="#b1cada"/><line x1="586" y1="342" x2="1014" y2="342" stroke="#b1cada"/><line x1="586" y1="391" x2="1014" y2="391" stroke="#b1cada"/><line x1="586" y1="440" x2="1014" y2="440" stroke="#b1cada"/><text x="657" y="276.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#264a67">km/h</text><text x="799" y="276.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#264a67">horas</text><text x="942" y="276.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#264a67">km</text><text x="657" y="325.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">30</text><text x="799" y="325.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">4</text><text x="942" y="325.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">120</text><text x="657" y="374.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">40</text><text x="799" y="374.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">3</text><text x="942" y="374.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">120</text><text x="657" y="423.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">60</text><text x="799" y="423.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">2</text><text x="942" y="423.83" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">120</text><text x="657" y="472.83000000000004" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">120</text><text x="799" y="472.83000000000004" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">1</text><text x="942" y="472.83000000000004" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="600" fill="#264a67">120</text><text x="1096" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Multiplique velocidade e tempo.</text><text x="1096" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">O resultado é a distância total.</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">v×t = 120 km</text><text x="1096" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Produto constante</text><rect x="112" y="632" width="329" height="208" fill="#fff" stroke="#adc7d9"/><line x1="112" y1="840" x2="112" y2="847" stroke="#385d78"/><text x="112" y="864" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" text-anchor="middle" font-weight="500" fill="#254d68">30</text><line x1="221.66666666666666" y1="840" x2="221.66666666666666" y2="847" stroke="#385d78"/><text x="221.66666666666666" y="864" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" text-anchor="middle" font-weight="500" fill="#254d68">60</text><line x1="331.3333333333333" y1="840" x2="331.3333333333333" y2="847" stroke="#385d78"/><text x="331.333333333