<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">VELOCIDADE E TEMPO</title><desc id="desc">Para 120 km, a velocidade constante determina a duração. 1. Distância fixa. A viagem tem cento e vinte. quilômetros em todos os casos.. distância = 120 km. 2. Quatro pares de valores. Trinta, quarenta, sessenta e. cento e vinte km/h.. 30→4; 40→3; 60→2; 120→1. 3. Multiplique os pares. Em todos, velocidade vezes. tempo resulta em 120 km.. v × t = 120 km. 4. Represente em gráfico. No eixo x fica a velocidade.. No eixo y fica o tempo.. t = 120/v. 5. Dobrar a velocidade. De trinta para sessenta km/h,. o tempo cai de quatro para duas h.. 30→60 | 4→2. 6. Limites do exemplo. Só vale para distância fixa. e velocidade constante no modelo.. v &gt; 0 | t &gt; 0</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">VELOCIDADE E TEMPO</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Para 120 km, a velocidade constante determina a duração</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">1. Distância fixa</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">2. Quatro pares de valores</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">3. Multiplique os pares</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">4. Represente em gráfico</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">5. Dobrar a velocidade</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">6. Limites do exemplo</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#355772">Reconstrução Escolar 2027 • MAT-PRO-002 • infográfico autoral</text></svg>