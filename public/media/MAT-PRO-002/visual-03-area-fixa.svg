<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Retângulos de área fixa mostram proporcionalidade inversa entre base e altura</title><desc id="d">Três retângulos têm área vinte e quatro. As dimensões são três por oito, quatro por seis e seis por quatro. Quando uma dimensão aumenta, a outra diminui mantendo o produto vinte e quatro.</desc><rect x="35" y="35" width="830" height="390" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="82" text-anchor="middle" font-size="28" font-family="Arial">Área fixa: 24 unidades quadradas</text><rect x="95" y="155" width="180" height="160" fill="none" stroke="currentColor" stroke-width="4"/><text x="185" y="345" text-anchor="middle" font-size="23" font-family="Arial">3 × 8 = 24</text><rect x="365" y="175" width="180" height="135" fill="none" stroke="currentColor" stroke-width="4"/><text x="455" y="345" text-anchor="middle" font-size="23" font-family="Arial">4 × 6 = 24</text><rect x="635" y="215" width="180" height="90" fill="none" stroke="currentColor" stroke-width="4"/><text x="725" y="345" text-anchor="middle" font-size="23" font-family="Arial">6 × 4 = 24</text><text x="450" y="395" text-anchor="middle" font-size="22" font-family="Arial">Mudar a forma não muda a área quando base × altura permanece constante.</text></svg>