<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">DIAGNÓSTICO DE PROPORCIONALIDADE</title><desc id="desc">Razão constante, produto constante ou nenhum dos dois?. 1. Teste da direta. Se y/x é o mesmo em todos. os pares, a relação é direta.. y/x = constante. 2. Teste da inversa. Se x vezes y não muda,. temos uma relação inversa.. x×y = constante. 3. Exemplo direto. Pares: (1,3), (2,6) e (4,12).. A razão y/x é sempre três.. 3/1 = 6/2 = 12/4 = 3. 4. Exemplo inverso. Pares: (1,24), (2,12), (4,6).. Cada produto vale 24.. 1×24 = 2×12 = 4×6. 5. Teste visual dos pares. Terceiro caso: (1,10), (2,8),. (4,5), sem razão nem produto fixo.. direta | inversa | nenhuma. 6. Não conclua só pela direção. Aumentar ou diminuir não prova. que existe proporcionalidade.. verifique todos os pares</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">DIAGNÓSTICO DE PROPORCIONALIDADE</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Razão constante, produto constante ou nenhum dos dois?</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">1. Teste da direta</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">2. Teste da inversa</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">3. Exemplo direto</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">4. Exemplo inverso</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">5. Teste visual dos pares</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">6. Não conclua só pela direção</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#355772">Reconstrução Escolar 2027 • MAT-PRO-002 • infográfico autoral</text><text x="44" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Compare o quociente y/x</text><text x="44" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">para pares correspondentes.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">y/x = constante</text><text x="44" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Critério da direta; x ≠ 0</text><text x="570" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Compare os produtos x vezes y.</text><text x="570" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Se iguais, pode ser inversa.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">x×y = constante</text><text x="570" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Verifique condições do modelo</text><text x="1096" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Pares (1,3), (2,6), (4,12).</text><text x="1096" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Todas as razões são 3.</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">3/1 = 6/2 = 12/4</text><text x="1096" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Relação diretamente proporcional</text><text x="44" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Pares (1,24), (2,12), (4,6).</text><text x="44" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Todos os produtos valem 24.</text><rect x="40" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">1×24 = 2×12 = 4×6</text><text x="44" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Relação inversamente proporcional</text><rect x="563" y="624" width="472" height="236" rx="8" fill="#fff" stroke="#457894" stroke-width="2"/><line x1="679" y1="624" x2="679" y2="860" stroke="#b1cada"/><line x1="773" y1="624" x2="773" y2="860" stroke="#b1cada"/><line x1="911" y1="624" x2="911" y2="860" stroke="#b1cada"/><line x1="563" y1="683" x2="1035" y2="683" stroke="#b1cada"/><line x1="563" y1="742" x2="1035" y2="742" stroke="#b1cada"/><line x1="563" y1="801" x2="1035" y2="801" stroke="#b1cada"/><text x="621" y="663.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#264a67">Modelo</text><text x="726" y="663.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#264a67">x</text><text x="842" y="663.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#264a67">y</text><text x="973" y="663.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#264a67">Teste</text><text x="621" y="722.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">Direta</text><text x="726" y="722.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">1,2,4</text><text x="842" y="722.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">3,6,12</text><text x="973" y="722.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">y/x=3</text><text x="621" y="781.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">Inversa</text><text x="726" y="781.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">1,2,4</text><text x="842" y="781.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">24,12,6</text><text x="973" y="781.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">xy=24</text><text x="621" y="840.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">Outra</text><text x="726" y="840.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">1,2,4</text><text x="842" y="840.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">10,8,5</text><text x="973" y="840.53" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#264a67">varia</text><text x="1096" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Uma subir e outra descer</text><text x="1096" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">não determina proporcionalidade.</text><rect x="1092" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">teste razão e produto</text><text x="1096" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Respeite as condições</text></svg>