<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Como distinguir relação direta, inversa e não proporcional em tabelas</title><desc id="d">Três pequenas tabelas mostram: na direta, a razão y dividido por x é constante; na inversa, o produto x vezes y é constante; na terceira, nem razão nem produto são constantes.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="75" text-anchor="middle" font-size="27" font-family="Arial">Teste a relação, não apenas o sentido da mudança</text><line x1="300" y1="105" x2="300" y2="410" stroke="currentColor" stroke-width="2"/><line x1="600" y1="105" x2="600" y2="410" stroke="currentColor" stroke-width="2"/><g font-family="Arial" text-anchor="middle"><text x="165" y="130" font-size="24">Direta</text><text x="450" y="130" font-size="24">Inversa</text><text x="735" y="130" font-size="24">Nenhuma</text><text x="165" y="180" font-size="22">x: 1, 2, 4</text><text x="165" y="220" font-size="22">y: 3, 6, 12</text><text x="165" y="275" font-size="21">y ÷ x = 3</text><text x="165" y="330" font-size="20">razão constante</text><text x="450" y="180" font-size="22">x: 1, 2, 4</text><text x="450" y="220" font-size="22">y: 24, 12, 6</text><text x="450" y="275" font-size="21">x × y = 24</text><text x="450" y="330" font-size="20">produto constante</text><text x="735" y="180" font-size="22">x: 1, 2, 4</text><text x="735" y="220" font-size="22">y: 10, 8, 5</text><text x="735" y="275" font-size="21">produtos: 10, 16, 20</text><text x="735" y="330" font-size="20">sem constância</text></g><text x="450" y="440" text-anchor="middle" font-size="21" font-family="Arial">Diminuir enquanto a outra aumenta não basta: o produto precisa permanecer constante.</text></svg>