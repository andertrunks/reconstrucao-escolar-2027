<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Fluxo para decidir se duas grandezas são inversamente proporcionais</title><desc id="d">Fluxograma pergunta se há pares correspondentes sob as mesmas condições, se uma grandeza muda por um fator e a outra compensa pelo fator recíproco e se os produtos correspondentes são iguais. Se sim, a relação é inversamente proporcional.</desc><rect x="30" y="25" width="840" height="470" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><g font-family="Arial" text-anchor="middle"><rect x="250" y="65" width="400" height="65" rx="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="105" font-size="21">Há pares correspondentes sob as mesmas condições?</text><path d="M450 130 V165" stroke="currentColor" stroke-width="3"/><rect x="235" y="165" width="430" height="75" rx="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="195" font-size="20">Quando uma grandeza × f,</text><text x="450" y="222" font-size="20">a outra fica ÷ f?</text><path d="M450 240 V275" stroke="currentColor" stroke-width="3"/><rect x="245" y="275" width="410" height="70" rx="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="450" y="307" font-size="20">Os produtos dos pares</text><text x="450" y="333" font-size="20">permanecem iguais?</text><path d="M450 345 V380" stroke="currentColor" stroke-width="3"/><rect x="285" y="380" width="330" height="65" rx="14" fill="none" stroke="currentColor" stroke-width="4"/><text x="450" y="420" font-size="23">Sim: proporcionalidade inversa</text><text x="730" y="205" font-size="18">Se não, investigue outra relação.</text><text x="730" y="315" font-size="18">Não basta “uma sobe, outra desce”.</text></g></svg>