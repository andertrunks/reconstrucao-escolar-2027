<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">COMO VERIFICAR A RELAÇÃO INVERSA</title><desc id="desc">Faça perguntas sucessivas e justifique sua classificação. 1. Identifique as grandezas. O que cada coluna mede?. Quais são suas unidades?. x e y. 2. Compare condições. Os pares descrevem situações. com a mesma distância ou área?. condições fixas?. 3. Observe os fatores. Se x multiplicar por um fator,. y divide pelo mesmo fator?. x × k  |  y ÷ k. 4. Confirme pelos produtos. Calcule x vezes y em todos. os pares de observação.. x₁y₁ = x₂y₂. 5. Siga o fluxograma. Cada resposta precisa de evidência.. Se falhar, investigue outra relação.. condições → fatores → produto. 6. Conclusão. Somente conclua inversa quando. as condições e os produtos sustentarem.. proporcionalidade inversa</desc><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#hd)"/><text x="800" y="65" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#fff">COMO VERIFICAR A RELAÇÃO INVERSA</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e6f1ff">Faça perguntas sucessivas e justifique sua classificação</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">1. Identifique as grandezas</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="624" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">2. Compare condições</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1150" y="181" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">3. Observe os fatores</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">4. Confirme pelos produtos</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="624" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">5. Siga o fluxograma</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="560" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1150" y="561" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#fff">6. Conclusão</text><text x="26" y="933" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#355772">Reconstrução Escolar 2027 • MAT-PRO-002 • infográfico autoral</text><text x="44" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Defina o que x e y representam.</text><text x="44" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Leia a unidade de cada coluna.</text><rect x="40" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">grandezas e unidades</text><text x="44" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Use pares da mesma situação</text><text x="570" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Confira a distância, área ou</text><text x="570" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">outro parâmetro de referência.</text><rect x="566" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="800" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">condições fixas?</text><text x="570" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Mudanças invalidam o modelo</text><text x="1096" y="269" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Quando uma variável multiplica</text><text x="1096" y="309" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">por k, a outra divide por k?</text><rect x="1092" y="362" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="409" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">x×k e y÷k</text><text x="1096" y="479" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">k diferente de zero</text><text x="44" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Calcule todos os produtos</text><text x="44" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">dos pares correspondentes.</text><rect x="40" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="274" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">x₁y₁ = x₂y₂</text><text x="44" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Constância precisa ser comprovada</text><rect x="622" y="623" width="356" height="49" rx="10" fill="#fff" stroke="#497892" stroke-width="2"/><text x="800" y="654" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#284962">Contexto igual?</text><path d="M800 672V687" stroke="#517b93" stroke-width="2"/><path d="M800 687l-5 -8h10z" fill="#517b93"/><rect x="622" y="687" width="356" height="49" rx="10" fill="#fff" stroke="#497892" stroke-width="2"/><text x="800" y="718" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#284962">Fatores recíprocos?</text><path d="M800 736V751" stroke="#517b93" stroke-width="2"/><path d="M800 751l-5 -8h10z" fill="#517b93"/><rect x="622" y="751" width="356" height="49" rx="10" fill="#fff" stroke="#497892" stroke-width="2"/><text x="800" y="782" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#284962">Produtos iguais?</text><path d="M800 800V815" stroke="#517b93" stroke-width="2"/><path d="M800 815l-5 -8h10z" fill="#517b93"/><rect x="622" y="815" width="356" height="49" rx="10" fill="#d6f4df" stroke="#087e54" stroke-width="2"/><text x="800" y="846" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#284962">Modelo inverso</text><text x="1096" y="649" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">Com requisitos satisfeitos,</text><text x="1096" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" text-anchor="start" font-weight="400" fill="#1e405c">a relação é inversa no modelo.</text><rect x="1092" y="742" width="468" height="72" rx="11" fill="#fff"/><text x="1326" y="789" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#234057">inversamente proporcional</text><text x="1096" y="859" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#365575">Não basta uma diminuir</text></svg>