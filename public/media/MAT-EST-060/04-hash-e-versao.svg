<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 390" width="960" height="390"><title id="title">Integridade por versão</title><desc id="desc">O CSV real mantém o digest esperado; um fixture didático substitui o texto do hash por zeros e deve falhar. Uma verificação de hash não demonstra que uma fonte é verdadeira ou que foi emitida antes.</desc><rect width="960" height="390" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="26" y="37" font-size="22" fill="#173753" font-weight="bold" text-anchor="start">4. Versão do relatório e digest da fonte</text><rect x="27" y="77" width="420" height="105" rx="8" fill="#eef5f8" stroke="#a3bdca"/><text x="42" y="113" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Fonte real preservada</text><text x="42" y="147" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">SHA-256 conferido</text><rect x="482" y="77" width="420" height="105" rx="8" fill="#eef5f8" stroke="#a3bdca"/><text x="497" y="113" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Receita F03 alterada</text><text x="497" y="147" font-size="15" fill="#9d4b12" font-weight="normal" text-anchor="start">digest 000…000; falha</text><rect x="27" y="214" width="420" height="105" rx="8" fill="#eef5f8" stroke="#a3bdca"/><text x="42" y="250" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Resposta correta</text><text x="42" y="284" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">reprovar somente a cópia</text><rect x="482" y="214" width="420" height="105" rx="8" fill="#eef5f8" stroke="#a3bdca"/><text x="497" y="250" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Nunca fazer</text><text x="497" y="284" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">modificar CSV canônico</text></g></svg>