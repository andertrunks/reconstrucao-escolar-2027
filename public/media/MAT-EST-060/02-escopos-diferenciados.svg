<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 390" width="960" height="390"><title id="title">Quatro escopos sem fusão de denominadores</title><desc id="desc">Histórico cinco de oito, quarentena zero de três, sucessor zero de oito e sandbox dois de oito. Barras mostram contagens avaliáveis, não valores de erro nem resultados do futuro.</desc><rect width="960" height="390" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="21" fill="#173753" font-weight="bold" text-anchor="start">2. Quatro universos: zero observado não é resultado igual a zero</text><text x="26" y="88" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">Histórico 049</text><rect x="257" y="70" width="360" height="23" rx="8" fill="#d7e4ec" stroke="none"/><rect x="257" y="70" width="225.0" height="23" rx="8" fill="#146b83" stroke="none"/><text x="642" y="88" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">5 de 8, guarda t19 violada</text><text x="26" y="157" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">Quarentena t23–t25</text><rect x="257" y="139" width="360" height="23" rx="8" fill="#d7e4ec" stroke="none"/><rect x="257" y="139" width="0.0" height="23" rx="8" fill="#146b83" stroke="none"/><text x="642" y="157" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">sem emissão ou observado</text><text x="26" y="226" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">Sucessor t26–t33</text><rect x="257" y="208" width="360" height="23" rx="8" fill="#d7e4ec" stroke="none"/><rect x="257" y="208" width="0.0" height="23" rx="8" fill="#146b83" stroke="none"/><text x="642" y="226" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">proposta; MAE não estimável</text><text x="26" y="295" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">SANDBOX-057</text><rect x="257" y="277" width="360" height="23" rx="8" fill="#d7e4ec" stroke="none"/><rect x="257" y="277" width="90.0" height="23" rx="8" fill="#146b83" stroke="none"/><text x="642" y="295" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">2 de 8, seis pendentes</text></g></svg>