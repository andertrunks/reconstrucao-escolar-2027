<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="t d"><title id="t">Três variações de menos dois</title><desc id="d">Reta numérica de menos seis a zero com três setas sucessivas de duas unidades para a esquerda, mostrando três vezes menos dois igual a menos seis.</desc><g fill="none" stroke="currentColor" stroke-width="3"><line x1="90" y1="150" x2="710" y2="150"/><path d="M690 145l20 5-20 5"/><path d="M650 100C600 65 535 65 485 100"/><path d="M470 100l15 0-5 14"/><path d="M450 100C400 65 335 65 285 100"/><path d="M270 100l15 0-5 14"/><path d="M250 100C200 65 135 65 105 100"/><path d="M90 100l15 0-5 14"/></g><g fill="currentColor" font-family="sans-serif" font-size="24" text-anchor="middle"><text x="650" y="185">0</text><text x="470" y="185">-2</text><text x="270" y="185">-4</text><text x="90" y="185">-6</text><text x="565" y="60">-2</text><text x="365" y="60">-2</text><text x="170" y="60">-2</text><text x="400" y="245">3 × (-2) = -6</text></g></svg>
