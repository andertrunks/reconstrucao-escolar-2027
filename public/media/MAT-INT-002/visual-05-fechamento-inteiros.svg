<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="t d"><title id="t">Fechamento das operações nos inteiros</title><desc id="d">Quadro indica que soma, subtração e multiplicação de inteiros permanecem em Z. Na divisão, menos dezoito dividido por seis dá menos três em Z, mas cinco dividido por dois dá dois vírgula cinco fora de Z.</desc><g fill="none" stroke="currentColor" stroke-width="2"><rect x="70" y="40" width="780" height="280"/><line x1="70" y1="110" x2="850" y2="110"/><line x1="70" y1="180" x2="850" y2="180"/><line x1="70" y1="250" x2="850" y2="250"/><line x1="390" y1="40" x2="390" y2="320"/></g><g fill="currentColor" font-family="sans-serif" font-size="23" text-anchor="middle"><text x="230" y="82">operação</text><text x="620" y="82">resultado entre inteiros</text><text x="230" y="152">+ e -</text><text x="620" y="152">sempre permanece em Z</text><text x="230" y="222">×</text><text x="620" y="222">sempre permanece em Z</text><text x="230" y="292">÷</text><text x="620" y="282">-18÷6=-3 está em Z</text><text x="620" y="310">5÷2=2,5 não está em Z</text><text x="460" y="365">Z não é fechado para divisão</text></g></svg>
