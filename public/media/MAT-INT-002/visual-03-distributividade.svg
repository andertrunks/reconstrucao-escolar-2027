<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Justificativa distributiva de negativo por negativo</title><desc id="d">Esquema parte de dois mais menos dois igual a zero, multiplica por menos três, distribui e conclui que menos três vezes menos dois precisa ser mais seis.</desc><g fill="none" stroke="currentColor" stroke-width="2"><rect x="90" y="35" width="720" height="60"/><rect x="90" y="125" width="720" height="60"/><rect x="90" y="215" width="720" height="60"/><path d="M450 95v30M440 115l10 10 10-10M450 185v30M440 205l10 10 10-10"/></g><g fill="currentColor" font-family="sans-serif" font-size="26" text-anchor="middle"><text x="450" y="74">2 + (-2) = 0</text><text x="450" y="164">(-3)×[2+(-2)] = 0</text><text x="450" y="254">-6 + (-3)×(-2) = 0</text><text x="450" y="330">logo, (-3)×(-2) = +6</text></g></svg>
