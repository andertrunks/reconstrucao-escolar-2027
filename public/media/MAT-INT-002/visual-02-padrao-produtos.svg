<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="t d"><title id="t">Padrão de produtos ao atravessar o zero</title><desc id="d">Tabela mostra dois vezes três igual a seis, um vezes três igual a três, zero vezes três igual a zero, menos um vezes três igual a menos três e menos dois vezes três igual a menos seis.</desc><g fill="none" stroke="currentColor" stroke-width="2"><rect x="120" y="40" width="580" height="260"/><line x1="410" y1="40" x2="410" y2="300"/><line x1="120" y1="92" x2="700" y2="92"/><line x1="120" y1="144" x2="700" y2="144"/><line x1="120" y1="196" x2="700" y2="196"/><line x1="120" y1="248" x2="700" y2="248"/></g><g fill="currentColor" font-family="sans-serif" font-size="25" text-anchor="middle"><text x="265" y="76">fator</text><text x="555" y="76">produto por 3</text><text x="265" y="128">2</text><text x="555" y="128">6</text><text x="265" y="180">1</text><text x="555" y="180">3</text><text x="265" y="232">0</text><text x="555" y="232">0</text><text x="265" y="284">-1</text><text x="555" y="284">-3</text><text x="410" y="340">ao reduzir 1 no fator, o produto reduz 3</text></g></svg>
