<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="t d"><title id="t">Famílias inversas de multiplicação e divisão com sinais</title><desc id="d">Quatro linhas ligam produtos e divisões equivalentes para mostrar que a regra de sinais da divisão vem da multiplicação.</desc><g fill="none" stroke="currentColor" stroke-width="2"><rect x="70" y="40" width="840" height="280"/><line x1="70" y1="110" x2="910" y2="110"/><line x1="70" y1="180" x2="910" y2="180"/><line x1="70" y1="250" x2="910" y2="250"/><line x1="490" y1="40" x2="490" y2="320"/></g><g fill="currentColor" font-family="sans-serif" font-size="24" text-anchor="middle"><text x="280" y="82">3×4=12</text><text x="700" y="82">12÷3=4</text><text x="280" y="152">3×(-4)=-12</text><text x="700" y="152">-12÷3=-4</text><text x="280" y="222">(-3)×4=-12</text><text x="700" y="222">-12÷(-3)=4</text><text x="280" y="292">(-3)×(-4)=12</text><text x="700" y="292">12÷(-3)=-4</text><text x="490" y="365">divisor × quociente = dividendo</text></g></svg>
