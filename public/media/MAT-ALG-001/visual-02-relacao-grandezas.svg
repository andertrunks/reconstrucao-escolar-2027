<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Uma relação entre duas grandezas escrita com letras</title><desc id="d">Uma tabela mostra x assumindo zero, um, dois e três e y assumindo três, cinco, sete e nove, segundo a regra y igual a duas vezes x mais três.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="76" text-anchor="middle" font-family="Arial" font-size="28">Uma regra pode relacionar grandezas</text><text x="450" y="125" text-anchor="middle" font-family="Arial" font-size="28">y = 2x + 3</text><line x1="325" y1="160" x2="575" y2="160" stroke="currentColor" stroke-width="3"/><line x1="450" y1="145" x2="450" y2="365" stroke="currentColor" stroke-width="2"/><g font-family="Arial" font-size="24" text-anchor="middle"><text x="385" y="190">x</text><text x="515" y="190">y</text><text x="385" y="235">0</text><text x="515" y="235">3</text><text x="385" y="280">1</text><text x="515" y="280">5</text><text x="385" y="325">2</text><text x="515" y="325">7</text><text x="385" y="370">3</text><text x="515" y="370">9</text></g><text x="450" y="430" text-anchor="middle" font-family="Arial" font-size="21">x varia; y também varia seguindo a mesma regra.</text></svg>