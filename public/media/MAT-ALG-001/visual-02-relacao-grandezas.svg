<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">DUAS GRANDEZAS, UMA REGRA</title><desc id="desc">A relação y = 2x + 3 pode ser mostrada em tabela e gráfico Identifique as letras. x representa a entrada. y depende de x pela mesma regra. y = 2x + 3. Grandezas numéricas, sem unidade Calcule a tabela. Para x=0,1,2,3, as saídas são respectivamente 3,5,7,9. 0→3 | 1→5 | 2→7 | 3→9. Cada linha é um par O valor inicial. Quando x é zero, y vale três. A regra não começa em zero. y(0) = 3. O termo constante é 3 Visualize a relação. Os pontos seguem uma reta. Ela sobe 2 para cada x+1. taxa: +2 por unidade. Eixos identificados Faça uma previsão. Se x=4, dobramos quatro e adicionamos três. y = 2·4 + 3 = 11. A mesma regra continua O que aprender. A letra x pode percorrer valores. y acompanha sua variação. x muda → y muda. Relações serão aprofundadas</desc><defs><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#head)"/><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">DUAS GRANDEZAS, UMA REGRA</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">A relação y = 2x + 3 pode ser mostrada em tabela e gráfico</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><tex