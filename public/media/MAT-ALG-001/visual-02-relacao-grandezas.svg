inicial</text><text x="1098" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1f374e">Quando x é zero, y vale três.</text><text x="1098" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1f374e">A regra não começa em zero.</text><rect x="1094" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="1326" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">y(0) = 3</text><text x="1098" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">O termo constante é 3</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="98" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Visualize a relação</text><rect x="119" y="621" width="304" height="202" fill="#fff" stroke="#c0d1dc"/><line x1="119" y1="621" x2="119" y2="823" stroke="#e1e8ed"/><line x1="119" y1="823" x2="423" y2="823" stroke="#e1e8ed"/><text x="119" y="843" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="500" fill="#244761">0</text><text x="104" y="828" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="500" fill="#244761">0</text><line x1="195" y1="621" x2="195" y2="823" stroke="#e1e8ed"/><line x1="119" y1="772.5" x2="423" y2="772.5" stroke="#e1e8ed"/><text x="195" y="843" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-s