<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Incógnita como valor específico a descobrir</title><desc id="d">Uma balança conceitual mostra x mais cinco de um lado e doze do outro. A legenda explica que a incógnita é o valor que torna a igualdade verdadeira, sem resolver a equação.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="75" text-anchor="middle" font-family="Arial" font-size="28">Incógnita: um valor específico desconhecido</text><line x1="250" y1="300" x2="650" y2="300" stroke="currentColor" stroke-width="6"/><line x1="450" y1="220" x2="450" y2="365" stroke="currentColor" stroke-width="6"/><path d="M390 365 H510 L450 415 Z" fill="none" stroke="currentColor" stroke-width="4"/><rect x="145" y="170" width="220" height="95" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><text x="255" y="228" text-anchor="middle" font-family="Arial" font-size="30">x + 5</text><rect x="535" y="170" width="220" height="95" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><text x="645" y="228" text-anchor="middle" font-family="Arial" font-size="30">12</text><text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="21">A pergunta é: qual valor de x torna os dois lados iguais?</text></svg>