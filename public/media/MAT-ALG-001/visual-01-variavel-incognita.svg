<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Variável e incógnita: dois papéis diferentes para letras</title><desc id="d">À esquerda, uma variável x assume vários valores e produz resultados diferentes. À direita, uma incógnita x aparece em uma igualdade e representa um valor específico a descobrir.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="75" text-anchor="middle" font-family="Arial" font-size="28">A letra pode cumprir papéis diferentes</text><line x1="450" y1="100" x2="450" y2="405" stroke="currentColor" stroke-width="2"/><text x="230" y="135" text-anchor="middle" font-family="Arial" font-size="25">Variável</text><text x="675" y="135" text-anchor="middle" font-family="Arial" font-size="25">Incógnita</text><text x="230" y="195" text-anchor="middle" font-family="Arial" font-size="27">y = 2x</text><text x="230" y="245" text-anchor="middle" font-family="Arial" font-size="22">x pode ser 1, 2, 3...</text><text x="230" y="295" text-anchor="middle" font-family="Arial" font-size="22">y muda junto com x</text><text x="675" y="195" text-anchor="middle" font-family="Arial" font-size="27">x + 5 = 12</text><text x="675" y="245" text-anchor="middle" font-family="Arial" font-size="22">há um valor específico</text><text x="675" y="295" text-anchor="middle" font-family="Arial" font-size="22">que torna a igualdade verdadeira</text><text x="450" y="440" text-anchor="middle" font-family="Arial" font-size="21">A letra não tem um significado fixo: o contexto determina seu papel.</text></svg>