<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Uma mesma variável pode assumir valores diferentes</title><desc id="d">Cartões mostram x igual a um, x igual a dois, x igual a cinco e x igual a dez aplicados à expressão três x mais um, produzindo quatro, sete, dezesseis e trinta e um.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="76" text-anchor="middle" font-family="Arial" font-size="28">Variável: valores mudam, a regra permanece</text><text x="450" y="125" text-anchor="middle" font-family="Arial" font-size="28">3x + 1</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="175" width="155" height="145" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><text x="168" y="220" font-size="23">x = 1</text><text x="168" y="275" font-size="25">3×1+1 = 4</text><rect x="280" y="175" width="155" height="145" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><text x="358" y="220" font-size="23">x = 2</text><text x="358" y="275" font-size="25">3×2+1 = 7</text><rect x="470" y="175" width="155" height="145" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><text x="548" y="220" font-size="23">x = 5</text><text x="548" y="275" font-size="25">3×5+1 = 16</text><rect x="660" y="175" width="155" height="145" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><text x="738" y="220" font-size="23">x = 10</text><text x="738" y="275" font-size="23">3×10+1 = 31</text></g><text x="450" y="410" text-anchor="middle" font-family="Arial" font-size="21">A variável representa números possíveis dentro do contexto.</text></svg>