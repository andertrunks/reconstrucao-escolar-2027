<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">UMA REGRA, VÁRIOS VALORES</title><desc id="desc">A expressão 3x+1 muda quando escolhemos outra entrada Regra algébrica. Multiplique x por três. Depois adicione uma unidade. 3x + 1. A regra permanece Substitua x = 1. Três vezes um é três. Depois some um. 3·1 + 1 = 4. Primeiro valor Substitua x = 2. Três vezes dois é seis. Depois some um. 3·2 + 1 = 7. Segundo valor Compare quatro entradas. Para x=1,2,5,10, os valores são 4, 7, 16 e 31, nessa ordem. x → 3x+1. Tabela com quatro linhas Valor x = 5. O resultado é quinze mais um. Assim obtemos dezesseis. 3·5 + 1 = 16. O cálculo depende do x Conclusão. A letra não é uma abreviação de um objeto do problema. x representa número. A regra vale para vários x</desc><defs><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#head)"/><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">UMA REGRA, VÁRIOS VALORES</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">A expressão 3x+1 muda quando escolhemos outra entrada</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="98" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fo