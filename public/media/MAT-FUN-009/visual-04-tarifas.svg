<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">TARIFAS: ONDE AS DUAS RETAS SE CRUZAM?</title><desc id="desc">O sistema encontra o consumo em que os custos se igualam</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#032e67"/><stop offset="1" stop-color="#0a5dad"/></linearGradient></defs><rect x="12" y="12" width="1576" height="116" rx="20" fill="url(#blue)" /><text x="800" y="68" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#fff">TARIFAS: ONDE AS DUAS RETAS SE CRUZAM?</text><text x="800" y="103" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e7f3ff">O sistema encontra o consumo em que os custos se igualam</text><rect x="24" y="146" width="506" height="364" rx="17" fill="#eaf4ff" stroke="#0767bc" stroke-width="2"/><rect x="24" y="146" width="506" height="68" rx="15" fill="#0767bc" /><circle cx="58" cy="180" r="24" fill="#ffffff" opacity=".22"/><text x="58" y="189" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">1</text><text x="97" y="190" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Duas regras</text><text x="51" y="261" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Plano A: fixo 20, mais 2 por unidade.</text><text x="51" y="296" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Plano B: fixo 50, mais 1 por unidade.</text><text x="51" y="331" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">x é consumo, y é custo em reais.</text><rect x="47" y="371" width="460" height="68" rx="11" fill="#fff" /><text x="277" y="416" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">A=20+2x · B=50+x</text><text x="49" y="481" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#0767bc">Modelos ilustrativos</text><rect x="548" y="146" width="506" height="364" rx="17" fill="#e9f9ef" stroke="#07844d" stroke-width="2"/><rect x="548" y="146" width="506" height="68" rx="15" fill="#07844d" /><circle cx="582" cy="180" r="24" fill="#ffffff" opacity=".22"/><text x="582" y="189" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">2</text><text x="621" y="190" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Igualar os custos</text><text x="575" y="261" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Os dois planos empatam quando</text><text x="575" y="296" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">a mesma quantidade produz</text><text x="575" y="331" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">o mesmo custo total.</text><rect x="571" y="371" width="460" height="68" rx="11" fill="#fff" /><text x="801" y="416" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">20 + 2x = 50 + x</text><text x="573" y="481" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#07844d">Não iguale cada uma a zero</text><rect x="1072" y="146" width="506" height="364" rx="17" fill="#fff2e4" stroke="#dc5a13" stroke-width="2"/><rect x="1072" y="146" width="506" height="68" rx="15" fill="#dc5a13" /><circle cx="1106" cy="180" r="24" fill="#ffffff" opacity=".22"/><text x="1106" y="189" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">3</text><text x="1145" y="190" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Resolva a igualdade</text><text x="1099" y="261" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Subtraindo x dos dois lados:</text><text x="1099" y="296" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">20 + x = 50.</text><text x="1099" y="331" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Logo x = 30 unidades.</text><rect x="1095" y="371" width="460" height="68" rx="11" fill="#fff" /><text x="1325" y="416" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">y = R$ 80</text><text x="1097" y="481" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#dc5a13">Ponto: (30, 80)</text><rect x="24" y="528" width="506" height="364" rx="17" fill="#f3ebff" stroke="#773cc4" stroke-width="2"/><rect x="24" y="528" width="506" height="68" rx="15" fill="#773cc4" /><circle cx="58" cy="562" r="24" fill="#ffffff" opacity=".22"/><text x="58" y="571" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">4</text><text x="97" y="572" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Consumo de 10</text><text x="51" y="643" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Plano A: 20 + 2 × 10 = 40.</text><text x="51" y="678" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Plano B: 50 + 10 = 60.</text><text x="51" y="713" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">O A custa R$ 20 menos.</text><rect x="47" y="753" width="460" height="68" rx="11" fill="#fff" /><text x="277" y="798" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">A(10) = R$ 40</text><text x="49" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#773cc4">Antes do ponto de empate</text><rect x="548" y="528" width="506" height="364" rx="17" fill="#ffebef" stroke="#cf3352" stroke-width="2"/><rect x="548" y="528" width="506" height="68" rx="15" fill="#cf3352" /><circle cx="582" cy="562" r="24" fill="#ffffff" opacity=".22"/><text x="582" y="571" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">5</text><text x="621" y="572" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Consumo de 40</text><text x="575" y="643" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Plano A: 20 + 2 × 40 = 100.</text><text x="575" y="678" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Plano B: 50 + 40 = 90.</text><text x="575" y="713" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">O B custa R$ 10 menos.</text><rect x="571" y="753" width="460" height="68" rx="11" fill="#fff" /><text x="801" y="798" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">B(40) = R$ 90</text><text x="573" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#cf3352">Depois do ponto de empate</text><rect x="1072" y="528" width="506" height="364" rx="17" fill="#e7f9fb" stroke="#088d9f" stroke-width="2"/><rect x="1072" y="528" width="506" height="68" rx="15" fill="#088d9f" /><circle cx="1106" cy="562" r="24" fill="#ffffff" opacity=".22"/><text x="1106" y="571" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">6</text><text x="1145" y="572" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Gráfico das tarifas</text><text x="1099" y="643" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Azul = custo do Plano A.</text><text x="1099" y="678" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Vermelho = custo do Plano B.</text><text x="1097" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#088d9f">Encontro em (30,80)</text><path d="M1168 839L1498 839" stroke="#3b5269" stroke-width="2" fill="none"/><path d="M1168 839L1168 704" stroke="#3b5269" stroke-width="2" fill="none"/><path d="M1168.0 816.5 L1465.0 715.3" stroke="#0767bc" stroke-width="4" fill="none"/><path d="M1168.0 782.8 L1498.0 726.5" stroke="#cf3352" stroke-width="4" fill="none"/><circle cx="1366" cy="749" r="5" fill="#071a3f"/><text x="1375" y="741" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#173054">(30,80)</text><rect x="16" y="908" width="1568" height="38" rx="10" fill="#07376d" /><text x="800" y="936" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">Abaixo de 30, A é menor. Acima de 30, B é menor.</text></svg>