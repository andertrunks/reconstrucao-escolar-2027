<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 530"><title id="title">Dados suficientes, insuficientes ou contraditórios</title><desc id="desc">Compare uma interseção, uma reta repetida e duas retas paralelas.</desc><rect width="900" height="530" fill="#fff"/><text x="30" y="40" fill="#243244" font-size="24" font-family="Arial,sans-serif">Dados suficientes, insuficientes ou contraditórios</text><text x="30" y="72" fill="#243244" font-size="14" font-family="Arial,sans-serif">Compare uma interseção, uma reta repetida e duas retas paralelas.</text><rect x="35" y="138" width="260" height="239" rx="10" fill="#eef3ff" stroke="#64748b"/><text x="65" y="174" fill="#243244" font-size="20" font-family="Arial,sans-serif">Uma solução</text><text x="52" y="215" fill="#243244" font-size="19" font-family="Arial,sans-serif">x+y=10</text><text x="52" y="253" fill="#243244" font-size="19" font-family="Arial,sans-serif">2x+y=14</text><text x="52" y="316" fill="#243244" font-size="18" font-family="Arial,sans-serif">Encontro: (4,6)</text><rect x="321" y="138" width="260" height="239" rx="10" fill="#f0fdf4" stroke="#64748b"/><text x="341" y="174" fill="#243244" font-size="19" font-family="Arial,sans-serif">Várias soluções</text><text x="335" y="215" fill="#243244" font-size="19" font-family="Arial,sans-serif">x+y=5</text><text x="335" y="253" fill="#243244" font-size="19" font-family="Arial,sans-serif">2x+2y=10</text><text x="336" y="316" fill="#243244" font-size="18" font-family="Arial,sans-serif">Mesma reta</text><rect x="607" y="138" width="260" height="239" rx="10" fill="#fef2f2" stroke="#64748b"/><text x="623" y="174" fill="#243244" font-size="19" font-family="Arial,sans-serif">Nenhuma solução</text><text x="625" y="215" fill="#243244" font-size="19" font-family="Arial,sans-serif">x+y=5</text><text x="625" y="253" fill="#243244" font-size="19" font-family="Arial,sans-serif">2x+2y=12</text><text x="625" y="316" fill="#243244" font-size="18" font-family="Arial,sans-serif">Retas paralelas</text><text x="238" y="503" fill="#243244" font-size="15" font-family="Arial,sans-serif">A informação precisa ser independente e consistente</text></svg>