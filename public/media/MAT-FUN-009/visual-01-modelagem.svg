<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 955" role="img" aria-labelledby="title desc"><title id="title">MODELAGEM: DA LEITURA À EQUAÇÃO</title><desc id="desc">Transforme uma bilheteria fictícia em duas condições simultâneas</desc><rect x="0" y="0" width="1600" height="955" rx="0" fill="#fff" /><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#032e67"/><stop offset="1" stop-color="#0a5dad"/></linearGradient></defs><rect x="12" y="12" width="1576" height="116" rx="20" fill="url(#blue)" /><text x="800" y="68" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#fff">MODELAGEM: DA LEITURA À EQUAÇÃO</text><text x="800" y="103" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e7f3ff">Transforme uma bilheteria fictícia em duas condições simultâneas</text><rect x="24" y="146" width="506" height="364" rx="17" fill="#eaf4ff" stroke="#0767bc" stroke-width="2"/><rect x="24" y="146" width="506" height="68" rx="15" fill="#0767bc" /><circle cx="58" cy="180" r="24" fill="#ffffff" opacity=".22"/><text x="58" y="189" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">1</text><text x="97" y="190" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Entenda os dados</text><text x="51" y="261" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Há 10 ingressos vendidos.</text><text x="51" y="296" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Inteira: R$ 20; meia: R$ 10.</text><text x="51" y="331" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">A receita foi de R$ 140.</text><rect x="47" y="371" width="460" height="68" rx="11" fill="#fff" /><text x="277" y="416" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">10 ingressos · R$ 140</text><text x="49" y="481" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#0767bc">Dados de contagem e dinheiro</text><rect x="548" y="146" width="506" height="364" rx="17" fill="#e9f9ef" stroke="#07844d" stroke-width="2"/><rect x="548" y="146" width="506" height="68" rx="15" fill="#07844d" /><circle cx="582" cy="180" r="24" fill="#ffffff" opacity=".22"/><text x="582" y="189" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">2</text><text x="621" y="190" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Nomeie as variáveis</text><text x="575" y="261" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">x = quantidade de inteiras</text><text x="575" y="296" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">y = quantidade de meias</text><text x="575" y="331" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Ambas medidas em ingressos.</text><rect x="571" y="371" width="460" height="68" rx="11" fill="#fff" /><text x="801" y="416" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">x   e   y</text><text x="573" y="481" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#07844d">Unidades explícitas</text><rect x="1072" y="146" width="506" height="364" rx="17" fill="#fff2e4" stroke="#dc5a13" stroke-width="2"/><rect x="1072" y="146" width="506" height="68" rx="15" fill="#dc5a13" /><circle cx="1106" cy="180" r="24" fill="#ffffff" opacity=".22"/><text x="1106" y="189" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">3</text><text x="1145" y="190" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Traduza a contagem</text><text x="1099" y="261" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Todo ingresso pertence a um</text><text x="1099" y="296" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">dos dois tipos informados.</text><text x="1099" y="331" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">A soma é de 10 ingressos.</text><rect x="1095" y="371" width="460" height="68" rx="11" fill="#fff" /><text x="1325" y="416" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">x + y = 10</text><text x="1097" y="481" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#dc5a13">Primeira condição</text><rect x="24" y="528" width="506" height="364" rx="17" fill="#f3ebff" stroke="#773cc4" stroke-width="2"/><rect x="24" y="528" width="506" height="68" rx="15" fill="#773cc4" /><circle cx="58" cy="562" r="24" fill="#ffffff" opacity=".22"/><text x="58" y="571" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">4</text><text x="97" y="572" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Traduza a receita</text><text x="51" y="643" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Cada ingresso inteiro vale 20.</text><text x="51" y="678" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Cada meia-entrada vale 10.</text><text x="51" y="713" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">A soma arrecadada é R$ 140.</text><rect x="47" y="753" width="460" height="68" rx="11" fill="#fff" /><text x="277" y="798" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">20x + 10y = 140</text><text x="49" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#773cc4">Segunda condição</text><rect x="548" y="528" width="506" height="364" rx="17" fill="#ffebef" stroke="#cf3352" stroke-width="2"/><rect x="548" y="528" width="506" height="68" rx="15" fill="#cf3352" /><circle cx="582" cy="562" r="24" fill="#ffffff" opacity=".22"/><text x="582" y="571" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">5</text><text x="621" y="572" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Resolva o sistema</text><text x="575" y="643" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Divida a segunda por 10.</text><text x="575" y="678" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Obtenha 2x + y = 14.</text><text x="575" y="713" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">Subtraia x + y = 10.</text><rect x="571" y="753" width="460" height="68" rx="11" fill="#fff" /><text x="801" y="798" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">x = 4;  y = 6</text><text x="573" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#cf3352">Substituição ou eliminação</text><rect x="1072" y="528" width="506" height="364" rx="17" fill="#e7f9fb" stroke="#088d9f" stroke-width="2"/><rect x="1072" y="528" width="506" height="68" rx="15" fill="#088d9f" /><circle cx="1106" cy="562" r="24" fill="#ffffff" opacity=".22"/><text x="1106" y="571" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#fff">6</text><text x="1145" y="572" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#fff">Confira no contexto</text><text x="1099" y="643" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">4 + 6 = 10 ingressos.</text><text x="1099" y="678" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">20 × 4 + 10 × 6 = 140.</text><text x="1099" y="713" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#173054">A resposta atende às condições.</text><rect x="1095" y="753" width="460" height="68" rx="11" fill="#fff" /><text x="1325" y="798" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d57">4 inteiras · 6 meias</text><text x="1097" y="863" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#088d9f">Solução verificada</text><rect x="16" y="908" width="1568" height="38" rx="10" fill="#07376d" /><text x="800" y="936" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#fff">Defina as incógnitas antes de iniciar as contas.</text></svg>