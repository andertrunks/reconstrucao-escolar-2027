<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 530"><title id="title">Da linguagem cotidiana ao sistema</title><desc id="desc">Dez ingressos: quantidade total e receita de 140 reais.</desc><rect width="900" height="530" fill="#fff"/><text x="30" y="40" fill="#243244" font-size="24" font-family="Arial,sans-serif">Da linguagem cotidiana ao sistema</text><text x="30" y="72" fill="#243244" font-size="14" font-family="Arial,sans-serif">Dez ingressos: quantidade total e receita de 140 reais.</text><rect x="60" y="115" width="360" height="77" rx="10" fill="#eef3ff" stroke="#64748b"/><text x="86" y="147" fill="#243244" font-size="20" font-family="Arial,sans-serif">Contagem: 10 ingressos</text><text x="95" y="176" fill="#243244" font-size="20" font-family="Arial,sans-serif">x+y=10</text><rect x="478" y="115" width="360" height="77" rx="10" fill="#f0fdf4" stroke="#64748b"/><text x="494" y="147" fill="#243244" font-size="20" font-family="Arial,sans-serif">Receita: R$140</text><text x="500" y="176" fill="#243244" font-size="20" font-family="Arial,sans-serif">20x+10y=140</text><path d="M260 192L375 300" stroke="#64748b" stroke-width="3"/><path d="M665 192L525 300" stroke="#64748b" stroke-width="3"/><rect x="278" y="304" width="344" height="89" rx="10" fill="#fff7ed" stroke="#64748b"/><text x="309" y="339" fill="#243244" font-size="22" font-family="Arial,sans-serif">x=4; y=6</text><text x="293" y="368" fill="#243244" font-size="18" font-family="Arial,sans-serif">4 inteiros e 6 descontos</text><text x="238" y="503" fill="#243244" font-size="15" font-family="Arial,sans-serif">Legenda: duas informações que produzem duas igualdades</text></svg>