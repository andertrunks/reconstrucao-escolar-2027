<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 530"><title id="title">Tabela de verificação de pares</title><desc id="desc">A contagem é igual, mas só um par satisfaz a receita.</desc><rect width="900" height="530" fill="#fff"/><text x="30" y="40" fill="#243244" font-size="24" font-family="Arial,sans-serif">Tabela de verificação de pares</text><text x="30" y="72" fill="#243244" font-size="14" font-family="Arial,sans-serif">A contagem é igual, mas só um par satisfaz a receita.</text><rect x="60" y="130" width="780" height="295" rx="10" fill="#f8fafc" stroke="#64748b"/><text x="105" y="174" fill="#243244" font-size="18" font-family="Arial,sans-serif">x (inteiros)</text><text x="329" y="174" fill="#243244" font-size="18" font-family="Arial,sans-serif">y (descontos)</text><text x="604" y="174" fill="#243244" font-size="18" font-family="Arial,sans-serif">Receita (R$)</text><path d="M70 193L825 193" stroke="#64748b" stroke-width="3"/><text x="160" y="242" fill="#243244" font-size="18" font-family="Arial,sans-serif">2</text><text x="389" y="242" fill="#243244" font-size="18" font-family="Arial,sans-serif">8</text><text x="652" y="242" fill="#243244" font-size="18" font-family="Arial,sans-serif">120</text><text x="160" y="302" fill="#243244" font-size="18" font-family="Arial,sans-serif">4</text><text x="389" y="302" fill="#243244" font-size="18" font-family="Arial,sans-serif">6</text><text x="652" y="302" fill="#243244" font-size="18" font-family="Arial,sans-serif">140  ✓</text><text x="160" y="362" fill="#243244" font-size="18" font-family="Arial,sans-serif">6</text><text x="389" y="362" fill="#243244" font-size="18" font-family="Arial,sans-serif">4</text><text x="652" y="362" fill="#243244" font-size="18" font-family="Arial,sans-serif">160</text><text x="110" y="403" fill="#243244" font-size="17" font-family="Arial,sans-serif">Pares comparados: (2,8), (4,6) e (6,4).</text><text x="238" y="503" fill="#243244" font-size="15" font-family="Arial,sans-serif">Conclusão: o par (4,6) atende às duas condições</text></svg>