<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Frações equivalentes na reta numérica</title><desc id="d">Um meio, dois quartos e quatro oitavos estão no mesmo ponto entre zero e um.</desc><rect width="900" height="300" fill="white"/><line x1="120" y1="180" x2="780" y2="180" stroke="black" stroke-width="4"/><g stroke="black" stroke-width="3"><line x1="120" y1="160" x2="120" y2="200"/><line x1="450" y1="145" x2="450" y2="210"/><line x1="780" y1="160" x2="780" y2="200"/></g><circle cx="450" cy="180" r="10" fill="black"/><g font-family="Arial,sans-serif" font-size="28" fill="black"><text x="108" y="235">0</text><text x="765" y="235">1</text><text x="380" y="90">1/2 = 2/4 = 4/8</text><text x="366" y="255">mesmo ponto</text></g></svg>