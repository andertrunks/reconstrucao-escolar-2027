<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="t d"><title id="t">Comparação com mesmo numerador</title><desc id="d">Duas barras iguais mostram três quartos e três sextos; três quartos ocupa mais espaço.</desc><rect width="900" height="320" fill="white"/><g stroke="black" stroke-width="3"><rect x="120" y="70" width="150" height="60" fill="#ddd"/><rect x="270" y="70" width="150" height="60" fill="#ddd"/><rect x="420" y="70" width="150" height="60" fill="#ddd"/><rect x="570" y="70" width="150" height="60" fill="white"/><rect x="120" y="190" width="100" height="60" fill="#ddd"/><rect x="220" y="190" width="100" height="60" fill="#ddd"/><rect x="320" y="190" width="100" height="60" fill="#ddd"/><rect x="420" y="190" width="100" height="60" fill="white"/><rect x="520" y="190" width="100" height="60" fill="white"/><rect x="620" y="190" width="100" height="60" fill="white"/></g><g font-family="Arial,sans-serif" font-size="28" fill="black"><text x="35" y="110">3/4</text><text x="35" y="230">3/6</text><text x="745" y="175">3/4 &gt; 3/6</text></g></svg>