<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Rede de socialização</title><desc id="desc">Uma pessoa no centro ligada a família, escola, pares, mídias, trabalho e instituições.</desc><rect width="960" height="540" fill="white"/><g fill="none" stroke="#333" stroke-width="3"><line x1="480" y1="270" x2="190" y2="120"/><line x1="480" y1="270" x2="480" y2="90"/><line x1="480" y1="270" x2="770" y2="120"/><line x1="480" y1="270" x2="190" y2="420"/><line x1="480" y1="270" x2="480" y2="450"/><line x1="480" y1="270" x2="770" y2="420"/></g><g fill="white" stroke="#222" stroke-width="3"><circle cx="480" cy="270" r="75"/><circle cx="190" cy="120" r="65"/><circle cx="480" cy="90" r="65"/><circle cx="770" cy="120" r="65"/><circle cx="190" cy="420" r="65"/><circle cx="480" cy="450" r="65"/><circle cx="770" cy="420" r="65"/></g><g font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111"><text x="480" y="278">INDIVÍDUO</text><text x="190" y="128">Família</text><text x="480" y="98">Escola</text><text x="770" y="128">Pares</text><text x="190" y="428">Mídias</text><text x="480" y="458">Trabalho</text><text x="770" y="413">Instituições</text></g><text x="480" y="520" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Socialização ocorre em uma rede de relações.</text></svg>