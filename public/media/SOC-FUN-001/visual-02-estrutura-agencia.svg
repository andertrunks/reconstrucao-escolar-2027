<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Estrutura e agência</title><desc id="desc">Ciclo em três etapas: estruturas influenciam possibilidades, pessoas e grupos agem, e as ações reproduzem ou transformam estruturas.</desc><rect width="960" height="540" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><g fill="white" stroke="#222" stroke-width="3"><rect x="80" y="190" width="240" height="140" rx="18"/><rect x="360" y="55" width="240" height="140" rx="18"/><rect x="640" y="190" width="240" height="140" rx="18"/></g><g stroke="#333" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M320 215 C365 165 385 145 420 130"/><path d="M600 130 C650 145 680 170 705 195"/><path d="M705 330 C620 455 340 455 255 330"/></g><g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="200" y="235" font-size="25">ESTRUTURAS</text><text x="200" y="270" font-size="19">normas, instituições,</text><text x="200" y="298" font-size="19">recursos e posições</text><text x="480" y="105" font-size="25">AGÊNCIA</text><text x="480" y="140" font-size="19">pessoas e grupos</text><text x="480" y="168" font-size="19">agem e escolhem</text><text x="760" y="235" font-size="25">RESULTADOS</text><text x="760" y="270" font-size="19">reproduzem ou</text><text x="760" y="298" font-size="19">transformam padrões</text><text x="480" y="500" font-size="20">A relação é circular: condicionamento não significa destino imutável.</text></g></svg>