<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Etnocentrismo e contextualização</title><desc id="desc">Dois caminhos contrastam julgamento automático por padrões próprios com investigação do contexto e significado de uma prática.</desc><rect width="960" height="540" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><g fill="white" stroke="#222" stroke-width="3"><rect x="80" y="90" width="300" height="120" rx="16"/><rect x="580" y="90" width="300" height="120" rx="16"/><rect x="80" y="330" width="300" height="120" rx="16"/><rect x="580" y="330" width="300" height="120" rx="16"/></g><g stroke="#333" stroke-width="4" marker-end="url(#arrow)"><line x1="230" y1="210" x2="230" y2="320"/><line x1="730" y1="210" x2="730" y2="320"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#111"><text x="230" y="132" font-size="23">“Meu costume é a</text><text x="230" y="166" font-size="23">regra universal”</text><text x="230" y="382" font-size="25">Julgamento</text><text x="230" y="416" font-size="25">automático</text><text x="730" y="132" font-size="22">“Qual é o contexto</text><text x="730" y="166" font-size="22">e o significado?”</text><text x="730" y="382" font-size="25">Análise</text><text x="730" y="416" font-size="25">fundamentada</text><text x="480" y="505" font-size="20">Contextualizar ajuda a compreender; não obriga aprovação moral.</text></g></svg>