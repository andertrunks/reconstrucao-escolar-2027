<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Do “é assim” à pergunta sociológica</title><desc id="desc">Quatro etapas transformam uma afirmação cotidiana em perguntas históricas, comparativas e explicativas.</desc><rect width="960" height="540" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><g fill="white" stroke="#222" stroke-width="3"><rect x="40" y="190" width="180" height="130" rx="16"/><rect x="275" y="190" width="180" height="130" rx="16"/><rect x="510" y="190" width="180" height="130" rx="16"/><rect x="745" y="170" width="180" height="170" rx="16"/></g><g stroke="#333" stroke-width="4" marker-end="url(#arrow)"><line x1="220" y1="255" x2="265" y2="255"/><line x1="455" y1="255" x2="500" y2="255"/><line x1="690" y1="255" x2="735" y2="255"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#111"><text x="130" y="245" font-size="28">“É assim”</text><text x="130" y="282" font-size="18">naturalização</text><text x="365" y="240" font-size="24">Sempre foi</text><text x="365" y="272" font-size="24">assim?</text><text x="600" y="235" font-size="22">É igual em</text><text x="600" y="267" font-size="22">todos os grupos?</text><text x="835" y="215" font-size="21">Quais processos</text><text x="835" y="247" font-size="21">históricos e sociais</text><text x="835" y="279" font-size="21">explicam essa</text><text x="835" y="311" font-size="21">prática?</text><text x="480" y="450" font-size="22">Desnaturalizar é transformar familiaridade em problema de investigação.</text></g></svg>