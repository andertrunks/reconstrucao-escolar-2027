<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Holt-Winters aditivo: três atualizações</title><desc id="desc">Demonstração artificial de atualização de nível 120,4, tendência 5,08 e efeito sazonal -9,8 após observar y5=111.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193c4b}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#51636c;stroke-width:2;fill:none}.line{stroke:#147890;stroke-width:3;fill:none}.line2{stroke:#bd6f21;stroke-width:3;fill:none}.pale{fill:#e2f2f5;stroke:#15788b;stroke-width:2}.warm{fill:#fff0d5;stroke:#ad7424;stroke-width:2}.dot{fill:#147890}.bar{fill:#9ad3df;stroke:#16778a;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Holt-Winters aditivo: três atualizações</text><text x="32" y="89" class="label" text-anchor="start">Estados iniciais fornecidos apenas para demonstrar a álgebra (não são ajuste do CSV)</text><rect x="35" y="125" width="892" height="77" rx="9" class="pale"/><text x="58" y="154" class="label" text-anchor="start">Nível</text><text x="240" y="154" class="label" text-anchor="start">0,4×(111+10)+0,6×(115+5)</text><text x="760" y="154" class="label" text-anchor="start">120,40</text><rect x="35" y="229" width="892" height="77" rx="9" class="pale"/><text x="58" y="258" class="label" text-anchor="start">Tendência</text><text x="240" y="258" class="label" text-anchor="start">0,2×(120,4−115)+0,8×5</text><text x="760" y="258" class="label" text-anchor="start">5,08</text><rect x="35" y="333" width="892" height="77" rx="9" class="warm"/><text x="58" y="362" class="label" text-anchor="start">Sazonal</text><text x="240" y="362" class="label" text-anchor="start">0,2×(111−120)+0,8×(−10)</text><text x="760" y="362" class="label" text-anchor="start">−9,80</text><text x="35" y="466" class="small" text-anchor="start">Parâmetros fixados para conta: alfa 0,4; beta asterisco 0,2; gama 0,2.</text></svg>