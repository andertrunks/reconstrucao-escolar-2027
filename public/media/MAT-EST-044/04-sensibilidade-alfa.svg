<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Efeito de alfa em uma mesma sequência</title><desc id="desc">O mesmo conjunto 100,120,110,130 com inicialização em 100 termina em níveis 110,16; 120; 126,24 para alfa 0,2; 0,5; 0,8.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193c4b}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#51636c;stroke-width:2;fill:none}.line{stroke:#147890;stroke-width:3;fill:none}.line2{stroke:#bd6f21;stroke-width:3;fill:none}.pale{fill:#e2f2f5;stroke:#15788b;stroke-width:2}.warm{fill:#fff0d5;stroke:#ad7424;stroke-width:2}.dot{fill:#147890}.bar{fill:#9ad3df;stroke:#16778a;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Efeito de alfa em uma mesma sequência</text><path d="M 166 391 L 870 391 M 166 95 L 166 391" class="axis"/><text x="528" y="447" class="label" text-anchor="middle">Valor de alfa (adimensional)</text><text x="37" y="86" class="small" text-anchor="start">Nível após 4 períodos (unidades)</text><path d="M 166 391 L 870 391" stroke="#e9eef1"/><text x="155" y="396" class="small" text-anchor="end">100</text><path d="M 166 311 L 870 311" stroke="#e9eef1"/><text x="155" y="316" class="small" text-anchor="end">110</text><path d="M 166 231 L 870 231" stroke="#e9eef1"/><text x="155" y="236" class="small" text-anchor="end">120</text><path d="M 166 151 L 870 151" stroke="#e9eef1"/><text x="155" y="156" class="small" text-anchor="end">130</text><circle cx="323.0" cy="309.7" r="8" class="dot"/><text x="323.0" y="292.72" class="label" text-anchor="middle">α=0.2 → 110.16</text><text x="323.0" y="412" class="label" text-anchor="middle">0.2</text><circle cx="557.0" cy="231.0" r="8" class="dot"/><text x="557.0" y="214" class="label" text-anchor="middle">α=0.5 → 120.00</text><text x="557.0" y="412" class="label" text-anchor="middle">0.5</text><circle cx="791.0" cy="181.1" r="8" class="dot"/><text x="791.0" y="164.08000000000004" class="label" text-anchor="middle">α=0.8 → 126.24</text><text x="791.0" y="412" class="label" text-anchor="middle">0.8</text></svg>