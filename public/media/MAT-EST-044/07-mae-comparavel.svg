<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Erros médios absolutos no mesmo conjunto futuro</title><desc id="desc">Cinco barras, MAE último 20,25, sazonal ingênuo 19,25, SES 17,62, Holt 19,33 e deslocamento 1,75.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193c4b}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#51636c;stroke-width:2;fill:none}.line{stroke:#147890;stroke-width:3;fill:none}.line2{stroke:#bd6f21;stroke-width:3;fill:none}.pale{fill:#e2f2f5;stroke:#15788b;stroke-width:2}.warm{fill:#fff0d5;stroke:#ad7424;stroke-width:2}.dot{fill:#147890}.bar{fill:#9ad3df;stroke:#16778a;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Erros médios absolutos no mesmo conjunto futuro</text><path d="M 253 393 L 900 393 M 253 94 L 253 393" class="axis"/><text x="567" y="450" class="label" text-anchor="middle">MAE no teste, períodos 9 a 12 (unidades)</text><path d="M 253 391 L 253 399" stroke="#51636c"/><text x="253" y="420" class="small" text-anchor="middle">0</text><path d="M 368 391 L 368 399" stroke="#51636c"/><text x="368" y="420" class="small" text-anchor="middle">5</text><path d="M 483 391 L 483 399" stroke="#51636c"/><text x="483" y="420" class="small" text-anchor="middle">10</text><path d="M 598 391 L 598 399" stroke="#51636c"/><text x="598" y="420" class="small" text-anchor="middle">15</text><path d="M 713 391 L 713 399" stroke="#51636c"/><text x="713" y="420" class="small" text-anchor="middle">20</text><path d="M 828 391 L 828 399" stroke="#51636c"/><text x="828" y="420" class="small" text-anchor="middle">25</text><text x="24" y="139" class="label" text-anchor="start">Último valor</text><rect x="253" y="118" width="465.8" height="31" class="bar"/><text x="730.75" y="140" class="label" text-anchor