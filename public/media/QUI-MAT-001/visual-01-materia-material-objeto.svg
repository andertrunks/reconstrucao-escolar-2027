<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Matéria, material, corpo e objeto</title><desc id="desc">Esquema em quatro etapas diferencia matéria, material, corpo e objeto usando madeira e mesa como exemplo.</desc><rect width="960" height="540" fill="#fff"/><text x="480" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Matéria, material, corpo e objeto</text><g font-family="Arial"><rect x="55" y="125" width="185" height="260" rx="18" fill="#eef3f7" stroke="#263238" stroke-width="2"/><text x="147" y="170" text-anchor="middle" font-size="24" font-weight="700">MATÉRIA</text><text x="147" y="220" text-anchor="middle" font-size="18">Possui massa</text><text x="147" y="250" text-anchor="middle" font-size="18">e ocupa espaço</text><text x="147" y="315" text-anchor="middle" font-size="18">Ex.: madeira,</text><text x="147" y="345" text-anchor="middle" font-size="18">água e ar</text><rect x="280" y="125" width="185" height="260" rx="18" fill="#f6f2ea" stroke="#263238" stroke-width="2"/><text x="372" y="170" text-anchor="middle" font-size="24" font-weight="700">MATERIAL</text><text x="372" y="220" text-anchor="middle" font-size="18">Tipo de matéria</text><text x="372" y="250" text-anchor="middle" font-size="18">considerado por</text><text x="372" y="280" text-anchor="middle" font-size="18">propriedades e uso</text><text x="372" y="345" text-anchor="middle" font-size="18">Ex.: madeira</text><rect x="505" y="125" width="185" height="260" rx="18" fill="#eef6ef" stroke="#263238" stroke-width="2"/><text x="597" y="170" text-anchor="middle" font-size="24" font-weight="700">CORPO</text><text x="597" y="220" text-anchor="middle" font-size="18">Porção delimitada</text><text x="597" y="250" text-anchor="middle" font-size="18">de matéria</text><text x="597" y="345" text-anchor="middle" font-size="18">Ex.: bloco</text><text x="597" y="375" text-anchor="middle" font-size="18">de madeira</text><rect x="730" y="125" width="185" height="260" rx="18" fill="#f3eef7" stroke="#263238" stroke-width="2"/><text x="822" y="170" text-anchor="middle" font-size="24" font-weight="700">OBJETO</text><text x="822" y="220" text-anchor="middle" font-size="18">Corpo com forma</text><text x="822" y="250" text-anchor="middle" font-size="18">e finalidade</text><text x="822" y="345" text-anchor="middle" font-size="18">Ex.: mesa</text><g font-size="30" font-weight="700"><text x="258" y="265">→</text><text x="483" y="265">→</text><text x="708" y="265">→</text></g><text x="480" y="455" text-anchor="middle" font-size="20" font-weight="700">Os termos descrevem aspectos diferentes; não são sinônimos perfeitos.</text><text x="480" y="490" text-anchor="middle" font-size="18">Observe a passagem do conceito amplo de matéria até um objeto com função definida.</text></g></svg>