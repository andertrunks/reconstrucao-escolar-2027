<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Propriedades físicas ajudam a comparar materiais</title><desc id="desc">Sete cartões apresentam densidade, solubilidade, condutividade térmica e elétrica, magnetismo, dureza e elasticidade com perguntas práticas.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial" fill="#17232b"><text x="480" y="48" text-anchor="middle" font-size="29" font-weight="700">Propriedades físicas ajudam a comparar materiais</text><text x="480" y="80" text-anchor="middle" font-size="18">Cada propriedade responde a uma pergunta diferente.</text><g stroke="#263238" stroke-width="2"><rect x="45" y="120" width="260" height="115" rx="16" fill="#eef3f7"/><rect x="350" y="120" width="260" height="115" rx="16" fill="#f6f2ea"/><rect x="655" y="120" width="260" height="115" rx="16" fill="#eef6ef"/><rect x="45" y="270" width="260" height="115" rx="16" fill="#f3eef7"/><rect x="350" y="270" width="260" height="115" rx="16" fill="#f7f4ed"/><rect x="655" y="270" width="260" height="115" rx="16" fill="#eef5f6"/><rect x="350" y="420" width="260" height="115" rx="16" fill="#f3f5ef"/></g><g font-size="20" font-weight="700" text-anchor="middle"><text x="175" y="158">Densidade</text><text x="480" y="158">Solubilidade</text><text x="785" y="158">Condutividade térmica</text><text x="175" y="308">Condutividade elétrica</text><text x="480" y="308">Magnetismo</text><text x="785" y="308">Dureza</text><text x="480" y="458">Elasticidade</text></g><g font-size="16" text-anchor="middle"><text x="175" y="195">Quanta massa há</text><text x="175" y="216">em certo volume?</text><text x="480" y="195">Dissolve-se neste</text><text x="480" y="216">solvente e condição?</text><text x="785" y="195">Transfere calor</text><text x="785" y="216">com facilidade?</text><text x="175" y="345">Permite passagem</text><text x="175" y="366">de corrente?</text><text x="480" y="345">Como responde</text><text x="480" y="366">a um ímã?</text><text x="785" y="345">Resiste a riscos</text><text x="785" y="366">ou marcas?</text><text x="480" y="495">Deforma e recupera</text><text x="480" y="516">a forma?</text></g><text x="480" y="575" text-anchor="middle" font-size="18" font-weight="700">A escolha de um material depende do conjunto de propriedades e da função desejada.</text></g></svg>