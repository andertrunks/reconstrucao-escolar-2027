<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Principais mudanças de estado físico</title><desc id="desc">Diagrama liga sólido, líquido e gasoso por setas com os nomes fusão, solidificação, vaporização, condensação, sublimação e deposição.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial" fill="#18242c"><text x="480" y="50" text-anchor="middle" font-size="30" font-weight="700">Principais mudanças de estado físico</text><g stroke="#263238" stroke-width="2"><rect x="80" y="255" width="200" height="100" rx="18" fill="#eef3f7"/><rect x="380" y="255" width="200" height="100" rx="18" fill="#eef6ef"/><rect x="680" y="255" width="200" height="100" rx="18" fill="#f6f2ea"/></g><g text-anchor="middle" font-size="26" font-weight="700"><text x="180" y="315">SÓLIDO</text><text x="480" y="315">LÍQUIDO</text><text x="780" y="315">GASOSO</text></g><g stroke="#263238" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M280 275 H370"/><path d="M380 335 H290"/><path d="M580 275 H670"/><path d="M680 335 H590"/><path d="M180 245 C220 100 740 100 780 245"/><path d="M780 365 C740 510 220 510 180 365"/></g><g font-size="18" font-weight="700" text-anchor="middle"><text x="325" y="255">FUSÃO</text><text x="335" y="365">SOLIDIFICAÇÃO</text><text x="625" y="255">VAPORIZAÇÃO</text><text x="625" y="365">CONDENSAÇÃO</text><text x="480" y="120">SUBLIMAÇÃO</text><text x="480" y="500">DEPOSIÇÃO</text></g><text x="480" y="555" text-anchor="middle" font-size="18" font-weight="700">Estratégia: identifique primeiro o estado inicial e o final; depois nomeie o processo.</text></g></svg>