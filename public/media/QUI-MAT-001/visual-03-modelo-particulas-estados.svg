<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Modelo de partículas para sólido, líquido e gás</title><desc id="desc">Três recipientes mostram partículas próximas e organizadas no sólido, próximas mas móveis no líquido e afastadas no gás.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial" fill="#18242c"><text x="480" y="50" text-anchor="middle" font-size="30" font-weight="700">Modelo de partículas para sólido, líquido e gás</text><text x="480" y="82" text-anchor="middle" font-size="18">O desenho é um modelo explicativo, não uma fotografia microscópica.</text><g stroke="#263238" stroke-width="3" fill="none"><path d="M80 150 V430 H310 V150"/><path d="M365 150 V430 H595 V150"/><path d="M650 150 V430 H880 V150"/></g><g fill="#455a64"><g id="solid"><circle cx="120" cy="350" r="13"/><circle cx="165" cy="350" r="13"/><circle cx="210" cy="350" r="13"/><circle cx="255" cy="350" r="13"/><circle cx="120" cy="305" r="13"/><circle cx="165" cy="305" r="13"/><circle cx="210" cy="305" r="13"/><circle cx="255" cy="305" r="13"/><circle cx="120" cy="260" r="13"/><circle cx="165" cy="260" r="13"/><circle cx="210" cy="260" r="13"/><circle cx="255" cy="260" r="13"/></g><g id="liquid"><circle cx="405" cy="360" r="13"/><circle cx="449" cy="345" r="13"/><circle cx="490" cy="365" r="13"/><circle cx="538" cy="348" r="13"/><circle cx="420" cy="310" r="13"/><circle cx="466" cy="300" r="13"/><circle cx="516" cy="315" r="13"/><circle cx="555" cy="290" r="13"/><circle cx="400" cy="270" r="13"/><circle cx="450" cy="255" r="13"/></g><g id="gas"><circle cx="690" cy="180" r="13"/><circle cx="820" cy="210" r="13"/><circle cx="740" cy="285" r="13"/><circle cx="855" cy="340" r="13"/><circle cx="680" cy="390" r="13"/><circle cx="790" cy="405" r="13"/><circle cx="845" cy="270" r="13"/></g></g><g text-anchor="middle"><text x="195" y="480" font-size="24" font-weight="700">SÓLIDO</text><text x="195" y="510" font-size="17">próximas e organizadas</text><text x="480" y="480" font-size="24" font-weight="700">LÍQUIDO</text><text x="480" y="510" font-size="17">próximas e móveis</text><text x="765" y="480" font-size="24" font-weight="700">GÁS</text><text x="765" y="510" font-size="17">muito afastadas e móveis</text><text x="480" y="565" font-size="18" font-weight="700">As partículas não aumentam de tamanho; mudam organização, distância média e movimento.</text></g></g></svg>