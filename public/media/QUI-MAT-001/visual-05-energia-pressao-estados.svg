<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Temperatura, energia e pressão influenciam o estado físico</title><desc id="desc">Esquema mostra aquecimento aumentando a agitação, resfriamento diminuindo-a e um quadro que lembra que pressão também altera condições de mudança de estado.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#263238"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial" fill="#18242c"><text x="480" y="48" text-anchor="middle" font-size="29" font-weight="700">Temperatura, energia e pressão influenciam o estado físico</text><rect x="70" y="120" width="360" height="300" rx="20" fill="#f6f2ea" stroke="#263238" stroke-width="2"/><text x="250" y="160" text-anchor="middle" font-size="24" font-weight="700">TRANSFERÊNCIA DE ENERGIA</text><text x="250" y="205" text-anchor="middle" font-size="19">Aquecimento</text><path d="M150 240 H350" stroke="#263238" stroke-width="3" marker-end="url(#a)"/><text x="250" y="275" text-anchor="middle" font-size="17">maior agitação / possível mudança de estado</text><text x="250" y="325" text-anchor="middle" font-size="19">Resfriamento</text><path d="M350 355 H150" stroke="#263238" stroke-width="3" marker-end="url(#a)"/><text x="250" y="390" text-anchor="middle" font-size="17">menor agitação / possível mudança inversa</text><rect x="530" y="120" width="360" height="300" rx="20" fill="#eef3f7" stroke="#263238" stroke-width="2"/><text x="710" y="160" text-anchor="middle" font-size="24" font-weight="700">PRESSÃO TAMBÉM IMPORTA</text><text x="710" y="215" text-anchor="middle" font-size="18">A temperatura de mudança de estado</text><text x="710" y="245" text-anchor="middle" font-size="18">pode variar com a pressão externa.</text><text x="710" y="305" text-anchor="middle" font-size="18" font-weight="700">Exemplo:</text><text x="710" y="340" text-anchor="middle" font-size="18">água pura ferve perto de 100 °C</text><text x="710" y="370" text-anchor="middle" font-size="18">sob pressão atmosférica padrão,</text><text x="710" y="400" text-anchor="middle" font-size="18">não em qualquer condição.</text><text x="480" y="485" text-anchor="middle" font-size="20" font-weight="700">Conclusão: o estado físico depende das condições do sistema.</text><text x="480" y="525" text-anchor="middle" font-size="18">Evite regras absolutas quando temperatura e pressão precisam ser especificadas.</text></g></svg>