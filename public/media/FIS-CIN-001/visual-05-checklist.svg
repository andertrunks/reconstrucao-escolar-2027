<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Checklist de análise cinemática inicial</title><desc id="desc">Fluxograma com cinco perguntas: qual corpo, qual referencial, qual origem ou sistema, a posição muda e qual trajetória está sendo descrita.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:3}.small{font-size:22px}.big{font-size:34px;font-weight:700}</style><text x="500" y="45" text-anchor="middle" class="big">Checklist de Cinemática</text><rect x="130" y="85" width="740" height="65" rx="14" class="box"/><text x="500" y="126" text-anchor="middle" class="small">1. Qual corpo está sendo estudado?</text><rect x="130" y="165" width="740" height="65" rx="14" class="box"/><text x="500" y="206" text-anchor="middle" class="small">2. Qual é o referencial?</text><rect x="130" y="245" width="740" height="65" rx="14" class="box"/><text x="500" y="286" text-anchor="middle" class="small">3. Qual origem, eixo ou sistema localiza o corpo?</text><rect x="130" y="325" width="740" height="65" rx="14" class="box"/><text x="500" y="366" text-anchor="middle" class="small">4. A posição muda ao longo do tempo?</text><rect x="130" y="405" width="740" height="65" rx="14" class="box"/><text x="500" y="446" text-anchor="middle" class="small">5. Qual trajetória está sendo descrita nesse referencial?</text><text x="500" y="520" text-anchor="middle" class="small">Defina a referência antes de classificar movimento ou repouso.</text></svg>