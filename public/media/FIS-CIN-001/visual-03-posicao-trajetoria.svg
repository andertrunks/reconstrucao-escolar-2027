<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Posição e trajetória</title><desc id="desc">Cinco posições sucessivas de um móvel aparecem como pontos ao longo de uma curva, mostrando que cada ponto é uma posição e a curva formada representa a trajetória.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.curve{stroke:#111;stroke-width:4;fill:none}.pt{fill:#fff;stroke:#111;stroke-width:4}.small{font-size:22px}.mid{font-size:28px;font-weight:700}.big{font-size:34px;font-weight:700}</style><text x="500" y="50" text-anchor="middle" class="big">Posições sucessivas formam a trajetória</text><path d="M120 380 C260 120 470 470 620 200 C720 30 820 220 900 130" class="curve"/><circle cx="150" cy="330" r="13" class="pt"/><circle cx="330" cy="260" r="13" class="pt"/><circle cx="500" cy="330" r="13" class="pt"/><circle cx="650" cy="160" r="13" class="pt"/><circle cx="850" cy="155" r="13" class="pt"/><text x="150" y="370" text-anchor="middle" class="small">posição 1</text><text x="500" y="375" text-anchor="middle" class="small">posição 3</text><text x="850" y="195" text-anchor="middle" class="small">posição 5</text><text x="500" y="500" text-anchor="middle" class="small">Cada ponto é uma posição; a curva representa a trajetória.</text></svg>