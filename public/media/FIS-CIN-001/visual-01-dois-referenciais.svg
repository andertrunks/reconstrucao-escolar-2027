<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">O passageiro e dois referenciais</title><desc id="desc">Ônibus em movimento com um passageiro sentado. Em relação ao banco, o passageiro mantém a posição; em relação a um poste no solo, sua posição muda.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:3}.line{stroke:#111;stroke-width:3;fill:none}.small{font-size:22px}.mid{font-size:28px;font-weight:700}.big{font-size:34px;font-weight:700}</style><text x="500" y="45" text-anchor="middle" class="big">O mesmo passageiro, dois referenciais</text><rect x="110" y="180" width="540" height="190" rx="30" class="box"/><circle cx="360" cy="235" r="32" class="box"/><path d="M360 267 V320 M330 292 H390" class="line"/><rect x="300" y="320" width="120" height="32" class="box"/><text x="360" y="405" text-anchor="middle" class="small">Banco: posição constante</text><line x1="760" y1="130" x2="760" y2="390" class="line"/><rect x="720" y="120" width="80" height="24" class="box"/><text x="760" y="425" text-anchor="middle" class="small">Poste no solo</text><path d="M650 275 H710" class="line"/><path d="M690 255 L715 275 L690 295" class="line"/><text x="500" y="500" text-anchor="middle" class="small">Em relação ao banco: repouso. Em relação ao poste: movimento.</text></svg>