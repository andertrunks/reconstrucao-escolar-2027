<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Origem, sentido e posições em um eixo</title><desc id="desc">Reta orientada com origem em zero, posições negativas à esquerda e positivas à direita, incluindo menos dois metros e mais dois metros.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.line{stroke:#111;stroke-width:4}.tick{stroke:#111;stroke-width:3}.small{font-size:22px}.mid{font-size:28px;font-weight:700}.big{font-size:34px;font-weight:700}</style><text x="500" y="55" text-anchor="middle" class="big">Origem, sentido e posições</text><line x1="100" y1="280" x2="900" y2="280" class="line"/><path d="M870 260 L900 280 L870 300" fill="none" class="line"/><text x="850" y="245" class="small">sentido positivo</text><line x1="300" y1="245" x2="300" y2="315" class="tick"/><line x1="500" y1="235" x2="500" y2="325" class="tick"/><line x1="700" y1="245" x2="700" y2="315" class="tick"/><text x="300" y="355" text-anchor="middle" class="mid">x = -2 m</text><text x="500" y="355" text-anchor="middle" class="mid">x = 0</text><text x="700" y="355" text-anchor="middle" class="mid">x = 2 m</text><text x="500" y="420" text-anchor="middle" class="small">O sinal indica o lado do eixo em relação à origem escolhida.</text></svg>