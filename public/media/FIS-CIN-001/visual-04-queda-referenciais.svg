<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">A mesma queda em dois referenciais</title><desc id="desc">Comparação de uma bola solta dentro de um veículo: para o passageiro a trajetória aparece quase vertical; para um observador no solo aparece curva devido ao movimento horizontal do veículo.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:3}.line{stroke:#111;stroke-width:4;fill:none}.dash{stroke:#111;stroke-width:4;fill:none;stroke-dasharray:10 8}.small{font-size:22px}.mid{font-size:28px;font-weight:700}.big{font-size:34px;font-weight:700}</style><text x="500" y="45" text-anchor="middle" class="big">Uma queda, duas descrições</text><text x="250" y="100" text-anchor="middle" class="mid">Referencial do veículo</text><rect x="70" y="130" width="360" height="300" rx="20" class="box"/><circle cx="250" cy="180" r="15" class="box"/><path d="M250 200 V370" class="dash"/><text x="250" y="465" text-anchor="middle" class="small">trajetória aproximadamente vertical</text><text x="750" y="100" text-anchor="middle" class="mid">Referencial do solo</text><line x1="570" y1="410" x2="930" y2="410" class="line"/><circle cx="620" cy="180" r="15" class="box"/><path d="M620 200 C700 210 770 270 850 390" class="dash"/><text x="750" y="465" text-anchor="middle" class="small">trajetória curva na descrição do solo</text></svg>