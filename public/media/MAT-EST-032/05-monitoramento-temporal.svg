<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" role="img" aria-labelledby="t d"><title id="t">Desempenho em janelas temporais</title><desc id="d">Linha com MAE de 1,0 ponto na janela histórica e 1,8 na recente; eixo horizontal indica janela e eixo vertical MAE em pontos.</desc><rect width="1050" height="420" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#183047}.title{font-size:26px;font-weight:bold}.text{font-size:20px}.small{font-size:17px}.axis{stroke:#324f63;stroke-width:2}.grid{stroke:#c4cfd4;stroke-width:1;stroke-dasharray:4 4}</style><text x="38" y="45" class="title" text-anchor="start">Desempenho em janelas temporais</text><text x="48" y="89" class="small" text-anchor="start">Eixo horizontal: período; eixo vertical: MAE em pontos</text><line x1="115" y1="324" x2="950" y2="324" class="grid"/><text x="87" y="329" class="small" text-anchor="end">0</text><line x1="115" y1="223" x2="950" y2="223" class="grid"/><text x="87" y="228" class="small" text-anchor="end">1</text><line x1="115" y1="122" x2="950" y2="122" class="grid"/><text x="87" y="127" class="small" text-anchor="end">2</text><polyline points="318,223 742,142" fill="none" stroke="#275779" stroke-width="5"/><circle cx="318" cy="223" r="9" fill="#1e5676"/><text x="318" y="201" class="text" text-anchor="middle">1,0</text><text x="318" y="361" class="small" text-anchor="middle">Janela histórica</text><circle cx="742" cy="142" r="9" fill="#1e5676"/><text x="742" y="120" class="text" text-anchor="middle">1,8</text><text x="742" y="361" class="small" text-anchor="middle">Janela recente</text><text x="48" y="405" class="small" text-anchor="start">Aumento relativo: (1,8 − 1,0)/1,0 = 80%.</text></svg>