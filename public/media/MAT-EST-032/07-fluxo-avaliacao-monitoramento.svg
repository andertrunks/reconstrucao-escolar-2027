<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" role="img" aria-labelledby="t d"><title id="t">Ciclo de avaliação e monitoramento</title><desc id="d">Fluxo textual de objetivo e linha de base, separação adequada, seleção, teste final preservado, monitoramento com resultados e revisão documentada.</desc><rect width="1050" height="420" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#183047}.title{font-size:26px;font-weight:bold}.text{font-size:20px}.small{font-size:17px}.axis{stroke:#324f63;stroke-width:2}.grid{stroke:#c4cfd4;stroke-width:1;stroke-dasharray:4 4}</style><text x="38" y="45" class="title" text-anchor="start">Ciclo de avaliação e monitoramento</text><rect x="18" y="137" width="159" height="110" rx="8" fill="#e3eef7" stroke="#4a6272" stroke-width="1.5"/><text x="97" y="174" class="small" text-anchor="middle">1. Definir</text><text x="97" y="209" class="small" text-anchor="middle">métrica e baseline</text><text x="179" y="195" class="small" text-anchor="start">→</text><rect x="190" y="137" width="159" height="110" rx="8" fill="#e3eef7" stroke="#4a6272" stroke-width="1.5"/><text x="269" y="174" class="small" text-anchor="middle">2. Separar</text><text x="269" y="209" class="small" text-anchor="middle">tempo e grupos</text><text x="351" y="195" class="small" text-anchor="start">→</text><rect x="362" y="137" width="159" height="110" rx="8" fill="#e3eef7" stroke="#4a6272" stroke-width="1.5"/><text x="441" y="174" class="small" text-anchor="middle">3. Selecionar</text><text x="441" y="209" class="small" text-anchor="middle">validação correta</text><text x="523" y="195" class="small" text-anchor="start">→</text><rect x="534" y="137" width="159" height="110" rx="8" fill="#e3eef7" stroke="#4a6272" stroke-width="1.5"/><text x="613" y="174" class="small" text-anchor="middle">4. Testar</text><text x="613" y="209" class="small" text-anchor="middle">teste preservado</text><text x="695" y="195" class="small" text-anchor="start">→</text><rect x="706" y="137" width="159" height="110" rx="8" fill="#f3e7d3" stroke="#4a6272" stroke-width="1.5"/><text x="785" y="174" class="small" text-anchor="middle">5. Acompanhar</text><text x="785" y="209" class="small" text-anchor="middle">resultados reais</text><text x="867" y="195" class="small" text-anchor="start">→</text><rect x="878" y="137" width="159" height="110" rx="8" fill="#f3e7d3" stroke="#4a6272" stroke-width="1.5"/><text x="957" y="174" class="small" text-anchor="middle">6. Revisar</text><text x="957" y="209" class="small" text-anchor="middle">decisão documentada</text><text x="45" y="301" class="small" text-anchor="start">A escolha não usa o teste final. Erro real exige o resultado observado.</text><text x="45" y="349" class="small" text-anchor="start">Registrar versão, período, grupos, métricas, incerteza e ações.</text></svg>