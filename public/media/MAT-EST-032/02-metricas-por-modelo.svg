<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" role="img" aria-labelledby="t d"><title id="t">Comparação de MAE e RMSE</title><desc id="d">Gráfico de barras em pontos: A possui MAE 1 e RMSE 1; B possui MAE 1 e RMSE 2. Eixo horizontal identifica modelo e métrica; eixo vertical mede erro em pontos.</desc><rect width="1050" height="420" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#183047}.title{font-size:26px;font-weight:bold}.text{font-size:20px}.small{font-size:17px}.axis{stroke:#324f63;stroke-width:2}.grid{stroke:#c4cfd4;stroke-width:1;stroke-dasharray:4 4}</style><text x="38" y="45" class="title" text-anchor="start">Comparação de MAE e RMSE</text><text x="48" y="91" class="small" text-anchor="start">Eixo vertical: erro em pontos | Eixo horizontal: métrica e modelo</text><line x1="70" y1="322" x2="1000" y2="322" class="grid"/><text x="51" y="328" class="small" text-anchor="end">0</text><line x1="70" y1="222" x2="1000" y2="222" class="grid"/><text x="51" y="228" class="small" text-anchor="end">1</text><line x1="70" y1="122" x2="1000" y2="122" class="grid"/><text x="51" y="128" class="small" text-anchor="end">2</text><rect x="140" y="222" width="112" height="100" rx="8" fill="#d8eafb" stroke="#4a6272" stroke-width="1.5"/><text x="196" y="208" class="text" text-anchor="middle">1</text><text x="196" y="357" class="small" text-anchor="middle">A: MAE</text><rect x="362" y="222" width="112" height="100" rx="8" fill="#c8e4ef" stroke="#4a6272" stroke-width="1.5"/><text x="418" y="208" class="text" text-anchor="middle">1</text><text x="418" y="357" class="small" text-anchor="middle">A: RMSE</text><rect x="584" y="222" width="112" height="100" rx="8" fill="#eaeed6" stroke="#4a6272" stroke-width="1.5"/><text x="640" y="208" class="text" text-anchor="middle">1</text><text x="640" y="357" class="small" text-anchor="middle">B: MAE</text><rect x="806" y="122" width="112" height="200" rx="8" fill="#f4d9bd" stroke="