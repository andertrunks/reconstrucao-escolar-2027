<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Como diferentes evidências sustentam hipóteses</title><desc id="d">Quatro caixas de evidências convergem para uma hipótese científica central, com seta de teste e revisão retornando às evidências.</desc><rect width="1000" height="620" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111" stroke="#222" stroke-width="2"><text x="500" y="48" text-anchor="middle" font-size="30" font-weight="700">Evidências → hipótese → teste → revisão</text><rect x="70" y="110" width="240" height="100" rx="14" fill="#eef4ff"/><text x="190" y="150" text-anchor="middle" font-size="22" font-weight="700">Fósseis</text><text x="190" y="180" text-anchor="middle" font-size="18">anatomia + idade</text><rect x="690" y="110" width="240" height="100" rx="14" fill="#eef4ff"/><text x="810" y="150" text-anchor="middle" font-size="22" font-weight="700">Arqueologia</text><text x="810" y="180" text-anchor="middle" font-size="18">objetos + contexto</text><rect x="70" y="390" width="240" height="100" rx="14" fill="#f7f2e8"/><text x="190" y="430" text-anchor="middle" font-size="22" font-weight="700">Geologia e datação</text><text x="190" y="460" text-anchor="middle" font-size="18">camadas + idades</text><rect x="690" y="390" width="240" height="100" rx="14" fill="#f7f2e8"/><text x="810" y="430" text-anchor="middle" font-size="22" font-weight="700">Genética</text><text x="810" y="460" text-anchor="middle" font-size="18">parentesco + mistura</text><rect x="350" y="245" width="300" height="130" rx="20" fill="#edf8ee"/><text x="500" y="292" text-anchor="middle" font-size="24" font-weight="700">Hipótese científica</text><text x="500" y="326" text-anchor="middle" font-size="19">explica o conjunto</text><text x="500" y="354" text-anchor="middle" font-size="19">e pode ser revisada</text><g marker-end="url(#a)"><line x1="310" y1="190" x2="365" y2="260"/><line x1="690" y1="190" x2="635" y2="260"/><line x1="310" y1="420" x2="365" y2="355"/><line x1="690" y1="420" x2="635" y2="355"/></g><path d="M650 315 C810 315 830 560 500 560 C170 560 190 315 350 315" fill="none" stroke="#555" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="500" y="592" text-anchor="middle" font-size="18">Novos testes podem confirmar, limitar ou modificar a explicação.</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs></svg>