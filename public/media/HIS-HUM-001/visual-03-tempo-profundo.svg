<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">Linha do tempo das origens e dispersões humanas</title><desc id="d">Linha do tempo simplificada de sete milhões de anos até o presente, marcando homininos antigos, primeiros Homo, dispersões fora da África e Homo sapiens há cerca de trezentos mil anos.</desc><rect width="1100" height="500" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="550" y="45" text-anchor="middle" font-size="30" font-weight="700">Tempo profundo: eventos separados por enormes intervalos</text><line x1="90" y1="250" x2="1020" y2="250" stroke="#222" stroke-width="5"/><g stroke="#222" stroke-width="3"><line x1="110" y1="220" x2="110" y2="280"/><line x1="480" y1="220" x2="480" y2="280"/><line x1="610" y1="220" x2="610" y2="280"/><line x1="905" y1="220" x2="905" y2="280"/><line x1="1020" y1="220" x2="1020" y2="280"/></g><g font-size="18"><text x="110" y="315" text-anchor="middle">~7 milhões</text><text x="110" y="338" text-anchor="middle">de anos</text><text x="480" y="315" text-anchor="middle">&gt; 2 milhões</text><text x="480" y="338" text-anchor="middle">primeiros Homo</text><text x="610" y="315" text-anchor="middle">~1,9–1,8 milhão</text><text x="610" y="338" text-anchor="middle">dispersões antigas</text><text x="905" y="315" text-anchor="middle">~300 mil</text><text x="905" y="338" text-anchor="middle">Homo sapiens</text><text x="1020" y="315" text-anchor="middle">presente</text><text x="110" y="195" text-anchor="middle">homininos antigos</text><text x="905" y="195" text-anchor="middle">origem africana</text><text x="860" y="400" text-anchor="middle" font-size="20">Expansões posteriores de Homo sapiens →</text></g><text x="550" y="455" text-anchor="middle" font-size="17">Datas aproximadas: novas descobertas podem refiná-las.</text></g></svg>