<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Evolução humana como árvore ramificada</title><desc id="d">Diagrama simplificado de ramos evolutivos com várias linhagens, incluindo Homo sapiens, neandertais e denisovanos, sem escada linear.</desc><rect width="1000" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111" stroke="#222" stroke-width="3"><text x="500" y="45" text-anchor="middle" font-size="30" font-weight="700">Árvore, não escada</text><line x1="500" y1="580" x2="500" y2="500"/><line x1="500" y1="500" x2="250" y2="390"/><line x1="500" y1="500" x2="570" y2="390"/><line x1="250" y1="390" x2="150" y2="270"/><line x1="250" y1="390" x2="320" y2="270"/><line x1="570" y1="390" x2="480" y2="270"/><line x1="570" y1="390" x2="650" y2="270"/><line x1="650" y1="270" x2="650" y2="145"/><line x1="650" y1="270" x2="810" y2="145"/><line x1="650" y1="270" x2="500" y2="145"/><path d="M500 155 C570 205 720 205 805 155" fill="none" stroke="#666" stroke-dasharray="8 7"/><g fill="#fff"><circle cx="500" cy="580" r="10"/><circle cx="500" cy="500" r="10"/><circle cx="250" cy="390" r="10"/><circle cx="570" cy="390" r="10"/></g><g stroke="none" font-size="18"><text x="500" y="620" text-anchor="middle">ancestrais mais antigos</text><text x="150" y="245" text-anchor="middle">outros ramos</text><text x="320" y="245" text-anchor="middle">outros ramos</text><text x="480" y="245" text-anchor="middle">outro ramo</text><text x="500" y="115" text-anchor="middle" font-weight="700">Homo sapiens</text><text x="650" y="115" text-anchor="middle" font-weight="700">Neandertais</text><text x="810" y="115" text-anchor="middle" font-weight="700">Denisovanos</text><text x="730" y="205" text-anchor="middle">mistura genética posterior</text><text x="500" y="80" text-anchor="middle" font-size="17">Esquema didático: relações exatas entre muitos fósseis continuam em pesquisa.</text></g></g></svg>