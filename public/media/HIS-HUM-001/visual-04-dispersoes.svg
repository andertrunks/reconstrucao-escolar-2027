<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600" role="img" aria-labelledby="t d"><title id="t">Duas escalas de dispersão a partir da África</title><desc id="d">Mapa esquemático mostra África, Europa e Ásia com uma seta de dispersão antiga do gênero Homo e setas posteriores de Homo sapiens, acompanhadas de aviso de que rotas são modelos simplificados.</desc><rect width="1050" height="600" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="525" y="45" text-anchor="middle" font-size="30" font-weight="700">Dispersões humanas em escalas diferentes</text><path d="M210 190 C155 245 170 360 240 465 C300 530 360 480 350 390 C340 320 395 250 330 205 C285 175 250 170 210 190z" fill="#eee" stroke="#222" stroke-width="3"/><path d="M395 180 C430 130 520 115 590 150 C610 180 565 210 505 205 C460 205 420 215 395 180z" fill="#eee" stroke="#222" stroke-width="3"/><path d="M560 165 C650 95 865 105 930 190 C930 260 835 310 735 285 C660 260 600 250 560 165z" fill="#eee" stroke="#222" stroke-width="3"/><text x="270" y="350" text-anchor="middle" font-size="24" font-weight="700">África</text><text x="500" y="170" text-anchor="middle" font-size="22">Europa</text><text x="760" y="195" text-anchor="middle" font-size="24">Ásia</text><path d="M335 285 C455 225 545 235 665 240" fill="none" stroke="#222" stroke-width="5" marker-end="url(#a)"/><text x="515" y="265" text-anchor="middle" font-size="18">humanos antigos · ~1,8 milhão de anos</text><path d="M325 315 C470 340 600 360 780 315" fill="none" stroke="#666" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#b)"/><text x="560" y="395" text-anchor="middle" font-size="18">Homo sapiens · movimentos muito posteriores</text><rect x="155" y="470" width="740" height="85" rx="14" fill="#f7f2e8" stroke="#222" stroke-width="2"/><text x="525" y="505" text-anchor="middle" font-size="19" font-weight="700">Atenção</text><text x="525" y="535" text-anchor="middle" font-size="17">Setas resumem hipóteses populacionais; não são trajetos exatos de uma viagem.</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#666"/></marker></defs></svg>