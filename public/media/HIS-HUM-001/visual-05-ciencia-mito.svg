<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">Hipótese científica e mito de fundação</title><desc id="d">Duas colunas com perguntas e métodos diferentes: ciência testa explicações empíricas com evidências; mito de fundação organiza identidade, ancestralidade e significado cultural. Uma base comum mostra que ambos podem ser contextualizados historicamente.</desc><rect width="1100" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="550" y="45" text-anchor="middle" font-size="30" font-weight="700">Perguntas diferentes, métodos diferentes</text><rect x="70" y="100" width="430" height="390" rx="18" fill="#eef4ff" stroke="#222" stroke-width="3"/><text x="285" y="145" text-anchor="middle" font-size="25" font-weight="700">Hipótese científica</text><text x="105" y="195" font-size="19">Pergunta: o que ocorreu materialmente?</text><text x="105" y="240" font-size="19">Evidências: fósseis, objetos, datas, DNA</text><text x="105" y="285" font-size="19">Método: teste, comparação, revisão</text><text x="105" y="330" font-size="19">Resultado: explicação provisória e testável</text><text x="105" y="390" font-size="18">Se nova evidência contradiz o modelo,</text><text x="105" y="418" font-size="18">o modelo precisa ser revisto.</text><rect x="600" y="100" width="430" height="390" rx="18" fill="#f7f2e8" stroke="#222" stroke-width="3"/><text x="815" y="145" text-anchor="middle" font-size="25" font-weight="700">Mito de fundação</text><text x="635" y="195" font-size="19">Pergunta: quem somos e de onde viemos?</text><text x="635" y="240" font-size="19">Elementos: ancestrais, território, sagrado</text><text x="635" y="285" font-size="19">Transmissão: oral, ritual, texto, imagem</text><text x="635" y="330" font-size="19">Resultado: sentido, identidade, memória</text><text x="635" y="390" font-size="18">O historiador analisa contexto, versões,</text><text x="635" y="418" font-size="18">mediações e usos sociais da narrativa.</text><rect x="180" y="525" width="740" height="85" rx="16" fill="#edf8ee" stroke="#222" stroke-width="3"/><text x="550" y="558" text-anchor="middle" font-size="20" font-weight="700">Ponto de encontro histórico</text><text x="550" y="590" text-anchor="middle" font-size="18">Ambos podem ser estudados em contexto; isso não torna seus métodos equivalentes.</text></g></svg>