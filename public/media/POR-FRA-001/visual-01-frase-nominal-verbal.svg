<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Frase nominal e frase verbal</title><desc id="desc">Comparação entre frases sem verbo e frases com verbo ou locução verbal, mostrando que ambas podem comunicar sentido em contexto.</desc><rect width="960" height="540" fill="#fff"/><g font-family="Arial" fill="#17232b"><text x="480" y="50" text-anchor="middle" font-size="30" font-weight="700">Frase nominal e frase verbal</text><rect x="70" y="120" width="360" height="300" rx="20" fill="#eef3f7" stroke="#263238" stroke-width="2"/><rect x="530" y="120" width="360" height="300" rx="20" fill="#f6f2ea" stroke="#263238" stroke-width="2"/><text x="250" y="170" text-anchor="middle" font-size="25" font-weight="700">FRASE NOMINAL</text><text x="710" y="170" text-anchor="middle" font-size="25" font-weight="700">FRASE VERBAL</text><text x="250" y="220" text-anchor="middle" font-size="19">Não apresenta verbo.</text><text x="710" y="220" text-anchor="middle" font-size="19">Apresenta verbo ou locução verbal.</text><text x="250" y="285" text-anchor="middle" font-size="22" font-weight="700">“Que calor!”</text><text x="250" y="335" text-anchor="middle" font-size="22" font-weight="700">“Silêncio!”</text><text x="710" y="285" text-anchor="middle" font-size="22" font-weight="700">“Está muito quente.”</text><text x="710" y="335" text-anchor="middle" font-size="22" font-weight="700">“Vamos começar.”</text><text x="480" y="475" text-anchor="middle" font-size="19" font-weight="700">As duas podem comunicar sentido em contexto.</text><text x="480" y="505" text-anchor="middle" font-size="17">Ter verbo não é condição para existir frase.</text></g></svg>