<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Tamanho do enunciado não define o número de orações</title><desc id="desc">Um período longo com um núcleo verbal é comparado a um período curto com dois núcleos verbais.</desc><rect width="960" height="560" fill="#fff"/><g font-family="Arial" fill="#17232b"><text x="480" y="48" text-anchor="middle" font-size="29" font-weight="700">Tamanho do enunciado não define o número de orações</text><rect x="65" y="125" width="830" height="145" rx="18" fill="#eef6ef" stroke="#263238" stroke-width="2"/><text x="100" y="170" font-size="20" font-weight="700">LONGO, MAS SIMPLES</text><text x="100" y="215" font-size="19">“Os novos alunos da escola municipal chegaram muito cedo nesta manhã.”</text><text x="100" y="250" font-size="17">Núcleo verbal: chegaram → 1 oração</text><rect x="65" y="315" width="830" height="145" rx="18" fill="#f3eef7" stroke="#263238" stroke-width="2"/><text x="100" y="360" font-size="20" font-weight="700">CURTO, MAS COMPOSTO</text><text x="100" y="405" font-size="21">“Cheguei e sentei.”</text><text x="100" y="440" font-size="17">Núcleos verbais: cheguei + sentei → 2 orações</text><text x="480" y="515" text-anchor="middle" font-size="19" font-weight="700">Conte orações; não conte palavras.</text></g></svg>