<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Período simples e período composto</title><desc id="desc">Comparação mostra período simples com um núcleo verbal e período composto com dois núcleos verbais.</desc><rect width="960" height="560" fill="#fff"/><g font-family="Arial" fill="#17232b"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700">Período simples e período composto</text><rect x="70" y="120" width="380" height="300" rx="20" fill="#eef3f7" stroke="#263238" stroke-width="2"/><rect x="510" y="120" width="380" height="300" rx="20" fill="#f6f2ea" stroke="#263238" stroke-width="2"/><text x="260" y="170" text-anchor="middle" font-size="24" font-weight="700">PERÍODO SIMPLES</text><text x="700" y="170" text-anchor="middle" font-size="24" font-weight="700">PERÍODO COMPOSTO</text><text x="260" y="230" text-anchor="middle" font-size="20">“A criança dormiu.”</text><text x="700" y="230" text-anchor="middle" font-size="20">“A criança acordou e chamou a mãe.”</text><text x="260" y="290" text-anchor="middle" font-size="18">Núcleo: dormiu</text><text x="700" y="290" text-anchor="middle" font-size="18">Núcleos: acordou + chamou</text><text x="260" y="340" text-anchor="middle" font-size="20" font-weight="700">1 oração</text><text x="700" y="340" text-anchor="middle" font-size="20" font-weight="700">2 orações</text><text x="480" y="480" text-anchor="middle" font-size="19" font-weight="700">A classificação depende da quantidade de orações, não do tamanho do enunciado.</text></g></svg>