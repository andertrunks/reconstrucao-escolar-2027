<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Núcleo verbal e locução verbal</title><desc id="desc">Esquema compara um verbo simples, chegou, com a locução verbal vai chegar, mostrando que ambos podem corresponder a um único núcleo verbal e uma oração.</desc><rect width="960" height="560" fill="#fff"/><g font-family="Arial" fill="#17232b"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700">Núcleo verbal e locução verbal</text><rect x="80" y="130" width="330" height="280" rx="18" fill="#eef6ef" stroke="#263238" stroke-width="2"/><rect x="550" y="130" width="330" height="280" rx="18" fill="#f3eef7" stroke="#263238" stroke-width="2"/><text x="245" y="180" text-anchor="middle" font-size="24" font-weight="700">VERBO SIMPLES</text><text x="715" y="180" text-anchor="middle" font-size="24" font-weight="700">LOCUÇÃO VERBAL</text><text x="245" y="250" text-anchor="middle" font-size="26" font-weight="700">“chegou”</text><text x="715" y="250" text-anchor="middle" font-size="26" font-weight="700">“vai chegar”</text><text x="245" y="305" text-anchor="middle" font-size="19">1 núcleo verbal</text><text x="715" y="305" text-anchor="middle" font-size="19">1 núcleo verbal</text><text x="245" y="350" text-anchor="middle" font-size="19">→ 1 oração</text><text x="715" y="350" text-anchor="middle" font-size="19">→ 1 oração</text><text x="480" y="470" text-anchor="middle" font-size="20" font-weight="700">Conte núcleos verbais, não apenas formas verbais isoladas.</text><text x="480" y="510" text-anchor="middle" font-size="17">Uma locução pode reunir duas formas verbais em um único núcleo.</text></g></svg>