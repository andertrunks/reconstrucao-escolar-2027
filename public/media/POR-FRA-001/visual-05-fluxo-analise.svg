<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Fluxo de análise de frase, oração e período</title><desc id="desc">Fluxo em cinco etapas mostra enunciado, presença de sentido, identificação do núcleo verbal, contagem de orações e classificação do período.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#263238"/></marker></defs><rect width="960" height="620" fill="#fff"/><g font-family="Arial" fill="#17232b"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700">Fluxo de análise</text><g stroke="#263238" stroke-width="2"><rect x="285" y="90" width="390" height="78" rx="16" fill="#eef3f7"/><rect x="285" y="205" width="390" height="78" rx="16" fill="#f6f2ea"/><rect x="285" y="320" width="390" height="78" rx="16" fill="#eef6ef"/><rect x="285" y="435" width="390" height="78" rx="16" fill="#f3eef7"/></g><g text-anchor="middle" font-size="20" font-weight="700"><text x="480" y="137">1. O enunciado comunica algo em contexto?</text><text x="480" y="252">2. Há verbo ou locução verbal?</text><text x="480" y="367">3. Quantos núcleos verbais existem?</text><text x="480" y="482">4. Uma oração = simples; duas ou mais = composto</text></g><g stroke="#263238" stroke-width="3" marker-end="url(#a)"><line x1="480" y1="168" x2="480" y2="198"/><line x1="480" y1="283" x2="480" y2="313"/><line x1="480" y1="398" x2="480" y2="428"/></g><text x="480" y="565" text-anchor="middle" font-size="18" font-weight="700">A pontuação final delimita o período; o núcleo verbal ajuda a contar as orações.</text></g></svg>