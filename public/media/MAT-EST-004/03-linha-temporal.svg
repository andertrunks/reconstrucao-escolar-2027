<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<title>Gráfico de linha do tempo médio de espera por mês</title>
<desc>Eixo horizontal com janeiro a maio; eixo vertical em minutos de oito a dezesseis. Valores janeiro doze, fevereiro onze, março quinze, abril quatorze e maio dez. O pico é março e o menor valor é maio.</desc>
<rect width="1000" height="620" fill="white"/><text x="220" y="45" font-size="28" font-family="Arial">Tempo médio de espera — janeiro a maio</text>
<line x1="120" y1="520" x2="910" y2="520" stroke="black" stroke-width="3"/><line x1="120" y1="520" x2="120" y2="100" stroke="black" stroke-width="3"/>
<text x="30" y="330" font-size="18" font-family="Arial" transform="rotate(-90 30,330)">Tempo médio (minutos)</text>
<g font-family="Arial" font-size="17"><text x="85" y="525">8</text><text x="75" y="425">10</text><text x="75" y="325">12</text><text x="75" y="225">14</text><text x="75" y="125">16</text></g>
<polyline points="190,320 350,370 510,170 670,220 830,420" fill="none" stroke="black" stroke-width="4"/>
<g fill="white" stroke="black" stroke-width="3"><circle cx="190" cy="320" r="8"/><circle cx="350" cy="370" r="8"/><circle cx="510" cy="170" r="8"/><circle cx="670" cy="220" r="8"/><circle cx="830" cy="420" r="8"/></g>
<g font-family="Arial" font-size="18"><text x="170" y="555">Jan</text><text x="330" y="555">Fev</text><text x="490" y="555">Mar</text><text x="650" y="555">Abr</text><text x="810" y="555">Mai</text><text x="175" y="295">12</text><text x="335" y="345">11</text><text x="495" y="145">15</text><text x="655" y="195">14</text><text x="815" y="395">10</text></g>
</svg>