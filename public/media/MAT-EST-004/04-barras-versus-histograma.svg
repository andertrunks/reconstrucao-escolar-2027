<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<title>Comparação entre gráfico de barras e histograma</title>
<desc>Painel esquerdo mostra barras separadas para categorias A, B e C. Painel direito mostra barras encostadas para intervalos numéricos zero a cinco, cinco a dez e dez a quinze.</desc>
<rect width="1100" height="620" fill="white"/><text x="310" y="45" font-size="28" font-family="Arial">Barras categóricas versus histograma</text>
<text x="180" y="95" font-size="22" font-family="Arial">Gráfico de barras</text><text x="720" y="95" font-size="22" font-family="Arial">Histograma</text>
<line x1="90" y1="500" x2="500" y2="500" stroke="black" stroke-width="3"/><line x1="90" y1="500" x2="90" y2="140" stroke="black" stroke-width="3"/>
<g fill="none" stroke="black" stroke-width="3"><rect x="150" y="300" width="80" height="200"/><rect x="280" y="220" width="80" height="280"/><rect x="410" y="360" width="80" height="140"/></g>
<g font-family="Arial" font-size="18"><text x="180" y="535">A</text><text x="310" y="535">B</text><text x="440" y="535">C</text><text x="135" y="575">Categorias separadas; ordem pode variar.</text></g>
<line x1="610" y1="500" x2="1030" y2="500" stroke="black" stroke-width="3"/><line x1="610" y1="500" x2="610" y2="140" stroke="black" stroke-width="3"/>
<g fill="none" stroke="black" stroke-width="3"><rect x="650" y="340" width="110" height="160"/><rect x="760" y="220" width="110" height="280"/><rect x="870" y="300" width="110" height="200"/></g>
<g font-family="Arial" font-size="18"><text x="660" y="535">[0,5)</text><text x="765" y="535">[5,10)</text><text x="865" y="535">[10,15)</text><text x="665" y="575">Intervalos contíguos; ordem numérica fixa.</text></g>
</svg>