<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<title>Gráfico de setores representando partes de um total</title>
<desc>Círculo dividido em quatro setores rotulados 45 por cento, 25 por cento, 20 por cento e 10 por cento; ao lado aparecem os ângulos 162, 90, 72 e 36 graus.</desc>
<rect width="1000" height="620" fill="white"/><text x="250" y="45" font-size="28" font-family="Arial">Composição do total por meio de transporte</text>
<circle cx="330" cy="315" r="190" fill="none" stroke="black" stroke-width="3"/>
<path d="M330 315 L330 125 A190 190 0 0 1 388.7 495.7 Z" fill="none" stroke="black" stroke-width="3"/>
<path d="M330 315 L388.7 495.7 A190 190 0 0 1 139.0 315 Z" fill="none" stroke="black" stroke-width="3"/>
<path d="M330 315 L139.0 315 A190 190 0 0 1 218.3 161.3 Z" fill="none" stroke="black" stroke-width="3"/>
<path d="M330 315 L218.3 161.3 A190 190 0 0 1 330 125 Z" fill="none" stroke="black" stroke-width="3"/>
<g font-family="Arial" font-size="20"><text x="390" y="250">45%</text><text x="260" y="440">25%</text><text x="160" y="270">20%</text><text x="255" y="190">10%</text></g>
<g font-family="Arial" font-size="21"><text x="590" y="185">Ônibus: 45% → 162°</text><text x="590" y="245">Carro: 25% → 90°</text><text x="590" y="305">A pé: 20% → 72°</text><text x="590" y="365">Bicicleta: 10% → 36°</text><text x="590" y="455">Controle: 162 + 90 + 72 + 36 = 360°</text></g>
</svg>