<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="ttl ds">
<title id="ttl">Linhagem de um relatório</title>
<desc id="ds">Protocolo, previsão identificada, observação versionada, corte, política e código entram no relatório, que é a última etapa.</desc>
<rect width="960" height="475" fill="#F7F9FC"/><text x="40" y="48" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="25">Linhagem de um relatório</text>
<text x="40" y="78" fill="#7B8DA2" font-family="sans-serif" font-size="15">MAT-EST-054 • Diagrama original / valores simulados</text>
<rect x="38" y="110" width="265" height="80" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="53" y="137" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Protocolo congelado</text>
<text x="53" y="161" fill="#1B2C42" font-family="sans-serif" font-size="14">PROT-v1; guarda t19</text>
<rect x="346" y="110" width="265" height="80" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="361" y="137" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Previsões e alvos</text>
<text x="361" y="161" fill="#1B2C42" font-family="sans-serif" font-size="14">IDs / mesmo horizonte</text>
<rect x="654" y="110" width="265" height="80" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="669" y="137" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Observações</text>
<text x="669" y="161" fill="#1B2C42" font-family="sans-serif" font-size="14">versão + qualidade + corte</text>
<rect x="38" y="252" width="265" height="90" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="53" y="279" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Política de cálculo</text>
<text x="53" y="303" fill="#1B2C42" font-family="sans-serif" font-size="14">elegibilidade / denominador</text>
<rect x="346" y="252" width="265" height="90" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="361" y="279" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Código + hashes</text>
<text x="361" y="303" fill="#1B2C42" font-family="sans-serif" font-size="14">script / arquivos imutáveis</text>
<rect x="654" y="252" width="265" height="90" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="669" y="279" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Relatório identificado</text>
<text x="669" y="303" fill="#1B2C42" font-family="sans-serif" font-size="14">métricas / limites / decisão</text>
<line x1="303" y1="150" x2="346" y2="150" stroke="#215D9B" stroke-width="2"/><circle cx="346" cy="150" r="4" fill="#215D9B"/>
<line x1="611" y1="150" x2="654" y2="150" stroke="#215D9B" stroke-width="2"/><circle cx="654" cy="150" r="4" fill="#215D9B"/>
<line x1="303" y1="296" x2="346" y2="296" stroke="#215D9B" stroke-width="2"/><circle cx="346" cy="296" r="4" fill="#215D9B"/>
<line x1="611" y1="296" x2="654" y2="296" stroke="#215D9B" stroke-width="2"/><circle cx="654" cy="296" r="4" fill="#215D9B"/>
<rect x="36" y="413" width="888" height="47" rx="10" fill="#F4EEDF"/><text x="50" y="442" fill="#1B2C42" font-family="sans-serif" font-size="16">Um número sem sua linhagem não é uma avaliação auditável.</text>
</svg>
