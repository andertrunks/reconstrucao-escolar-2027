<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="ttl ds">
<title id="ttl">Roteiro reexecutável da auditoria</title>
<desc id="ds">Copiar insumos sem alterar, escolher namespace e corte, calcular, comparar hashes e relatar resultados com ressalvas.</desc>
<rect width="960" height="475" fill="#F7F9FC"/><text x="40" y="48" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="25">Roteiro reexecutável da auditoria</text>
<text x="40" y="78" fill="#7B8DA2" font-family="sans-serif" font-size="15">MAT-EST-054 • Diagrama original / valores simulados</text>
<rect x="36" y="125" width="273" height="87" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="51" y="152" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">1. Fixar insumos</text>
<text x="51" y="176" fill="#1B2C42" font-family="sans-serif" font-size="14">CSVs, eventos, código, hashes</text>
<rect x="344" y="125" width="273" height="87" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="359" y="152" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">2. Filtrar e escolher</text>
<text x="359" y="176" fill="#1B2C42" font-family="sans-serif" font-size="14">namespace, corte, política</text>
<rect x="652" y="125" width="273" height="87" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="667" y="152" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">3. Calcular indicadores</text>
<text x="667" y="176" fill="#1B2C42" font-family="sans-serif" font-size="14">um alvo por fotografia</text>
<rect x="36" y="255" width="273" height="93" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="51" y="282" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">4. Confrontar com origem</text>
<text x="51" y="306" fill="#1B2C42" font-family="sans-serif" font-size="14">erros / custos / integridade</text>
<rect x="344" y="255" width="273" height="93" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="359" y="282" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">5. Gravar relatório ID</text>
<text x="359" y="306" fill="#1B2C42" font-family="sans-serif" font-size="14">versão / elegibilidade / evidência</text>
<rect x="652" y="255" width="273" height="93" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="667" y="282" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">6. Verificar byte a byte</text>
<text x="667" y="306" fill="#1B2C42" font-family="sans-serif" font-size="14">--verify / testes locais</text>
<line x1="309" y1="170" x2="344" y2="170" stroke="#215D9B" stroke-width="2"/><circle cx="344" cy="170" r="4" fill="#215D9B"/>
<line x1="617" y1="170" x2="652" y2="170" stroke="#215D9B" stroke-width="2"/><circle cx="652" cy="170" r="4" fill="#215D9B"/>
<line x1="309" y1="300" x2="344" y2="300" stroke="#215D9B" stroke-width="2"/><circle cx="344" cy="300" r="4" fill="#215D9B"/>
<line x1="617" y1="300" x2="652" y2="300" stroke="#215D9B" stroke-width="2"/><circle cx="652" cy="300" r="4" fill="#215D9B"/>
<rect x="36" y="413" width="888" height="47" rx="10" fill="#F4EEDF"/><text x="50" y="442" fill="#1B2C42" font-family="sans-serif" font-size="16">Reprodução matemática não comprova autenticidade temporal ou veracidade da fonte.</text>
</svg>
