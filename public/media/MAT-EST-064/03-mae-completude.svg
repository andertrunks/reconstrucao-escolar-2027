<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="365" viewBox="0 0 1080 365" role="img" aria-labelledby="title desc">
<title id="title">MAE e completude não têm o mesmo denominador</title>
<desc id="desc">A soma dos módulos dos dois pares válidos é seis; oito cartões só entra na completude, dois sobre oito.</desc>
<rect width="1080" height="365" rx="18" fill="#f8fafc"/>
<text x="25" y="39" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#203246">MAE e completude não têm o mesmo denominador</text>
<rect x="30.0" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#465c72" stroke-width="2"/>
<rect x="32.0" y="74" width="240.5" height="5" fill="#465c72"/>
<text x="41.0" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#465c72">Erros B</text>
<text x="41.0" y="133" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">+4</text>
<text x="41.0" y="159" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246"> +</text>
<text x="41.0" y="185" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">−2</text>
<text x="41.0" y="211" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246"> = 6</text>
<rect x="288.5" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#27694c" stroke-width="2"/>
<rect x="290.5" y="74" width="240.5" height="5" fill="#27694c"/>
<text x="299.5" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#27694c">MAE correto</text>
<text x="299.5" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">6 / 2 = 3 un.</text>
<rect x="547.0" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#9c353e" stroke-width="2"/>
<rect x="549.0" y="74" width="240.5" height="5" fill="#9c353e"/>
<text x="558.0" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9c353e">I01 incorreto</text>
<text x="558.0" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">6 / 8 = 0,75 un.</text>
<rect x="805.5" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#935e17" stroke-width="2"/>
<rect x="807.5" y="74" width="240.5" height="5" fill="#935e17"/>
<text x="816.5" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#935e17">Completude</text>
<text x="816.5" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">2 / 8 = 25%</text>
<text x="25" y="288" font-family="Arial,sans-serif" font-size="16" fill="#203246" font-weight="700">A diferença de 2,25 unidades equivale a subestimação de 75% em relação ao MAE correto.</text>
</svg>