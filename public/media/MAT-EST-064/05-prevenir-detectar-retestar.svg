<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="365" viewBox="0 0 1080 365" role="img" aria-labelledby="title desc">
<title id="title">Baseline aceita; erros artificiais bloqueados</title>
<desc id="desc">A referência e a cópia I01 reparada passam no ensaio; mutações negativas ainda devem ser bloqueadas.</desc>
<rect width="1080" height="365" rx="18" fill="#f8fafc"/>
<text x="25" y="39" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#203246">Baseline aceita; erros artificiais bloqueados</text>
<rect x="30.0" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#27694c" stroke-width="2"/>
<rect x="32.0" y="74" width="240.5" height="5" fill="#27694c"/>
<text x="41.0" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#27694c">I00 baseline</text>
<text x="41.0" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Passa o teste</text>
<rect x="288.5" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#9c353e" stroke-width="2"/>
<rect x="290.5" y="74" width="240.5" height="5" fill="#9c353e"/>
<text x="299.5" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9c353e">I01–I06</text>
<text x="299.5" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Rejeição esperada</text>
<rect x="547.0" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#27694c" stroke-width="2"/>
<rect x="549.0" y="74" width="240.5" height="5" fill="#27694c"/>
<text x="558.0" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#27694c">I01 corrigida</text>
<text x="558.0" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">n=2; passa local</text>
<rect x="805.5" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#935e17" stroke-width="2"/>
<rect x="807.5" y="74" width="240.5" height="5" fill="#935e17"/>
<text x="816.5" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#935e17">Implantação</text>
<text x="816.5" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Não verificada</text>
<text x="25" y="288" font-family="Arial,sans-serif" font-size="16" fill="#203246" font-weight="700">Rejeitar uma entrada artificialmente errada é sucesso do detector, não falha da suíte.</text>
</svg>