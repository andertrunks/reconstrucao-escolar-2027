<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="365" viewBox="0 0 1080 365" role="img" aria-labelledby="title desc">
<title id="title">Cadeia causal condicional e barreira proposta</title>
<desc id="desc">A alteração artificial de um divisor é gatilho; gerar MAE incorreto é o mecanismo matemático; processo real exige investigação.</desc>
<rect width="1080" height="365" rx="18" fill="#f8fafc"/>
<text x="25" y="39" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#203246">Cadeia causal condicional e barreira proposta</text>
<rect x="30.0" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#465c72" stroke-width="2"/>
<rect x="32.0" y="74" width="240.5" height="5" fill="#465c72"/>
<text x="41.0" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#465c72">Gatilho local</text>
<text x="41.0" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">I01: n=2 vira 8</text>
<rect x="288.5" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#9c353e" stroke-width="2"/>
<rect x="290.5" y="74" width="240.5" height="5" fill="#9c353e"/>
<text x="299.5" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9c353e">Resultado</text>
<text x="299.5" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">MAE: 3 vira 0,75</text>
<rect x="547.0" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#935e17" stroke-width="2"/>
<rect x="549.0" y="74" width="240.5" height="5" fill="#935e17"/>
<text x="558.0" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#935e17">Hipótese</text>
<text x="558.0" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Campo reutilizado?</text>
<text x="558.0" y="154" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Não verificado</text>
<rect x="805.5" y="72" width="244.5" height="184" rx="12" fill="white" stroke="#27694c" stroke-width="2"/>
<rect x="807.5" y="74" width="240.5" height="5" fill="#27694c"/>
<text x="816.5" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#27694c">Barreira</text>
<text x="816.5" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Campos distintos</text>
<text x="816.5" y="154" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Teste negativo</text>
<text x="25" y="288" font-family="Arial,sans-serif" font-size="16" fill="#203246" font-weight="700">O que é hipótese permanece hipótese até surgir prova do processo efetivamente utilizado.</text>
</svg>