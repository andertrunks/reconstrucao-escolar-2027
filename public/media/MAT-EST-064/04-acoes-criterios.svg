<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="365" viewBox="0 0 1080 365" role="img" aria-labelledby="title desc">
<title id="title">Uma ação testável não é uma aprovação</title>
<desc id="desc">As seis ações de testes têm critérios locais explícitos; a barreira editorial de publicação requer G3 a G8 de verdade.</desc>
<rect width="1080" height="365" rx="18" fill="#f8fafc"/>
<text x="25" y="39" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#203246">Uma ação testável não é uma aprovação</text>
<rect x="30.0" y="72" width="330.7" height="184" rx="12" fill="white" stroke="#27694c" stroke-width="2"/>
<rect x="32.0" y="74" width="326.7" height="5" fill="#27694c"/>
<text x="41.0" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#27694c">A64-01–06</text>
<text x="41.0" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Testes em fixtures</text>
<text x="41.0" y="154" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Resultado local</text>
<rect x="374.7" y="72" width="330.7" height="184" rx="12" fill="white" stroke="#935e17" stroke-width="2"/>
<rect x="376.7" y="74" width="326.7" height="5" fill="#935e17"/>
<text x="385.7" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#935e17">A64-07</text>
<text x="385.7" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Aprovação externa</text>
<text x="385.7" y="154" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Apenas proposta</text>
<rect x="719.3" y="72" width="330.7" height="184" rx="12" fill="white" stroke="#9c353e" stroke-width="2"/>
<rect x="721.3" y="74" width="326.7" height="5" fill="#9c353e"/>
<text x="730.3" y="102" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9c353e">Publicação</text>
<text x="730.3" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">G7/G8 não feitos</text>
<text x="730.3" y="154" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203246">Sem evidência</text>
<text x="25" y="288" font-family="Arial,sans-serif" font-size="16" fill="#203246" font-weight="700">Prova do validador numa cópia não comprova implementação operacional ou revisão humana.</text>
</svg>