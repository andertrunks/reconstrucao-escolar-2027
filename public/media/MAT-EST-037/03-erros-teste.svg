<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="ttl desc">
<title id="ttl">Matriz de decisão do teste</title>
<desc id="desc">Duas decisões cruzadas com hipótese verdadeira e hipótese falsa; aparecem erro I, erro II e poder.</desc>
<rect width="1120" height="330" rx="20" fill="#f8fafc"/>
<text x="42" y="56" fill="#13233c" font-size="27" font-family="Arial, sans-serif" font-weight="bold">Matriz de decisão do teste</text>
<rect x="40" y="102" width="245" height="142" rx="13" fill="#e7f1fa" stroke="#314e73" stroke-width="2"/>
<text x="53" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">H0 verdadeira</text>
<text x="53" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">rejeitar = erro I</text>
<path d="M288 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
<rect x="310" y="102" width="245" height="142" rx="13" fill="#e7f1fa" stroke="#314e73" stroke-width="2"/>
<text x="323" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">H0 falsa</text>
<text x="323" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">não rejeitar = erro II</text>
<path d="M558 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
<rect x="580" y="102" width="245" height="142" rx="13" fill="#e7f1fa" stroke="#314e73" stroke-width="2"/>
<text x="593" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Poder</text>
<text x="593" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">1 menos beta</text>
<path d="M828 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
<rect x="850" y="102" width="245" height="142" rx="13" fill="#e7f1fa" stroke="#314e73" stroke-width="2"/>
<text x="863" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">p-valor</text>
<text x="863" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">condicionado a H0</text>
<text x="43" y="289" font-family="Arial, sans-serif" font-size="16" fill="#263d57">Leia da esquerda para a direita. As etapas têm significados diferentes.</text>
</svg>