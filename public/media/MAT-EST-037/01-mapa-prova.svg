<text x="53" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Leitura de dados</text>
<text x="53" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">população • médias</text>
<path d="M288 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
