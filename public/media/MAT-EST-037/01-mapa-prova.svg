<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="ttl desc">
<title id="ttl">Mapa dos quatro eixos do simulado</title>
<desc id="desc">Fluxo entre leitura descritiva, inferência, comparação e predição; após correção há diagnóstico e reteste.</desc>
<rect width="1120" height="330" rx="20" fill="#f8fafc"/>
<text x="42" y="56" fill="#13233c" font-size="27" font-family="Arial, sans-serif" font-weight="bold">Mapa dos quatro eixos do simulado</text>
