<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="ttl desc">
<title id="ttl">Comparação de MAE e RMSE no teste fictício</title>
<desc id="desc">Gráfico de barras agrupadas em atendimentos por dia: A 5 e 5; B 6,25 e 12,5; Base 12,5 e 16,58. Escala vertical de 0 a 20.</desc>
