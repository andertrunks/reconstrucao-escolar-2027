<text x="321" y="257.0" text-anchor="middle" font-family="Arial" font-size="16">5.00</text>
<text x="284" y="340" text-anchor="middle" font-family="Arial" font-size="19">A</text>
<rect x="490" y="252.5" width="62" height="62.5" fill="#174974"/>
<text x="521" y="244.5" text-anchor="middle" font-family="Arial" font-size="16">6.25</text>
<rect x="565" y="190.0" width="62" height="125.0" fill="#b35b13"/>
<text x="596" y="182.0" text-anchor="middle" font-family="Arial" font-size="16">12.50</text>
