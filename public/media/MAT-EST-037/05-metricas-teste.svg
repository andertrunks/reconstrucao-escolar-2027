<text x="50" y="40" font-size="23" font-weight="bold" font-family="Arial">Erro de previsão nos quatro dias de teste</text>
<text x="50" y="68" font-size="15" font-family="Arial">Eixo vertical: atendimentos por dia (0 a 20). Eixo horizontal: candidato.</text>
