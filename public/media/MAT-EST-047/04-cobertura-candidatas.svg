<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Cobertura observada das duas faixas propostas</title><desc id="desc">Seis linhas classificam cada valor real como dentro ou fora das faixas A e B, com larguras definidas por horizonte.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.4}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.4}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.2}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" class="title" text-anchor="start">Cobertura observada das duas faixas propostas</text><text x="30" y="81" class="small" text-anchor="start">Candidatas didáticas A e B: propostas, não intervalos probabilísticos calibrados.</text><rect x="30" y="112" width="900" height="42" rx="9" class="panel"/><text x="44" y="139" class="small" text-anchor="start">t8/h1</text><text x="225" y="139" class="small" text-anchor="start">real 129</text><text x="416" y="139" class="small" text-anchor="start">A ±2: dentro</text><text x="677" y="139" class="small" text-anchor="start">B ±3: dentro</text><rect x="30" y="160" width="900" height="42" rx="9" class="neutral"/><text x="44" y="187" class="small" text-anchor="start">t8/h2</text><text x="225" y="187" class="small" text-anchor="start">real 145</text><text x="416" y="187" class="small" text-anchor="start">A ±3: dentro</text><text x="677" y="187" class="small" text-anchor="start">B ±4: dentro</text><rect x="30" y="208" width="900" height="42" rx="9" class="panel"/><text x="44" y="235" class="small" text-anchor="start">t9/h1</text><text x="225" y="235" class="small" text-anchor="start">real 145</text><text x="416" y="235" class="small" text-anchor="start">A ±2: dentro</text><text x="677" y="235" class="small" text-anchor="start">B ±3: dentro</text><rect x="30" y="256" width="900" height="42" rx="9" class="neutral"/><text x="44" y="283" class="small" text-anchor="start">t9/h2</text><text x="225" y="283" class="small" text-anchor="start">real 171</text><text x="416" y="283" class="small" text-anchor="start">A ±3: dentro</text><text x="677" y="283" class="small" text-anchor="start">B ±4: dentro</text><rect x="30" y="304" width="900" height="42" rx="9" class="panel"/><text x="44" y="331" class="small" text-anchor="start">t10/h1</text><text x="225" y="331" class="small" text-anchor="start">real 171</text><text x="416" y="331" class="small" text-anchor="start">A ±2: FORA</text><text x="677" y="331" class="small" text-anchor="start">B ±3: dentro</text><rect x="30" y="352" width="900" height="42" rx="9" class="neutral"/><text x="44" y="379" class="small" text-anchor="start">t10/h2</text><text x="225" y="379" class="small" text-anchor="start">real 144</text><text x="416" y="379" class="small" text-anchor="start">A ±3: dentro</text><text x="677" y="379" class="small" text-anchor="start">B ±4: dentro</text><text x="30" y="439" class="small" text-anchor="start">A: h1 2/3, h2 3/3 | B: h1 3/3, h2 3/3. Nenhum nível nominal demonstrado.</text></svg>