<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Custos assimétricos tornam os sinais relevantes</title><desc id="desc">Seis cartões apresentam o erro de cada tarefa e o custo fictício de penalizar subprevisão três vezes mais do que superprevisão.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.4}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.4}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.2}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" class="title" text-anchor="start">Custos assimétricos tornam os sinais relevantes</text><text x="30" y="85" class="small" text-anchor="start">Exemplo de política fictícia: custo 3 por unidade subprevista; custo 1 por unidade superprevista.</text><rect x="28" y="115" width="285" height="108" rx="9" class="panel"/><text x="40" y="142" class="label" text-anchor="start">Origem t8 / h1</text><text x="40" y="173" class="small" text-anchor="start">Erro: −1,99 unidades</text><text x="40" y="204" class="small" text-anchor="start">Custo: 1,99 pontos</text><rect x="334" y="115" width="285" height="108" rx="9" class="panel"/><text x="346" y="142" class="label" text-anchor="start">Origem t8 / h2</text><text x="346" y="173" class="small" text-anchor="start">Erro: −2,26 unidades</text><text x="346" y="204" class="small" text-anchor="start">Custo: 2,26 pontos</text><rect x="640" y="115" width="285" height="108" rx="9" class="panel"/><text x="652" y="142" class="label" text-anchor="start">Origem t9 / h1</text><text x="652" y="173" class="small" text-anchor="start">Erro: −1,54 unidades</text><text x="652" y="204" class="small" text-anchor="start">Custo: 1,54 pontos</text><rect x="28" y="254" width="285" height="108" rx="9" class="warm"/><text x="40" y="281" class="label" text-anchor="start">Origem t9 / h2</text><text x="40" y="312" class="small" text-anchor="start">Erro: +2,20 unidades</text><text x="40" y="343" class="small" text-anchor="start">Custo: 6,61 pontos</text><rect x="334" y="254" width="285" height="108" rx="9" class="warm"/><text x="346" y="281" class="label" text-anchor="start">Origem t10 / h1</text><text x="346" y="312" class="small" text-anchor="start">Erro: +2,76 unidades</text><text x="346" y="343" class="small" text-anchor="start">Custo: 8,28 pontos</text><rect x="640" y="254" width="285" height="108" rx="9" class="panel"/><text x="652" y="281" class="label" text-anchor="start">Origem t10 / h2</text><text x="652" y="312" class="small" text-anchor="start">Erro: −1,00 unidades</text><text x="652" y="343" class="small" text-anchor="start">Custo: 1,00 pontos</text><text x="30" y="437" class="small" text-anchor="start">Pontuação de decisão fictícia, não medida de risco real nem recomendação operacional.</text></svg>