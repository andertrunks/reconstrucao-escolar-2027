<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Painel de erros por origem e horizonte</title><desc id="desc">Seis cartões registram origem, alvo, observado, previsão e erro assinado, dois cartões por horizonte para cada origem.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.4}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.4}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.2}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" class="title" text-anchor="start">Painel de erros por origem e horizonte</text><text x="29" y="84" class="small" text-anchor="start">Emissão antes da chegada do alvo; as mesmas datas t10 e t11 podem reaparecer.</text><rect x="28" y="111" width="286" height="123" rx="9" class="panel"/><text x="40" y="140" class="label" text-anchor="start">Origem t8 → t9 (h1)</text><text x="40" y="174" class="small" text-anchor="start">Real: 129 | Previsto: 130,99</text><text x="40" y="208" class="small" text-anchor="start">Erro: −1,99 un.</text><rect x="334" y="111" width="286" height="123" rx="9" class="warm"/><text x="346" y="140" class="label" text-anchor="start">Origem t8 → t10 (h2)</text><text x="346" y="174" class="small" text-anchor="start">Real: 145 | Previsto: 147,26</text><text x="346" y="208" class="small" text-anchor="start">Erro: −2,26 un.</text><rect x="640" y="111" width="286" height="123" rx="9" class="panel"/><text x="652" y="140" class="label" text-anchor="start">Origem t9 → t10 (h1)</text><text x="652" y="174" class="small" text-anchor="start">Real: 145 | Previsto: 146,54</text><text x="652" y="208" class="small" text-anchor="start">Erro: −1,54 un.</text><rect x="28" y="258" width="286" height="123" rx="9" class="warm"/><text x="40" y="287" class="label" text-anchor="start">Origem t9 → t11 (h2)</text><text x="40" y="321" class="small" text-anchor="start">Real: 171 | Previsto: 168,80</text><text x="40" y="355" class="small" text-anchor="start">Erro: +2,20 un.</text><rect x="334" y="258" width="286" height="123" rx="9" class="panel"/><text x="346" y="287" class="label" text-anchor="start">Origem t10 → t11 (h1)</text><text x="346" y="321" class="small" text-anchor="start">Real: 171 | Previsto: 168,24</text><text x="346" y="355" class="small" text-anchor="start">Erro: +2,76 un.</text><rect x="640" y="258" width="286" height="123" rx="9" class="warm"/><text x="652" y="287" class="label" text-anchor="start">Origem t10 → t12 (h2)</text><text x="652" y="321" class="small" text-anchor="start">Real: 144 | Previsto: 145,00</text><text x="652" y="355" class="small" text-anchor="start">Erro: −1,00 un.</text><text x="30" y="439" class="small" text-anchor="start">Atenção: seis tarefas, quatro alvos distintos. Avaliação retrospectiva, não novo teste oculto.</text></svg>