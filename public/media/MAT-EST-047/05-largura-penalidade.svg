<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Troca entre largura e penalidade por erro externo</title><desc id="desc">Quatro cartões apresentam cobertura, largura média e escore intervalar médio de A e B, separados por horizonte.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.4}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.4}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.2}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" class="title" text-anchor="start">Troca entre largura e penalidade por erro externo</text><text x="30" y="85" class="small" text-anchor="start">Score didático com alfa 0,2: largura + 10 × distância externa. Menor é preferível sob esta regra.</text><rect x="30" y="120" width="432" height="116" rx="9" class="panel"/><text x="45" y="151" class="label" text-anchor="start">A / h1</text><text x="45" y="186" class="small" text-anchor="start">Cobertura: 2/3; largura: 4,0</text><text x="45" y="221" class="small" text-anchor="start">Score médio: 6,532</text><rect x="490" y="120" width="432" height="116" rx="9" class="warm"/><text x="505" y="151" class="label" text-anchor="start">B / h1</text><text x="505" y="186" class="small" text-anchor="start">Cobertura: 3/3; largura: 6,0</text><text x="505" y="221" class="small" text-anchor="start">Score médio: 6,000</text><rect x="30" y="265" width="432" height="116" rx="9" class="panel"/><text x="45" y="296" class="label" text-anchor="start">A / h2</text><text x="45" y="331" class="small" text-anchor="start">Cobertura: 3/3; largura: 6,0</text><text x="45" y="366" class="small" text-anchor="start">Score médio: 6,000</text><rect x="490" y="265" width="432" height="116" rx="9" class="warm"/><text x="505" y="296" class="label" text-anchor="start">B / h2</text><text x="505" y="331" class="small" text-anchor="start">Cobertura: 3/3; largura: 8,0</text><text x="505" y="366" class="small" text-anchor="start">Score médio: 8,000</text><text x="30" y="439" class="small" text-anchor="start">Score não transforma faixa arbitrária em intervalo com cobertura nominal validada.</text></svg>