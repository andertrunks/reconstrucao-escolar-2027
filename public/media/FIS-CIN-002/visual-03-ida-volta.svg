<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Ida e volta com deslocamento zero</title><desc id="desc">Reta de zero a cinco metros. Uma seta mostra a ida de zero a cinco e outra a volta de cinco a zero. O deslocamento total é zero e a distância percorrida é dez metros.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><rect width="960" height="340" fill="white"/><text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Ida e volta: o caminho não desaparece</text><line x1="170" y1="180" x2="790" y2="180" stroke="#111" stroke-width="3"/><circle cx="220" cy="180" r="8" fill="#111"/><circle cx="740" cy="180" r="8" fill="white" stroke="#111" stroke-width="3"/><text x="220" y="215" text-anchor="middle" font-family="sans-serif" font-size="18">0 m</text><text x="740" y="215" text-anchor="middle" font-family="sans-serif" font-size="18">5 m</text><line x1="235" y1="120" x2="725" y2="120" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><text x="480" y="105" text-anchor="middle" font-family="sans-serif" font-size="18">ida: 5 m</text><line x1="725" y1="150" x2="235" y2="150" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><text x="480" y="168" text-anchor="middle" font-family="sans-serif" font-size="18">volta: 5 m</text><rect x="255" y="245" width="450" height="65" fill="white" stroke="#111" stroke-width="2"/><text x="480" y="272" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Δs = 0 m</text><text x="480" y="296" text-anchor="middle" font-family="sans-serif" font-size="19">distância = 5 + 5 = 10 m</text></svg>
