<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Mesmo deslocamento e distâncias diferentes</title><desc id="desc">Dois movimentos começam em zero e terminam em quatro metros. A vai diretamente e percorre quatro metros. B vai até sete e retorna a quatro, percorrendo dez metros. Ambos têm deslocamento positivo de quatro metros.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><rect width="960" height="420" fill="white"/><text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Mesmo deslocamento, caminhos diferentes</text><g font-family="sans-serif"><text x="90" y="135" font-size="20" font-weight="700">A</text><line x1="180" y1="130" x2="830" y2="130" stroke="#111" stroke-width="3"/><circle cx="230" cy="130" r="7" fill="#111"/><circle cx="550" cy="130" r="7" fill="#111"/><line x1="245" y1="95" x2="535" y2="95" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><text x="230" y="160" text-anchor="middle">0 m</text><text x="550" y="160" text-anchor="middle">4 m</text><text x="690" y="112" font-size="18">Δs = +4 m; d = 4 m</text><text x="90" y="285" font-size="20" font-weight="700">B</text><line x1="180" y1="280" x2="830" y2="280" stroke="#111" stroke-width="3"/><circle cx="230" cy="280" r="7" fill="#111"/><circle cx="550" cy="280" r="7" fill="#111"/><circle cx="790" cy="280" r="7" fill="white" stroke="#111" stroke-width="3"/><line x1="245" y1="230" x2="775" y2="230" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><line x1="775" y1="250" x2="565" y2="250" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><text x="230" y="312" text-anchor="middle">0 m</text><text x="550" y="312" text-anchor="middle">4 m</text><text x="790" y="312" text-anchor="middle">7 m</text><text x="690" y="335" font-size="18">Δs = +4 m; d = 7 + 3 = 10 m</text><text x="480" y="385" text-anchor="middle" font-size="18">As extremidades são iguais; o caminho intermediário é diferente.</text></g></svg>
