<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">Posição inicial, posição final e deslocamento</title><desc id="desc">Reta orientada de menos quatro a mais cinco metros. A posição inicial está em menos dois metros, a final em mais cinco metros e uma seta mostra deslocamento positivo de sete metros.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><rect width="960" height="320" fill="white"/><text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Posição inicial, final e deslocamento</text><line x1="100" y1="175" x2="870" y2="175" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/><text x="875" y="180" font-family="sans-serif" font-size="18">sentido positivo</text><g font-family="sans-serif" font-size="17" text-anchor="middle"> <line x1="150" y1="163" x2="150" y2="187" stroke="#111"/><text x="150" y="210">−4</text><line x1="225" y1="163" x2="225" y2="187" stroke="#111"/><text x="225" y="210">−3</text><line x1="300" y1="163" x2="300" y2="187" stroke="#111"/><text x="300" y="210">−2</text><line x1="375" y1="163" x2="375" y2="187" stroke="#111"/><text x="375" y="210">−1</text><line x1="450" y1="158" x2="450" y2="192" stroke="#111" stroke-width="2"/><text x="450" y="210">0</text><line x1="525" y1="163" x2="525" y2="187" stroke="#111"/><text x="525" y="210">+1</text><line x1="600" y1="163" x2="600" y2="187" stroke="#111"/><text x="600" y="210">+2</text><line x1="675" y1="163" x2="675" y2="187" stroke="#111"/><text x="675" y="210">+3</text><line x1="750" y1="163" x2="750" y2="187" stroke="#111"/><text x="750" y="210">+4</text><line x1="825" y1="163" x2="825" y2="187" stroke="#111"/><text x="825" y="210">+5</text></g><circle cx="300" cy="175" r="9" fill="white" stroke="#111" stroke-width="4"/><circle cx="825" cy="175" r="9" fill="#111"/><text x="300" y="135" text-anchor="middle" font-family="sans-serif" font-size="19">sᵢ = −2 m</text><text x="825" y="135" text-anchor="middle" font-family="sans-serif" font-size="19">s_f = +5 m</text><line x1="310" y1="95" x2="815" y2="95" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><text x="562" y="78" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Δs = +7 m</text><text x="480" y="275" text-anchor="middle" font-family="sans-serif" font-size="18">Δs = s_f − sᵢ = 5 − (−2) = +7 m</text></svg>
