<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Posição, deslocamento e distância percorrida</title><desc id="desc">Quadro de três colunas. Posição responde onde o corpo está; deslocamento compara posição final e inicial com orientação; distância percorrida soma o comprimento de todo o caminho e não é negativa.</desc><rect width="960" height="430" fill="white"/><text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Três perguntas diferentes sobre o movimento</text><g font-family="sans-serif" fill="white" stroke="#111" stroke-width="2"><rect x="45" y="75" width="270" height="285"/><rect x="345" y="75" width="270" height="285"/><rect x="645" y="75" width="270" height="285"/></g><g font-family="sans-serif" fill="#111"><text x="180" y="112" text-anchor="middle" font-size="21" font-weight="700">POSIÇÃO</text><text x="480" y="112" text-anchor="middle" font-size="21" font-weight="700">DESLOCAMENTO</text><text x="780" y="112" text-anchor="middle" font-size="21" font-weight="700">DISTÂNCIA</text><text x="180" y="155" text-anchor="middle" font-size="18">Onde o corpo está?</text><text x="480" y="155" text-anchor="middle" font-size="18">Quanto a posição variou?</text><text x="780" y="155" text-anchor="middle" font-size="18">Quanto caminho foi feito?</text><text x="180" y="205" text-anchor="middle" font-size="17">coordenada s</text><text x="480" y="205" text-anchor="middle" font-size="17">Δs = s_f − sᵢ</text><text x="780" y="205" text-anchor="middle" font-size="17">soma dos trechos</text><text x="180" y="255" text-anchor="middle" font-size="17">pode ser +, 0 ou −</text><text x="480" y="255" text-anchor="middle" font-size="17">pode ser +, 0 ou −</text><text x="780" y="255" text-anchor="middle" font-size="17">sempre ≥ 0</text><text x="180" y="305" text-anchor="middle" font-size="17">depende do referencial</text><text x="480" y="305" text-anchor="middle" font-size="17">depende de início e fim</text><text x="780" y="305" text-anchor="middle" font-size="17">depende do percurso</text><text x="480" y="402" text-anchor="middle" font-size="18" font-weight="700">Em uma dimensão: distância ≥ módulo do deslocamento.</text></g></svg>
