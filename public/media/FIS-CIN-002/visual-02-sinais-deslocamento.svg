<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Deslocamentos positivo, negativo e nulo</title><desc id="desc">Três retas com exemplos: de um a quatro, deslocamento positivo; de quatro a um, deslocamento negativo; e ida e volta começando e terminando em dois, deslocamento nulo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><rect width="960" height="420" fill="white"/><text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Deslocamentos positivo, negativo e nulo</text><g font-family="sans-serif"><text x="90" y="95" font-size="20" font-weight="700">Positivo</text><line x1="220" y1="90" x2="850" y2="90" stroke="#111" stroke-width="3"/><circle cx="350" cy="90" r="7" fill="white" stroke="#111" stroke-width="3"/><circle cx="700" cy="90" r="7" fill="#111"/><line x1="365" y1="65" x2="685" y2="65" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><text x="350" y="120" text-anchor="middle">1 m</text><text x="700" y="120" text-anchor="middle">4 m</text><text x="525" y="52" text-anchor="middle" font-size="18">Δs = +3 m</text><text x="90" y="215" font-size="20" font-weight="700">Negativo</text><line x1="220" y1="210" x2="850" y2="210" stroke="#111" stroke-width="3"/><circle cx="700" cy="210" r="7" fill="white" stroke="#111" stroke-width="3"/><circle cx="350" cy="210" r="7" fill="#111"/><line x1="685" y1="185" x2="365" y2="185" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><text x="350" y="240" text-anchor="middle">1 m</text><text x="700" y="240" text-anchor="middle">4 m</text><text x="525" y="172" text-anchor="middle" font-size="18">Δs = −3 m</text><text x="90" y="335" font-size="20" font-weight="700">Nulo</text><line x1="220" y1="330" x2="850" y2="330" stroke="#111" stroke-width="3"/><circle cx="470" cy="330" r="7" fill="#111"/><line x1="480" y1="300" x2="700" y2="300" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><line x1="700" y1="280" x2="485" y2="280" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/><text x="470" y="360" text-anchor="middle">2 m: início e fim</text><text x="700" y="360" text-anchor="middle">ida</text><text x="585" y="267" text-anchor="middle" font-size="18">retorno</text><text x="780" y="300" font-size="18">Δs = 0</text></g></svg>
