<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Árvore de classificação das variáveis</title><desc id="desc">árvore textual que divide variável em qualitativa e quantitativa; qualitativa em nominal e ordinal; quantitativa em discreta e contínua.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#204c47"/></marker></defs><rect width="960" height="600" fill="white"/><g fill="#143b37" font-family="Arial,sans-serif"><text x="36" y="52" font-size="30">Árvore de classificação das variáveis</text><rect x="350" y="90" width="220" height="60" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="366" y="128.0" font-size="24">Variável</text><path d="M460 150 L250 200" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><path d="M460 150 L700 200" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="205" width="310" height="60" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="116" y="243.0" font-size="24">Qualitativa</text><rect x="540" y="205" width="320" height="60" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="556" y="243.0" font-size="24">Quantitativa</text><path d="M250 265 L130 320" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="325" width="200" height="60" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="46" y="363.0" font-size="24">Nominal</text><path d="M250 265 L365 320" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="265" y="325" width="200" height="60" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="281" y="363.0" font-size="24">Ordinal</text><path d="M700 265 L600 320" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="500" y="325" width="200" height="60" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="516" y="363.0" font-size="24">Discreta</text><path d="M700 265 L835 320" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="325" width="200" height="60" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="751" y="363.0" font-size="24">Contínua</text><text x="35" y="440" font-size="21">Sem ordem</text><text x="35" y="475" font-size="21">transporte</text><text x="270" y="440" font-size="21">Com ordem</text><text x="270" y="475" font-size="21">satisfação</text><text x="505" y="440" font-size="21">Contagem</text><text x="505" y="475" font-size="21">nº de itens</text><text x="740" y="440" font-size="21">Medição</text><text x="740" y="475" font-size="21">tempo</text><text x="40" y="555" font-size="24">Classifique o significado da variável, além do código.</text></g></svg>