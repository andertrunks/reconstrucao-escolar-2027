<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Da pergunta à conclusão</title><desc id="desc">sequência pergunta → população → unidade → variáveis → coleta → dados → análise → conclusão limitada.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#204c47"/></marker></defs><rect width="960" height="600" fill="white"/><g fill="#143b37" font-family="Arial,sans-serif"><text x="36" y="52" font-size="30">Da pergunta à conclusão</text><rect x="40" y="140" width="180" height="95" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="56" y="195.5" font-size="24">Pergunta</text><text x="50" y="270" font-size="18">1. Pergunta</text><rect x="275" y="140" width="180" height="95" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="291" y="195.5" font-size="24">População</text><text x="285" y="270" font-size="18">2. População</text><path d="M220 187 L275 187" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="140" width="180" height="95" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="526" y="195.5" font-size="24">Unidade</text><text x="520" y="270" font-size="18">3. Unidade</text><path d="M455 187 L510 187" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="745" y="140" width="180" height="95" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="761" y="195.5" font-size="24">Variáveis</text><text x="755" y="270" font-size="18">4. Variáveis</text><path d="M690 187 L745 187" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="745" y="370" width="180" height="95" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="761" y="425.5" font-size="24">Coleta</text><text x="755" y="500" font-size="18">5. Coleta</text><path d="M835 235 L835 370" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="370" width="180" height="95" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="526" y="425.5" font-size="24">Dados</text><text x="520" y="500" font-size="18">6. Dados</text><path d="M745 417 L690 417" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="275" y="370" width="180" height="95" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="291" y="425.5" font-size="24">Análise</text><text x="285" y="500" font-size="18">7. Análise</text><path d="M510 417 L455 417" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="370" width="180" height="95" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="56" y="425.5" font-size="24">Conclusão</text><text x="50" y="500" font-size="18">8. Limitada</text><path d="M275 417 L220 417" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="560" font-size="24">A análise vem depois da definição e da coleta dos dados.</text></g></svg>