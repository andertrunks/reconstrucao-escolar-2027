<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Unidade, variável e dado</title><desc id="desc">pequena matriz com três linhas de atendimentos e três colunas: identificador, meio de transporte e tempo em minutos.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#204c47"/></marker></defs><rect width="960" height="600" fill="white"/><g fill="#143b37" font-family="Arial,sans-serif"><text x="36" y="52" font-size="30">Unidade, variável e dado</text><text x="40" y="110" font-size="24">Dados fictícios para ilustrar a matriz.</text><rect x="40" y="145" width="190" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="56" y="191.0" font-size="24">Unidade</text><rect x="230" y="145" width="370" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="246" y="191.0" font-size="24">Meio de transporte</text><rect x="600" y="145" width="320" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="616" y="191.0" font-size="24">Tempo (minutos)</text><rect x="40" y="225" width="190" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="56" y="271.0" font-size="24">A17</text><rect x="230" y="225" width="370" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="246" y="271.0" font-size="24">Ônibus</text><rect x="600" y="225" width="320" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="616" y="271.0" font-size="24">18</text><rect x="40" y="305" width="190" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="56" y="351.0" font-size="24">A18</text><rect x="230" y="305" width="370" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="246" y="351.0" font-size="24">A pé</text><rect x="600" y="305" width="320" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="616" y="351.0" font-size="24">12</text><rect x="40" y="385" width="190" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="56" y="431.0" font-size="24">A19</text><rect x="230" y="385" width="370" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="246" y="431.0" font-size="24">Bicicleta</text><rect x="600" y="385" width="320" height="76" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="616" y="431.0" font-size="24">9</text><text x="40" y="510" font-size="24">Uma linha: uma unidade. Uma coluna: uma variável.</text><text x="40" y="555" font-size="24">“Tempo” é variável; “18 minutos” é o dado de A17.</text></g></svg>