<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Censo e amostra</title><desc id="desc">dois caminhos partindo da mesma população: censo cobre todas as unidades; pesquisa amostral seleciona uma parte e mantém explícita a população-alvo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#204c47"/></marker></defs><rect width="960" height="600" fill="white"/><g fill="#143b37" font-family="Arial,sans-serif"><text x="36" y="52" font-size="30">Censo e amostra</text><rect x="275" y="100" width="420" height="70" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="291" y="143.0" font-size="24">Mesma população-alvo</text><path d="M470 170 L240 250" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 170 L700 250" fill="none" stroke="#204c47" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="255" width="355" height="80" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="76" y="303.0" font-size="24">Censo</text><rect x="530" y="255" width="365" height="80" rx="12" fill="#eef5f4" stroke="#204c47" stroke-width="2"/><text x="546" y="303.0" font-size="24">Pesquisa amostral</text><text x="70" y="385" font-size="24">Todas as unidades</text><text x="540" y="385" font-size="24">Uma parte selecionada</text><text x="70" y="450" font-size="24">Mesmo conjunto de interesse explícito nos dois caminhos.</text><text x="70" y="515" font-size="24">O desenho da coleta e a pergunta continuam necessários.</text></g></svg>