<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Andares acima e abaixo do térreo</title><desc id="desc">Edifício com andares positivos acima do térreo zero e subsolos negativos abaixo, com seta do menos dois ao mais três.</desc>
<rect width="960" height="540" fill="#fff"/>
<text x="480" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111">Andares acima e abaixo do térreo</text>
<rect x="300" y="90" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="480" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+3</text><rect x="300" y="145" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="480" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+2</text><rect x="300" y="200" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="480" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+1</text><rect x="300" y="255" width="360" height="48" fill="#eee" stroke="#111" stroke-width="2"/><text x="480" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">0 — térreo</text><rect x="300" y="310" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="480" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-1</text><rect x="300" y="365" width="360" height="48" fill="#fff" stroke="#111" stroke-width="2"/><text x="480" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-2</text><line x1="720" y1="390" x2="720" y2="105" stroke="#111" stroke-width="5"/>
<polygon points="720,95 708,115 732,115" fill="#111"/>
<text x="780" y="250" font-family="Arial,sans-serif" font-size="20" fill="#111">subir 5 andares</text>
<text x="480" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#111">-2 + 5 = +3</text>
</svg>