<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Termômetro como reta numérica vertical</title><desc id="desc">Escala vertical de menos cinco a mais cinco graus Celsius com seta mostrando aumento de menos cinco para menos dois.</desc>
<rect width="960" height="540" fill="#fff"/>
<text x="480" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111">Termômetro como reta numérica vertical</text>
<line x1="430" y1="450" x2="430" y2="100" stroke="#111" stroke-width="6"/>
<circle cx="430" cy="465" r="25" fill="#ddd" stroke="#111" stroke-width="3"/>
<line x1="410" y1="430" x2="450" y2="430" stroke="#111" stroke-width="2"/><text x="475" y="437" font-family="Arial,sans-serif" font-size="20" fill="#111">-5 °C</text><line x1="410" y1="400" x2="450" y2="400" stroke="#111" stroke-width="2"/><text x="475" y="407" font-family="Arial,sans-serif" font-size="20" fill="#111">-4 °C</text><line x1="410" y1="370" x2="450" y2="370" stroke="#111" stroke-width="2"/><text x="475" y="377" font-family="Arial,sans-serif" font-size="20" fill="#111">-3 °C</text><line x1="410" y1="340" x2="450" y2="340" stroke="#111" stroke-width="2"/><text x="475" y="347" font-family="Arial,sans-serif" font-size="20" fill="#111">-2 °C</text><line x1="410" y1="310" x2="450" y2="310" stroke="#111" stroke-width="2"/><text x="475" y="317" font-family="Arial,sans-serif" font-size="20" fill="#111">-1 °C</text><line x1="410" y1="280" x2="450" y2="280" stroke="#111" stroke-width="4"/><text x="475" y="287" font-family="Arial,sans-serif" font-size="20" fill="#111">0 °C</text><line x1="410" y1="250" x2="450" y2="250" stroke="#111" stroke-width="2"/><text x="475" y="257" font-family="Arial,sans-serif" font-size="20" fill="#111">+1 °C</text><line x1="410" y1="220" x2="450" y2="220" stroke="#111" stroke-width="2"/><text x="475" y="227" font-family="Arial,sans-serif" font-size="20" fill="#111">+2 °C</text><line x1="410" y1="190" x2="450" y2="190" stroke="#111" stroke-width="2"/><text x="475" y="197" font-family="Arial,sans-serif" font-size="20" fill="#111">+3 °C</text><line x1="410" y1="160" x2="450" y2="160" stroke="#111" stroke-width="2"/><text x="475" y="167" font-family="Arial,sans-serif" font-size="20" fill="#111">+4 °C</text><line x1="410" y1="130" x2="450" y2="130" stroke="#111" stroke-width="2"/><text x="475" y="137" font-family="Arial,sans-serif" font-size="20" fill="#111">+5 °C</text><line x1="360" y1="430" x2="360" y2="340" stroke="#111" stroke-width="5"/>
<polygon points="360,330 348,350 372,350" fill="#111"/>
<text x="270" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#111">aumento de 3 °C</text>
<text x="725" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-5 °C → -2 °C</text>
<text x="725" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#111">o valor aumenta, embora continue negativo</text>
</svg>