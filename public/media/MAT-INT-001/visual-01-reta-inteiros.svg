<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Reta numérica dos inteiros</title><desc id="desc">Reta de menos seis a mais seis, com zero na origem e seta para a direita indicando aumento dos valores.</desc>
<rect width="960" height="540" fill="#fff"/>
<text x="480" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111">Reta numérica dos inteiros</text>
<line x1="100" y1="270" x2="860" y2="270" stroke="#111" stroke-width="4"/>
<polygon points="860,270 840,258 840,282" fill="#111"/>
<polygon points="100,270 120,258 120,282" fill="#111"/>
<text x="795" y="225" font-family="Arial,sans-serif" font-size="20" fill="#111">valores maiores →</text>
<text x="100" y="225" font-family="Arial,sans-serif" font-size="20" fill="#111">← valores menores</text>
<line x1="140.0" y1="250" x2="140.0" y2="290" stroke="#111" stroke-width="2"/><text x="140.0" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-6</text><line x1="196.7" y1="250" x2="196.7" y2="290" stroke="#111" stroke-width="2"/><text x="196.7" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-5</text><line x1="253.3" y1="250" x2="253.3" y2="290" stroke="#111" stroke-width="2"/><text x="253.3" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-4</text><line x1="310.0" y1="250" x2="310.0" y2="290" stroke="#111" stroke-width="2"/><text x="310.0" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-3</text><line x1="366.7" y1="250" x2="366.7" y2="290" stroke="#111" stroke-width="2"/><text x="366.7" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-2</text><line x1="423.4" y1="250" x2="423.4" y2="290" stroke="#111" stroke-width="2"/><text x="423.4" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">-1</text><line x1="480.0" y1="250" x2="480.0" y2="290" stroke="#111" stroke-width="4"/><text x="480.0" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">0</text><line x1="536.7" y1="250" x2="536.7" y2="290" stroke="#111" stroke-width="2"/><text x="536.7" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+1</text><line x1="593.4" y1="250" x2="593.4" y2="290" stroke="#111" stroke-width="2"/><text x="593.4" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+2</text><line x1="650.0" y1="250" x2="650.0" y2="290" stroke="#111" stroke-width="2"/><text x="650.0" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+3</text><line x1="706.7" y1="250" x2="706.7" y2="290" stroke="#111" stroke-width="2"/><text x="706.7" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+4</text><line x1="763.4" y1="250" x2="763.4" y2="290" stroke="#111" stroke-width="2"/><text x="763.4" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+5</text><line x1="820.0" y1="250" x2="820.0" y2="290" stroke="#111" stroke-width="2"/><text x="820.0" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">+6</text><text x="480" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">Origem: 0</text>
<text x="245" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">inteiros negativos</text>
<text x="715" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#111">inteiros positivos</text>
