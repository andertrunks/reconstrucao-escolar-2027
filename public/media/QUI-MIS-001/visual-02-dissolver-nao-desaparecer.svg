<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Dissolver não significa desaparecer</title>
<desc id="desc">À esquerda, sal sólido é adicionado à água. À direita, a solução parece uniforme, mas água e sal continuam identificados como componentes.</desc>
<rect width="960" height="540" fill="white"/>
<text x="480" y="40" text-anchor="middle" font-size="30" font-family="sans-serif">Dissolver não significa desaparecer</text>
<g font-family="sans-serif" fill="#111" stroke="#111" stroke-width="2">
  <g transform="translate(120 90)">
    <rect x="0" y="80" width="250" height="250" fill="none"/>
    <rect x="10" y="180" width="230" height="140" fill="#f3f3f3"/>
    <circle cx="110" cy="130" r="7"/><circle cx="135" cy="145" r="7"/><circle cx="160" cy="125" r="7"/>
    <path d="M135 155v55" fill="none" marker-end="url(#none)"/>
    <text x="125" y="370" text-anchor="middle" stroke="none" font-size="20">antes: sal visível + água</text>
  </g>
  <path d="M405 250h130" fill="none"/><path d="M525 240l20 10-20 10z"/>
  <g transform="translate(590 90)">
    <rect x="0" y="80" width="250" height="250" fill="none"/>
    <rect x="10" y="120" width="230" height="200" fill="#f3f3f3"/>
    <text x="125" y="190" text-anchor="middle" stroke="none" font-size="22">1 fase uniforme</text>
    <text x="125" y="230" text-anchor="middle" stroke="none" font-size="20">água + sal</text>
    <text x="125" y="270" text-anchor="middle" stroke="none" font-size="18">2 componentes</text>
    <text x="125" y="370" text-anchor="middle" stroke="none" font-size="20">depois: solução</text>
  </g>
</g>
<text x="480" y="490" text-anchor="middle" font-family="sans-serif" font-size="20">O sal deixa de formar uma fase sólida visível, mas continua presente no sistema.</text>
</svg>