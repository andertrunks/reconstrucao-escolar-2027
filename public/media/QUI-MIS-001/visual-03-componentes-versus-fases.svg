<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Componentes versus fases</title>
<desc id="desc">Tabela esquemática compara três sistemas e mostra que o número de componentes pode ser diferente do número de fases.</desc>
<rect width="960" height="540" fill="white"/>
<text x="480" y="42" text-anchor="middle" font-size="30" font-family="sans-serif">Componentes ≠ fases</text>
<g font-family="sans-serif" font-size="21" fill="#111" stroke="#111" stroke-width="2">
  <rect x="100" y="90" width="760" height="300" fill="none"/>
  <line x1="100" y1="150" x2="860" y2="150"/><line x1="100" y1="230" x2="860" y2="230"/><line x1="100" y1="310" x2="860" y2="310"/>
  <line x1="470" y1="90" x2="470" y2="390"/><line x1="665" y1="90" x2="665" y2="390"/>
  <text x="285" y="130" text-anchor="middle" stroke="none">sistema</text>
  <text x="565" y="130" text-anchor="middle" stroke="none">componentes</text>
  <text x="762" y="130" text-anchor="middle" stroke="none">fases</text>
  <text x="285" y="200" text-anchor="middle" stroke="none">água + sal dissolvido</text><text x="565" y="200" text-anchor="middle" stroke="none">2</text><text x="762" y="200" text-anchor="middle" stroke="none">1</text>
  <text x="285" y="280" text-anchor="middle" stroke="none">água + óleo</text><text x="565" y="280" text-anchor="middle" stroke="none">2</text><text x="762" y="280" text-anchor="middle" stroke="none">2</text>
  <text x="285" y="360" text-anchor="middle" stroke="none">água líquida + gelo + óleo</text><text x="565" y="360" text-anchor="middle" stroke="none">2</text><text x="762" y="360" text-anchor="middle" stroke="none">3</text>
</g>
<text x="480" y="450" text-anchor="middle" font-family="sans-serif" font-size="20">Conte o que está presente e conte as regiões uniformes com critérios diferentes.</text>
</svg>