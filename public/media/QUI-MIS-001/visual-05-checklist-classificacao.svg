<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Checklist para classificar misturas</title>
<desc id="desc">Fluxograma em sete etapas: definir sistema, identificar componentes, observar condições, contar fases, classificar e registrar limites.</desc>
<rect width="960" height="540" fill="white"/>
<text x="480" y="40" text-anchor="middle" font-size="30" font-family="sans-serif">Checklist de classificação</text>
<g font-family="sans-serif" font-size="19" fill="#111" stroke="#111" stroke-width="2">
  <rect x="80" y="90" width="240" height="65" rx="8" fill="none"/><text x="200" y="130" text-anchor="middle" stroke="none">1. Defina o sistema</text>
  <rect x="360" y="90" width="240" height="65" rx="8" fill="none"/><text x="480" y="120" text-anchor="middle" stroke="none">2. Identifique</text><text x="480" y="143" text-anchor="middle" stroke="none">os componentes</text>
  <rect x="640" y="90" width="240" height="65" rx="8" fill="none"/><text x="760" y="120" text-anchor="middle" stroke="none">3. Observe condições</text><text x="760" y="143" text-anchor="middle" stroke="none">e aspecto</text>
  <rect x="360" y="210" width="240" height="65" rx="8" fill="none"/><text x="480" y="250" text-anchor="middle" stroke="none">4. Conte as fases</text>
  <rect x="90" y="340" width="300" height="70" rx="8" fill="none"/><text x="240" y="370" text-anchor="middle" stroke="none">1 fase → homogênea</text><text x="240" y="394" text-anchor="middle" stroke="none">no modelo introdutório</text>
  <rect x="570" y="340" width="300" height="70" rx="8" fill="none"/><text x="720" y="370" text-anchor="middle" stroke="none">2 ou mais fases →</text><text x="720" y="394" text-anchor="middle" stroke="none">heterogênea</text>
  <line x1="320" y1="122" x2="360" y2="122"/><line x1="600" y1="122" x2="640" y2="122"/>
  <line x1="760" y1="155" x2="760" y2="242"/><line x1="760" y1="242" x2="600" y2="242"/>
  <line x1="480" y1="275" x2="480" y2="320"/><line x1="480" y1="320" x2="240" y2="340"/><line x1="480" y1="320" x2="720" y2="340"/>
</g>
<text x="480" y="470" text-anchor="middle" font-family="sans-serif" font-size="18">7. Registre limites de escala, tempo ou temperatura quando forem relevantes.</text>
</svg>