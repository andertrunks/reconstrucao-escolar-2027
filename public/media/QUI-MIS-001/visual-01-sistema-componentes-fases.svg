<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Sistema material, componentes e fases</title>
<desc id="desc">Quatro recipientes mostram água com sal dissolvido, água com óleo, água com areia e água líquida com gelo e óleo, comparando componentes e fases.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#555" stroke-width="1"/></pattern></defs>
<rect width="960" height="540" fill="white"/>
<text x="480" y="34" text-anchor="middle" font-size="28" font-family="sans-serif">Componentes e fases</text>
<g font-family="sans-serif" font-size="18" fill="#111" stroke="#111" stroke-width="2">
  <g transform="translate(40 80)">
    <rect x="0" y="0" width="190" height="260" fill="none"/>
    <rect x="8" y="90" width="174" height="162" fill="#f4f4f4"/>
    <text x="95" y="290" text-anchor="middle" stroke="none">água + sal</text>
    <text x="95" y="318" text-anchor="middle" stroke="none">2 componentes</text>
    <text x="95" y="346" text-anchor="middle" stroke="none">1 fase</text>
  </g>
  <g transform="translate(270 80)">
    <rect x="0" y="0" width="190" height="260" fill="none"/>
    <rect x="8" y="90" width="174" height="80" fill="#e6e6e6"/>
    <rect x="8" y="170" width="174" height="82" fill="url(#hatch)"/>
    <line x1="8" y1="170" x2="182" y2="170"/>
    <text x="95" y="290" text-anchor="middle" stroke="none">água + óleo</text>
    <text x="95" y="318" text-anchor="middle" stroke="none">2 componentes</text>
    <text x="95" y="346" text-anchor="middle" stroke="none">2 fases</text>
  </g>
  <g transform="translate(500 80)">
    <rect x="0" y="0" width="190" height="260" fill="none"/>
    <rect x="8" y="90" width="174" height="130" fill="#f4f4f4"/>
    <circle cx="35" cy="235" r="9" fill="#111"/><circle cx="65" cy="232" r="7" fill="#111"/><circle cx="98" cy="238" r="8" fill="#111"/><circle cx="130" cy="230" r="6" fill="#111"/><circle cx="160" cy="238" r="8" fill="#111"/>
    <text x="95" y="290" text-anchor="middle" stroke="none">água + areia</text>
    <text x="95" y="318" text-anchor="middle" stroke="none">2 componentes</text>
    <text x="95" y="346" text-anchor="middle" stroke="none">2 fases</text>
  </g>
  <g transform="translate(730 80)">
    <rect x="0" y="0" width="190" height="260" fill="none"/>
    <rect x="8" y="80" width="174" height="70" fill="#e6e6e6"/>
    <rect x="8" y="150" width="174" height="102" fill="#f4f4f4"/>
    <rect x="55" y="178" width="54" height="54" fill="url(#hatch)"/>
    <text x="95" y="290" text-anchor="middle" stroke="none">água + gelo + óleo</text>
    <text x="95" y="318" text-anchor="middle" stroke="none">2 componentes</text>
    <text x="95" y="346" text-anchor="middle" stroke="none">3 fases</text>
  </g>
</g>
<text x="480" y="490" text-anchor="middle" font-family="sans-serif" font-size="20">Componente responde “o que está presente?”; fase responde “quantas regiões uniformes?”</text>
</svg>