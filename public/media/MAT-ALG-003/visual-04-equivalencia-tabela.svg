l="#1d334b">Mas 2x+3 vale apenas 3.</text><rect x="568" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="800" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">6 ≠ 3</text><text x="572" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">Já sabemos que não equivalem</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1149" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#fff">Não confunda teste e prova</text><text x="1098" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Alguns valores iguais não provam</text><text x="1098" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">igualdade para todo x.</text><rect x="1094" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="1326" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2(x+3)=2x+6</text><text x="1098" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Prova geral: distributiva</text><text x="25" y="934" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#3d5673">Reconstrução Escolar 2027 • MAT-ALG-003 • infográfico autoral</text></svg>