<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">EQUIVALÊNCIA E CONTRAEXEMPLO</title><desc id="desc">Comparar valores ajuda; a propriedade prova a identidade. Três expressões. Compare 2(x+3), 2x+6. e a expressão 2x+3.. E₁, E₂ e E₃. Observe os parênteses. Substitua na tabela. Escolhemos x igual a 0, 1 e 2.. Calcule as três expressões.. x = 0, 1, 2. As colunas revelam o contraste. A primeira dupla. As duas primeiras dão. 6, 8 e 10, na mesma ordem.. 2(x+3) = 2x+6. Explicação: distributiva. A terceira difere. A expressão 2x+3 produz. 3, 5 e 7 nos três casos.. 2x+3. A diferença é de 3. Um contraexemplo basta. Em x=0, 2(x+3)=6.. Mas 2x+3 vale apenas 3.. 6 ≠ 3. Já sabemos que não equivalem. Não confunda teste e prova. Alguns valores iguais não provam. igualdade para todo x.. 2(x+3)=2x+6. Prova geral: distributiva</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">EQUIVALÊNCIA E CONTRAEXEMPLO</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Comparar valores ajuda; a propriedade prova a identidade</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="97" y="182" text-a