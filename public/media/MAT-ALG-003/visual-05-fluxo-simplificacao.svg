<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">COMO SIMPLIFICAR SEM MACETES</title><desc id="desc">A sequência registra uma justificativa para cada mudança. 1. Leia a estrutura. Identifique termos e sinais.. Confira os parênteses.. 2(x+3) + x − 1. Não remova símbolos ao acaso. 2. Distribua. O fator 2 multiplica x e 3.. Assim obtemos 2x+6.. 2x+6+x−1. Justifique pela distributiva. 3. Reorganize. Coloque os termos em x juntos.. Depois as constantes.. 2x+x+6−1. Use associação e comutação. 4. Reúna. Dois x mais um x são três x.. Seis menos um vale cinco.. 3x + 5. Parte literal permanece. 5. Verifique. Para x=2, a expressão original. e a final devem valer 11.. 11 = 11. Teste ajuda a detectar falhas. 6. Conclusão. A nova escrita tem o mesmo valor. para todos os x permitidos.. 2(x+3)+x−1 = 3x+5. Propriedades justificam a troca</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">COMO SIMPLIFICAR SEM MACETES</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">A sequência registra uma justificativa para cada mudança</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="97" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1. Leia a estrutura</text><text x="46" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Identifique termos e sinais.</text><text x="46" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Confira os parênteses.</text><rect x="42" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="274" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2(x+3) + x − 1</text><text x="46" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Não remova símbolos ao acaso</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="623" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2. Distribua</text><text x="572" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">O fator 2 multiplica x e 3.</text><text x="572" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Assim obtemos 2x+6.</text><rect x="568" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="800" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x+6+x−1</text><text x="572" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e54">Justifique pela distributiva</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1149" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3. Reorganize</text><text x="1098" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Coloque os termos em x juntos.</text><text x="1098" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Depois as constantes.</text><rect x="1094" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="1326" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2x+x+6−1</text><text x="1098" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">Use associação e comutação</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="97" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4. Reúna</text><text x="46" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Dois x mais um x são três x.</text><text x="46" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Seis menos um vale cinco.</text><rect x="42" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="274" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">3x + 5</text><text x="46" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Parte literal permanece</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="623" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5. Verifique</text><text x="572" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Para x=2, a expressão original</text><text x="572" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">e a final devem valer 11.</text><rect x="568" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="800" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">11 = 11</text><text x="572" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">Teste ajuda a detectar falhas</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1149" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6. Conclusão</text><text x="1098" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">A nova escrita tem o mesmo valor</text><text x="1098" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">para todos os x permitidos.</text><rect x="1094" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="1326" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">2(x+3)+x−1 = 3x+5</text><text x="1098" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#078b91">Propriedades justificam a troca</text><text x="25" y="934" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#3d5673">Reconstrução Escolar 2027 • MAT-ALG-003 • infográfico autoral</text></svg>