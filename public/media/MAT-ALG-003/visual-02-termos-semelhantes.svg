<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 955"><title id="title">REUNIR TERMOS SEMELHANTES</title><desc id="desc">Somam-se coeficientes; a parte literal permanece. Identifique os termos. Separe quatro x, dois x. e o termo constante menos três.. 4x + 2x − 3. Cada termo tem um papel. A mesma parte literal. 4x e 2x representam grupos de x.. Podem ser reunidos em seis x.. 4x + 2x = 6x. Somam-se 4 e 2. Não misture tipos. Menos três não tem parte literal x.. Por isso fica separado.. 6x − 3. A constante continua. Resultado. A expressão foi simplificada.. Os valores continuam idênticos.. 4x+2x−3 = 6x−3. Para qualquer valor de x. Teste para x igual a 2. Antes: oito mais quatro menos três.. Depois: doze menos três.. 9 = 9. É uma conferência. Erro frequente. Somar 4x com 2 não gera 6x.. Coeficiente e constante são. parcelas de tipos diferentes.. 4x + 2 ≠ 6x</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#062c65"/><stop offset="1" stop-color="#0b62ae"/></linearGradient></defs><rect width="1600" height="955" fill="#fff"/><rect x="12" y="10" width="1576" height="113" rx="18" fill="url(#header)"/><text x="800" y="66" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#fff">REUNIR TERMOS SEMELHANTES</text><text x="800" y="101" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#e2efff">Somam-se coeficientes; a parte literal permanece</text><rect x="20" y="140" width="508" height="365" rx="16" fill="#ebf5ff" stroke="#075bbb" stroke-width="2"/><rect x="20" y="140" width="508" height="64" rx="16" fill="#075bbb"/><rect x="20" y="186" width="508" height="18" fill="#075bbb"/><circle cx="55" cy="172" r="23" fill="#fff" opacity=".25"/><text x="55" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">1</text><text x="97" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Identifique os termos</text><text x="46" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Separe quatro x, dois x</text><text x="46" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">e o termo constante menos três.</text><rect x="42" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="274" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">4x + 2x − 3</text><text x="46" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#075bbb">Cada termo tem um papel</text><rect x="546" y="140" width="508" height="365" rx="16" fill="#e9f9f0" stroke="#087e54" stroke-width="2"/><rect x="546" y="140" width="508" height="64" rx="16" fill="#087e54"/><rect x="546" y="186" width="508" height="18" fill="#087e54"/><circle cx="581" cy="172" r="23" fill="#fff" opacity=".25"/><text x="581" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">2</text><text x="623" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">A mesma parte literal</text><rect x="614" y="286" width="52" height="58" rx="10" fill="#c8e6ff" stroke="#075bbb" stroke-width="2"/><text x="640" y="325" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#153850">x</text><rect x="675" y="286" width="52" height="58" rx="10" fill="#c8e6ff" stroke="#075bbb" stroke-width="2"/><text x="701" y="325" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#153850">x</text><rect x="736" y="286" width="52" height="58" rx="10" fill="#c8e6ff" stroke="#075bbb" stroke-width="2"/><text x="762" y="325" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#153850">x</text><rect x="797" y="286" width="52" height="58" rx="10" fill="#c8e6ff" stroke="#075bbb" stroke-width="2"/><text x="823" y="325" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#153850">x</text><rect x="858" y="286" width="52" height="58" rx="10" fill="#bce7d0" stroke="#087e54" stroke-width="2"/><text x="884" y="325" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#153850">x</text><rect x="919" y="286" width="52" height="58" rx="10" fill="#bce7d0" stroke="#087e54" stroke-width="2"/><text x="945" y="325" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#153850">x</text><text x="800" y="374" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="600" fill="#203e5a">4 grupos x  +  2 grupos x</text><text x="800" y="422" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#203e5a">6 grupos x  =  6x</text><rect x="1072" y="140" width="508" height="365" rx="16" fill="#fff2e6" stroke="#c35b0b" stroke-width="2"/><rect x="1072" y="140" width="508" height="64" rx="16" fill="#c35b0b"/><rect x="1072" y="186" width="508" height="18" fill="#c35b0b"/><circle cx="1107" cy="172" r="23" fill="#fff" opacity=".25"/><text x="1107" y="181" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">3</text><text x="1149" y="182" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Não misture tipos</text><text x="1098" y="269" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Menos três não tem parte literal x.</text><text x="1098" y="311" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Por isso fica separado.</text><rect x="1094" y="362" width="464" height="72" rx="11" fill="#fff"/><text x="1326" y="408" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">6x − 3</text><text x="1098" y="478" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#c35b0b">A constante continua</text><rect x="20" y="520" width="508" height="365" rx="16" fill="#f3efff" stroke="#6b43b5" stroke-width="2"/><rect x="20" y="520" width="508" height="64" rx="16" fill="#6b43b5"/><rect x="20" y="566" width="508" height="18" fill="#6b43b5"/><circle cx="55" cy="552" r="23" fill="#fff" opacity=".25"/><text x="55" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">4</text><text x="97" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Resultado</text><text x="46" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">A expressão foi simplificada.</text><text x="46" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Os valores continuam idênticos.</text><rect x="42" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="274" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">4x+2x−3 = 6x−3</text><text x="46" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#6b43b5">Para qualquer valor de x</text><rect x="546" y="520" width="508" height="365" rx="16" fill="#fff0f2" stroke="#bc354d" stroke-width="2"/><rect x="546" y="520" width="508" height="64" rx="16" fill="#bc354d"/><rect x="546" y="566" width="508" height="18" fill="#bc354d"/><circle cx="581" cy="552" r="23" fill="#fff" opacity=".25"/><text x="581" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">5</text><text x="623" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Teste para x igual a 2</text><text x="572" y="649" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Antes: oito mais quatro menos três.</text><text x="572" y="691" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#1d334b">Depois: doze menos três.</text><rect x="568" y="742" width="464" height="72" rx="11" fill="#fff"/><text x="800" y="788" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#20364e">9 = 9</text><text x="572" y="858" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#bc354d">É uma conferência</text><rect x="1072" y="520" width="508" height="365" rx="16" fill="#e9f9fa" stroke="#078b91" stroke-width="2"/><rect x="1072" y="520" width="508" height="64" rx="16" fill="#078b91"/><rect x="1072" y="566" width="508" height="18" fill="#078b91"/><circle cx="1107" cy="552" r="23" fill="#fff" opacity=".25"/><text x="1107" y="561" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">6</text><text x="1149" y="562" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Erro frequente</text><text x="25" y="934" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#3d5673">Reconstrução Escolar 2027 • MAT-ALG-003 • infográfico autoral</text></svg>