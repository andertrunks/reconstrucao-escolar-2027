<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="t d"><title id="t">Matriz de decisão de um teste</title><desc id="d">Tabela de duas decisões e dois estados de H0, distinguindo erro tipo I, erro tipo II e poder.</desc><rect width="1100" height="590" rx="22" fill="#f7fafc"/><rect x="22" y="20" width="1056" height="548" rx="16" fill="white" stroke="#475569" stroke-width="2"/><text x="48" y="64" font-size="27" font-family="Arial, sans-serif" fill="#172554" font-weight="bold">Matriz de decisão de um teste</text><text x="370" y="134" font-size="20" fill="#172554">H0 verdadeira</text><text x="715" y="134" font-size="20" fill="#172554">H0 falsa</text><text x="60" y="234" font-size="20" fill="#172554">Rejeitar H0</text><text x="60" y="370" font-size="20" fill="#172554">Não rejeitar H0</text><rect x="304" y="155" width="295" height="112" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="2"/><text x="451.5" y="203.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Erro tipo I</text><text x="451.5" y="230.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">probabilidade α</text><rect x="649" y="155" width="295" height="112" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="796.5" y="203.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Decisão correta</text><text x="796.5" y="230.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">poder 1 − β</text><rect x="304" y="287" width="295" height="112" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="451.5" y="335.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Decisão correta</text><text x="451.5" y="362.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">sem rejeição</text><rect x="649" y="287" width="295" height="112" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="796.5" y="335.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Erro tipo II</text><text x="796.5" y="362.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">probabilidade β</text><text x="48" y="535" font-family="Arial, sans-serif" font-size="15" fill="#334155">Material autoral • MAT-EST-036 • Leia também a explicação textual da aula</text></svg>