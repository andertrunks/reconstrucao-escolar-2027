y2="205" stroke="#1d4ed8" stroke-width="3"/><path d="M738,198 L749,205 L738,212" fill="none" stroke="#1d4ed8" stroke-width="3"/><rect x="751" y="145" width="290" height="120" rx="12" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><text x="896.0" y="197.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Comparação</text><text x="896.0" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">e parecer</text><text x="69" y="338" font-size="19" fill="#334155">Hash confirma identidade de bytes, não validade científica nem representatividade.</text><text x="69" y="379" font-size="19" fill="#334155">O teste final não deve ser reutilizado para escolher o modelo.</text><text x="48" y="535" font-family="Arial, sans-serif" font-size="15" fill="#334155">Material autoral • MAT-EST-036 • Leia também a explicação textual da aula</text></svg>