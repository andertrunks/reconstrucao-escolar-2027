<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="t d"><title id="t">Da pergunta à conclusão verificável</title><desc id="d">Fluxo com quatro etapas: perguntar, calcular, checar condições e comunicar limites.</desc><rect width="1100" height="590" rx="22" fill="#f7fafc"/><rect x="22" y="20" width="1056" height="548" rx="16" fill="white" stroke="#475569" stroke-width="2"/><text x="48" y="64" font-size="27" font-family="Arial, sans-serif" fill="#172554" font-weight="bold">Da pergunta à conclusão verificável</text><rect x="50" y="135" width="220" height="90" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/><text x="160.0" y="172.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Pergunta</text><text x="160.0" y="199.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">e unidade</text><line x1="270" y1="180" x2="300" y2="180" stroke="#1d4ed8" stroke-width="3"/><path d="M289,173 L300,180 L289,187" fill="none" stroke="#1d4ed8" stroke-width="3"/><rect x="302" y="135" width="220" height="90" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="412.0" y="172.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Estimativa</text><text x="412.0" y="199.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">ou teste</text><line x1="522" y1="180" x2="552" y2="180" stroke="#1d4ed8" stroke-width="3"/><path d="M541,173 L552,180 L541,187" fill="none" stroke="#1d4ed8" stroke-width="3"/><rect x="554" y="135" width="220" height="90" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="664.0" y="172.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Condições</text><text x="664.0" y="199.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">e incerteza</text><line x1="774" y1="180" x2="804" y2="180" stroke="#1d4ed8" stroke-width="3"/><path d="M793,173 L804,180 L793,187" fill="none" stroke="#1d4ed8" stroke-width="3"/><rect x="806" y="135" width="220" height="90" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="2"/><text x="916.0" y="172.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Conclusão</text><text x="916.0" y="199.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">limitada</text><rect x="215" y="320" width="270" height="96" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/><text x="350.0" y="360.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Interpretação</text><text x="350.0" y="387.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">adequada</text><rect x="615" y="320" width="270" height="96" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="2"/><text x="750.0" y="360.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Generalização</text><text x="750.0" y="387.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">não demonstrada</text><text x="48" y="535" font-family="Arial, sans-serif" font-size="15" fill="#334155">Material autoral • MAT-EST-036 • Leia também a explicação textual da aula</text></svg>