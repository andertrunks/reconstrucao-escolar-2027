<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="t d"><title id="t">População, amostra e inferência</title><desc id="d">O resultado amostral depende do plano de seleção; estimar não equivale a conhecer o parâmetro.</desc><rect width="1100" height="590" rx="22" fill="#f7fafc"/><rect x="22" y="20" width="1056" height="548" rx="16" fill="white" stroke="#475569" stroke-width="2"/><text x="48" y="64" font-size="27" font-family="Arial, sans-serif" fill="#172554" font-weight="bold">População, amostra e inferência</text><rect x="56" y="150" width="300" height="205" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="206.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">População</text><text x="206.0" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">parâmetro desconhecido</text><rect x="450" y="150" width="240" height="205" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="570.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Amostra</text><text x="570.0" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">estatística calculada</text><rect x="780" y="150" width="260" height="205" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="910.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Inferência</text><text x="910.0" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">hipóteses e incerteza</text><line x1="356" y1="252" x2="450" y2="252" stroke="#1d4ed8" stroke-width="3"/><path d="M439,245 L450,252 L439,259" fill="none" stroke="#1d4ed8" stroke-width="3"/><line x1="690" y1="252" x2="780" y2="252" stroke="#1d4ed8" stroke-width="3"/><path d="M769,245 L780,252 L769,259" fill="none" stroke="#1d4ed8" stroke-width="3"/><text x="92" y="425" font-size="20" fill="#334155">Aumentar n reduz erro aleatório sob hipóteses; não elimina viés de seleção.</text><text x="48" y="535" font-family="Arial, sans-serif" font-size="15" fill="#334155">Material autoral • MAT-EST-036 • Leia também a explicação textual da aula</text></svg>