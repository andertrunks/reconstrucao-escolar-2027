<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" role="img"><title>Checklist de coesão</title><desc>Cinco perguntas ajudam a revisar a coesão de um parágrafo.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font: 22px system-ui,sans-serif;fill:currentColor} .small{font-size:18px} rect{fill:none;stroke:currentColor;stroke-width:2} line{stroke:currentColor;stroke-width:2}</style><text x="45" y="58">✓ O referente está claro?</text><text x="45" y="108">✓ A retomada é compreensível?</text><text x="45" y="158">✓ O conector combina com a relação?</text><text x="45" y="208">✓ O tema avança sem salto?</text><text x="45" y="258">✓ A repetição tem função?</text><rect x="28" y="25" width="680" height="265" rx="16" fill="none" stroke-width="2"/><text x="370" y="330" text-anchor="middle" class="small">clareza antes de variedade mecânica</text></svg>