<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" role="img"><title>Ambiguidade referencial</title><desc>O pronome ela pode apontar para Marina ou Paula.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font: 22px system-ui,sans-serif;fill:currentColor} .small{font-size:18px} rect{fill:none;stroke:currentColor;stroke-width:2} line{stroke:currentColor;stroke-width:2}</style><text x="370" y="45" text-anchor="middle">Marina falou com Paula quando ela saiu.</text><rect x="80" y="85" width="170" height="65" rx="12"/><text x="165" y="125" text-anchor="middle">Marina</text><rect x="490" y="85" width="170" height="65" rx="12"/><text x="575" y="125" text-anchor="middle">Paula</text><rect x="290" y="205" width="160" height="65" rx="12"/><text x="370" y="245" text-anchor="middle">ela</text><line x1="335" y1="205" x2="190" y2="150" marker-end="url(#a)"/><line x1="405" y1="205" x2="550" y2="150" marker-end="url(#a)"/><text x="370" y="310" text-anchor="middle" class="small">duas leituras plausíveis → reescrever</text></svg>