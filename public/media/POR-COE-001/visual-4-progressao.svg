<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" role="img"><title>Progressão temática</title><desc>Informação conhecida é retomada e recebe informação nova.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font: 22px system-ui,sans-serif;fill:currentColor} .small{font-size:18px} rect{fill:none;stroke:currentColor;stroke-width:2} line{stroke:currentColor;stroke-width:2}</style><rect x="28" y="110" width="155" height="70" rx="12"/><text x="105" y="140" text-anchor="middle">informação</text><text x="105" y="162" text-anchor="middle">conhecida</text><line x1="183" y1="145" x2="235" y2="145" marker-end="url(#a)"/><rect x="235" y="110" width="125" height="70" rx="12"/><text x="298" y="151" text-anchor="middle">retomada</text><line x1="360" y1="145" x2="412" y2="145" marker-end="url(#a)"/><rect x="412" y="110" width="145" height="70" rx="12"/><text x="485" y="140" text-anchor="middle">informação</text><text x="485" y="162" text-anchor="middle">nova</text><line x1="557" y1="145" x2="609" y2="145" marker-end="url(#a)"/><rect x="609" y="110" width="120" height="70" rx="12"/><text x="669" y="140" text-anchor="middle">nova</text><text x="669" y="162" text-anchor="middle">retomada</text><text x="370" y="235" text-anchor="middle" class="small">continuidade + novidade = progressão</text></svg>