<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" role="img"><title>Relações entre ideias</title><desc>Duas ideias podem ser conectadas por relações diferentes.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font: 22px system-ui,sans-serif;fill:currentColor} .small{font-size:18px} rect{fill:none;stroke:currentColor;stroke-width:2} line{stroke:currentColor;stroke-width:2}</style><rect x="55" y="120" width="190" height="78" rx="12"/><text x="150" y="166" text-anchor="middle">IDEIA A</text><rect x="495" y="120" width="190" height="78" rx="12"/><text x="590" y="166" text-anchor="middle">IDEIA B</text><line x1="245" y1="159" x2="495" y2="159" marker-end="url(#a)"/><text x="370" y="82" text-anchor="middle" class="small">adição • contraste • exemplo • tempo</text><text x="370" y="235" text-anchor="middle" class="small">causa → consequência</text><text x="370" y="292" text-anchor="middle" class="small">o conector explicita a relação escolhida</text></svg>