<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" role="img"><title>Cadeia de retomadas</title><desc>Três expressões apontam para o mesmo referente.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><style>text{font: 22px system-ui,sans-serif;fill:currentColor} .small{font-size:18px} rect{fill:none;stroke:currentColor;stroke-width:2} line{stroke:currentColor;stroke-width:2}</style><rect x="35" y="75" width="180" height="72" rx="12"/><text x="125" y="118" text-anchor="middle">a praça do bairro</text><line x1="215" y1="111" x2="300" y2="111" marker-end="url(#a)"/><rect x="300" y="75" width="150" height="72" rx="12"/><text x="375" y="118" text-anchor="middle">o local</text><line x1="450" y1="111" x2="535" y2="111" marker-end="url(#a)"/><rect x="535" y="75" width="170" height="72" rx="12"/><text x="620" y="118" text-anchor="middle">esse espaço</text><text x="370" y="190" text-anchor="middle" class="small">mesmo referente • formas diferentes</text></svg>