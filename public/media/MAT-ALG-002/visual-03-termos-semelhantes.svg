<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Termos semelhantes e não semelhantes</title><desc id="d">O diagrama compara três x e dois x, que têm a mesma parte literal e podem ser reunidos, com três x e dois, que têm naturezas diferentes e não podem ser reunidos como cinco x.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="75" text-anchor="middle" font-family="Arial" font-size="29">Só reunimos termos com a mesma parte literal</text><rect x="85" y="130" width="330" height="240" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><rect x="485" y="130" width="330" height="240" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><g font-family="Arial" text-anchor="middle"><text x="250" y="185" font-size="25">3x + 2x</text><text x="250" y="245" font-size="28">mesma parte literal: x</text><text x="250" y="310" font-size="34">= 5x</text><text x="650" y="185" font-size="25">3x + 2</text><text x="650" y="245" font-size="25">x e termo constante</text><text x="650" y="310" font-size="28">não vira 5x</text></g><text x="450" y="430" text-anchor="middle" font-family="Arial" font-size="20">Coeficientes podem ser somados quando a parte literal é idêntica.</text></svg>