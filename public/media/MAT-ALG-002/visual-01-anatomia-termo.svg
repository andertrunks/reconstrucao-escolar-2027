<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Anatomia de um termo algébrico</title><desc id="d">O termo cinco x ao quadrado é decomposto em coeficiente cinco, parte literal x ao quadrado, variável x e expoente dois.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="82" text-anchor="middle" font-family="Arial" font-size="30">Anatomia do termo 5x²</text><text x="450" y="210" text-anchor="middle" font-family="Arial" font-size="72">5x²</text><line x1="365" y1="235" x2="245" y2="330" stroke="currentColor" stroke-width="3"/><line x1="470" y1="235" x2="475" y2="330" stroke="currentColor" stroke-width="3"/><line x1="520" y1="180" x2="685" y2="330" stroke="currentColor" stroke-width="3"/><g font-family="Arial" font-size="23" text-anchor="middle"><text x="235" y="370">coeficiente: 5</text><text x="475" y="370">parte literal: x²</text><text x="690" y="370">expoente: 2</text></g><text x="450" y="440" text-anchor="middle" font-family="Arial" font-size="20">Leia: “cinco vezes x ao quadrado”.</text></svg>