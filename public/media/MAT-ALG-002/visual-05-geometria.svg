<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Expressão algébrica em um retângulo</title><desc id="d">Um retângulo de base b e altura h é acompanhado da expressão do perímetro dois b mais dois h. Um exemplo usa b igual a cinco e h igual a três e obtém dezesseis.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="75" text-anchor="middle" font-family="Arial" font-size="29">A expressão guarda uma regra geométrica</text><rect x="115" y="150" width="300" height="180" fill="none" stroke="currentColor" stroke-width="4"/><text x="265" y="365" text-anchor="middle" font-family="Arial" font-size="24">base = b</text><text x="85" y="245" text-anchor="middle" font-family="Arial" font-size="24" transform="rotate(-90 85 245)">altura = h</text><g font-family="Arial" text-anchor="middle"><text x="650" y="170" font-size="28">P = 2b + 2h</text><text x="650" y="235" font-size="23">se b = 5 e h = 3:</text><text x="650" y="285" font-size="25">P = 2·5 + 2·3</text><text x="650" y="335" font-size="30">P = 16</text></g><text x="450" y="430" text-anchor="middle" font-family="Arial" font-size="20">Uma fórmula é uma expressão que organiza uma relação entre medidas.</text></svg>