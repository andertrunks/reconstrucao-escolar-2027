<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Termos de uma expressão algébrica</title><desc id="d">A expressão quatro x mais três y menos sete é separada em três termos: quatro x, três y e menos sete.</desc><rect x="30" y="30" width="840" height="440" rx="24" fill="white" stroke="currentColor" stroke-width="3"/><text x="450" y="80" text-anchor="middle" font-family="Arial" font-size="30">Uma expressão pode ser vista termo por termo</text><text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="60">4x + 3y − 7</text><rect x="120" y="245" width="190" height="105" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><rect x="355" y="245" width="190" height="105" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><rect x="590" y="245" width="190" height="105" rx="16" fill="none" stroke="currentColor" stroke-width="3"/><g font-family="Arial" font-size="25" text-anchor="middle"><text x="215" y="290">1º termo</text><text x="215" y="325">4x</text><text x="450" y="290">2º termo</text><text x="450" y="325">3y</text><text x="685" y="290">3º termo</text><text x="685" y="325">−7</text></g><text x="450" y="420" text-anchor="middle" font-family="Arial" font-size="20">O sinal pertence ao termo que vem depois dele.</text></svg>