<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Seis tarefas de previsão comparáveis</title><desc id="desc">Tabela visual com origem e alvo, observado e valores previstos por três métodos, em unidades da série sintética.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.5}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.5}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.4}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}.green{stroke:#39775d;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Seis tarefas de previsão comparáveis</text><text x="30" y="78" class="small" text-anchor="start">Previsões (unidades): HW aditivo, sazonal ingênuo e deslocamento sazonal.</text><text x="36" y="116" class="label" text-anchor="start">Origem → alvo</text><text x="255" y="116" class="label" text-anchor="start">Observado</text><text x="425" y="116" class="label" text-anchor="start">HW</text><text x="593" y="116" class="label" text-anchor="start">Ingênuo</text><text x="757" y="116" class="label" text-anchor="start">Deslocamento</text><rect x="25" y="138" width="910" height="41" rx="9" class="panel"/><text x="36" y="164" class="small" text-anchor="start">t8 → t9 (h1)</text><text x="255" y="164" class="small" text-anchor="start">129</text><text x="425" y="164" class="small" text-anchor="start">130,99</text><text x="593" y="164" class="small" text-anchor="start">111,00</text><text x="757" y="164" class="small" text-anchor="start">131,50</text><rect x="25" y="185" width="910" height="41" rx="9" c