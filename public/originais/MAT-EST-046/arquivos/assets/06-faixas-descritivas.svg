<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Faixas ilustrativas e observações posteriores</title><desc id="desc">Seis cartões com origem, horizonte, centro, limites, valor observado e classificação dentro ou fora; larguras 4 e 6 unidades.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.5}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.5}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.4}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}.green{stroke:#39775d;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Faixas ilustrativas e observações posteriores</text><text x="31" y="81" class="small" text-anchor="start">Faixas didáticas predefinidas: h1 = previsão ±2; h2 = previsão ±3 unidades.</text><rect x="28" y="115" width="288" height="125" rx="9" class="panel"/><text x="42" y="141" class="label" text-anchor="start">Origem t8 / h1 → t9</text><text x="42" y="167" class="small" text-anchor="start">Centro: 130,99 un.</text><text x="42" y="191" class="small" text-anchor="start">Faixa: 128,99 a 132,99</text><text x="42" y="216" class="label" text-anchor="start">Real: 129 — DENTRO</text><rect x="335" y="115" width="288" height="125" rx="9" class="panel"/><text x="349" y="141" class="label" text-anchor="start">Origem t8 / h2 → t10</text><text x="349" y="167" class="small" text-anchor="start">Centro: 147,26 un.</text><text x="349" y="191" class="small" text-anchor="start">Faixa: 144,26 a 150,26</text><text x="349" y="216" class="label" text-anchor="start">Real: 145 — DENTRO</text><rect x="642" y="115" width="288" height="125" rx="9" class="panel"/><text x="656" y="141" class="label" text-anchor="start">Origem t9 / h1 → t10</text><text x="656" y="167" class="small" text-anchor="start">Centro: 146,54 un.</text><text x="656" y="191" class="small" text-anchor="start">Faixa: 144,54 a 148,54</text><text x="656" y="216" class="label" text-anchor="start">Real: 145 — DENTRO</text><rect x="28" y="258" width="288" height="125" rx="9" class="panel"/><text x="42" y="284" class="label" text-anchor="start">Origem t9 / h2 → t11</text><text x="42" y="310" class="small" text-anchor="start">Centro: 168,80 un.</text><text x="42" y="334" class="small" text-anchor="start">Faixa: 165,80 a 171,80</text><text x="42" y="359" class="label" text-anchor="start">Real: 171 — DENTRO</text><rect x="335" y="258" width="288" height="125" rx="9" class="warm"/><text x="349" y="284" class="label" text-anchor="start">Origem t10 / h1 → t11</text><text x="349" y="310" class="small" text-anchor="start">Centro: 168,24 un.</text><text x="349" y="334" class="small" text-anchor="start">Faixa: 166,24 a 170,24</text><text x="349" y="359" class="label" text-anchor="start">Real: 171 — FORA</text><rect x="642" y="258" width="288" height="125" rx="9" class="panel"/><text x="656" y="284" class="label" text-anchor="start">Origem t10 / h2 → t12</text><text x="656" y="310" class="small" text-anchor="start">Centro: 145,00 un.</text><text x="656" y="334" class="small" text-anchor="start">Faixa: 142,00 a 148,00</text><text x="656" y="359" class="label" text-anchor="start">Real: 144 — DENTRO</text><text x="30" y="437" class="small" text-anchor="start">Coberturas observadas: h1 = 2/3; h2 = 3/3. Nenhuma cobertura nominal foi estimada.</text></svg>