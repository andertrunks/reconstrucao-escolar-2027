<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560"><title>Desvio-padrão absoluto versus coeficiente de variação</title><desc>Conjunto A tem média 10 e desvio-padrão 2, CV 20 por cento. Conjunto B tem média 1000 e desvio-padrão 20, CV 2 por cento.</desc><rect width="1000" height="560" fill="white"/><text x="215" y="50" font-size="28">DP absoluto versus variabilidade relativa</text><text x="120" y="150" font-size="22">A: média 10; DP 2; CV 20%</text><text x="120" y="220" font-size="22">B: média 1000; DP 20; CV 2%</text><text x="120" y="330" font-size="22">B tem maior DP absoluto.</text><text x="120" y="390" font-size="22">A tem maior variabilidade relativa.</text></svg>