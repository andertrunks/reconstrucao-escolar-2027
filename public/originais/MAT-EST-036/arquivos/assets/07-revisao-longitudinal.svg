<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="t d"><title id="t">Revisão longitudinal iniciada pelo estudo real</title><desc id="d">Linha do tempo de D0 a D+30; publicação de aula não inicia a revisão individual.</desc><rect width="1100" height="590" rx="22" fill="#f7fafc"/><rect x="22" y="20" width="1056" height="548" rx="16" fill="white" stroke="#475569" stroke-width="2"/><text x="48" y="64" font-size="27" font-family="Arial, sans-serif" fill="#172554" font-weight="bold">Revisão longitudinal iniciada pelo estudo real</text><rect x="50" y="180" width="215" height="120" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="157.5" y="232.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Estudo real</text><text x="157.5" y="259.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">D0</text><rect x="295" y="180" width="215" height="120" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="402.5" y="232.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Recuperação</text><text x="402.5" y="259.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">D+1</text><rect x="540" y="180" width="215" height="120" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="647.5" y="232.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Transferência</text><text x="647.5" y="259.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">D+7</text><rect x="785" y="180" width="215" height="120" rx="12" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><text x="892.5" y="232.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">Reteste</text><text x="892.5" y="259.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172554">D+30</text><line x1="265" y1="240" x2="287" y2="240" stroke="#1d4ed8" stroke-width="3"/><path d="M276,233 L287,240 L276,247" fill="none" stroke="#1d4ed8" stroke-width="3"/><line x1="510" y1="240" x2="532" y2="240" stroke="#1d4ed8" stroke-width="3"/><path d="M521,233 L532,240 L521,247" fill="none" stroke="#1d4ed8" stroke-width="3"/><line x1="755" y1="240" x2="777" y2="240" stroke="#1d4ed8" stroke-width="3"/><path d="M766,233 L777,240 L766,247" fill="none" stroke="#1d4ed8" stroke-width="3"/><text x="72" y="380" font-size="19" fill="#334155">Os prazos começam depois de uma sessão efetiva, nunca da data de produção da aula.</text><text x="72" y="420" font-size="19" fill="#334155">Se houver erro, recupere o pré-requisito e agende novo reteste independente.</text><text x="48" y="535" font-family="Arial, sans-serif" font-size="15" fill="#334155">Material autoral • MAT-EST-036 • Leia também a explicação textual da aula</text></svg>