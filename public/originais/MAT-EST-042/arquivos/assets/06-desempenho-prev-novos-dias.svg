<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">MAE nos dias 5 a 8: três referências</title><desc id="desc">Gráfico de barras horizontais de último valor 20, média móvel três 15,83 e constante 100 12,50; unidade atendimentos.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153047}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px}.lab{font-size:17px;font-weight:600}.small{font-size:14px}.axis{stroke:#374e63;stroke-width:2;fill:none}.curve{stroke:#176781;stroke-width:3;fill:none}.amber{stroke:#91620a;stroke-width:3;fill:none}.box{fill:#edf7fa;stroke:#176781;stroke-width:2}.warm{fill:#fff2d9;stroke:#9d6110;stroke-width:2}.alert{fill:#fbe5e5;stroke:#af3232;stroke-width:2}.dot{fill:#176781}.day{fill:#c7e5ee;stroke:#176781;stroke-width:2}.bar{fill:#b3dce6;stroke:#176781;stroke-width:1.5}</style><rect width="960" height="480" fill="white"/><text x="26" y="42" class="title">MAE nos dias 5 a 8: três referências</text><path d="M 235 394 L 870 394 M 235 394 L 235 101" class="axis"/><text x="545" y="454" class="lab" text-anchor="middle">Erro absoluto médio (atendimentos)</text><text x="207" y="158" class="lab" text-anchor="end">Último valor</text><rect class="bar" x="244" y="135" height="49" width="500.0"/><text x="757" y="165" class="lab">20.00</text><text x="207" y="249" class="lab" text-anchor="end">Média móvel 3</text><rect class="bar" x="244" y="226" height="49" width="395.8"/><text x="652.8333333333334" y="256" class="lab">15.83</text><text x="207" y="340" class="lab" text-anchor="end">Constante 100</text><rect class="bar" x="244" y="317" height="49" width="312.5"/><text x="569.5" y="347" class="lab">12.50</text><text x="252" y="407" class="small">0</text><text x="747" y="407" class="small">20</text></svg>