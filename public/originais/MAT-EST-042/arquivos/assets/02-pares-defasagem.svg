<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Pares para a autocorrelação de atraso um</title><desc id="desc">Sete pares temporais x(t−1) e x(t) disponíveis na base com oito dias.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153047}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px}.lab{font-size:17px;font-weight:600}.small{font-size:14px}.axis{stroke:#374e63;stroke-width:2;fill:none}.curve{stroke:#176781;stroke-width:3;fill:none}.amber{stroke:#91620a;stroke-width:3;fill:none}.box{fill:#edf7fa;stroke:#176781;stroke-width:2}.warm{fill:#fff2d9;stroke:#9d6110;stroke-width:2}.alert{fill:#fbe5e5;stroke:#af3232;stroke-width:2}.dot{fill:#176781}.day{fill:#c7e5ee;stroke:#176781;stroke-width:2}.bar{fill:#b3dce6;stroke:#176781;stroke-width:1.5}</style><rect width="960" height="480" fill="white"/><text x="26" y="42" class="title">Pares para a autocorrelação de atraso um</text><rect x="45" y="92" width="355" height="56" rx="10" class="box"/><text x="59" y="122" class="lab">Dia t−1</text><rect x="540" y="92" width="355" height="56" rx="10" class="warm"/><text x="554" y="122" class="lab">Dia t</text><text x="110" y="191" class="small">dia 1: 80</text><text x="595" y="191" class="small">dia 2: 100</text><path d="M 309 186 L 530 186" class="axis"/><text x="110" y="225" class="small">dia 2: 100</text><text x="595" y="225" class="small">dia 3: 120</text><path d="M 309 220 L 530 220" class="axis"/><text x="110" y="259" class="small">dia 3: 120</text><text x="595" y="259" class="small">dia 4: 100</text><path d="M 309 254 L 530 254" class="axis"/><text x="110" y="293" class="small">dia 4: 100</text><text x="595" y="293" class="small">dia 5: 90</text><path d="M 309 288 L 530 288" class="axis"/><text x="110" y="327" class="small">dia 5: 90</text><text x="595" y="327" class="small">dia 6: 110</text><path d="M 309 322 L 530 322" class="axis"/><text x="110" y="361" class="small">dia 6: 110</text><text x="595" y="361" class="small">dia 7: 130</text><path d="M 309 356 L 530 356" class="axis"/><text x="110" y="395" class="small">dia 7: 130</text><text x="595" y="395" class="small">dia 8: 100</text><path d="M 309 390 L 530 390" class="axis"/><text x="48" y="451" class="subtitle">Sete pares disponíveis: a primeira linha não possui um dia anterior nesta base.</text></svg>