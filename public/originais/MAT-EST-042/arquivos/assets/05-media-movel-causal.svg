<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Média móvel causal de três observações</title><desc id="desc">Previsão do quinto dia é formada pelos observados dias 2,3,4, respectivamente 100,120,100, produzindo 106,67.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153047}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px}.lab{font-size:17px;font-weight:600}.small{font-size:14px}.axis{stroke:#374e63;stroke-width:2;fill:none}.curve{stroke:#176781;stroke-width:3;fill:none}.amber{stroke:#91620a;stroke-width:3;fill:none}.box{fill:#edf7fa;stroke:#176781;stroke-width:2}.warm{fill:#fff2d9;stroke:#9d6110;stroke-width:2}.alert{fill:#fbe5e5;stroke:#af3232;stroke-width:2}.dot{fill:#176781}.day{fill:#c7e5ee;stroke:#176781;stroke-width:2}.bar{fill:#b3dce6;stroke:#176781;stroke-width:1.5}</style><rect width="960" height="480" fill="white"/><text x="26" y="42" class="title">Média móvel causal de três observações</text><text x="36" y="88" class="lab">Previsão para o dia 5: somente observações anteriores</text><rect x="45" y="124" width="240" height="76" rx="10" class="box"/><text x="59" y="154" class="lab">dia 2: 100</text><rect x="335" y="124" width="240" height="76" rx="10" class="box"/><text x="349" y="154" class="lab">dia 3: 120</text><rect x="625" y="124" width="240" height="76" rx="10" class="box"/><text x="639" y="154" class="lab">dia 4: 100</text><rect x="120" y="266" width="340" height="72" rx="10" class="box"/><text x="134" y="296" class="lab">(100+120+100)/3</text><rect x="534" y="266" width="303" height="72" rx="10" class="warm"/><text x="548" y="296" class="lab">previsão = 106,67</text><text x="45" y="411" class="subtitle">Valor real do dia 5 = 90; erro de previsão = 90−106,67 = −16,67.</text></svg>