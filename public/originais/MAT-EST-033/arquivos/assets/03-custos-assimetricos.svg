<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="475" viewBox="0 0 1050 475" role="img" aria-labelledby="title desc"><title id="title">Perda de decisão: modelo A custa 40 e B custa 20</title><desc id="desc">Dois quadros com A: dez faltas, dez excedentes, custo quarenta; B: nenhuma falta, vinte excedentes, custo vinte.</desc><rect width="1050" height="475" fill="#fffdfa"/><text x="35" y="46" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#21344b" font-weight="700">Perda de decisão: modelo A custa 40 e B custa 20</text><text x="40" y="98" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">Custo da falta = 3 por unidade; custo do excedente = 1 por unidade.</text><rect x="85" y="128" width="402" height="212" fill="#e6eef7" stroke="#7290a2" rx="10"/><text x="286" y="173" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="700">Modelo A</text><text x="286" y="216" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="400">Faltas: 10; excedentes: 10</text><text x="286" y="266" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="700">Custo: 10 × 3 + 10 × 1 = 40</text><rect x="563" y="128" width="402" height="212" fill="#f5e8d3" stroke="#7290a2" rx="10"/><text x="764" y="173" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="700">Modelo B</text><text x="764" y="216" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="400">Faltas: 0; excedentes: 20</text><text x="764" y="266" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#21344b" font-weight="700">Custo: 0 × 3 + 20 × 1 = 20</text><text x="40" y="403" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">Critério de custo é condicional; B também tem o maior erro isolado (20).</text></svg>