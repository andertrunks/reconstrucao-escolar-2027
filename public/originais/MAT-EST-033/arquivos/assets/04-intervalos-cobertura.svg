<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="475" viewBox="0 0 1050 475" role="img" aria-labelledby="title desc"><title id="title">Intervalos preditivos e cobertura ilustrativa</title><desc id="desc">Quatro faixas preditivas e quatro valores realizados. Os três primeiros pontos estão nas faixas e o quarto valor realizado 100 fica fora da faixa de 105 a 115.</desc><rect width="1050" height="475" fill="#fffdfa"/><text x="35" y="46" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#21344b" font-weight="700">Intervalos preditivos e cobertura ilustrativa</text><text x="40" y="99" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Eixo horizontal: demanda observada e intervalo previsto, em atendimentos</text><line x1="90" y1="134" x2="90" y2="352" stroke="#d5dfe8" stroke-width="1"/><text x="90" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">70</text><line x1="170" y1="134" x2="170" y2="352" stroke="#d5dfe8" stroke-width="1"/><text x="170" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">80</text><line x1="250" y1="134" x2="250" y2="352" stroke="#d5dfe8" stroke-width="1"/><text x="250" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">90</text><line x1="330" y1="134" x2="330" y2="352" stroke="#d5dfe8" stroke-width="1"/><text x="330" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">100</text><line x1="410" y1="134" x2="410" y2="352" stroke="#d5dfe8" stroke-width="1"/><text x="410" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">110</text><line x1="490" y1="134" x2="490" y2="352" stroke="#d5dfe8" stroke-width="1"/><text x="490" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">120</text><line x1="570" y1="134" x2="570" y2="352" stroke="#d5dfe8" stroke-width="1"/><text x="570" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">130</text><text x="22" y="171" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Dia 1</text><line x1="130" y1="166" x2="290" y2="166" stroke="#1d5c82" stroke-width="7"/><circle cx="170" cy="166" r="7" fill="#21344b"/><text x="695" y="171" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">75–95; realizado 80; cobre</text><text x="22" y="226" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Dia 2</text><line x1="250" y1="221" x2="410" y2="221" stroke="#1d5c82" stroke-width="7"/><circle cx="330" cy="221" r="7" fill="#21344b"/><text x="695" y="226" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">90–110; realizado 100; cobre</text><text x="22" y="281" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Dia 3</text><line x1="410" y1="276" x2="570" y2="276" stroke="#1d5c82" stroke-width="7"/><circle cx="490" cy="276" r="7" fill="#21344b"/><text x="695" y="281" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">110–130; realizado 120; cobre</text><text x="22" y="336" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Dia 4</text><line x1="370" y1="331" x2="450" y2="331" stroke="#1d5c82" stroke-width="7"/><circle cx="330" cy="331" r="7" fill="#21344b"/><text x="695" y="336" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">105–115; realizado 100; não cobre</text><text x="40" y="434" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Cobertura descritiva neste exemplo pequeno: 3 de 4 = 75%; não prova calibração.</text></svg>