<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="475" viewBox="0 0 1050 475" role="img" aria-labelledby="title desc"><title id="title">Métricas A/B calculadas na mesma base</title><desc id="desc">Gráfico de barras com MAE A e B de cinco, RMSE A de cinco e RMSE B de dez atendimentos; eixos identificados.</desc><rect width="1050" height="475" fill="#fffdfa"/><text x="35" y="46" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#21344b" font-weight="700">Métricas A/B calculadas na mesma base</text><text x="40" y="97" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#21344b" font-weight="400">Eixo horizontal: modelo e medida; eixo vertical: erro em atendimentos</text><line x1="92" y1="345" x2="965" y2="345" stroke="#c9d6df" stroke-width="1"/><text x="77" y="350" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#21344b" font-weight="400">0</text><line x1="92" y1="275" x2="965" y2="275" stroke="#c9d6df" stroke-width="1"/><text x="77" y="280" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#21344b" font-weight="400">5</text><line x1="92" y1="205" x2="965" y2="205" stroke="#c9d6df" stroke-width="1"/><text x="77" y="210" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#21344b" font-weight="400">10</text><rect x="180" y="275" width="132" height="70" fill="#1d5c82" stroke="#1d5c82" rx="1"/><text x="246" y="265" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="700">5</text><text x="246" y="377" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">A - MAE</text><rect x="390" y="275" width="132" height="70" fill="#1d5c82" stroke="#1d5c82" rx="1"/><text x="456" y="265" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="700">5</text><text x="456" y="377" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">B - MAE</text><rect x="600" y="275" width="132" height="70" fill="#b16c32" stroke="#b16c32" rx="1"/><text x="666" y="265" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="700">5</text><text x="666" y="377" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">A - RMSE</text><rect x="810" y="205" width="132" height="140" fill="#b16c32" stroke="#b16c32" rx="1"/><text x="876" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="700">10</text><text x="876" y="377" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">B - RMSE</text><text x="45" y="428" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">MAE empata; RMSE identifica o erro extremo concentrado em B.</text></svg>