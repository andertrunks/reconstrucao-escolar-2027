<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="475" viewBox="0 0 1050 475" role="img" aria-labelledby="title desc"><title id="title">Três cenários de custo mudam a comparação A/B</title><desc id="desc">Cenário I com falta três e excedente um gera A 40 B 20; cenário II ambos um gera empate 20; cenário III falta um excedente três gera A 40 B 60.</desc><rect width="1050" height="475" fill="#fffdfa"/><text x="35" y="46" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#21344b" font-weight="700">Três cenários de custo mudam a comparação A/B</text><text x="39" y="94" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">Custo por unidade de falta (cF); por unidade excedente (cE)</text><rect x="42" y="126" width="284" height="235" fill="#e6eef7" stroke="#7290a2" rx="10"/><text x="184" y="164" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#21344b" font-weight="700">Cenário I</text><text x="184" y="208" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">cF = 3; cE = 1</text><text x="184" y="252" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="400">Custo A: 40</text><text x="184" y="285" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="700">Custo B: 20</text><rect x="382" y="126" width="284" height="235" fill="#f5e8d3" stroke="#7290a2" rx="10"/><text x="524" y="164" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#21344b" font-weight="700">Cenário II</text><text x="524" y="208" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">cF = 1; cE = 1</text><text x="524" y="252" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="400">Custo A: 20</text><text x="524" y="285" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="700">Custo B: 20</text><rect x="722" y="126" width="284" height="235" fill="#e2efe7" stroke="#7290a2" rx="10"/><text x="864" y="164" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#21344b" font-weight="700">Cenário III</text><text x="864" y="208" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">cF = 1; cE = 3</text><text x="864" y="252" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="400">Custo A: 40</text><text x="864" y="285" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#21344b" font-weight="700">Custo B: 60</text><text x="41" y="407" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#21344b" font-weight="400">A: 10 faltas e 10 excedentes. B: 0 faltas e 20 excedentes.</text></svg>