<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Grupos independentes versus medições pareadas</title><desc id="desc">Dois quadros com regras diferentes: reamostrar cada grupo independente separadamente; para antes e depois, preservar o vínculo entre medições.</desc><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#13263c}.heading{font-size:27px;font-weight:bold}.note{font-size:16px}.small{font-size:14px}.big{font-size:22px;font-weight:bold}.box{stroke:#152b46;stroke-width:2;fill:#eef6fb}.line{stroke:#152b46;stroke-width:2;fill:none}</style><text class="heading" x="38" y="45">A unidade de reamostragem depende do desenho</text><rect x="55" y="110" width="385" height="117" rx="14" fill="#eef6fb" stroke="#152b46" stroke-width="2"/><text x="247.5" y="146" font-size="19" font-weight="bold" text-anchor="middle">Dois grupos independentes</text><text x="247.5" y="177" class="note" text-anchor="middle">Reamostrar A e B separadamente</text><rect x="515" y="110" width="385" height="117" rx="14" fill="#fff6e6" stroke="#152b46" stroke-width="2"/><text x="707.5" y="146" font-size="19" font-weight="bold" text-anchor="middle">Antes e depois</text><text x="707.5" y="177" class="note" text-anchor="middle">Preservar pares ou diferenças</text><text x="90" y="293" class="note">Para intervalo da diferença de médias:</text><text x="90" y="333" class="big">A* − B*</text><text x="550" y="293" class="note">Para teste de sinais sob H0 adequado:</text><text x="550" y="333" class="big">(+/−) × diferenças</text><text x="480" y="419" text-anchor="middle" class="note">Não trocar pessoas, dias ou medidas como se toda linha fosse independente.</text></svg>