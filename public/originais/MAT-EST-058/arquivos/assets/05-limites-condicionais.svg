<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="ttl des"><title id="ttl">Limites condicionais do MAE para os oito cartões</title><desc id="des">Se seis erros absolutos desconhecidos tiverem limite artificial dez, B varia de zero vírgula setenta e cinco a oito vírgula vinte e cinco; C de um a oito vírgula cinco. Faixas se sobrepõem.</desc><rect width="1100" height="420" fill="#ffffff"/><text x="38" y="49" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#192b3b">Limites condicionais do MAE para os oito cartões</text><text x="37" y="88" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#192b3b">Eixo horizontal: MAE hipotético, unidades (teto M = 10 não comprovado)</text><path d="M 160 330 L 930 330" stroke="#435567" stroke-width="3" fill="none"/><path d="M 160 324 L 160 337" stroke="#435567" stroke-width="3" fill="none"/><text x="160" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">0</text><path d="M 237 324 L 237 337" stroke="#435567" stroke-width="3" fill="none"/><text x="237" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">1</text><path d="M 314 324 L 314 337" stroke="#435567" stroke-width="3" fill="none"/><text x="314" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">2</text><path d="M 391 324 L 391 337" stroke="#435567" stroke-width="3" fill="none"/><text x="391" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">3</text><path d="M 468 324 L 468 337" stroke="#435567" stroke-width="3" fill="none"/><text x="468" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">4</text><path d="M 545 324 L 545 337" stroke="#435567" stroke-width="3" fill="none"/><text x="545" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">5</text><path d="M 622 324 L 622 337" stroke="#435567" stroke-width="3" fill="none"/><text x="622" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">6</text><path d="M 699 324 L 699 337" stroke="#435567" stroke-width="3" fill="none"/><text x="699" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">7</text><path d="M 776 324 L 776 337" stroke="#435567" stroke-width="3" fill="none"/><text x="776" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">8</text><path d="M 853 324 L 853 337" stroke="#435567" stroke-width="3" fill="none"/><text x="853" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">9</text><path d="M 930 324 L 930 337" stroke="#435567" stroke-width="3" fill="none"/><text x="930" y="357" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#192b3b">10</text><text x="104" y="183" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#192b3b">B</text><rect x="217.75" y="152" width="577.5" height="40" rx="9" fill="#dce6f0" stroke="#415568" stroke-width="2"/><text x="217.75" y="140" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#192b3b">0,75</text><text x="795.25" y="140" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#192b3b">8,25</text><text x="104" y="263" font-family="Arial,DejaVu Sans,sans-serif" font-size="2