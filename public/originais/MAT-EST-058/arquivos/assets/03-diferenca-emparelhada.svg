<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="ttl des"><title id="ttl">Diferença emparelhada C menos B, S01 e S02</title><desc id="des">S01 menos uma unidade; S02 mais três unidades; média mais uma. Zero indica igualdade entre erros absolutos.</desc><rect width="1100" height="420" fill="#ffffff"/><text x="38" y="49" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#192b3b">Diferença emparelhada C menos B, S01 e S02</text><text x="40" y="84" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#192b3b">Eixo vertical: diferença |erro C| − |erro B| (unidades)</text><path d="M 145 302 L 970 302" stroke="#435567" stroke-width="3" fill="none"/><path d="M 145 105 L 145 354" stroke="#435567" stroke-width="3" fill="none"/><text x="970" y="331" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#192b3b">Cartão (eixo horizontal)</text><text x="116" y="143" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#192b3b">+3</text><text x="116" y="196" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#192b3b">+2</text><text x="116" y="249" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#192b3b">+1</text><text x="116" y="302" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#192b3b">0</text><text x="116" y="355" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#192b3b">−1</text><rect x="305" y="302" width="148" height="53" rx="12" fill="#dce6f0" stroke="#4d6374" stroke-width="2"/><text x="379" y="293" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#192b3b">−1</text><text x="379" y="385" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#192b3b">S01</text><rect x="640" y="143" width="148" height="159" rx="12" fill="#dce6f0" stroke="#4d6374" stroke-width="2"/><text x="714" y="134" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#192b3b">+3</text><text x="714" y="385" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#192b3b">S02</text><text x="848" y="155" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#192b3b">Média: +1 un.</text></svg>
