<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="ttl des"><title id="ttl">Exclusão seletiva inverte a comparação</title><desc id="des">Com S01 e S02: B tem MAE três e C quatro. Retirar S02 depois do resultado: B quatro e C três. Nenhuma previsão mudou.</desc><rect width="1100" height="420" fill="#ffffff"/><text x="38" y="49" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#192b3b">Exclusão seletiva inverte a comparação</text><rect x="40" y="110" width="486" height="230" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="61" y="152" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#192b3b">Corte A: S01 + S02</text><text x="61" y="204" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#192b3b">MAE B = 3 un.</text><text x="61" y="243" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#192b3b">MAE C = 4 un.</text><text x="61" y="295" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#192b3b">2 pares válidos</text><rect x="574" y="110" width="486" height="230" rx="12" fill="#f3f6f8" stroke="#4d6374" stroke-width="2"/><text x="595" y="152" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#192b3b">Exclusão pós-resultado S02</text><text x="595" y="204" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#192b3b">MAE B = 4 un.</text><text x="595" y="243" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#192b3b">MAE C = 3 un.</text><text x="595" y="295" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#192b3b">1 par; exploração seletiva</text><text x="550" y="386" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#192b3b">Não alterar a fotografia A após conhecer o resultado.</text></svg>
