<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" width="1120" height="420" viewBox="0 0 1120 420"><title id="tt">Corte antes do alvo, não depois</title><desc id="dd">A origem t25 só pode ser usada depois da validação das observações necessárias; modelos e regra devem ser congelados antes da emissão t26 e antes de y26 se tornar disponível.</desc><style>text{font-family:Arial,sans-serif;fill:#182b3f} .h{font-size:25px;font-weight:bold}.t{font-size:19px}.s{font-size:16px}.small{font-size:14px}.box{fill:#eff5fa;stroke:#1d4566;stroke-width:2}.warn{fill:#fff2e8;stroke:#904820;stroke-width:2}.new{fill:#eaf7ef;stroke:#276d48;stroke-width:2}.arr{stroke:#2e455d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e455d"/></marker></defs><rect width="1120" height="420" fill="white"/><text x="38" y="44" class="h">Corte antes do alvo, não depois</text><rect x="30" y="120" width="235" height="100" rx="13" class="box"/><text x="46" y="151" class="t">Até t25</text><text x="46" y="175" class="t">validar dados</text><path class="arr" d="M270 170 L310 170"/><rect x="315" y="120" width="235" height="100" rx="13" class="new"/><text x="331" y="151" class="t">Congelar regra</text><text x="331" y="175" class="t">e versões</text><path class="arr" d="M555 170 L595 170"/><rect x="600" y="120" width="235" height="100" rx="13" class="new"/><text x="616" y="151" class="t">Emitir para t26</text><text x="616" y="175" class="t">provar ordem</text><path class="arr" d="M840 170 L880 170"/><rect x="885" y="120" width="205" height="100" rx="13" class="box"/><text x="901" y="151" class="t">Depois: y26</text><text x="901" y="175" class="t">avaliar</text><text x="55" y="305" class="t">Se y26 entra antes da emissão, o teste confirmatório é inválido.</text></svg>