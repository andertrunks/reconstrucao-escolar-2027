<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" width="1120" height="420" viewBox="0 0 1120 420"><title id="tt">Seis campos para um plano testável</title><desc id="dd">O desenho contém questão, amostra e janela, modelos congelados, métricas, guardas e regras de desvios/decisão.</desc><style>text{font-family:Arial,sans-serif;fill:#182b3f} .h{font-size:25px;font-weight:bold}.t{font-size:19px}.s{font-size:16px}.small{font-size:14px}.box{fill:#eff5fa;stroke:#1d4566;stroke-width:2}.warn{fill:#fff2e8;stroke:#904820;stroke-width:2}.new{fill:#eaf7ef;stroke:#276d48;stroke-width:2}.arr{stroke:#2e455d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e455d"/></marker></defs><rect width="1120" height="420" fill="white"/><text x="38" y="44" class="h">Seis campos para um plano testável</text><rect x="45" y="88" width="320" height="100" rx="13" class="box"/><text x="61" y="119" class="t">1. Hipótese e alvo</text><rect x="398" y="88" width="320" height="100" rx="13" class="box"/><text x="414" y="119" class="t">2. Janela t26–t33</text><rect x="751" y="88" width="320" height="100" rx="13" class="box"/><text x="767" y="119" class="t">3. Algoritmos B/C</text><rect x="45" y="219" width="320" height="100" rx="13" class="box"/><text x="61" y="250" class="t">4. MAE e custo</text><rect x="398" y="219" width="320" height="100" rx="13" class="box"/><text x="414" y="250" class="t">5. Piora local ≤ 10</text><rect x="751" y="219" width="320" height="100" rx="13" class="box"/><text x="767" y="250" class="t">6. Desvios e auditoria</text></svg>