<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" width="1120" height="420" viewBox="0 0 1120 420"><title id="tt">A média não apaga a piora local</title><desc id="dd">Na série fictícia antiga em t19, B tem erro absoluto quatro e C tem erro absoluto vinte e três vírgula dois. Diferença de dezenove vírgula dois supera o limite dez.</desc><style>text{font-family:Arial,sans-serif;fill:#182b3f} .h{font-size:25px;font-weight:bold}.t{font-size:19px}.s{font-size:16px}.small{font-size:14px}.box{fill:#eff5fa;stroke:#1d4566;stroke-width:2}.warn{fill:#fff2e8;stroke:#904820;stroke-width:2}.new{fill:#eaf7ef;stroke:#276d48;stroke-width:2}.arr{stroke:#2e455d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e455d"/></marker></defs><rect width="1120" height="420" fill="white"/><text x="38" y="44" class="h">A média não apaga a piora local</text><rect x="90" y="103" width="310" height="105" rx="13" class="warn"/><text x="106" y="134" class="t">t19: </text><text x="106" y="158" class="t">B = 4; C = 23,2</text><rect x="465" y="103" width="250" height="105" rx="13" class="warn"/><text x="481" y="134" class="t">Piora = 19,2</text><rect x="765" y="103" width="245" height="105" rx="13" class="box"/><text x="781" y="134" class="t">Guarda = 10</text><path class="arr" d="M405 155 L455 155"/><path class="arr" d="M720 155 L755 155"/><text x="92" y="297" class="t">Protocolo MAT-EST-049-PROT-v1: não promover C. Irreversível no registro.</text></svg>