<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" width="1120" height="420" viewBox="0 0 1120 420"><title id="tt">Três escopos, três permissões</title><desc id="dd">t18 a t22 são dados fictícios já conhecidos; t23 a t25 são alvos não observados com cenários expostos; t26 a t33 são alvos futuros exclusivos propostos, ainda sem registro.</desc><style>text{font-family:Arial,sans-serif;fill:#182b3f} .h{font-size:25px;font-weight:bold}.t{font-size:19px}.s{font-size:16px}.small{font-size:14px}.box{fill:#eff5fa;stroke:#1d4566;stroke-width:2}.warn{fill:#fff2e8;stroke:#904820;stroke-width:2}.new{fill:#eaf7ef;stroke:#276d48;stroke-width:2}.arr{stroke:#2e455d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e455d"/></marker></defs><rect width="1120" height="420" fill="white"/><text x="38" y="44" class="h">Três escopos, três permissões</text><rect x="35" y="105" width="325" height="125" rx="13" class="warn"/><text x="51" y="136" class="t">t18–t22</text><text x="51" y="160" class="t">5 pares exploratórios</text><path class="arr" d="M366 167 L388 167"/><rect x="394" y="105" width="325" height="125" rx="13" class="warn"/><text x="410" y="136" class="t">t23–t25</text><text x="410" y="160" class="t">Quarentena editorial</text><path class="arr" d="M725 167 L747 167"/><rect x="752" y="105" width="325" height="125" rx="13" class="new"/><text x="768" y="136" class="t">t26–t33</text><text x="768" y="160" class="t">Novo teste proposto</text><text x="60" y="300" class="t">Nenhuma linha nesta figura representa emissão futura autenticada.</text></svg>