<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 335" width="1000" height="335"><title id="title">Portas pedagógicas da decisão</title><desc id="desc">Seis caixas: cinco de oito pares pendente; redução de MAE passa; redução de custo passa; guarda de piora máxima falha no t19; qualidade pendente; decisão adiar promoção.</desc><rect width="1000" height="335" rx="18" fill="#f8fafc"/><text x="35" y="36" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#17243b">Portas pedagógicas da decisão</text><rect x="48" y="80" width="292" height="100" rx="12" fill="white" stroke="#1d4e89" stroke-width="2"/><text x="62" y="106" font-family="Arial" font-weight="700" font-size="16" fill="#17243b">Amostra</text><text x="62" y="134" font-family="Arial" font-size="15" fill="#17243b">5 de 8 pares</text><text x="62" y="158" font-family="Arial" font-size="13" fill="#1d4e89">PENDENTE</text><rect x="368" y="80" width="292" height="100" rx="12" fill="white" stroke="#157b72" stroke-width="2"/><text x="382" y="106" font-family="Arial" font-weight="700" font-size="16" fill="#17243b">Erro médio</text><text x="382" y="134" font-family="Arial" font-size="15" fill="#17243b">redução 52,5%</text><text x="382" y="158" font-family="Arial" font-size="13" fill="#157b72">PASSOU</text><rect x="688" y="80" width="292" height="100" rx="12" fill="white" stroke="#157b72" stroke-width="2"/><text x="702" y="106" font-family="Arial" font-weight="700" font-size="16" fill="#17243b">Custo médio</text><text x="702" y="134" font-family="Arial" font-size="15" fill="#17243b">redução 70,86%</text><text x="702" y="158" font-family="Arial" font-size="13" fill="#157b72">PASSOU</text><rect x="48" y="210" width="292" height="100" rx="12" fill="white" stroke="#a24b21" stroke-width="2"/><text x="62" y="236" font-family="Arial" font-weight="700" font-size="16" fill="#17243b">Guarda</text><text x="62" y="264" font-family="Arial" font-size="15" fill="#17243b">piora t19: 19,2</text><text x="62" y="288" font-family="Arial" font-size="13" fill="#a24b21">FALHOU</text><rect x="368" y="210" width="292" height="100" rx="12" fill="white" stroke="#1d4e89" stroke-width="2"/><text x="382" y="236" font-family="Arial" font-weight="700" font-size="16" fill="#17243b">Qualidade</text><text x="382" y="264" font-family="Arial" font-size="15" fill="#17243b">avaliar antes de uso</text><text x="382" y="288" font-family="Arial" font-size="13" fill="#1d4e89">PENDENTE</text><rect x="688" y="210" width="292" height="100" rx="12" fill="white" stroke="#1d4e89" stroke-width="2"/><text x="702" y="236" font-family="Arial" font-weight="700" font-size="16" fill="#17243b">Decisão</text><text x="702" y="264" font-family="Arial" font-size="15" fill="#17243b">não promover agora</text><text x="702" y="288" font-family="Arial" font-size="13" fill="#1d4e89">ADIAR</text></svg>