<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 355" width="1000" height="355"><title id="title">Agregado favorável não apaga falha local</title><desc id="desc">À esquerda redução no erro médio, à direita falha no alvo t19. Uma média pode ocultar perdas importantes em observações individuais.</desc><rect width="1000" height="355" rx="18" fill="#f8fafc"/><text x="35" y="36" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#17243b">Agregado favorável não apaga falha local</text><rect x="55" y="100" width="410" height="170" rx="12" fill="white" stroke="#1d4e89" stroke-width="2"/><rect x="534" y="100" width="410" height="170" rx="12" fill="white" stroke="#a24b21" stroke-width="2"/><text x="75" y="135" font-size="19" font-family="Arial" font-weight="700" fill="#17243b">Melhora média observada</text><text x="75" y="170" font-size="17" font-family="Arial" fill="#17243b">MAE: 17,60 → 8,36</text><text x="75" y="207" font-size="17" font-family="Arial" fill="#17243b">5 pares fictícios</text><text x="554" y="135" font-size="19" font-family="Arial" font-weight="700" fill="#17243b">Falha particular</text><text x="554" y="170" font-size="17" font-family="Arial" fill="#17243b">t19: 4 → 23,2</text><text x="554" y="207" font-size="17" font-family="Arial" fill="#17243b">Piora de 19,2 unidades</text><text x="53" y="313" font-size="17" font-family="Arial" fill="#17243b">O agregado não apaga risco local; nenhuma das duas caixas, sozinha, é prova de ganho futuro.</text></svg>