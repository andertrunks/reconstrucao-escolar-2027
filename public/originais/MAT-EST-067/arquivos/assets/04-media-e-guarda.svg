<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="titulo descricao"><title id="titulo">Média não substitui guarda hipotética</title><desc id="descricao">MAE B dois vírgula cinco kits, C um vírgula setenta e cinco; em D04 diferença C menos B um kit excede guarda hipotética meio kit.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#17334b}.ttl{font-size:26px;font-weight:bold}.note{font-size:17px}.box{fill:#e5f2fa;stroke:#24516a;stroke-width:2}.pending{fill:#ffedce;stroke:#815300;stroke-width:2}.strong{font-weight:bold}.barB{fill:#5d8ba0}.barC{fill:#dbb471}.axis{stroke:#263f56;stroke-width:2}</style><rect width="1000" height="470" fill="#fff"/><text x="34" y="42" class="ttl">Média não substitui guarda hipotética</text><rect x="55" y="120" width="410" height="215" rx="16" class="box"/><text x="80" y="166" font-size="24" class="strong">MAE nos 4 pares</text><text x="80" y="217" font-size="22">B: 2,5 kits</text><text x="80" y="261" font-size="22">C: 1,75 kit</text><text x="80" y="306" class="note">Média de C menor no recorte.</text><rect x="535" y="120" width="410" height="215" rx="16" class="pending"/><text x="560" y="166" font-size="24" class="strong">Guarda em D04</text><text x="560" y="217" font-size="22">Piora C − B: +1 kit</text><text x="560" y="261" font-size="22">Limite: 0,5 kit</text><text x="560" y="306" class="note">Critério hipotético não cumprido.</text><text x="65" y="390" class="note">Essa guarda é exclusiva do laboratório e não altera MAT-EST-049-PROT-v1.</text></svg>