<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="titulo descricao"><title id="titulo">Elegibilidade no LAB-067</title><desc id="descricao">Seis cartões planejados. D01 a D04 possuem observado didático e são avaliáveis; D05 D06 não têm observado e continuam pendentes.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#17334b}.ttl{font-size:26px;font-weight:bold}.note{font-size:17px}.box{fill:#e5f2fa;stroke:#24516a;stroke-width:2}.pending{fill:#ffedce;stroke:#815300;stroke-width:2}.strong{font-weight:bold}.barB{fill:#5d8ba0}.barC{fill:#dbb471}.axis{stroke:#263f56;stroke-width:2}</style><rect width="1000" height="470" fill="#fff"/><text x="34" y="42" class="ttl">Elegibilidade no LAB-067</text><rect x="50" y="100" width="280" height="110" rx="12" class="box"/><text x="75" y="145" font-size="22" class="strong">D01</text><text x="75" y="175" class="note">avaliável</text><rect x="360" y="100" width="280" height="110" rx="12" class="box"/><text x="385" y="145" font-size="22" class="strong">D02</text><text x="385" y="175" class="note">avaliável</text><rect x="670" y="100" width="280" height="110" rx="12" class="box"/><text x="695" y="145" font-size="22" class="strong">D03</text><text x="695" y="175" class="note">avaliável</text><rect x="50" y="240" width="280" height="110" rx="12" class="box"/><text x="75" y="285" font-size="22" class="strong">D04</text><text x="75" y="315" class="note">avaliável</text><rect x="360" y="240" width="280" height="110" rx="12" class="pending"/><text x="385" y="285" font-size="22" class="strong">D05</text><text x="385" y="315" class="note">observado pendente</text><rect x="670" y="240" width="280" height="110" rx="12" class="pending"/><text x="695" y="285" font-size="22" class="strong">D06</text><text x="695" y="315" class="note">observado pendente</text><text x="48" y="430" class="note">Completude: quatro de seis cartões, aproximadamente 66,67%. Não é taxa de acerto.</text></svg>