<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="titulo descricao"><title id="titulo">Painel de decisão: quatro tipos de afirmação</title><desc id="descricao">Fatos: quatro de seis avaliáveis e métricas do recorte. Ausências: D05 D06. Dedução condicional: limite menos um a zero. Estado: guarda fictícia falha e não houve implantação.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#17334b}.ttl{font-size:26px;font-weight:bold}.note{font-size:17px}.box{fill:#e5f2fa;stroke:#24516a;stroke-width:2}.pending{fill:#ffedce;stroke:#815300;stroke-width:2}.strong{font-weight:bold}.barB{fill:#5d8ba0}.barC{fill:#dbb471}.axis{stroke:#263f56;stroke-width:2}</style><rect width="1000" height="470" fill="#fff"/><text x="34" y="42" class="ttl">Painel de decisão: quatro tipos de afirmação</text><rect x="50" y="92" width="435" height="140" rx="13" class="box"/><text x="73" y="125" font-size="22" class="strong">1. Fato didático</text><text x="73" y="164" class="note">4/6 avaliáveis</text><text x="73" y="197" class="note">MAE B 2,5; C 1,75 kits</text><rect x="515" y="92" width="435" height="140" rx="13" class="pending"/><text x="538" y="125" font-size="22" class="strong">2. Ausência</text><text x="538" y="164" class="note">D05 e D06 pendentes</text><text x="538" y="197" class="note">Não são erros zero</text><rect x="50" y="252" width="435" height="140" rx="13" class="box"/><text x="73" y="285" font-size="22" class="strong">3. Limite condicional</text><text x="73" y="324" class="note">Média C−B em [−1, 0] kit</text><text x="73" y="357" class="note">Não é confiança estatística</text><rect x="515" y="252" width="435" height="140" rx="13" class="pending"/><text x="538" y="285" font-size="22" class="strong">4. Estado da regra</text><text x="538" y="324" class="note">Guarda fictícia falha</text><text x="538" y="357" class="note">Sem decisão operacional real</text></svg>