<line x1="386" y1="191" x2="396" y2="191" stroke="#215D9B" stroke-width="2"/><circle cx="396" cy="191" r="4" fill="#215D9B"/>
<line x1="567" y1="191" x2="577" y2="191" stroke="#215D9B" stroke-width="2"/><circle cx="577" cy="191" r="4" fill="#215D9B"/>
<line x1="748" y1="191" x2="758" y2="191" stroke="#215D9B" stroke-width="2"/><circle cx="758" cy="191" r="4" fill="#215D9B"/>
<rect x="36" y="413" width="888" height="47" rx="10" fill="#F4EEDF"/><text x="50" y="442" fill="#1B2C42" font-family="sans-serif" font-size="16">L5 torna o valor disponível; o evento de avaliação retificada ocorre em L6.</text>
