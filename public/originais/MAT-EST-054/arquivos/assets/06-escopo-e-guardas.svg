<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="ttl ds">
<title id="ttl">Separação de namespaces e limites</title>
<desc id="ds">Cinco pares da série principal t18 a t22, t23 a t25 pendentes, e exemplos V e Z isolados; guarda t19 violada em 19,2 unidades.</desc>
<rect width="960" height="475" fill="#F7F9FC"/><text x="40" y="48" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="25">Separação de namespaces e limites</text>
<text x="40" y="78" fill="#7B8DA2" font-family="sans-serif" font-size="15">MAT-EST-054 • Diagrama original / valores simulados</text>
<rect x="36" y="123" width="273" height="158" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="51" y="150" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Série principal · 5/8</text>
<text x="51" y="174" fill="#1B2C42" font-family="sans-serif" font-size="14">t18–t22: MAE B 17,60</text>
<text x="51" y="193" fill="#1B2C42" font-family="sans-serif" font-size="14">MAE C 8,36</text>
<text x="51" y="212" fill="#1B2C42" font-family="sans-serif" font-size="14">t19 piora C = 19,2</text>
<rect x="344" y="123" width="273" height="158" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="359" y="150" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Futuro · pendente</text>
<text x="359" y="174" fill="#1B2C42" font-family="sans-serif" font-size="14">t23–t25 sem observações</text>
<text x="359" y="193" fill="#1B2C42" font-family="sans-serif" font-size="14">cenários não são medidas</text>
<text x="359" y="212" fill="#1B2C42" font-family="sans-serif" font-size="14">não completar denominador</text>
<rect x="652" y="123" width="273" height="158" rx="12" fill="#E7EFF7" stroke="#215D9B" stroke-width="1.4"/>
<text x="667" y="150" fill="#1B2C42" font-family="sans-serif" font-weight="700" font-size="17">Ensaios isolados</text>
<text x="667" y="174" fill="#1B2C42" font-family="sans-serif" font-size="14">V: 40 → 44</text>
<text x="667" y="193" fill="#1B2C42" font-family="sans-serif" font-size="14">Z: 30 → 32</text>
<text x="667" y="212" fill="#1B2C42" font-family="sans-serif" font-size="14">não acrescentam pares</text>
<rect x="36" y="413" width="888" height="47" rx="10" fill="#F4EEDF"/><text x="50" y="442" fill="#1B2C42" font-family="sans-serif" font-size="16">Limite do protocolo t19 = 10. Não promover o desafiante.</text>
</svg>
