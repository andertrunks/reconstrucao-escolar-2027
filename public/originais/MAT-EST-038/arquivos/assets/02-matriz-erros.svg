<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">Matriz de diagnóstico por causa</title><desc id="desc">Cinco caixas distinguem interpretação, conhecimento, cálculo, escolha de estratégia e retenção.</desc><rect width="960" height="490" rx="24" fill="#fff"/><rect x="14" y="14" width="932" height="462" rx="18" fill="#eaf5ff" stroke="#b7ccdf"/><text x="44" y="66" fill="#12273b" font-family="Arial,sans-serif" font-weight="bold" font-size="25">Matriz de diagnóstico por causa</text><text x="80" y="118" font-family="Arial" font-size="18" fill="#12273b">Primeira ruptura observável</text><rect x="55" y="160" width="160" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="135.0" y="196" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Leitura</text><text x="135.0" y="224" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#12273b">denominador, legenda</text><rect x="233" y="160" width="160" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="313.0" y="196" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Conteúdo</text><text x="313.0" y="224" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#12273b">conceito ou hipótese</text><rect x="411" y="160" width="160" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="491.0" y="196" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Cálculo</text><text x="491.0" y="224" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#12273b">operação ou unidade</text><rect x="589" y="160" width="160" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="669.0" y="196" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Estratégia</text><text x="669.0" y="224" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#12273b">modelo e desenho</text><rect x="767" y="160" width="160" height="96" rx="15" fill="#ffffff" stroke="#1463a5" stroke-width="2"/><text x="847.0" y="196" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#12273b">Retenção</text><text x="847.0" y="224" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#12273b">recuperação posterior</text><text x="44" y="448" fill="#12273b" font-family="Arial,sans-serif" font-size="17">O tipo de erro orienta a atividade de recuperação.</text></svg>