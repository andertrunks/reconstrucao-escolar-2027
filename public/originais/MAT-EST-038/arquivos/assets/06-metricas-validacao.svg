<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">Comparação de métricas em dados de teste</title><desc id="desc">Três pares de barras mostram MAE e RMSE dos modelos A, B e linha de base nos quatro dias de teste.</desc><rect width="960" height="490" rx="24" fill="#fff"/><rect x="14" y="14" width="932" height="462" rx="18" fill="#eaf5ff" stroke="#b7ccdf"/><text x="44" y="66" fill="#12273b" font-family="Arial,sans-serif" font-weight="bold" font-size="25">Comparação de métricas em dados de teste</text><text x="70" y="122" font-family="Arial" font-size="17" fill="#12273b">Métricas nos quatro dias fictícios de teste (atendimentos/dia)</text><text x="75" y="189" font-family="Arial" font-size="18" fill="#12273b">A</text><rect x="170" y="165" width="80.0" height="20" fill="#1463a5"/><rect x="170" y="189" width="80.0" height="20" fill="#15704d"/><text x="265.0" y="191" font-family="Arial" font-size="15" fill="#12273b">MAE 5; RMSE 5.00</text><text x="75" y="264" font-family="Arial" font-size="18" fill="#12273b">B</text><rect x="170" y="240" width="100.0" height="20" fill="#1463a5"/><rect x="170" y="264" width="200.0" height="20" fill="#15704d"/><text x="385.0" y="266" font-family="Arial" font-size="15" fill="#12273b">MAE 6.25; RMSE 12.50</text><text x="75" y="339" font-family="Arial" font-size="18" fill="#12273b">Base</text><rect x="170" y="315" width="200.0" height="20" fill="#1463a5"/><rect x="170" y="339" width="265.3" height="20" fill="#15704d"/><text x="450.3" y="341" font-family="Arial" font-size="15" fill="#12273b">MAE 12.5; RMSE 16.58</text><text x="70" y="418" font-family="Arial" font-size="15" fill="#12273b">Barras superiores: MAE. Inferiores: RMSE. Eixo horizontal: magnitude do erro em atendimentos.</text><text x="44" y="448" fill="#12273b" font-family="Arial,sans-serif" font-size="17">O erro extremo de B pesa mais no RMSE do que no MAE.</text></svg>