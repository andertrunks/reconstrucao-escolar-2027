<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" role="img" aria-labelledby="t d"><title id="t">Intervalo para média e para observação individual</title><desc id="d">Reta horizontal de 0 a 20 pontos; intervalo da média de 8 a 12 e intervalo individual de 5 a 15, ambos centrados em 10. Valores didáticos, não intervalos calculados com dados.</desc><rect width="1050" height="420" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#183047}.title{font-size:26px;font-weight:bold}.text{font-size:20px}.small{font-size:17px}.axis{stroke:#324f63;stroke-width:2}.grid{stroke:#c4cfd4;stroke-width:1;stroke-dasharray:4 4}</style><text x="38" y="45" class="title" text-anchor="start">Intervalo para média e para observação individual</text><text x="55" y="88" class="small" text-anchor="start">Exemplo conceitual: centro da previsão = 10 pontos</text><text x="45" y="163" class="small" text-anchor="start">Média estimada: 8 a 12</text><line x1="90" y1="196" x2="950" y2="196" class="axis"/><rect x="434" y="177" width="172" height="37" rx="8" fill="#cce7f5" stroke="#4a6272" stroke-width="1.5"/><text x="520.0" y="204" class="small" text-anchor="middle">8–12</text><text x="45" y="245" class="small" text-anchor="start">Novo indivíduo: 5 a 15</text><line x1="90" y1="278" x2="950" y2="278" class="axis"/><rect x="305" y="259" width="430" height="37" rx="8" fill="#f6e3c9" stroke="#4a6272" stroke-width="1.5"/><text x="520.0" y="286" class="small" text-anchor="middle">5–15</text><text x="90" y="356" class="small" text-anchor="middle">0</text><text x="305" y="356" class="small" text-anchor="middle">5</text><text x="520" y="356" class="small" text-anchor="middle">10</text><text x="735" y="356" class="small" text-anchor="middle">15</text><text x="950" y="356" class="small" text-anchor="middle">20</text><text x="54" y="390" class="small" text-anchor="start">Eixo horizontal: valor previsto, em pontos.</text></svg>