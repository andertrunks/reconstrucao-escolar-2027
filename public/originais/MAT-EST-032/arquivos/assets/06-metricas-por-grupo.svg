<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" role="img" aria-labelledby="t d"><title id="t">Média global e diferenças entre grupos</title><desc id="d">Gráfico: grupo X com 90 registros e MAE 1, grupo Y com 10 registros e MAE 5, global ponderado MAE 1,4; eixo vertical em pontos.</desc><rect width="1050" height="420" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#183047}.title{font-size:26px;font-weight:bold}.text{font-size:20px}.small{font-size:17px}.axis{stroke:#324f63;stroke-width:2}.grid{stroke:#c4cfd4;stroke-width:1;stroke-dasharray:4 4}</style><text x="38" y="45" class="title" text-anchor="start">Média global e diferenças entre grupos</text><text x="47" y="94" class="small" text-anchor="start">Eixo vertical: MAE em pontos | Grupos com tamanhos diferentes</text><line x1="90" y1="337" x2="960" y2="337" class="grid"/><text x="72" y="342" class="small" text-anchor="end">0</text><line x1="90" y1="293" x2="960" y2="293" class="grid"/><text x="72" y="298" class="small" text-anchor="end">1</text><line x1="90" y1="249" x2="960" y2="249" class="grid"/><text x="72" y="254" class="small" text-anchor="end">2</text><line x1="90" y1="205" x2="960" y2="205" class="grid"/><text x="72" y="210" class="small" text-anchor="end">3</text><line x1="90" y1="161" x2="960" y2="161" class="grid"/><text x="72" y="166" class="small" text-anchor="end">4</text><line x1="90" y1="117" x2="960" y2="117" class="grid"/><text x="72" y="122" class="small" text-anchor="end">5</text><rect x="195" y="293" width="139" height="44" rx="8" fill="#d7e9f4" stroke="#4a6272" stroke-width="1.5"/><text x="264" y="281" class="text" text-anchor="middle">1</text><text x="264" y="369" class="small" text-anchor="middle">Grupo X</text><text x="264" y="394" class="small" text-anchor="middle">n = 90</text><rect x="475" y="117" width="139" height="220" rx="8" fill="#efddc6" stroke="#4a6272" stroke-width="1.5"/><text x="544" y="105" class="text" text-anchor="middle">5</text><text x="544" y="369" class="small" text-anchor="middle">Grupo Y</text><text x="544" y="394" class="small" text-anchor="middle">n = 10</text><rect x="755" y="275.4" width="139" height="61.599999999999994" rx="8" fill="#dfecdb" stroke="#4a6272" stroke-width="1.5"/><text x="824" y="263.4" class="text" text-anchor="middle">1,4</text><text x="824" y="369" class="small" text-anchor="middle">Global</text><text x="824" y="394" class="small" text-anchor="middle">n = 100</text></svg>