<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" role="img" aria-labelledby="t d"><title id="t">Modelo pior que a referência de média</title><desc id="d">Esquema compara SST de 20 pontos ao quadrado com SSE de 24 pontos ao quadrado e calcula R ao quadrado igual a menos 0,20.</desc><rect width="1050" height="420" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#183047}.title{font-size:26px;font-weight:bold}.text{font-size:20px}.small{font-size:17px}.axis{stroke:#324f63;stroke-width:2}.grid{stroke:#c4cfd4;stroke-width:1;stroke-dasharray:4 4}</style><text x="38" y="45" class="title" text-anchor="start">Modelo pior que a referência de média</text><text x="45" y="96" class="small" text-anchor="start">Mesmo conjunto de teste: observados 10, 12, 14 e 16</text><rect x="53" y="139" width="447" height="95" rx="8" fill="#e3eef7" stroke="#4a6272" stroke-width="1.5"/><text x="276" y="175" class="text" text-anchor="middle">SST (referência) = 20</text><text x="276" y="204" class="small" text-anchor="middle">pontos ao quadrado</text><rect x="547" y="139" width="447" height="95" rx="8" fill="#f4e4d0" stroke="#4a6272" stroke-width="1.5"/><text x="770" y="175" class="text" text-anchor="middle">SSE (modelo) = 24</text><text x="770" y="204" class="small" text-anchor="middle">pontos ao quadrado</text><text x="66" y="300" class="title" text-anchor="start">R² = 1 − 24/20 = −0,20</text><text x="66" y="348" class="small" text-anchor="start">O erro quadrático do modelo supera o erro da referência.</text></svg>