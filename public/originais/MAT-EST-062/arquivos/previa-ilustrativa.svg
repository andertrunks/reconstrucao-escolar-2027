<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><title>Prévia editorial MAT-EST-062</title><desc>Cartões de seis evidências divididas entre duas locais, quatro humanas pendentes e duas externas ainda não executadas. Dados fictícios de SANDBOX-057 em rodapé.</desc><rect width="1200" height="680" fill="#f4f7fb"/><rect x="40" y="36" width="1120" height="108" rx="14" fill="#163f58"/><text x="70" y="82" font-family="Arial" fill="white" font-size="25">RECONSTRUÇÃO ESCOLAR · MAT-EST-062</text><text x="70" y="121" font-family="Arial" fill="white" font-size="34" font-weight="bold">Prontidão precisa de evidência</text><rect x="40" y="180" width="350" height="260" rx="14" fill="white" stroke="#4b7d62" stroke-width="3"/><text x="70" y="229" font-family="Arial" font-size="27" font-weight="bold" fill="#315d44">G1–G2</text><text x="70" y="270" font-family="Arial" font-size="22" fill="#203044">Conferidos localmente</text><text x="70" y="322" font-family="Arial" font-size="21" fill="#203044">Cálculo e estrutura</text><text x="70" y="363" font-family="Arial" font-size="19" fill="#566677">Não é aprovação humana.</text><rect x="425" y="180" width="350" height="260" rx="14" fill="white" stroke="#146f9a" stroke-width="3"/><text x="455" y="229" font-family="Arial" font-size="27" font-weight="bold" fill="#146f9a">G3–G6</text><text x="455" y="270" font-family="Arial" font-size="22" fill="#203044">Revisões pendentes</text><text x="455" y="322" font-family="Arial" font-size="21" fill="#203044">Edge, tela, texto, vídeo</text><text x="455" y="363" font-family="Arial" font-size="19" fill="#566677">Sem assinatura inventada.</text><rect x="810" y="180" width="350" height="260" rx="14" fill="white" stroke="#9b3237" stroke-width="3"/><text x="840" y="229" font-family="Arial" font-size="27" font-weight="bold" fill="#9b3237">G7–G8</text><text x="840" y="270" font-family="Arial" font-size="22" fill="#203044">Não executados</text><text x="840" y="322" font-family="Arial" font-size="21" fill="#203044">Deploy e pós-publicação</text><text x="840" y="363" font-family="Arial" font-size="19" fill="#566677">Sem URL nem commit.</text><rect x="40" y="478" width="1120" height="140" rx="14" fill="#e2ebf0"/><text x="70" y="522" font-family="Arial" font-size="25" font-weight="bold" fill="#1f394e">SANDBOX-057 · caso matemático isolado</text><text x="70" y="560" font-family="Arial" font-size="23" fill="#1f394e">8 cartões · 2 avaliáveis · MAE B = 3 · MAE C = 4 unidades</text><text x="70" y="590" font-family="Arial" font-size="18" fill="#53687d">Sem observações futuras; a guarda histórica t19 continua violada.</text><text x="43" y="658" font-family="Arial" font-size="17" fill="#47576a">Composição ilustrativa local; não é imagem do site publicado.</text></svg>