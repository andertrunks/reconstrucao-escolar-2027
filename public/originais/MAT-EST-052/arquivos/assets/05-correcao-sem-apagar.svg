<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc"><title id="title">Figura 5 — Correção por nova versão</title><desc id="desc">Evento inicial e retificação ficam vinculados; a previsão permanece 29, a avaliação anterior é identificada como provisória e a final usa 32.</desc>
