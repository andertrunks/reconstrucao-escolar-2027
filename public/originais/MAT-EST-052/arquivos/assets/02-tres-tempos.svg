<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc"><title id="title">Figura 2 — Marcos temporais distintos</title><desc id="desc">Separação entre período de referência, momento em que o dado ficou disponível e momento de sua revisão.</desc>
<rect width="1440" height="440" fill="#f7f9fc"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="29" fill="#18212d" font-weight="bold">Figura 2 — Marcos temporais distintos</text>
<rect x="40.0" y="104" width="329.5" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="204.8" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Período-alvo</text>
<text x="204.8" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">qual trimestre foi medido</text>
<text x="376.5" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="383.5" y="104" width="329.5" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="548.2" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Prazo devido</text>
<text x="548.2" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">quando era esperado</text>
<text x="720.0" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="727.0" y="104" width="329.5" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="891.8" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Disponível</text>
<text x="891.8" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">quando chegou à análise</text>
<text x="1063.5" y="230" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#18212d">›</text>
<rect x="1070.5" y="104" width="329.5" height="244" rx="15" fill="#ffffff" stroke="#35485c" stroke-width="2"/>
<text x="1235.2" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#18304b">Revisão</text>
<text x="1235.2" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#24313d">versão posterior vinculada</text>
<text x="40" y="404" font-family="Arial,sans-serif" font-size="19" fill="#18212d">O valor de um período pode aparecer depois; a previsão não ganha conhecimento retroativo.</text></svg>