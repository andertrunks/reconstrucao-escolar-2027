<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title description">
<title id="title">Relatório por escopo sem média indevida</title><desc id="description">Histórico tem cinco pares fictícios, t23–t25 não tem observado, sucessor t26–t33 tem zero emissão e observado, sandbox separado tem dois de oito elegíveis.</desc>
<rect width="1040" height="390" fill="#ffffff"/>
<text x="36" y="52" font-size="27" font-family="Arial,sans-serif" fill="#172333" font-weight="bold">Relatório por escopo sem média indevida</text>
<text x="36" y="82" font-size="15" font-family="Arial,sans-serif" fill="#172333">Diagramas ilustrativos, sem dados novos da série principal</text><rect x="34" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="54" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Histórico t18 a t22</text><text x="54" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">5 pares conhecidos / 8 planejados</text><text x="54" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Não promoção no protocolo antigo</text><text x="54" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 1 de 3</text><rect x="378" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="398" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Quarentena e proposta</text><text x="398" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">3 sem observado; 8 propostos</text><text x="398" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Sem métrica nova calculável</text><text x="398" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 2 de 3</text><rect x="722" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="742" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">SANDBOX-057</text><text x="742" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">2 / 8 avaliáveis; 6 pendentes</text><text x="742" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">MAE B 3, C 4 só no exemplo</text><text x="742" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 3 de 3</text></svg>
