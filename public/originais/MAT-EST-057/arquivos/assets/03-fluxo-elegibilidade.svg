<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title description">
<title id="title">Oito tarefas, dois pares, seis pendências</title><desc id="description">Fluxo didático SANDBOX-057: 8 cartões planejados; 2 válidos no corte e 6 com estados diferentes ainda pendentes.</desc>
<rect width="1040" height="390" fill="#ffffff"/>
<text x="36" y="52" font-size="27" font-family="Arial,sans-serif" fill="#172333" font-weight="bold">Oito tarefas, dois pares, seis pendências</text>
<text x="36" y="82" font-size="15" font-family="Arial,sans-serif" fill="#172333">Diagramas ilustrativos, sem dados novos da série principal</text><rect x="34" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="54" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Planejado</text><text x="54" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">8 cartões SANDBOX-057</text><text x="54" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Q01 até Q08</text><text x="54" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 1 de 3</text><rect x="378" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="398" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Avaliação no corte</text><text x="398" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">2 pares elegíveis</text><text x="398" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Denominador do MAE = 2</text><text x="398" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 2 de 3</text><rect x="722" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="742" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Pendências documentadas</text><text x="742" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">6 cartões</text><text x="742" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Não são erros zero</text><text x="742" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 3 de 3</text></svg>
