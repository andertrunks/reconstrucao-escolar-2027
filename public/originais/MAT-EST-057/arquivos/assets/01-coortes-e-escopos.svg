<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title description">
<title id="title">Três coortes com usos diferentes</title><desc id="description">Histórico t18–t22: cinco pares já conhecidos; quarentena t23–t25: sem observado; sucessor proposto t26–t33: oito alvos sem emissão ou observado.</desc>
<rect width="1040" height="390" fill="#ffffff"/>
<text x="36" y="52" font-size="27" font-family="Arial,sans-serif" fill="#172333" font-weight="bold">Três coortes com usos diferentes</text>
<text x="36" y="82" font-size="15" font-family="Arial,sans-serif" fill="#172333">Diagramas ilustrativos, sem dados novos da série principal</text><rect x="34" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="54" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Histórico t18 a t22</text><text x="54" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">Cinco pares fictícios conhecidos</text><text x="54" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Guarda t19 violada</text><text x="54" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 1 de 3</text><rect x="378" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="398" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Quarentena t23 a t25</text><text x="398" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">Três alvos sem observado</text><text x="398" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Não contar como confirmação</text><text x="398" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 2 de 3</text><rect x="722" y="113" rx="12" width="320" height="222" fill="#f3f5f8" stroke="#243548" stroke-width="2"/><text x="742" y="148" font-size="18" fill="#18283a" font-family="Arial,sans-serif" font-weight="bold">Proposta t26 a t33</text><text x="742" y="199" font-size="15" fill="#172333" font-family="Arial,sans-serif">Oito alvos ainda não executados</text><text x="742" y="250" font-size="14" fill="#172333" font-family="Arial,sans-serif">Zero pares avaliáveis</text><text x="742" y="308" font-size="13" fill="#384b5e" font-family="Arial,sans-serif">Bloco 3 de 3</text></svg>
