<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Pesos exponenciais em uma série curta</title><desc id="desc">Os coeficientes da quarta atualização de alfa meio são metade, um quarto, um oitavo e um oitavo na inicialização.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193c4b}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#51636c;stroke-width:2;fill:none}.line{stroke:#147890;stroke-width:3;fill:none}.line2{stroke:#bd6f21;stroke-width:3;fill:none}.pale{fill:#e2f2f5;stroke:#15788b;stroke-width:2}.warm{fill:#fff0d5;stroke:#ad7424;stroke-width:2}.dot{fill:#147890}.bar{fill:#9ad3df;stroke:#16778a;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Pesos exponenciais em uma série curta</text><text x="37" y="91" class="label" text-anchor="start">Pesos no nível l4 com alfa = 0,5 e inicialização l1 = y1</text><text x="37" y="157" class="label" text-anchor="start">y4 = 130</text><rect x="260" y="132" width="250.0" height="37" rx="3" class="warm"/><text x="520.0" y="157" class="label" text-anchor="start">0.500 → 65</text><text x="37" y="235" class="label" text-anchor="start">y3 = 110</text><rect x="260" y="210" width="125.0" height="37" rx="3" class="pale"/><text x="395.0" y="235" class="label" text-anchor="start">0.250 → 27,5</text><text x="37" y="313" class="label" text-anchor="start">y2 = 120</text><rect x="260" y="288" width="62.5" height="37" rx="3" class="pale"/><text x="332.5" y="313" class="label" text-anchor="start">0.125 → 15</text><text x="37" y="391" class="label" text-anchor="start">l1 = 100</text><rect x="260" y="366" width="62.5" height="37" rx="3" class="pale"/><text x="332.5" y="391" class="label" text-anchor="start">0.125 → 12,5</text><text x="43" y="448" class="label" text-anchor="start">Pesos: 1/2 + 1/4 + 1/8 + 1/8 = 1. Resultado ponderado = 120.</text></svg>