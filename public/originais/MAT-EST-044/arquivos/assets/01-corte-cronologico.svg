<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Linha do tempo: separar treino e teste</title><desc id="desc">Doze trimestres fictícios, oito no treinamento e os quatro últimos no teste. Previsões emitidas ao fechar o trimestre oito.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193c4b}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#51636c;stroke-width:2;fill:none}.line{stroke:#147890;stroke-width:3;fill:none}.line2{stroke:#bd6f21;stroke-width:3;fill:none}.pale{fill:#e2f2f5;stroke:#15788b;stroke-width:2}.warm{fill:#fff0d5;stroke:#ad7424;stroke-width:2}.dot{fill:#147890}.bar{fill:#9ad3df;stroke:#16778a;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Linha do tempo: separar treino e teste</text><text x="38" y="92" class="label" text-anchor="start">Observações 1–8: informações conhecidas ao emitir a previsão no final do período 8</text><rect x="30" y="145" width="61" height="100" rx="5" class="pale"/><text x="60" y="179" class="label" text-anchor="middle">t1</text><text x="60" y="215" class="label" text-anchor="middle">90</text><rect x="105" y="145" width="61" height="100" rx="5" class="pale"/><text x="135" y="179" class="label" text-anchor="middle">t2</text><text x="135" y="215" class="label" text-anchor="middle">107</text><rect x="180" y="145" width="61" height="100" rx="5" class="pale"/><text x="210" y="179" class="label" text-anchor="middle">t3</text><text x="210" y="215" class="label" text-anchor="middle">128</text><rect x="255" y="145" width="61" height="100" rx="5" class="pale"/><text x="285" y="179" class="label" text-anchor="middle">t4</text><text x="285" y="215" class="label" text-anchor="middle">105</text><rect x="330" y="145" width="61" height="100" rx="5" class="pale"/><text x="360" y="179" class="label" text-anchor="middle">t5</text><text x="360" y="215" class="label" text-anchor="middle">111</text><rect x="405" y="145" width="61" height="100" rx="5" class="pale"/><text x="435" y="179" class="label" text-anchor="middle">t6</text><text x="435" y="215" class="label" text-anchor="middle">124</text><rect x="480" y="145" width="61" height="100" rx="5" class="pale"/><text x="510" y="179" class="label" text-anchor="middle">t7</text><text x="510" y="215" class="label" text-anchor="middle">150</text><rect x="555" y="145" width="61" height="100" rx="5" class="pale"/><text x="585" y="179" class="label" text-anchor="middle">t8</text><text x="585" y="215" class="label" text-anchor="middle">127</text><rect x="630" y="145" width="61" height="100" rx="5" class="warm"/><text x="660" y="179" class="label" text-anchor="middle">t9</text><text x="660" y="215" class="label" text-anchor="middle">129</text><rect x="705" y="145" width="61" height="100" rx="5" class="warm"/><text x="735" y="179" class="label" text-anchor="middle">t10</text><text x="735" y="215" class="label" text-anchor="middle">145</text><rect x="780" y="145" width="61" height="100" rx="5" class="warm"/><text x="810" y="179" class="label" text-anchor="middle">t11</text><text x="810" y="215" class="label" text-anchor="middle">171</text><rect x="855" y="145" width="61" height="100" rx="5" class="warm"/><text x="885" y="179" class="label" text-anchor="middle">t12</text><text x="885" y="215" class="label" text-anchor="middle">144</text><rect x="100" y="302" width="435" height="62" rx="9" class="pale"/><text x="318" y="340" class="label" text-anchor="middle">Treino: oito trimestres conhecidos</text><rect x="643" y="302" width="247" height="62" rx="9" class="warm"/><text x="767" y="340" class="label" text-anchor="middle">Teste: quatro futuros</text><text x="40" y="431" class="small" text-anchor="start">Protocolo ideal: fixar modelo e parâmetros antes do teste. Aqui, a janela é didática e já conhecida.</text></svg>