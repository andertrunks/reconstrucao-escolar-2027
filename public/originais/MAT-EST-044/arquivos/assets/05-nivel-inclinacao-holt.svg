<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Holt: duas variáveis de estado</title><desc id="desc">Estado treinado no período oito, nível 145,4434, tendência 8,3609; previsão de um período 153,8043 e de quatro 178,8870.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193c4b}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#51636c;stroke-width:2;fill:none}.line{stroke:#147890;stroke-width:3;fill:none}.line2{stroke:#bd6f21;stroke-width:3;fill:none}.pale{fill:#e2f2f5;stroke:#15788b;stroke-width:2}.warm{fill:#fff0d5;stroke:#ad7424;stroke-width:2}.dot{fill:#147890}.bar{fill:#9ad3df;stroke:#16778a;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Holt: duas variáveis de estado</text><text x="36" y="93" class="label" text-anchor="start">Método linear de Holt: nível + inclinação estimada no próprio treino</text><rect x="65" y="142" width="357" height="105" rx="9" class="pale"/><text x="243" y="177" class="label" text-anchor="middle">Nível no t8</text><text x="243" y="215" class="title" text-anchor="middle">145.4434</text><rect x="525" y="142" width="357" height="105" rx="9" class="pale"/><text x="703" y="177" class="label" text-anchor="middle">Inclinação no t8</text><text x="703" y="215" class="title" text-anchor="middle">8.3609</text><rect x="174" y="299" width="615" height="75" rx="9" class="warm"/><text x="480" y="327" class="label" text-anchor="middle">Previsão de h períodos = nível + h × inclinação</text><text x="480" y="353" class="small" text-anchor="middle">h = 1: 153,8043 | h = 4: 178,8870</text></svg>