<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Atualização da suavização exponencial simples</title><desc id="desc">Quatro observações hipotéticas 100, 120, 110 e 130, alfa meio e níveis 100, 110, 110 e 120.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193c4b}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#51636c;stroke-width:2;fill:none}.line{stroke:#147890;stroke-width:3;fill:none}.line2{stroke:#bd6f21;stroke-width:3;fill:none}.pale{fill:#e2f2f5;stroke:#15788b;stroke-width:2}.warm{fill:#fff0d5;stroke:#ad7424;stroke-width:2}.dot{fill:#147890}.bar{fill:#9ad3df;stroke:#16778a;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Atualização da suavização exponencial simples</text><text x="42" y="95" class="label" text-anchor="start">Dados sem tendência sazonal para uma conta inicial: 100, 120, 110, 130</text><rect x="38" y="151" width="202" height="113" rx="9" class="pale"/><text x="139" y="183" class="label" text-anchor="middle">Período 1</text><text x="139" y="211" class="label" text-anchor="middle">y = 100</text><text x="139" y="239" class="label" text-anchor="middle">nível = 100</text><rect x="266" y="151" width="202" height="113" rx="9" class="pale"/><text x="367" y="183" class="label" text-anchor="middle">Período 2</text><text x="367" y="211" class="label" text-anchor="middle">y = 120</text><text x="367" y="239" class="label" text-anchor="middle">nível = 110</text><rect x="494" y="151" width="202" height="113" rx="9" class="pale"/><text x="595" y="183" class="label" text-anchor="middle">Período 3</text><text x="595" y="211" class="label" text-anchor="middle">y = 110</text><text x="595" y="239" class="label" text-anchor="middle">nível = 110</text><rect x="722" y="151" width="202" height="113" rx="9" class="warm"/><text x="823" y="183" class="label" text-anchor="middle">Período 4</text><text x="823" y="211" class="label" text-anchor="middle">y = 130</text><text x="823" y="239" class="label" text-anchor="middle">nível = 120</text><rect x="178" y="324" width="604" height="69" rx="9" class="warm"/><text x="480" y="349" class="label" text-anchor="middle">Nível final = 0,5 × 130 + 0,5 × 110 = 120</text><text x="480" y="374" class="label" text-anchor="middle">Previsão no quinto período: 120</text></svg>