<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Decomposição aditiva construída: T + S + R</title><desc id="desc">Quadro dos quatro primeiros trimestres com tendência, sazonalidade, restante e soma observada.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173449}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#485a67;stroke-width:2;fill:none}.line{stroke:#14758f;stroke-width:3;fill:none}.line2{stroke:#b56c16;stroke-width:3;fill:none}.pale{fill:#dbeef1;stroke:#13788c;stroke-width:2}.warm{fill:#f9edce;stroke:#a66d17;stroke-width:2}.dot{fill:#14758f}.bar{fill:#9ad4de;stroke:#16788b;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Decomposição aditiva construída: T + S + R</text><text x="35" y="84" class="small" text-anchor="start">Cada coluna representa um trimestre, da fase 1 à fase 4</text><rect x="138" y="101" width="145" height="50" rx="10" class="pale"/><text x="210" y="133" class="label" text-anchor="middle">T1</text><rect x="338" y="101" width="145" height="50" rx="10" class="pale"/><text x="410" y="133" class="label" text-anchor="middle">T2</text><rect x="538" y="101" width="145" height="50" rx="10" class="pale"/><text x="610" y="133" class="label" text-anchor="middle">T3</text><rect x="738" y="101" width="145" height="50" rx="10" class="pale"/><text x="810" y="133" class="label" text-anchor="middle">T4</text><text x="29" y="203" class="label" text-anchor="start">Tendência T</text><rect x="138" y="175" width="145" height="42" rx="8" class="pale"/><text x="210" y="202" class="label" text-anchor="middle">100</text><rect x="338" y="175" width="145" height="42" rx="8" class="pale"/><text x="410" y="202" class="label" text-anchor="middle">105</text><rect x="538" y="175" width="145" height="42" rx="8" class="pale"/><text x="610" y="202" class="label" text-anchor="middle">110</text><rect x="738" y="175" width="145" height="42" rx="8" class="pale"/><text x="810" y="202" class="label" text-anchor="middle">115</text><text x="29" y="265" class="label" text-anchor="start">Sazonal S</text><rect x="138" y="237" width="145" height="42" rx="8" class="pale"/><text x="210" y="264" class="label" text-anchor="middle">-10</text><rect x="338" y="237" width="145" height="42" rx="8" class="pale"/><text x="410" y="264" class="label" text-anchor="middle">+0</text><rect x="538" y="237" width="145" height="42" rx="8" class="pale"/><text x="610" y="264" class="label" text-anchor="middle">+20</text><rect x="738" y="237" width="145" height="42" rx="8" class="pale"/><text x="810" y="264" class="label" text-anchor="middle">-10</text><text x="29" y="327" class="label" text-anchor="start">Restante R</text><rect x="138" y="299" width="145" height="42" rx="8" class="pale"/><text x="210" y="326" class="label" text-anchor="middle">+0</text><rect x="338" y="299" width="145" height="42" rx="8" class="pale"/><text x="410" y="326" class="label" text-anchor="middle">+2</text><rect x="538" y="299" width="145" height="42" rx="8" class="pale"/><text x="610" y="326" class="label" text-anchor="middle">-2</text><rect x="738" y="299" width="145" height="42" rx="8" class="pale"/><text x="810" y="326" class="label" text-anchor="middle">+0</text><text x="29" y="389" class="label" text-anchor="start">Observado y</text><rect x="138" y="361" width="145" height="42" rx="8" class="warm"/><text x="210" y="388" class="label" text-anchor="middle">90</text><rect x="338" y="361" width="145" height="42" rx="8" class="warm"/><text x="410" y="388" class="label" text-anchor="middle">107</text><rect x="538" y="361" width="145" height="42" rx="8" class="warm"/><text x="610" y="388" class="label" text-anchor="middle">128</text><rect x="738" y="361" width="145" height="42" rx="8" class="warm"/><text x="810" y="388" class="label" text-anchor="middle">105</text><text x="35" y="457" class="small" text-anchor="start">Cada coluna satisfaz y = T + S + R; componentes conhecidos porque criamos os dados.</text></svg>