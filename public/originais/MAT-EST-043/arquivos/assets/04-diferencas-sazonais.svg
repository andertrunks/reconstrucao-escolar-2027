<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Diferença sazonal: pares com quatro períodos de distância</title><desc id="desc">Quadro dos doze dados trimestrais, alinhando a mesma fase nos três anos e exibindo oito diferenças sazonais.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173449}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#485a67;stroke-width:2;fill:none}.line{stroke:#14758f;stroke-width:3;fill:none}.line2{stroke:#b56c16;stroke-width:3;fill:none}.pale{fill:#dbeef1;stroke:#13788c;stroke-width:2}.warm{fill:#f9edce;stroke:#a66d17;stroke-width:2}.dot{fill:#14758f}.bar{fill:#9ad4de;stroke:#16788b;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Diferença sazonal: pares com quatro períodos de distância</text><text x="35" y="87" class="label" text-anchor="start">Comparar trimestre com o mesmo trimestre do ano anterior: atraso m = 4</text><text x="41" y="132" class="small" text-anchor="start">Fase</text><text x="169" y="132" class="small" text-anchor="start">Ano 1</text><text x="290" y="132" class="small" text-anchor="start">Ano 2</text><text x="416" y="132" class="small" text-anchor="start">Ano 2 − Ano 1</text><text x="645" y="132" class="small" text-anchor="start">Ano 3</text><text x="766" y="132" class="small" text-anchor="start">Ano 3 − Ano 2</text><rect x="26" y="154" width="910" height="51" rx="5" class="pale"/><text x="41" y="184" class="label" text-anchor="start">T1</text><text x="169" y="184" class="label" text-anchor="start">90</text><text x="290" y="184" class="label" text-anchor="start">111</text><text x="416" y="184" class="label" text-anchor="start">21</text><text x="645" y="184" class="label" text-anchor="start">129</text><text x="766" y="184" class="label" text-anchor="start">18</text><rect x="26" y="216" width="910" height="51" rx="5" class="pale"/><text x="41" y="246" class="label" text-anchor="start">T2</text><text x="169" y="246" class="label" text-anchor="start">107</text><text x="290" y="246" class="label" text-anchor="start">124</text><text x="416" y="246" class="label" text-anchor="start">17</text><text x="645" y="246" class="label" text-anchor="start">145</text><text x="766" y="246" class="label" text-anchor="start">21</text><rect x="26" y="278" width="910" height="51" rx="5" class="warm"/><text x="41" y="308" class="label" text-anchor="start">T3</text><text x="169" y="308" class="label" text-anchor="start">128</text><text x="290" y="308" class="label" text-anchor="start">150</text><text x="416" y="308" class="label" text-anchor="start">22</text><text x="645" y="308" class="label" text-anchor="start">171</text><text x="766" y="308" class="label" text-anchor="start">21</text><rect x="26" y="340" width="910" height="51" rx="5" class="pale"/><text x="41" y="370" class="label" text-anchor="start">T4</text><text x="169" y="370" class="label" text-anchor="start">105</text><text x="290" y="370" class="label" text-anchor="start">127</text><text x="416" y="370" class="label" text-anchor="start">22</text><text x="645" y="370" class="label" text-anchor="start">144</text><text x="766" y="370" class="label" text-anchor="start">17</text><text x="35" y="460" class="small" text-anchor="start">Sazonalidade fixa cancela na subtração; a tendência e a diferença dos restantes podem permanecer.</text></svg>