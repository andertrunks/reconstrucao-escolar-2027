<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Média móvel centrada de ordem quatro</title><desc id="desc">Duas médias de blocos consecutivos de quatro períodos centradas no período três, gerando 110,125.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173449}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#485a67;stroke-width:2;fill:none}.line{stroke:#14758f;stroke-width:3;fill:none}.line2{stroke:#b56c16;stroke-width:3;fill:none}.pale{fill:#dbeef1;stroke:#13788c;stroke-width:2}.warm{fill:#f9edce;stroke:#a66d17;stroke-width:2}.dot{fill:#14758f}.bar{fill:#9ad4de;stroke:#16788b;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Média móvel centrada de ordem quatro</text><text x="30" y="85" class="label" text-anchor="start">Janela 1 (trimestres 1–4): 90, 107, 128, 105</text><rect x="65" y="111" width="350" height="75" rx="10" class="pale"/><text x="240" y="156" class="title" text-anchor="middle">média = 107,5</text><text x="30" y="226" class="label" text-anchor="start">Janela 2 (trimestres 2–5): 107, 128, 105, 111</text><rect x="65" y="252" width="350" height="75" rx="10" class="pale"/><text x="240" y="298" class="title" text-anchor="middle">média = 112,75</text><rect x="510" y="164" width="375" height="125" rx="10" class="warm"/><text x="698" y="204" class="label" text-anchor="middle">centro no período 3</text><text x="698" y="252" class="label" text-anchor="middle">(107,5 + 112,75)/2 = 110,125</text><text x="33" y="401" class="small" text-anchor="start">Exige o período 5: só pode ser calculada retrospectivamente ao período 3.</text><text x="33" y="438" class="small" text-anchor="start">É uma estimativa suavizada, não o T conhecido por construção (T3 = 110).</text></svg>