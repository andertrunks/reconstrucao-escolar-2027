<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Treino cronológico e teste futuro separado</title><desc id="desc">Oito primeiros trimestres formam o treino; quatro últimos são reservados para comparar previsões emitidas ao final do oitavo período.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173449}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.fine{font-size:12px}.axis{stroke:#485a67;stroke-width:2;fill:none}.line{stroke:#14758f;stroke-width:3;fill:none}.line2{stroke:#b56c16;stroke-width:3;fill:none}.pale{fill:#dbeef1;stroke:#13788c;stroke-width:2}.warm{fill:#f9edce;stroke:#a66d17;stroke-width:2}.dot{fill:#14758f}.bar{fill:#9ad4de;stroke:#16788b;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start">Treino cronológico e teste futuro separado</text><text x="35" y="85" class="label" text-anchor="start">Origem da previsão: final do período 8</text><rect x="39" y="135" width="59" height="83" rx="5" class="pale"/><text x="68" y="167" class="label" text-anchor="middle">1</text><text x="68" y="191" class="small" text-anchor="middle">90</text><rect x="113" y="135" width="59" height="83" rx="5" class="pale"/><text x="142" y="167" class="label" text-anchor="middle">2</text><text x="142" y="191" class="small" text-anchor="middle">107</text><rect x="187" y="135" width="59" height="83" rx="5" class="pale"/><text x="216" y="167" class="label" text-anchor="middle">3</text><text x="216" y="191" class="small" text-anchor="middle">128</text><rect x="261" y="135" width="59" height="83" rx="5" class="pale"/><text x="290" y="167" class="label" text-anchor="middle">4</text><text x="290" y="191" class="small" text-anchor="middle">105</text><rect x="335" y="135" width="59" height="83" rx="5" class="pale"/><text x="364" y="167" class="label" text-anchor="middle">5</text><text x="364" y="191" class="small" text-anchor="middle">111</text><rect x="409" y="135" width="59" height="83" rx="5" class="pale"/><text x="438" y="167" class="label" text-anchor="middle">6</text><text x="438" y="191" class="small" text-anchor="middle">124</text><rect x="483" y="135" width="59" height="83" rx="5" class="pale"/><text x="512" y="167" class="label" text-anchor="middle">7</text><text x="512" y="191" class="small" text-anchor="middle">150</text><rect x="557" y="135" width="59" height="83" rx="5" class="pale"/><text x="586" y="167" class="label" text-anchor="middle">8</text><text x="586" y="191" class="small" text-anchor="middle">127</text><rect x="631" y="135" width="59" height="83" rx="5" class="warm"/><text x="660" y="167" class="label" text-anchor="middle">9</text><text x="660" y="191" class="small" text-anchor="middle">129</text><rect x="705" y="135" width="59" height="83" rx="5" class="warm"/><text x="734" y="167" class="label" text-anchor="middle">10</text><text x="734" y="191" class="small" text-anchor="middle">145</text><rect x="779" y="135" width="59" height="83" rx="5" class="warm"/><text x="808" y="167" class="label" text-anchor="middle">11</text><text x="808" y="191" class="small" text-anchor="middle">171</text><rect x="853" y="135" width="59" height="83" rx="5" class="warm"/><text x="882" y="167" class="label" text-anchor="middle">12</text><text x="882" y="191" class="small" text-anchor="middle">144</text><rect x="115" y="268" width="440" height="72" rx="10" class="pale"/><text x="335" y="300" class="label" text-anchor="middle">Treino: períodos 1–8</text><text x="335" y="325" class="small" text-anchor="middle">Deslocamento histórico: 20,5</text><rect x="620" y="268" width="270" height="72" rx="10" class="warm"/><text x="755" y="300" class="label" text-anchor="middle">Teste: períodos 9–12</text><text x="755" y="325" class="small" text-anchor="middle">Não escolher após ver</text><text x="42" y="421" class="small" text-anchor="start">Todos os quatro valores são previstos a partir do mesmo corte, sem consultar o teste.</text></svg>