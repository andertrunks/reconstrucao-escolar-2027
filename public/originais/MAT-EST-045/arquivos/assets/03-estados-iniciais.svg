<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Estados iniciais e previsão sem vazamento</title><desc id="desc">Os três estados iniciais do Holt-Winters aditivo e os parâmetros didáticos; previsão t5 emitida antes de conhecer y5.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193948}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#4b636f;stroke-width:2;fill:none}.blue{stroke:#126c87;stroke-width:3;fill:none}.orange{stroke:#aa6718;stroke-width:3;fill:none}.green{stroke:#37785d;stroke-width:3;fill:none}.pale{fill:#e4f1f6;stroke:#17758c;stroke-width:1.5}.warm{fill:#fff0d9;stroke:#a66b22;stroke-width:1.5}.neutral{fill:#eef0f2;stroke:#73848d;stroke-width:1.5}.circleblue{fill:#126c87}.circleorange{fill:#aa6718}.circlegreen{fill:#37785d}.gridline{stroke:#e0e6e9;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" text-anchor="start" class="title">Estados iniciais e previsão sem vazamento</text><text x="34" y="84" text-anchor="start" class="label">Escolha ilustrativa: alfa = 0,3; beta* = 0,2; gama = 0,2; m = 4.</text><rect x="39" y="137" width="282" height="166" rx="8" class="pale"/><text x="180" y="181" text-anchor="middle" class="label">Nível l4</text><text x="180" y="221" text-anchor="middle" class="label">115</text><text x="180" y="262" text-anchor="middle" class="small">escala central no período 4</text><rect x="348" y="137" width="282" height="166" rx="8" class="pale"/><text x="489" y="181" text-anchor="middle" class="label">Tendência b4</text><text x="489" y="221" text-anchor="middle" class="label">5</text><text x="489" y="262" text-anchor="middle" class="small">unidades por trimestre</text><rect x="657" y="137" width="282" height="166" rx="8" class="warm"/><text x="798" y="181" text-anchor="middle" class="label">Índices s1...s4</text><text x="798" y="221" text-anchor="middle" class="label">−10; 2; 18; −10</text><text x="798" y="262" text-anchor="middle" class="small">efeitos das fases do ano</text><text x="38" y="374" text-anchor="start" class="label">Previsão antes de t5: l4 + b4 + s1 = 115 + 5 − 10 = 110 unidades.</text><text x="38" y="415" text-anchor="start" class="small">O observado t5 = 111 só entra na atualização após a previsão de 110.</text></svg>