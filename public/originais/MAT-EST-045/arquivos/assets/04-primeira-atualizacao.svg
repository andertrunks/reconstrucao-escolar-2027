<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Atualização completa do quinto período</title><desc id="desc">Três equações de Holt-Winters aditivo calculadas a partir de t4 e observação 111.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193948}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#4b636f;stroke-width:2;fill:none}.blue{stroke:#126c87;stroke-width:3;fill:none}.orange{stroke:#aa6718;stroke-width:3;fill:none}.green{stroke:#37785d;stroke-width:3;fill:none}.pale{fill:#e4f1f6;stroke:#17758c;stroke-width:1.5}.warm{fill:#fff0d9;stroke:#a66b22;stroke-width:1.5}.neutral{fill:#eef0f2;stroke:#73848d;stroke-width:1.5}.circleblue{fill:#126c87}.circleorange{fill:#aa6718}.circlegreen{fill:#37785d}.gridline{stroke:#e0e6e9;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" text-anchor="start" class="title">Atualização completa do quinto período</text><text x="33" y="84" text-anchor="start" class="label">A previsão t5 é 110; a observação que chega é 111.</text><rect x="34" y="118" width="900" height="83" rx="8" class="pale"/><text x="48" y="149" text-anchor="start" class="label">Nível l5</text><text x="275" y="149" text-anchor="start" class="small">0,3 × (111 − (−10)) + 0,7 × (115 + 5)</text><text x="840" y="149" text-anchor="start" class="label">120,3</text><text x="48" y="178" text-anchor="start" class="tiny">Mesma convenção FPP3 em toda a aula</text><rect x="34" y="221" width="900" height="83" rx="8" class="pale"/><text x="48" y="252" text-anchor="start" class="label">Tendência b5</text><text x="275" y="252" text-anchor="start" class="small">0,2 × (120,3 − 115) + 0,8 × 5</text><text x="840" y="252" text-anchor="start" class="label">5,06</text><text x="48" y="281" text-anchor="start" class="tiny">Mesma convenção FPP3 em toda a aula</text><rect x="34" y="324" width="900" height="83" rx="8" class="warm"/><text x="48" y="355" text-anchor="start" class="label">Sazonal s5</text><text x="275" y="355" text-anchor="start" class="small">0,2 × (111 − 115 − 5) + 0,8 × (−10)</text><text x="840" y="355" text-anchor="start" class="label">−9,8</text><text x="48" y="384" text-anchor="start" class="tiny">Sazonalidade antiga: trimestre equivalente t1</text><text x="36" y="453" text-anchor="start" class="small">A atualização de sazonalidade usa o estado previsto ANTERIOR, não o nível novo.</text></svg>