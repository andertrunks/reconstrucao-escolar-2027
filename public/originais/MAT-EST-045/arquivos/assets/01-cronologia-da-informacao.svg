<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Linha do tempo: origem de cada informação</title><desc id="desc">Os 12 trimestres fictícios: t1–t4 para iniciar estados, t5–t8 para atualizações e t9–t12 apenas comparação didática.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193948}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#4b636f;stroke-width:2;fill:none}.blue{stroke:#126c87;stroke-width:3;fill:none}.orange{stroke:#aa6718;stroke-width:3;fill:none}.green{stroke:#37785d;stroke-width:3;fill:none}.pale{fill:#e4f1f6;stroke:#17758c;stroke-width:1.5}.warm{fill:#fff0d9;stroke:#a66b22;stroke-width:1.5}.neutral{fill:#eef0f2;stroke:#73848d;stroke-width:1.5}.circleblue{fill:#126c87}.circleorange{fill:#aa6718}.circlegreen{fill:#37785d}.gridline{stroke:#e0e6e9;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" text-anchor="start" class="title">Linha do tempo: origem de cada informação</text><text x="36" y="91" text-anchor="start" class="label">O calendário define quais informações existem no momento de cada cálculo.</text><rect x="33" y="139" width="64" height="112" rx="8" class="pale"/><text x="65" y="170" text-anchor="middle" class="label">t1</text><text x="65" y="210" text-anchor="middle" class="label">90</text><rect x="108" y="139" width="64" height="112" rx="8" class="pale"/><text x="140" y="170" text-anchor="middle" class="label">t2</text><text x="140" y="210" text-anchor="middle" class="label">107</text><rect x="183" y="139" width="64" height="112" rx="8" class="pale"/><text x="215" y="170" text-anchor="middle" class="label">t3</text><text x="215" y="210" text-anchor="middle" class="label">128</text><rect x="258" y="139" width="64" height="112" rx="8" class="pale"/><text x="290" y="170" text-anchor="middle" class="label">t4</text><text 