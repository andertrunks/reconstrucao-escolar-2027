<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Inicialização: retirada da inclinação</title><desc id="desc">Da primeira série de 90,107,128,105, retirar cinco unidades por passo e centralizar os valores corrigidos na média 100.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193948}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.tiny{font-size:12px}.axis{stroke:#4b636f;stroke-width:2;fill:none}.blue{stroke:#126c87;stroke-width:3;fill:none}.orange{stroke:#aa6718;stroke-width:3;fill:none}.green{stroke:#37785d;stroke-width:3;fill:none}.pale{fill:#e4f1f6;stroke:#17758c;stroke-width:1.5}.warm{fill:#fff0d9;stroke:#a66b22;stroke-width:1.5}.neutral{fill:#eef0f2;stroke:#73848d;stroke-width:1.5}.circleblue{fill:#126c87}.circleorange{fill:#aa6718}.circlegreen{fill:#37785d}.gridline{stroke:#e0e6e9;stroke-width:1}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" text-anchor="start" class="title">Inicialização: retirada da inclinação</text><text x="30" y="84" text-anchor="start" class="label">Subtrair 5 unidades por trimestre dos quatro primeiros valores.</text><rect x="46" y="120" width="196" height="221" rx="8" class="pale"/><text x="144" y="158" text-anchor="middle" class="label">Trimestre 1</text><text x="144" y="198" text-anchor="middle" class="label">y = 90</text><text x="144" y="233" text-anchor="middle" class="small">y − 5 × 0 = 90</text><text x="144" y="276" text-anchor="middle" class="label">s = -10</text><rect x="270" y="120" width="196" height="221" rx="8" class="pale"/><text x="368" y="158" text-anchor="middle" class="label">Trimestre 2</text><text x="368" y="198" text-anchor="middle" class="label">y = 107</text><text x="368" y="233" text-anchor="middle" class="small">y − 5 × 1 = 102</text><text x="368" y="276" text-anchor="middle" class="label">s = +2</text><rect x="494" y="120" width="196" height="221" rx="8" class="pale"/><text x="592" y="158" text-anchor="middle" class="label">Trimestre 3</text><text x="592" y="198" text-anchor="middle" class="label">y = 128</text><text x="592" y="233" text-anchor="middle" class="small">y − 5 × 2 = 118</text><text x="592" y="276" text-anchor="middle" class="label">s = +18</text><rect x="718" y="120" width="196" height="221" rx="8" class="pale"/><text x="816" y="158" text-anchor="middle" class="label">Trimestre 4</text><text x="816" y="198" text-anchor="middle" class="label">y = 105</text><text x="816" y="233" text-anchor="middle" class="small">y − 5 × 3 = 90</text><text x="816" y="276" text-anchor="middle" class="label">s = -10</text><rect x="234" y="371" width="492" height="53" rx="8" class="warm"/><text x="480" y="403" text-anchor="middle" class="label">Média sem tendência: 100; soma dos quatro s = zero</text></svg>