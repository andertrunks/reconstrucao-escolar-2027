<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">MAT-EST-064 — análise pós-incidente didática</title><desc id="desc">Amostra de oito cartões, dois avaliáveis; MAE B igual a 3 e MAE C igual a 4; hipóteses causais não comprovadas; seis testes locais em fixtures e aprovação humana pendente.</desc><rect width="1280" height="720" rx="20" fill="#eef4f8"/><rect x="0" y="0" width="1280" height="172" rx="18" fill="#193d58"/><text x="47" y="71" font-family="Arial,sans-serif" fill="white" font-weight="bold" font-size="35">MAT-EST-064 — Análise pós-incidente</text><text x="48" y="116" font-family="Arial,sans-serif" fill="#e7f3fa" font-size="21">Prévia editorial ilustrativa, sem incidente ou publicação real</text><rect x="48" y="205" width="565" height="348" rx="15" fill="white" stroke="#a5c1d2"/><text x="72" y="256" fill="#173b54" font-family="Arial" font-size="26" font-weight="bold">SANDBOX-057 isolado</text><text x="72" y="303" fill="#173b54" font-family="Arial" font-size="22">2 avaliáveis / 8 planejados · 6 pendências</text><text x="72" y="355" fill="#236a4b" font-family="Arial" font-size="25">MAE B: 6 ÷ 2 = 3 unidades</text><text x="72" y="398" fill="#9a3339" font-family="Arial" font-size="22">I01: 6 ÷ 8 = 0,75 (inválido como MAE)</text><text x="72" y="442" fill="#173b54" font-family="Arial" font-size="20">Diferença: 2,25 unidades</text><text x="72" y="488" fill="#173b54" font-family="Arial" font-size="20">Completude: 2 ÷ 8 = 25%</text><rect x="636" y="205" width="595" height="348" rx="15" fill="white" stroke="#a5c1d2"/><text x="663" y="256" fill="#173b54" font-family="Arial" font-size="26" font-weight="bold">Prevenção editorial autoral</text><text x="663" y="306" fill="#173b54" font-family="Arial" font-size="20">H64: 6 hipóteses, não causas comprovadas</text><text x="663" y="349" fill="#236a4b" font-family="Arial" font-size="20">A64-01 a 06: apenas testes locais</text><text x="663" y="391" fill="#9a6421" font-family="Arial" font-size="20">A64-07: governança ainda proposta</text><text x="663" y="433" fill="#9a6421" font-family="Arial" font-size="20">G3–G6: pendentes de revisão humana</text><text x="663" y="475" fill="#9a3339" font-family="Arial" font-size="20">G7/G8: não executados</text><rect x="48" y="590" width="1183" height="70" rx="12" fill="#dce7ee"/><text x="74" y="630" font-family="Arial" fill="#173b54" font-size="21">t23–t33 sem novos alvos observados · Histórico imutável · Progresso não alterado</text></svg>