<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 940 370" width="940" height="370"><title id="t">Limites aritméticos hipotéticos, não intervalos de confiança</title><desc id="d">Sob hipótese artificial de erro absoluto de zero a dez nos seis casos pendentes, MAE B entre 0,75 e 8,25 e C entre 1 e 8,5, faixas sobrepostas. Não são intervalos de confiança.</desc><rect width="940" height="370" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172634"><text x="25" y="35" font-size="20" fill="#16324f" font-weight="bold" text-anchor="start">Somente se os seis erros pendentes de cada modelo forem de 0 a 10</text><line x1="150.0" y1="75" x2="150.0" y2="288" stroke="#d9e4ed" stroke-width="1" /><text x="150.0" y="311" font-size="14" fill="#172634" font-weight="normal" text-anchor="middle">0</text><line x1="262.0" y1="75" x2="262.0" y2="288" stroke="#d9e4ed" stroke-width="1" /><text x="262.0" y="311" font-size="14" fill="#172634" font-weight="normal" text-anchor="middle">2</text><line x1="374.0" y1="75" x2="374.0" y2="288" stroke="#d9e4ed" stroke-width="1" /><text x="374.0" y="311" font-size="14" fill="#172634" font-weight="normal" text-anchor="middle">4</text><line x1="486.0" y1="75" x2="486.0" y2="288" stroke="#d9e4ed" stroke-width="1" /><text x="486.0" y="311" font-size="14" fill="#172634" font-weight="normal" text-anchor="middle">6</text><line x1="598.0" y1="75" x2="598.0" y2="288" stroke="#d9e4ed" stroke-width="1" /><text x="598.0" y="311" font-size="14" fill="#172634" font-weight="normal" text-anchor="middle">8</text><line x1="710.0" y1="75" x2="710.0" y2="288" stroke="#d9e4ed" stroke-width="1" /><text x="710.0" y="311" font-size="14" fill="#172634" font-weight="normal" text-anchor="middle">10</text><text x="430" y="343" font-size="15" fill="#172634" font-weight="normal" text-anchor="middle">Eixo horizontal: MAE hipotético, em unidades (escala 0 a 10)</text><text x="55" y="149" font-size="21" fill="#16324f" font-weight="bold" text-anchor="start">B</text><rect x="192.0" y="131" width="420.0" height="27" rx="7" fill="#087e80" stroke="none"/><text x="192.0" y="119" font-size="16" fill="#172634" font-weight="normal" text-anchor="middle">0,75</text><text x="612.0" y="119" font-size="16" fill="#172634" font-weight="normal" text-anchor="middle">8,25</text><text x="55" y="237" font-size="21" fill="#16324f" font-weight="bold" text-anchor="start">C</text><rect x="206.0" y="219" width="420.0" height="27" rx="7" fill="#af5d12" stroke="none"/><text x="206.0" y="207" font-size="16" fill="#172634" font-weight="normal" text-anchor="middle">1</text><text x="626.0" y="207" font-size="16" fill="#172634" font-weight="normal" text-anchor="middle">8,5</text><text x="741" y="143" font-size="17" fill="#af5d12" font-weight="bold" text-anchor="start">Não é IC</text><text x="741" y="163" font-size="17" fill="#af5d12" font-weight="bold" text-anchor="start">de 95%</text><text x="741" y="231" font-size="17" fill="#3d5266" font-weight="normal" text-anchor="start">Premissa</text><text x="741" y="251" font-size="17" fill="#3d5266" font-weight="normal" text-anchor="start">não testada</text></g></svg>