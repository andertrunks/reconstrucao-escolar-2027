<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 940 370" width="940" height="370"><title id="t">Escopos distintos: avaliáveis e pendências</title><desc id="d">Quatro barras com escala de zero ao total de cada conjunto: histórico cinco de oito, quarentena zero de três, sucessor zero de oito e sandbox dois de oito. Não combinar estatísticas dos grupos.</desc><rect width="940" height="370" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172634"><text x="25" y="35" font-size="21" fill="#16324f" font-weight="bold" text-anchor="start">Quatro escopos editoriais · quantidades, não métricas misturadas</text><text x="30" y="84" font-size="16" fill="#172634" font-weight="normal" text-anchor="start">Histórico 049</text><rect x="260" y="67" width="400" height="24" rx="7" fill="#dce6ed" stroke="none"/><rect x="260" y="67" width="250.0" height="24" rx="7" fill="#087e80" stroke="none"/><text x="680" y="84" font-size="15" fill="#172634" font-weight="normal" text-anchor="start">5 avaliáveis / 3 restantes</text><text x="30" y="150" font-size="16" fill="#172634" font-weight="normal" text-anchor="start">Quarentena t23–t25</text><rect x="260" y="133" width="400" height="24" rx="7" fill="#dce6ed" stroke="none"/><rect x="260" y="133" width="0.0" height="24" rx="7" fill="#087e80" stroke="none"/><text x="680" y="150" font-size="15" fill="#172634" font-weight="normal" text-anchor="start">0 / 3, sem observado</text><text x="30" y="216" font-size="16" fill="#172634" font-weight="normal" text-anchor="start">Sucessor t26–t33</text><rect x="260" y="199" width="400" height="24" rx="7" fill="#dce6ed" stroke="none"/><rect x="260" y="199" width="0.0" height="24" rx="7" fill="#087e80" stroke="none"/><text x="680" y="216" font-size="15" fill="#172634" font-weight="normal" text-anchor="start">0 / 8, só proposta</text><text x="30" y="282" font-size="16" fill="#172634" font-weight="normal" text-anchor="start">SANDBOX-057</text><rect x="260" y="265" width="400" height="24" rx="7" fill="#dce6ed" stroke="none"/><rect x="260" y="265" width="100.0" height="24" rx="7" fill="#087e80" stroke="none"/><text x="680" y="282" font-size="15" fill="#172634" font-weight="normal" text-anchor="start">2 / 8, exercício isolado</text><text x="26" y="349" font-size="14" fill="#3d5266" font-weight="normal" text-anchor="start">A parte escura indica pares avaliáveis no respectivo conjunto; não implica comparabilidade entre coortes.</text></g></svg>