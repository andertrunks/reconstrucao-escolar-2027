<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 940 370" width="940" height="370"><title id="t">MAE e custo separados em painéis com base zero</title><desc id="d">Painel MAE: B três, C quatro unidades; painel custo: B sete, C sete pontos. Ambos os painéis começam em zero e usam suas próprias unidades.</desc><rect width="940" height="370" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172634"><text x="25" y="35" font-size="21" fill="#16324f" font-weight="bold" text-anchor="start">Dois indicadores, duas unidades: não usar o mesmo eixo para misturá-los</text><text x="45" y="76" font-size="19" fill="#16324f" font-weight="bold" text-anchor="start">MAE · unidades</text><line x1="85" y1="270" x2="440" y2="270" stroke="#172634" stroke-width="2" /><text x="68" y="275" font-size="13" fill="#172634" font-weight="normal" text-anchor="start">0</text><rect x="140" y="163.2" width="65" height="106.8" rx="0" fill="#087e80" stroke="none"/><text x="172" y="148.2" font-size="19" fill="#172634" font-weight="normal" text-anchor="middle">3</text><text x="172" y="293" font-size="16" fill="#172634" font-weight="normal" text-anchor="middle">B</text><rect x="285" y="127.6" width="65" height="142.4" rx="0" fill="#16324f" stroke="none"/><text x="317" y="112.6" font-size="19" fill="#172634" font-weight="normal" text-anchor="middle">4</text><text x="317" y="293" font-size="16" fill="#172634" font-weight="normal" text-anchor="middle">C</text><text x="86" y="323" font-size="14" fill="#3d5266" font-weight="normal" text-anchor="start">Eixo vertical: 0 a 5 un., origem zero</text><text x="493" y="76" font-size="19" fill="#16324f" font-weight="bold" text-anchor="start">Custo médio · pontos</text><line x1="533" y1="270" x2="888" y2="270" stroke="#172634" stroke-width="2" /><text x="516" y="275" font-size="13" fill="#172634" font-weight="normal" text-anchor="start">0</text><rect x="588" y="145.4" width="65" height="124.6" rx="0" fill="#087e80" stroke="none"/><text x="620" y="130.4" font-size="19" fill="#172634" font-weight="normal" text-anchor="middle">7</text><text x="620" y="293" font-size="16" fill="#172634" font-weight="normal" text-anchor="middle">B</text><rect x="733" y="145.4" width="65" height="124.6" rx="0" fill="#16324f" stroke="none"/><text x="765" y="130.4" font-size="19" fill="#172634" font-weight="normal" text-anchor="middle">7</text><text x="765" y="293" font-size="16" fill="#172634" font-weight="normal" text-anchor="middle">C</text><text x="534" y="323" font-size="14" fill="#3d5266" font-weight="normal" text-anchor="start">Eixo vertical: 0 a 10 pontos, origem zero</text></g></svg>