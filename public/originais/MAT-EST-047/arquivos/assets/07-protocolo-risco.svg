<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Checklist do relatório de risco preditivo</title><desc id="desc">Seis blocos indicam etapas da emissão ao monitoramento com limites explícitos para a base retrospectiva fictícia.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.4}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.4}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.2}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" class="title" text-anchor="start">Checklist do relatório de risco preditivo</text><text x="28" y="81" class="small" text-anchor="start">Relatório reproduzível e prudente para uma decisão sobre previsões temporais.</text><rect x="28" y="122" width="286" height="104" rx="9" class="panel"/><text x="41" y="155" class="label" text-anchor="start">1. Origem e horizonte</text><text x="41" y="191" class="small" text-anchor="start">Registrar informação disponível</text><rect x="337" y="122" width="286" height="104" rx="9" class="panel"/><text x="350" y="155" class="label" text-anchor="start">2. Previsão preservada</text><text x="350" y="191" class="small" text-anchor="start">Não reescrever emissão antiga</text><rect x="646" y="122" width="286" height="104" rx="9" class="panel"/><text x="659" y="155" class="label" text-anchor="start">3. Erros por grupo</text><text x="659" y="191" class="small" text-anchor="start">Sinal, MAE, RMSE e datas</text><rect x="28" y="265" width="286" height="104" rx="9" class="warm"/><text x="41" y="298" class="label" text-anchor="start">4. Faixa e nível-alvo</text><text x="41" y="334" class="small" text-anchor="start">Declarar método de construção</text><rect x="337" y="265" width="286" height="104" rx="9" class="warm"/><text x="350" y="298" class="label" text-anchor="start">5. Cobertura e largura</text><text x="350" y="334" class="small" text-anchor="start">Avaliar em alvos não usados</text><rect x="646" y="265" width="286" height="104" rx="9" class="warm"/><text x="659" y="298" class="label" text-anchor="start">6. Risco e limites</text><text x="659" y="334" class="small" text-anchor="start">Custos explícitos, monitorar mudanças</text><text x="32" y="444" class="small" text-anchor="start">Nesta base: estudo retrospectivo com 4 alvos e 6 tarefas; sem promessa de 80% de cobertura.</text></svg>