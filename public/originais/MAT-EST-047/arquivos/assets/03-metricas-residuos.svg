<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Média assinada não equivale a MAE</title><desc id="desc">Dois painéis apresentam média de erro com sinal, MAE, RMSE, maior módulo e contagem de sinais por horizonte.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243844}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#e8f2f8;stroke:#346d86;stroke-width:1.4}.warm{fill:#fff0db;stroke:#956929;stroke-width:1.4}.neutral{fill:#eff2f3;stroke:#87969a;stroke-width:1.2}.axis{stroke:#53656e;stroke-width:2;fill:none}.gridline{stroke:#dbe1e3;stroke-width:1}.blue{stroke:#206a90;stroke-width:3;fill:none}.orange{stroke:#a4631b;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="28" y="42" class="title" text-anchor="start">Média assinada não equivale a MAE</text><text x="32" y="86" class="small" text-anchor="start">Três tarefas por horizonte. Este painel apresenta descrição, não teste de normalidade.</text><rect x="40" y="125" width="426" height="264" rx="9" class="panel"/><text x="58" y="163" class="label" text-anchor="start">Horizonte 1</text><text x="58" y="202" class="small" text-anchor="start">Média assinada: −0,259 un.</text><text x="58" y="241" class="small" text-anchor="start">MAE: 2,099 un.</text><text x="58" y="280" class="small" text-anchor="start">RMSE: 2,158 un.</text><text x="58" y="319" class="small" text-anchor="start">Maior módulo: 2,760 un.</text><text x="58" y="358" class="small" text-anchor="start">Sinais: + 1 | − 2</text><rect x="505" y="125" width="426" height="264" rx="9" class="warm"/><text x="523" y="163" class="label" text-anchor="start">Horizonte 2</text><text x="523" y="202" class="small" text-anchor="start">Média assinada: −0,352 un.</text><text x="523" y="241" class="small" text-anchor="start">MAE: 1,821 un.</text><text x="523" y="280" class="small" text-anchor="start">RMSE: 1,912 un.</text><text x="523" y="319" class="small" text-anchor="start">Maior módulo: 2,262 un.</text><text x="523" y="358" class="small" text-anchor="start">Sinais: + 1 | − 2</text><text x="34" y="442" class="small" text-anchor="start">Três pontos por h não bastam para afirmar distribuição normal ou ruído branco.</text></svg>