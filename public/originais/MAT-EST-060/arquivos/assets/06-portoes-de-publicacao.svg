<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 390" width="960" height="390"><title id="title">Portões de publicação não equivalentes</title><desc id="desc">Integridade, semântica, acessibilidade, revisão humana e integração são verificações distintas; apenas os testes locais de parte dessas etapas foram executados.</desc><rect width="960" height="390" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="24" y="36" font-size="22" fill="#173753" font-weight="bold" text-anchor="start">6. Portões distintos antes de publicar</text><rect x="25" y="65" width="906" height="49" rx="8" fill="#eef5f8" stroke="#b3c7d2"/><text x="40" y="95" font-size="17" fill="#173753" font-weight="bold" text-anchor="start">1. Integridade</text><text x="330" y="95" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">23 históricos intactos</text><rect x="25" y="122" width="906" height="49" rx="8" fill="#eef5f8" stroke="#b3c7d2"/><text x="40" y="152" font-size="17" fill="#173753" font-weight="bold" text-anchor="start">2. Semântica</text><text x="330" y="152" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">n=2; MAE 3/4; custos 7/7</text><rect x="25" y="179" width="906" height="49" rx="8" fill="#eef5f8" stroke="#b3c7d2"/><text x="40" y="209" font-size="17" fill="#173753" font-weight="bold" text-anchor="start">3. Acessibilidade</text><text x="330" y="209" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">alt, legenda, texto e testes reais</text><rect x="25" y="236" width="906" height="49" rx="8" fill="#eef5f8" stroke="#b3c7d2"/><text x="40" y="266" font-size="17" fill="#173753" font-weight="bold" text-anchor="start">4. Revisão humana</text><text x="330" y="266" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">escopo, conclusão e aprovação</text><rect x="25" y="293" width="906" height="49" rx="8" fill="#eef5f8" stroke="#b3c7d2"/><text x="40" y="323" font-size="17" fill="#173753" font-weight="bold" text-anchor="start">5. Integração</text><text x="330" y="323" font-size="16" fill="#172b3b" font-weight="normal" text-anchor="start">commit, deploy e conferência</text></g></svg>