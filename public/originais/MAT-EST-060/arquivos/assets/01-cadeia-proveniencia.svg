<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 390" width="960" height="390"><title id="title">Cadeia verificável de seis elos</title><desc id="desc">Os seis elos são CSV e corte, hash, elegibilidade, cálculo com unidade, gráfico acessível e situação editorial; cada elo precisa permanecer rastreável.</desc><rect width="960" height="390" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="24" y="37" font-size="23" fill="#173753" font-weight="bold" text-anchor="start">1. Da origem ao relatório: seis elos verificáveis</text><rect x="22" y="72" width="292" height="98" rx="8" fill="#eef5f8" stroke="#9db7c6"/><text x="36" y="102" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">CSV e corte</text><text x="36" y="134" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">8 cartões</text><text x="302" y="182" font-size="22" fill="#146b83" font-weight="bold" text-anchor="start">→</text><rect x="334" y="72" width="292" height="98" rx="8" fill="#eef5f8" stroke="#9db7c6"/><text x="348" y="102" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Hash do CSV</text><text x="348" y="134" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">bytes fixos</text><text x="614" y="182" font-size="22" fill="#146b83" font-weight="bold" text-anchor="start">→</text><rect x="646" y="72" width="292" height="98" rx="8" fill="#eef5f8" stroke="#9db7c6"/><text x="660" y="102" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Regra de inclusão</text><text x="660" y="134" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">S01 e S02</text><rect x="22" y="207" width="292" height="98" rx="8" fill="#eef5f8" stroke="#9db7c6"/><text x="36" y="237" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Métrica e unidade</text><text x="36" y="269" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">3 e 4 un.</text><text x="302" y="317" font-size="22" fill="#146b83" font-weight="bold" text-anchor="start">→</text><rect x="334" y="207" width="292" height="98" rx="8" fill="#eef5f8" stroke="#9db7c6"/><text x="348" y="237" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Gráfico e texto</text><text x="348" y="269" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">eixos, alt</text><text x="614" y="317" font-size="22" fill="#146b83" font-weight="bold" text-anchor="start">→</text><rect x="646" y="207" width="292" height="98" rx="8" fill="#eef5f8" stroke="#9db7c6"/><text x="660" y="237" font-size="18" fill="#173753" font-weight="bold" text-anchor="start">Estado editorial</text><text x="660" y="269" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">não publicado</text></g></svg>