<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 390" width="960" height="390"><title id="title">Três canais de acessibilidade</title><desc id="desc">A mesma informação essencial — B três, C quatro, dois cartões avaliáveis de oito e seis pendências — deve aparecer em gráfico com números, alternativa textual e tabela ou parágrafo.</desc><rect width="960" height="390" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="26" y="35" font-size="22" fill="#173753" font-weight="bold" text-anchor="start">5. Informação equivalente em três canais</text><rect x="22" y="85" width="300" height="210" rx="8" fill="#eef5f8" stroke="#a3bdca"/><text x="40" y="126" font-size="21" fill="#173753" font-weight="bold" text-anchor="start">Visual</text><text x="40" y="176" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">B 3; C 4; corte A</text><text x="40" y="219" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">eixos e números visíveis</text><text x="40" y="267" font-size="14" fill="#9d4b12" font-weight="normal" text-anchor="start">não depender de cor</text><rect x="338" y="85" width="300" height="210" rx="8" fill="#eef5f8" stroke="#a3bdca"/><text x="356" y="126" font-size="21" fill="#173753" font-weight="bold" text-anchor="start">Texto alternativo</text><text x="356" y="176" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">n=2 entre 8</text><text x="356" y="219" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">essência para leitor de tela</text><text x="356" y="267" font-size="14" fill="#9d4b12" font-weight="normal" text-anchor="start">não depender de cor</text><rect x="654" y="85" width="300" height="210" rx="8" fill="#eef5f8" stroke="#a3bdca"/><text x="672" y="126" font-size="21" fill="#173753" font-weight="bold" text-anchor="start">Tabela e parágrafo</text><text x="672" y="176" font-size="17" fill="#172b3b" font-weight="normal" text-anchor="start">S01 e S02, seis pendências</text><text x="672" y="219" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">disponível sem imagem</text><text x="672" y="267" font-size="14" fill="#9d4b12" font-weight="normal" text-anchor="start">não depender de cor</text><text x="26" y="353" font-size="15" fill="#172b3b" font-weight="normal" text-anchor="start">Um SVG válido não garante entendimento auditivo: verificar manualmente no Edge e com leitor de tela.</text></g></svg>