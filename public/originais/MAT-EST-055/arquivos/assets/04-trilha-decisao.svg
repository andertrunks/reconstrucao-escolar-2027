<text x="36" y="280" font-family="Arial,sans-serif" fill="#f5fbff" font-size="18">G1–G5 não são horários autenticados nem decisões operacionais.</text>
<text x="36" y="314" font-family="Arial,sans-serif" fill="#b9d6ec" font-size="14">Ilustração autoral • números fictícios • ler também a legenda completa na aula</text></svg>