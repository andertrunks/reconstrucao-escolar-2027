<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 346" role="img" aria-labelledby="title desc"><title id="title">Trilha lógica do parecer didático</title><desc id="desc">Cinco eventos fictícios G1 a G5 registram escopo, evidência, alerta local, separação V e Z e parecer de não promoção, sem assinatura humana.</desc>
