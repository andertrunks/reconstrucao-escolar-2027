<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 346" role="img" aria-labelledby="title desc"><title id="title">Alterações não equivalentes</title><desc id="desc">Revisar uma observação altera avaliação; mudar algoritmo cria versão do modelo; mudar limiar exige protocolo futuro; nenhuma delas edita o histórico do protocolo original.</desc>
