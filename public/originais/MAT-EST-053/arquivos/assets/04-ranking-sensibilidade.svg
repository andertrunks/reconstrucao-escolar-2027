<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="ttl4 dsc4"><title id="ttl4">Mudança de ordenação com revisão</title><desc id="dsc4">Para observação 40: B tem módulo 2 e C tem módulo 3. Para observação 44: B mantém módulo 2 e C cai para 1.</desc><rect width="1120" height="420" rx="24" fill="#f7f9fc"/><text x="45" y="62" font-size="29" font-family="Arial,sans-serif" font-weight="700" fill="#172b4d">Mudança de ordenação com revisão</text><text x="46" y="99" font-size="17" fill="#334155" font-family="Arial,sans-serif">Esquema didático · MAT-EST-053 · não representa operação real</text><rect x="45" y="135" width="1020" height="52" rx="9" fill="#dceafe" stroke="#64748b"/><text x="64" y="168" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">1. v1=40: B 2; C 3</text><rect x="45" y="200" width="1020" height="52" rx="9" fill="#e3f0ed" stroke="#64748b"/><text x="64" y="233" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">2. v2=44: B 2; C 1</text><rect x="45" y="265" width="1020" height="52" rx="9" fill="#dceafe" stroke="#64748b"/><text x="64" y="298" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">3. a mesma revisão muda comparação</text><rect x="45" y="330" width="1020" height="52" rx="9" fill="#e3f0ed" stroke="#64748b"/><text x="64" y="363" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">4. nenhum desses é par de t18 a t22</text></svg>