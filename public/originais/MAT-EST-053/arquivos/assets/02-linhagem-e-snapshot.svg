<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="ttl2 dsc2"><title id="ttl2">Proveniência e fotografia dos dados</title><desc id="dsc2">A fotografia de entrada guarda fonte, período, versão, status e hash. Correção gera novo ID, preservando a versão antiga.</desc><rect width="1120" height="420" rx="24" fill="#f7f9fc"/><text x="45" y="62" font-size="29" font-family="Arial,sans-serif" font-weight="700" fill="#172b4d">Proveniência e fotografia dos dados</text><text x="46" y="99" font-size="17" fill="#334155" font-family="Arial,sans-serif">Esquema didático · MAT-EST-053 · não representa operação real</text><rect x="45" y="135" width="1020" height="52" rx="9" fill="#dceafe" stroke="#64748b"/><text x="64" y="168" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">1. fonte e regras de coleta</text><rect x="45" y="200" width="1020" height="52" rx="9" fill="#e3f0ed" stroke="#64748b"/><text x="64" y="233" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">2. identificador de versão e corte</text><rect x="45" y="265" width="1020" height="52" rx="9" fill="#dceafe" stroke="#64748b"/><text x="64" y="298" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">3. fotografia imutável de entrada</text><rect x="45" y="330" width="1020" height="52" rx="9" fill="#e3f0ed" stroke="#64748b"/><text x="64" y="363" font-size="21" font-family="Arial,sans-serif" fill="#172b4d">4. execução reprodutível e avaliação</text></svg>