<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Três funções para os dados</title><desc id="d">Uma faixa com 60% para treino, 20% para validação e 20% para teste; percentuais são apenas ilustrativos.</desc><rect width="1000" height="400" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#162c43} .h{font-size:25px;font-weight:bold} .txt{font-size:20px} .sm{font-size:17px} .box{stroke:#284b63;stroke-width:2} .axis{stroke:#33485c;stroke-width:2}</style><text x="38" y="45" class="h" text-anchor="start">Três funções para os dados</text><text x="42" y="94" class="sm" text-anchor="start">Ilustração de partição, não uma regra fixa</text><rect x="50" y="133" width="530" height="112" rx="9" fill="#dceef9" stroke="#284b63" stroke-width="2"/><text x="315.0" y="174" class="txt" text-anchor="middle">Treino • 60%</text><text x="315.0" y="205" class="sm" text-anchor="middle">Ajustar</text><rect x="590" y="133" width="175" height="112" rx="9" fill="#f3e5cd" stroke="#284b63" stroke-width="2"/><text x="677.5" y="174" class="txt" text-anchor="middle">Validação • 20%</text><text x="677.5" y="205" class="sm" text-anchor="middle">Escolher</text><rect x="775" y="133" width="175" height="112" rx="9" fill="#e6ebdf" stroke="#284b63" stroke-width="2"/><text x="862.5" y="174" class="txt" text-anchor="middle">Teste • 20%</text><text x="862.5" y="205" class="sm" text-anchor="middle">Avaliar</text><text x="50" y="309" class="txt" text-anchor="start">O teste fica preservado até a escolha do modelo.</text></svg>