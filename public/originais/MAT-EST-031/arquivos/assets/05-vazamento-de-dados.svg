<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Pré-processar sem vazamento</title><desc id="d">Fluxo correto: separar registros; ajustar imputação e escala só no treino; aplicar transformações congeladas à avaliação.</desc><rect width="1000" height="400" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#162c43} .h{font-size:25px;font-weight:bold} .txt{font-size:20px} .sm{font-size:17px} .box{stroke:#284b63;stroke-width:2} .axis{stroke:#33485c;stroke-width:2}</style><text x="38" y="45" class="h" text-anchor="start">Pré-processar sem vazamento</text><rect x="25" y="145" width="226" height="113" rx="9" fill="#e2eef6" stroke="#284b63" stroke-width="2"/><text x="138" y="181" class="txt" text-anchor="middle">1. Separar</text><text x="138" y="218" class="sm" text-anchor="middle">Treino / teste</text><text x="256" y="211" class="txt" text-anchor="start">→</text><rect x="273" y="145" width="226" height="113" rx="9" fill="#f5ecd9" stroke="#284b63" stroke-width="2"/><text x="386" y="181" class="txt" text-anchor="middle">2. Aprender</text><text x="386" y="218" class="sm" text-anchor="middle">Mediana e escala no treino</text><text x="504" y="211" class="txt" text-anchor="start">→</text><rect x="521" y="145" width="226" height="113" rx="9" fill="#e2eef6" stroke="#284b63" stroke-width="2"/><text x="634" y="181" class="txt" text-anchor="middle">3. Aplicar</text><text x="634" y="218" class="sm" text-anchor="middle">Transformação ao teste</text><text x="752" y="211" class="txt" text-anchor="start">→</text><rect x="769" y="145" width="226" height="113" rx="9" fill="#f5ecd9" stroke="#284b63" stroke-width="2"/><text x="882" y="181" class="txt" text-anchor="middle">4. Avaliar</text><text x="882" y="218" class="sm" text-anchor="middle">Sem refazer o ajuste</text><text x="45" y="338" class="sm" text-anchor="start">A mediana do conjunto de teste não entra no ajuste.</text></svg>