<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Divergência de erros entre treino e teste</title><desc id="d">Barras dos modelos A e B: MAE de treino 0,4 e 1,1; MAE de teste 3,0 e 1,3 pontos, respectivamente.</desc><rect width="1000" height="400" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#162c43} .h{font-size:25px;font-weight:bold} .txt{font-size:20px} .sm{font-size:17px} .box{stroke:#284b63;stroke-width:2} .axis{stroke:#33485c;stroke-width:2}</style><text x="38" y="45" class="h" text-anchor="start">Divergência de erros entre treino e teste</text><text x="60" y="92" class="sm" text-anchor="start">MAE (pontos): valores menores são melhores</text><text x="265" y="133" class="txt" text-anchor="middle">Modelo A</text><text x="80" y="204" class="sm" text-anchor="start">Treino</text><rect x="140" y="174" width="46" height="37" rx="9" fill="#d6eefa" stroke="#284b63" stroke-width="2"/><text x="196" y="200" class="sm" text-anchor="start">0,4</text><text x="80" y="288" class="sm" text-anchor="start">Teste</text><rect x="140" y="258" width="345" height="37" rx="9" fill="#f0e2ca" stroke="#284b63" stroke-width="2"/><text x="495" y="284" class="sm" text-anchor="start">3,0</text><line x1="140" y1="320" x2="485" y2="320" class="axis"/><line x1="140" y1="320" x2="140" y2="326" class="axis"/><text x="140" y="344" class="sm" text-anchor="middle">0</text><line x1="255" y1="320" x2="255" y2="326" class="axis"/><text x="255" y="344" class="sm" text-anchor="middle">1</text><line x1="370" y1="320" x2="370" y2="326" class="axis"/><text x="370" y="344" class="sm" text-anchor="middle">2</text><line x1="485" y1="320" x2="485" y2="326" class="axis"/><text x="485" y="344" class="sm" text-anchor="middle">3</text><text x="735" y="133" class="txt" text-anchor="middle">Modelo B</text><text x="550" y="204" class="sm" text-anchor="start">Treino</text><rect x="610" y="174" width="127" height="37" rx="9" fill="#d6eefa" stroke="#284b63" stroke-width="2"/><text x="747" y="200" class="sm" text-anchor="start">1,1</text><text x="550" y="288" class="sm" text-anchor="start">Teste</text><rect x="610" y="258" width="150" height="37" rx="9" fill="#f0e2ca" stroke="#284b63" stroke-width="2"/><text x="770" y="284" class="sm" text-anchor="start">1,3</text><line x1="610" y1="320" x2="955" y2="320" class="axis"/><line x1="610" y1="320" x2="610" y2="326" class="axis"/><text x="610" y="344" class="sm" text-anchor="middle">0</text><line x1="725" y1="320" x2="725" y2="326" class="axis"/><text x="725" y="344" class="sm" text-anchor="middle">1</text><line x1="840" y1="320" x2="840" y2="326" class="axis"/><text x="840" y="344" class="sm" text-anchor="middle">2</text><line x1="955" y1="320" x2="955" y2="326" class="axis"/><text x="955" y="344" class="sm" text-anchor="middle">3</text><text x="62" y="382" class="sm" text-anchor="start">Eixo horizontal: MAE em pontos; eixo vertical: treino/teste por modelo.</text></svg>