<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Quando a divisão aleatória não serve</title><desc id="d">Dois diagramas: pessoas P1–P3 inteiras por parte e meses anteriores destinados ao treino, posteriores à validação.</desc><rect width="1000" height="400" fill="#fff"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#162c43} .h{font-size:25px;font-weight:bold} .txt{font-size:20px} .sm{font-size:17px} .box{stroke:#284b63;stroke-width:2} .axis{stroke:#33485c;stroke-width:2}</style><text x="38" y="45" class="h" text-anchor="start">Quando a divisão aleatória não serve</text><text x="45" y="102" class="txt" text-anchor="start">Por pessoa:</text><rect x="40" y="130" width="283" height="82" rx="9" fill="#e3eef6" stroke="#284b63" stroke-width="2"/><text x="181" y="160" class="sm" text-anchor="middle">P1: treino</text><text x="181" y="188" class="sm" text-anchor="middle">todas as linhas P1</text><rect x="350" y="130" width="283" height="82" rx="9" fill="#e3eef6" stroke="#284b63" stroke-width="2"/><text x="491" y="160" class="sm" text-anchor="middle">P2: treino</text><text x="491" y="188" class="sm" text-anchor="middle">todas as linhas P2</text><rect x="660" y="130" width="283" height="82" rx="9" fill="#f1e5d1" stroke="#284b63" stroke-width="2"/><text x="801" y="160" class="sm" text-anchor="middle">P3: teste</text><text x="801" y="188" class="sm" text-anchor="middle">todas as linhas P3</text><text x="45" y="270" class="txt" text-anchor="start">Por tempo:</text><rect x="40" y="294" width="455" height="65" rx="9" fill="#e3eef6" stroke="#284b63" stroke-width="2"/><text x="267" y="334" class="sm" text-anchor="middle">Meses anteriores: treino</text><text x="505" y="334" class="txt" text-anchor="start">→</text><rect x="545" y="294" width="412" height="65" rx="9" fill="#f1e5d1" stroke="#284b63" stroke-width="2"/><text x="751" y="334" class="sm" text-anchor="middle">Meses futuros: validação</text></svg>