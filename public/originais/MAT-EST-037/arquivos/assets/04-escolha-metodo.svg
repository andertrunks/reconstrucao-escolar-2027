<text x="323" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">diferenças pareadas</text>
<path d="M558 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
