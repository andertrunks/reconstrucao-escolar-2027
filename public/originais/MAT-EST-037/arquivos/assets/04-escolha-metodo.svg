<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="ttl desc">
<title id="ttl">Escolha conforme pergunta e desenho</title>
<desc id="desc">Caixas relacionam estimativa, grupos pareados, grupos independentes e variáveis categóricas a famílias de análise.</desc>
