<text x="593" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">inferência independente</text>
<path d="M828 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
