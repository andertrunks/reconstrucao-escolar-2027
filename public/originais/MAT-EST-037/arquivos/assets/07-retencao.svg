<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="ttl desc">
<title id="ttl">Caminho de retenção e revisão espaçada</title>
<desc id="desc">Linha com tentativa real, devolutiva, recuperação, reteste novo e revisões futuras após 1, 7 e 30 dias.</desc>
<rect width="1120" height="330" rx="20" fill="#f8fafc"/>
<text x="42" y="56" fill="#13233c" font-size="27" font-family="Arial, sans-serif" font-weight="bold">Caminho de retenção e revisão espaçada</text>
<rect x="40" y="102" width="245" height="142" rx="13" fill="#e7f1fa" stroke="#314e73" stroke-width="2"/>
<text x="53" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Tentativa</text>
<text x="53" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">responder sem gabarito</text>
<path d="M288 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
<rect x="310" y="102" width="245" height="142" rx="13" fill="#e7f1fa" stroke="#314e73" stroke-width="2"/>
<text x="323" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Devolutiva</text>
<text x="323" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">classificar o erro</text>
<path d="M558 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
<rect x="580" y="102" width="245" height="142" rx="13" fill="#e7f1fa" stroke="#314e73" stroke-width="2"/>
<text x="593" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Recuperação</text>
<text x="593" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">pré-requisito menor</text>
<path d="M828 173 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#23466c" stroke-width="3"/>
<rect x="850" y="102" width="245" height="142" rx="13" fill="#e7f1fa" stroke="#314e73" stroke-width="2"/>
<text x="863" y="142" fill="#102d4d" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Revisão</text>
<text x="863" y="179" fill="#233b57" font-family="Arial, sans-serif" font-size="16">D+1, D+7, D+30</text>
<text x="43" y="289" font-family="Arial, sans-serif" font-size="16" fill="#263d57">Leia da esquerda para a direita. As etapas têm significados diferentes.</text>
</svg>