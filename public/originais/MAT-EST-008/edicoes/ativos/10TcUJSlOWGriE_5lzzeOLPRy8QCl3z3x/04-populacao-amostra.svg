<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600"><title>Variância populacional e variância amostral</title><desc>Dois painéis usam o mesmo numerador soma dos quadrados dos desvios. A população divide por N e a amostra usada para estimar a população divide por n menos um.</desc><rect width="1050" height="600" fill="white"/><text x="240" y="50" font-size="28">O divisor depende da pergunta estatística</text><rect x="80" y="120" width="400" height="330" fill="none" stroke="black" stroke-width="3"/><rect x="570" y="120" width="400" height="330" fill="none" stroke="black" stroke-width="3"/><text x="170" y="180" font-size="24">População completa</text><text x="135" y="250" font-size="23">σ² = Σ(x−μ)² / N</text><text x="145" y="330" font-size="19">Descrever este universo definido</text><text x="660" y="180" font-size="24">Amostra para estimar</text><text x="625" y="250" font-size="23">s² = Σ(x−x̄)² / (n−1)</text><text x="620" y="330" font-size="19">Estimar variância da população</text><text x="330" y="530" font-size="20">Mesmos dados podem responder perguntas diferentes.</text></svg>