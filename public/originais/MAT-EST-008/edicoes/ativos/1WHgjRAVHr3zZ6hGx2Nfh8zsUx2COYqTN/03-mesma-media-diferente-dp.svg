<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="580"><title>Mesma média e diferentes dispersões</title><desc>Conjunto A quatro cinco seis tem média cinco e desvio-padrão pequeno. Conjunto B zero cinco dez também tem média cinco e desvio-padrão maior.</desc><rect width="1050" height="580" fill="white"/><text x="270" y="50" font-size="28">Mesma média não significa mesma dispersão</text><text x="120" y="150" font-size="23">A = 4, 5, 6</text><text x="120" y="205" font-size="21">média = 5</text><text x="120" y="260" font-size="21">DP ≈ 0,82</text><text x="620" y="150" font-size="23">B = 0, 5, 10</text><text x="620" y="205" font-size="21">média = 5</text><text x="620" y="260" font-size="21">DP ≈ 4,08</text><line x1="100" y1="390" x2="450" y2="390" stroke="black" stroke-width="3"/><circle cx="200" cy="390" r="8"/><circle cx="275" cy="390" r="8"/><circle cx="350" cy="390" r="8"/><line x1="600" y1="390" x2="950" y2="390" stroke="black" stroke-width="3"/><circle cx="620" cy="390" r="8"/><circle cx="775" cy="390" r="8"/><circle cx="930" cy="390" r="8"/><text x="325" y="520" font-size="20">B está muito mais espalhado.</text></svg>