<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560"><title>Da variância ao desvio-padrão</title><desc>Fluxo mostra desvios em centímetros, quadrados em centímetros quadrados, variância em centímetros quadrados e raiz quadrada retornando o desvio-padrão a centímetros.</desc><rect width="1000" height="560" fill="white"/><text x="270" y="50" font-size="28">Da variância ao desvio-padrão</text><text x="80" y="150" font-size="21">desvios em cm</text><text x="300" y="150" font-size="24">→</text><text x="360" y="150" font-size="21">quadrados em cm²</text><text x="620" y="150" font-size="24">→</text><text x="700" y="150" font-size="21">variância em cm²</text><text x="450" y="270" font-size="26">raiz quadrada</text><text x="490" y="320" font-size="32">↓</text><text x="350" y="420" font-size="25">desvio-padrão em cm</text></svg>