<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 900 370" width="900" height="370"><title id="t">Erros assinados por dia</title><desc id="d">A apresenta erros −5,+5,+5,−5; B apresenta 0,0,0,−25 nos quatro dias de teste.</desc><rect width="900" height="370" fill="#ffffff"/><text x="30" y="36" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#18334b" text-anchor="start">Erro assinado = observado − previsto (atendimentos)</text><line x1="83" y1="190" x2="840" y2="190" stroke="#536779" stroke-width="2"/><line x1="150" y1="82" x2="150" y2="302" stroke="#d3dfe5" stroke-width="1"/><text x="150" y="327" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#18334b" text-anchor="middle">Dia 5</text><circle cx="127" cy="210" r="6" fill="#2265ad"/><circle cx="173" cy="190" r="6" fill="#b06a13"/><text x="127" y="199" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#18334b" text-anchor="middle">A -5</text><text x="173" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#18334b" text-anchor="middle">B +0</text><line x1="355" y1="82" x2="355" y2="302" stroke="#d3dfe5" stroke-width="1"/><text x="355" y="327" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#18334b" text-anchor="middle">Dia 6</text><circle cx="332" cy="170" r="6" fill="#2265ad"/><circle cx="378" cy="190" r="6" fill="#b06a13"/><text x="332" y="159" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#18334b" text-anchor="middle">A +5</text><text x="378" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#18334b" text-anchor="middle">B +0</text><line x1="560" y1="82" x2="560" y2="302" stroke="#d3dfe5" stroke-width="1"/><text x="560" y="327" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#18334b" text-anchor="middle"