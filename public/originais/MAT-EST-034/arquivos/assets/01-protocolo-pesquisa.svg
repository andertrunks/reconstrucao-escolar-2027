<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 900 370" width="900" height="370"><title id="t">Protocolo em cinco passos</title><desc id="d">Cinco caixas sucessivas: pergunta, dados, análise, limites e relatório; os dados são inteiramente inventados.</desc><rect width="900" height="370" fill="#ffffff"/><text x="30" y="39" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#18334b" text-anchor="start">Ciclo da investigação estatística</text><rect x="25" y="95" width="159" height="118" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="104" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#18334b" text-anchor="middle">1. Pergunta</text><text x="104" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#18334b" text-anchor="middle">alvo e recorte</text><text x="191" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#2265ad" text-anchor="middle">→</text><rect x="199" y="95" width="159" height="118" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="278" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#18334b" text-anchor="middle">2. Dados</text><text x="278" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#18334b" text-anchor="middle">origem e unidade</text><text x="365" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#2265ad" text-anchor="middle">→</text><rect x="373" y="95" width="159" height="118" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="452" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#18334b" text-anchor="middle">3. Análise</text><text x="452" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#18334b" text-anchor="middle">métricas e erros</text><text x="539" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#2265ad" text-anchor="middle">→</text><rect x="547" y="95" width="159" height="118" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="626" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#18334b" text-anchor="middle">4. Limites</text><text x="626" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#18334b" text-anchor="middle">viés e incerteza</text><text x="713" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#2265ad" text-anchor="middle">→</text><rect x="721" y="95" width="159" height="118" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="800" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#18334b" text-anchor="middle">5. Relatório</text><text x="800" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#18334b" text-anchor="middle">conclusão auditável</text><text x="30" y="278" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#18334b" text-anchor="start">Dado fictício → inferência apenas sobre o exercício, não sobre uma população real.</text></svg>