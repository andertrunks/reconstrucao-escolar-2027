<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 900 370" width="900" height="370"><title id="t">Escada de evidências</title><desc id="d">Quatro níveis: descrição do conjunto, comparação na mesma base, generalização com amostragem adequada e causalidade com desenho próprio.</desc><rect width="900" height="370" fill="#ffffff"/><text x="30" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#18334b" text-anchor="start">Quatro frases exigem evidências diferentes</text><rect x="28" y="68" width="842" height="59" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="48" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">Descrever</text><text x="228" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#18334b" text-anchor="start">“Nos quatro dias, o MAE foi 5.”</text><rect x="28" y="140" width="842" height="59" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="48" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">Comparar</text><text x="228" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#18334b" text-anchor="start">“Na mesma base, A e B diferiram.”</text><rect x="28" y="212" width="842" height="59" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="48" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">Generalizar</text><text x="228" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#18334b" text-anchor="start">Requer coleta e hipótese representativas.</text><rect x="28" y="284" width="842" height="59" rx="9" fill="#f6fafc" stroke="#d3dfe5"/><text x="48" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18334b" text-anchor="start">Causar</text><text x="228" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#18334b" text-anchor="start">Requer desenho e identificação causal.</text></svg>