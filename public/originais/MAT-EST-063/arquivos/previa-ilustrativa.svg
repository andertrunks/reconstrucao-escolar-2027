<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="p-title p-desc"><title id="p-title">Prévia ilustrativa MAT-EST-063</title><desc id="p-desc">Aula sobre gestão de incidentes editoriais. No sandbox há dois de oito pares; MAE B três e C quatro unidades, seis pendências. I01 errada divide seis por oito e produz zero vírgula setenta e cinco; corrigida divide por dois e produz três. Nenhuma publicação confirmada; G3 a G8 abertos.</desc><rect width="1240" height="700" fill="#f7fafc"/><rect x="38" y="30" width="1164" height="145" rx="20" fill="#173e56"/><text x="65" y="76" fill="white" font-family="Arial" font-weight="bold" font-size="21">RECONSTRUÇÃO ESCOLAR · MAT-EST-063</text><text x="65" y="123" fill="white" font-family="Arial" font-weight="bold" font-size="34">Gestão de incidentes editoriais</text><text x="65" y="151" fill="#e0f0fc" font-family="Arial" font-size="18">Prévia editorial local: não é captura de site nem registro de incidente real</text><rect x="42" y="212" width="550" height="350" rx="15" fill="white" stroke="#b1c5d4" stroke-width="2"/><text x="66" y="259" font-family="Arial" font-size="23" font-weight="bold" fill="#17364b">SANDBOX-057 — corte A</text><text x="66" y="307" font-family="Arial" font-size="20" fill="#17364b">2 avaliáveis de 8 · 6 pendências</text><rect x="72" y="345" width="470" height="36" fill="#e8edf3" rx="8"/><rect x="72" y="345" width="118" height="36" fill="#256b52" rx="8"/><text x="73" y="407" font-family="Arial" font-size="20" fill="#17364b">MAE B = 3 unidades · MAE C = 4 unidades</text><text x="73" y="444" font-family="Arial" font-size="19" fill="#17364b">Custo médio: 7 pontos para ambos</text><text x="73" y="483" font-family="Arial" font-size="16" fill="#4b5b6b">Dados didáticos; não representam coorte futura.</text><rect x="618" y="212" width="580" height="350" rx="15" fill="white" stroke="#b1c5d4" stroke-width="2"/><text x="642" y="259" font-family="Arial" font-size="23" font-weight="bold" fill="#17364b">Reteste artificial I01</text><text x="642" y="313" font-family="Arial" font-size="22" fill="#97323a">Antes: 6 ÷ 8 = 0,75 (denominador errado)</text><text x="642" y="363" font-family="Arial" font-size="22" fill="#246848">Depois: 6 ÷ 2 = 3 (correto)</text><text x="642" y="414" font-family="Arial" font-size="19" fill="#17364b">G1/G2: verificação local</text><text x="642" y="447" font-family="Arial" font-size="19" fill="#936012">G3–G6: pendentes</text><text x="642" y="480" font-family="Arial" font-size="19" fill="#97323a">G7/G8: não executados</text><rect x="42" y="601" width="1156" height="63" rx="10" fill="#eaf0f4"/><text x="66" y="641" font-family="Arial" font-size="19" fill="#17364b">Alcance público desconhecido · T23–T33 sem novos alvos observados · Progresso não alterado</text></svg>