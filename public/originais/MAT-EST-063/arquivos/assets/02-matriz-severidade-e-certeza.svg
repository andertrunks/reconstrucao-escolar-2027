<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="336" viewBox="0 0 1000 336" role="img" aria-labelledby="title desc">
<title id="title">Três perguntas distintas antes de classificar</title>
<desc id="desc">Domínio da falha, alcance comprovado e confiança da evidência devem ser examinados separadamente.</desc>
<rect width="1000" height="336" rx="20" fill="#f8fafc"/>
<text x="25" y="40" fill="#1f3044" font-size="23" font-weight="bold" font-family="Arial,sans-serif">Três perguntas distintas antes de classificar</text>
<rect x="30.0" y="77" width="304.0" height="167" rx="13" fill="white" stroke="#953239" stroke-width="2"/>
<rect x="31.0" y="78" width="302.0" height="5" rx="2" fill="#953239"/>
<text x="41.0" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#953239">Conteúdo</text>
<text x="41.0" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Denominador, alt</text>
<text x="41.0" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Histórico, versão</text>
<rect x="348.0" y="77" width="304.0" height="167" rx="13" fill="white" stroke="#986016" stroke-width="2"/>
<rect x="349.0" y="78" width="302.0" height="5" rx="2" fill="#986016"/>
<text x="359.0" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#986016">Alcance</text>
<text x="359.0" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Nenhuma medição pública</text>
<text x="359.0" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Escopo desconhecido</text>
<rect x="666.0" y="77" width="304.0" height="167" rx="13" fill="white" stroke="#28654a" stroke-width="2"/>
<rect x="667.0" y="78" width="302.0" height="5" rx="2" fill="#28654a"/>
<text x="677.0" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#28654a">Certeza</text>
<text x="677.0" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Fixture reproduzida</text>
<text x="677.0" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Só no ambiente local</text>
<text x="25" y="279" font-family="Arial,sans-serif" font-weight="700" fill="#1f3044" font-size="16">Potencial gravidade de conteúdo não demonstra o tamanho do impacto real.</text>
</svg>