<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="336" viewBox="0 0 1000 336" role="img" aria-labelledby="title desc">
<title id="title">I01 corrigida; outras mutações continuam reprovadas</title>
<desc id="desc">I01 usa denominador oito e falha; cópia corrigida usa dois e passa; I02 a I06 seguem mutações negativas.</desc>
<rect width="1000" height="336" rx="20" fill="#f8fafc"/>
<text x="25" y="40" fill="#1f3044" font-size="23" font-weight="bold" font-family="Arial,sans-serif">I01 corrigida; outras mutações continuam reprovadas</text>
<rect x="30.0" y="77" width="304.0" height="167" rx="13" fill="white" stroke="#953239" stroke-width="2"/>
<rect x="31.0" y="78" width="302.0" height="5" rx="2" fill="#953239"/>
<text x="41.0" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#953239">I01 antes</text>
<text x="41.0" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">n = 8</text>
<text x="41.0" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">reject_denominator</text>
<rect x="348.0" y="77" width="304.0" height="167" rx="13" fill="white" stroke="#28654a" stroke-width="2"/>
<rect x="349.0" y="78" width="302.0" height="5" rx="2" fill="#28654a"/>
<text x="359.0" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#28654a">Correção isolada</text>
<text x="359.0" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">n = 2</text>
<text x="359.0" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">pass_local_fixture</text>
<rect x="666.0" y="77" width="304.0" height="167" rx="13" fill="white" stroke="#28654a" stroke-width="2"/>
<rect x="667.0" y="78" width="302.0" height="5" rx="2" fill="#28654a"/>
<text x="677.0" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#28654a">Regressão</text>
<text x="677.0" y="129" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">Baseline preservado</text>
<text x="677.0" y="154" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1f3044">I02–I06 rejeitadas</text>
<text x="25" y="279" font-family="Arial,sans-serif" font-weight="700" fill="#1f3044" font-size="16">Passar a fixture corrigida demonstra reparo local específico, não aprovação humana nem publicação.</text>
