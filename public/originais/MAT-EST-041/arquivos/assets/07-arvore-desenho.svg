<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc"><title id="title">Árvore de decisão: desenho, método e limites</title><desc id="desc">Fluxo: identificar unidade, identificar dependência, selecionar sorteio do conglomerado ou preservação temporal, declarar hipóteses e limites.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#152b41} .title{font-size:25px;font-weight:700}.sub{font-size:17px}.lbl{font-size:17px;font-weight:600}.sm{font-size:14px}.axis{stroke:#34495e;stroke-width:2;fill:none}.line{stroke:#155e75;stroke-width:3;fill:none}.rect{fill:#e8f5f7;stroke:#155e75;stroke-width:2}.rect2{fill:#fef3d8;stroke:#935c14;stroke-width:2}.alert{fill:#fee5e5;stroke:#a52525;stroke-width:2}.bar{fill:#9ed4e3;stroke:#155e75;stroke-width:1.5}</style><rect x="0" y="0" width="940" height="470" fill="#fff"/><text class="title" x="28" y="38">Árvore de decisão: desenho, método e limites</text><rect class="rect" x="45" y="85" width="395" height="72" rx="12"/><text x="59" y="117" class="lbl">1. Qual é a unidade?</text><rect class="rect" x="500" y="85" width="395" height="72" rx="12"/><text x="514" y="117" class="lbl">2. Há dependência temporal?</text><rect class="rect" x="45" y="195" width="395" height="72" rx="12"/><text x="59" y="227" class="lbl">3. Conglomerado inteiro</text><rect class="rect" x="500" y="195" width="395" height="72" rx="12"/><text x="514" y="227" class="lbl">4. Bloco / origem móvel</text><rect class="rect" x="206" y="305" width="530" height="72" rx="12"/><text x="220" y="337" class="lbl">5. Relatar alvo, hipóteses e limites</text><text x="45" y="424" class="sub">Novo lugar ou futuro distante exige evidência própria de generalização.</text></svg>