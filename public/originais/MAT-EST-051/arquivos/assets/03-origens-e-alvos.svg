<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Origem móvel e horizonte um</title><desc id="desc">Os pares alvos futuros são: t22 para t23, t23 para t24 e t24 para t25; é preciso registrar a observação anterior antes de avançar.</desc><style>.bg{fill:#fff}.t{font:600 20px Arial,sans-serif;fill:#172334}.s{font:16px Arial,sans-serif;fill:#172334}.sub{font:14px Arial,sans-serif;fill:#334155}.tile{fill:#e7edf3;stroke:#425466;stroke-width:1.5}.empty{fill:#fff;stroke:#425466;stroke-width:2;stroke-dasharray:6 4}.focus{fill:#172334}.w{fill:#fff;font:600 15px Arial,sans-serif}.line{stroke:#172334;stroke-width:2}.step{fill:#dce7f1;stroke:#243b53;stroke-width:1.4}.bad{fill:#fff2ed;stroke:#7c2d12;stroke-width:2}.small{font:13px Arial,sans-serif;fill:#172334}</style><rect class="bg" width="900" height="320"/><text class="t" x="24" y="38">Uma origem nova só após dado validado</text><rect class="step" x="60" y="83" width="90" height="53" rx="7"/><rect class="empty" x="177" y="83" width="90" height="53" rx="7"/><text class="s" x="74" y="115">t22</text><text class="s" x="192" y="115">t23</text><path class="line" d="M151 110 H175"/><text class="small" x="60" y="164">origem → alvo</text><rect class="step" x="340" y="83" width="90" height="53" rx="7"/><rect class="empty" x="457" y="83" width="90" height="53" rx="7"/><text class="s" x="354" y="115">t23</text><text class="s" x="472" y="115">t24</text><path class="line" d="M431 110 H455"/><text class="small" x="340" y="164">origem → alvo</text><rect class="step" x="620" y="83" width="90" height="53" rx="7"/><rect class="empty" x="737" y="83" width="90" height="53" rx="7"/><text class="s" x="634" y="115">t24</text><text class="s" x="752" y="115">t25</text><path class="line" d="M711 110 H735"/><text class="small" x="620" y="164">origem → alvo</text><text class="s" x="55" y="230">t24 depende de x = y23 validado; t25 depende também de z = y24 validado.</text></svg>