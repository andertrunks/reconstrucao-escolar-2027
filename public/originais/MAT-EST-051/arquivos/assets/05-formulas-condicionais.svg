<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Projeções simbólicas sem inventar observação</title><desc id="desc">Para t23 B vale 183 e C 199 em recálculo ilustrativo. Para t24 B vale 181 e C depende de x. Para t25 B vale 188 e C depende de x e z.</desc><style>.bg{fill:#fff}.t{font:600 20px Arial,sans-serif;fill:#172334}.s{font:16px Arial,sans-serif;fill:#172334}.sub{font:14px Arial,sans-serif;fill:#334155}.tile{fill:#e7edf3;stroke:#425466;stroke-width:1.5}.empty{fill:#fff;stroke:#425466;stroke-width:2;stroke-dasharray:6 4}.focus{fill:#172334}.w{fill:#fff;font:600 15px Arial,sans-serif}.line{stroke:#172334;stroke-width:2}.step{fill:#dce7f1;stroke:#243b53;stroke-width:1.4}.bad{fill:#fff2ed;stroke:#7c2d12;stroke-width:2}.small{font:13px Arial,sans-serif;fill:#172334}</style><rect class="bg" width="900" height="320"/><text class="t" x="22" y="35">Da conta ilustrativa à fórmula condicionada</text><rect class="step" x="25" y="76" width="265" height="150" rx="9"/><text class="s" x="39" y="111">t23 (origem t22)</text><text class="s" x="39" y="145">B = 183; C = 199</text><text class="small" x="39" y="183">recálculo, não emissão</text><rect class="step" x="311" y="76" width="265" height="150" rx="9"/><text class="s" x="325" y="111">t24 (origem t23)</text><text class="s" x="325" y="145">B = 181</text><text class="small" x="325" y="183">C = 181 + (x − 128)/5</text><rect class="step" x="597" y="76" width="265" height="150" rx="9"/><text class="s" x="611" y="111">t25 (origem t24)</text><text class="s" x="611" y="145">B = 188</text><text class="small" x="611" y="183">C = 188 + (x + z − 305)/5</text><text class="small" x="30" y="273">x = y23 ainda desconhecido; z = y24 ainda desconhecido.</text></svg>