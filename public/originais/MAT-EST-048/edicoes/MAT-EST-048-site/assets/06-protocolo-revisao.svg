<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Protocolo de revisão sem retreino automático</title><desc id="desc">Etapas de preservação de logs, auditoria e validação de candidato.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23323d}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#eaf2f7;stroke:#346e88;stroke-width:1.5}.warm{fill:#fff0dd;stroke:#946627;stroke-width:1.5}.neutral{fill:#f1f3f4;stroke:#7d8a94;stroke-width:1.2}.axis{stroke:#505f69;stroke-width:2;fill:none}.gridline{stroke:#d6dfe2;stroke-width:1}.linea{stroke:#155b82;stroke-width:3;fill:none}.lineb{stroke:#ad6224;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Protocolo de revisão sem retreino automático</text><text x="29" y="78" class="small" text-anchor="start">Alertar não significa substituir o modelo; uma revisão precisa deixar rastros.</text><rect x="31" y="108" width="442" height="81" rx="10" class="panel"/><text x="49" y="139" class="label" text-anchor="start">1. Preservar log</text><text x="49" y="166" class="small" text-anchor="start">Nenhum dado futuro entra no ajuste</text><rect x="499" y="108" width="442" height="81" rx="10" class="warm"/><text x="517" y="139" class="label" text-anchor="start">2. Conferir fonte, unidade, calendário</text><text x="517" y="166" class="small" text-anchor="start">Nenhum dado futuro entra no ajuste</text><rect x="31" y="218" width="442" height="81" rx="10" class="panel"/><text x="49" y="249" class="label" text-anchor="start">3. Investigar contexto e sazonalidade</text><text x="49" y="276" class="small" text-anchor="start">Nenhum dado futuro entra no ajuste</text><rect x="499" y="218" width="442" height="81" rx="10" class="warm"/><text x="517" y="249" class="label" text-anchor="start">4. Comparar referência e horizontes</text><text x="517" y="276" class="small" text-anchor="start">Nenhum dado futuro entra no ajuste</text><rect x="31" y="328" width="442" height="81" rx="10" class="panel"/><text x="49" y="359" class="label" text-anchor="start">5. Testar candidato em janela separada</text><text x="49" y="386" class="small" text-anchor="start">Nenhum dado futuro entra no ajuste</text><rect x="499" y="328" width="442" height="81" rx="10" class="warm"/><text x="517" y="359" class="label" text-anchor="start">6. Aprovar versão e documentar decisão</text><text x="517" y="386" class="small" text-anchor="start">Registro humano e justificativa</text></svg>