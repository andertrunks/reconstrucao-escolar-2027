<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Comparação de erros em duas janelas</title><desc id="desc">Indicadores calculados separadamente para t13 a t15 e t16 a t18.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23323d}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#eaf2f7;stroke:#346e88;stroke-width:1.5}.warm{fill:#fff0dd;stroke:#946627;stroke-width:1.5}.neutral{fill:#f1f3f4;stroke:#7d8a94;stroke-width:1.2}.axis{stroke:#505f69;stroke-width:2;fill:none}.gridline{stroke:#d6dfe2;stroke-width:1}.linea{stroke:#155b82;stroke-width:3;fill:none}.lineb{stroke:#ad6224;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Comparação de erros em duas janelas</text><text x="27" y="83" class="small" text-anchor="start">Comparação ilustrativa: três chegadas por bloco. Não fazer inferência formal.</text><rect x="46" y="116" width="426" height="257" rx="10" class="panel"/><text x="68" y="156" class="title" text-anchor="start">t13–t15</text><text x="74" y="208" class="label" text-anchor="start">Média assinada</text><text x="444" y="208" class="label" text-anchor="end">+0.892</text><text x="74" y="262" class="label" text-anchor="start">MAE</text><text x="444" y="262" class="label" text-anchor="end">0.975</text><text x="74" y="316" class="label" text-anchor="start">RMSE</text><text x="444" y="316" class="label" text-anchor="end">1.155</text><rect x="511" y="116" width="426" height="257" rx="10" class="warm"/><text x="533" y="156" class="title" text-anchor="start">t16–t18</text><text x="539" y="208" class="label" text-anchor="start">Média assinada</text><text x="909" y="208" class="label" text-anchor="end">+7.651</text><text x="539" y="262" class="label" text-anchor="start">MAE</text><text x="909" y="262" class="label" text-anchor="end">7.651</text><text x="539" y="316" class="label" text-anchor="start">RMSE</text><text x="909" y="316" class="label" text-anchor="end">7.820</text><text x="480" y="419" class="small" text-anchor="middle">Métricas em unidades da série; três observações por bloco.</text></svg>