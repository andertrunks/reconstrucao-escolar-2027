<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Quatro classes de sinais de mudança</title><desc id="desc">Qualidade de dados, entrada, relação entrada-alvo e desempenho.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23323d}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#eaf2f7;stroke:#346e88;stroke-width:1.5}.warm{fill:#fff0dd;stroke:#946627;stroke-width:1.5}.neutral{fill:#f1f3f4;stroke:#7d8a94;stroke-width:1.2}.axis{stroke:#505f69;stroke-width:2;fill:none}.gridline{stroke:#d6dfe2;stroke-width:1}.linea{stroke:#155b82;stroke-width:3;fill:none}.lineb{stroke:#ad6224;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Quatro classes de sinais de mudança</text><text x="29" y="80" class="small" text-anchor="start">Sinais diferentes exigem testes de investigação diferentes.</text><rect x="32" y="116" width="890" height="70" rx="10" class="panel"/><text x="52" y="144" class="label" text-anchor="start">Qualidade / atraso</text><text x="52" y="169" class="small" text-anchor="start">faltou valor, houve duplicação ou unidade mudou?</text><rect x="32" y="198" width="890" height="70" rx="10" class="neutral"/><text x="52" y="226" class="label" text-anchor="start">Entrada X</text><text x="52" y="251" class="small" text-anchor="start">mudou a distribuição de variáveis disponíveis?</text><rect x="32" y="280" width="890" height="70" rx="10" class="panel"/><text x="52" y="308" class="label" text-anchor="start">Relação X → Y</text><text x="52" y="333" class="small" text-anchor="start">a relação entre preditores e alvo mudou?</text><rect x="32" y="362" width="890" height="70" rx="10" class="neutral"/><text x="52" y="390" class="label" text-anchor="start">Desempenho</text><text x="52" y="415" class="small" text-anchor="start">MAE, cobertura ou custo mudou quando Y chegou?</text></svg>