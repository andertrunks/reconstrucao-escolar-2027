<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Previsões ainda sem observado</title><desc id="desc">Dois compromissos simulados para t19 e t20 sem resultados preenchidos.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23323d}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#eaf2f7;stroke:#346e88;stroke-width:1.5}.warm{fill:#fff0dd;stroke:#946627;stroke-width:1.5}.neutral{fill:#f1f3f4;stroke:#7d8a94;stroke-width:1.2}.axis{stroke:#505f69;stroke-width:2;fill:none}.gridline{stroke:#d6dfe2;stroke-width:1}.linea{stroke:#155b82;stroke-width:3;fill:none}.lineb{stroke:#ad6224;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Previsões ainda sem observado</text><text x="29" y="78" class="small" text-anchor="start">Origem t18: duas previsões emitidas; nenhuma chegada de t19 ou t20 é conhecida.</text><rect x="42" y="119" width="430" height="190" rx="10" class="panel"/><text x="64" y="156" class="title" text-anchor="start">Alvo t19 / h1</text><text x="64" y="191" class="label" text-anchor="start">Previsto: 220.425 unidades</text><text x="64" y="224" class="label" text-anchor="start">Observado: não disponível</text><text x="64" y="257" class="small" text-anchor="start">Erro e cobertura: não calculáveis</text><rect x="510" y="119" width="430" height="190" rx="10" class="panel"/><text x="532" y="156" class="title" text-anchor="start">Alvo t20 / h2</text><text x="532" y="191" class="label" text-anchor="start">Previsto: 199.820 unidades</text><text x="532" y="224" class="label" text-anchor="start">Observado: não disponível</text><text x="532" y="257" class="small" text-anchor="start">Erro e cobertura: não calculáveis</text><rect x="42" y="344" width="896" height="88" rx="10" class="neutral"/><text x="62" y="379" class="label" text-anchor="start">Denominador de MAE: somente tarefas com alvo já observado.</text><text x="62" y="404" class="small" text-anchor="start">Previsões pendentes não são erros iguais a zero nem casos de acerto.</text></svg>