<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Registro: emitir antes de observar</title><desc id="desc">Seis pares emissão e chegada simuladas com ordem crescente.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23323d}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#eaf2f7;stroke:#346e88;stroke-width:1.5}.warm{fill:#fff0dd;stroke:#946627;stroke-width:1.5}.neutral{fill:#f1f3f4;stroke:#7d8a94;stroke-width:1.2}.axis{stroke:#505f69;stroke-width:2;fill:none}.gridline{stroke:#d6dfe2;stroke-width:1}.linea{stroke:#155b82;stroke-width:3;fill:none}.lineb{stroke:#ad6224;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Registro: emitir antes de observar</text><text x="28" y="78" class="small" text-anchor="start">Ordem didática: o modelo usa somente o passado; a chegada ocorre depois.</text><rect x="35" y="123" width="139" height="58" rx="10" class="panel"/><text x="104" y="146" class="label" text-anchor="middle">Emissão t13</text><text x="104" y="167" class="small" text-anchor="middle">ordem 1</text><line x1="104" y1="181" x2="104" y2="224" class="axis"/><rect x="35" y="225" width="139" height="58" rx="10" class="warm"/><text x="104" y="248" class="label" text-anchor="middle">Chegada t13</text><text x="104" y="269" class="small" text-anchor="middle">ordem 2</text><rect x="187" y="123" width="139" height="58" rx="10" class="panel"/><text x="256" y="146" class="label" text-anchor="middle">Emissão t14</text><text x="256" y="167" class="small" text-anchor="middle">ordem 3</text><line x1="256" y1="181" x2="256" y2="224" class="axis"/><rect x="187" y="225" width="139" height="58" rx="10" class="warm"/><text x="256" y="248" class="label" text-anchor="middle">Chegada t14</text><text x="256" y="269" class="small" text-anchor="middle">ordem 4</text><rect x="339" y="123" width="139" height="58" rx="10" class="panel"/><text x="408" y="146" class="label" text-anchor="middle">Emissão t15</text><text x="408" y="167" class="small" text-anchor="middle">ordem 5</text><line x1="408" y1="181" x2="408" y2="224" class="axis"/><rect x="339" y="225" width="139" height="58" rx="10" class="warm"/><text x="408" y="248" class="label" text-anchor="middle">Chegada t15</text><text x="408" y="269" class="small" text-anchor="middle">ordem 6</text><rect x="491" y="123" width="139" height="58" rx="10" class="panel"/><text x="560" y="146" class="label" text-anchor="middle">Emissão t16</text><text x="560" y="167" class="small" text-anchor="middle">ordem 7</text><line x1="560" y1="181" x2="560" y2="224" class="axis"/><rect x="491" y="225" width="139" height="58" rx="10" class="warm"/><text x="560" y="248" class="label" text-anchor="middle">Chegada t16</text><text x="560" y="269" class="small" text-anchor="middle">ordem 8</text><rect x="643" y="123" width="139" height="58" rx="10" class="panel"/><text x="712" y="146" class="label" text-anchor="middle">Emissão t17</text><text x="712" y="167" class="small" text-anchor="middle">ordem 9</text><line x1="712" y1="181" x2="712" y2="224" class="axis"/><rect x="643" y="225" width="139" height="58" rx="10" class="warm"/><text x="712" y="248" class="label" text-anchor="middle">Chegada t17</text><text x="712" y="269" class="small" text-anchor="middle">ordem 10</text><rect x="795" y="123" width="139" height="58" rx="10" class="panel"/><text x="864" y="146" class="label" text-anchor="middle">Emissão t18</text><text x="864" y="167" class="small" text-anchor="middle">ordem 11</text><line x1="864" y1="181" x2="864" y2="224" class="axis"/><rect x="795" y="225" width="139" height="58" rx="10" class="warm"/><text x="864" y="248" class="label" text-anchor="middle">Chegada t18</text><text x="864" y="269" class="small" text-anchor="middle">ordem 12</text><rect x="26" y="332" width="908" height="98" rx="10" class="neutral"/><text x="45" y="364" class="label" text-anchor="start">Simulação construída pelo editor, NÃO evidência prospectiva real.</text><text x="45" y="391" class="small" text-anchor="start">Emissão congelada: versão, origem, alvo, horizonte e previsão; chegada: valor observado e proveniência.</text></svg>