<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Janela móvel e gatilho de revisão</title><desc id="desc">Seis erros e contagem móvel de três tarefas avaliáveis.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23323d}.title{font-size:24px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.tiny{font-size:12px}.panel{fill:#eaf2f7;stroke:#346e88;stroke-width:1.5}.warm{fill:#fff0dd;stroke:#946627;stroke-width:1.5}.neutral{fill:#f1f3f4;stroke:#7d8a94;stroke-width:1.2}.axis{stroke:#505f69;stroke-width:2;fill:none}.gridline{stroke:#d6dfe2;stroke-width:1}.linea{stroke:#155b82;stroke-width:3;fill:none}.lineb{stroke:#ad6224;stroke-width:3;fill:none}</style><rect width="960" height="480" fill="#fff"/><text x="26" y="41" class="title" text-anchor="start">Janela móvel e gatilho de revisão</text><text x="28" y="81" class="small" text-anchor="start">Limiar didático previamente definido: em 3 chegadas maduras, pelo menos 2 erros acima de 4 un.</text><rect x="35" y="122" width="140" height="99" rx="10" class="panel"/><text x="105" y="149" class="label" text-anchor="middle">t13</text><text x="105" y="174" class="small" text-anchor="middle">|erro| 1.22</text><text x="105" y="199" class="label" text-anchor="middle">dentro</text><rect x="186" y="122" width="140" height="99" rx="10" class="panel"/><text x="256" y="149" class="label" text-anchor="middle">t14</text><text x="256" y="174" class="small" text-anchor="middle">|erro| 1.58</text><text x="256" y="199" class="label" text-anchor="middle">dentro</text><rect x="337" y="122" width="140" height="99" rx="10" class="panel"/><text x="407" y="149" class="label" text-anchor="middle">t15</text><text x="407" y="174" class="small" text-anchor="middle">|erro| 0.12</text><text x="407" y="199" class="label" text-anchor="middle">dentro</text><rect x="488" y="122" width="140" height="99" rx="10" class="warm"/><text x="558" y="149" class="label" text-anchor="middle">t16</text><text x="558" y="174" class="small" text-anchor="middle">|erro| 9.90</text><text x="558" y="199" class="label" text-anchor="middle">ALTO</text><rect x="639" y="122" width="140" height="99" rx="10" class="warm"/><text x="709" y="149" class="label" text-anchor="middle">t17</text><text x="709" y="174" class="small" text-anchor="middle">|erro| 6.14</text><text x="709" y="199" class="label" text-anchor="middle">ALTO</text><rect x="790" y="122" width="140" height="99" rx="10" class="warm"/><text x="860" y="149" class="label" text-anchor="middle">t18</text><text x="860" y="174" class="small" text-anchor="middle">|erro| 6.91</text><text x="860" y="199" class="label" text-anchor="middle">ALTO</text><rect x="29" y="260" width="902" height="133" rx="10" class="neutral"/><text x="48" y="299" class="label" text-anchor="start">Após t15: 0 de 3 altos → rotina.  Após t17: 2 de 3 → investigar.</text><text x="48" y="333" class="small" text-anchor="start">Após t18: 3 de 3 → manter investigação, sem retreino automático.</text><text x="48" y="362" class="small" text-anchor="start">Janela menor que 3: indicador incompleto, não calcular disparo.</text></svg>