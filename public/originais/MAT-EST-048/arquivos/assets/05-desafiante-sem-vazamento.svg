<svg xmlns="http://www.w3.org/2000/svg" width="900" height="285" viewBox="0 0 900 285" role="img" aria-labelledby="t d"><title id="t">Cálculo do desafiante sem consultar o alvo</title><desc id="d">Na origem dezessete, a previsão base é 151 e a correção sazonal média é 15,2, produzindo 166,2. O observado 176 só é revelado depois da emissão.</desc><rect width="100%" height="100%" fill="white"/><text x="24" y="28" font-size="19" font-family="Arial, sans-serif">Comparação na origem t17 — antes de revelar t18</text><rect x="35" y="65" width="252" height="74" fill="#efefef" stroke="black"/><text x="47" y="89" font-size="13" font-family="Arial, sans-serif">Histórico visível</text><text x="47" y="115" font-size="20" font-family="Arial, sans-serif">t01–t17</text><rect x="320" y="65" width="252" height="74" fill="#efefef" stroke="black"/><text x="332" y="89" font-size="13" font-family="Arial, sans-serif">Base sazonal</text><text x="332" y="115" font-size="20" font-family="Arial, sans-serif">151</text><rect x="605" y="65" width="252" height="74" fill="#efefef" stroke="black"/><text x="617" y="89" font-size="13" font-family="Arial, sans-serif">Diferenças</text><text x="617" y="115" font-size="20" font-family="Arial, sans-serif">5, 6, 16, 16, 33</text><rect x="35" y="165" width="252" height="74" fill="#efefef" stroke="black"/><text x="47" y="189" font-size="13" font-family="Arial, sans-serif">Média</text><text x="47" y="215" font-size="20" font-family="Arial, sans-serif">15,2</text><rect x="320" y="165" width="252" height="74" fill="#efefef" stroke="black"/><text x="332" y="189" font-size="13" font-family="Arial, sans-serif">Desafiante</text><text x="332" y="215" font-size="20" font-family="Arial, sans-serif">166,2</text><rect x="605" y="165" width="252" height="74" fill="white" stroke="black"/><text x="617" y="189" font-size="13" font-family="Arial, sans-serif">Depois: y18</text><text x="617" y="215" font-size="20" font-family="Arial, sans-serif">176</text><text x="45" y="273" font-size="12" font-family="Arial">O sexto quadro é revelado APÓS registrar as duas previsões; não entra no cálculo da média.</text></svg>