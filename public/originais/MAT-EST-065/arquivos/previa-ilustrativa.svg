<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="pt pd"><title id="pt">Prévia editorial MAT-EST-065</title><desc id="pd">Apresenta duas medidas diferentes com suas populações: completude dois de oito e MAE B três, C quatro entre os dois pares; as verificações locais são separadas de controles humanos e externos pendentes.</desc><rect width="1440" height="900" fill="#eff4f8"/><rect x="0" y="0" width="1440" height="116" fill="#173e64"/><text x="70" y="50" fill="white" font-family="DejaVu Sans" font-size="23">RECONSTRUÇÃO ESCOLAR · MATEMÁTICA / ESTATÍSTICA</text><text x="70" y="94" fill="white" font-family="DejaVu Sans" font-size="33" font-weight="bold">MAT-EST-065 · Indicadores de qualidade editorial</text><text x="70" y="160" fill="#162636" font-family="DejaVu Sans" font-size="23">Uma fotografia didática não é um índice de qualidade do site nem tendência.</text>
<rect x="70" y="192" width="610" height="235" rx="16" fill="white" stroke="#c4d3df"/><text x="100" y="239" fill="#173e64" font-family="DejaVu Sans" font-size="24" font-weight="bold">Completude · SANDBOX-057</text><text x="100" y="318" fill="#087a67" font-family="DejaVu Sans" font-size="66" font-weight="bold">2 / 8 = 25%</text><text x="100" y="366" fill="#4b6175" font-family="DejaVu Sans" font-size="20">Dois pares avaliáveis; seis pendências.</text><text x="100" y="399" fill="#4b6175" font-family="DejaVu Sans" font-size="18">Não mede acerto ou qualidade global.</text>
<rect x="712" y="192" width="660" height="235" rx="16" fill="white" stroke="#c4d3df"/><text x="744" y="239" fill="#173e64" font-family="DejaVu Sans" font-size="24" font-weight="bold">MAE · somente dois pares elegíveis</text><text x="744" y="318" fill="#2675aa" font-family="DejaVu Sans" font-size="62" font-weight="bold">B: 3</text><text x="1066" y="318" fill="#087a67" font-family="DejaVu Sans" font-size="62" font-weight="bold">C: 4</text><text x="744" y="372" fill="#4b6175" font-family="DejaVu Sans" font-size="20">Ambos em unidades fictícias.</text>
<rect x="70" y="457" width="1302" height="257" rx="16" fill="white" stroke="#c4d3df"/><text x="100" y="504" fill="#173e64" font-family="DejaVu Sans" font-size="24" font-weight="bold">Evidência e escopo precisam acompanhar a porcentagem</text><rect x="105" y="539" width="386" height="117" rx="11" fill="#e9f6f2"/><text x="126" y="573" fill="#087a67" font-family="DejaVu Sans" font-size="23" font-weight="bold">6 de 6 fixtures</text><text x="126" y="608" fill="#162636" font-family="DejaVu Sans" font-size="18">Rejeitadas como esperado</text><text x="126" y="636" fill="#4b6175" font-family="DejaVu Sans" font-size="16">Não são incidentes de produção.</text><rect x="520" y="539" width="382" height="117" rx="11" fill="#fff3d8"/><text x="544" y="573" fill="#805700" font-family="DejaVu Sans" font-size="23" font-weight="bold">G3–G6: pendentes</text><text x="544" y="608" fill="#162636" font-family="DejaVu Sans" font-size="18">Revisão humana ausente</text><rect x="931" y="539" width="411" height="117" rx="11" fill="#fff3d8"/><text x="951" y="573" fill="#805700" font-family="DejaVu Sans" font-size="22" font-weight="bold">G7/G8: não executados</text><text x="951" y="608" fill="#162636" font-family="DejaVu Sans" font-size="18">Sem deploy e pós-deploy</text>
<rect x="70" y="740" width="1302" height="94" rx="13" fill="#173e64"/><text x="100" y="777" fill="white" font-family="DejaVu Sans" font-size="23" font-weight="bold">Atenção: MAE t26–t33 e taxa real de incidentes = NÃO ESTIMÁVEIS</text><text x="100" y="808" fill="#e4eef6" font-family="DejaVu Sans" font-size="18">Prévia editorial ilustrativa; não é screenshot do site nem um relatório de operação.</text></svg>