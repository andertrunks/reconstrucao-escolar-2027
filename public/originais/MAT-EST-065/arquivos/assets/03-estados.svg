<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
<title id="title">Controles e natureza da evidência</title><desc id="desc">Mostra G1 e G2 checados localmente, G3 a G6 pendentes, G7 e G8 não executados.</desc>
<rect width="100%" height="100%" fill="#f3f7fb"/>
<rect x="22" y="22" width="1116" height="80" rx="14" fill="#173e64"/>
<text x="48" y="70" fill="white" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="bold">Controles e natureza da evidência</text>
<rect x="34" y="126" width="1092" height="76" rx="11" fill="#ffffff" stroke="#c4d3df"/>
<rect x="34" y="126" width="9" height="76" rx="4" fill="#087a67"/>
<text x="61" y="155" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="21" fill="#162636">G1 e G2: checked_local</text>
<text x="61" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#4b6175">São duas verificações técnicas locais, não autorização pública.</text>
<rect x="34" y="218" width="1092" height="76" rx="11" fill="#fff3d8" stroke="#c4d3df"/>
<rect x="34" y="218" width="9" height="76" rx="4" fill="#805700"/>
<text x="61" y="247" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="21" fill="#162636">G3 a G6: pending</text>
<text x="61" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#4b6175">Revisão por pessoa, áudio, leitor de tela e vídeo não atestados.</text>
<rect x="34" y="310" width="1092" height="76" rx="11" fill="#fff3d8" stroke="#c4d3df"/>
<rect x="34" y="310" width="9" height="76" rx="4" fill="#805700"/>
<text x="61" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="21" fill="#162636">G7 e G8: not_performed</text>
<text x="61" y="367" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#4b6175">Integração, deploy e verificação pública não executados.</text>
<text x="38" y="463" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#4b6175">Figura 3. Uma soma de controles não é um selo de prontidão.</text>
</svg>