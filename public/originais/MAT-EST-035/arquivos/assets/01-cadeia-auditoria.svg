<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Cadeia de auditoria reprodutível</title><desc id="desc">Cinco etapas: inspecionar CSV, recalcular, comparar, revisar independentemente e relatar.</desc><rect width="960" height="540" fill="#f8fbfc"/><text x="35" y="43" font-family="DejaVu Sans,Arial" font-size="23" fill="#153248" text-anchor="start" font-weight="bold">Trilha verificável: da entrada ao parecer</text><rect x="35" y="115" width="166" height="96" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="118.0" y="146" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">1. CSV</text><text x="118.0" y="174" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Origem sintética</text><text x="205" y="167" font-family="DejaVu Sans,Arial" font-size="24" fill="#136b6b" text-anchor="start" font-weight="normal">→</text><rect x="220" y="115" width="166" height="96" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="303.0" y="146" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">2. Recalcular</text><text x="303.0" y="174" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Sem copiar gabarito</text><text x="390" y="167" font-family="DejaVu Sans,Arial" font-size="24" fill="#136b6b" text-anchor="start" font-weight="normal">→</text><rect x="405" y="115" width="166" height="96" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="488.0" y="146" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">3. Comparar</text><text x="488.0" y="174" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Métricas e versões</text><text x="575" y="167" font-family="DejaVu Sans,Arial" font-size="24" fill="#136b6b" text-anchor="start" font-weight="normal">→</text><rect x="590" y="115" width="166" height="96" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="673.0" y="146" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">4. Revisar</text><text x="673.0" y="174" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Outro verificador</text><text x="760" y="167" font-family="DejaVu Sans,Arial" font-size="24" fill="#136b6b" text-anchor="start" font-weight="normal">→</text><rect x="775" y="115" width="166" height="96" rx="12" fill="#def0f4" stroke="#9eb4bf" stroke-width="2"/><text x="858.0" y="146" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">5. Relatar</text><text x="858.0" y="174" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Conclusão limitada</text><rect x="135" y="310" width="690" height="95" rx="12" fill="#fff0bf" stroke="#9eb4bf" stroke-width="2"/><text x="480.0" y="341" font-family="DejaVu Sans,Arial" font-size="18" fill="#153248" text-anchor="middle" font-weight="bold">Auditoria independente</text><text x="480.0" y="369" font-family="DejaVu Sans,Arial" font-size="14" fill="#334b5b" text-anchor="middle">Mesmo dado + mesma regra → mesmo resultado</text><text x="40" y="478" font-family="DejaVu Sans,Arial" font-size="19" fill="#153248" text-anchor="start" font-weight="normal">Se um número divergir, documente a diferença antes de publicar.</text></svg>