<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Não misture os dois laboratórios</title><desc id="desc">Histórico t18 a t22 possui cinco pares e MAE B 17,60, C 8,36. SANDBOX-057 possui dois pares e MAE B 3, C 4. São amostras distintas.</desc>
<rect width="960" height="420" fill="#fcfdfd"/>
<text x="35" y="48" fill="#143047" font-family="Arial, sans-serif" font-size="25" font-weight="bold">Não misture os dois laboratórios</text>
<rect x="35" y="90" width="430" height="245" rx="10" fill="#e7f0f5" stroke="#386078" stroke-width="2"/><text x="58" y="122" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">HISTÓRICO FICTÍCIO t18–t22</text><text x="60" y="166" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#16384e">n = 5 pares</text><text x="60" y="213" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#16384e">MAE B: 17,60 unidades</text><text x="60" y="252" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#16384e">MAE C: 8,36 unidades</text><text x="60" y="300" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#8f342b">Guarda t19 violada</text><rect x="495" y="90" width="430" height="245" rx="10" fill="#e8f2e6" stroke="#386078" stroke-width="2"/><text x="514" y="122" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">SANDBOX-057 (ISOLADO)</text><text x="516" y="166" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#16384e">n = 2 pares</text><text x="516" y="213" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#16384e">MAE B: 3 unidades</text><text x="516" y="252" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#16384e">MAE C: 4 unidades</text><text x="516" y="300" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#16384e">6 pendências em 8 cartões</text><text x="40" y="390" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#16384e">Diferença de resultados não é contradição: mudam os dados e o recorte.</text></svg>