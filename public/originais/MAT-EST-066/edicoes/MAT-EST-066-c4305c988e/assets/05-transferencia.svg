<text x="35" y="48" fill="#143047" font-family="Arial, sans-serif" font-size="25" font-weight="bold">TRANSFER-066: dois conhecidos e dois pendentes</text>
<rect x="40" y="92" width="200" height="116" rx="10" fill="#e0efec" stroke="#386078" stroke-width="2"/><text x="55" y="128" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#16384e">R01</text><text x="55" y="166" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#16384e">Avaliável</text><rect x="262" y="92" width="200" height="116" rx="10" fill="#e0efec" stroke="#386078" stroke-width="2"/><text x="277" y="128" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#16384e">R02</text><text x="277" y="166" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#16384e">Avaliável</text><rect x="484" y="92" width="200" height="116" rx="10" fill="#f6eddb" stroke="#386078" stroke-width="2"/><text x="499" y="128" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#16384e">R03</text><text x="499" y="166" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#16384e">Pendente</text><rect x="706" y="92" width="200" height="116" rx="10" fill="#f6eddb" stroke="#386078" stroke-width="2"/><text x="721" y="128" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#16384e">R04</text><text x="721" y="166" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#16384e">Pendente</text><rect x="98" y="252" width="352" height="84" rx="10" fill="#e7f0f5" stroke="#386078" stroke-width="2"/><text x="115" y="289" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#16384e">Completude: 2/4 = 50%</text><rect x="500" y="252" width="352" height="84" rx="10" fill="#e7f2e8" stroke="#386078" stroke-width="2"/><text x="518" y="285" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#16384e">MAE B = 2,5; C = 1</text><text x="518" y="309" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#16384e">Somente R01 e R02</text><text x="47" y="391" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#16384e">Nunca preencher R03 e R04 para melhorar artificialmente a média.</text></svg>