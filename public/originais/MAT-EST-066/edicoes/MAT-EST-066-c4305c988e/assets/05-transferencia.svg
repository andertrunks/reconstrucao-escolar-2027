<title id="title">TRANSFER-066: dois conhecidos e dois pendentes</title><desc id="desc">No conjunto fictício independente, R01 e R02 possuem valores e erros. R03 e R04 não têm observado nem previsão. Completude 2 de 4; MAE B 2,5 e C 1 unidade.</desc>
