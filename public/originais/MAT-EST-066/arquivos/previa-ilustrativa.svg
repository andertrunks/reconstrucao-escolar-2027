<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="650" viewBox="0 0 1140 650" role="img" aria-labelledby="t d"><title id="t">Prévia editorial MAT-EST-066</title><desc id="d">Revisão integradora: histórico com média menor de C e guarda violada em t19, sandbox com denominadores distintos e transferência independente com duas pendências.</desc><rect width="1140" height="650" fill="#f7fbfc"/><text x="48" y="64" fill="#12394c" font-family="Arial" font-size="34" font-weight="bold">MAT-EST-066 • Revisão integradora</text><text x="50" y="103" fill="#244a5d" font-family="Arial" font-size="20">Resultados locais didáticos • populações separadas • sem publicação</text><rect x="40" y="148" width="515" height="202" rx="15" fill="#dfeef4"/><text x="65" y="192" fill="#12394c" font-family="Arial" font-size="24" font-weight="bold">HISTÓRICO t18–t22 (5 de 8 pares)</text><text x="65" y="232" fill="#12394c" font-family="Arial" font-size="23">MAE B = 17,60 | C = 8,36</text><text x="65" y="275" fill="#843c27" font-family="Arial" font-size="23" font-weight="bold">Guarda t19: 19,2 &gt; limite 10</text><text x="65" y="313" fill="#12394c" font-family="Arial" font-size="19">Sem promoção no protocolo original</text><rect x="585" y="148" width="515" height="202" rx="15" fill="#e4f2e6"/><text x="611" y="192" fill="#12394c" font-family="Arial" font-size="24" font-weight="bold">SANDBOX-057 • isolado</text><text x="611" y="232" fill="#12394c" font-family="Arial" font-size="23">Completude = 2/8 = 25%</text><text x="611" y="275" fill="#12394c" font-family="Arial" font-size="23">MAE B = 3 | C = 4 unidades</text><text x="611" y="313" fill="#12394c" font-family="Arial" font-size="19">Seis cartões pendentes ≠ erros zero</text><rect x="40" y="382" width="1060" height="196" rx="15" fill="#f8efde"/><text x="65" y="427" fill="#12394c" font-family="Arial" font-size="24" font-weight="bold">TRANSFER-066 • novo exercício autoral independente</text><text x="65" y="469" fill="#12394c" font-family="Arial" font-size="23">R01 e R02 avaliáveis; R03 e R04 pendentes. Completude = 50%</text><text x="65" y="509" fill="#12394c" font-family="Arial" font-size="23">MAE B = 2,5 | C = 1 unidade. Custo B = 4,5 | C = 2 pontos.</text><text x="65" y="549" fill="#12394c" font-family="Arial" font-size="20">Aula produzida não equivale a domínio pessoal ou resultado operacional.</text><text x="43" y="618" fill="#425e6e" font-family="Arial" font-size="19">Prévia ilustrativa original. Material completo e diagramas semânticos no HTML e Markdown.</text></svg>