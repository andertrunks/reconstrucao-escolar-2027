<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Duas perguntas, dois denominadores</title><desc id="desc">SANDBOX-057: dois de oito cartões avaliáveis, completude 25%; erro absoluto médio B usa soma seis dividida por dois, igual a três unidades.</desc>
<rect width="960" height="420" fill="#fcfdfd"/>
<text x="35" y="48" fill="#143047" font-family="Arial, sans-serif" font-size="25" font-weight="bold">Duas perguntas, dois denominadores</text>
<rect x="50" y="91" width="395" height="230" rx="10" fill="#e7f0f5" stroke="#386078" stroke-width="2"/><text x="72" y="125" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#16384e">Completude</text><text x="72" y="169" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#16384e">2 cartões avaliáveis</text><line x1="72" y1="182" x2="405" y2="182" stroke="#31556c" stroke-width="2"/><text x="72" y="216" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#16384e">8 cartões planejados</text><text x="72" y="277" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#16384e">= 25%  (percentual)</text><rect x="515" y="91" width="395" height="230" rx="10" fill="#e8f2e6" stroke="#386078" stroke-width="2"/><text x="536" y="125" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#16384e">Erro absoluto médio B</text><text x="536" y="169" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#16384e">|+4| + |−2| = 6</text><line x1="536" y1="182" x2="875" y2="182" stroke="#31556c" stroke-width="2"/><text x="536" y="216" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#16384e">2 pares elegíveis</text><text x="536" y="277" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#16384e">= 3 unidades</text><text x="48" y="380" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#16384e">Seis dividido por oito NÃO é MAE: troca indevida de população.</text></svg>