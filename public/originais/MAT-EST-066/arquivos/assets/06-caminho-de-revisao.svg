<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Critérios para consolidar compreensão</title><desc id="desc">O esquema apresenta explicar, calcular, criticar evidência, transferir e recuperar após intervalo, antes de marcar um tópico como consolidado.</desc>
<rect width="960" height="420" fill="#fcfdfd"/>
<text x="35" y="48" fill="#143047" font-family="Arial, sans-serif" font-size="25" font-weight="bold">Critérios para consolidar compreensão</text>
<rect x="35" y="114" width="164" height="102" rx="10" fill="#e8f0f5" stroke="#386078" stroke-width="2"/><text x="50" y="149" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">Explicar</text><text x="50" y="181" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#16384e">Sem decorar</text><rect x="218" y="114" width="164" height="102" rx="10" fill="#e8f0f5" stroke="#386078" stroke-width="2"/><text x="233" y="149" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">Calcular</text><text x="233" y="181" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#16384e">Denominador</text><rect x="401" y="114" width="164" height="102" rx="10" fill="#e8f0f5" stroke="#386078" stroke-width="2"/><text x="416" y="149" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">Criticar</text><text x="416" y="181" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#16384e">Limites</text><rect x="584" y="114" width="164" height="102" rx="10" fill="#e8f0f5" stroke="#386078" stroke-width="2"/><text x="599" y="149" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">Aplicar</text><text x="599" y="181" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#16384e">Caso novo</text><rect x="767" y="114" width="164" height="102" rx="10" fill="#e0f0e3" stroke="#386078" stroke-width="2"/><text x="782" y="149" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">Revisar</text><text x="782" y="181" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#16384e">Após intervalo</text><line x1="199" y1="165" x2="216" y2="165" stroke="#31556c" stroke-width="2"/><line x1="382" y1="165" x2="399" y2="165" stroke="#31556c" stroke-width="2"/><line x1="565" y1="165" x2="582" y2="165" stroke="#31556c" stroke-width="2"/><line x1="748" y1="165" x2="765" y2="165" stroke="#31556c" stroke-width="2"/><rect x="225" y="280" width="515" height="72" rx="10" fill="#faf3df" stroke="#386078" stroke-width="2"/><text x="245" y="321" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16384e">Só há consolidação com evidência individual.</text><text x="40" y="393" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#16384e">Gerar material não conta como tentativa, acerto ou estudo.</text></svg>