<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Da métrica à conclusão</title><desc id="desc">Fluxo mostra dados versionados, população elegível, cálculo, guarda, relatório e decisão. Uma falha de guarda impede promoção mesmo com média melhor.</desc>
<rect width="960" height="420" fill="#fcfdfd"/>
<text x="35" y="48" fill="#143047" font-family="Arial, sans-serif" font-size="25" font-weight="bold">Da métrica à conclusão</text>
<rect x="30" y="92" width="258" height="88" rx="10" fill="#e7f0f5" stroke="#386078" stroke-width="2"/><text x="46" y="127" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">1. Dados e versão</text><text x="46" y="155" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#16384e">Origem e horizonte</text><rect x="345" y="92" width="258" height="88" rx="10" fill="#e7f0f5" stroke="#386078" stroke-width="2"/><text x="365" y="127" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">2. Elegibilidade</text><text x="365" y="155" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#16384e">Pendentes não são zero</text><rect x="660" y="92" width="264" height="88" rx="10" fill="#e7f0f5" stroke="#386078" stroke-width="2"/><text x="677" y="127" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#16384e">3. Métrica e guarda</text><text x="677" y="155" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#16384e">Média não basta</text><line x1="288" y1="135" x2="344" y2="135" stroke="#31556c" stroke-width="2"/><line x1="603" y1="135" x2="659" y2="135" stroke="#31556c" stroke-width="2"/><rect x="170" y="252" width="260" height="91" rx="10" fill="#f9f3df" stroke="#386078" stroke-width="2"/><text x="190" y="288" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#16384e">4. Limites relatados</text><text x="190" y="317" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#16384e">Unidade, n e corte</text><rect x="530" y="252" width="260" height="91" rx="10" fill="#dcebe2" stroke="#386078" stroke-width="2"/><text x="550" y="288" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#16384e">5. Decisão auditável</text><text x="550" y="317" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#16384e">Sem promoção automática</text><line x1="790" y1="180" x2="790" y2="226" stroke="#31556c" stroke-width="2"/><line x1="790" y1="226" x2="659" y2="252" stroke="#31556c" stroke-width="2"/><line x1="530" y1="297" x2="430" y2="297" stroke="#31556c" stroke-width="2"/><text x="320" y="394" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#16384e">A cadeia precisa de evidências, não apenas números.</text></svg>