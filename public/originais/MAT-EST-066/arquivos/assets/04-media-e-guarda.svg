<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Média e guarda respondem perguntas diferentes</title><desc id="desc">Histórico: C tem MAE 8,36 contra 17,60 em B, mas sua piora local em t19 é 19,2 unidades contra limite 10. Não promover C no protocolo antigo.</desc>
<rect width="960" height="420" fill="#fcfdfd"/>
<text x="35" y="48" fill="#143047" font-family="Arial, sans-serif" font-size="25" font-weight="bold">Média e guarda respondem perguntas diferentes</text>
<text x="55" y="118" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16384e">MAE médio nos cinco pares (unidades)</text><rect x="56" y="145" width="440" height="43" rx="10" fill="#aecedc" stroke="#386078" stroke-width="2"/><text x="65" y="175" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#16384e">B = 17,60</text><rect x="56" y="208" width="209" height="43" rx="10" fill="#c5dfca" stroke="#386078" stroke-width="2"/><text x="65" y="239" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#16384e">C = 8,36</text><text x="555" y="125" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#16384e">Guarda de piora local (unidades)</text><line x1="563" y1="168" x2="889" y2="168" stroke="#31556c" stroke-width="2"/><line x1="563" y1="168" x2="563" y2="280" stroke="#31556c" stroke-width="2"/><rect x="563" y="190" width="158" height="45" rx="10" fill="#bdd8c7" stroke="#386078" stroke-width="2"/><text x="572" y="219" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#16384e">Limite: 10</text><rect x="563" y="249" width="304" height="47" rx="10" fill="#eed7ce" stroke="#386078" stroke-width="2"/><text x="572" y="279" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#16384e">t19: 19,2 &gt; 10</text><text x="53" y="363" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#16384e">Resultado: média favorável não apaga a condição impeditiva.</text></svg>